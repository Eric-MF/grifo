    caso: "José Alves foi preso em flagrante por embriaguez ao volante depois de ser obrigado pelos policiais a soprar o bafômetro. No auto de prisão, foi impedido de falar com advogado e família, e, dois dias depois, o delegado ainda não tinha comunicado a prisão ao juiz nem à Defensoria. A família procura você para buscar a liberdade dele, com a peça exclusiva de advogado."
