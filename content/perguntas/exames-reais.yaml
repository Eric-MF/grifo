# Gerado por scripts/gerar-perguntas-exames.ts: "Peça e fundamento" de cada exame. O caso é o enunciado da peça
# resumido à mão (até 700 caracteres: só o momento do processo e o fato que decide a peça e o fundamento); o enunciado
# inteiro está na prova. As revisadas são preservadas quando o script roda de novo.
perguntas:
  - id: exame-01-peca
    caso: "Fátima responde a ação penal por aborto. Na audiência de instrução, o juiz, com a anuência das partes, substituiu os debates orais por manifestação escrita, em prazo sucessivo de cinco dias. O Ministério Público já pediu a condenação, e a defesa teve vista dos autos."
    comando: Qual a peça cabível e o seu fundamento legal?
    peca: memoriais
    fundamentos:
      - art. 403, § 3º, CPP
    explicacao: "Padrão de respostas do I Exame: Fundamento: substituição dos debates orais por memoriais, por analogia ao art. 403, § 3º, do CPP, com anuência das partes."
    fonte: I Exame
    distratores:
      - apelacao
      - resposta-acusacao
      - rese
      - agravo-execucao
      - contrarrazoes-apelacao
    revisao:
      status: revisado
  - id: exame-04-peca
    caso: "Tício foi condenado pela 1ª Vara Criminal a oito anos e seis meses de reclusão, em regime fechado, por roubo com emprego de arma de fogo. A condenação se apoiou no reconhecimento feito apenas no inquérito, sem as formalidades legais, e a arma nunca foi apreendida nem periciada. Você, advogado(a) de Tício, foi intimado(a) da sentença."
    comando: Qual a peça cabível e o seu fundamento legal?
    peca: apelacao
    fundamentos:
      - art. 593, I, CPP
    explicacao: "Padrão de respostas do IV Exame: Prazo e dispositivos legais que dão ensejo à apelação, na petição de interposição: art. 593, I, do CPP."
    fonte: IV Exame
    distratores:
      - memoriais
      - resposta-acusacao
      - rese
      - agravo-execucao
      - contrarrazoes-apelacao
    revisao:
      status: revisado
