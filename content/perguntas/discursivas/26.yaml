  - id: 26-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Insatisfeito com a atividade do tráfico em determinado condomínio de residências, em especial em razão da venda de drogas de relevante valor, o juiz da comarca autorizou, após requerimento do Ministério Público, a realização de busca e apreensão em todas as centenas de residências do condomínio, sem indicar o endereço de cada uma delas, apesar de estas serem separadas e identificadas, sob o argumento da existência de informações de que, no interior desse condomínio, haveria comercialização de drogas e que alguns dos moradores estariam envolvidos na conduta.

      Com base nesse mandado, a Polícia Civil ingressou na residência de Gabriel, 22 anos, sendo apreendidos, no interior de seu imóvel, 15 g de maconha, que, de acordo com Gabriel, seriam destinados a uso próprio. Após denúncia pela prática do crime do Art. 28 da Lei nº 11.343/06, em razão de anterior condenação definitiva pela prática do mesmo delito, o que impossibilitaria a aplicação de institutos despenalizadores, foi aplicada a Gabriel a sanção de cumprimento de 10 meses de prestação de serviços à comunidade.

      Intimado da condenação e insatisfeito, Gabriel procura um advogado para consulta técnica, esclarecendo não ter interesse em cumprir a medida aplicada de prestação de serviços à comunidade.

      Considerando apenas as informações narradas, na condição de advogado de Gabriel, esclareça os itens a seguir.
    comando: Qual o argumento de direito processual a ser apresentado em sede de recurso para questionar a apreensão das drogas na residência de Gabriel? Justifique.
    gabarito: O argumento de direito processual a ser apresentado em sede de recurso é que o mandado de busca e apreensão que justificou a realização de diligência na residência de Gabriel é inválido, tendo em vista que genérico. O mandado de busca e apreensão em determinada residência, por ser uma restrição aos direitos fundamentais da inviolabilidade de domicílio, trazido pelo Art. 5º, inciso XI, da CRFB/88, e privacidade deve ser determinado e amparado em fundadas razões no envolvimento com ilícito. No caso, o mandado foi genérico, sem indicar o endereço exato onde deveria ser cumprido o mesmo, apesar de as residências do condomínio serem separadas e identificadas. Por essas mesmas razões, houve violação, ainda, da previsão do Art. 243, inciso I, do CPP, que diz que no mandado deve ser indicada o mais precisamente possível a casa onde será realizada a diligência.
    opcoes:
      correta: O argumento é que o mandado de busca e apreensão não era válido, tendo em vista que genérico OU que foi expedido mandado de busca e apreensão sem indicação de um endereço específico onde a diligência deveria ser realizada, desrespeitando o Art. 243, inciso I, do CPP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 26-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Insatisfeito com a atividade do tráfico em determinado condomínio de residências, em especial em razão da venda de drogas de relevante valor, o juiz da comarca autorizou, após requerimento do Ministério Público, a realização de busca e apreensão em todas as centenas de residências do condomínio, sem indicar o endereço de cada uma delas, apesar de estas serem separadas e identificadas, sob o argumento da existência de informações de que, no interior desse condomínio, haveria comercialização de drogas e que alguns dos moradores estariam envolvidos na conduta.

      Com base nesse mandado, a Polícia Civil ingressou na residência de Gabriel, 22 anos, sendo apreendidos, no interior de seu imóvel, 15 g de maconha, que, de acordo com Gabriel, seriam destinados a uso próprio. Após denúncia pela prática do crime do Art. 28 da Lei nº 11.343/06, em razão de anterior condenação definitiva pela prática do mesmo delito, o que impossibilitaria a aplicação de institutos despenalizadores, foi aplicada a Gabriel a sanção de cumprimento de 10 meses de prestação de serviços à comunidade.

      Intimado da condenação e insatisfeito, Gabriel procura um advogado para consulta técnica, esclarecendo não ter interesse em cumprir a medida aplicada de prestação de serviços à comunidade.

      Considerando apenas as informações narradas, na condição de advogado de Gabriel, esclareça os itens a seguir.
    comando: Em caso de descumprimento, por Gabriel, da medida de prestação de serviços à comunidade imposta na sentença condenatória pela prática do crime do Art. 28 da Lei nº 11.343/06, poderá esta ser convertida em pena privativa de liberdade? Justifique.
    gabarito: Ainda que diante do descumprimento da medida de prestação de serviços à comunidade, não poderia ser convertida esta em pena privativa de liberdade. Desde a Lei nº 11.343/06, o crime de posse de material entorpecente para consumo próprio deixou de ser punido com pena privativa de liberdade, apesar de prevalecer o entendimento de que a conduta não deixou de ser considerada crime. De acordo com o Art. 28, inciso II, da Lei nº 11.343/06, uma das sanções que pode ser imposta em caso de condenação é a prestação de serviços à comunidade, podendo esta ser fixada pelo prazo de 10 meses em razão da reincidência. Em que pese a prestação de serviços à comunidade ser pena restritiva de direitos de acordo com o Código Penal, o que, em tese, admitiria a conversão em pena privativa de liberdade diante de descumprimento, o tratamento trazido pela Lei nº 11.343/06 é peculiar. Estabelece o Art. 28, § 6º, da Lei nº 11.343/06 que, em caso de descumprimento da medida imposta em sentença, em busca de sua execução, pode ser aplicada multa ou admoestação verbal, permanecendo, porém, a vedação na imposição de sanção penal privativa de liberdade, tendo em vista que a prestação de serviços à comunidade não foi aplicada como pena substitutiva da privativa de liberdade como ocorre no Código Penal.
    opcoes:
      correta: A medida de prestação de serviços à comunidade não poderá ser substituída por privativa de liberdade, tendo em vista que o crime do Art. 28 da Lei 11.343/06 não admite aplicação de pena privativa de liberdade OU tendo em vista que a Lei nº 11.343/06 somente admite, em caso de descumprimento, aplicação de admoestação verbal ou multa, nos termos do Art. 28, § 6º, da Lei nº 11.343/06.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 26-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Arthur, Adriano e Junior, insatisfeitos com a derrota do seu time de futebol, saíram à rua, após a partida, fazendo algazarra na companhia de Roberto, que não gostava de futebol. Durante o ato, depararam com Pedro, que vestia a camisa do time rival; simplesmente por isso, Arthur, Adriano e Junior passaram a agredi-lo, tendo ficado Roberto à distância por não concordar com o ato e não ter intenção de conferir cobertura aos colegas.

      Em razão dos atos de agressão, o celular de Pedro veio a cair no chão, momento em que Roberto, aproveitando-se da situação, subtraiu o bem e empreendeu fuga. Com a chegada de policiais, Arthur, Adriano e Junior empreenderam fuga, mas Roberto veio a ser localizado pouco tempo depois na posse do bem subtraído e de seu próprio celular.

      Diante das lesões causadas na vítima, Roberto foi denunciado pela prática do crime de roubo majorado pelo concurso de agentes e teve sua prisão em flagrante convertida em preventiva. Na instrução, as testemunhas confirmaram integralmente os fatos, assim como Roberto reiterou o acima narrado. A família de Roberto, então, procura você para, na condição de advogado(a), adotar as medidas cabíveis, antes da sentença, apresentando nota fiscal da compra do celular de Roberto.

      Considerando apenas as informações narradas, responda, na condição de advogado(a) de Roberto, aos itens a seguir.
    comando: Existe requerimento a ser formulado pela defesa para reaver, de imediato, o celular de Roberto? Justifique.
    gabarito: A defesa de Roberto poderia buscar a restituição do bem apreendido, tendo em vista que o mesmo não tem qualquer relação com o fato, logo não interessa ao processo (Art. 118 do CPP). Ademais, há nota fiscal a demonstrar a propriedade do bem, logo o pedido de restituição poderia ser formulado diretamente nos autos aos magistrado, já que não há controvérsia sobre o propriedade do bem (Art. 120 do CPP). Da mesma forma, o celular de Roberto não é produto e nem instrumento do crime, não havendo qualquer vedação em sua restituição (Art. 119 do CPP).
    opcoes:
      correta: Sim, o requerimento a ser formulado é de restituição do celular apreendido, tendo em vista que não mais interessa ao processo, nos termos do Art. 118 do CPP OU Art. 119 do CPP OU Art. 120 do CPP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
