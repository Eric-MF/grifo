  - id: 26-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Arthur, Adriano e Junior, insatisfeitos com a derrota do seu time de futebol, saíram à rua, após a partida, fazendo algazarra na companhia de Roberto, que não gostava de futebol. Durante o ato, depararam com Pedro, que vestia a camisa do time rival; simplesmente por isso, Arthur, Adriano e Junior passaram a agredi-lo, tendo ficado Roberto à distância por não concordar com o ato e não ter intenção de conferir cobertura aos colegas.

      Em razão dos atos de agressão, o celular de Pedro veio a cair no chão, momento em que Roberto, aproveitando-se da situação, subtraiu o bem e empreendeu fuga. Com a chegada de policiais, Arthur, Adriano e Junior empreenderam fuga, mas Roberto veio a ser localizado pouco tempo depois na posse do bem subtraído e de seu próprio celular.

      Diante das lesões causadas na vítima, Roberto foi denunciado pela prática do crime de roubo majorado pelo concurso de agentes e teve sua prisão em flagrante convertida em preventiva. Na instrução, as testemunhas confirmaram integralmente os fatos, assim como Roberto reiterou o acima narrado. A família de Roberto, então, procura você para, na condição de advogado(a), adotar as medidas cabíveis, antes da sentença, apresentando nota fiscal da compra do celular de Roberto.

      Considerando apenas as informações narradas, responda, na condição de advogado(a) de Roberto, aos itens a seguir.
    comando: Confessados por Roberto os fatos acima narrados, existe argumento de direito material a ser apresentado em busca da não condenação pelo crime imputado? Justifique.
    gabarito: Ainda que confessados os fatos, existe argumento de direito material para buscar evitar a condenação do crime de roubo. Em que pese Pedro tenha sido vítima de violência e, também, tenha tido seu celular subtraído, não há que se falar em crime de roubo por parte de Roberto. Isso porque a violência empregada não foi com o objetivo de subtrair coisa alheia móvel, como exige o Art. 157 do Código Penal. Pelo contrário, Arthur, Adriano e Junior queriam praticar crime de lesão corporal. Por sua vez, Roberto subtraiu o celular que caiu do bolso de Pedro, não se utilizando, porém, de grave ameaça ou violência para subtrair a coisa. Tanto é assim que Roberto não tinha vínculo com os agentes quando da prática dos atos de violência, apenas se aproveitando da facilidade na subtração gerada pela situação. Logo, deve ser afastada a prática delitiva do crime de roubo majorado, ainda que reste a possibilidade de desclassificação e condenação pelo crime de furto.
    opcoes:
      correta: Sim, existe argumento a ser apresentado para afastar a condenação do crime de roubo, tendo em vista que o agente não empregou violência ou grave ameaça à pessoa para a subtração da coisa, valendo-se apenas da facilidade da situação para subtrair coisa alheia móvel e praticar crime de furto.
