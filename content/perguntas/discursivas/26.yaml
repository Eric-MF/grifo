      Considerando as informações narradas, na condição de advogado(a) de Renata, responda aos itens a seguir.
    comando: Qual o argumento para combater o mérito da decisão do magistrado de rejeição da denúncia? Justifique.
    gabarito: |-
      O argumento para combater a decisão do magistrado é o de que a contagem do prazo decadencial somente se inicia na data do conhecimento da autoria do crime e não necessariamente na data dos fatos. Em sendo crime de ação penal privada, o dano está sujeito ao prazo decadencial de 06 meses previsto no Art. 38 do CPP. Ocorre que este dispositivo estabelece que tal prazo somente se iniciará no dia em que o ofendido vier a saber quem é o autor do crime e não da data dos fatos. Na situação apresentada, Renata somente tomou conhecimento da autoria em 23 de outubro de 2017, de modo que nesse dia o prazo se iniciou, e não em 20 de julho de 2017.

      Dessa forma, não há que se falar em decadência.
    opcoes:
      correta: O argumento é o de que o início da contagem do prazo decadencial somente ocorreu em 23/10/2017 OU no dia em que o ofendido teve conhecimento sobre a autoria, logo não havia se encerrado quando do oferecimento da queixa-crime, nos termos do Art. 38 do CPP OU Art. 103 do CP.
