# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "26"
introducoes:
  peca: "Lauro, obcecado por Maria, decidiu obrigá-la a ter relações sexuais com ele. Comprou e registrou uma arma, alugou um quarto de hotel, comprou uma mordaça e contou tudo ao amigo José, que avisou a polícia. Lauro foi preso em flagrante quando saía de casa, de carro, para encontrar Maria. Ela disse ter 17 anos, mas nunca apresentou papel com a data de nascimento. Lauro, sem antecedentes, foi denunciado por estupro qualificado tentado, com a agravante da violência contra a mulher. Na primeira audiência, ele não estava presente porque não foi intimado, e a defesa protestou; na segunda, admitiu os fatos. O Ministério Público pediu a condenação, e a defesa foi intimada para a manifestação cabível."
  q1: "A pedido do Ministério Público, o juiz autorizou a busca e apreensão em todas as centenas de casas de um condomínio, sem indicar endereços, embora as casas fossem separadas e identificadas. Na casa de Gabriel, a polícia achou 15 g de maconha, que ele disse serem para uso próprio. Por já ter uma condenação definitiva pelo mesmo crime, Gabriel foi condenado pelo porte para uso próprio a 10 meses de prestação de serviços à comunidade e diz que não pretende cumpri-la."
  q2: "Arthur, Adriano e Junior, depois da derrota do seu time, agrediram Pedro, que vestia a camisa do time rival. Roberto, que estava com eles, ficou à distância, sem concordar com a agressão nem querer dar cobertura. Quando o celular de Pedro caiu no chão, Roberto o pegou e fugiu. Foi preso pouco depois com o celular de Pedro e o seu próprio e denunciado por roubo majorado pelo concurso de agentes. As testemunhas confirmaram os fatos, e a família tem a nota fiscal do celular de Roberto."
  q3: "Breno incentivou o amigo Flávio, de luto pela namorada, a se matar. Flávio pulou do 4º andar, caiu num canteiro e teve só arranhões leves no braço. Breno foi denunciado por instigação ao suicídio na forma consumada, e o juiz da vara única mandou seguir o procedimento comum ordinário."
  q4: "Larissa quebrou o vidro do carro de Renata em 20/7/2017. Renata pediu inquérito, e só em 23/10/2017 se descobriu que Larissa tinha feito aquilo; Renata soube no mesmo dia. A queixa-crime por dano foi oferecida no Juizado Especial Criminal em 28/2/2018, e o juiz a rejeitou, dizendo que tinha havido decadência."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["26-peca-1", "26-peca-3", "26-peca-5", "26-peca-13", "26-peca-14-1", "26-peca-14-2", "26-peca-14-3", "26-peca-14-4", "26-peca-14-5", "26-q3-b"]
perguntas:
  - id: 26-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: merito
    pergunta: "Que preliminar a defesa deve levantar quanto à primeira audiência?"
    tese: "Nulidade da audiência por cerceamento de defesa: Lauro não foi intimado para a instrução"
    aceitos: [ "nulidade | nula | nulo | anula* | cerceamento | ampla defesa" ]
    artigos: [ "art. 5, LV, CRFB", "art. 564, IV, CPP" ]
    gabarito: "A nulidade decorre da ausência de intimação do réu para realização da audiência de instrução e julgamento, o que representa cerceamento de defesa OU configurando violação ao princípio da ampla defesa, nos termos do Art. 5º, LV, CRFB/88 OU Art. 564, IV, do CPP."
    revisao: { status: revisado }
  - id: 26-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Que tese de mérito leva à absolvição de Lauro quanto ao estupro tentado?"
    tese: "Atos preparatórios não são puníveis: a execução do estupro nem começou"
    aceitos: [ "preparatori* | nao iniciou a execucao | nao houve inicio da execucao | nao se iniciou a execucao | sem inicio da execucao | nao houve atos executorios | nao comecou | nem comecou" ]
    artigos: [ "art. 14, II, CP" ]
    gabarito: "Não foram iniciados atos executórios do crime de estupro, sendo certo que os atos preparatórios são impuníveis."
    revisao: { status: revisado }
  - id: 26-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Maria disse ter 17 anos, mas não provou a idade. Que efeito isso tem na imputação?"
    tese: "Afastamento da qualificadora: não há prova da idade de Maria, que exige documento"
    aceitos: [ "qualificadora", "afast* | exclu* | decote | nao incid* | nao ha prova | sem prova | nao provada | nao comprovada" ]
    artigos: [ "art. 213, § 1º, CP", "art. 155, parágrafo único, CPP" ]
    gabarito: "Subsidiariamente, afastar a qualificadora pois não há prova nos autos da idade da vítima, nos termos do Art. 213, §1º do CP"
    revisao: { status: revisado }
  - id: 26-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Na primeira fase da dosimetria, o que a defesa deve pedir?"
    tese: "Pena-base no mínimo, porque as circunstâncias judiciais são favoráveis"
    aceitos: [ "minimo" ]
    artigos: [ "art. 59, CP" ]
    gabarito: "Aplicação da pena base no mínimo legal, já que as circunstâncias do Art. 59 do CP são favoráveis."
    revisao: { status: revisado }
  - id: 26-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Por que a agravante da violência contra a mulher não se aplica a Lauro?"
    tese: "Afastamento da agravante: não houve violência doméstica, familiar nem coabitação"
    aceitos: [ "domestic* | familiar | coabitacao" ]
    artigos: [ "art. 61, II, f, CP", "art. 5, Lei 11.340" ]
    gabarito: "Afastamento da agravante do Art. 61, inciso II, alínea ´f´, do CP, pois o crime não foi praticado em situação de violência doméstica, familiar ou de coabitação contra mulher."
    revisao: { status: revisado }
  - id: 26-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Lauro admitiu os fatos na segunda audiência. Que atenuante a defesa deve pedir?"
    tese: "Atenuante da confissão espontânea"
    aceitos: [ "confissao espontanea | confissao" ]
    artigos: [ "art. 65, III, d, CP" ]
    gabarito: "Reconhecimento da atenuante da confissão espontânea, nos termos do Art. 65, III, ´d´, CP."
    revisao: { status: revisado }
  - id: 26-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Se mantida a condenação pela tentativa, que fração de redução a defesa deve pedir?"
    tese: "Redução máxima da tentativa, de 2/3, porque o crime ficou longe da consumação"
    aceitos: [ "2/3 | dois tercos | maxim*" ]
    artigos: [ "art. 14, parágrafo único, CP" ]
    gabarito: "Aplicação do quantum máximo de redução de pena em razão da tentativa, tendo em vista que o crime ficou longe da consumação OU tendo em vista que o critério a ser observado é do iter criminis percorrido."
    revisao: { status: revisado }
  - id: 26-peca-12
    categoria: peca-detalhe
    parte: peca
    item: "12"
    secao: merito
    pergunta: "Com a pena reduzida, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto ou semiaberto"
    aceitos: [ "aberto | semiaberto | semi-aberto | semi aberto" ]
    artigos: [ "art. 33, § 2º, c, CP", "art. 33, § 2º, b, CP" ]
    gabarito: "Aplicação do regime aberto ou semiaberto, considerando a pena mínima a ser aplicada, nos termos do Art. 33, §2º, alíneas b ou c, do CP OU Aplicação da suspensão condicional da pena, nos termos do Art. 77 do CP"
    revisao: { status: revisado }
  - id: 26-peca-14
    categoria: peca-detalhe
    parte: peca
    item: "14"
    secao: pedido
    pergunta: "Qual é o pedido principal da defesa?"
    tese: "Absolvição de Lauro, porque o fato não constitui crime"
    aceitos: [ "absolvi* | absolver" ]
    artigos: [ "art. 386, III, CPP" ]
    gabarito: "Absolvição de Lauro, nos termos do Art. 386, inciso III, do CPP."
    revisao: { status: revisado }
  - id: 26-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento processual a defesa pode usar contra a apreensão da droga?"
    tese: "Nulidade do mandado de busca e apreensão genérico, que não indicou a casa em que seria cumprido"
    aceitos: [ "generico | sem endereco | sem indicacao do endereco | sem indicar o endereco | nao indicou o endereco | nao indicou a casa | indeterminado | nao especific* | sem especific* | coletivo" ]
    artigos: [ "art. 243, I, CPP" ]
    gabarito: "O argumento de direito processual a ser apresentado em sede de recurso é que o mandado de busca e apreensão que justificou a realização de diligência na residência de Gabriel é inválido, tendo em vista que genérico. O mandado de busca e apreensão em determinada residência, por ser uma restrição aos direitos fundamentais da inviolabilidade de domicílio, trazido pelo Art. 5º, inciso XI, da CRFB/88, e privacidade deve ser determinado e amparado em fundadas razões no envolvimento com ilícito. No caso, o mandado foi genérico, sem indicar o endereço exato onde deveria ser cumprido o mesmo, apesar de as residências do condomínio serem separadas e identificadas. Por essas mesmas razões, houve violação, ainda, da previsão do Art. 243, inciso I, do CPP, que diz que no mandado deve ser indicada o mais precisamente possível a casa onde será realizada a diligência."
    revisao: { status: revisado }
  - id: 26-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Se Gabriel descumprir a prestação de serviços, ela pode ser convertida em pena privativa de liberdade?"
    tese: "No porte para uso próprio, o descumprimento das medidas só permite admoestação verbal e multa, nunca prisão"
    aceitos: [ "admoestacao | multa | nao admite pena privativa | nao admite prisao | nao cabe prisao | nao pode ser convertida" ]
    artigos: [ "art. 28, § 6º, Lei 11.343" ]
    gabarito: "Ainda que diante do descumprimento da medida de prestação de serviços à comunidade, não poderia ser convertida esta em pena privativa de liberdade. Desde a Lei nº 11.343/06, o crime de posse de material entorpecente para consumo próprio deixou de ser punido com pena privativa de liberdade, apesar de prevalecer o entendimento de que a conduta não deixou de ser considerada crime. De acordo com o Art. 28, inciso II, da Lei nº 11.343/06, uma das sanções que pode ser imposta em caso de condenação é a prestação de serviços à comunidade, podendo esta ser fixada pelo prazo de 10 meses em razão da reincidência. Em que pese a prestação de serviços à comunidade ser pena restritiva de direitos de acordo com o Código Penal, o que, em tese, admitiria a conversão em pena privativa de liberdade diante de descumprimento, o tratamento trazido pela Lei nº 11.343/06 é peculiar. Estabelece o Art. 28, § 6º, da Lei nº 11.343/06 que, em caso de descumprimento da medida imposta em sentença, em busca de sua execução, pode ser aplicada multa ou admoestação verbal, permanecendo, porém, a vedação na imposição de sanção penal privativa de liberdade, tendo em vista que a prestação de serviços à comunidade não foi aplicada como pena substitutiva da privativa de liberdade como ocorre no Código Penal."
    revisao: { status: revisado }
  - id: 26-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que requerimento a defesa pode fazer para reaver, já, o celular de Roberto?"
    tese: "Restituição do celular apreendido, que não interessa ao processo"
    aceitos: [ "restitui*" ]
    artigos: [ "art. 118, CPP", "art. 120, CPP", "art. 119, CPP" ]
    gabarito: "A defesa de Roberto poderia buscar a restituição do bem apreendido, tendo em vista que o mesmo não tem qualquer relação com o fato, logo não interessa ao processo (Art. 118 do CPP). Ademais, há nota fiscal a demonstrar a propriedade do bem, logo o pedido de restituição poderia ser formulado diretamente nos autos aos magistrado, já que não há controvérsia sobre o propriedade do bem (Art. 120 do CPP). Da mesma forma, o celular de Roberto não é produto e nem instrumento do crime, não havendo qualquer vedação em sua restituição (Art. 119 do CPP)."
    revisao: { status: revisado }
  - id: 26-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que argumento de direito material afasta a condenação de Roberto por roubo?"
    tese: "Desclassificação para furto: Roberto não usou violência nem grave ameaça, só aproveitou a situação para subtrair o celular"
    aceitos: [ "furto" ]
    artigos: [ "art. 155, CP" ]
    gabarito: "Ainda que confessados os fatos, existe argumento de direito material para buscar evitar a condenação do crime de roubo. Em que pese Pedro tenha sido vítima de violência e, também, tenha tido seu celular subtraído, não há que se falar em crime de roubo por parte de Roberto. Isso porque a violência empregada não foi com o objetivo de subtrair coisa alheia móvel, como exige o Art. 157 do Código Penal. Pelo contrário, Arthur, Adriano e Junior queriam praticar crime de lesão corporal. Por sua vez, Roberto subtraiu o celular que caiu do bolso de Pedro, não se utilizando, porém, de grave ameaça ou violência para subtrair a coisa. Tanto é assim que Roberto não tinha vínculo com os agentes quando da prática dos atos de violência, apenas se aproveitando da facilidade na subtração gerada pela situação. Logo, deve ser afastada a prática delitiva do crime de roubo majorado, ainda que reste a possibilidade de desclassificação e condenação pelo crime de furto."
    revisao: { status: revisado }
  - id: 26-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "O procedimento adotado pelo juiz foi o correto?"
    tese: "Procedimento do Tribunal do Júri: o crime é doloso contra a vida"
    aceitos: [ "juri | dolosos contra a vida | doloso contra a vida" ]
    artigos: [ "art. 5, XXXVIII, d, CRFB", "art. 74, § 1º, CPP", "art. 394, § 3º, CPP" ]
    gabarito: "O procedimento observado durante a ação penal em desfavor de Breno não foi adequado, tendo em vista que consta do enunciado que foi observado o procedimento comum ordinário. Ocorre que, conforme já destacado, o crime previsto no Art. 122 do CP é crime doloso contra a vida, logo de competência do Tribunal do Júri, devendo ser observado o procedimento especial previsto nos Artigos 406 e seguintes do CPP. Aplica-se, ao caso, o Art. 394, § 3º, do CPP e não o Art. 394, § 1º, do mesmo diploma legal."
    revisao: { status: revisado }
  - id: 26-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que recurso cabe contra a rejeição da queixa no Juizado Especial Criminal, e em que prazo?"
    tese: "Apelação contra a rejeição da queixa no Juizado, no prazo de 10 dias"
    aceitos: [ "apelacao" ]
    artigos: [ "art. 82, Lei 9.099", "art. 82, § 1º, Lei 9.099" ]
    gabarito: "O recurso cabível da decisão de rejeição da queixa-crime é o recurso de apelação, com prazo de 10 dias, conforme previsão do Art. 82 da Lei nº 9.099/95. O advogado de Renata apresentou queixa-crime em face de Larissa pela prática do crime de dano simples, delito esse de menor potencial ofensivo, logo aplicáveis as previsões da Lei nº 9.099/95. Da decisão de rejeição da denúncia ou queixa, como regra, caberá recurso em sentido estrito, no prazo de 05 dias, conforme o Art. 581, inciso I, do CPP. Todavia, o procedimento sumaríssimo dos Juizados Especiais Criminais prevê peculiaridades que o afasta do procedimento comum ordinário do CPP. De acordo com o Art. 82 da Lei nº 9.099/95, da sentença e da decisão de rejeição de denúncia ou queixa caberá recurso de apelação, sempre com o prazo de 10 dias."
    revisao: { status: revisado }
  - id: 26-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que argumento combate a decisão que rejeitou a queixa?"
    tese: "O prazo de decadência conta de quando a vítima soube da autoria (23/10/2017) e ainda não tinha terminado"
    aceitos: [ "autoria | quem era o autor | quem e o autor | quem foi o autor | quem era a autora | quem e a autora | quem foi a autora" ]
    artigos: [ "art. 38, CPP", "art. 103, CP" ]
    gabarito: "O argumento para combater a decisão do magistrado é o de que a contagem do prazo decadencial somente se inicia na data do conhecimento da autoria do crime e não necessariamente na data dos fatos. Em sendo crime de ação penal privada, o dano está sujeito ao prazo decadencial de 06 meses previsto no Art. 38 do CPP. Ocorre que este dispositivo estabelece que tal prazo somente se iniciará no dia em que o ofendido vier a saber quem é o autor do crime e não da data dos fatos. Na situação apresentada, Renata somente tomou conhecimento da autoria em 23 de outubro de 2017, de modo que nesse dia o prazo se iniciou, e não em 20 de julho de 2017.\n\nDessa forma, não há que se falar em decadência."
    revisao: { status: revisado }
