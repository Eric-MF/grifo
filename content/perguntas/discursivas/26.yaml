      A família de Breno procura você para, na condição de advogado(a), prestar os esclarecimentos a seguir.
    comando: Qual o argumento a ser apresentado pela defesa técnica para questionar a capitulação delitiva realizada pelo Ministério Público? Justifique.
    gabarito: Para questionar a capitulação delitiva realizada pelo Ministério Público, a defesa deveria argumentar que a conduta de Breno não é punível. Isso porque o Art. 122 do CP somente prevê a punição no caso de o resultado morte se consumar ou se forem causadas lesões graves. Caso sejam causadas apenas lesões de natureza leve, ainda que tenha havido instigação ao suicídio, a conduta não será punível por opção do legislador, sequer havendo que se falar em tentativa na hipótese.
    opcoes:
      correta: O argumento é de atipicidade da conduta OU que a conduta não é punível, tendo em vista que o Código Penal somente pune a instigação ao suicídio que gere resultado morte ou lesões corporais graves.
