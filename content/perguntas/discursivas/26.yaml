  - id: 26-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Larissa, revoltada com o comportamento de Renata, ex-namorada de seu companheiro, foi, em 20 de julho de 2017, até a rua em que esta reside. Verificando que o automóvel de Renata estava em via pública, Larissa quebra o vidro dianteiro do veículo, exatamente com a intenção de deteriorar coisa alheia.

      Na manhã seguinte, Renata constatou o dano causado ao seu carro, mas não identificou, em um primeiro momento, quem seria o autor do crime. Solicitou, então, a instauração de inquérito policial, em 25 de julho de 2017. Após diligências, foi identificado, em 23 de outubro de 2017, que Larissa seria a autora do fato e que o prejuízo era de R$ 150,00, tendo sido a informação imediatamente passada à vítima Renata.

      Com viagem marcada, Renata somente procurou seu advogado em 21 de fevereiro de 2018, informando sobre o interesse em apresentar queixa-crime em face da autora dos fatos. Assim, o advogado de Renata apresentou queixa-crime em face de Larissa, imputando o crime do Art. 163, caput, do Código Penal, em 28 de fevereiro de 2018, perante o Juizado Especial Criminal competente, tendo sido proferida decisão pelo magistrado de rejeição da queixa, em razão da decadência, em 07/03/2018. A defesa técnica é intimada da decisão.

      Considerando as informações narradas, na condição de advogado(a) de Renata, responda aos itens a seguir.
    comando: Qual o recurso cabível da decisão de rejeição da queixa-crime apresentada por Renata? Indique o fundamento legal e o prazo de interposição.
    gabarito: O recurso cabível da decisão de rejeição da queixa-crime é o recurso de apelação, com prazo de 10 dias, conforme previsão do Art. 82 da Lei nº 9.099/95. O advogado de Renata apresentou queixa-crime em face de Larissa pela prática do crime de dano simples, delito esse de menor potencial ofensivo, logo aplicáveis as previsões da Lei nº 9.099/95. Da decisão de rejeição da denúncia ou queixa, como regra, caberá recurso em sentido estrito, no prazo de 05 dias, conforme o Art. 581, inciso I, do CPP. Todavia, o procedimento sumaríssimo dos Juizados Especiais Criminais prevê peculiaridades que o afasta do procedimento comum ordinário do CPP. De acordo com o Art. 82 da Lei nº 9.099/95, da sentença e da decisão de rejeição de denúncia ou queixa caberá recurso de apelação, sempre com o prazo de 10 dias.
    opcoes:
      correta: Recurso de apelação, no prazo de 10 dias, conforme Art. 82, caput OU §1º, da Lei nº 9.099/95.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
    revisao: *a1
