    gabarito: Aplicação do regime aberto ou semiaberto, considerando a pena mínima a ser aplicada, nos termos do Art. 33, §2º, alíneas b ou c, do CP OU Aplicação da suspensão condicional da pena, nos termos do Art. 77 do CP
    opcoes:
      correta: Aplicação do regime aberto ou semiaberto, considerando a pena mínima a ser aplicada, nos termos do Art. 33, §2º, alíneas b ou c, do CP OU Aplicação da suspensão condicional da pena, nos termos do Art. 77 do CP
