      correta: Aplicação da causa de diminuição do Art. 33, § 4º, da Lei nº 11.343; substituição da pena privativa de liberdade por restritiva de direitos; aplicação de regime inicial aberto.
      erradas:
        - Memoriais endereçados ao Juiz do Tribunal do Júri.
