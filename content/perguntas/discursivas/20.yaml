  - id: 20-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Fausto, ao completar 18 anos de idade, mesmo sem ser habilitado legalmente, resolveu sair com o carro do seu genitor sem o conhecimento do mesmo. No cruzamento de uma avenida de intenso movimento, não tendo atentado para a sinalização existente, veio a atropelar Lídia e suas 05 filhas adolescentes, que estavam na calçada, causando-lhes diversas lesões que acarretaram a morte das seis.

      Denunciado pela prática de seis crimes do Art. 302, § 1º, incisos I e II, da Lei nº 9503/97, foi condenado nos termos do pedido inicial, ficando a pena final acomodada em 04 anos e 06 meses de detenção em regime semiaberto, além de ficar impedido de obter habilitação para dirigir veículo pelo prazo de 02 anos.

      A pena privativa de liberdade não foi substituída por restritivas de direitos sob o fundamento exclusivo de que o seu quantum ultrapassava o limite de 04 anos. No momento da sentença, unicamente com o fundamento de que o acusado, devidamente intimado, deixou de comparecer espontaneamente a última audiência designada, que seria exclusivamente para o seu interrogatório, o juiz decretou a prisão cautelar e não permitiu o apelo em liberdade, por força da revelia.

      Apesar de Fausto estar sendo assistido pela Defensoria Pública, seu genitor o procura, para que você, na condição de advogado(a), preste assistência jurídica.

      Diante da situação narrada, como advogado(a), responda aos seguintes questionamentos formulados pela família de Fausto:
    comando: Mantida a pena aplicada, é possível a substituição da pena privativa de liberdade por restritiva de direitos? Justifique.
    gabarito: Tratando-se de crime culposo, o fato de a pena ter ficado acomodada em mais de 04 anos, por si só, não impede a substituição da pena privativa de liberdade por restritiva de direitos, sendo certo que o encarceramento deve ser deixado para casos especiais, quando se manifestar extremamente necessário.O Art. 44, inciso I, do Código Penal, afirma expressamente que caberá substituição, independente da pena aplicada, se o crime for culposo. No caso, como o fundamento exclusivo do magistrado foi a pena aplicada, é possível afastá-lo e, consequentemente, buscar a substituição em sede de recurso.
    opcoes:
      correta: Sim, é possível a substituição, tendo em vista que os crimes praticados foram culposos, logo é irrelevante a pena final aplicada, nos termos do Art. 44, inciso I, do Código Penal.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 20-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Fausto, ao completar 18 anos de idade, mesmo sem ser habilitado legalmente, resolveu sair com o carro do seu genitor sem o conhecimento do mesmo. No cruzamento de uma avenida de intenso movimento, não tendo atentado para a sinalização existente, veio a atropelar Lídia e suas 05 filhas adolescentes, que estavam na calçada, causando-lhes diversas lesões que acarretaram a morte das seis.

      Denunciado pela prática de seis crimes do Art. 302, § 1º, incisos I e II, da Lei nº 9503/97, foi condenado nos termos do pedido inicial, ficando a pena final acomodada em 04 anos e 06 meses de detenção em regime semiaberto, além de ficar impedido de obter habilitação para dirigir veículo pelo prazo de 02 anos.

      A pena privativa de liberdade não foi substituída por restritivas de direitos sob o fundamento exclusivo de que o seu quantum ultrapassava o limite de 04 anos. No momento da sentença, unicamente com o fundamento de que o acusado, devidamente intimado, deixou de comparecer espontaneamente a última audiência designada, que seria exclusivamente para o seu interrogatório, o juiz decretou a prisão cautelar e não permitiu o apelo em liberdade, por força da revelia.

      Apesar de Fausto estar sendo assistido pela Defensoria Pública, seu genitor o procura, para que você, na condição de advogado(a), preste assistência jurídica.

      Diante da situação narrada, como advogado(a), responda aos seguintes questionamentos formulados pela família de Fausto:
    comando: Em caso de sua contratação para atuar no processo, o que poderá ser alegado para combater, especificamente, o fundamento da decisão que decretou a prisão cautelar?
    gabarito: |-
      O fato de o acusado não ter comparecido ao interrogatório, por si só, não justifica o decreto prisional, devendo ser entendida a sua ausência como extensão do direito ao silêncio. Hoje, o interrogatório é tratado pela doutrina e pela jurisprudência não somente como meio de prova, mas também como meio de defesa. Por sua vez, o direito à ampla defesa inclui a defesa técnica e a autodefesa. No exercício da autodefesa, pode o acusado permanecer em silêncio durante seu interrogatório. Da mesma forma, poderá deixar de comparecer ao ato como extensão desse direito, sendo certo que no caso não haveria qualquer prejuízo para a instrução nesta ausência, já que a audiência seria apenas para interrogatório. A prisão, antes do trânsito em julgado da decisão condenatória, reclama fundamentação concreta da necessidade da medida, não podendo ser aplicada como forma de antecipação de pena.

      A banca examinadora considerou como adequada a alegação do não cabimento da prisão preventiva pelo fato de o crime praticado por Fausto ser culposo, não atendendo, assim, o requisito do art. 313, inc. I, do CPP. A mera alegação, em abstrato, de ausência dos requisitos da prisão preventiva foi considerada insuficiente, bem como a mera citação do dispositivo legal acima destacado.
    opcoes:
      correta: Poderá ser alegado que o não comparecimento para interrogatório é extensão do direito ao silêncio ou está no âmbito do exercício de sua autodefesa/ampla defesa OU que não cabe decretação de prisão preventiva em caso de crime culposo.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
