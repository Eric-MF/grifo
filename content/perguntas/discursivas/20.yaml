  - id: 20-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Lúcio, com residência fixa e proprietário de uma oficina de carros, adquiriu de seu vizinho, pela quantia de R$1.000,00 (mil reais) um aparelho celular, que sabia ser produto de crime pretérito, passando a usá-lo como próprio. Tomando conhecimento dos fatos, um inimigo de Lúcio comunicou o ocorrido ao Ministério Público, que requisitou a instauração de inquérito policial. A autoridade policial instaurou o procedimento, indiciou Lúcio pela prática do crime de receptação qualificada (Art. 180, § 1º, do Código Penal), já que desenvolvia atividade comercial, e, de imediato, representou pela prisão temporária de Lúcio, existindo parecer favorável do Ministério Público. A família de Lúcio o procura para esclarecimentos.

      Na condição de advogado de Lúcio, esclareça os itens a seguir.
    comando: Confirmados os fatos acima narrados, o crime praticado por Lúcio efetivamente foi de receptação qualificada (Art. 180, § 1º, do CP)? Em caso positivo, justifique. Em caso negativo, indique qual seria o delito praticado e justifique.
    gabarito: |-
      O crime praticado por Lúcio foi o de receptação simples e não em sua modalidade qualificada. Prevê o Art. 180, § 1º, do Código Penal, que a pena será de 03 a 08 anos, quando o agente “Adquirir, receber, transportar, conduzir, ocultar, ter em depósito, desmontar, montar, remontar, vender, expor à venda, ou de qualquer forma utilizar, em proveito próprio ou alheio, no exercício de atividade comercial ou industrial, coisa que deve saber ser produto de crime”. A ideia do legislador foi punir mais severamente aquele comerciante que se aproveita de sua profissão para ter um acesso facilitado ou maior facilidade na venda de bens produtos de crimes. Assim, para tipificar a modalidade qualificada, é necessária que a receptação tenha sido praticada pelo agente no exercício de atividade comercial ou industrial. Não basta que o autor seja comerciante. No caso concreto, apesar de comerciante, Lúcio não teve acesso ao celular produto de crime em razão de sua atividade comercial, pois o adquiriu de seu vizinho.

      Além disso, essa mesma atividade comercial não facilitaria eventual revenda do bem, já que sua intenção foi ficar com o celular para si. Dessa forma, configurado, apenas, o crime de receptação simples.
    opcoes:
      correta: Não, pois o crime praticado foi de receptação simples, tendo em vista que Lúcio não adquiriu o bem no exercício de atividade comercial.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 20-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Andy, jovem de 25 anos, possui uma condenação definitiva pela prática de contravenção penal. Em momento posterior, resolve praticar um crime de estelionato e, para tanto, decide que irá até o portão da residência de Josefa e, aí, solicitará a entrega de um computador, afirmando que tal requerimento era fruto de um pedido do próprio filho de Josefa, pois tinha conhecimento que este trabalhava no setor de informática de determinada sociedade.

      Ao chegar ao portão da casa, afirma para Josefa que fora à sua residência buscar o computador da casa a pedido do filho dela, com quem trabalhava. Josefa pede para o marido entregar o computador a Andy, que ficara aguardando no portão. Quando o marido de Josefa aparece com o aparelho, Andy se surpreende, pois ele lembrava seu falecido pai. Em razão disso, apesar de já ter empregado a fraude, vai embora sem levar o bem.

      O Ministério Público ofereceu denúncia pela prática de tentativa de estelionato, sendo Andy condenado nos termos da denúncia.

      Como advogado de Andy, com base apenas nas informações narradas, responda aos itens a seguir.
    comando: Qual tese jurídica de direito material deve ser alegada, em sede de recurso de apelação, para evitar a punição de Andy? Justifique.
    gabarito: A tese de direito material a ser alegada pelo advogado de Andy é que, no caso, não poderia ele ter sido punido pela tentativa, tendo em vista que houve desistência voluntária. Prevê o Art. 15 do CP que o agente que voluntariamente desiste de prosseguir na execução responde apenas pelos atos já praticados e não pela tentativa do crime inicialmente pretendido. Isso porque o agente opta por não prosseguir quando pode, ao contrário da tentativa, quando o agente não pode prosseguir por razões alheias à sua vontade. No caso, a execução já tinha sido iniciada, quando Andy empregou fraude. O benefício, porém, não foi obtido, sendo certo que o crime não se consumou pela vontade do próprio agente. Assim, sua conduta se torna atípica e deveria ele ser absolvido.
    opcoes:
      correta: Deveria ser alegada a ocorrência de desistência voluntária, o que torna a conduta do agente atípica OU o que faz com que responda apenas pelos atos já praticados, na forma do Art. 15, primeira parte, do CP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
