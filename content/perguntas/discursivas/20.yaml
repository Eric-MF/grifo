# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "20"
introducoes:
  peca: "Astolfo, de 74 anos, morador havia mais de 50 anos de uma favela de Goiânia e sem antecedentes, foi obrigado pelo chefe do tráfico local, armado, a levar 50 g de cocaína a outro traficante, sob pena de ser expulso de casa, e foi preso no caminho. Admitiu o transporte e contou a ameaça. A sua folha de antecedentes só aponta um inquérito por falsificação de documento particular. Denunciado por tráfico, respondeu ao processo em liberdade. O Ministério Público pediu a condenação, e você, advogado de Astolfo, foi intimado para os memoriais em 6/3/2015."
  q1: "Fausto, de 18 anos, sem habilitação, pegou o carro do pai escondido e, sem respeitar a sinalização, atropelou e matou Lídia e as cinco filhas. Condenado por seis homicídios na direção de veículo, com as causas de aumento, a 4 anos e 6 meses no semiaberto, teve a substituição da pena negada só porque a pena passa de 4 anos. Na sentença, o juiz decretou a prisão dele só porque ele não foi à audiência marcada para o interrogatório."
  q2: "Lúcio, dono de uma oficina de carros, comprou de um vizinho, por R$ 1.000, um celular que sabia ser produto de crime, para uso próprio. O delegado o indiciou por receptação qualificada, por exercer atividade comercial, e pediu a prisão temporária dele."
  q3: "Andy, com uma condenação definitiva por contravenção penal, foi à casa de Josefa dizendo que o filho dela pedira para ele buscar o computador. Quando o marido dela trouxe o aparelho, Andy se lembrou do pai falecido e foi embora sem levar nada. Foi condenado por tentativa de estelionato."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["20-peca-1", "20-peca-3-1", "20-peca-11", "20-peca-11-1", "20-peca-11-2", "20-peca-11-3", "20-q4-a", "20-q4-b"]
perguntas:
  - id: 20-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: merito
    pergunta: "Astolfo levou a droga porque o chefe do tráfico, armado, ameaçou expulsá-lo de casa. Que tese leva à absolvição dele?"
    tese: "Coação moral irresistível, que exclui a culpabilidade"
    aceitos: [ "coacao moral irresistivel | coacao irresistivel" ]
    artigos: [ "art. 22, CP" ]
    gabarito: "No mérito: Absolvição do crime imputado de tráfico de drogas, com fundamento na existência de coação moral irresistível, prevista no Art. 22 do Código Penal"
    revisao: { status: revisado }
  - id: 20-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: merito
    pergunta: "O inquérito por falsificação pode aumentar a pena-base de Astolfo?"
    tese: "Inquérito em curso não é circunstância judicial desfavorável (presunção de inocência)"
    aceitos: [ [ "presuncao de inocencia | estado de inocencia" ], [ "nao pode | nao podem | nao serve | nao configura | nao caracteriz*" ] ]
    artigos: [ "Súmula 444 STJ" ]
    gabarito: "Subsidiariamente, em caso de condenação: fixação da pena base no mínimo legal, pois a existência de inquérito policial não pode configurar circunstância judicial desfavorável, em atenção ao Princípio da presunção de inocência."
    revisao: { status: revisado }
  - id: 20-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Que atenuante deve ser reconhecida pela idade de Astolfo?"
    tese: "Atenuante de ser o réu maior de 70 anos na data da sentença"
    aceitos: [ "70 anos | setenta anos" ]
    artigos: [ "art. 65, I, CP" ]
    gabarito: "Reconhecimento de atenuante pelo fato de o réu ser maior de 70 anos na data da sentença, nos termos do Art. 65, inciso I, do CP"
    revisao: { status: revisado }
  - id: 20-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Astolfo admitiu o transporte da droga. Que atenuante cabe?"
    tese: "Atenuante da confissão espontânea"
    aceitos: [ "confissao" ]
    artigos: [ "art. 65, III, d, CP" ]
    gabarito: "Reconhecimento da atenuante da confissão, nos termos do Art. 65, inciso III, alínea d, do CP"
    revisao: { status: revisado }
  - id: 20-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Se a coação não for considerada irresistível, que atenuante cabe?"
    tese: "Atenuante da coação resistível"
    aceitos: [ "coacao resistivel" ]
    artigos: [ "art. 65, III, c, CP" ]
    gabarito: "Reconhecimento da atenuante da coação resistível, na forma do Art. 65, inciso III, alínea c, do CP."
    revisao: { status: revisado }
  - id: 20-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Astolfo é primário, de bons antecedentes e não se dedica ao crime. Que figura do tráfico a defesa deve pedir?"
    tese: "Tráfico privilegiado, com a causa de diminuição da pena"
    aceitos: [ "privilegiado" ]
    artigos: [ "art. 33, § 4º, Lei 11.343" ]
    gabarito: "Aplicação da causa de diminuição do Art. 33, § 4º, da Lei nº 11.343 OU reconhecimento do tráfico privilegiado, pois o réu era primário, de bons antecedentes, não se dedicando a atividade criminosa nem integrando organização criminosa"
    revisao: { status: revisado }
  - id: 20-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Com a diminuição da pena, o que a defesa deve pedir quanto à espécie de pena?"
    tese: "Substituição por restritivas de direitos: a vedação no tráfico privilegiado foi declarada inconstitucional"
    aceitos: [ "substitui*" ]
    artigos: [ "art. 44, CP" ]
    gabarito: "Substituição da pena privativa de liberdade por restritivas de direitos, pois o STF reconheceu a inconstitucionalidade da vedação trazida pelo Art. 33, § 4º, da Lei nº 11.343/06 OU porque a Resolução 05 do Senado Federal suspendeu a eficácia dessa vedação."
    revisao: { status: revisado }
  - id: 20-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto: o regime fechado obrigatório para o tráfico é inconstitucional"
    aceitos: [ "aberto" ]
    artigos: [ "art. 33, § 2º, c, CP", "art. 5, XLVI, CRFB" ]
    gabarito: "Aplicação do regime inicial aberto para cumprimento de pena, pois a fixação do regime inicial fechado obrigatório para crimes hediondos e equiparados trazida pelo Art. 2º, § 1º, da Lei nº 8072 foi considerada inconstitucional pelo STF por violação do princípio da individualização da pena."
    revisao: { status: revisado }
  - id: 20-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Mantida a pena de 4 anos e 6 meses, é possível substituí-la por restritivas de direitos?"
    tese: "Nos crimes culposos, a substituição por restritivas de direitos cabe qualquer que seja a pena"
    aceitos: [ "culpos*" ]
    artigos: [ "art. 44, I, CP" ]
    gabarito: "Tratando-se de crime culposo, o fato de a pena ter ficado acomodada em mais de 04 anos, por si só, não impede a substituição da pena privativa de liberdade por restritiva de direitos, sendo certo que o encarceramento deve ser deixado para casos especiais, quando se manifestar extremamente necessário.O Art. 44, inciso I, do Código Penal, afirma expressamente que caberá substituição, independente da pena aplicada, se o crime for culposo. No caso, como o fundamento exclusivo do magistrado foi a pena aplicada, é possível afastá-lo e, consequentemente, buscar a substituição em sede de recurso."
    revisao: { status: revisado }
  - id: 20-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Como combater o fundamento da prisão de Fausto, a ausência ao interrogatório?"
    tese: "Não ir ao interrogatório é exercício do direito ao silêncio e da autodefesa"
    aceitos: [ [ "silencio" ], [ "autodefesa" ] ]
    artigos: [ "art. 186, CPP", "art. 5, LXIII, CRFB" ]
    gabarito: "O fato de o acusado não ter comparecido ao interrogatório, por si só, não justifica o decreto prisional, devendo ser entendida a sua ausência como extensão do direito ao silêncio. Hoje, o interrogatório é tratado pela doutrina e pela jurisprudência não somente como meio de prova, mas também como meio de defesa. Por sua vez, o direito à ampla defesa inclui a defesa técnica e a autodefesa. No exercício da autodefesa, pode o acusado permanecer em silêncio durante seu interrogatório. Da mesma forma, poderá deixar de comparecer ao ato como extensão desse direito, sendo certo que no caso não haveria qualquer prejuízo para a instrução nesta ausência, já que a audiência seria apenas para interrogatório. A prisão, antes do trânsito em julgado da decisão condenatória, reclama fundamentação concreta da necessidade da medida, não podendo ser aplicada como forma de antecipação de pena.\n\nA banca examinadora considerou como adequada a alegação do não cabimento da prisão preventiva pelo fato de o crime praticado por Fausto ser culposo, não atendendo, assim, o requisito do art. 313, inc. I, do CPP. A mera alegação, em abstrato, de ausência dos requisitos da prisão preventiva foi considerada insuficiente, bem como a mera citação do dispositivo legal acima destacado."
    revisao: { status: revisado }
  - id: 20-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "O delegado podia pedir a prisão temporária de Lúcio?"
    tese: "Descabimento da prisão temporária: a receptação não está no rol de crimes que a admitem"
    aceitos: [ "rol" ]
    artigos: [ "art. 1, III, Lei 7.960" ]
    gabarito: "No caso concreto, a autoridade policial não poderia ter representado pela prisão temporária de Lúcio. De início, deve ser destacado que o crime de receptação, ainda que em sua modalidade qualificada, não está previsto no rol de delitos estabelecido pelo Art. 1º, inciso III, da Lei nº 7.960/89. Isso, por si só, já afastaria a possibilidade de ser decretada a prisão temporária. Ademais, os outros requisitos trazidos pelos incisos I e II do Art. 1º do mesmo diploma legal também não estão preenchidos, uma vez que Lúcio possui residência fixa e a medida não se mostra imprescindível para as investigações do inquérito policial. Ressalta-se que a prisão temporária não se confunde com a preventiva, de modo que a fundamentação com base nos artigos 312 e 313 do CPP será considerada insuficiente."
    revisao: { status: revisado }
  - id: 20-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Lúcio comprou o celular para uso próprio. Que crime ele cometeu?"
    tese: "Receptação simples: ele não agiu no exercício de atividade comercial"
    aceitos: [ "receptacao simples" ]
    artigos: [ "art. 180, CP" ]
    gabarito: "O crime praticado por Lúcio foi o de receptação simples e não em sua modalidade qualificada. Prevê o Art. 180, § 1º, do Código Penal, que a pena será de 03 a 08 anos, quando o agente “Adquirir, receber, transportar, conduzir, ocultar, ter em depósito, desmontar, montar, remontar, vender, expor à venda, ou de qualquer forma utilizar, em proveito próprio ou alheio, no exercício de atividade comercial ou industrial, coisa que deve saber ser produto de crime”. A ideia do legislador foi punir mais severamente aquele comerciante que se aproveita de sua profissão para ter um acesso facilitado ou maior facilidade na venda de bens produtos de crimes. Assim, para tipificar a modalidade qualificada, é necessária que a receptação tenha sido praticada pelo agente no exercício de atividade comercial ou industrial. Não basta que o autor seja comerciante. No caso concreto, apesar de comerciante, Lúcio não teve acesso ao celular produto de crime em razão de sua atividade comercial, pois o adquiriu de seu vizinho.\n\nAlém disso, essa mesma atividade comercial não facilitaria eventual revenda do bem, já que sua intenção foi ficar com o celular para si. Dessa forma, configurado, apenas, o crime de receptação simples."
    revisao: { status: revisado }
  - id: 20-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que tese evita a punição de Andy na apelação?"
    tese: "Desistência voluntária: ele parou antes de consumar o crime"
    aceitos: [ "desistencia voluntaria" ]
    artigos: [ "art. 15, CP" ]
    gabarito: "A tese de direito material a ser alegada pelo advogado de Andy é que, no caso, não poderia ele ter sido punido pela tentativa, tendo em vista que houve desistência voluntária. Prevê o Art. 15 do CP que o agente que voluntariamente desiste de prosseguir na execução responde apenas pelos atos já praticados e não pela tentativa do crime inicialmente pretendido. Isso porque o agente opta por não prosseguir quando pode, ao contrário da tentativa, quando o agente não pode prosseguir por razões alheias à sua vontade. No caso, a execução já tinha sido iniciada, quando Andy empregou fraude. O benefício, porém, não foi obtido, sendo certo que o crime não se consumou pela vontade do próprio agente. Assim, sua conduta se torna atípica e deveria ele ser absolvido."
    revisao: { status: revisado }
  - id: 20-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "A condenação anterior de Andy impede a suspensão condicional do processo?"
    tese: "A condenação anterior por contravenção não impede a suspensão condicional do processo: a lei só fala em crime"
    aceitos: [ "contraven*" ]
    artigos: [ "art. 89, Lei 9.099" ]
    gabarito: "Não há vedação legal, podendo Andy fazer jus ao benefício da suspensão condicional do processo. O crime de estelionato possui pena mínima de 01 ano, o que está de acordo com as exigências do Art. 89 da Lei nº 9.099/95.\n\nAdemais, prevê o dispositivo que não caberá suspensão se o agente já houver sido condenado ou se responder a outro processo pela prática de crime. Todavia, no caso, Andy havia sido condenado pela prática de contravenção penal, logo não há vedação à concessão do benefício."
    revisao: { status: revisado }
