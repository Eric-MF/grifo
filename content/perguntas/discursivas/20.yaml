        - Incidência da causa de aumento de pena por estar na presença de várias pessoas ou por meio que facilite a divulgação da calúnia, da difamação ou da injúria-, nos termos do Art. 141, III do CP.
        - A conduta de Patrick visava resguardar direito de terceiro/sua sobrinha.
        - Houve inadequada inversão da ordem de oitiva das testemunhas ou as testemunhas de defesa foram ouvidas antes das testemunhas de acusação, em desrespeito à previsão do Art. 411 do CPP
