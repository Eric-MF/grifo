  - id: 20-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Lúcio, com residência fixa e proprietário de uma oficina de carros, adquiriu de seu vizinho, pela quantia de R$1.000,00 (mil reais) um aparelho celular, que sabia ser produto de crime pretérito, passando a usá-lo como próprio. Tomando conhecimento dos fatos, um inimigo de Lúcio comunicou o ocorrido ao Ministério Público, que requisitou a instauração de inquérito policial. A autoridade policial instaurou o procedimento, indiciou Lúcio pela prática do crime de receptação qualificada (Art. 180, § 1º, do Código Penal), já que desenvolvia atividade comercial, e, de imediato, representou pela prisão temporária de Lúcio, existindo parecer favorável do Ministério Público. A família de Lúcio o procura para esclarecimentos.

      Na condição de advogado de Lúcio, esclareça os itens a seguir.
    comando: "No caso concreto, a autoridade policial poderia ter representado pela prisão temporária de Lúcio? (Valor:"
    gabarito: No caso concreto, a autoridade policial não poderia ter representado pela prisão temporária de Lúcio. De início, deve ser destacado que o crime de receptação, ainda que em sua modalidade qualificada, não está previsto no rol de delitos estabelecido pelo Art. 1º, inciso III, da Lei nº 7.960/89. Isso, por si só, já afastaria a possibilidade de ser decretada a prisão temporária. Ademais, os outros requisitos trazidos pelos incisos I e II do Art. 1º do mesmo diploma legal também não estão preenchidos, uma vez que Lúcio possui residência fixa e a medida não se mostra imprescindível para as investigações do inquérito policial. Ressalta-se que a prisão temporária não se confunde com a preventiva, de modo que a fundamentação com base nos artigos 312 e 313 do CPP será considerada insuficiente.
    opcoes:
      correta: Não poderia a autoridade policial ter representado pela prisão temporária, pois o crime de receptação não está previsto no rol de crimes que admitem essa modalidade de prisão, na forma do Art. 1º, inciso III, da Lei nº 7.960/89.
