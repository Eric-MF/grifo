  - id: 20-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Joana trabalha em uma padaria na cidade de Curitiba. Em um domingo pela manhã, Patrícia, freguesa da padaria, acreditando não estar sendo bem atendida por Joana, após com ela discutir, a chama de “macaca” em razão da cor de sua pele.

      Inconformados com o ocorrido, outros fregueses acionam policiais que efetuam a prisão em flagrante de Patrícia por crime de racismo (Lei nº 7.716/89 – Lei do Preconceito Racial), apesar de Joana dizer que não queria que fosse tomada qualquer providência em desfavor da pessoa detida. A autoridade policial lavra o flagrante respectivo, independente da vontade da ofendida, asseverando que os crimes da Lei nº 7.716/89 são de ação penal pública incondicionada. O Ministério Público opina pela liberdade de Patrícia porque ainda existiam diligências a serem cumpridas em sede policial.

      Patrícia, sete meses após o ocorrido, procura seu advogado para obter esclarecimentos, informando que a vítima foi ouvida em sede policial e confirmou o ocorrido, bem como o desinteresse em ver a autora dos fatos responsabilizada criminalmente.

      Na condição de advogado de Patrícia, esclareça:
    comando: Agiu corretamente a autoridade policial ao indiciar Patrícia pela prática do crime de racismo? Justifique.
    gabarito: Não agiu corretamente a autoridade policial ao indiciar Patrícia pela prática do crime de racismo, tendo em vista que o delito praticado foi de injúria racial, previsto no Art. 140, § 3º, do Código Penal. Enquanto a injúria racial consiste em ofender a honra de alguém valendo-se de elementos referentes à raça, cor, etnia, religião ou origem, o crime de racismo atinge uma coletividade indeterminada de indivíduos, discriminando toda a integralidade de uma raça, ainda que a discriminação tenha sido praticada em determinado momento contra apenas uma pessoa. Ao contrário da injúria racial, o crime de racismo é inafiançável e imprescritível. No caso, não houve discriminação de Joana em razão de sua cor. Não foi, em razão de sua cor, Joana proibida de frequentar determinado local ou adotar determinada conduta. Ocorre, por parte de Patrícia, uma ofensa à honra subjetiva de Joana, para tanto valendo-se de elementos referentes à sua cor, de modo que o delito praticado foi de injúria racial.
    opcoes:
      correta: Não agiu corretamente a autoridade policial, pois o delito praticado por Patrícia foi de injúria racial e não de racismo, conforme o Art. 140, § 3º, do Código Penal, pois a intenção da agente era ofender a honra de Joana.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
