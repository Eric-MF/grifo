      Obs.: A peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples
    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Em acréscimo, deve ser postulada a aplicação da causa de diminuição de pena do arrependimento posterior, pois o acusado restituiu integralmente o valor do dano antes do recebimento da denúncia, presentes os demais requisitos (crime praticado sem violência ou grave ameaça), na forma do Art. 16 do CP.
