      Na qualidade de advogado(a) de Fábio, responda às questões a seguir.
    comando: Em relação ao delito de lesão corporal, é cabível a alegação de ausência de representação da ofendida ou mesmo a sua retratação para invalidar a propositura da ação penal em desfavor de Fábio? Fundamente.
    gabarito: Não. A vontade da vítima é desinfluente, uma vez que, nos delitos de violência doméstica e familiar contra a mulher, não se aplicam as disposições da Lei nº 9.099/1995, na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ, de forma que a ação penal é pública incondicionada. Por isso, não é cabível a retratação da representação.
