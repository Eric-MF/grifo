      Obs.: A peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples
    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Atipicidade das condutas de “furto de uso”, pois não houve ânimo de assenhoramento definitivo da res furtiva ou porque foram os bens restituídos sem desgaste ou dano, devendo se constatar que o fato não é crime.
    opcoes:
      correta: Atipicidade das condutas de “furto de uso”, pois não houve ânimo de assenhoramento definitivo da res furtiva ou porque foram os bens restituídos sem desgaste ou dano, devendo se constatar que o fato não é crime.
      erradas:
        - Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
        - Breno não agiu com dolo nem culpa OU sua conduta foi atípica em relação ao crime de corrupção de menores.
        - Da tese do afastamento da agravante da embriaguez preordenada.
        - O reconhecimento do erro de tipo tem como consequência a exclusão do dolo ou atipicidade da conduta.
        - A prática de falta grave não gera o reinício da contagem do prazo do livramento condicional, nos termos da Súmula 441 do STJ.
    revisao: *a1
