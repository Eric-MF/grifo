    caso: |-
      Márcia e Fábio, ambos maiores e capazes, mantiveram relação íntima de afeto, sem coabitação, até que Fábio agrediu Márcia com tapas e socos, o que a deixou lesionada, sem gravidade.

      Márcia, então, procurou as autoridades competentes e formalizou registro de ocorrência policial e pedido de medidas protetivas em desfavor de Fábio, bem como realizou exame de corpo de delito. O Juízo deferiu a medida protetiva de urgência requerida pela vítima e determinou que Fábio guardasse distância de até 300m de Márcia, durante pelo menos 90 dias, intimando-o dessa decisão.

      Um mês após o deferimento da referida medida protetiva de urgência, o oficial de justiça se dirigiu à casa de Fábio para citá-lo na ação penal pública movida em seu desfavor, em decorrência das lesões causadas em Márcia (pelas quais foi denunciado como incurso nas penas do Art. 129, § 13, do CP). Ao chegar à residência de Fábio, o serventuário foi recebido por Márcia, que declarou lá estar voluntariamente, admitindo ter reatado o relacionamento e que não tinha mais desejo de manter as medidas protetivas e o processo (sobre a lesão corporal) movido em desfavor de Fábio, invocando o Art. 88 da Lei nº 9.099/1995, que prevê a necessidade de representação nos crimes de lesões corporais leves e culposas. Não obstante as declarações de Márcia, Fábio foi preso em flagrante pelo tipo penal do Art. 24-A da Lei nº 11.340/2006.

      Na qualidade de advogado(a) de Fábio, responda às questões a seguir.
    comando: Tendo em vista a prisão em flagrante de Fábio, a que autoridade deve ser requerido o arbitramento de fiança?
    gabarito: Na forma do Art. 24-A, § 2º, da Lei nº 11.340/2006, à autoridade judicial, pois somente esta pode arbitrar a fiança pelo delito de descumprimento de medida protetiva de urgência.
    opcoes:
      correta: À autoridade judiciária, na forma do Art. 24-A, §2º, da Lei nº 11.340/2006.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
