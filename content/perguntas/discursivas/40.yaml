  - id: 40-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Helena, inconformada com o desempenho de seu time de futebol no Campeonato Brasileiro, decidiu colocar explosivos no estádio do seu clube. Helena inseriu os explosivos em locais estratégicos para explodir e danificar todo o gramado, de forma a garantir que, por ocasião da explosão, ninguém fosse atingido. No entanto, após colocar os explosivos similares a dinamite, Helena se distraiu e não observou quando o cachorro do clube, Bob, pegou um dos explosivos e o levou para o vestiário.

      Helena, depois que criou um risco não permitido pelo Direito, de forma negligente, acionou os explosivos, acreditando que iria danificar apenas o gramado, porém atingiu o vestiário, onde estava um funcionário do clube, que faleceu em decorrência da explosão, sendo certo que tal resultado era de manifesta previsibilidade, embora não desejado ou tolerado pela acusada.

      Helena foi denunciada pelo delito de homicídio qualificado pelo emprego de explosivo. Os fatos relatados foram regularmente comprovados durante a instrução processual da primeira fase do Júri.

      Como advogado(a) de Helena, sem concordar com a imputação realizada, ao se pronunciar em alegações finais da primeira fase do Júri, responda às questões a seguir.
    comando: Considerando a conduta de Helena e o resultado, qual a tipificação penal adequada ao fato? Justifique.
    gabarito: Em relação à questão penal, nota-se que Helena agiu com culpa quanto ao resultado morte, sendo imperioso concluir que o fato se amolda ao delito de explosão, com causa de aumento de pena em razão do resultado morte, na forma do Art. 251, c/c o Art. 258, ambos do CP, em vista do dolo de explosão. Também seria legítimo concluir pela tipificação como homicídio culposo, na forma do Art. 121, § 3º, CP.
    opcoes:
      correta: Helena agiu com culpa quanto ao resultado morte, cabendo à defesa postular a desclassificação para o delito de explosão com causa de aumento de pena em razão do resultado morte ou homicídio culposo, na forma do Art. 251, c/c o Art. 258, ou Art. 121, § 3º, todos do CP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
