# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "40"
introducoes:
  peca: "Gustavo, entregador por aplicativo, entrou por sete dias seguidos num depósito de bicicletas pulando o muro, pegou uma bicicleta e a devolveu intacta no fim do dia, só para usá-la no trabalho. No oitavo dia, achou a porta aberta e entrou por ela, mas caiu e destruiu a bicicleta. Na delegacia, pagou espontaneamente os R$ 1.500 do prejuízo, em 10/12/2023, e a denúncia foi recebida em 19/12/2023. Ele foi condenado por oito furtos qualificados pela escalada, em concurso material, a 16 anos no regime fechado, com a pena de cada crime no mínimo, apesar da confissão. Você foi intimado da sentença."
  q1: "Bruno, Márcia e Camile, sócios administradores de uma empresa, foram denunciados por sonegação fiscal porque o Fisco autuou a empresa em R$ 120.000 por uma informação falsa que suprimiu tributo. O recurso administrativo contra a autuação ainda não foi julgado, e o juiz recebeu a denúncia."
  q2: "Márcia e Fábio namoravam sem morar juntos, até que ele a agrediu com tapas e socos, causando lesão leve. Ela registrou o fato, fez exame de corpo de delito e conseguiu medida protetiva que obrigava Fábio a ficar a 300 m dela. Um mês depois, o oficial de justiça foi citar Fábio pela lesão e encontrou Márcia na casa dele, por vontade própria: tinham reatado, e ela disse não querer mais nem a medida nem o processo. Mesmo assim, Fábio foi preso em flagrante por descumprir a medida protetiva."
  q3: "Júlia, primária, sem antecedentes e de atividade lícita, foi presa no aeroporto de Fortaleza ao embarcar para São Paulo com 2 kg de pasta-base de cocaína escondidos num urso de pelúcia; confessou e colaborou. Foi logo denunciada por tráfico privilegiado interestadual, sem proposta de acordo, embora a pena mínima cabível seja inferior a 4 anos."
  q4: "Helena pôs explosivos no estádio do seu time para destruir o gramado, cuidando para que ninguém fosse atingido. Distraída, não viu que o cachorro do clube levou um dos explosivos para o vestiário, e, ao acionar tudo, matou um funcionário que estava lá; a morte era previsível, mas ela não a quis nem aceitou. Foi denunciada por homicídio qualificado pelo emprego de explosivo e está nas alegações finais da primeira fase do júri."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["40-peca-1", "40-peca-3", "40-peca-4", "40-peca-5-1", "40-peca-11"]
perguntas:
  - id: 40-peca-5-2
    categoria: peca-detalhe
    parte: peca
    item: "5.2"
    secao: merito
    pergunta: "Nos sete primeiros dias, Gustavo devolveu a bicicleta intacta. Que pedido a defesa deve fazer quanto a esses fatos?"
    tese: "Absolvição pelos sete primeiros fatos: o furto de uso, com a devolução intacta da coisa, é atípico"
    aceitos: [ "absolv* | furto de uso | atipic*" ]
    artigos: [ "art. 386, III, CPP", "art. 155, CP" ]
    gabarito: "Deve ser requerida a absolvição de Gustavo em relação aos sete primeiros furtos, na forma do Art. 386, inciso III, do CPP."
    revisao: { status: revisado }
  - id: 40-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: pedido
    pergunta: "No oitavo dia, Gustavo entrou pela porta aberta. Que pedido a defesa deve fazer quanto a esse fato?"
    tese: "Desclassificação do oitavo fato para furto simples: Gustavo entrou pela porta, sem escalada"
    aceitos: [ [ "desclassific* | desqualific* | afast*", "simples | escalada | qualificadora" ], [ "furto simples" ] ]
    artigos: [ "art. 155, CP" ]
    gabarito: "Pedido de desclassificação da conduta de furto qualificado para furto simples, pois, neste dia, Gustavo adentrou o depósito pela porta da frente, não se valendo de escalada ou qualquer outra qualificadora, na forma do Art. 155, caput, do CP."
    revisao: { status: revisado }
  - id: 40-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Gustavo pagou todo o prejuízo antes do recebimento da denúncia. Que causa de diminuição de pena isso configura?"
    tese: "Arrependimento posterior: o dano foi reparado antes do recebimento da denúncia, num crime sem violência"
    aceitos: [ "arrependimento posterior" ]
    artigos: [ "art. 16, CP" ]
    gabarito: "Em acréscimo, deve ser postulada a aplicação da causa de diminuição de pena do arrependimento posterior, pois o acusado restituiu integralmente o valor do dano antes do recebimento da denúncia, presentes os demais requisitos (crime praticado sem violência ou grave ameaça), na forma do Art. 16 do CP."
    revisao: { status: revisado }
  - id: 40-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Subsidiariamente, como devem ser tratados os oito fatos, praticados do mesmo modo em dias seguidos?"
    tese: "Continuidade delitiva: os crimes foram praticados nas mesmas condições de tempo, lugar e modo de execução"
    aceitos: [ "continuidade | continuad*" ]
    artigos: [ "art. 71, CP" ]
    gabarito: "Subsidiariamente, a aplicação da continuidade delitiva, pois os fatos ocorreram nas mesmas condições de tempo, lugar e maneira de execução, na forma do Art. 71, caput, do CP."
    revisao: { status: revisado }
  - id: 40-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: pedido
    pergunta: "Com a pena reduzida, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto ou semiaberto, conforme a pena reduzida"
    aceitos: [ "aberto | semiaberto | semi-aberto | semi aberto" ]
    artigos: [ "art. 33, § 2º, c, CP", "art. 33, § 2º, b, CP" ]
    gabarito: "Pedido de fixação de regime inicial aberto ou semiaberto, na forma do Art. 33, § 2º, alínea b ou c, do CP."
    revisao: { status: revisado }
  - id: 40-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Além do regime, o que a defesa deve pedir quanto à espécie de pena?"
    tese: "Substituição da pena privativa de liberdade por restritivas de direitos: pena de até 4 anos, crime sem violência e circunstâncias favoráveis"
    aceitos: [ "substitu* | restritiva de direitos | restritivas de direitos" ]
    artigos: [ "art. 44, CP" ]
    gabarito: "Substituição da pena privativa de liberdade por restritiva de direitos, pois a pena ficará abaixo de quatro anos e o crime foi praticado sem violência ou grave ameaça, sendo as circunstâncias judiciais inteiramente positivas, na forma do Art. 44 do CP."
    revisao: { status: revisado }
  - id: 40-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Sem recurso próprio, que medida pode impugnar o recebimento da denúncia no tribunal?"
    tese: "Habeas corpus para trancar a ação penal (ou reclamação ao STF, pela súmula vinculante)"
    aceitos: [ "habeas corpus | reclamacao" ]
    artigos: [ "art. 5, LXVIII, CRFB", "art. 648, I, CPP", "art. 103-A, § 3º, CRFB" ]
    gabarito: "Inicialmente, quanto à questão processual, deve ser observado que o recebimento da denúncia não é passível de recurso próprio, razão pela qual a decisão desafia habeas corpus, com fundamento no Art. 5º, LXVIII, da CF ou Art. 647 ou 648, inciso I, do CPP, ante a ausência de justa causa. Alternativamente, poderia indicar o cabimento de Reclamação ao Supremo Tribunal Federal, conforme Art. 103-A, § 3º, CF."
    revisao: { status: revisado }
  - id: 40-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que argumento de direito material favorece os sócios?"
    tese: "Atipicidade: o crime tributário material só se tipifica com o lançamento definitivo do tributo"
    aceitos: [ "atipic* | lancamento definitivo | constituicao definitiva" ]
    artigos: [ "Súmula Vinculante 24" ]
    gabarito: "O direito material envolvido é a incidência da Súmula Vinculante nº 24, que assevera a não tipificação de crime material contra a ordem tributária antes do lançamento definitivo do tributo, exatamente a hipótese dos autos."
    revisao: { status: revisado }
  - id: 40-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "A que autoridade deve ser pedido o arbitramento de fiança para Fábio?"
    tese: "Só a autoridade judicial pode conceder fiança no descumprimento de medida protetiva"
    aceitos: [ "autoridade judicia* | juiz | judicial" ]
    artigos: [ "art. 24-A, § 2º, Lei 11.340" ]
    gabarito: "Na forma do Art. 24-A, § 2º, da Lei nº 11.340/2006, à autoridade judicial, pois somente esta pode arbitrar a fiança pelo delito de descumprimento de medida protetiva de urgência."
    revisao: { status: revisado }
  - id: 40-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "A falta de representação ou a retratação de Márcia invalida a ação penal pela lesão corporal?"
    tese: "A lesão corporal leve em violência doméstica contra a mulher é de ação pública incondicionada, sem representação nem retratação"
    aceitos: [ "incondicionada | nao cabe retratacao | nao depende de representacao | independe de representacao" ]
    artigos: [ "Súmula 542 STJ", "art. 41, Lei 11.340" ]
    gabarito: "Não. A vontade da vítima é desinfluente, uma vez que, nos delitos de violência doméstica e familiar contra a mulher, não se aplicam as disposições da Lei nº 9.099/1995, na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ, de forma que a ação penal é pública incondicionada. Por isso, não é cabível a retratação da representação."
    revisao: { status: revisado }
  - id: 40-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que pedido processual a defesa de Júlia deve fazer para evitar o recebimento da denúncia?"
    tese: "Remessa dos autos ao órgão superior do Ministério Público para rever a recusa do acordo de não persecução penal"
    aceitos: [ "orgao superior | remessa | procurador-geral | procurador geral" ]
    artigos: [ "art. 28-A, § 14, CPP" ]
    gabarito: "A fim de evitar o recebimento da denúncia, deve a defesa requerer a remessa dos autos ao órgão superior do Ministério Público, nos termos do Art. 28-A, § 14, do CPP, a fim de que seja oferecido o Acordo de Não Persecução Penal, pois presentes os requisitos objetivos e subjetivos."
    revisao: { status: revisado }
  - id: 40-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Condenada a mais de 4 anos, Júlia progride pelas regras dos crimes hediondos?"
    tese: "O tráfico privilegiado não é hediondo nem equiparado: a progressão segue as regras dos crimes comuns"
    aceitos: [ "nao e hediondo | nao hediondo | nao e equiparado | nao equiparado | crimes comuns" ]
    artigos: [ "art. 112, § 5º, LEP" ]
    gabarito: "Caso efetivamente condenada à pena de reclusão em regime diverso do aberto, Júlia estaria sujeita a progressão de regime após o cumprimento de 16% das penas, conforme Art. 112, inciso I, da LEP, pois o delito de tráfico privilegiado não é violento e não é equiparado a hediondo, nos termos do Art. 112, § 5º, da LEP."
    revisao: { status: revisado }
  - id: 40-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Qual é a tipificação adequada à conduta de Helena?"
    tese: "Explosão culposa com resultado morte (ou homicídio culposo): a morte veio de culpa, não de dolo"
    aceitos: [ "culpos* | culpa" ]
    artigos: [ "art. 251, § 3º, CP", "art. 258, CP", "art. 121, § 3º, CP" ]
    gabarito: "Em relação à questão penal, nota-se que Helena agiu com culpa quanto ao resultado morte, sendo imperioso concluir que o fato se amolda ao delito de explosão, com causa de aumento de pena em razão do resultado morte, na forma do Art. 251, c/c o Art. 258, ambos do CP, em vista do dolo de explosão. Também seria legítimo concluir pela tipificação como homicídio culposo, na forma do Art. 121, § 3º, CP."
    revisao: { status: revisado }
  - id: 40-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que pedido processual a defesa de Helena deve fazer nas alegações finais?"
    tese: "Desclassificação, com a remessa do caso ao juízo singular"
    aceitos: [ "desclassific*" ]
    artigos: [ "art. 419, CPP", "art. 418, CPP" ]
    gabarito: "O pedido processual cabível, nesta fase do procedimento, é o de desclassificação, na forma do Art. 418 ou do Art. 419, ambos do CPP."
    revisao: { status: revisado }
