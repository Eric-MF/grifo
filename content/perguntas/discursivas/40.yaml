    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Bruno, Márcia e Camile são sócios da pessoa jurídica Window Law Ltda., sendo que os três exercem, conjuntamente, a administração da sociedade. Em fiscalização de rotina, o Fisco apurou a existência de informação falsamente prestada pela sociedade empresária, que importou em supressão do tributo devido. Em razão disso, houve autuação fiscal, no valor de R$ 120.000,00 (cento e vinte mil reais).

      Window Law Ltda. interpôs recurso administrativo contra a autuação tributária, pendente de julgamento.

      O Ministério Público ajuizou ação penal em face de Bruno, Márcia e Camile, imputando-lhes a prática do crime previsto no Art. 1º, inciso I, da Lei nº 8.137/1990, tendo havido o recebimento da denúncia.

      Na qualidade de advogado dos três sócios, responda às questões a seguir:
    comando: Tendo em vista a ausência de previsão de recurso próprio, que medida processual pode ser dirigida ao Tribunal para impugnar a decisão de recebimento da denúncia? Justifique, indicando o fundamento legal.
    gabarito: Inicialmente, quanto à questão processual, deve ser observado que o recebimento da denúncia não é passível de recurso próprio, razão pela qual a decisão desafia habeas corpus, com fundamento no Art. 5º, LXVIII, da CF ou Art. 647 ou 648, inciso I, do CPP, ante a ausência de justa causa. Alternativamente, poderia indicar o cabimento de Reclamação ao Supremo Tribunal Federal, conforme Art. 103-A, § 3º, CF.
    opcoes:
      correta: Impetração de habeas corpus ou reclamação ao Supremo Tribunal Federal, com fundamento no Art. 5º, LXVIII, da CF ou Art. 647 ou Art. 648, inciso I, do CPP e Art. 103-A, § 3º, CF.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
