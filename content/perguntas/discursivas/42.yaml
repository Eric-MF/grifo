  - id: 42-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Frederico, policial, caminha à paisana quando vê um cachorro feroz avançar na direção de crianças que brincavam na rua. Frederico, imediatamente, sacou sua arma e a apontou na direção do cachorro, com o intuito de impedir o ataque.

      Jonas, que estava na janela de sua residência, mantém sob sua guarda arma de fogo legalmente registrada, ante sua autorização de posse, e tem visão parcial da situação. Ele vê apenas um homem (Frederico) apontando uma arma na direção das crianças que brincavam na rua, sem perceber a aproximação do cachorro raivoso. Assim, Jonas, acreditando que Frederico representava uma ameaça à integridade física das crianças, violando o dever de diligência e cuidado que deveria adotar em situações como a apresentada, imediatamente efetua disparo de arma de fogo contra Frederico, que cai, sem vida, após ser atingido pelo projétil da arma de fogo de Jonas. Com isso, o cachorro prosseguiu o ataque às crianças, fato que, isoladamente, levou uma delas a óbito.

      Comprovados os fatos tais como aqui relatados, Jonas é denunciado por duplo homicídio doloso, sendo-lhe imputadas as mortes de Frederico e da criança. Como advogado(a) de Jonas, responda às questões a seguir.
    comando: Qual a tese de Direito Penal a ser sustentada em relação à imputação de homicídio contra Frederico? Fundamente.
    gabarito: Jonas não deve responder pelo homicídio doloso de Frederico, pois agiu em erro de tipo permissivo vencível ou inescusável, isto é, Jonas atirou em Frederico acreditando estar agindo em legítima defesa de terceiros (legítima defesa putativa ou descriminante putativa). Por isso, Jonas deve responder por homicídio culposo, na forma do Art. 20, § 1º, do Código Penal.
    opcoes:
      correta: Jonas agiu em erro de tipo permissivo ou em legítima defesa putativa ou descriminante putativa, o que impõe a desclassificação da imputação para o delito de homicídio culposo, (ou) por se tratar de erro inescusável ou vencível, na forma do Art. 20, § 1º, do CP.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Habeas corpus e agravo em execução penal (0,15 cada).
        - "Mário não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90 por se tratar de novatio legis in pejus OU com base na irretroatividade da lei penal mais gravosa o artigo 2º, § 2º, da Lei 8.072/90 não se aplica a situação de Mário OU a antiga redação do artigo 2º, da Lei 8.072/90 é inconstitucional, razão pela qual a progressão deve ocorrer com base no Art. 112 da LEP, observando o quantum de 1/6 de cumprimento de pena. / Tal entendimento é fundamentado nos verbetes 26 da súmula vinculante do STF ou 471 do STJ. Obs.: A justificativa é essencial para atribuição de pontos."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Houve aberratio criminis OU houve resultado diverso do pretendido, devendo o agente responder apenas pelo crime de lesão corporal culposa, nos termos do Art. 74 do CP.
    revisao: *a1
  - id: 42-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Frederico, policial, caminha à paisana quando vê um cachorro feroz avançar na direção de crianças que brincavam na rua. Frederico, imediatamente, sacou sua arma e a apontou na direção do cachorro, com o intuito de impedir o ataque.

      Jonas, que estava na janela de sua residência, mantém sob sua guarda arma de fogo legalmente registrada, ante sua autorização de posse, e tem visão parcial da situação. Ele vê apenas um homem (Frederico) apontando uma arma na direção das crianças que brincavam na rua, sem perceber a aproximação do cachorro raivoso. Assim, Jonas, acreditando que Frederico representava uma ameaça à integridade física das crianças, violando o dever de diligência e cuidado que deveria adotar em situações como a apresentada, imediatamente efetua disparo de arma de fogo contra Frederico, que cai, sem vida, após ser atingido pelo projétil da arma de fogo de Jonas. Com isso, o cachorro prosseguiu o ataque às crianças, fato que, isoladamente, levou uma delas a óbito.

      Comprovados os fatos tais como aqui relatados, Jonas é denunciado por duplo homicídio doloso, sendo-lhe imputadas as mortes de Frederico e da criança. Como advogado(a) de Jonas, responda às questões a seguir.
    comando: Qual a tese de Direito Penal a ser sustentada em relação à imputação de homicídio contra a criança? Fundamente.
    gabarito: Não há nexo de causalidade entre o atuar de Jonas e a morte da criança. A criança faleceu em decorrência de circunstância totalmente independente da conduta de Jonas, não podendo este, de acordo com a teoria da causalidade adequada, adotada pelo Art. 13 do Código Penal, ser responsabilizado pelo ataque do cachorro às crianças.
    opcoes:
      correta: De acordo com a teoria da causalidade adequada, não há nexo de causalidade entre o falecimento da criança e a conduta de Jonas, pois a morte da criança decorreu de circunstância independente, nos termos do Art. 13 do CP.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Aplicação do perdão judicial, nos termos do Art. 121, § 5º, do CP.
        - A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
    revisao: *a1
  - id: 42-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Rui, 20 anos, inconformado com o término do relacionamento com Vânia, também com 20 anos, divulgou fotos da ex-companheira nua. Em razão disso, foi denunciado e, depois do regular processamento da ação penal, foi condenado, nos termos do Art. 218-C, § 1º, do CP, à pena de um ano e quatro meses de reclusão, substituída por duas restritivas de direitos, consistentes em prestação pecuniária e multa.

      O Ministério Público foi intimado da condenação, não tendo apresentado o recurso cabível no prazo legal. Vânia e seu(ua) advogado(a) foram intimados da sentença, porém, até o momento, Vânia não havia se habilitado como assistente de acusação, ainda que não concorde com as penas substitutivas aplicadas.

      Como advogado(a) de Vânia, responda às questões a seguir.
    comando: Qual a tese de Direito Penal a ser sustentada para a reforma da sentença condenatória? Justifique.
    gabarito: Em relação ao Direito Penal aplicável, era essencial que o(a) examinando(a) identificasse que há, entre Rui e Vânia, uma relação íntima de afeto, ainda que já encerrada, o que atrai a incidência da lei de violência doméstica e familiar contra a mulher, de forma a ser inviável a aplicação isolada de pena pecuniária, nos termos do Art. 17 da Lei nº 11.340/2006.
    opcoes:
      correta: Inviabilidade de aplicação isolada de pena pecuniária no âmbito da Lei de Violência Doméstica e Familiar contra a Mulher, nos termos do Art. 17 da Lei nº 11.340/2006.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Aplicação do perdão judicial, nos termos do Art. 121, § 5º, do CP.
        - A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
    revisao: *a1
  - id: 42-q2-b
    categoria: discursiva
    parte: q2
    item: B1
    caso: |-
      Rui, 20 anos, inconformado com o término do relacionamento com Vânia, também com 20 anos, divulgou fotos da ex-companheira nua. Em razão disso, foi denunciado e, depois do regular processamento da ação penal, foi condenado, nos termos do Art. 218-C, § 1º, do CP, à pena de um ano e quatro meses de reclusão, substituída por duas restritivas de direitos, consistentes em prestação pecuniária e multa.

      O Ministério Público foi intimado da condenação, não tendo apresentado o recurso cabível no prazo legal. Vânia e seu(ua) advogado(a) foram intimados da sentença, porém, até o momento, Vânia não havia se habilitado como assistente de acusação, ainda que não concorde com as penas substitutivas aplicadas.

      Como advogado(a) de Vânia, responda às questões a seguir.
    comando: Qual o recurso a ser interposto pela vítima e qual o prazo de interposição? Justifique, identificando o início da contagem do prazo.
    gabarito: Apelação supletiva, no prazo de 15 (quinze) dias após o transcurso do prazo recursal do MP, nos termos do Art. 598 do CPP ou Súmula 448, do STF.
    opcoes:
      correta: Apelação supletiva, nos termos do Art. 598 do CPP ou Súmula 448, do STF. No prazo de 15 dias após o transcurso do prazo recursal do MP.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Não foi correta a decisão do Tribunal de Justiça, pois o Tribunal não pode acolher, contra o réu, nulidade não arguida pela acusação em seu recurso. OU Não foi correta a decisão, nos termos do Verbete 160 ou 713 da Súmula do STF. OU Não foi correta a decisão, com base no princípio que veda a reformatio in pejus indireta. Obs.: A justificativa é essencial para a atribuição de pontos."
        - Não é possível a responsabilização penal de Cláudio pelo crime do Art. 154-A do Código Penal, tendo em vista que a lei posterior que de qualquer forma prejudique o acusado não pode retroagir para atingir situação pretérita OU tendo em vista que a lei que tipificou a conduta é posterior à data dos fatos, com base no Art. 5º, inciso XL, da CRFB/88 OU no Art. 1º do Código Penal.
        - Sim, deveria a defesa técnica alegar a existência de excludente de ilicitude, em razão do estado de necessidade, nos termos do Art. 24 ou do Art. 23, inciso I, do CP.
    revisao: *a1
  - id: 42-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      Douglas foi denunciado pela prática do delito de trânsito de participação em corrida do tipo “racha” (Art. 308 da Lei nº 9.503/1997 – CTB) e por falsa identidade (Art. 307 do CP). A denúncia foi recebida no dia 10/02/2020. Em razão da pandemia do Coronavírus-19, os autos ficaram paralisados aguardando a retomada da pauta de audiências presenciais do Juízo, o que somente aconteceu em 2022. Assim, em 10/10/2023, Douglas foi condenado como incurso nas penas do Art. 308 do CTB e absolvido em relação ao delito do Art. 307 do Código Penal, por falta de provas.

      Apenas o Ministério Público interpôs tempestiva apelação, postulando a condenação de Douglas pelo delito de falsa identidade. Por maioria, o Tribunal de Justiça denegou o recurso de apelação, mantendo na íntegra a sentença recorrida, o que motivou a oposição de embargos infringentes por parte do Ministério Público.

      Como advogado(a) de Douglas, você foi intimado, no dia 10/09/2024, para apresentar suas contrarrazões. Assim, com base nos dados do enunciado, responda às questões a seguir.
    comando: Indique a tese processual que deve ser arguida em face do recurso oposto pelo MP. Justifique.
    gabarito: O recurso de embargos infringentes é inadmissível, porquanto exclusivo em favor da defesa, nos termos do Art. 609, parágrafo único, do CPP.
    opcoes:
      correta: O recurso de embargos infringentes é inadmissível, porquanto exclusivo em favor da defesa, nos termos do Art. 609, parágrafo único, do CPP.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
