# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "42"
introducoes:
  peca: "Por uma denúncia anônima de que Diogo distribuía drogas, policiais entraram na casa dele sem pedir licença a ninguém e acharam, num armário, R$ 100.000 em dinheiro, sem nenhum vestígio de droga ou de outro crime. Diogo foi denunciado por lavagem de dinheiro, na modalidade ocultar, sem que a denúncia descrevesse nenhum crime de onde o dinheiro viria. O Ministério Público não ofereceu acordo de não persecução penal porque Diogo seria reincidente: a folha mostra só uma condenação por lesão corporal em violência doméstica, com a pena extinta pelo cumprimento em 2017. O juiz recebeu a denúncia, e Diogo foi citado em 27/1/2025."
  q1: "Frederico, policial à paisana, apontou a arma para um cachorro feroz que avançava sobre crianças. Jonas, da janela, viu só um homem apontando uma arma para as crianças, sem notar o cachorro, e, sem o cuidado devido, atirou em Frederico, que morreu. O cachorro seguiu o ataque, e uma criança morreu só por causa dele. Jonas foi denunciado por dois homicídios dolosos."
  q2: "Rui, inconformado com o fim do namoro, divulgou fotos de Vânia nua e foi condenado a 1 ano e 4 meses, substituídos por prestação pecuniária e multa. O Ministério Público não recorreu. Vânia, intimada com a advogada, não se habilitou como assistente e discorda das penas substitutivas."
  q3: "Douglas foi condenado por participar de racha e absolvido da falsa identidade, por falta de provas. Só o Ministério Público apelou, e o Tribunal, por maioria, manteve a sentença. O Ministério Público opôs embargos infringentes, e você foi intimado para responder."
  q4: "Thiago, no semiaberto, cumpriu os requisitos para o aberto, mas o juiz condicionou a progressão a uma vaga na casa de albergado, que estava lotada. Depois do agravo, o juiz reconsiderou e permitiu a prisão domiciliar, desde que Thiago prestasse serviços à comunidade como condição especial do regime aberto."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["42-peca-1", "42-peca-5", "42-peca-7"]
perguntas:
  - id: 42-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: preliminar
    pergunta: "Que preliminar a defesa deve levantar quanto à entrada dos policiais na casa de Diogo?"
    tese: "Ilicitude da prova: a denúncia anônima, sozinha, não autoriza a entrada da polícia na casa sem mandado"
    aceitos: [ "ilicit* | inviolabilidade | fundadas razoes | fundada suspeita" ]
    artigos: [ "art. 5, XI, CRFB", "art. 157, CPP", "art. 5, LVI, CRFB" ]
    gabarito: "Preliminar: ilicitude do meio de obtenção da prova, tendo em vista ter sido obtida por meio ilícito, já que uma denúncia anônima é insuficiente para caracterizar a fundada suspeita de existência de flagrante delito, não autorizando o ingresso em domicílio, conforme trata o Art. 5º, inciso XI ou LVI, da CRFB/88 ou Art. 157, ou 241 ou 245, do CPP."
    revisao: { status: revisado }
  - id: 42-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: preliminar
    pergunta: "Que outra preliminar a defesa deve levantar contra a denúncia?"
    tese: "Inépcia da denúncia de lavagem de dinheiro, que não descreveu a infração penal antecedente"
    aceitos: [ "inepcia | inepta | ineptidao" ]
    artigos: [ "art. 41, CPP", "art. 2, § 1º, Lei 9.613" ]
    gabarito: "Inépcia da denúncia pois deixou de descrever todas as circunstâncias elementares do crime de lavagem de dinheiro, notadamente, a infração penal antecedente, nos termos do Art. 41 do CPP ou Art. 2º, § 1º, da Lei nº 9.613/98."
    revisao: { status: revisado }
  - id: 42-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Por que a recusa do acordo pela reincidência não procede?"
    tese: "Primariedade técnica: passou o período depurador de 5 anos entre a extinção da pena e o novo fato"
    aceitos: [ "primari* | periodo depurador | nao e reincidente | 5 anos | cinco anos" ]
    artigos: [ "art. 64, I, CP" ]
    gabarito: "Diogo é tecnicamente primário, diante do transcurso do período depurador entre o término da pena anterior e a data do novo fato, nos termos do Art. 64, inciso I, do CP."
    revisao: { status: revisado }
  - id: 42-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Que tese de mérito a defesa deve sustentar quanto à lavagem de dinheiro?"
    tese: "Atipicidade da lavagem de dinheiro: sem infração penal antecedente, guardar dinheiro não é crime"
    aceitos: [ "infracao antecedente | infracao penal antecedente | crime antecedente | atipic*" ]
    artigos: [ "art. 1, Lei 9.613" ]
    gabarito: "O delito de lavagem de dinheiro somente se tipifica se os recursos ocultados forem provenientes de outra infração penal, de forma que a conduta narrada na denúncia é atípica, não constituindo o fato infração penal."
    revisao: { status: revisado }
  - id: 42-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: pedido
    pergunta: "Que pedido a defesa deve fazer quanto à denúncia?"
    tese: "Rejeição da denúncia por inépcia e por falta de justa causa"
    aceitos: [ "rejeic* | rejeitar | rejeita" ]
    artigos: [ "art. 395, I, CPP", "art. 395, III, CPP" ]
    gabarito: "Rejeição da denúncia por inépcia (e/ou) por ausência de justa causa, na forma do Art. 395, inciso I, do CPP e inciso III."
    revisao: { status: revisado }
  - id: 42-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: pedido
    pergunta: "Que pedido a defesa deve fazer quanto ao acordo de não persecução penal recusado?"
    tese: "Remessa dos autos ao órgão superior do Ministério Público para rever a recusa do acordo de não persecução penal"
    aceitos: [ "orgao superior | remessa | procurador-geral | procurador geral" ]
    artigos: [ "art. 28-A, § 14, CPP" ]
    gabarito: "Remessa dos autos ao órgão superior do Ministério Público, na forma do Art. 28- A, § 14, do CPP."
    revisao: { status: revisado }
  - id: 42-peca-12
    categoria: peca-detalhe
    parte: peca
    item: "12"
    secao: pedido
    pergunta: "No mérito, que decisão a defesa deve pedir ao juiz?"
    tese: "Absolvição sumária, porque o fato narrado evidentemente não constitui crime"
    aceitos: [ "absolvicao sumaria | absolvido sumariamente | absolver sumariamente | absolvicao* sumaria*" ]
    artigos: [ "art. 397, III, CPP" ]
    gabarito: "Absolvição sumária, nos termos do Art. 397, inciso III, do CPP."
    revisao: { status: revisado }
  - id: 42-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que tese de direito penal a defesa deve sustentar quanto à morte de Frederico?"
    tese: "Legítima defesa putativa por erro evitável: Jonas responde por homicídio culposo"
    aceitos: [ "legitima defesa putativa | descriminante putativa | erro de tipo permissivo | culposo" ]
    artigos: [ "art. 20, § 1º, CP" ]
    gabarito: "Jonas não deve responder pelo homicídio doloso de Frederico, pois agiu em erro de tipo permissivo vencível ou inescusável, isto é, Jonas atirou em Frederico acreditando estar agindo em legítima defesa de terceiros (legítima defesa putativa ou descriminante putativa). Por isso, Jonas deve responder por homicídio culposo, na forma do Art. 20, § 1º, do Código Penal."
    revisao: { status: revisado }
  - id: 42-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que tese de direito penal a defesa deve sustentar quanto à morte da criança?"
    tese: "Falta de nexo causal quanto à morte da criança, que decorreu, por si só, do ataque do cachorro"
    aceitos: [ "nexo causal | nexo de causalidade | causalidade | causa independente | por si so" ]
    artigos: [ "art. 13, CP", "art. 13, § 1º, CP" ]
    gabarito: "Não há nexo de causalidade entre o atuar de Jonas e a morte da criança. A criança faleceu em decorrência de circunstância totalmente independente da conduta de Jonas, não podendo este, de acordo com a teoria da causalidade adequada, adotada pelo Art. 13 do Código Penal, ser responsabilizado pelo ataque do cachorro às crianças."
    revisao: { status: revisado }
  - id: 42-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que tese de direito penal leva à reforma das penas aplicadas a Rui?"
    tese: "Na violência doméstica e familiar contra a mulher, é vedada a pena só pecuniária, como a prestação pecuniária ou a multa isolada"
    aceitos: [ "vedad* | proibid* | so pecuniaria | pena pecuniaria | isolad*" ]
    artigos: [ "art. 17, Lei 11.340" ]
    gabarito: "Em relação ao Direito Penal aplicável, era essencial que o(a) examinando(a) identificasse que há, entre Rui e Vânia, uma relação íntima de afeto, ainda que já encerrada, o que atrai a incidência da lei de violência doméstica e familiar contra a mulher, de forma a ser inviável a aplicação isolada de pena pecuniária, nos termos do Art. 17 da Lei nº 11.340/2006."
    revisao: { status: revisado }
  - id: 42-q2-b
    categoria: discursiva
    parte: q2
    item: "B1"
    pergunta: "Que recurso Vânia pode interpor, e em que prazo?"
    tese: "Apelação supletiva da vítima não habilitada, em 15 dias, contados do fim do prazo do Ministério Público"
    aceitos: [ "apelacao supletiva | supletiva" ]
    artigos: [ "art. 598, CPP", "Súmula 448 STF" ]
    gabarito: "Apelação supletiva, no prazo de 15 (quinze) dias após o transcurso do prazo recursal do MP, nos termos do Art. 598 do CPP ou Súmula 448, do STF."
    revisao: { status: revisado }
  - id: 42-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que tese processual a defesa deve arguir contra os embargos do Ministério Público?"
    tese: "Os embargos infringentes são exclusivos da defesa: não cabem para o Ministério Público"
    aceitos: [ "exclusiv* | so da defesa | apenas da defesa | privativo da defesa | favor da defesa | inadmiss* | nao cabe" ]
    artigos: [ "art. 609, parágrafo único, CPP" ]
    gabarito: "O recurso de embargos infringentes é inadmissível, porquanto exclusivo em favor da defesa, nos termos do Art. 609, parágrafo único, do CPP."
    revisao: { status: revisado }
  - id: 42-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "A casa de albergado estava lotada. Isso pode impedir a progressão de Thiago?"
    tese: "A falta de vaga não mantém o preso em regime mais grave"
    aceitos: [ "falta de vaga* | ausencia de vaga* | inexistencia de vaga* | deficit de vaga* | nao pode permanecer | nao pode ficar | mais gravoso | mais grave" ]
    artigos: [ "Súmula Vinculante 56" ]
    gabarito: "Não. A falta de estabelecimento penal adequado não autoriza a manutenção do condenado em regime prisional mais gravoso, nos termos da Súmula Vinculante 56."
    revisao: { status: revisado }
  - id: 42-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Cabe impor a prestação de serviços à comunidade como condição especial do regime aberto?"
    tese: "A pena substitutiva não pode ser condição especial do regime aberto"
    aceitos: [ "nao pode ser condicao | inadmiss* | vedad* | bis in idem | nao cabe" ]
    artigos: [ "Súmula 493 STJ" ]
    gabarito: "Não. É inadmissível a fixação de pena substitutiva como condição especial ao regime aberto, nos termos do enunciado 493 da Súmula da Jurisprudência do Superior Tribunal de Justiça."
    revisao: { status: revisado }
