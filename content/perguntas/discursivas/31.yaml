# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "31"
introducoes:
  peca: "Rômulo, nascido em 4/4/1991, deu facadas nas mãos da esposa, Paola, em 2/1/2010, por ciúmes, com a intenção de matá-la em seguida. Comovido com o sofrimento dela, foi embora, sabendo que os golpes não bastavam para matá-la; o exame constatou lesões graves. O inquérito durou anos, e a denúncia por feminicídio tentado foi recebida em 24/1/2020, no júri de Maricá. Rômulo não foi intimado para a audiência em que foram ouvidas a vítima e as testemunhas, e a defesa protestou; depois, no interrogatório, ficou em silêncio. O juiz o pronunciou nos termos da denúncia. Você foi intimado da pronúncia."
  q1: "Sem inquérito, com base em vídeos da repartição, o Ministério Público denunciou Luciano por peculato doloso e Gilberto, funcionário que teria facilitado por descuido a subtração de R$ 2.000, por peculato culposo. Gilberto, reincidente, não teve oferecidos os benefícios despenalizadores. O juiz recebeu a denúncia de imediato, sem ouvir as partes, e marcou a audiência. Na véspera, Gilberto devolveu à Administração o valor do prejuízo. Você assumiu a defesa dele para os memoriais."
  q2: "Em 5/6/2019, Paulo, com a capacidade psicomotora alterada pelo álcool, avançou o sinal e atropelou Lúcia, que ficou com debilidade permanente no braço. Ele pagou as despesas dela, e Lúcia não quis representar. Mesmo assim, o Ministério Público o denunciou por lesão corporal culposa no trânsito, sob influência de álcool, e por embriaguez ao volante."
  q3: "Carlos foi condenado por transportar arma de uso permitido, em 2014, a 2 anos no regime aberto, substituídos por prestação de serviços e limitação de fim de semana; a sentença transitou em julgado para as duas partes em 25/11/2015. Ele se mudou para trabalhar em outra cidade sem avisar o juízo e não foi encontrado para começar a cumprir a pena. A pedido do Ministério Público, o juiz converteu de imediato as penas em prisão, e Carlos foi preso em 20/12/2019, ao renovar a carteira de motorista."
  q4: "Paulo furtou o dinheiro do caixa da loja de conveniência de um posto sem ser notado. Já do lado de fora, contou o que tinha feito à ex-namorada Jaqueline, que abastecia o carro, e pediu carona para sair dali; ela o levou embora com o dinheiro. Os dois foram denunciados por furto qualificado pelo concurso de agentes. O juiz negou a preventiva, mas suspendeu Jaqueline, primária, do exercício da atividade econômica: ela é dona de uma loja de roupas."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["31-peca-1", "31-peca-4", "31-peca-7", "31-peca-13"]
perguntas:
  - id: 31-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: pedido
    pergunta: "Ao interpor o recurso contra a pronúncia, o que a defesa deve pedir ao próprio juiz?"
    tese: "Juízo de retratação: o juiz pode reformar a pronúncia ao receber o recurso em sentido estrito"
    aceitos: [ "retrata* | efeito regressivo | reconsidera*" ]
    artigos: [ "art. 589, CPP" ]
    gabarito: "Pedido de exercício do juízo de retratação, nos termos do Art. 589 do CPP"
    revisao: { status: revisado }
  - id: 31-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: pedido
    pergunta: "Entre o fato e o recebimento da denúncia passaram mais de 10 anos. Que causa extingue a punibilidade de Rômulo?"
    tese: "Extinção da punibilidade pela prescrição da pretensão punitiva, calculada pela pena máxima em abstrato"
    aceitos: [ "prescri*" ]
    artigos: [ "art. 107, IV, CP", "art. 109, I, CP", "art. 115, CP" ]
    gabarito: "Pedido de extinção da punibilidade do agente em relação ao delito imputado na denúncia, em razão da prescrição da pretensão punitiva estatal pela pena em abstrato do crime de homicídio, nos termos do Art. 107, inciso IV, do CP OU 109, inciso I, c/c Art. 115, ambos do CP"
    revisao: { status: revisado }
  - id: 31-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Por que o prazo prescricional de Rômulo é de só 10 anos?"
    tese: "Prazo prescricional pela metade, porque o réu era menor de 21 anos na data do fato"
    aceitos: [ "metade | menor de 21 | 21 anos" ]
    artigos: [ "art. 115, CP" ]
    gabarito: "Entre a data do fato e do recebimento da denúncia foi ultrapassado o prazo prescricional aplicável de 10 anos OU entre a data do fato e do recebimento da denúncia foi ultrapassado o prazo prescricional do crime de homicídio, que deverá ser computado pela metade considerando a idade do réu na data do fato"
    revisao: { status: revisado }
  - id: 31-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Que preliminar a defesa deve levantar quanto à audiência sem a presença de Rômulo?"
    tese: "Nulidade da instrução por violação da ampla defesa (autodefesa): o réu não foi intimado para a audiência das testemunhas"
    aceitos: [ "ampla defesa | autodefesa | nulidade | nula | nulo" ]
    artigos: [ "art. 5, LV, CRFB", "art. 564, IV, CPP" ]
    gabarito: "O não comparecimento do réu configura violação ao princípio da ampla defesa, nos termos do Art. 5º, inciso LV, da CRFB"
    revisao: { status: revisado }
  - id: 31-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: pedido
    pergunta: "Sem crime doloso contra a vida, que decisão a defesa deve pedir no lugar da pronúncia?"
    tese: "Desclassificação, com a remessa do caso ao juízo singular"
    aceitos: [ "desclassifica*" ]
    artigos: [ "art. 419, CPP" ]
    gabarito: "Pedido de desclassificação para afastar o reconhecimento de crime doloso contra a vida, nos termos do Art. 419 do CPP"
    revisao: { status: revisado }
  - id: 31-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Rômulo foi embora por vontade própria, sabendo que os golpes não matariam Paola. Que tese afasta a tentativa de homicídio?"
    tese: "Desistência voluntária: o réu parou por vontade própria, sem circunstância alheia à vontade dele"
    aceitos: [ "desistencia voluntaria" ]
    artigos: [ "art. 15, CP" ]
    gabarito: "Houve desistência voluntária, já que Rômulo optou por não prosseguir na empreitada criminosa OU já que não ocorreram circunstâncias alheias à vontade do agente, nos termos do Art. 15 do CP"
    revisao: { status: revisado }
  - id: 31-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Reconhecida a desistência, por qual crime Rômulo pode responder?"
    tese: "Na desistência voluntária, o agente responde só pelos atos praticados: a lesão corporal grave"
    aceitos: [ "atos ja praticados | atos praticados | lesao corporal grave | lesao grave" ]
    artigos: [ "art. 15, CP", "art. 129, § 1º, CP" ]
    gabarito: "Rômulo deverá responder apenas pelos atos já praticados, qual seja de lesão corporal grave"
    revisao: { status: revisado }
  - id: 31-peca-12
    categoria: peca-detalhe
    parte: peca
    item: "12"
    secao: merito
    pergunta: "O feminicídio foi incluído no Código Penal em 2015. Que tese a defesa deve sustentar quanto a ele?"
    tese: "Afastamento do feminicídio, criado depois do fato: a lei penal mais grave não retroage"
    aceitos: [ [ "feminicidio", "afast* | exclu* | decote | nao incid* | nao se aplica" ], [ "irretroativ* | nao retroage" ] ]
    artigos: [ "art. 5, XL, CRFB", "art. 1, CP" ]
    gabarito: "Afastamento da qualificadora do feminicídio (OU do Art. 121, § 2º, inciso VI, do CP), em razão do princípio da irretroatividade da lei penal desfavorável, nos termos do Art. 5º, inciso XL, da CRFB"
    revisao: { status: revisado }
  - id: 31-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento de direito material evita a condenação de Gilberto?"
    tese: "Extinção da punibilidade no peculato culposo pela reparação do dano antes da sentença irrecorrível"
    aceitos: [ "repara* | ressarci*" ]
    artigos: [ "art. 312, § 3º, CP" ]
    gabarito: "Sim, o advogado de Gilberto poderá requerer a imediata extinção da punibilidade, tendo em vista que houve reparação do dano antes de ser proferida sentença irrecorrível. Gilberto foi denunciado pela prática do crime de peculato culposo, delito esse previsto no Art. 312, § 2º, do Código Penal. O Art. 312, § 3º, do CP, prevê uma peculiaridade para essa espécie de crime: a reparação do dano, se precede à sentença irrecorrível, extingue a punibilidade do agente. Em geral, a reparação do dano, quando antes da denúncia, poderá funcionar como causa de diminuição de pena do arrependimento posterior. Em crimes que não admitem arrependimento posterior ou quando a reparação do dano for posterior ao recebimento da denúncia, aplica-se, em regra, a atenuante prevista no Art. 65, inciso III, alínea b, do CP. Considerando, porém, a peculiaridade da natureza culposa do delito, admitiu o legislador a extinção da punibilidade no crime de peculato praticado culposamente."
    revisao: { status: revisado }
  - id: 31-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que argumento processual contesta toda a instrução?"
    tese: "Nulidade pela falta de notificação do funcionário público para a defesa preliminar, antes do recebimento da denúncia"
    aceitos: [ "defesa preliminar | resposta preliminar | defesa previa | notifica*" ]
    artigos: [ "art. 514, CPP" ]
    gabarito: "O argumento é o de que houve nulidade em razão da ausência de notificação do réu para apresentação de defesa prévia, desrespeitando-se o Art. 514 do CPP, que traz regras próprias para o procedimento dos crimes praticados por funcionário público. No caso, os crimes foram praticados por funcionários públicos contra a Administração Pública. Diante disso, antes mesmo do recebimento da denúncia, caberia notificação dos réus para apresentação de defesa, o que não foi determinado pelo magistrado, que recebeu a denúncia sem qualquer manifestação das partes. Cabe destacar que não se aplica a Súmula 330 do STJ, porque a ação penal não foi instruída por prévio inquérito policial. Diante do desrespeito à previsão do Art. 514 do CPP, caberia reconhecimento de que houve violação ao princípio da ampla defesa ou do devido processo legal."
    revisao: { status: revisado }
  - id: 31-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que tese de direito material contesta a tipificação dos dois crimes?"
    tese: "Consunção: a embriaguez ao volante é absorvida pela lesão corporal culposa qualificada pela influência de álcool"
    aceitos: [ "absorvid* | absorcao | absorve | consun*" ]
    artigos: [ "art. 303, § 2º, Lei 9.503", "art. 306, Lei 9.503" ]
    gabarito: "Para contestar a capitulação, deveria a defesa alegar aplicação do princípio da consunção, ficando o crime do Art. 306 do CTB absorvido pelo crime do Art. 303, § 2º, do CTB, tendo em vista que a circunstância da condução do veículo sob a influência de álcool, com capacidade psicomotora alterada, é elementar deste crime. Para que seja tipificada a forma qualificada do § 2º do Art. 303 da Lei 9.503/97, têm que restar demonstrada a conduta culposa do agente na direção de veículo automotor, o estado de embriaguez e o resultado lesão grave ou gravíssima. Presentes esses requisitos, a forma qualificada deve ser reconhecida, não podendo haver concurso com o crime do Art. 306 do mesmo diploma legal, porquanto aquele estado do agente é elementar do delito qualificado reconhecido."
    revisao: { status: revisado }
  - id: 31-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Sem a representação de Lúcia, o Ministério Público podia denunciar Paulo?"
    tese: "Ação pública incondicionada: sob influência de álcool, a lesão culposa no trânsito não depende de representação"
    aceitos: [ "incondicionada | nao depende de representacao | dispensa a representacao | desnecessaria a representacao | independe de representacao" ]
    artigos: [ "art. 291, § 1º, I, Lei 9.503" ]
    gabarito: "Sim, o Ministério Público tem legitimidade para oferecimento da denúncia na presente hipótese. A princípio, os crimes de lesão corporal culposa, praticados ou não na direção de veículo automotor, são de ação penal pública condicionada à representação, nos termos do Art. 88 da Lei nº 9.099/95. O Art. 291, §1º, do CTB confirma a aplicabilidade do Art. 88 da Lei nº 9.099/95. Ocorre que esse mesmo dispositivo legal traz exceções. Apesar de a vítima não ter querido representar contra o acusado, considerando que o motorista dirigia sob a influência de substância alcoólica, na forma do Art. 291 § 1º, inciso I, da Lei nº 9.503/97, a ação penal é pública incondicionada, tendo o Ministério Público legitimidade para o oferecimento da denúncia."
    revisao: { status: revisado }
  - id: 31-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que argumento processual contesta a conversão das penas em prisão?"
    tese: "Nulidade da conversão: o condenado devia ser intimado para justificar o descumprimento das penas restritivas de direitos"
    aceitos: [ "justifica* | ampla defesa | contraditorio | ouvido | oitiva" ]
    artigos: [ "art. 44, § 4º, CP", "art. 181, § 1º, LEP", "art. 5, LV, CRFB" ]
    gabarito: "A Pena Restritiva de Direito (PRD), em caso de descumprimento, poderá ser convertida em privativa de liberdade, desde que o descumprimento seja injustificado, nos termos do Art. 44, § 4º, do CP. Exatamente pela exigência de que o descumprimento seja injustificado que deve o apenado ser intimado para manifestação, em especial para esclarecer os motivos pelos quais não vem cumprindo a PRD imposta. Não se controverte que para garantir a efetividade das penas restritivas de direitos, faz-se necessária a existência de regras rígidas no sentido de que o seu descumprimento acarrete uma consequência rigorosa para o condenado faltoso. Assim, é prevista a conversão da PRD em PPL quando do seu descumprimento injustificado. Desta forma, antes da conversão, a defesa deve ser intimada para justificar aquele descumprimento, não podendo ser abandonados os princípios do contraditórido e da ampla defesa. Na hipótese, a conversão ocorreu sem a oitiva da defesa previamente, o que acarreta a nulidade da decisão respectiva."
    revisao: { status: revisado }
  - id: 31-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que argumento de direito material evita que Carlos cumpra a pena?"
    tese: "Prescrição da pretensão executória: passaram mais de 4 anos do trânsito em julgado sem que a pena começasse a ser cumprida"
    aceitos: [ "prescricao da pretensao executoria | prescricao executoria | pretensao executoria" ]
    artigos: [ "art. 110, CP", "art. 109, V, CP", "art. 112, I, CP", "art. 107, IV, CP" ]
    gabarito: "Sim, o argumento é o de que ocorreu prescrição da pretensão executória, de modo que deve ser reconhecida a extinção da punibilidade do agente. Transitada em julgado a decisão condenatória, se inicia o prazo da prescrição da pretensão executória, que tem por base a pena aplicada, nos termos do Art. 110 do CP. Na hipótese, foi aplicada a pena de 02 anos de reclusão, de modo que o prazo prescricional é de 04 anos, com base no Art. 109, inciso V, do CP. Entre a data do trânsito em julgado (25/11/15) e a data da prisão de Carlos (20/12/19) foi ultrapassado o prazo prescricional de 04 anos. Assim, deverá ser declarada extinta a punibilidade pela prescrição da pretensão executória, nos termos do Art. 107, inciso IV, do CP."
    revisao: { status: revisado }
  - id: 31-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que argumento de direito material contesta a imputação de furto qualificado a Jaqueline?"
    tese: "Não há participação no furto: a ajuda veio depois da consumação, sem liame subjetivo na subtração"
    aceitos: [ "nao concorreu | nao participou | nao ha participacao | depois da consumacao | apos a consumacao | sem liame | nao havia liame" ]
    artigos: [ "art. 29, CP" ]
    gabarito: "Narra o enunciado que Paulo praticou um crime de furto, já que subtraiu, sem violência ou grave ameaça à pessoa, dinheiro da loja de conveniência de determinado posto de gasolina. Após a consumação do delito, encontrou Jaqueline, sua ex-namorada, narrando sobre o crime praticado. Jaqueline, então, auxilia Paulo a deixar o local dos fatos. Após descoberta do ocorrido, o Ministério Público denunciou Jaqueline e Paulo pelo crime de furto qualificado pelo concurso de agentes, aplicando, dentre outras, a cautelar de suspensão do exercício de atividade de natureza econômica à Jaqueline.\n\nA. O argumento é o de que Jaqueline não praticou crime de furto, já que sua contribuição ocorreu após a consumação do delito patrimonial. Não há que se falar em participação após a consumação do delito, salvo se a contribuição, apesar de ocorrer após a consumação, já houver sido previamente ajustada. No caso em tela, Jaqueline não havia ajustado previamente com Paulo que o auxiliaria na empreitada criminosa, tendo concorrido para o crime somente após a consumação deste por Paulo. Sendo assim, não há que se falar em concurso de pessoas, não devendo Jaqueline responder pela prática do furto qualificado. Nesse sentido, Paulo deveria responder apenas pelo crime de furto simples (Art. 155, caput, do CP).\n\nB. Nos termos do Art. 319 do CPP é possível ao magistrado aplicar medidas cautelares alternativas. Para evitar a prisão, incentiva-se a aplicação de medidas cautelares alternativas. Ademais, o Art. 319, inciso VI, do CPP, prevê que poderá ser aplicada cautelar de suspensão do exercício da função pública ou de atividade de natureza econômica, desde que haja justo receio de sua utilização para prática de novas infrações penais.\n\nO simples fato de Jaqueline ser denunciada por crime contra o patrimônio (de maneira inadequada, ainda!) não torna a medida de suspensão da atividade de natureza econômica adequada, qual seja atuar em comércio de roupas em estabelecimento do qual seria proprietária. Jaqueline era primária, de bons antecedentes e sem qualquer envolvimento pretérito com o aparato policial ou judicial, nada no enunciado permitindo concluir que haveria justo receio na utilização da atividade econômica para prática de novas infrações."
    revisao: { status: revisado }
  - id: 31-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que argumento contesta a suspensão da atividade econômica de Jaqueline?"
    tese: "Descabimento da suspensão da atividade econômica: não há justo receio de que a loja seja usada para novas infrações"
    aceitos: [ "justo receio | receio | nao ha relacao | sem relacao | nao tem relacao" ]
    artigos: [ "art. 319, VI, CPP", "art. 282, II, CPP" ]
    gabarito: "Narra o enunciado que Paulo praticou um crime de furto, já que subtraiu, sem violência ou grave ameaça à pessoa, dinheiro da loja de conveniência de determinado posto de gasolina. Após a consumação do delito, encontrou Jaqueline, sua ex-namorada, narrando sobre o crime praticado. Jaqueline, então, auxilia Paulo a deixar o local dos fatos. Após descoberta do ocorrido, o Ministério Público denunciou Jaqueline e Paulo pelo crime de furto qualificado pelo concurso de agentes, aplicando, dentre outras, a cautelar de suspensão do exercício de atividade de natureza econômica à Jaqueline.\n\nA. O argumento é o de que Jaqueline não praticou crime de furto, já que sua contribuição ocorreu após a consumação do delito patrimonial. Não há que se falar em participação após a consumação do delito, salvo se a contribuição, apesar de ocorrer após a consumação, já houver sido previamente ajustada. No caso em tela, Jaqueline não havia ajustado previamente com Paulo que o auxiliaria na empreitada criminosa, tendo concorrido para o crime somente após a consumação deste por Paulo. Sendo assim, não há que se falar em concurso de pessoas, não devendo Jaqueline responder pela prática do furto qualificado. Nesse sentido, Paulo deveria responder apenas pelo crime de furto simples (Art. 155, caput, do CP).\n\nB. Nos termos do Art. 319 do CPP é possível ao magistrado aplicar medidas cautelares alternativas. Para evitar a prisão, incentiva-se a aplicação de medidas cautelares alternativas. Ademais, o Art. 319, inciso VI, do CPP, prevê que poderá ser aplicada cautelar de suspensão do exercício da função pública ou de atividade de natureza econômica, desde que haja justo receio de sua utilização para prática de novas infrações penais.\n\nO simples fato de Jaqueline ser denunciada por crime contra o patrimônio (de maneira inadequada, ainda!) não torna a medida de suspensão da atividade de natureza econômica adequada, qual seja atuar em comércio de roupas em estabelecimento do qual seria proprietária. Jaqueline era primária, de bons antecedentes e sem qualquer envolvimento pretérito com o aparato policial ou judicial, nada no enunciado permitindo concluir que haveria justo receio na utilização da atividade econômica para prática de novas infrações."
    revisao: { status: revisado }
