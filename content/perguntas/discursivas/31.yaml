  - id: 31-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Carlos, 43 anos, foi flagrado, no dia 10 de março de 2014, transportando arma de fogo de uso permitido. Foi denunciado, processado e condenado à pena de 02 anos de reclusão, a ser cumprida em regime aberto, e multa de 10 dias, à razão unitária mínima, sendo a pena privativa de liberdade substituída por duas penas restritivas de direitos, consistentes em prestação de serviços à comunidade e limitação de final de semana. A decisão transitou em julgado, para ambas as partes, em 25 de novembro de 2015.

      Após a condenação definitiva, Carlos conseguiu emprego fixo em cidade diferente daquela em que morava e fora condenado, para onde se mudou, deixando de comunicar tal fato ao juizo respectivo, não sendo encontrado no endereço constante nos autos para dar início à execução da pena. Por tal motivo, o juiz, provocado pelo Ministério Público converteu, de imediato, as penas restritivas de direitos em pena privativa de liberdade, determinando a expedição de mandado de prisão.

      A ordem de prisão foi cumprida em 20 de dezembro de 2019, quando Carlos foi ao DETRAN/RJ objetivando a renovação de sua habilitação, certo que, após aquele fato, nunca se envolveu em qualquer outro ilícito penal.

      Desesperada, a família procura você, na condição de advogado(a), para a adoção das medidas cabíveis.

      Considerando a situação apresentada, responda, na condição de advogado(a) de Carlos, aos itens a seguir.
    comando: Para questionar a decisão do magistrado de converter a pena restritiva de direitos em privativa de liberdade e expedir mandado de prisão, qual o argumento de direito processual a ser apresentado? Justifique.
    gabarito: A Pena Restritiva de Direito (PRD), em caso de descumprimento, poderá ser convertida em privativa de liberdade, desde que o descumprimento seja injustificado, nos termos do Art. 44, § 4º, do CP. Exatamente pela exigência de que o descumprimento seja injustificado que deve o apenado ser intimado para manifestação, em especial para esclarecer os motivos pelos quais não vem cumprindo a PRD imposta. Não se controverte que para garantir a efetividade das penas restritivas de direitos, faz-se necessária a existência de regras rígidas no sentido de que o seu descumprimento acarrete uma consequência rigorosa para o condenado faltoso. Assim, é prevista a conversão da PRD em PPL quando do seu descumprimento injustificado. Desta forma, antes da conversão, a defesa deve ser intimada para justificar aquele descumprimento, não podendo ser abandonados os princípios do contraditórido e da ampla defesa. Na hipótese, a conversão ocorreu sem a oitiva da defesa previamente, o que acarreta a nulidade da decisão respectiva.
    opcoes:
      correta: A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
  - id: 31-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      Carlos, 43 anos, foi flagrado, no dia 10 de março de 2014, transportando arma de fogo de uso permitido. Foi denunciado, processado e condenado à pena de 02 anos de reclusão, a ser cumprida em regime aberto, e multa de 10 dias, à razão unitária mínima, sendo a pena privativa de liberdade substituída por duas penas restritivas de direitos, consistentes em prestação de serviços à comunidade e limitação de final de semana. A decisão transitou em julgado, para ambas as partes, em 25 de novembro de 2015.

