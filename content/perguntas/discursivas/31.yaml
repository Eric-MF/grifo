    comando: Qual o argumento de direito processual a ser apresentado em memoriais para questionar toda a instrução produzida?
    gabarito: O argumento é o de que houve nulidade em razão da ausência de notificação do réu para apresentação de defesa prévia, desrespeitando-se o Art. 514 do CPP, que traz regras próprias para o procedimento dos crimes praticados por funcionário público. No caso, os crimes foram praticados por funcionários públicos contra a Administração Pública. Diante disso, antes mesmo do recebimento da denúncia, caberia notificação dos réus para apresentação de defesa, o que não foi determinado pelo magistrado, que recebeu a denúncia sem qualquer manifestação das partes. Cabe destacar que não se aplica a Súmula 330 do STJ, porque a ação penal não foi instruída por prévio inquérito policial. Diante do desrespeito à previsão do Art. 514 do CPP, caberia reconhecimento de que houve violação ao princípio da ampla defesa ou do devido processo legal.
    opcoes:
      correta: O argumento é de que houve nulidade em razão da ausência de notificação do réu para apresentação de defesa prévia, antes do recebimento da denúncia, nos termos do Art. 514 do CPP
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
