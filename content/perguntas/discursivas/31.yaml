      A ordem de prisão foi cumprida em 20 de dezembro de 2019, quando Carlos foi ao DETRAN/RJ objetivando a renovação de sua habilitação, certo que, após aquele fato, nunca se envolveu em qualquer outro ilícito penal.

      Desesperada, a família procura você, na condição de advogado(a), para a adoção das medidas cabíveis.

      Considerando a situação apresentada, responda, na condição de advogado(a) de Carlos, aos itens a seguir.
    comando: Existe argumento de direito material a ser apresentado para evitar que Carlos cumpra a sanção penal imposta na sentença? Justifique.
    gabarito: Sim, o argumento é o de que ocorreu prescrição da pretensão executória, de modo que deve ser reconhecida a extinção da punibilidade do agente. Transitada em julgado a decisão condenatória, se inicia o prazo da prescrição da pretensão executória, que tem por base a pena aplicada, nos termos do Art. 110 do CP. Na hipótese, foi aplicada a pena de 02 anos de reclusão, de modo que o prazo prescricional é de 04 anos, com base no Art. 109, inciso V, do CP. Entre a data do trânsito em julgado (25/11/15) e a data da prisão de Carlos (20/12/19) foi ultrapassado o prazo prescricional de 04 anos. Assim, deverá ser declarada extinta a punibilidade pela prescrição da pretensão executória, nos termos do Art. 107, inciso IV, do CP.
    opcoes:
      correta: Sim, o argumento seria de que ocorreu a prescrição da pretensão executória, com consequente extinção da punibilidade do agente, conforme o Art. 107, inciso IV, do CP, OU o Art. 109, inciso V, do CP, OU o Art. 110 do CP.
      erradas:
