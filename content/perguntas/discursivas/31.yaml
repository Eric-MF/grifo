    opcoes:
      correta: O argumento é o de que a cautelar de suspensão da atividade de natureza econômica exige que haja justo receio em sua utilização para a prática de novas infrações penais, o que não restou configurado na hipótese, conforme Art. 319, inciso VI, OU Art. 282, inciso II, ambos do CPP.
