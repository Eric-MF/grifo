  - id: 31-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Após receber informações de que teria ocorrido subtração de valores públicos por funcionários públicos no exercício da função, inclusive com vídeo das câmeras de segurança da repartição registrando o ocorrido, o Ministério Público ofereceu, sem prévio inquérito policial, uma única denúncia em face de Luciano e Gilberto, em razão da conexão, pela suposta prática do crime de peculato, sendo que, ao primeiro, foi imputada conduta dolosa e, ao segundo, conduta culposa.

      De acordo com a denúncia, Gilberto, funcionário público, com violação do dever de cuidado, teria contribuído para a subtração de R$ 2.000,00 de repartição pública por parte de Luciano, que teria tido sua conduta facilitada pelo cargo público que exercia. Diante da reincidência de Gilberto, já condenado definitivamente por roubo, não foram à ele oferecidos os institutos despenalizadores.

      O magistrado, de imediato, sem manifestação das partes, recebeu a denúncia e designou audiência de instrução e julgamento. No dia anterior à audiência, Gilberto ressarciu a Administração do prejuízo causado. Com a juntada de tal comprovação, após a audiência, foram os autos encaminhados às partes para apresentação de alegações finais.

      O Ministério Público, diante da confirmação dos fatos, requereu a condenação dos réus nos termos da denúncia.

      Insatisfeito com a assistência técnica que recebia, Gilberto procura você para, na condição de advogado(a), assumir a causa e apresentar memoriais.

      Com base nas informações expostas, responda, como advogado(a) contratado por Gilberto, aos itens a seguir.
    comando: Existe argumento de direito material a ser apresentado em favor de Gilberto para evitar sua condenação?
    gabarito: "Sim, o advogado de Gilberto poderá requerer a imediata extinção da punibilidade, tendo em vista que houve reparação do dano antes de ser proferida sentença irrecorrível. Gilberto foi denunciado pela prática do crime de peculato culposo, delito esse previsto no Art. 312, § 2º, do Código Penal. O Art. 312, § 3º, do CP, prevê uma peculiaridade para essa espécie de crime: a reparação do dano, se precede à sentença irrecorrível, extingue a punibilidade do agente. Em geral, a reparação do dano, quando antes da denúncia, poderá funcionar como causa de diminuição de pena do arrependimento posterior. Em crimes que não admitem arrependimento posterior ou quando a reparação do dano for posterior ao recebimento da denúncia, aplica-se, em regra, a atenuante prevista no Art. 65, inciso III, alínea b, do CP. Considerando, porém, a peculiaridade da natureza culposa do delito, admitiu o legislador a extinção da punibilidade no crime de peculato praticado culposamente."
    opcoes:
      correta: Sim, o argumento de que ocorreu extinção da punibilidade diante da reparação do dano pelo réu, pagamento esse que precedeu sentença irrecorrível, nos termos do Art. 312, § 3º, do CP.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
