  - id: 31-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Em 05 de junho de 2019, Paulo dirigia veículo automotor em via pública, com capacidade psicomotora alterada em razão da influência de álcool, ocasião em que veio a atropelar Lúcia por avançar cruzamento com o sinal fechado para os veículos. Lúcia sofreu lesões que a deixaram com debilidade permanente no braço, o que foi reconhecido pelo laudo pericial respectivo, também ficando comprovado o estado clínico em que se encontrava o motorista atropelador. Considerando que Paulo arcou com as despesas que Lúcia teve que despender em razão do evento, a vítima não quis representar contra ele. Inobstante tal manifestação da vítima, o Ministério Público denunciou Paulo pela prática dos injustos do Art. 303, § 2º, e do Art. 306, ambos da Lei nº 9.503/97.

      Considerando as informações narradas, esclareça, na condição de advogado(a), aos seguintes questionamentos formulados por Paulo, interessado em constituí-lo para apresentação de resposta à acusação.
    comando: Qual a tese jurídica de direito material que a defesa de Paulo deverá alegar para contestar a tipificação apresentada?
    gabarito: Para contestar a capitulação, deveria a defesa alegar aplicação do princípio da consunção, ficando o crime do Art. 306 do CTB absorvido pelo crime do Art. 303, § 2º, do CTB, tendo em vista que a circunstância da condução do veículo sob a influência de álcool, com capacidade psicomotora alterada, é elementar deste crime. Para que seja tipificada a forma qualificada do § 2º do Art. 303 da Lei 9.503/97, têm que restar demonstrada a conduta culposa do agente na direção de veículo automotor, o estado de embriaguez e o resultado lesão grave ou gravíssima. Presentes esses requisitos, a forma qualificada deve ser reconhecida, não podendo haver concurso com o crime do Art. 306 do mesmo diploma legal, porquanto aquele estado do agente é elementar do delito qualificado reconhecido.
    opcoes:
      correta: O crime do Art. 306, do CTB deve ser absorvido pelo crime do Art. 303, § 2º, do CTB, em razão da aplicação do princípio da consunção OU já que a capacidade psicomotora alterada em razão de álcool é elementar do crime de lesão corporal.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
  - id: 31-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Em 05 de junho de 2019, Paulo dirigia veículo automotor em via pública, com capacidade psicomotora alterada em razão da influência de álcool, ocasião em que veio a atropelar Lúcia por avançar cruzamento com o sinal fechado para os veículos. Lúcia sofreu lesões que a deixaram com debilidade permanente no braço, o que foi reconhecido pelo laudo pericial respectivo, também ficando comprovado o estado clínico em que se encontrava o motorista atropelador. Considerando que Paulo arcou com as despesas que Lúcia teve que despender em razão do evento, a vítima não quis representar contra ele. Inobstante tal manifestação da vítima, o Ministério Público denunciou Paulo pela prática dos injustos do Art. 303, § 2º, e do Art. 306, ambos da Lei nº 9.503/97.

      Considerando as informações narradas, esclareça, na condição de advogado(a), aos seguintes questionamentos formulados por Paulo, interessado em constituí-lo para apresentação de resposta à acusação.
    comando: Diante da ausência de representação por parte da ofendida, o Ministério Público teria legitimidade para propor ação penal contra Paulo?
    gabarito: Sim, o Ministério Público tem legitimidade para oferecimento da denúncia na presente hipótese. A princípio, os crimes de lesão corporal culposa, praticados ou não na direção de veículo automotor, são de ação penal pública condicionada à representação, nos termos do Art. 88 da Lei nº 9.099/95. O Art. 291, §1º, do CTB confirma a aplicabilidade do Art. 88 da Lei nº 9.099/95. Ocorre que esse mesmo dispositivo legal traz exceções. Apesar de a vítima não ter querido representar contra o acusado, considerando que o motorista dirigia sob a influência de substância alcoólica, na forma do Art. 291 § 1º, inciso I, da Lei nº 9.503/97, a ação penal é pública incondicionada, tendo o Ministério Público legitimidade para o oferecimento da denúncia.
    opcoes:
      correta: Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
