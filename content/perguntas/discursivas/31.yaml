    gabarito: Nulidade da pronúncia OU nulidade da instrução, tendo em vista que o réu não foi intimado para audiência em que foram ouvidas as testemunhas
    opcoes:
      correta: Nulidade da pronúncia OU nulidade da instrução, tendo em vista que o réu não foi intimado para audiência em que foram ouvidas as testemunhas
      erradas:
        - Ilegitimidade/ilicitude da interceptação telefônica por tratar-se de crime apenado com detenção OU por não terem sido esgotados previamente os meios de investigação.
        - "Prescrição da pretensão punitiva: pena máxima de 4 anos prescreve em 8, mas a ré era menor de 21 anos e o prazo corre pela metade (CP, arts. 109, IV, 115 e 126)."
        - Nulidade do processo, com a consequente extinção da punibilidade pela prescrição.
        - Preliminarmente, reconhecimento da nulidade dos atos da instrução.
        - Nulidade em razão da ausência de exame de corpo de delito, direto ou indireto, nos termos do Art. 158 do CPP.
