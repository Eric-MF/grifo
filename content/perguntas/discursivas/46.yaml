  - id: 46-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Rafael foi denunciado por estupro de vulnerável na modalidade tentada, na forma do Art. 217-A, combinado com o Art. 14, inciso II, ambos do CP, porque, no dia indicado na denúncia, em uma festa, ao ver Fernanda desacordada após grande ingestão de álcool, decidiu com ela praticar conjunção carnal.

      Para tanto, Rafael adentrou o quarto onde Fernanda estava repousada mas, nesse momento, repensou seu plano, pois também havia consumido bebida alcóolica. Por isso, por estar ligeiramente cansado, mesmo tendo condições físicas de continuar, mudou de ideia e resolveu dormir, sem encostar em Fernanda.

      O Juiz, ao receber a denúncia, decretou a prisão preventiva de Rafael, de ofício, com base em lei municipal que determina a decretação de prisão pelo Juiz, independentemente de requerimento do Ministério Público, sempre que houver recebimento de denúncia por delitos hediondos.

      Rafael constituiu você, como advogado(a), para atuar em sua defesa. Assim, responda aos itens a seguir.
    comando: Qual a tese correta de Direito Penal a ser defendida? Justifique.
    gabarito: Em favor de Rafael, deve ser alegada a ocorrência de desistência voluntária, na forma do Art. 15 do CP ou atipicidade da conduta por serem meros atos preparatórios.
    opcoes:
      correta: Desistência voluntária, nos termos do Art. 15 do CP ou atipicidade da conduta por serem meros atos preparatórios.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Aplicação do perdão judicial, nos termos do Art. 121, § 5º, do CP.
        - A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
    revisao: *a1
