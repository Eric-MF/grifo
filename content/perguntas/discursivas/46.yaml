# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "46"
introducoes:
  peca: "Jorge foi denunciado por integrar a milícia privada de Adilson, armada, que explora jogos de azar, contravenção penal, na Zona Leste de Flores. Policiais o abordaram e nada acharam, mas, por uma denúncia anônima, vasculharam o celular dele sem sua autorização e acharam mensagens a Adilson, a quem chamava de “chefe”. Só com esses dados ele foi denunciado, sem que a denúncia dissesse qual era a função dele na milícia. O juiz recebeu a denúncia, e Jorge foi citado em 8/6/2026."
  q1: "Numa festa, Rafael viu Fernanda desacordada pela bebida e decidiu manter relação sexual com ela. Entrou no quarto, mas, cansado, mudou de ideia, embora pudesse continuar, e foi dormir sem tocar nela. Foi denunciado por estupro de vulnerável tentado, e o juiz decretou de ofício a preventiva, com base numa lei municipal que manda prender sempre que recebida denúncia por crime hediondo."
  q2: "Clovis, de 81 anos, atirou várias vezes em Fábio, de 50, para matá-lo, mas errou a pontaria e matou Yuri, de 12 anos. Foi preso em flagrante por homicídio qualificado pela idade da vítima, e a polícia e o Ministério Público pediram, com base concreta, a conversão em preventiva na audiência de custódia."
  q3: "Luana, primária, cumpria 4 anos no semiaberto por tortura e fugiu em 10/1/2021, depois de cumprir 2 anos e 1 mês. Foi recapturada em 10/2/2025 e, em processo disciplinar regular, teve reconhecida a falta grave da fuga e decretada a perda de todos os dias remidos."
  q4: "Oscar, primário, foi condenado por lesão corporal leve contra a esposa, Adriana, a 2 anos de reclusão no regime aberto, com todas as circunstâncias judiciais favoráveis. A sentença nada disse sobre benefícios penais."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["46-peca-1"]
perguntas:
  - id: 46-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: preliminar
    pergunta: "Que preliminar a defesa deve levantar contra a denúncia?"
    tese: "Inépcia da denúncia, que não descreveu nenhuma conduta de Jorge na milícia"
    aceitos: [ "inepcia | inepta | inepto | ineptidao" ]
    artigos: [ "art. 41, CPP" ]
    gabarito: "Preliminarmente, deve ser arguida a inépcia da denúncia, que não descreve qualquer conduta típica praticada pelo acusado no contexto do delito de milícia privada, nos termos do Art. 41 do CPP."
    revisao: { status: revisado }
  - id: 46-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Que tese a defesa deve sustentar quanto às mensagens tiradas do celular de Jorge?"
    tese: "Ilicitude da prova: os policiais vasculharam o celular de Jorge sem autorização judicial"
    aceitos: [ "ilicit* | autorizacao judicial | ordem judicial" ]
    artigos: [ "art. 5, XII, CRFB", "art. 5, X, CRFB" ]
    gabarito: "Ilicitude do meio de obtenção da prova, diante da necessidade de autorização judicial para acesso a dados telemáticos armazenados em dispositivos eletrônicos, nos termos do Art. 5º, inciso XII, da CRFB/88."
    revisao: { status: revisado }
  - id: 46-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "A milícia explorava jogos de azar. Que tese de mérito isso permite?"
    tese: "Atipicidade da milícia privada, que exige a finalidade de praticar crimes do Código Penal, e não contravenções"
    aceitos: [ "atipic* | so crimes | crimes do codigo penal | crimes previstos no codigo" ]
    artigos: [ "art. 288-A, CP" ]
    gabarito: "Mérito: atipicidade da conduta, porque o crime de milícia privada pressupõe a prática de crimes previstos no Código Penal, ao passo que a milícia supostamente existente se destina à prática de contravenção, (ou) prevista em lei especial."
    revisao: { status: revisado }
  - id: 46-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: pedido
    pergunta: "Que pedido a defesa deve fazer quanto às provas tiradas do celular?"
    tese: "Desentranhamento das provas ilícitas"
    aceitos: [ "desentranh*" ]
    artigos: [ "art. 157, CPP", "art. 5, LVI, CRFB" ]
    gabarito: "Deve ser requerido o desentranhamento das provas ilícitas, nos termos do Art. 157 do CPP, ou do Art. 5º, inciso LVI, da CRFB/88."
    revisao: { status: revisado }
  - id: 46-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: pedido
    pergunta: "Que pedido a defesa deve fazer, já que a denúncia não descreve a conduta de Jorge?"
    tese: "Rejeição da denúncia por inépcia"
    aceitos: [ "rejeic* | rejeit*", "inepcia | inepta | inepto | ineptidao" ]
    artigos: [ "art. 395, I, CPP" ]
    gabarito: "Rejeição da denúncia por inépcia da inicial nos termos do Art. 395, inciso I, do CPP."
    revisao: { status: revisado }
  - id: 46-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: pedido
    pergunta: "Que outro pedido a defesa deve fazer, já que a prova que sustenta a denúncia é ilícita?"
    tese: "Rejeição da denúncia por falta de justa causa"
    aceitos: [ "rejeic* | rejeit*", "justa causa" ]
    artigos: [ "art. 395, III, CPP" ]
    gabarito: "Rejeição da denúncia por ausência de justa causa, nos termos do Art. 395, inciso III, do CPP."
    revisao: { status: revisado }
  - id: 46-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: pedido
    pergunta: "No mérito, que decisão a defesa deve pedir ao juiz?"
    tese: "Absolvição sumária, porque o fato narrado evidentemente não constitui crime"
    aceitos: [ "absolvicao sumaria | absolvido sumariamente | absolver sumariamente | absolvicao* sumaria*" ]
    artigos: [ "art. 397, III, CPP" ]
    gabarito: "Absolvição sumária, em razão de o fato não constituir infração penal, nos termos do Art. 397, inciso III, do CPP."
    revisao: { status: revisado }
  - id: 46-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que tese de direito penal favorece Rafael?"
    tese: "Desistência voluntária: Rafael parou por vontade própria, sem nem tocar em Fernanda"
    aceitos: [ "desistencia voluntaria | desistencia | atos preparatorios | preparatori*" ]
    artigos: [ "art. 15, CP" ]
    gabarito: "Em favor de Rafael, deve ser alegada a ocorrência de desistência voluntária, na forma do Art. 15 do CP ou atipicidade da conduta por serem meros atos preparatórios."
    revisao: { status: revisado }
  - id: 46-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Com base na Constituição, que tese afasta a lei municipal?"
    tese: "Inconstitucionalidade da lei municipal: só a União legisla sobre processo penal"
    aceitos: [ "inconstitucional* | uniao | competencia privativa" ]
    artigos: [ "art. 22, I, CRFB", "art. 5, LVII, CRFB" ]
    gabarito: "Inconstitucionalidade da lei municipal, pois apenas a União pode legislar sobre Direito Processual Penal, na forma do Art. 22, inciso I, da CRFB/88, ou inconstitucionalidade da lei municipal, por violação aos princípios do devido processo legal, ou presunção de inocência, ou ampla defesa e/ou contraditório, na forma do Art. 5º, inciso LIV, ou LV, ou LVII, da CRFB/88."
    revisao: { status: revisado }
  - id: 46-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que pedido processual a defesa de Clovis deve fazer na audiência de custódia?"
    tese: "Substituição da preventiva por prisão domiciliar, porque Clovis tem mais de 80 anos"
    aceitos: [ "domiciliar" ]
    artigos: [ "art. 318, I, CPP" ]
    gabarito: "Deve ser requerida a concessão de prisão domiciliar, nos termos do Art. 318, inciso I, do CPP."
    revisao: { status: revisado }
  - id: 46-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que tese de direito penal a defesa de Clovis deve sustentar?"
    tese: "Erro na execução: Clovis responde como se tivesse atingido Fábio, e a qualificadora da idade da vítima é afastada"
    aceitos: [ "erro na execucao | erro de execucao | aberratio ictus | aberratio" ]
    artigos: [ "art. 73, CP", "art. 20, § 3º, CP" ]
    gabarito: "A ocorrência de erro na execução, devendo Clovis responder como se tivesse atingido a pessoa pretendida, afastando-se a qualificadora, nos termos do Art. 73 do CP."
    revisao: { status: revisado }
  - id: 46-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que tese de direito penal extingue a execução da pena de Luana?"
    tese: "Prescrição da pretensão executória: o restante da pena, de menos de 2 anos, prescreve em 4 anos, que passaram entre a fuga e a recaptura"
    aceitos: [ "prescricao da pretensao executoria | prescricao executoria | pretensao executoria" ]
    artigos: [ "art. 113, CP", "art. 109, V, CP", "art. 112, II, CP", "art. 107, IV, CP" ]
    gabarito: "A extinção da punibilidade pela ocorrência de prescrição da pretensão executória, pois o prazo restante da pena é inferior a dois anos, remetendo-se ao prazo prescricional de quatro anos, lapso temporal já decorrido entre a data da fuga e da recaptura, nos termos do Art. 109, inciso V, (ou) o Art. 113, (ou) o Art. 117, inciso V, todos do Código Penal."
    revisao: { status: revisado }
  - id: 46-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que fundamento contesta a perda de todos os dias remidos?"
    tese: "A perda dos dias remidos pela falta grave é limitada a 1/3"
    aceitos: [ "1/3 | um terco | ate um terco" ]
    artigos: [ "art. 127, LEP" ]
    gabarito: "A falta grave apenas permite a revogação de até um terço dos dias remidos, nos termos do Art. 127 da LEP."
    revisao: { status: revisado }
  - id: 46-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que medida a defesa deve usar diante da omissão da sentença?"
    tese: "Embargos de declaração para suprir a omissão da sentença"
    aceitos: [ "embargos de declaracao | embargos declaratorios" ]
    artigos: [ "art. 382, CPP" ]
    gabarito: "Devem ser opostos embargos de declaração, nos termos do Art. 382 do CPP."
    revisao: { status: revisado }
  - id: 46-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que benefício penal cabe a Oscar?"
    tese: "Suspensão condicional da pena, que cabe mesmo na violência doméstica, em que a substituição por restritivas de direitos é vedada"
    aceitos: [ "suspensao condicional da pena | sursis" ]
    artigos: [ "art. 77, CP" ]
    gabarito: "Sim. É cabível a suspensão condicional da pena ou sursis penal, nos termos do Art. 77 do Código Penal."
    revisao: { status: revisado }
