  - id: 38-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Elisa e Cláudio são vizinhos e mantinham relação de animosidade, com inúmeras brigas por motivos diversos. Certo dia, após uma destas brigas, Elisa decidiu quebrar os espelhos retrovisores do veículo de Cláudio, estacionado na garagem do condomínio.

      Cláudio, de posse dos vídeos das câmeras de vigilância, que flagraram a ação de Elisa, ajuizou queixa-crime em desfavor desta, pela prática de delito previsto no Art. 163, caput, do Código Penal.

      Em alegações finais, o advogado de Cláudio refutou a alegação de Elisa, no sentido de ter ocorrido prescrição da pretensão punitiva, pois a ré é reincidente (ostenta condenação anterior, transitada em julgado, pelo delito de ameaça, extinta há menos de cinco anos), razão pela qual deve se considerar o prazo prescricional de 4 (quatro) anos, ou seja, acrescido de um terço, conforme previsto no Código Penal e, ao fim, requereu apenas a "aplicação do melhor direito, para que seja feita justiça", sem formular pedido de condenação da ré.

      Considere ter decorrido 3 (três) anos e 6 (seis) meses desde a data do recebimento da queixa até a presente data.

      Na qualidade de advogado de Elisa, responda aos itens a seguir.
    comando: Qual a tese de Direito Penal deve ser postulada pela defesa de Elisa? Justifique.
    gabarito: Em relação ao Direito Penal aplicável, deve-se postular pelo reconhecimento da prescrição da pretensão punitiva, pois, nos termos da Súmula 220 do STJ, a reincidência não influi no prazo de prescrição da pretensão punitiva. Assim, tendo havido o transcurso de mais de 3 anos desde a data do recebimento da queixa-crime, sem que tenha sido prolatada sentença, é imperioso concluir pela ocorrência da prescrição da pretensão punitiva. Como o próprio dispositivo legal se refere à prescrição "após o trânsito em julgado", também admite-se, com igual pontuação, a referência ao Art. 110 do CP.
    opcoes:
      correta: A extinção da punibilidade pela prescrição, pois reincidência não influi no prazo de prescrição da pretensão punitiva, na forma da Súmula 220 do STJ ou do Art. 110, caput, do CP.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
    revisao: *a1
  - id: 38-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
      Elisa e Cláudio são vizinhos e mantinham relação de animosidade, com inúmeras brigas por motivos diversos. Certo dia, após uma destas brigas, Elisa decidiu quebrar os espelhos retrovisores do veículo de Cláudio, estacionado na garagem do condomínio.

      Cláudio, de posse dos vídeos das câmeras de vigilância, que flagraram a ação de Elisa, ajuizou queixa-crime em desfavor desta, pela prática de delito previsto no Art. 163, caput, do Código Penal.

      Em alegações finais, o advogado de Cláudio refutou a alegação de Elisa, no sentido de ter ocorrido prescrição da pretensão punitiva, pois a ré é reincidente (ostenta condenação anterior, transitada em julgado, pelo delito de ameaça, extinta há menos de cinco anos), razão pela qual deve se considerar o prazo prescricional de 4 (quatro) anos, ou seja, acrescido de um terço, conforme previsto no Código Penal e, ao fim, requereu apenas a "aplicação do melhor direito, para que seja feita justiça", sem formular pedido de condenação da ré.

      Considere ter decorrido 3 (três) anos e 6 (seis) meses desde a data do recebimento da queixa até a presente data.

      Na qualidade de advogado de Elisa, responda aos itens a seguir.
    comando: Qual a tese de Direito Processual Penal deve ser suscitada por Elisa? Justifique.
    gabarito: A tese de direito processual a ser defendida pela defesa de Elisa é a perempção, nos termos do Art. 60, inciso III, do CPP, pois não houve o pedido de condenação da acusada nas alegações finais.
    opcoes:
      correta: Extinção da punibilidade pela perempção, na forma do Art. 60, inciso III, parte final, do CPP.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - O requerimento a ser formulado é de substituição da prisão preventiva por prisão domiciliar, nos termos do Art. 318, inciso IV, do CPP.
        - Em preliminar de defesa, deve ser alegada a extinção de punibilidade pela decadência, tendo em vista que Paulo deixou de oferecer representação no prazo de 6 meses, conhecendo a autoria desde a data do fato, conforme estabelecido no Art. 38 do CPP c/c. o Art. 107, inciso IV, do CP.
    revisao: *a1
