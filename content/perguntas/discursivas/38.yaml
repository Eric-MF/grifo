    item: B
    caso: |-
      Alberto, primário e com bons antecedentes, foi condenado pela prática de peculato a uma pena de 2 (dois) anos de reclusão.

      Na fixação da pena, o Juiz considerou boas as circunstâncias judiciais do Art. 59 do CP, fixando a pena-base no mínimo legal e, à míngua de agravantes ou causas de aumento ou diminuição, tornou esta pena definitiva. Ao fixar o regime inicial, de forma contraditória, o magistrado asseverou que "as circunstâncias judiciais são negativas, pois o delito de peculato é de extrema gravidade, diante da lesão ao patrimônio público", razão pela qual fixou o regime inicial semiaberto. Em seguida, substituiu as penas por restritivas de direitos, porque "presentes os pressupostos legais, sendo favoráveis as circunstâncias judiciais, na forma do Art. 59 e do Art. 44, ambos do CP".

      Na qualidade de advogado(a) de Alberto, responda às perguntas a seguir.
    comando: Qual o fundamento de direito material a ser defendido em favor de Alberto? Justifique.
    gabarito: O fundamento de direito material é que a opinião do julgador sobre a gravidade abstrata do delito não autoriza a fixação de regime inicial mais severo que o permitido pela pena aplicada, consoante enunciados das Súmulas 718 ou 719 do STF ou 440 do STJ ou do Art. 33, § 2º, do CP.
    opcoes:
      correta: A opinião do julgador sobre a gravidade abstrata do delito não autoriza a fixação de regime inicial mais gravoso que o permitido pela pena aplicada, nos termos das Súmulas 718 ou 719 do STF ou 440 do STJ ou do Art. 33 § 2º, do CP.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
