# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "38"
introducoes:
  peca: "Marieta, servidora do INSS, foi condenada em três processos por inserir dados falsos no sistema do INSS, sempre do mesmo modo, para conceder benefícios indevidos, em 15/9, 10/10 e 3/11/2017. Em cada um, a pena de 2 anos e 10 dias-multa foi substituída por duas restritivas de direitos, e as condenações transitaram em julgado em novembro e dezembro de 2022. O juiz da execução somou as penas, como em concurso material, chegou a 6 anos no regime fechado, dizendo que ela era reincidente nos dois últimos fatos, ajustou a multa para 90 dias-multa, converteu as penas restritivas em prisão e mandou expedir mandado de prisão. Você foi intimado da decisão."
  q1: "Alberto, primário e de bons antecedentes, foi condenado por peculato a 2 anos, com pena-base no mínimo porque as circunstâncias judiciais eram favoráveis. Mesmo assim, o juiz fixou o regime semiaberto, dizendo que as circunstâncias seriam negativas pela gravidade do peculato, e depois substituiu a pena por restritivas de direitos, de novo por serem favoráveis as circunstâncias."
  q2: "Rodrigo ameaçou a namorada, Bárbara, e lhe deu tapas no rosto, deixando equimoses. Ela registrou o fato e disse querer vê-lo processado, mas não foi ao IML nem precisou de atendimento médico. Rodrigo foi denunciado por lesão corporal contra a mulher e por ameaça."
  q3: "Rodrigo desfilava num bloco de carnaval fantasiado de presidente do banco de uma cidade fictícia e levava notas impressas em papel A4 com os dizeres “dólar de Ratzana” e o brasão dessa cidade. Foi preso em flagrante por moeda falsa, e o auto foi lavrado sem ouvir o preso, os policiais condutores ou qualquer testemunha."
  q4: "Elisa quebrou os retrovisores do carro do vizinho Cláudio, que ofereceu queixa-crime por dano. Nas alegações finais, o advogado de Cláudio disse que a pretensão não estava extinta porque Elisa é reincidente, o que aumentaria o prazo em um terço, e pediu só a “aplicação do melhor direito”, sem pedir a condenação. Passaram 3 anos e 6 meses desde o recebimento da queixa."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["38-peca-1", "38-peca-5", "38-peca-6-2", "38-peca-10", "38-peca-11", "38-peca-12", "38-q2-a"]
perguntas:
  - id: 38-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: pedido
    pergunta: "Ao recorrer, o que a defesa deve pedir ao próprio juiz da execução?"
    tese: "Juízo de retratação: o juiz da execução pode reformar a decisão ao receber o agravo"
    aceitos: [ "retrat* | reconsidera* | efeito regressivo" ]
    artigos: [ "art. 589, CPP" ]
    gabarito: "Pedido de retratação, na forma do Art. 589 do CPP."
    revisao: { status: revisado }
  - id: 38-peca-6-1
    categoria: peca-detalhe
    parte: peca
    item: "6.1"
    secao: merito
    pergunta: "Os três crimes foram da mesma espécie, com o mesmo modo de execução, em poucas semanas. Como as penas devem ser unificadas?"
    tese: "Unificação das penas pela continuidade delitiva, com exasperação, e não pela soma do concurso material"
    aceitos: [ "continuidade delitiva | crime continuado | continuacao delitiva | exaspera*" ]
    artigos: [ "art. 71, CP", "art. 111, LEP" ]
    gabarito: "Unificação de penas pela continuidade delitiva, na forma do Art. 71, caput, do CP, ou Art. 111 da LEP, devendo ser aplicada a lógica do sistema da exasperação."
    revisao: { status: revisado }
  - id: 38-peca-6-3
    categoria: peca-detalhe
    parte: peca
    item: "6.3"
    secao: merito
    pergunta: "Que tese a defesa deve sustentar quanto à multa ajustada para 90 dias-multa?"
    tese: "A multa não pode ser ajustada à nova pena: segue a continuidade delitiva ou, no máximo, soma as multas aplicadas"
    aceitos: [ [ "multa", "continuidade | exaspera*" ], [ "multa", "soma* | somatorio | cumulativ*" ] ]
    artigos: [ "art. 72, CP" ]
    gabarito: "Repercussão da continuidade delitiva na pena de multa ou promoção da soma das penas de multa aplicadas, consoante entendimento jurisprudencial do Superior Tribunal de Justiça ou na forma do Art. 72 do CP."
    revisao: { status: revisado }
  - id: 38-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Que tese a defesa deve sustentar quanto à conversão das penas restritivas de direitos?"
    tese: "Manutenção das penas restritivas de direitos: são compatíveis entre si e podem ser cumpridas simultânea ou sucessivamente, sem conversão em prisão"
    aceitos: [ "compativ* | simultane* | sucessiva* | manutencao da substituicao" ]
    artigos: [ "art. 69, § 2º, CP", "art. 44, § 5º, CP", "art. 181, § 1º, LEP" ]
    gabarito: "Manutenção da substituição da pena privativa de liberdade por penas restritivas de direito, pois as penas alternativas são compatíveis entre si, podendo ser executadas de forma simultânea ou sucessiva ou por estar fora das hipóteses legais de conversão, na forma do Art. 69, § 2º, do CP, ou do Art. 44, §§ 4º e 5º, do CP ou Art. 181, § 1º, da LEP."
    revisao: { status: revisado }
  - id: 38-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "O juiz considerou Marieta reincidente nos dois últimos fatos. Que tese a defesa deve opor?"
    tese: "Afastamento da reincidência: não havia condenação transitada em julgado antes dos crimes seguintes"
    aceitos: [ [ "reincid*", "afast* | ausencia | inexist* | nao ha | nao houve | nao configura*" ], [ "nao e reincidente | primaria" ] ]
    artigos: [ "art. 63, CP" ]
    gabarito: "Afastamento da reincidência, uma vez que não houve trânsito em julgado de condenação antes da prática do novo crime, na forma do Art. 63 do CP."
    revisao: { status: revisado }
  - id: 38-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Com a continuidade delitiva e sem reincidência, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto ou semiaberto, conforme a pena unificada da ré primária"
    aceitos: [ "aberto | semiaberto | semi-aberto | semi aberto" ]
    artigos: [ "art. 33, § 2º, c, CP", "art. 33, § 2º, b, CP" ]
    gabarito: "Portanto, deve haver manutenção do regime inicial aberto ou semiaberto, na forma do Art. 33, § 2º, alínea c ou b, do CP."
    revisao: { status: revisado }
  - id: 38-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que medida a defesa deve usar para sanar a contradição da sentença, e em que prazo?"
    tese: "Embargos de declaração, no prazo de 2 dias, para sanar a contradição da sentença"
    aceitos: [ "embargos de declaracao | embargos declaratorios" ]
    artigos: [ "art. 382, CPP" ]
    gabarito: "Tendo em vista que o enunciado relata situação de contradição no julgado, e espera peça a ser oposta pela defesa, são cabíveis embargos de declaração, no prazo de dois dias, na forma do Art. 382 do CPP."
    revisao: { status: revisado }
  - id: 38-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que argumento de direito material favorece Alberto quanto ao regime?"
    tese: "A gravidade em abstrato do crime não justifica regime mais severo que o permitido pela pena"
    aceitos: [ "gravidade em abstrato | gravidade abstrata | opiniao do julgador | abstrat*" ]
    artigos: [ "Súmula 718 STF", "Súmula 719 STF", "Súmula 440 STJ", "art. 33, § 2º, c, CP" ]
    gabarito: "O fundamento de direito material é que a opinião do julgador sobre a gravidade abstrata do delito não autoriza a fixação de regime inicial mais severo que o permitido pela pena aplicada, consoante enunciados das Súmulas 718 ou 719 do STF ou 440 do STJ ou do Art. 33, § 2º, do CP."
    revisao: { status: revisado }
  - id: 38-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Bárbara não foi ao IML. Que tese a defesa deve sustentar quanto à prova da lesão corporal?"
    tese: "Falta de prova da materialidade: a lesão deixa vestígios e exige exame de corpo de delito ou laudo médico"
    aceitos: [ "vestigio* | nao transeunte | materialidade | exame de corpo de delito | laudo" ]
    artigos: [ "art. 158, CPP", "art. 12, § 3º, Lei 11.340" ]
    gabarito: "O delito de lesão corporal deixa vestígios, por sua natureza não transeunte, tornando-se indispensável o exame de corpo de delito ou boletim de atendimento médico, na forma do Art. 158, do CPP ou Art. 12, § 3º, da Lei nº 11.340/06, sem o que não há prova da materialidade do fato."
    revisao: { status: revisado }
  - id: 38-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que tese de direito penal favorece Rodrigo?"
    tese: "Atipicidade: as notas fictícias, sem curso legal em nenhum país e incapazes de enganar, não ofendem a fé pública (crime impossível)"
    aceitos: [ "crime impossivel | curso legal | fe publica | atipic* | grosseira" ]
    artigos: [ "art. 17, CP", "art. 289, CP" ]
    gabarito: "O delito de moeda falsa é doloso e exige que a falsificação seja eficiente para abalar a fé pública e que a moeda tenha curso legal no Brasil ou no estrangeiro. Logo, a descrição do enunciado indica que Rodrigo possuía um documento evidentemente inidôneo para tal fim (seja por incapacidade de abalar a fé pública, seja por não ter curso legal em qualquer país ou por ausência de dolo), tratando-se de absoluta impropriedade do objeto, diante a falsificação grosseira. Assim, deve ser alegada a atipicidade da conduta de Rodrigo, ante a impossibilidade de consumação do crime (crime impossível por absoluta impropriedade do objeto), na forma do Art. 17 do CP."
    revisao: { status: revisado }
  - id: 38-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que tese processual garante a liberdade de Rodrigo?"
    tese: "Relaxamento da prisão: o auto de prisão em flagrante não seguiu as formalidades legais"
    aceitos: [ "relaxamento | relaxar | nulidade | nulo | nula" ]
    artigos: [ "art. 304, CPP", "art. 310, I, CPP", "art. 5, LXV, CRFB" ]
    gabarito: "Deve ser alegada a nulidade da prisão em flagrante com o consequente relaxamento da prisão, na forma do Art. 310, inciso I, do CPP, ou do Art. 5º, inciso LXV, da CRFB/88, pois o auto de prisão em flagrante não observou as formalidades exigidas pelo Art. 304, caput, do CPP, notadamente, a oitiva do custodiado ou do condutor do flagrante ou da testemunha, ou a entrega da nota de culpa ao custodiado."
    revisao: { status: revisado }
  - id: 38-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que tese de direito penal a defesa de Elisa deve postular?"
    tese: "Prescrição da pretensão punitiva: a reincidência não aumenta o prazo dessa prescrição, só o da executória"
    aceitos: [ "nao influi | nao aumenta o prazo | reincidencia nao aumenta | so o da executoria | so na executoria | apenas na executoria" ]
    artigos: [ "Súmula 220 STJ", "art. 110, CP", "art. 109, VI, CP" ]
    gabarito: "Em relação ao Direito Penal aplicável, deve-se postular pelo reconhecimento da prescrição da pretensão punitiva, pois, nos termos da Súmula 220 do STJ, a reincidência não influi no prazo de prescrição da pretensão punitiva. Assim, tendo havido o transcurso de mais de 3 anos desde a data do recebimento da queixa-crime, sem que tenha sido prolatada sentença, é imperioso concluir pela ocorrência da prescrição da pretensão punitiva. Como o próprio dispositivo legal se refere à prescrição \"após o trânsito em julgado\", também admite-se, com igual pontuação, a referência ao Art. 110 do CP."
    revisao: { status: revisado }
  - id: 38-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que tese processual a defesa de Elisa deve suscitar?"
    tese: "Extinção da punibilidade pela perempção: o querelante não pediu a condenação nas alegações finais"
    aceitos: [ "perempc* | perempta" ]
    artigos: [ "art. 60, III, CPP" ]
    gabarito: "A tese de direito processual a ser defendida pela defesa de Elisa é a perempção, nos termos do Art. 60, inciso III, do CPP, pois não houve o pedido de condenação da acusada nas alegações finais."
    revisao: { status: revisado }
