    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Unificação de penas pela continuidade delitiva, na forma do Art. 71, caput, do CP, ou Art. 111 da LEP, devendo ser aplicada a lógica do sistema da exasperação.
    opcoes:
      correta: Unificação de penas pela continuidade delitiva, na forma do Art. 71, caput, do CP, ou Art. 111 da LEP, devendo ser aplicada a lógica do sistema da exasperação.
      erradas:
        - Desenvolvimento jurídico acerca da concessão do livramento condicional, pois a fundamentação trazida pelo magistrado é equivocada.
        - Não há reincidência, pois o furto foi cometido antes do trânsito em julgado definitivo do estelionato, ausentes os pressupostos do Art. 63 do CP.
        - Aplicação da causa de diminuição do Art. 33, § 4º, da Lei nº 11.343; substituição da pena privativa de liberdade por restritiva de direitos; aplicação de regime inicial aberto.
        - No mérito, absolvição de Lauro.
        - Ainda de maneira subsidiária, afastamento da causa de aumento imputada na denúncia, tendo em vista que somente aplicável ao homicídio culposo ou tendo em vista que foi imputada a prática do crime de homicídio doloso
    revisao: *a1
