  - id: 38-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Bárbara e Rodrigo são namorados e ambos são maiores e plenamente capazes. Em uma discussão, Rodrigo proferiu diversas ameaças e desferiu tapas no rosto de Bárbara, deixando-o bastante vermelho (equimoses).

      Bárbara, então, se dirigiu à Delegacia de Polícia e relatou o ocorrido, mostrando as mensagens de texto com o conteúdo das ameaças, afirmando expressamente o desejo de ver Rodrigo processado.

      Ao finalizar o boletim de ocorrência, a autoridade policial forneceu encaminhamento de Bárbara ao Instituto Médico Legal para a realização do exame de corpo de delito. Contudo, Bárbara não realizou o referido exame, nem necessitou de qualquer atendimento médico posterior, já que as lesões corporais não eram graves.

      Rodrigo foi denunciado pela prática de lesão corporal (Art. 129, § 13, do CP) e ameaça (Art. 147 do CP), e o recebimento da peça acusatória ainda não foi analisado pelo juízo. Bárbara, então, informou ao advogado de Rodrigo seu desejo de se retratar da representação.

      Considerando apenas as informações do enunciado, na condição de advogado de Rodrigo responda aos questionamentos a seguir.
    comando: Se cabível, qual a forma e o alcance da retratação da representação? Justifique.
    gabarito: Apenas o delito de ameaça, por estar sujeito à representação (Art. 147, parágrafo único, do CP), admite a retratação da representação, que deve observar a forma do Art. 16 da Lei nº 11.340/06, qual seja, em audiência especialmente designada para tal fim, antes do recebimento da denúncia. Já o delito de lesão corporal, nos termos da Súmula 542 do STJ, está sujeito à ação penal pública incondicionada, sendo inadmissível, portanto, a retratação.
    opcoes:
      correta: Quanto ao alcance, apenas o delito de ameaça, por estar sujeito à representação, admite a renúncia da representação (ou no delito de lesão corporal no âmbito da violência doméstica e familiar contra a mulher, a ação penal é pública incondicionada, o que torna incabível a renúncia ou retratação da representação). Quanto à forma, em audiência especialmente designada para tal fim antes do recebimento da denúncia, na forma do Art. 16 da Lei 11.340/06.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
