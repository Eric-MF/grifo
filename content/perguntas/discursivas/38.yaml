      Marieta também foi condenada em idêntica pena, em outro processo, por infração ao Art. 313-A do Código Penal, porque em 15/09/2017, valendo-se do mesmo modus operandi, concedeu benefício previdenciário indevido em favor de Luíza, gerando prejuízo ao erário no montante de R$ 81.000,00 (oitenta e um mil reais). Ainda, Marieta foi condenada em um terceiro processo, por infração ao Art. 313-A do Código Penal, consoante mesmo modus operandi e com aplicação da mesma pena de dois anos de reclusão e 10 dias-multa, por inserir dados falsos no sistema informatizado e assim conceder benefício previdenciário fraudulento em favor de Anastácia, com prejuízo ao erário de R$ 120.000,00 (cento e vinte mil reais), fato ocorrido em 03/11/2017.

      As referidas condenações transitaram em julgado nos dias 10/11/2022, 21/11/2022 e 02/12/2022, respectivamente, e todas elas substituíram as penas privativas de liberdade por duas restritivas de direitos. Marieta não possui outros processos em sua folha de antecedentes criminais.

      As cartas de execução de sentença foram tombadas ao Juízo de execução penal da Vara Federal Criminal de Alfa (vinculada ao Tribunal Regional Federal da 10ª Região) em datas próximas. O Juízo, à luz das três cartas de execução definitivas, proferiu decisão somando as penas, na forma do Art. 69, do Código Penal, fixando a pena total de 6 (seis) anos de reclusão, em regime fechado, considerando que houve reincidência de Marieta quando da realização do segundo e terceiro fato, após já ter realizado o primeiro ato delituoso. Quanto à pena de multa, promoveu a readequação, consoante proporcionalidade à nova pena privativa de liberdade fixada, estabelecendo-a em 90 dias-multa. Determinou a conversão das penas restritivas de direito em privativas de liberdade e a expedição de mandado de prisão para o início de cumprimento das penas.

      A intimação da decisão ocorreu no dia 25/08/2023, sexta-feira. O mandado de prisão foi expedido na mesma data, pendente de cumprimento.

      Na qualidade de advogado de Marieta já constituído nos autos, redija a peça processual cabível, diferente de embargos de declaração e habeas corpus, para garantir os direitos de sua assistida, devendo ser deduzida toda a matéria de direito processual e material cabível. A peça deverá ser datada do último dia do prazo, levando-se em conta que segunda a sexta-feira são dias úteis em todo o país. (Valor: 5,00)

      Obs.: o examinando deve abordar todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A mera citação do dispositivo legal não confere pontuação.
    comando: Qual o prazo da peça e o seu fundamento?
    gabarito: "Prazo: 1º de setembro de 2023."
    opcoes:
      correta: "Prazo: 1º de setembro de 2023."
      erradas:
        - "Tempestividade: Prazo de 5 dias na forma do Art. 593, caput, do CPP."
        - "Tempestividade: prazo de 05 dias."
        - "Tempestividade: prazo de cinco dias, na forma do Art. 593, caput, do CPP."
        - Prazo de 3 (três) dias, na forma do Art. 600, §1º, do CPP.
        - "Tempestividade: prazo de cinco dias."
    revisao: *a1
  - id: 38-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Alberto, primário e com bons antecedentes, foi condenado pela prática de peculato a uma pena de 2 (dois) anos de reclusão.

      Na fixação da pena, o Juiz considerou boas as circunstâncias judiciais do Art. 59 do CP, fixando a pena-base no mínimo legal e, à míngua de agravantes ou causas de aumento ou diminuição, tornou esta pena definitiva. Ao fixar o regime inicial, de forma contraditória, o magistrado asseverou que "as circunstâncias judiciais são negativas, pois o delito de peculato é de extrema gravidade, diante da lesão ao patrimônio público", razão pela qual fixou o regime inicial semiaberto. Em seguida, substituiu as penas por restritivas de direitos, porque "presentes os pressupostos legais, sendo favoráveis as circunstâncias judiciais, na forma do Art. 59 e do Art. 44, ambos do CP".

      Na qualidade de advogado(a) de Alberto, responda às perguntas a seguir.
    comando: Qual peça processual deverá ser oposta pela defesa de Alberto para sanar a contradição na sentença e em que prazo? Justifique.
    gabarito: Tendo em vista que o enunciado relata situação de contradição no julgado, e espera peça a ser oposta pela defesa, são cabíveis embargos de declaração, no prazo de dois dias, na forma do Art. 382 do CPP.
    opcoes:
      correta: Embargos de declaração, no prazo de dois dias, na forma do Art. 382 do CPP.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - Mencionar o princípio da consunção OU o princípio da absorção.
        - "Habeas Corpus. / Art. 5º, LXVIII, CRFB/88 OU Art. 647 do CPP OU Art. 648, incisos I ou VI do CPP. Obs.: a mera citação do artigo não pontua."
        - O requerimento a ser formulado é de substituição da prisão preventiva por prisão domiciliar, nos termos do Art. 318, inciso IV, do CPP.
        - Em preliminar de defesa, deve ser alegada a extinção de punibilidade pela decadência, tendo em vista que Paulo deixou de oferecer representação no prazo de 6 meses, conhecendo a autoria desde a data do fato, conforme estabelecido no Art. 38 do CPP c/c. o Art. 107, inciso IV, do CP.
