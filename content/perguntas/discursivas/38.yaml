  - id: 38-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Rodrigo estava desfilando em um bloco de carnaval fantasiado de "Presidente do Banco Nacional" da fictícia cidade de "Ratzana", trajando fantasia e adornos carnavalescos.

      Ao ser abordado por um Policial Militar, foi realizada a busca pessoal, tendo sido localizado com Rodrigo notas impressas em papel "A4" onde se lia "dólar de Ratzana", com o símbolo e brasão da fictícia cidade. A Polícia Militar imediatamente realizou a prisão-captura de Rodrigo, e a autoridade policial competente lavrou o auto de prisão em flagrante, enquadrando a conduta de Rodrigo ao Art. 289, § 1º, do Código Penal, sem proceder, contudo, à oitiva do custodiado e dos Policiais Militares condutores do flagrante, ou mesmo de qualquer testemunha, sem justificativa. Em seguida, encaminhou a "nota de culpa" acompanhada da lavratura do auto de prisão em flagrante à Justiça competente, na forma da lei processual penal.

      Considerando as informações do enunciado, como advogado de Rodrigo, responda aos itens a seguir.
    comando: Qual a tese de Direito Penal a ser deduzida em favor de Rodrigo? Justifique.
    gabarito: O delito de moeda falsa é doloso e exige que a falsificação seja eficiente para abalar a fé pública e que a moeda tenha curso legal no Brasil ou no estrangeiro. Logo, a descrição do enunciado indica que Rodrigo possuía um documento evidentemente inidôneo para tal fim (seja por incapacidade de abalar a fé pública, seja por não ter curso legal em qualquer país ou por ausência de dolo), tratando-se de absoluta impropriedade do objeto, diante a falsificação grosseira. Assim, deve ser alegada a atipicidade da conduta de Rodrigo, ante a impossibilidade de consumação do crime (crime impossível por absoluta impropriedade do objeto), na forma do Art. 17 do CP.
    opcoes:
      correta: Crime impossível ou ausência de elementar do tipo (curso legal em qualquer país ou aptidão de abalar a fé pública ou dolo), excluindo a tipicidade da conduta.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - "Habeas Corpus. / Art. 5º, LXVIII, CRFB/88 OU Art. 647 do CPP OU Art. 648, incisos I ou VI do CPP. Obs.: a mera citação do artigo não pontua."
        - O requerimento a ser formulado é de substituição da prisão preventiva por prisão domiciliar, nos termos do Art. 318, inciso IV, do CPP.
        - Em preliminar de defesa, deve ser alegada a extinção de punibilidade pela decadência, tendo em vista que Paulo deixou de oferecer representação no prazo de 6 meses, conhecendo a autoria desde a data do fato, conforme estabelecido no Art. 38 do CPP c/c. o Art. 107, inciso IV, do CP.
