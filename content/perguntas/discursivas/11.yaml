    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: "Ausência de dolo eventual: além da previsão do resultado, o dolo eventual exige que o agente assuma o risco de produzi-lo, nos termos do Art. 18, I, parte final, do CP (teoria do consentimento)."
    opcoes:
      correta: "Ausência de dolo eventual: além da previsão do resultado, o dolo eventual exige que o agente assuma o risco de produzi-lo, nos termos do Art. 18, I, parte final, do CP (teoria do consentimento)."
      erradas:
        - Ausência de prova da materialidade do aborto por inexistência de perícia que vincule o óbito à substância abortiva.
