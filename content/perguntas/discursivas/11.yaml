  - id: 11-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Daniel foi denunciado, processado e condenado pela prática do delito de roubo simples em sua modalidade tentada. A pena fixada pelo magistrado foi de dois anos de reclusão em regime aberto. Todavia, atento às particularidades do caso concreto, o referido magistrado concedeu-lhe o beneficio da suspensão condicional da execução da pena, sendo certo que, na sentença, não fixou nenhuma condição. Somente a defesa interpôs recurso de apelação, pleiteando a absolvição de Daniel com base na tese de negativa de autoria e, subsidiariamente, a substituição do beneficio concedido por uma pena restritiva de direitos. O Tribunal de Justiça, por sua vez, no julgamento da apelação, de forma unânime, negou provimento aos dois pedidos da defesa e, no acórdão, fixou as condições do sursis, haja vista o fato de que o magistrado a quo deixou de fazê-lo na sentença condenatória.

      Nesse sentido, atento apenas às informações contidas no texto, responda, fundamentadamente, aos itens a seguir.
    comando: Qual o recurso cabível contra a decisão do Tribunal de Justiça?
    gabarito: Cabível a interposição de recurso especial, com fulcro no Art. 105, III, a, da CRFB/88.
    opcoes:
      correta: Recurso especial, com fulcro no Art. 105, III, a, da CRFB/88.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - "O crime é de injúria, pois apenas foi atribuída qualidade negativa e não houve narração de um fato delitivo, conforme o Art. 140 do CP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - Sim. O argumento é que não há vedação legal para oferecimento de transação porque a condenação anterior de Rodrigo foi apenas ao cumprimento de pena de multa e não de pena privativa de liberdade, nos termos do Art. 76, §2º, inciso I, da Lei 9.099/95
        - Carta testemunhável, na forma do Art. 639, inciso I, do CPP.
