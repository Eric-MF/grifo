  - id: 11-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      O Juiz da Vara de Execuções Penais da Comarca “Y” converteu a medida restritiva de direitos (que fora imposta em substituição à pena privativa de liberdade) em cumprimento de pena privativa de liberdade imposta no regime inicial aberto, sem fixar quaisquer outras condições.

      O Ministério Público, inconformado, interpôs recurso alegando, em síntese, que a decisão do referido Juiz da Vara de Execuções Penais acarretava o abrandamento da pena, estimulando o descumprimento das penas alternativas ao cárcere.

      O recurso, devidamente contra-arrazoado, foi submetido a julgamento pela Corte Estadual, a qual, de forma unânime, resolveu lhe dar provimento. A referida Corte fixou como condição especial ao cumprimento de pena no regime aberto, com base no Art. 115 da LEP, a prestação de serviços à comunidade, o que deveria perdurar por todo o tempo da pena a ser cumprida no regime menos gravoso.

      Atento ao caso narrado e considerando apenas os dados contidos no enunciado, responda fundamentadamente, aos itens a seguir.
    comando: Qual foi o recurso interposto pelo Ministério Público contra a decisão do Juiz da Vara de Execuções Penais?
    gabarito: |-
      A. Agravo em Execução (Art. 197 da LEP).

      B. Não, pois de acordo com o verbete 493 da Súmula do STJ, é inadmissível a fixação de pena substitutiva (Art. 44 do CP) como condição especial ao regime aberto.

      Ademais, embora ao Juiz seja lícito estabelecer condições especiais para a concessão do regime aberto, em complementação daquelas previstas na LEP (Art. 115 da LEP), não poderá adotar a esse título nenhum efeito já classificado como pena substitutiva (Art. 44 do CPB), porque aí ocorreria o indesejável bis in idem, importando na aplicação de dúplice sanção.

      Ademais, o Art. 44 do Código Penal é claro ao afirmar a natureza autônoma das penas restritivas de direitos que, por sua vez, visam substituir a sanção corporal imposta àqueles condenados por infrações penais mais leves. Diante do caráter substitutivo das sanções restritivas, vedada está sua cumulatividade com a pena privativa de liberdade, salvo expressa previsão legal, o que não é o caso.

      Precedente: STJ - Habeas Corpus n. 218.352 - SP (2011/0218345-1)
    opcoes:
      correta: Agravo em execução, com fundamento no Art. 197 da LEP.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - "O crime é de injúria, pois apenas foi atribuída qualidade negativa e não houve narração de um fato delitivo, conforme o Art. 140 do CP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - Sim. O argumento é que não há vedação legal para oferecimento de transação porque a condenação anterior de Rodrigo foi apenas ao cumprimento de pena de multa e não de pena privativa de liberdade, nos termos do Art. 76, §2º, inciso I, da Lei 9.099/95
        - A tese de mérito é a da atipicidade por insignificância da conduta, pois a União está dispensada de ajuizar ações de cobrança de tributos cujo valor esteja aquém do patamar de R$ 20.000.00 (vinte mil reais), com as atualizações efetivadas pelas Portarias nº 75 e 130, ambas do Ministério da Fazenda ou R$ 1.000,00 (mil reais) nos termos do Art. 20, § 2º, da Lei nº 10.522/02.
    revisao: *a1
