# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "11"
introducoes:
  peca: "Jerusa, atrasada mas dentro do limite de velocidade, ultrapassou um carro numa via de mão dupla sem ligar a seta e atingiu Diogo, motociclista que vinha em alta velocidade no sentido contrário; ela mesma chamou o socorro, mas ele morreu. O Ministério Público a denunciou por homicídio doloso, com dolo eventual, sustentando que ela não previu o resultado, e o juiz a pronunciou. Você é o advogado de Jerusa, intimado da pronúncia em 2/8/2013."
  q1: "O juiz da execução converteu a pena restritiva de direitos em privativa de liberdade no regime aberto, sem outras condições. O Ministério Público recorreu, e o tribunal fixou, como condição especial do regime aberto, a prestação de serviços à comunidade durante toda a pena."
  q2: "Daniel foi condenado por roubo tentado a 2 anos, com suspensão condicional da pena, mas a sentença não fixou as condições. Só a defesa apelou, e o Tribunal de Justiça negou os pedidos e fixou, ele mesmo, as condições do sursis."
  q3: "Ricardo cometeu um roubo em 10/11/2007 (condenação transitada em julgado em 15/5/2010), uma extorsão em 10/9/2009 (transitada em 7/4/2011) e um estelionato em 12/3/2010 (transitado em 27/7/2013)."
  q4: "Lucile foi denunciada por furto por levar de um grande supermercado, sem violência, dois litros de leite e uma sacola de verduras, R$ 10 no total. Depois da resposta à acusação, o juiz se convenceu de que o fato é atípico."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["11-peca-1", "11-peca-4", "11-peca-8", "11-q3-c", "11-q4-b"]
perguntas:
  - id: 11-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: pedido
    pergunta: "Ao interpor o recurso contra a pronúncia, o que a defesa deve pedir ao próprio juiz?"
    tese: "Juízo de retratação da pronúncia (efeito regressivo do recurso em sentido estrito)"
    aceitos: [ "retrata* | efeito regressivo | iterativo | reconsidera*" ]
    artigos: [ "art. 589, CPP" ]
    gabarito: "Pedido de retratação ou efeito regressivo, com fundamento no Art. 589 do CPP."
    revisao: { status: revisado }
  - id: 11-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Por que Jerusa não agiu com dolo eventual?"
    tese: "Ausência de dolo eventual: ela não assumiu o risco de produzir o resultado"
    aceitos: [ [ "assum* o risco | assumir o risco" ], [ "consentimento | consentiu" ] ]
    artigos: [ "art. 18, I, CP" ]
    gabarito: "Ausência de dolo eventual: além da previsão do resultado, o dolo eventual exige que o agente assuma o risco de produzi-lo, nos termos do Art. 18, I, parte final, do CP (teoria do consentimento)."
    revisao: { status: revisado }
  - id: 11-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Afastado o dolo, em que crime se encaixa a conduta de Jerusa?"
    tese: "Desclassificação para homicídio culposo na direção de veículo automotor"
    aceitos: [ "homicidio culposo" ]
    artigos: [ "art. 302, CTB" ]
    gabarito: "A conduta de Jerusa é culposa e se amolda ao homicídio culposo na direção de veículo automotor, previsto no Art. 302 do CTB."
    revisao: { status: revisado }
  - id: 11-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Sem crime doloso contra a vida, que decisão deve ser tomada quanto ao caso de Jerusa no júri?"
    tese: "Desclassificação, com a remessa dos autos ao juízo singular competente, porque o júri é incompetente"
    aceitos: [ "desclassifica*" ]
    artigos: [ "art. 419, CPP" ]
    gabarito: "Não havendo crime doloso contra a vida, o Tribunal do Júri é incompetente, devendo ocorrer a desclassificação, nos termos do Art. 419 do CPP."
    revisao: { status: revisado }
  - id: 11-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que recurso o Ministério Público usou contra a decisão do juiz da execução?"
    tese: "Agravo em execução"
    aceitos: [ "agravo" ]
    artigos: [ "art. 197, LEP" ]
    gabarito: "A. Agravo em Execução (Art. 197 da LEP).\n\nB. Não, pois de acordo com o verbete 493 da Súmula do STJ, é inadmissível a fixação de pena substitutiva (Art. 44 do CP) como condição especial ao regime aberto.\n\nAdemais, embora ao Juiz seja lícito estabelecer condições especiais para a concessão do regime aberto, em complementação daquelas previstas na LEP (Art. 115 da LEP), não poderá adotar a esse título nenhum efeito já classificado como pena substitutiva (Art. 44 do CPB), porque aí ocorreria o indesejável bis in idem, importando na aplicação de dúplice sanção.\n\nAdemais, o Art. 44 do Código Penal é claro ao afirmar a natureza autônoma das penas restritivas de direitos que, por sua vez, visam substituir a sanção corporal imposta àqueles condenados por infrações penais mais leves. Diante do caráter substitutivo das sanções restritivas, vedada está sua cumulatividade com a pena privativa de liberdade, salvo expressa previsão legal, o que não é o caso.\n\nPrecedente: STJ - Habeas Corpus n. 218.352 - SP (2011/0218345-1)"
    revisao: { status: revisado }
  - id: 11-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "O tribunal podia fixar a prestação de serviços à comunidade como condição especial do regime aberto?"
    tese: "A pena substitutiva não pode ser condição especial do regime aberto (bis in idem)"
    aceitos: [ "inadmissivel | nao pode | nao podia | nao poderia | vedad* | bis in idem | incorreta" ]
    artigos: [ "Súmula 493 STJ" ]
    gabarito: "A. Agravo em Execução (Art. 197 da LEP).\n\nB. Não, pois de acordo com o verbete 493 da Súmula do STJ, é inadmissível a fixação de pena substitutiva (Art. 44 do CP) como condição especial ao regime aberto.\n\nAdemais, embora ao Juiz seja lícito estabelecer condições especiais para a concessão do regime aberto, em complementação daquelas previstas na LEP (Art. 115 da LEP), não poderá adotar a esse título nenhum efeito já classificado como pena substitutiva (Art. 44 do CPB), porque aí ocorreria o indesejável bis in idem, importando na aplicação de dúplice sanção.\n\nAdemais, o Art. 44 do Código Penal é claro ao afirmar a natureza autônoma das penas restritivas de direitos que, por sua vez, visam substituir a sanção corporal imposta àqueles condenados por infrações penais mais leves. Diante do caráter substitutivo das sanções restritivas, vedada está sua cumulatividade com a pena privativa de liberdade, salvo expressa previsão legal, o que não é o caso.\n\nPrecedente: STJ - Habeas Corpus n. 218.352 - SP (2011/0218345-1)"
    revisao: { status: revisado }
  - id: 11-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que recurso cabe contra o acórdão do Tribunal de Justiça?"
    tese: "Recurso especial"
    aceitos: [ "recurso especial" ]
    artigos: [ "art. 105, III, a, CF" ]
    gabarito: "Cabível a interposição de recurso especial, com fulcro no Art. 105, III, a, da CRFB/88."
    revisao: { status: revisado }
  - id: 11-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Qual a principal linha de argumentação desse recurso?"
    tese: "Reformatio in pejus: o Tribunal piorou a situação do réu em recurso só da defesa"
    aceitos: [ "reformatio in pejus | reforma para pior" ]
    artigos: [ "art. 617, CPP" ]
    gabarito: "Deve ser salientado que não agiu corretamente o Tribunal de Justiça ao fixar as condições do sursis, pois tal tarefa cabia ao juiz a quo e, como ele não o fez, bem como não houve impugnação por parte do Ministério Público acerca de tal omissão, a atitude do Tribunal configura verdadeira reformatio in pejus, vedada pelo Art. 617, do CPP."
    revisao: { status: revisado }
  - id: 11-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Na sentença do roubo, Ricardo deve ser considerado de bons ou de maus antecedentes?"
    tese: "Bons antecedentes: na sentença do roubo, as condenações por fatos posteriores não contam como maus antecedentes"
    aceitos: [ "bons antecedentes" ]
    artigos: [ "art. 59, CP" ]
    gabarito: "A questão objetiva busca extrair do examinando conhecimento de institutos relativos à dosimetria da pena, em especial no tocante à circunstância judicial dos maus antecedentes e à agravante da reincidência. Munido de tal conhecimento, o examinando deve ser capaz de identificar os institutos e também diferenciá-los quando diante de um caso concreto.\n\nNesse sentido, relativamente ao item ‘A’, percebe-se que Ricardo possui bons antecedentes.\n\nEventual sentença condenatória ainda não transitada em julgado não tem o condão de implicar- lhe maus antecedentes, pois isso significaria acréscimo de tempo em sua pena e contrariaria, assim, o princípio do estado de inocência, constitucionalmente previsto.\n\nNo item ‘B’, atendendo-se ao comando da questão, o examinando deve indicar que Ricardo é primário. Isso porque a extorsão foi cometida em 10/09/09, antes, portanto, do trânsito em julgado da sentença que o condenou pelo roubo (ocorrido em 15/05/2010), tal como manda o Art. 63 do CP. Não obstante a primariedade de Ricardo, ele é portador de maus antecedentes, pois na data da sentença relativa ao delito de extorsão (18/10/2010) já havia ocorrido o trânsito em julgado da sentença do crime de roubo.\n\nPor fim, em relação ao item ‘C’, o examinando deve indicar que ainda permanece a primariedade de Ricardo, pois o delito de estelionato foi cometido antes do trânsito em julgado de qualquer outro delito. Perceba-se que um indivíduo somente pode ser considerado reincidente se o crime pelo qual está sendo julgado tiver sido cometido após o trânsito em julgado de sentença que lhe haja condenado por delito anterior, nos termos do Art. 63, do CP.\n\nTodavia, Ricardo é portador de maus antecedentes, pois na data da sentença relativa ao estelionato já havia ocorrido o trânsito em julgado de duas outras sentenças condenatórias."
    revisao: { status: revisado }
  - id: 11-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Na sentença da extorsão, incide a agravante da reincidência?"
    tese: "Réu primário na extorsão, cometida antes do trânsito em julgado da condenação pelo roubo: não incide a reincidência"
    aceitos: [ [ "primario" ], [ "nao incide | nao ha reincidencia | nao e reincidente | nao reincidente | sem reincidencia" ] ]
    artigos: [ "art. 63, CP" ]
    gabarito: "A questão objetiva busca extrair do examinando conhecimento de institutos relativos à dosimetria da pena, em especial no tocante à circunstância judicial dos maus antecedentes e à agravante da reincidência. Munido de tal conhecimento, o examinando deve ser capaz de identificar os institutos e também diferenciá-los quando diante de um caso concreto.\n\nNesse sentido, relativamente ao item ‘A’, percebe-se que Ricardo possui bons antecedentes.\n\nEventual sentença condenatória ainda não transitada em julgado não tem o condão de implicar- lhe maus antecedentes, pois isso significaria acréscimo de tempo em sua pena e contrariaria, assim, o princípio do estado de inocência, constitucionalmente previsto.\n\nNo item ‘B’, atendendo-se ao comando da questão, o examinando deve indicar que Ricardo é primário. Isso porque a extorsão foi cometida em 10/09/09, antes, portanto, do trânsito em julgado da sentença que o condenou pelo roubo (ocorrido em 15/05/2010), tal como manda o Art. 63 do CP. Não obstante a primariedade de Ricardo, ele é portador de maus antecedentes, pois na data da sentença relativa ao delito de extorsão (18/10/2010) já havia ocorrido o trânsito em julgado da sentença do crime de roubo.\n\nPor fim, em relação ao item ‘C’, o examinando deve indicar que ainda permanece a primariedade de Ricardo, pois o delito de estelionato foi cometido antes do trânsito em julgado de qualquer outro delito. Perceba-se que um indivíduo somente pode ser considerado reincidente se o crime pelo qual está sendo julgado tiver sido cometido após o trânsito em julgado de sentença que lhe haja condenado por delito anterior, nos termos do Art. 63, do CP.\n\nTodavia, Ricardo é portador de maus antecedentes, pois na data da sentença relativa ao estelionato já havia ocorrido o trânsito em julgado de duas outras sentenças condenatórias."
    revisao: { status: revisado }
  - id: 11-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Convencido de que o fato é atípico, o que o juiz deve fazer depois da resposta à acusação?"
    tese: "Absolvição sumária da ré, porque o fato é atípico"
    aceitos: [ "absolv*", "sumari*" ]
    artigos: [ "art. 397, III, CPP" ]
    gabarito: "O juiz deve absolver sumariamente a ré, devendo fundamentar sua decisão no Art. 397, III do CPP."
    revisao: { status: revisado }
