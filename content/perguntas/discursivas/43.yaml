  - id: 43-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Lucas, pai de Enzo, de 1 (um) ano de idade, esqueceu o filho dormindo no carro, deixando de entregá-lo na creche, e foi para o trabalho. Neste dia, a temperatura da cidade estava muito alta, e, como Enzo foi deixado no carro estacionado sob forte sol, havia sério risco de falecer por desidratação em pouco tempo.

      Entretanto, por sorte, Maria passava pelo local e resgatou o infante, sem lesão, após quebrar o vidro do veículo.

      Em razão de tais fatos, Lucas ofereceu queixa-crime em face de Maria pelo delito de dano (Art. 163 do CP), perante o Juízo ordinariamente competente. Rejeitada a queixa-crime, o querelante interpôs recurso em sentido estrito, na forma do Art. 581, inciso I, do CPP.

      Como advogado(a) de Maria, responda às questões a seguir.
    comando: Qual a tese de Direito Penal você deve apresentar em favor de Maria? Justifique.
    gabarito: Excludente de ilicitude, em razão do estado de necessidade, na forma do Art. 23, inciso I, ou do Art. 24, ambos do CP.
    opcoes:
      correta: Excludente de ilicitude, em razão do estado de necessidade, na forma forma do Art. 23, inciso I, ou do Art. 24, ambos do CP.
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - "João não cometeu qualquer crime, pois o delito descrito no artigo 122 do CP só se consuma com a ocorrência de morte ou de lesão corporal grave OU há crime, mas o fato não é punível por faltar a condição objetiva de punibilidade Obs.: respostas incompletas não são pontuadas."
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - O argumento é que a vantagem foi oferecida para particular e não para funcionário público, logo não configurado crime contra a Administração Pública.
        - A condenação anterior à pena de multa não impede a concessão da suspensão condicional da pena, de acordo com o Art. 77, § 1º, do CP.
