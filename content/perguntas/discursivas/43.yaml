# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "43"
introducoes:
  peca: "Arthur, primário, chegou bêbado em casa depois da derrota do seu time e deu um chute na esposa, Aline. As lesões foram descritas no laudo assinado pelo médico do hospital particular que a atendeu. Ele foi condenado por lesão corporal contra a mulher a 2 anos, com suspensão condicional da pena, e a pagar R$ 1.000 a Aline pelas despesas médicas, como pedira a denúncia. Só Arthur apelou, dizendo que faltou representação da vítima; que houve cerceamento de defesa, porque o juiz vetou perguntas sobre a vida sexual de Aline; que não houve exame de corpo de delito; que estava completamente embriagado, por ter bebido o dia todo com os amigos; que cabiam duas prestações pecuniárias no lugar da prisão; e que a indenização devia ser discutida no juízo cível. Você, advogado de Aline, assistente de acusação, foi intimado para se manifestar."
  q1: "Sílvio queria que a esposa, Sônia, morresse e a convenceu a descansar debaixo de um coqueiro, torcendo para que um coco lhe caísse na cabeça. Caiu, e ela morreu; acidentes assim são raríssimos e absolutamente improváveis. A denúncia por feminicídio foi rejeitada, o Ministério Público recorreu, e, sem que Sílvio fosse citado ou chamado ao processo, o tribunal nomeou um defensor dativo, deu provimento ao recurso e recebeu a denúncia."
  q2: "André, no semiaberto, foi acusado de ter e consumir bebida alcoólica no presídio, conduta que um decreto estadual define como falta grave. Em processo administrativo regular, com defesa, o diretor do presídio reconheceu a falta grave e determinou a regressão de André ao regime fechado."
  q3: "Lucas esqueceu o filho Enzo, de 1 ano, dormindo no carro fechado sob sol forte, com sério risco de morte por desidratação. Maria, que passava, quebrou o vidro e salvou o bebê. Lucas ofereceu queixa-crime contra ela por dano, crime de menor potencial ofensivo; a queixa foi rejeitada, e Lucas interpôs recurso em sentido estrito."
  q4: "Hugo, José e Luiz, servidores públicos, foram denunciados por corrupção passiva e por formarem, os três, uma organização criminosa estruturada, com divisão de tarefas. A única prova é a palavra de Hugo, que fez colaboração premiada homologada."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["43-peca-1", "43-peca-3", "43-peca-4", "43-peca-12"]
perguntas:
  - id: 43-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: preliminar
    pergunta: "Que tese a assistente deve opor à alegação de falta de representação?"
    tese: "Ação pública incondicionada: na lesão corporal em violência doméstica contra a mulher, não se exige representação"
    aceitos: [ "incondicionada" ]
    artigos: [ "Súmula 542 STJ", "art. 41, Lei 11.340" ]
    gabarito: "A ação penal é pública incondicionada, por se tratar de violência doméstica e familiar contra a mulher, consoante Súmula 542 do STJ, ou Art. 41 da Lei nº 11.340/2006 ou ADI 4.424."
    revisao: { status: revisado }
  - id: 43-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: preliminar
    pergunta: "Que tese a assistente deve opor à alegação de cerceamento de defesa?"
    tese: "É proibido perguntar sobre a vida sexual da vítima, fato alheio ao processo: o veto do juiz não cerceou a defesa"
    aceitos: [ "proibid* | vedad* | alheio aos fatos | alheios aos fatos | estranh* aos fatos | dignidade da vitima | revitimiza*" ]
    artigos: [ "art. 400-A, I, CPP", "art. 212, CPP" ]
    gabarito: "Deve ser afastada a alegação de cerceamento de defesa, em razão da inadmissibilidade da utilização de circunstâncias ou elementos alheios aos fatos objeto de apuração, nos termos do Art. 400, § 1º, ou 400-A, inciso I, ou Art. 212, todos do CPP ou ADPF 1107."
    revisao: { status: revisado }
  - id: 43-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Que tese a assistente deve opor à falta de exame de corpo de delito?"
    tese: "A materialidade está provada pelo laudo médico do hospital, que vale como prova na violência doméstica"
    aceitos: [ "laudo medico | prontuario | boletim medico | laudos medicos" ]
    artigos: [ "art. 12, § 3º, Lei 11.340" ]
    gabarito: "Há prova suficiente da materialidade delitiva, diante do laudo médico fornecido pelo hospital onde Aline recebeu atendimento, nos termos do Art. 12, § 3º, da Lei nº 11.340/2006."
    revisao: { status: revisado }
  - id: 43-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Que tese a assistente deve opor à alegação de embriaguez?"
    tese: "A embriaguez voluntária não exclui a imputabilidade"
    aceitos: [ "voluntaria | nao exclui a imputabilidade | nao exclui" ]
    artigos: [ "art. 28, II, CP" ]
    gabarito: "A embriaguez voluntária ou culposa apresentada por Arthur não exclui a imputabilidade penal, na forma do Art. 28, inciso II, do CP."
    revisao: { status: revisado }
  - id: 43-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Que tese a assistente deve opor ao pedido de substituição da pena?"
    tese: "Não cabe substituição por restritivas de direitos em crime com violência contra a mulher"
    aceitos: [ [ "violencia", "nao cabe | vedad* | incabivel | impede" ] ]
    artigos: [ "art. 44, I, CP", "Súmula 588 STJ" ]
    gabarito: "Não estão presentes os requisitos para a substituição da pena privativa de liberdade por restritiva de direitos, por se tratar de crime praticado mediante violência, nos termos do Art. 44, inciso I, do CP ou súmula 588 do STJ."
    revisao: { status: revisado }
  - id: 43-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Que tese a assistente deve opor ao pedido de duas prestações pecuniárias?"
    tese: "É vedada a pena só pecuniária na violência doméstica e familiar contra a mulher"
    aceitos: [ "isolad* | so pecuniaria | vedad*" ]
    artigos: [ "art. 17, Lei 11.340" ]
    gabarito: "Não é cabível a aplicação isolada de pena pecuniária nos casos de violência doméstica e familiar contra a mulher, nos termos do Art. 17 da Lei nº 11.340/2006."
    revisao: { status: revisado }
  - id: 43-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Que tese a assistente deve opor ao pedido de afastar a indenização?"
    tese: "O valor mínimo de indenização pode ser fixado na sentença, se pedido e submetido ao contraditório"
    aceitos: [ "valor minimo | contradit*" ]
    artigos: [ "art. 387, IV, CPP" ]
    gabarito: "Correta a sentença ao estipular valor mínimo de indenização, pois houve regular comprovação dos valores, devidamente submetidos ao contraditório acerca do tema, nos termos do Art. 387, inciso IV, do CPP."
    revisao: { status: revisado }
  - id: 43-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que tese de direito penal afasta a imputação de feminicídio?"
    tese: "Atipicidade: não há nexo causal entre a conduta de Sílvio e a morte, um acaso imprevisível"
    aceitos: [ "nexo | atipic* | causalidade" ]
    artigos: [ "art. 13, CP" ]
    gabarito: "Atipicidade do fato, pois o resultado não decorre de qualquer conduta de Sílvio ou porque Não há nexo de causalidade entre a conduta de Sílvio e o resultado, nos termos do Art. 13 do CP."
    revisao: { status: revisado }
  - id: 43-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que tese processual permite anular a decisão do tribunal?"
    tese: "Nulidade: o denunciado devia ser chamado a constituir defensor e contra-arrazoar o recurso, e o defensor dativo não supre essa falta"
    aceitos: [ "nulidade | nula | nulo | contrarrazo* | contra-arrazo* | constituir defensor | constituir advogado" ]
    artigos: [ "Súmula 707 STF", "art. 263, CPP" ]
    gabarito: "Constitui nulidade a falta de intimação do denunciado para a constituição de defensor e o oferecimento de contrarrazões ao recurso interposto contra a decisão de rejeição da denúncia, não a suprindo a nomeação de defensor dativo, nos termos do enunciado 707 da Súmula da Jurisprudência do Supremo Tribunal Federal."
    revisao: { status: revisado }
  - id: 43-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que tese afasta a natureza grave da falta imputada a André?"
    tese: "Legalidade: só lei federal pode definir falta grave, não um decreto estadual"
    aceitos: [ "legalidade | reserva legal | lei federal" ]
    artigos: [ "art. 49, LEP", "art. 5, XXXIX, CRFB", "art. 22, I, CRFB", "art. 1, CP" ]
    gabarito: "Houve a violação ao princípio da legalidade penal, insculpido no Art. 5º, inciso XXXIX, da CRFB/88, ou no Art. 1º do CP, pois apenas por Lei Federal pode ser criada falta disciplinar de natureza grave, conforme o Art. 22, inciso I, da CRFB/88 ou Art. 49, da LEP."
    revisao: { status: revisado }
  - id: 43-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Ainda que houvesse falta grave, por que a regressão determinada pelo diretor é nula?"
    tese: "Só o juiz da execução pode decidir a regressão de regime, não o diretor do presídio"
    aceitos: [ "juiz da execucao | juizo da execucao | so o juiz | competencia do juiz" ]
    artigos: [ "art. 66, III, b, LEP", "art. 48, parágrafo único, LEP", "art. 118, LEP" ]
    gabarito: "Compete somente ao Juiz da Execução Penal decidir sobre a regressão de regime, nos termos do Art. 48, parágrafo único, ou Art. 54, ou 66, inciso III, alínea b, da Lei nº 7.210/1984."
    revisao: { status: revisado }
  - id: 43-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que tese de direito penal favorece Maria?"
    tese: "Estado de necessidade de terceiro, que exclui a ilicitude"
    aceitos: [ "estado de necessidade | excludente de ilicitude | exclui a ilicitude" ]
    artigos: [ "art. 24, CP", "art. 23, I, CP" ]
    gabarito: "Excludente de ilicitude, em razão do estado de necessidade, na forma do Art. 23, inciso I, ou do Art. 24, ambos do CP."
    revisao: { status: revisado }
  - id: 43-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que preliminar a defesa de Maria deve opor ao recurso de Lucas?"
    tese: "Inadmissibilidade do recurso em sentido estrito no Juizado: contra a rejeição da queixa cabe apelação, e o erro é grosseiro"
    aceitos: [ "inadmiss* | nao cabe | erro grosseiro | apelacao" ]
    artigos: [ "art. 82, Lei 9.099" ]
    gabarito: "O recurso interposto é inadmissível, configurando erro grosseiro, pois não cabe recurso em sentido estrito no rito dos Juizados Especiais Criminais, nos termos do Art. 82 da Lei nº 9.099/1995."
    revisao: { status: revisado }
  - id: 43-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que tese processual leva à rejeição da denúncia, por falta de justa causa, quanto a todos os crimes?"
    tese: "A palavra do colaborador, sem provas de corroboração, não basta para receber a denúncia"
    aceitos: [ "corrobor* | so a palavra | apenas a palavra" ]
    artigos: [ "art. 4, § 16, II, Lei 12.850" ]
    gabarito: "Quanto à tese processual, deve ser lembrado que a palavra do colaborador, sem provas de corroboração, é insuficiente para respaldar o recebimento da denúncia, na forma do Art. 4º, § 16, inciso II, da Lei nº 12.850/2013."
    revisao: { status: revisado }
  - id: 43-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que tese de direito penal leva à absolvição sumária pela organização criminosa?"
    tese: "Atipicidade da organização criminosa, que exige pelo menos quatro pessoas"
    aceitos: [ "quatro pessoas | 4 pessoas | quatro ou mais | 4 ou mais | atipic*" ]
    artigos: [ "art. 1, § 1º, Lei 12.850" ]
    gabarito: "Quanto à tese de direito material, deve ser sustentada a atipicidade da conduta, ante a inexistência de quatro pessoas na composição da organização criminosa, conforme previsto pelo Art. 1º, § 1º, da Lei nº 12.850/2013."
    revisao: { status: revisado }
