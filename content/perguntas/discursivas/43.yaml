      correta: Violação ao princípio da legalidade penal, pois apenas por Lei Federal pode ser criada falta grave, nos termos do Art. 1º do CP, ou do Art. 5º, inciso XXXIX, ou do Art. 22, inciso I, ambos da CRFB/88 ou Art. 49, da LEP.
