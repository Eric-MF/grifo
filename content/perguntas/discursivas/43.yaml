  - id: 43-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Hugo, José e Luiz, servidores públicos, foram denunciados por cobrarem vantagens indevidas a fim de praticarem ou deixarem de praticar atos de ofício, constituindo, assim, entre os três, uma organização criminosa. Foi demonstrado, objetivamente, haver entre os denunciados uma organização estruturalmente ordenada e com divisão de tarefas com o objetivo de praticar crimes de corrupção passiva (Art. 317 do CP).

      Com base em tais fatos, foram dados como incursos nas penas do Art. 317 do CP e do Art. 2º da Lei nº 12.850/2013, em concurso material. A prova das acusações foi respaldada, exclusivamente, na palavra de Hugo, que celebrou acordo de colaboração premiada com o Ministério Público, devidamente homologado pela autoridade judiciária competente.

      Na qualidade de advogado(a) constituído pelos acusados José e Luiz, responda às questões a seguir.
    comando: Qual é a tese de Direito Processual Penal apta a sustentar a rejeição da denúncia em relação a todos os delitos por ausência de justa causa? Fundamente.
    gabarito: Quanto à tese processual, deve ser lembrado que a palavra do colaborador, sem provas de corroboração, é insuficiente para respaldar o recebimento da denúncia, na forma do Art. 4º, § 16, inciso II, da Lei nº 12.850/2013.
    opcoes:
      correta: A palavra do colaborador, sem provas de corroboração, é insuficiente para respaldar o recebimento da denúncia, na forma do Art. 4º, § 16, inciso II, da Lei nº 12.850/2013.
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - "A condição jurídica de João se alteraria, na medida em que o resultado de lesões corporais de natureza grave consuma o crime de instigação, auxílio e induzimento ao suicídio, devendo João responder pelo crime previsto no artigo 122 do CP da forma consumada. Obs.1: respostas incompletas não são pontuadas. Obs.2: a mera indicação da sanção penal não é pontuada. Obs.3: a mera transcrição do artigo não é pontuada."
        - A tese adequada é a da aplicação da lei mais benéfica ao condenado, que importará na redução da sua pena, tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto alternativo, portanto crime único OU tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto cumulativo, sujeito à aplicação da continuidade delitiva o que permite sua aplicação para fatos praticados antes de sua entrada em vigor, ainda que a decisão seja definitiva.
        - Aplicação da escusa absolutória OU presente causa de isenção de pena, tendo em vista que o réu era pai da vítima, nos termos do Art. 181, inciso II, do Código Penal.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
    revisao: *a1
  - id: 43-q4-b
    categoria: discursiva
