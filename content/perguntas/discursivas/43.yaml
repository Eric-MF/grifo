    secao: pedido
    caso: |-
      Arthur, primário e sem antecedentes, foi denunciado perante o Juizado de Violência Doméstica e Familiar contra a Mulher da Comarca de Flores, Estado de Campo Belo, por lesão corporal leve, inserta no Art. 129, § 13, do CP, praticada contra Aline, sua então esposa. Consta que, quando o time de futebol de Arthur sofreu uma derrota, este chegou em casa embriagado e desferiu um chute em Aline. As lesões foram constatadas e descritas em laudo assinado pelo médico do hospital particular onde Aline foi atendida.

      Aline se habilitou como assistente de acusação e apresentou os comprovantes de pagamento de despesas médicas no valor de R$ 1.000,00 (mil reais), sendo certo que, na denúncia, o Ministério Público (MP) requereu a condenação de Arthur a pagar a indenização à vítima pelo valor correspondente.

      Em autodefesa, Arthur se limitou a relatar que, no dia da suposta agressão, estava em estado de embriaguez completa, pois havia passado o dia ingerindo bebidas alcóolicas com seus amigos enquanto assistiam uma partida de futebol.

      Após regular processo, foi prolatada a sentença que condenou Arthur, nos termos da denúncia, a uma pena de dois anos de reclusão, em regime aberto, concedendo a suspensão condicional da pena de dois anos com a condição de prestação de serviços à comunidade durante o primeiro ano de suspensão da pena. Condenou, ainda, Arthur ao pagamento de indenização à vítima Aline, no valor de R$ 1.000,00 (mil reais) relativo aos gastos dela com despesas médicas em razão da lesão sofrida.

      As partes foram intimadas da sentença, sendo que o MP e o assistente de acusação não recorreram, ao passo que Arthur interpôs tempestiva apelação, arguindo, inicialmente, a nulidade do processo pela ausência de representação da ofendida, nos termos do Art. 88 da Lei nº 9.099/1995. Ainda em preliminar, sustentou cerceamento de defesa, ante o indeferimento de perguntas sobre a vida sexual da vítima. No mérito, requereu a sua absolvição, por ausência de prova da materialidade delitiva, pois, tratando-se de delito que deixa vestígios, era obrigatório ter sido realizado exame de corpo de delito. Além disso, alegou ausência de imputabilidade penal no momento dos fatos, pois havia ingerido grande quantidade de bebida alcóolica.

      Subsidiariamente, postulou a substituição da pena privativa de liberdade por restritiva de direitos, defendendo o cabimento de duas penas de prestação pecuniária. Por fim, pleiteou o afastamento da condenação a indenizar Aline, pois a matéria deveria ser resolvida pelo Juízo cível.

      Após a oitiva do MP, o(a) advogado(a) constituído(a) por Aline foi intimado(a) no dia 30 de maio de 2025 (sexta-feira), por determinação do Juízo, a fim de se manifestar conforme o direito.

      Considerando apenas as informações expostas, apresente, na condição de advogado(a) de Aline, a peça jurídica cabível, expondo todas as teses pertinentes de Direito Material e Processual. A peça deverá ser datada no último dia do prazo para a apresentação, devendo considerar os dias de segunda a sexta-feira úteis em todo o país. (Valor: 5,00)

      Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples
    comando: Que pedido deve ser formulado na peça?
    gabarito: Desprovimento do recurso, com a manutenção da sentença condenatória.
    opcoes:
      correta: Desprovimento do recurso, com a manutenção da sentença condenatória.
      erradas:
        - "Pedido: Não conhecimento do recurso e, subsidiariamente, não provimento do recurso OU que seja mantida a sentença de 1º grau em sua integralidade"
        - Absolvição com base na atipicidade da conduta ou art. 386, inciso III, do CPP.
        - "Pedidos: Nulidade dos atos da instrução em razão do não oferecimento de proposta de suspensão condicional do processo OU encaminhamento dos autos ao Ministério Público para oferecimento de proposta de suspensão condicional do processo."
        - Pedido de extinção da punibilidade do agente em relação ao delito imputado na denúncia, em razão da prescrição da pretensão punitiva estatal pela pena em abstrato do crime de homicídio, nos termos do Art. 107, inciso IV, do CP OU 109, inciso I, c/c Art. 115, ambos do CP
        - Pedido de retratação, na forma do Art. 589 do CPP.
    revisao: *a1
  - id: 43-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      O casamento de Sílvio estava desgastado e ele desejava que Sônia, sua esposa, morresse. Assim, ele a convenceu a repousar embaixo de um coqueiro, na esperança de que um coco atingisse a sua cabeça. De fato, um coco caiu do coqueiro e atingiu a cabeça de Sônia, que veio a falecer.

      Comprovou-se nos autos que Sílvio possuía o desejo de ver Sônia morta e que os acidentes fatais com coco são raríssimos e absolutamente improváveis. Sílvio foi denunciado pelo feminicídio de Sônia, mas a denúncia foi rejeitada.

      Assim, o Ministério Público interpôs o competente recurso, sendo nomeado defensor dativo em favor de Sílvio, que até o momento, não foi citado nem intimado. O Tribunal deu provimento ao recurso e recebeu a inicial acusatória.

      Como advogado(a) de Sílvio, responda às questões a seguir.
    comando: A fim de afastar a imputação de feminicídio, qual a tese de Direito Penal a ser sustentada? Justifique.
    gabarito: Atipicidade do fato, pois o resultado não decorre de qualquer conduta de Sílvio ou porque Não há nexo de causalidade entre a conduta de Sílvio e o resultado, nos termos do Art. 13 do CP.
    opcoes:
      correta: Atipicidade do fato, pois o resultado não decorre de qualquer conduta de Sílvio ou porque não há nexo de causalidade entre a conduta de Sílvio e o resultado, nos termos do Art. 13 do CP.
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - "A condição jurídica de João se alteraria, na medida em que o resultado de lesões corporais de natureza grave consuma o crime de instigação, auxílio e induzimento ao suicídio, devendo João responder pelo crime previsto no artigo 122 do CP da forma consumada. Obs.1: respostas incompletas não são pontuadas. Obs.2: a mera indicação da sanção penal não é pontuada. Obs.3: a mera transcrição do artigo não é pontuada."
        - A tese adequada é a da aplicação da lei mais benéfica ao condenado, que importará na redução da sua pena, tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto alternativo, portanto crime único OU tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto cumulativo, sujeito à aplicação da continuidade delitiva o que permite sua aplicação para fatos praticados antes de sua entrada em vigor, ainda que a decisão seja definitiva.
        - Aplicação da escusa absolutória OU presente causa de isenção de pena, tendo em vista que o réu era pai da vítima, nos termos do Art. 181, inciso II, do Código Penal.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
    revisao: *a1
  - id: 43-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      O casamento de Sílvio estava desgastado e ele desejava que Sônia, sua esposa, morresse. Assim, ele a convenceu a repousar embaixo de um coqueiro, na esperança de que um coco atingisse a sua cabeça. De fato, um coco caiu do coqueiro e atingiu a cabeça de Sônia, que veio a falecer.

      Comprovou-se nos autos que Sílvio possuía o desejo de ver Sônia morta e que os acidentes fatais com coco são raríssimos e absolutamente improváveis. Sílvio foi denunciado pelo feminicídio de Sônia, mas a denúncia foi rejeitada.

      Assim, o Ministério Público interpôs o competente recurso, sendo nomeado defensor dativo em favor de Sílvio, que até o momento, não foi citado nem intimado. O Tribunal deu provimento ao recurso e recebeu a inicial acusatória.

      Como advogado(a) de Sílvio, responda às questões a seguir.
    comando: Independentemente do instrumento processual usado para impugnar o recebimento da denúncia, a fim de arguir a nulidade da decisão do Tribunal, indique a tese de Direito Processual Penal que deve ser apresentada. Fundamente.
    gabarito: Constitui nulidade a falta de intimação do denunciado para a constituição de defensor e o oferecimento de contrarrazões ao recurso interposto contra a decisão de rejeição da denúncia, não a suprindo a nomeação de defensor dativo, nos termos do enunciado 707 da Súmula da Jurisprudência do Supremo Tribunal Federal.
    opcoes:
      correta: Constitui nulidade a falta de intimação do denunciado para a constituição de defensor e o oferecimento de contrarrazões ao recurso interposto contra a decisão de rejeição da denúncia, não a suprindo a nomeação de defensor dativo, nos termos do enunciado 707 da Súmula da Jurisprudência do Supremo Tribunal Federal ou Art. 263, caput, do CPP..
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - "A condição jurídica de João se alteraria, na medida em que o resultado de lesões corporais de natureza grave consuma o crime de instigação, auxílio e induzimento ao suicídio, devendo João responder pelo crime previsto no artigo 122 do CP da forma consumada. Obs.1: respostas incompletas não são pontuadas. Obs.2: a mera indicação da sanção penal não é pontuada. Obs.3: a mera transcrição do artigo não é pontuada."
        - Não, pois viola o princípio da vedação da reformatio in pejus, tendo em vista que geraria prejuízo na aplicação do regime OU na prescrição OU na execução da pena
        - O argumento é que a vantagem foi oferecida para particular e não para funcionário público, logo não configurado crime contra a Administração Pública.
        - A condenação anterior à pena de multa não impede a concessão da suspensão condicional da pena, de acordo com o Art. 77, § 1º, do CP.
