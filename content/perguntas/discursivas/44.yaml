    comando: Que tese preliminar deve ser alegada na peça, e com qual fundamento?
    gabarito: Extinção da punibilidade, na forma do Art. 107, inciso IV, do CP.
    opcoes:
      correta: Extinção da punibilidade, na forma do Art. 107, inciso IV, do CP.
      erradas:
        - "Preliminarmente: Nulidade da sentença ou de todos os atos processuais desde as alegações finais apresentadas pela Defensoria Pública, tendo em vista que não houve intimação do réu para manifestar interesse em indicar novo advogado OU tendo em vista que houve prejuízo para ampla defesa."
        - "Incompetência da Justiça Estadual: crime de competência federal, art. 109, V (ou IV), da CF."
        - Violação das regras da mutatio libelli, art. 384 do CPP, c/c art. 411, § 3º, do CPP.
        - Preliminarmente, deve ser requerido o reconhecimento da nulidade do ato de citação, nos termos do art. 564, inciso III, “e”, do CPP
        - Nulidade decorrente do não oferecimento de proposta de suspensão condicional do processo, tendo em vista que o crime não foi praticado no contexto da violência doméstica e familiar contra mulher ou tendo em vista não ser aplicável a previsão do Art. 41 da Lei nº 11.340 pelo fato de a vítima ser homem.
