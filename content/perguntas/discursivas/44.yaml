  - id: 44-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Carlos, com a intenção de obter vantagem indevida em detrimento da União, logrou efetuar o saque do seu Fundo de Garantia do Tempo de Serviço (FGTS) munido de laudo médico, atestando ser portador do vírus HIV, supostamente expedido por hospital público, documento materialmente falso e usado exclusivamente para esse fim.

      O Ministério Público Federal, então, ofereceu Acordo de Não Persecução Penal (ANPP) a Carlos, propondo, como condições, a reparação do dano e a prestação de serviços à comunidade, pelo período equivalente à pena mínima cominada aos delitos de uso de documento público falso em concurso material com o delito de estelionato majorado (Art. 297 c/c o Art. 304 e Art. 171, § 3º, na forma do Art. 69, todos do Código Penal).

      Como advogado(a) de Carlos, assistindo-o nas tratativas do Acordo de Não Persecução Penal, responda às questões a seguir.
    comando: Qual a tese de Direito Penal deve ser sustentada em relação ao enquadramento típico realizado pelo Ministério Público Federal? Fundamente.
    gabarito: Quando o falso se exaure no estelionato, sem mais potencialidade lesiva, é por este absorvido. Assim, deveria o examinando identificar a ocorrência de consunção, havendo apenas o delito de estelionato, nos termos do enunciado sumular nº 17 do Superior Tribunal de Justiça.
    opcoes:
      correta: Consunção, pois, quando o falso se exaure no estelionato, sem mais potencialidade lesiva, é por este absorvido, nos termos do enunciado sumular nº 17, do Superior Tribunal de Justiça.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
