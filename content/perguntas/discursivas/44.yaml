    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Absolvição do acusado, pois o fato não constitui infração penal ou por haver causa que isenta o réu de pena, na forma do Art. 386, inciso III, ou VI do CPP.
    opcoes:
      correta: Absolvição do acusado, pois o fato não constitui infração penal ou por haver causa que isenta o réu de pena, na forma do Art. 386, inciso III, ou VI do CPP.
      erradas:
        - Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
        - Breno não agiu com dolo nem culpa OU sua conduta foi atípica em relação ao crime de corrupção de menores.
        - Da tese da incidência da atenuante da menoridade penal relativa
        - Reconhecimento da atenuante da menoridade relativa, já que menor de 21 anos na data dos fatos, conforme Art. 65, inciso I, do Código Penal.
        - Incabível o reinício da contagem dos prazos do indulto e livramento condicional em razão do princípio da legalidade, que também é aplicável na execução penal.
