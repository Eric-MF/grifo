# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "44"
introducoes:
  peca: "Em 10/1/2024, Aluísio, entregador, viu na casa de Manoel uma peça que imitava um jacaré e, achando que era o animal e que estava em perigo, golpeou-a e a destruiu; agiu sem as cautelas devidas. Manoel ofereceu queixa-crime por dano. Nas alegações finais orais, o advogado de Manoel só pediu “o prosseguimento do feito, com prolação de sentença”. A única condenação de Aluísio é por deserção, de 2023. O juiz do Juizado o condenou a 2 meses de detenção, aumentando a pena pela reincidência, fixou o regime semiaberto e negou a troca da pena, por causa da reincidência. Você foi intimado da sentença."
  q1: "Carlos sacou seu FGTS com um laudo médico falso, supostamente de hospital público, usado só para isso, dizendo ser portador de HIV. O Ministério Público Federal lhe propôs acordo de não persecução penal pelos crimes de uso de documento público falso e estelionato majorado, em concurso material, com a reparação do dano e a prestação de serviços à comunidade pelo tempo da pena mínima somada dos crimes."
  q2: "Manoela, um dia antes de completar 18 anos, acertou uma colega na cabeça com uma cadeira, numa briga na escola. A vítima morreu um mês depois, quando Manoela já tinha 18 anos. Manoela foi denunciada por homicídio doloso. O oficial de justiça foi à casa dela, soube pela mãe que ela estava trabalhando e voltaria mais tarde, e devolveu o mandado; o juiz mandou citá-la por edital e suspendeu o processo e a prescrição."
  q3: "Karina e Daniel, casados, alugaram uma casa de César, com contrato que lhes dava direito de retenção das benfeitorias voluptuárias. Ao fim da locação, César se recusou a pagar a banheira de hidromassagem instalada por eles, e o casal a retirou. César ofereceu queixa-crime por exercício arbitrário das próprias razões só contra Karina, deixando Daniel de fora porque joga futebol com ele."
  q4: "Homens armados sequestraram o filho de Vitor, gerente de banco, e exigiram que ele abrisse o cofre da agência; com medo pelo filho, Vitor obedeceu. A polícia achou um vídeo que mostraria um acerto prévio entre ele e os sequestradores, e, com base nisso, Vitor foi denunciado como partícipe. Ele diz que o vídeo é uma montagem."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["44-peca-1", "44-peca-4", "44-peca-13"]
perguntas:
  - id: 44-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: preliminar
    pergunta: "Que preliminar a defesa deve levantar quanto às alegações finais do querelante?"
    tese: "Extinção da punibilidade pela perempção"
    aceitos: [ "extin* | peremp*" ]
    artigos: [ "art. 107, IV, CP" ]
    gabarito: "Extinção da punibilidade, na forma do Art. 107, inciso IV, do CP."
    revisao: { status: revisado }
  - id: 44-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: preliminar
    pergunta: "O advogado de Manoel só pediu o prosseguimento do feito. Que consequência isso tem?"
    tese: "Perempção: o querelante não pediu a condenação nas alegações finais"
    aceitos: [ "peremp* | nao pediu a condenacao | sem pedido de condenacao | nao formulou pedido" ]
    artigos: [ "art. 60, III, CPP" ]
    gabarito: "Ocorrência de perempção, diante da ausência de requerimento condenatório nas alegações finais, conforme Art. 60, inciso III, do CPP."
    revisao: { status: revisado }
  - id: 44-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "No mérito, qual é o pedido principal da defesa?"
    tese: "Absolvição, porque o fato não constitui crime"
    aceitos: [ "absolv*" ]
    artigos: [ "art. 386, III, CPP", "art. 386, VI, CPP" ]
    gabarito: "Absolvição do acusado, pois o fato não constitui infração penal ou por haver causa que isenta o réu de pena, na forma do Art. 386, inciso III, ou VI do CPP."
    revisao: { status: revisado }
  - id: 44-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Aluísio achou que a peça era um jacaré de verdade. Que tese isso permite?"
    tese: "Erro de tipo permissivo (estado de necessidade putativo), que exclui o dolo"
    aceitos: [ "erro de tipo | descriminante putativa | estado de necessidade putativo | erro de tipo permissivo" ]
    artigos: [ "art. 20, § 1º, CP" ]
    gabarito: "O acusado incorreu em erro de tipo permissivo (descriminante putativa ou estado de necessidade putativo), conforme o Art. 20, §1º, do CP."
    revisao: { status: revisado }
  - id: 44-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Aluísio agiu sem as cautelas devidas. Por que, ainda assim, não há crime?"
    tese: "Atipicidade: o erro evitável deixaria só a culpa, e não existe dano culposo"
    aceitos: [ "atipic* | dano culposo | forma culposa | figura culposa | modalidade culposa" ]
    artigos: [ "art. 18, parágrafo único, CP" ]
    gabarito: "Atipicidade da conduta, já que o erro afasta o dolo ou porque não existe a figura culposa do delito imputado, nos termos do Art. 18, parágrafo único, do CP."
    revisao: { status: revisado }
  - id: 44-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Subsidiariamente, que tese a defesa deve sustentar quanto ao aumento da pena?"
    tese: "Afastamento da reincidência: a condenação por crime militar próprio não a gera"
    aceitos: [ [ "reincid*", "afast* | exclu* | nao induz | nao gera" ], [ "militar proprio | crime militar" ] ]
    artigos: [ "art. 64, II, CP" ]
    gabarito: "Subsidiariamente, afastamento da agravante da reincidência, pois a condenação anterior ocorreu por crime militar próprio, o que não induz reincidência, nos termos do Art. 64, inciso II, do CP."
    revisao: { status: revisado }
  - id: 44-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Sem a reincidência, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto"
    aceitos: [ "aberto" ]
    artigos: [ "art. 33, § 2º, c, CP" ]
    gabarito: "Fixação do regime inicial aberto, nos termos do Art. 33, §2º, alínea c, do CP."
    revisao: { status: revisado }
  - id: 44-peca-12
    categoria: peca-detalhe
    parte: peca
    item: "12"
    secao: merito
    pergunta: "Além do regime, o que a defesa deve pedir quanto à espécie de pena?"
    tese: "Substituição da pena de detenção por multa ou por restritiva de direitos, ou aplicação só da multa"
    aceitos: [ "substitu* | multa | restritiva* | isolad*" ]
    artigos: [ "art. 44, § 2º, CP", "art. 163, CP" ]
    gabarito: "Substituição da pena privativa de liberdade por multa ou restritiva de direitos ou aplicação isolada de multa, na forma do Art. 44, incisos I, II, III, ou §2º ou §3º, ou do Art. 60, §2º, ou do Art. 163, todos do CP."
    revisao: { status: revisado }
  - id: 44-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que tese de direito penal contesta o enquadramento feito pelo Ministério Público Federal?"
    tese: "Consunção: o falso que se esgota no estelionato é absorvido por ele"
    aceitos: [ "consun* | absorc* | absorv* | absorvid*" ]
    artigos: [ "Súmula 17 STJ" ]
    gabarito: "Quando o falso se exaure no estelionato, sem mais potencialidade lesiva, é por este absorvido. Assim, deveria o examinando identificar a ocorrência de consunção, havendo apenas o delito de estelionato, nos termos do enunciado sumular nº 17 do Superior Tribunal de Justiça."
    revisao: { status: revisado }
  - id: 44-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "As condições do acordo de não persecução penal estão corretas?"
    tese: "A prestação de serviços no acordo de não persecução penal deve durar a pena mínima reduzida de um a dois terços"
    aceitos: [ "reduzid* | um a dois tercos | 1/3 a 2/3 | um terco | dois tercos" ]
    artigos: [ "art. 28-A, III, CPP" ]
    gabarito: "Não. De acordo com o Art. 28-A, inciso III, do CPP, a prestação de serviços à comunidade deve ser por período correspondente à pena mínima reduzida de um a dois terços."
    revisao: { status: revisado }
  - id: 44-q2-a
    categoria: discursiva
    parte: q2
    item: "A1"
    pergunta: "Que tese de direito penal afasta totalmente a responsabilidade penal de Manoela?"
    tese: "Teoria da atividade: o crime se considera praticado no momento da ação, quando Manoela ainda era inimputável"
    aceitos: [ "teoria da atividade | momento da acao | data da acao | momento da conduta | data da conduta | inimputav*" ]
    artigos: [ "art. 4, CP", "art. 27, CP", "art. 104, Lei 8.069" ]
    gabarito: "De acordo com a teoria da atividade, considera-se praticado o delito na data da ação ou omissão, conforme o Art. 4º do CP ou Art. 104, caput, do ECA, daí porque Manoela, em razão da idade, era inimputável, nos termos do Art. 27 do CP, ou do Art. 228 da CRFB/88 ou Art. 104, parágrafo único, do ECA."
    revisao: { status: revisado }
  - id: 44-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "A citação por edital de Manoela foi válida?"
    tese: "Nulidade da citação por edital, que só cabe quando o réu está em lugar incerto e não sabido"
    aceitos: [ "lugar incerto | nao sabido | nulidade | nula | invalid*" ]
    artigos: [ "art. 361, CPP", "art. 363, § 1º, CPP", "art. 564, III, e, CPP" ]
    gabarito: "Não, a citação por edital somente é cabível quando o réu estiver em lugar incerto e não sabido, nos termos do Art. 361 ou Art. 363, § 1º, ou do Art. 564, inciso III, alínea e, todos do CPP."
    revisao: { status: revisado }
  - id: 44-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que tese processual garante a extinção da punibilidade de Karina?"
    tese: "Indivisibilidade da ação penal privada: a renúncia em favor de Daniel se estende a Karina e extingue a punibilidade"
    aceitos: [ "indivisib* | renuncia" ]
    artigos: [ "art. 48, CPP", "art. 49, CPP", "art. 107, V, CP" ]
    gabarito: "Em relação à extinção da punibilidade, deve-se observar que, diante do princípio da indivisibilidade da ação penal privada, a renúncia ao direito de queixa em favor de um dos querelados a todos aproveita, nos termos do Art. 48 ou 49 do CPP ou do Art. 107, inciso V, do CP."
    revisao: { status: revisado }
  - id: 44-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que tese de direito penal contesta a imputação feita a Karina?"
    tese: "Atipicidade: o contrato autorizava a autotutela, e não houve a arbitrariedade que o tipo exige"
    aceitos: [ "atipic* | previsao contratual | sem arbitrariedade | nao houve arbitrariedade | autotutela" ]
    artigos: [ "art. 345, CP" ]
    gabarito: "Atipicidade da conduta, diante da previsão contratual de autotutela, não se verificando a elementar de arbitrariedade na conduta de Karina e Daniel."
    revisao: { status: revisado }
  - id: 44-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que tese de direito penal afasta a responsabilidade de Vitor?"
    tese: "Coação moral irresistível, que exclui a culpabilidade: Vitor agiu para salvar o filho"
    aceitos: [ "coacao moral irresistivel | coacao irresistivel | inexigibilidade de conduta diversa" ]
    artigos: [ "art. 22, CP" ]
    gabarito: "A excludente de culpabilidade em razão da coação moral irresistível, pois não é razoável exigir de Vitor conduta diversa, na forma do Art. 22, do CP."
    revisao: { status: revisado }
  - id: 44-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que medida processual permite questionar a idoneidade do vídeo?"
    tese: "Incidente de falsidade documental para questionar o vídeo"
    aceitos: [ "incidente de falsidade | falsidade documental | falsidade" ]
    artigos: [ "art. 145, CPP" ]
    gabarito: "Incidente de falsidade documental, previsto no Art. 145, do CPP."
    revisao: { status: revisado }
