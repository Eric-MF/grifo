  - id: 04-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    caso: |-
      Tício foi denunciado e processado, na 1ª Vara Criminal da Comarca do Município X, pela prática de roubo qualificado em decorrência do emprego de arma de fogo. Ainda durante a fase de inquérito policial, Tício foi reconhecido pela vítima. Tal reconhecimento se deu quando a referida vítima olhou através de pequeno orifício da porta de uma sala onde se encontrava apenas o réu. Já em sede de instrução criminal, nem vítima nem testemunhas afirmaram ter escutado qualquer disparo de arma de fogo, mas foram uníssonas no sentido de assegurar que o assaltante portava uma. Não houve perícia, pois os policiais que prenderam o réu em flagrante não lograram êxito em apreender a arma. Tais policiais afirmaram em juízo que, após escutarem gritos de “pega ladrão!”, viram o réu correndo e foram em seu encalço. Afirmaram que, durante a perseguição, os passantes apontavam para o réu, bem como que este jogou um objeto no córrego que passava próximo ao local dos fatos, que acreditavam ser a arma de fogo utilizada. O réu, em seu interrogatório, exerceu o direito ao silêncio. Ao cabo da instrução criminal, Tício foi condenado a oito anos e seis meses de reclusão, por roubo com emprego de arma de fogo, tendo sido fixado o regime inicial fechado para cumprimento de pena. O magistrado, para fins de condenação e fixação da pena, levou em conta os depoimentos testemunhais colhidos em juízo e o reconhecimento feito pela vítima em sede policial, bem como o fato de o réu ser reincidente e portador de maus antecedentes, circunstâncias comprovadas no curso do processo.

      Você, na condição de advogado(a) de Tício, é intimado(a) da decisão. Com base somente nas informações de que dispõe e nas que podem ser inferidas pelo caso concreto acima, redija a peça cabível, apresentando as razões e sustentando as teses jurídicas pertinentes. (Valor: 5,0)
    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
    opcoes:
      correta: Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
      erradas:
        - "Desenvolvimento jurídico acerca da impossibilidade de se absolver sumariamente pela inimputabilidade por não ser a única tese defensiva alegada na primeira fase do júri e consequente violação ao art. 415, parágrafo único, do CPP. Obs.: a mera indicação do artigo não pontua."
        - Redução do quantum de aumento realizado na terceira fase da dosimetria do crime de roubo, já que os fatos foram praticados antes da entrada em vigor da lei que aumentou o percentual de aumento em razão do emprego de arma de fogo OU em razão do princípio da irretroatividade da lei penal prejudicial ao réu, conforme Art. 5º, inciso XL, da CRFB.
        - Da tese da prática de crime único, pois o delito de estupro de vulnerável é um tipo misto alternativo (de conteúdo múltiplo ou variado).
        - O reconhecimento do erro de tipo tem como consequência a exclusão do dolo ou atipicidade da conduta.
        - A prática de falta grave não gera o reinício da contagem do prazo de indulto, nos termos da Súmula 535 do STJ.
    revisao: *a1
