    comando: Que pedido deve ser formulado na peça?
    gabarito: Absolvição, com argumento e base legal.
    opcoes:
      correta: Absolvição, com argumento e base legal.
      erradas:
        - Pedido de habilitação, na interposição, do pai da vítima como assistente de acusação.
        - Conhecimento e provimento do recurso.
        - "Pedidos: Preliminarmente, a extinção da punibilidade."
        - Requerimento de reconhecimento da prescrição da pretensão punitiva do Estado, com consequente extinção da punibilidade do agente, nos termos do Art. 107, inciso IV, do CP.
