# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "04"
introducoes:
  peca: "Tício foi condenado a 8 anos e 6 meses, no regime fechado, por roubo com emprego de arma de fogo. Na delegacia, a vítima o reconheceu olhando por um orifício da porta de uma sala onde só ele estava. A arma não foi apreendida: os policiais acham que ele a jogou num córrego durante a fuga, e ninguém disse tê-la ouvido disparar. O juiz se apoiou nos depoimentos em juízo e no reconhecimento feito na delegacia. Você defende Tício na apelação."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["04-peca-3", "04-peca-4", "04-peca-7", "04-peca-8"]
perguntas:
  - id: 04-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Por que o reconhecimento feito na delegacia não pode servir à condenação de Tício?"
    tese: "Nulidade do reconhecimento, que não seguiu as formalidades legais (a vítima viu só o réu, sem outras pessoas ao lado)"
    aceitos: [ "formalidade* | nulo | nulidade | invalid* | inobserv* | semelhan*" ]
    artigos: [ "art. 226, II, CPP" ]
    gabarito: "Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP."
    revisao: { status: revisado }
  - id: 04-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Que tese a defesa deve sustentar quanto à causa de aumento do emprego de arma de fogo?"
    tese: "Afastamento da majorante: sem a arma apreendida, não houve a perícia que provaria a potencialidade lesiva"
    aceitos: [ [ "afast* | exclu* | decote | nao incid*" ], [ "pericia | pericial | potencialidade" ] ]
    artigos: [ "art. 158, CPP" ]
    gabarito: "Ausência de apreensão da arma (ou de potencialidade lesiva), o que impede o exame pericial, nos termos do art. 158 do CPP; ninguém afirmou que a arma tenha disparado: impossível a perícia indireta."
    revisao: { status: revisado }
