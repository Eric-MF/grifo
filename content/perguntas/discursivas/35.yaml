  - id: 35-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Em 09 de agosto de 2021, durante uma reunião de condomínio, iniciou-se uma discussão. O morador Paulo, lutador de vale tudo, chamou Fábio, o síndico, de ladrão. Ato contínuo, Paulo partiu para cima de Fábio, no intuito de quebrar seu nariz com um soco. Em seguida, Fábio, praticante de jiu jitsu, golpeou Paulo, que caiu no chão desmaiado. Paulo foi levado para o hospital, mas foi liberado horas depois. O laudo hospitalar atestou apenas escoriações leves.

      Em 10 de maio de 2022, em outra reunião de condomínio, Paulo e Fábio encontraram-se novamente. Fábio já tinha esquecido os fatos ocorridos na ocasião anterior, porque não era pessoa de guardar rancor. No entanto, Paulo lembrou de tudo que passou, sentiu-se envergonhado perante os demais condôminos e resolveu seguir em frente para processar Fábio criminalmente. No dia seguinte, Paulo noticiou o ocorrido na reunião anterior à autoridade policial e apresentou o laudo hospitalar para comprovar a lesão sofrida.

      Após os trâmites regulares das investigações, o promotor de justiça com atribuição para o caso ofereceu denúncia em face Fábio como incurso nas sanções do crime de lesão corporal leve, previsto no art. 129, caput do CP. A denúncia foi recebida e determinada a citação do réu.

      Considerando as informações acima, na condição de advogado(a) de Fábio, responda aos itens a seguir.
    comando: Qual tese a defesa pode alegar como preliminar? Justifique.
    gabarito: Em preliminar de defesa, deve ser alegada a extinção de punibilidade pela decadência, na forma do Art. 38 do CPP c/c. o Art. 107, inciso IV, do CP. Em se tratando de imputação pelo crime de lesão corporal leve, previsto no Art. 129, caput, do CP, a ação é penal pública condicionada à representação, conforme o Art. 88 da Lei nº 9.099/95. No caso, Paulo somente apresentou a representação após 6 meses do conhecimento da autoria do fato, quando transcorrido o prazo decadencial previsto no Art. 38 do CPP.
    opcoes:
      correta: Em preliminar de defesa, deve ser alegada a extinção de punibilidade pela decadência, tendo em vista que Paulo deixou de oferecer representação no prazo de 6 meses, conhecendo a autoria desde a data do fato, conforme estabelecido no Art. 38 do CPP c/c. o Art. 107, inciso IV, do CP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
