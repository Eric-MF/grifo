  - id: 35-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Arnaldo e Fábio, 22 anos, são irmãos gêmeos idênticos, mas Arnaldo sempre fez mais sucesso com as meninas por ser mais extrovertido. Arnaldo inicia um relacionamento com Mônica, de 14 anos. Ambos costumam manter relação sexual consentida.

      Elena, amiga de Mônica, sempre foi apaixonada por Arnaldo e, movida por ciúmes, resolve noticiar às autoridades sobre as relações mantidas entre Arnaldo e Mônica, no intuito de incriminá-lo por estupro de vulnerável.

      Noticiado o fato em sede policial e concluídas as investigações, o Ministério Público ofereceu denúncia, imputando a Arnaldo o crime de estupro de vulnerável, previsto no Art. 217-A do CP. Após recebimento da denúncia, citação e apresentação de defesa, foi designada audiência de instrução e julgamento. De posse do mandado, o oficial de justiça foi até a residência dos irmãos e realizou a intimação na pessoa de Fábio, que se fez passar por Arnaldo.

      No dia da audiência, Arnaldo não compareceu, embora seu advogado estivesse presente. Finalizada a instrução e após alegações finais, o juiz condenou Arnaldo no crime de estupro de vulnerável, na forma do Art. 217-A do CP, a pena de 8 anos de reclusão, visto que Arnaldo não tinha qualquer anotação criminal, sendo favoráveis as condições do crime.

      Considerando apenas as informações narradas no enunciado, responda aos itens a seguir.
    comando: O que pode ser alegado em favor de Arnaldo em matéria processual? Justifique.
    gabarito: Nulidade da intimação e dos demais atos, na forma do Art. 564, inciso IV, do CPP. A intimação deveria ter sido feita na pessoa do réu, Arnaldo, de modo que ele ficou privado de efetuar sua autodefesa na audiência de instrução e julgamento, restando evidente o prejuízo diante da condenação. Houve, portanto, violação ao Princípio da Ampla Defesa e do Contraditório ou ao Princípio do Devido Processo Legal, na forma do Art. 5º, incisos LV e LIV, da CRFB/88.
    opcoes:
      correta: A intimação deveria ter sido feita na pessoa do réu, Arnaldo, de modo que ele ficou privado de efetuar sua autodefesa na audiência de instrução e julgamento, em violação ao Princípio da Ampla Defesa ou do Contraditório ou do Princípio do Devido Processo Legal. Houve, portanto, nulidade da intimação e dos demais atos subsequentes, na forma do Art. 564, inciso IV, do CPP ou do Art. 5º, incisos LV e LIV, da CRFB/88.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
