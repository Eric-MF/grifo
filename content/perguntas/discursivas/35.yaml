    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: No mérito, absolvição de Júlio, na forma do Art. 386, incisos III ou VI, do CPP.
    opcoes:
      correta: No mérito, absolvição de Júlio, na forma do Art. 386, incisos III ou VI, do CPP.
      erradas:
        - Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
        - No mérito, deveria ser buscada a absolvição do réu em relação ao crime de corrupção de menores, tendo em vista que ocorreu erro de tipo, nos termos do Art. 20, caput, do CP.
        - Em consequência da pena base no mínimo legal deve ser fixado o regime semiaberto, pois a imposição obrigatória do regime inicial fechado é inconstitucional.
        - Reconhecimento da causa de diminuição do arrependimento posterior, tendo em vista que houve restituição da coisa subtraída, nos termos do Art. 16 do Código Penal.
        - O não comparecimento do réu configura violação ao princípio da ampla defesa, nos termos do Art. 5º, inciso LV, da CRFB
