# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "35"
introducoes:
  peca: "Júlio pôs fogo na casa desabitada da família, numa fazenda isolada, sem ninguém nem bens de terceiros por perto, e foi condenado por incêndio. Estava completamente embriagado: o dono do bar, sem ele saber, misturou cachaça na água com gás que pediu, e a bebida reagiu com o remédio que ele tomava. Antes da instrução, o juiz ouviu as vítimas antecipadamente só porque a pauta de réu solto era distante. Júlio confessou. Na pena, o juiz usou como maus antecedentes uma condenação por fato posterior ao incêndio, aplicou a agravante do meio que pode causar perigo comum, não reconheceu atenuantes e fixou 3 anos e 8 meses no semiaberto, sem substituição. Você defende Júlio na apelação."
  q1: "Pedro tinha uma condenação definitiva por furto, a pena substituída por multa já paga. Depois, foi condenado por roubo tentado a 1 ano e 4 meses no semiaberto, e o juiz negou a suspensão condicional da pena por causa da reincidência. A defesa apelou só dessa parte da sentença, mas o juiz não admitiu a apelação."
  q2: "Roberto foi denunciado por perseguição porque, num único dia em que o colega Fábio visitava a filial da empresa, lançou-lhe olhares lascivos. O Ministério Público recusou a transação penal por causa de uma condenação antiga de Roberto, com a pena extinta há mais de cinco anos."
  q3: "Numa reunião de condomínio, Paulo, lutador, xingou o síndico Fábio de ladrão e partiu para cima dele para quebrar seu nariz com um soco. Fábio, que pratica jiu-jitsu, o derrubou, e Paulo teve só escoriações leves. Nove meses depois, Paulo noticiou o fato à polícia, e o Ministério Público denunciou Fábio por lesão corporal leve. Você defende Fábio."
  q4: "Arnaldo, de 22 anos, namora Mônica, de 14, e os dois mantêm relações sexuais consentidas. Foi denunciado por estupro de vulnerável. A intimação para a audiência foi entregue a Fábio, irmão gêmeo de Arnaldo, que se passou por ele. Arnaldo não foi à audiência, embora o advogado estivesse lá, e acabou condenado a 8 anos."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["35-peca-1", "35-peca-4", "35-peca-14"]
perguntas:
  - id: 35-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: preliminar
    pergunta: "Que preliminar a defesa deve levantar contra a oitiva antecipada das vítimas?"
    tese: "Nulidade da oitiva antecipada das vítimas: o simples decurso do tempo não justifica a produção antecipada de provas"
    aceitos: [ "nulidade | nulo | nula | anula*" ]
    artigos: [ "art. 225, CPP", "Súmula 455 STJ", "art. 564, IV, CPP" ]
    gabarito: "Preliminarmente, nulidade na oitiva das vítimas, tendo em vista que o mero decurso de tempo não é fundamento idôneo para produção antecipada de provas, nos termos do Art. 225 do CPP, ou Art. 564, inciso IV, do CPP, ou Súmula 455 do STJ."
    revisao: { status: revisado }
  - id: 35-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Qual é o pedido principal da defesa, no mérito, quanto à imputação de incêndio?"
    tese: "Absolvição quanto ao crime de incêndio"
    aceitos: [ "absolvi* | absolver" ]
    artigos: [ "art. 386, III, CPP", "art. 386, VI, CPP" ]
    gabarito: "No mérito, absolvição de Júlio, na forma do Art. 386, incisos III ou VI, do CPP."
    revisao: { status: revisado }
  - id: 35-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "O fogo atingiu só a casa isolada, sem expor ninguém a perigo. Que tese a defesa deve sustentar quanto ao crime de incêndio?"
    tese: "Atipicidade do incêndio, que exige perigo concreto a número indeterminado de pessoas (ou desclassificação para dano qualificado)"
    aceitos: [ [ "atipic*" ], [ "desclassifica*", "dano" ] ]
    artigos: [ "art. 250, CP", "art. 163, parágrafo único, II, CP" ]
    gabarito: "Atipicidade da conduta ou desclassificação para crime de dano qualificado, tendo em vista que a conduta de Júlio de colocar fogo no imóvel não gerou perigo a número indeterminado de pessoas e o crime de incêndio é crime de perigo comum, exigindo prova de perigo concreto."
    revisao: { status: revisado }
  - id: 35-peca-8-1
    categoria: peca-detalhe
    parte: peca
    item: "8.1"
    secao: merito
    pergunta: "Por causa da embriaguez de Júlio, que elemento do crime a defesa deve dizer que falta?"
    tese: "Exclusão da culpabilidade, por inimputabilidade"
    aceitos: [ "culpabilidade | inimputab* | isento de pena | isencao de pena" ]
    artigos: [ "art. 28, § 1º, CP" ]
    gabarito: "Excludente de culpabilidade, em razão da inimputabilidade."
    revisao: { status: revisado }
  - id: 35-peca-8-2
    categoria: peca-detalhe
    parte: peca
    item: "8.2"
    secao: merito
    pergunta: "A embriaguez de Júlio isenta de pena. Que característica dela leva à isenção?"
    tese: "Embriaguez completa proveniente de caso fortuito ou força maior"
    aceitos: [ "caso fortuito | forca maior | fortuita | involuntaria" ]
    artigos: [ "art. 28, § 1º, CP" ]
    gabarito: "Pois a embriaguez era completa e proveniente de caso fortuito ou de força maior, na forma do Art. 28, §1º, do CP."
    revisao: { status: revisado }
  - id: 35-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Na primeira fase da dosimetria, o que a defesa deve pedir quanto à pena-base?"
    tese: "Pena-base no mínimo legal: a condenação por fato posterior ao crime não gera maus antecedentes"
    aceitos: [ "minimo" ]
    artigos: [ "art. 59, CP" ]
    gabarito: "Subsidiariamente: aplicação da pena base no mínimo legal, tendo em vista que o fato posterior ao crime julgado não pode ser considerado maus antecedentes."
    revisao: { status: revisado }
  - id: 35-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Na segunda fase da dosimetria, o que a defesa deve pedir quanto à agravante aplicada pelo juiz?"
    tese: "Afastamento da agravante: o perigo comum já é elementar do incêndio (bis in idem)"
    aceitos: [ [ "afast* | nao incid* | exclu* | decote" ], [ "bis in idem" ], [ "elementar" ] ]
    artigos: [ "art. 61, II, d, CP", "art. 61, II, b, CP" ]
    gabarito: "Afastamento da agravante do Art. 61, inciso II, alínea d (ou b), do CP, pois a situação de perigo comum é elementar do tipo imputado ou por configurar bis in idem ou por não haver a intenção de ocultação, vantagem ou impunidade de outro crime."
    revisao: { status: revisado }
  - id: 35-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Júlio confessou o crime. Que atenuante a defesa deve pedir na segunda fase?"
    tese: "Atenuante da confissão espontânea"
    aceitos: [ "confissao espontanea | confissao" ]
    artigos: [ "art. 65, III, d, CP" ]
    gabarito: "Reconhecimento da atenuante da confissão espontânea, na forma do Art. 65, inciso III, alínea d, do CP."
    revisao: { status: revisado }
  - id: 35-peca-12
    categoria: peca-detalhe
    parte: peca
    item: "12"
    secao: merito
    pergunta: "Com a pena no mínimo, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto"
    aceitos: [ "aberto" ]
    artigos: [ "art. 33, § 2º, c, CP" ]
    gabarito: "Aplicação do regime inicial aberto para cumprimento da pena, na forma do Art. 33, § 2º, alínea c, do CP."
    revisao: { status: revisado }
  - id: 35-peca-13
    categoria: peca-detalhe
    parte: peca
    item: "13"
    secao: merito
    pergunta: "Além do regime, o que a defesa deve pedir quanto à espécie de pena?"
    tese: "Substituição da pena privativa de liberdade por restritivas de direitos"
    aceitos: [ "substitui*", "restritiva* | direitos" ]
    artigos: [ "art. 44, CP" ]
    gabarito: "Substituição da pena privativa de liberdade por restritiva de direitos, nos termos do Art. 44 do CP."
    revisao: { status: revisado }
  - id: 35-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que recurso cabe contra a decisão que não admitiu a apelação de Pedro?"
    tese: "Recurso em sentido estrito"
    aceitos: [ "recurso em sentido estrito | rese" ]
    artigos: [ "art. 581, XV, CPP" ]
    gabarito: "O examinando deve apontar que o recurso adequado a impugnar a decisão que não admitiu a apelação é o Recurso em Sentido Estrito, nos termos do Art. 581, inciso XV, do CPP. Como fundamento para questionar a inadmissão do recurso de Apelação, deveria indicar que a negativa da suspensão condicional da pena ocorreu em sede de sentença penal condenatória, proferida por juiz de primeiro grau. Desse modo, a defesa técnica interpôs corretamente o Recurso de Apelação para questionar a sentença, pois, como dispõe o Art. 593, § 4º, do CPP, quando cabível a apelação, não poderá ser usado o recurso em sentido estrito, ainda que somente de parte da decisão se recorra. Desse modo, como disciplina o próprio Art. 593, inciso I, o recurso adequado para impugnar as sentenças de mérito, de condenação ou absolvição, é a apelação, no prazo de 5 dias, e não poderia o juízo a quo ter inadmitido o recurso defensivo."
    revisao: { status: revisado }
  - id: 35-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que característica da condenação anterior de Pedro permite a suspensão condicional da pena, apesar da reincidência?"
    tese: "A condenação anterior só à pena de multa não impede o sursis"
    aceitos: [ "multa" ]
    artigos: [ "art. 77, § 1º, CP" ]
    gabarito: "O examinando deveria desenvolver raciocínio no sentido de que existe tese de direito material a ser alegada no caso concreto, objetivando a concessão do sursis. É que o magistrado negou a suspensão condicional da pena sustentando que o condenado era reincidente. De fato, Pedro ostentava condenação definitiva anterior à prática do crime de roubo tentado. Ocorre que o agente fora anteriormente condenado à pena de multa e, nos termos do Art. 77, § 1º, do Código Penal, a condenação anterior a pena de multa não impede a concessão da suspensão condicional da pena. Desse modo, Pedro faz jus ao benefício."
    revisao: { status: revisado }
  - id: 35-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Por que a conduta de Roberto não configura o crime de perseguição?"
    tese: "Atipicidade: a perseguição é crime habitual e exige reiteração da conduta"
    aceitos: [ [ "habitual" ], [ "reitera*" ], [ "atipic*" ] ]
    artigos: [ "art. 147-A, CP" ]
    gabarito: "Atipicidade objetiva da conduta, pois a figura delitiva da perseguição (Art. 147-A do CP) adota verbo nuclear no infinitivo (“perseguir”), o que denota crime habitual, a exigir reiteração do comportamento para a caracterização da tipicidade objetiva. No caso concreto, inexistiu reiteração, tratando-se de episódio isolado, ocorrido num único dia."
    revisao: { status: revisado }
  - id: 35-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que medida a defesa pode adotar para viabilizar a transação penal recusada pelo Ministério Público?"
    tese: "Remessa dos autos ao órgão superior do Ministério Público, porque a condenação extinta há mais de cinco anos não gera reincidência"
    aceitos: [ "orgao superior | procurador-geral | procurador geral | procuradoria-geral | procuradoria geral | chefe do ministerio publico" ]
    artigos: [ "art. 64, I, CP" ]
    gabarito: "A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos (Art. 64, inciso I do CP)."
    revisao: { status: revisado }
  - id: 35-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que preliminar a defesa de Fábio pode alegar, considerando quando Paulo noticiou o fato?"
    tese: "Extinção da punibilidade pela decadência do direito de representação"
    aceitos: [ "decaden*" ]
    artigos: [ "art. 38, CPP", "art. 107, IV, CP" ]
    gabarito: "Em preliminar de defesa, deve ser alegada a extinção de punibilidade pela decadência, na forma do Art. 38 do CPP c/c. o Art. 107, inciso IV, do CP. Em se tratando de imputação pelo crime de lesão corporal leve, previsto no Art. 129, caput, do CP, a ação é penal pública condicionada à representação, conforme o Art. 88 da Lei nº 9.099/95. No caso, Paulo somente apresentou a representação após 6 meses do conhecimento da autoria do fato, quando transcorrido o prazo decadencial previsto no Art. 38 do CPP."
    revisao: { status: revisado }
  - id: 35-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "No mérito, que tese justifica o golpe de Fábio em Paulo?"
    tese: "Legítima defesa, que exclui a ilicitude"
    aceitos: [ "legitima defesa" ]
    artigos: [ "art. 25, CP", "art. 23, II, CP" ]
    gabarito: "Fábio atuou em legítima defesa, uma vez que, usando moderadamente dos meios necessários, repeliu injusta e iminente agressão de Paulo, que foi em sua direção para lhe dar um soco com o intuito de quebrar seu nariz.\n\nAssim, houve exclusão da ilicitude do fato e Fábio não responde por crime algum, na forma do Art. 23, inciso II c/c. o Art. 25, caput, ambos do CP."
    revisao: { status: revisado }
  - id: 35-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que vício processual a defesa de Arnaldo deve apontar quanto à intimação para a audiência?"
    tese: "Nulidade da intimação, feita a outra pessoa, e dos atos seguintes, por violação da ampla defesa"
    aceitos: [ "nulidade | nulo | nula | anula*" ]
    artigos: [ "art. 564, IV, CPP", "art. 5, LV, CRFB", "art. 5, LIV, CRFB" ]
    gabarito: "Nulidade da intimação e dos demais atos, na forma do Art. 564, inciso IV, do CPP. A intimação deveria ter sido feita na pessoa do réu, Arnaldo, de modo que ele ficou privado de efetuar sua autodefesa na audiência de instrução e julgamento, restando evidente o prejuízo diante da condenação. Houve, portanto, violação ao Princípio da Ampla Defesa e do Contraditório ou ao Princípio do Devido Processo Legal, na forma do Art. 5º, incisos LV e LIV, da CRFB/88."
    revisao: { status: revisado }
  - id: 35-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Por que a relação entre Arnaldo e Mônica não configura estupro de vulnerável?"
    tese: "Atipicidade: o estupro de vulnerável protege quem tem menos de 14 anos, e Mônica já tinha 14"
    aceitos: [ [ "atipic*" ], [ "14 anos" ], [ "menor de 14 | menos de 14 | menores de 14" ] ]
    artigos: [ "art. 217-A, CP", "art. 386, III, CPP" ]
    gabarito: "Arnaldo deve ser absolvido, na forma do Art. 386, inciso III, do CPP, porque o delito de estupro de vulnerável tem como vítima pessoa menor de 14 anos, conforme o Art. 217-A, caput, do CP. Mônica tinha 14 anos e, portanto, capacidade para consentir a relação sexual. Dessa forma, o fato é atípico."
    revisao: { status: revisado }
