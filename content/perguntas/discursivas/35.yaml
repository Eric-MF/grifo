    caso: |-
      Pedro, nascido em 20 de janeiro de 2000, foi condenado, definitivamente, pela prática do crime furto simples à pena de 1 ano de reclusão em regime inicial aberto, tendo sua pena privativa de liberdade substituída por pena de multa.

      O crime ocorreu no dia 14 de junho de 2018, e a sentença condenatória transitou em julgado, no dia 20 de abril de 2019, tendo sido feito o pagamento da multa no prazo legal. Ocorre que, no dia 23 de março de 2020, o agente foi preso em flagrante, após empregar ameaça para subtrair o aparelho telefônico de Luiza. Os policiais que efetuaram a prisão conseguiram evitar a consumação delitiva e, posteriormente, Pedro foi denunciado pela prática do crime de roubo, em sua modalidade tentada. Finda a instrução, foi condenado na forma do Art. 157, c/c. Art. 14, inciso II, ambos do Código Penal.

      Ao aplicar a pena, o juiz fixou a pena-base no mínimo legal, pois favoráveis as circunstâncias judiciais. Na segunda fase, manteve a pena no patamar de 4 anos, apesar de reconhecer a agravante da reincidência. Isto porque observou a menoridade relativa do agente à data do fato. Aplicada a minorante da tentativa em sua fração máxima, alcançou a pena definitiva de 1 ano e 4 meses de reclusão e fixou o regime inicial semi-aberto, sendo negada a suspensão condicional da pena em razão da reincidência. A defesa técnica de Pedro interpôs, assim, recurso de apelação, insurgindo-se apenas quanto à negativa do sursis. O magistrado, no entanto, não admitiu o recurso, sustentando que a via adequada era a do Recurso em Sentido Estrito, a teor do Art. 581, inciso XI, do Código de Processo Penal.

      Considerando apenas as informações apresentadas, responda, na qualidade de advogado(a) de Pedro, aos itens a seguir.
    comando: Existe alguma tese de Direito Penal material que permita a concessão da suspensão condicional da pena no caso concreto? Justifique.
    gabarito: O examinando deveria desenvolver raciocínio no sentido de que existe tese de direito material a ser alegada no caso concreto, objetivando a concessão do sursis. É que o magistrado negou a suspensão condicional da pena sustentando que o condenado era reincidente. De fato, Pedro ostentava condenação definitiva anterior à prática do crime de roubo tentado. Ocorre que o agente fora anteriormente condenado à pena de multa e, nos termos do Art. 77, § 1º, do Código Penal, a condenação anterior a pena de multa não impede a concessão da suspensão condicional da pena. Desse modo, Pedro faz jus ao benefício.
    opcoes:
      correta: A condenação anterior à pena de multa não impede a concessão da suspensão condicional da pena, de acordo com o Art. 77, § 1º, do CP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 35-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Roberto foi denunciado pelo crime de perseguição (Art. 147-A do CP). Segundo a denúncia, no dia 15 de janeiro de 2022, na filial da sociedade empresária Ruan S/A, situada no Rio de Janeiro/RJ, Roberto se aproveitou da proximidade física com Fábio (colega que trabalha na matriz da empresa em São Paulo/SP e estava visitando a filial carioca por um dia apenas) no ambiente de trabalho, para lançar-lhe olhares lascivos, o que teria “perturbado a esfera de liberdade ou privacidade” de Fábio. Este ofereceu representação contra Roberto.

      O Ministério Público se recusou a formular proposta de transação penal a Roberto, com fundamento em uma anotação existente na sua Folha de Antecedentes Criminais (FAC), relativa à condenação definitiva à pena corporal – extinta há mais de 5 (cinco) anos – pela prática de crime.

      Sobre a hipótese apresentada, responda aos itens a seguir.
    comando: Quais teses de mérito podem ser invocadas pelo defensor técnico de Roberto? Justifique.
    gabarito: Atipicidade objetiva da conduta, pois a figura delitiva da perseguição (Art. 147-A do CP) adota verbo nuclear no infinitivo (“perseguir”), o que denota crime habitual, a exigir reiteração do comportamento para a caracterização da tipicidade objetiva. No caso concreto, inexistiu reiteração, tratando-se de episódio isolado, ocorrido num único dia.
    opcoes:
      correta: Atipicidade objetiva da conduta, pois a figura delitiva da perseguição (Art. 147-A do CP); adota verbo nuclear no infinitivo (“perseguir”), o que denota crime habitual, a exigir reiteração do comportamento para a caracterização da tipicidade objetiva
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
