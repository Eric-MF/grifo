  - id: 35-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Pedro, nascido em 20 de janeiro de 2000, foi condenado, definitivamente, pela prática do crime furto simples à pena de 1 ano de reclusão em regime inicial aberto, tendo sua pena privativa de liberdade substituída por pena de multa.

      O crime ocorreu no dia 14 de junho de 2018, e a sentença condenatória transitou em julgado, no dia 20 de abril de 2019, tendo sido feito o pagamento da multa no prazo legal. Ocorre que, no dia 23 de março de 2020, o agente foi preso em flagrante, após empregar ameaça para subtrair o aparelho telefônico de Luiza. Os policiais que efetuaram a prisão conseguiram evitar a consumação delitiva e, posteriormente, Pedro foi denunciado pela prática do crime de roubo, em sua modalidade tentada. Finda a instrução, foi condenado na forma do Art. 157, c/c. Art. 14, inciso II, ambos do Código Penal.

      Ao aplicar a pena, o juiz fixou a pena-base no mínimo legal, pois favoráveis as circunstâncias judiciais. Na segunda fase, manteve a pena no patamar de 4 anos, apesar de reconhecer a agravante da reincidência. Isto porque observou a menoridade relativa do agente à data do fato. Aplicada a minorante da tentativa em sua fração máxima, alcançou a pena definitiva de 1 ano e 4 meses de reclusão e fixou o regime inicial semi-aberto, sendo negada a suspensão condicional da pena em razão da reincidência. A defesa técnica de Pedro interpôs, assim, recurso de apelação, insurgindo-se apenas quanto à negativa do sursis. O magistrado, no entanto, não admitiu o recurso, sustentando que a via adequada era a do Recurso em Sentido Estrito, a teor do Art. 581, inciso XI, do Código de Processo Penal.

      Considerando apenas as informações apresentadas, responda, na qualidade de advogado(a) de Pedro, aos itens a seguir.
    comando: Aponte o recurso a ser interposto em face da decisão do juiz de primeiro grau que não admitiu a apelação e o fundamento de direito processual penal a ser alegado para que o apelo seja admitido. Justifique.
    gabarito: O examinando deve apontar que o recurso adequado a impugnar a decisão que não admitiu a apelação é o Recurso em Sentido Estrito, nos termos do Art. 581, inciso XV, do CPP. Como fundamento para questionar a inadmissão do recurso de Apelação, deveria indicar que a negativa da suspensão condicional da pena ocorreu em sede de sentença penal condenatória, proferida por juiz de primeiro grau. Desse modo, a defesa técnica interpôs corretamente o Recurso de Apelação para questionar a sentença, pois, como dispõe o Art. 593, § 4º, do CPP, quando cabível a apelação, não poderá ser usado o recurso em sentido estrito, ainda que somente de parte da decisão se recorra. Desse modo, como disciplina o próprio Art. 593, inciso I, o recurso adequado para impugnar as sentenças de mérito, de condenação ou absolvição, é a apelação, no prazo de 5 dias, e não poderia o juízo a quo ter inadmitido o recurso defensivo.
    opcoes:
      correta: O recurso cabível é o Recurso em Sentido Estrito, nos termos do Art. 581, inciso XV, do CPP. O argumento de direito processual é que a apelação deveria ser admitida, pois é o recurso adequado à impugnação das sentenças condenatórias, ainda que se recorra apenas de parte delas.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Tendo em vista que o delito de tráfico privilegiado não é crime equiparado a hediondo, aplica-se a progressão pelo percentual de 16%, nos termos do Art. 112, § 5º ou Art. 112, inciso I, da LEP.
        - Favorecimento real OU praticou o delito descrito no Art. 349, do CP.
        - Deveria ser alegada a impossibilidade de condenação na imputação originária, pois o juiz está adstrito aos termos do aditamento (Art. 384, §4º, do CPP) OU porque não foram observados os princípios da ampla defesa e do contraditório OU houve violação ao princípio da correlação.
        - Sim, o argumento seria de que ocorreu a prescrição da pretensão executória, com consequente extinção da punibilidade do agente, conforme o Art. 107, inciso IV, do CP, OU o Art. 109, inciso V, do CP, OU o Art. 110 do CP.
    revisao: *a1
