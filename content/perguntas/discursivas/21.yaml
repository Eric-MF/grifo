    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Arguição de que a conduta narrada evidentemente não constituir crime em razão da atipicidade, diante da aplicação do princípio da bagatela/insignificância
    opcoes:
      correta: Arguição de que a conduta narrada evidentemente não constituir crime em razão da atipicidade, diante da aplicação do princípio da bagatela/insignificância
      erradas:
        - Atipicidade do art. 239, parágrafo único, do ECA, por ausência de dolo.
        - Possibilidade de substituição da pena privativa de liberdade por restritiva de direitos, conforme Art. 44 do CP OU possibilidade de aplicação da pena de multa, conforme art. 155, § 2º, do CP.
        - Substituição da pena privativa de liberdade por restritivas de direitos, pois o STF reconheceu a inconstitucionalidade da vedação trazida pelo Art. 33, § 4º, da Lei nº 11.343/06 OU porque a Resolução 05 do Senado Federal suspendeu a eficácia dessa vedação.
        - No mérito, absolvição de Lauro.
        - Reconhecimento da causa de diminuição de pena da tentativa, já que o crime não se consumou por circunstâncias alheias à vontade dos agentes OU porque não houve subtração do dinheiro que estava no caixa do estabelecimento OU porque não houve inversão da posse como exige a Súmula 582 do STJ.
