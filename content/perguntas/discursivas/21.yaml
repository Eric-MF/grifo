    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Reconhecimento da causa de extinção da punibilidade, em razão da ocorrência de prescrição da pretensão punitiva estatal. Citação do art. 107, IV, do CP
    opcoes:
      correta: Reconhecimento da causa de extinção da punibilidade, em razão da ocorrência de prescrição da pretensão punitiva estatal. Citação do art. 107, IV, do CP
      erradas:
        - Atipicidade do art. 239, parágrafo único, do ECA, por ausência de dolo.
        - "Da aplicação do princípio da consunção ou absorção: o crime de violação de domicílio deve ser absorvido pelo delito de furto qualificado, pois configurou crime-meio, essencial à execução do crime-fim; deve ser excluída a condenação pela violação de domicílio."
        - Subsidiariamente, aplicação da pena base no mínimo
        - Subsidiariamente, afastar a qualificadora pois não há prova nos autos da idade da vítima, nos termos do Art. 213, §1º do CP
        - No mérito, pedido de absolvição sumária, diante da manifesta causa de isenção de pena ou excludente de culpabilidade, nos termos do Art. 415, inciso IV, do CPP
