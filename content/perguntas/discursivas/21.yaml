  - id: 21-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Paulo e Júlio, colegas de faculdade, comemoravam juntos, na cidade de São Gonçalo, o título obtido pelo clube de futebol para o qual o primeiro torce. Não obstante o clima de confraternização, em determinado momento, surgiu um entrevero entre eles, tendo Júlio desferido um tapa no rosto de Paulo. Apesar da pouca intensidade do golpe, Paulo vem a falecer no hospital da cidade, tendo a perícia constatado que a morte decorreu de uma fatalidade, porquanto, sem que fosse do conhecimento de qualquer pessoa, Paulo tinha uma lesão pretérita em uma artéria, que foi violada com aquele tapa desferido por Júlio e causou sua morte. O órgão do Ministério Público, em atuação exclusivamente perante o Tribunal do Júri da Comarca de São Gonçalo, denunciou Júlio pelo crime de lesão corporal seguida de morte (Art. 129, § 3º, do CP).

      Considerando a situação narrada e não havendo dúvidas em relação à questão fática, responda, na condição de advogado(a) de Júlio:
    comando: É competente o juízo perante o qual Júlio foi denunciado? Justifique.
    gabarito: O(A) examinando(a) deve concluir pela incompetência do Juízo, tendo em vista que o crime praticado não é doloso contra a vida. Nos termos do Art. 74, § 1º, do Código de Processo Penal (ou Art. 5º, inciso XXXVIII, alínea d, da CRFB), ao Tribunal do Júri cabe apenas o julgamento dos crimes dolosos contra a vida e os conexos. No caso, mesmo de acordo com a imputação contida na denúncia, o resultado de morte foi culposo; logo, a competência é do juízo singular.
    opcoes:
      correta: O Tribunal do Júri não é o juízo competente, pois o crime imputado não é doloso contra a vida, nos termos do Art. 74, § 1º, do CPP OU do Art. 5º, inciso XXXVIII, da CRFB/88.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Aplicação do perdão judicial, nos termos do Art. 121, § 5º, do CP.
        - A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
    revisao: *a1
  - id: 21-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Paulo e Júlio, colegas de faculdade, comemoravam juntos, na cidade de São Gonçalo, o título obtido pelo clube de futebol para o qual o primeiro torce. Não obstante o clima de confraternização, em determinado momento, surgiu um entrevero entre eles, tendo Júlio desferido um tapa no rosto de Paulo. Apesar da pouca intensidade do golpe, Paulo vem a falecer no hospital da cidade, tendo a perícia constatado que a morte decorreu de uma fatalidade, porquanto, sem que fosse do conhecimento de qualquer pessoa, Paulo tinha uma lesão pretérita em uma artéria, que foi violada com aquele tapa desferido por Júlio e causou sua morte. O órgão do Ministério Público, em atuação exclusivamente perante o Tribunal do Júri da Comarca de São Gonçalo, denunciou Júlio pelo crime de lesão corporal seguida de morte (Art. 129, § 3º, do CP).

      Considerando a situação narrada e não havendo dúvidas em relação à questão fática, responda, na condição de advogado(a) de Júlio:
    comando: Qual tese de direito material poderia ser alegada em favor de Júlio? Justifique.
    gabarito: |-
      O(A) examinando(a) deve defender que não poderia Júlio responder pelo crime de lesão corporal seguida de morte, porque aquele resultado não foi causado a título de dolo nem culpa. O crime de lesão corporal seguida de morte é chamado de preterdoloso. A ação é dirigida à produção de lesão corporal, sendo o resultado morte produzido a título de culpa. Costuma-se dizer que há dolo no antecedente e culpa no consequente. Um dos elementos da culpa é a previsibilidade objetiva, somente devendo alguém ser punido na forma culposa quando o resultado não querido pudesse ser previsto por um homem médio, sendo que a ausência de previsibilidade subjetiva, capacidade do agente, no caso concreto, de prever o resultado, repercute na culpabilidade.

      Na hipótese, não havia previsibilidade objetiva, o que impede a tipificação do delito de lesão corporal seguida de morte. Também poderia o candidato responder que havia uma concausa preexistente, relativamente independente, desconhecida, impedindo Júlio de responder pelo resultado causado. Em princípio, a concausa relativamente independente preexistente não impede a punição do agente pelo crime consumado. Contudo, deve ela ser conhecida do agente ou ao menos existir possibilidade de conhecimento, sob pena de responsabilidade penal objetiva.
    opcoes:
      correta: "Júlio não poderia responder pelo resultado morte, nem mesmo a título de culpa, em razão da ausência de previsibilidade OU porque existe causa relativamente independente preexistente desconhecida OU porque a atribuição do resultado violaria o princípio da vedação da responsabilidade objetiva. Obs.: A mera repetição do enunciado no sentido de que o resultado decorreu de uma fatalidade em razão de lesão em artéria desconhecida, sem qualquer fundamentação jurídica, não é suficiente para atribuição do segundo intervalo de pontuação."
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Aplicação do perdão judicial, nos termos do Art. 121, § 5º, do CP.
        - A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
    revisao: *a1
  - id: 21-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      No dia 03 de março de 2016, Vinícius, reincidente específico, foi preso em flagrante em razão da apreensão de uma arma de fogo, calibre .38, de uso permitido, número de série identificado, devidamente municiada, que estava em uma gaveta dentro de seu local de trabalho, qual seja, o estabelecimento comercial “Vinícius House”, do qual era sócio-gerente e proprietário. Denunciado pela prática do crime do Artigo 14 da Lei nº 10.826/03, confessou os fatos, afirmando que mantinha a arma em seu estabelecimento para se proteger de possíveis assaltos. Diante da prova testemunhal e da confissão do acusado, o Ministério Público pleiteou a condenação nos termos da denúncia em alegações finais, enquanto a defesa afirmou que o delito do Art. 14 do Estatuto do Desarmamento não foi praticado, também destacando a falta de prova da materialidade.

      Após manifestação das partes, houve juntada do laudo de exame da arma de fogo e das munições apreendidas, constatando-se o potencial lesivo do material, tendo o magistrado, de imediato, proferido sentença condenatória pela imputação contida na denúncia, aplicando a pena mínima de 02 anos de reclusão e 10 dias-multa. O advogado de Vinícius é intimado da sentença e apresentou recurso de apelação.

      Considerando apenas as informações narradas, responda na condição de advogado(a) de Vinicius:
    comando: Qual requerimento deveria ser formulado em sede de apelação e qual tese de direito processual poderia ser alegada para afastar a sentença condenatória proferida em primeira instância? Justifique.
    gabarito: Em sede de apelação, deveria o advogado de Vinícius buscar o reconhecimento da nulidade da sentença, tendo em vista que, após manifestação da defesa, houve juntada de laudo de exame de arma de fogo, ou seja, de prova pericial, sem que fosse aberta vista às partes em relação à documentação. O não acesso pela defesa ao laudo de exame pericial violou o princípio da ampla defesa, em sua vertente da defesa técnica, além do próprio princípio do contraditório, já que aquela prova não lhe foi submetida. Assim, deveria a sentença ser anulada, sendo certo que o prejuízo foi constatado com a condenação do réu.
    opcoes:
      correta: Deveria o advogado de Vinicius requerer a anulação da sentença de primeira instância, tendo em vista houve violação ao princípio do contraditório ou da ampla defesa, no momento em que foi proferida sentença condenatória sem que a defesa tivesse vista da prova pericial juntada aos autos
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Aplicação do perdão judicial, nos termos do Art. 121, § 5º, do CP.
        - A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
    revisao: *a1
  - id: 21-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      No dia 03 de março de 2016, Vinícius, reincidente específico, foi preso em flagrante em razão da apreensão de uma arma de fogo, calibre .38, de uso permitido, número de série identificado, devidamente municiada, que estava em uma gaveta dentro de seu local de trabalho, qual seja, o estabelecimento comercial “Vinícius House”, do qual era sócio-gerente e proprietário. Denunciado pela prática do crime do Artigo 14 da Lei nº 10.826/03, confessou os fatos, afirmando que mantinha a arma em seu estabelecimento para se proteger de possíveis assaltos. Diante da prova testemunhal e da confissão do acusado, o Ministério Público pleiteou a condenação nos termos da denúncia em alegações finais, enquanto a defesa afirmou que o delito do Art. 14 do Estatuto do Desarmamento não foi praticado, também destacando a falta de prova da materialidade.

      Após manifestação das partes, houve juntada do laudo de exame da arma de fogo e das munições apreendidas, constatando-se o potencial lesivo do material, tendo o magistrado, de imediato, proferido sentença condenatória pela imputação contida na denúncia, aplicando a pena mínima de 02 anos de reclusão e 10 dias-multa. O advogado de Vinícius é intimado da sentença e apresentou recurso de apelação.

      Considerando apenas as informações narradas, responda na condição de advogado(a) de Vinicius:
    comando: Confirmados os fatos, qual tese de direito material poderia ser alegada para buscar uma condenação penal mais branda em relação ao quantum de pena para Vinicius? Justifique.
    gabarito: A tese de direito material a ser apresentada pela defesa técnica de Vinícius para buscar uma condenação mais branda é de que o delito praticado pelo réu foi de posse de arma de fogo e não de porte de arma de fogo, tendo em vista que o agente possuía, em seu local de trabalho, arma de fogo de uso permitido. Prevê o Art. 12 da Lei nº 10.826/03 que o crime de posse de arma de fogo poderá ocorrer não apenas quando o material bélico estiver na residência do agente, mas também em seu local de trabalho, desde que o agente seja o titular ou responsável legal pelo estabelecimento. No caso, todos os requisitos foram observados, já que a arma estava no local de trabalho de Vinícius, estabelecimento do qual o agente era proprietário e sócio-gerente. Assim, deveria a defesa buscar a desclassificação para o delito previsto no Art. 12 da Lei nº 10.826/03.
    opcoes:
      correta: A tese de direito material é a desclassificação para o crime de posse de arma de fogo, já que Vinicius possuía arma em seu local de trabalho, nos termos do Art. 12 da Lei nº 10.826/03.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Aplicação do perdão judicial, nos termos do Art. 121, § 5º, do CP.
        - A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
    revisao: *a1
  - id: 21-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Mário foi surpreendido por uma pessoa que, mediante ameaça verbal de morte, subtraiu seu celular. No dia seguinte, quando passava pelo mesmo local, avistou Paulo e o reconheceu como sendo a pessoa que o roubara no dia anterior. Levado para a delegacia, Paulo admitiu ter subtraído o celular de Mário mediante grave ameaça, mas alegou que estava em estado de necessidade. O celular não foi recuperado e Paulo foi liberado em razão da ausência da situação de flagrante. Oferecida a denúncia pela prática do delito de roubo, Paulo foi pessoalmente citado e manifestou interesse em ser assistido pela Defensoria Pública.

      No curso da instrução, a vítima, única testemunha arrolada pelo Ministério Público, não foi localizada, assim como Paulo nunca compareceu em juízo, sendo decretada sua revelia. A pretensão punitiva foi acolhida nos termos do pedido inicial, tendo o juiz fundamentado seu convencimento no que foi dito pelo lesado e pelo acusado na fase extrajudicial, aumentando a pena-base pelo fato de o agente ter ameaçado de morte o ofendido e deixando de reconhecer a atenuante da confissão espontânea porque qualificada.

      Considerando apenas as informações narradas, responda, na condição de advogado(a) de Paulo, aos itens a seguir.
    comando: Qual a tese jurídica a ser apresentada nas razões de apelação de modo a buscar a absolvição de Paulo? Justifique.
    gabarito: |-
      A tese jurídica a ser apresentada pela defesa de Paulo para garantir sua absolvição é de insuficiência probatória, já que o magistrado não pode fundamentar sua decisão exclusivamente com base em elementos informativos, nos termos do Art. 155 do Código de Processo Penal. Claramente o magistrado considerou apenas os elementos informativos produzidos em sede policial, que não foram submetidos ao princípio do contraditório.

      O conceito de prova exige o respeito a esse princípio. Os elementos informativos somente podem embasar um decreto condenatório se confirmados por provas produzidas sob o crivo do contraditório. Ademais, não estamos diante de nenhuma das exceções trazidas pelo Art. 155, in fine, do CPP. Considerando que a decisão do magistrado baseou-se exclusivamente nas palavras da vítima em sede policial e na confissão do acusado na delegacia, não havendo provas produzidas em juízo, a condenação foi indevida.
    opcoes:
      correta: Insuficiência probatória, tendo em vista que o magistrado baseou sua decisão exclusivamente em elementos informativos, o que é vedado pelo ordenamento jurídico, nos termos do Art. 155 do CPP OU Art. 5º, LV, da CRFB/88
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Aplicação do perdão judicial, nos termos do Art. 121, § 5º, do CP.
        - A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
    revisao: *a1
  - id: 21-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      Mário foi surpreendido por uma pessoa que, mediante ameaça verbal de morte, subtraiu seu celular. No dia seguinte, quando passava pelo mesmo local, avistou Paulo e o reconheceu como sendo a pessoa que o roubara no dia anterior. Levado para a delegacia, Paulo admitiu ter subtraído o celular de Mário mediante grave ameaça, mas alegou que estava em estado de necessidade. O celular não foi recuperado e Paulo foi liberado em razão da ausência da situação de flagrante. Oferecida a denúncia pela prática do delito de roubo, Paulo foi pessoalmente citado e manifestou interesse em ser assistido pela Defensoria Pública.

      No curso da instrução, a vítima, única testemunha arrolada pelo Ministério Público, não foi localizada, assim como Paulo nunca compareceu em juízo, sendo decretada sua revelia. A pretensão punitiva foi acolhida nos termos do pedido inicial, tendo o juiz fundamentado seu convencimento no que foi dito pelo lesado e pelo acusado na fase extrajudicial, aumentando a pena-base pelo fato de o agente ter ameaçado de morte o ofendido e deixando de reconhecer a atenuante da confissão espontânea porque qualificada.

      Considerando apenas as informações narradas, responda, na condição de advogado(a) de Paulo, aos itens a seguir.
    comando: Quais as teses jurídicas a serem apresentadas em sede de apelação de modo a buscar a redução da pena aplicada, caso mantida a condenação? Justifique.
    gabarito: Em busca da redução da pena aplicada, deveria o(a) advogado(a) de Paulo defender que o aumento da pena-base em razão da ameaça de morte empregada representa violação ao princípio do ne bis in idem, tendo em vista que a grave ameaça constitui elementar do tipo de roubo, e que deveria ser reconhecida a atenuante da confissão, pois, ainda que qualificada, escorou o decreto condenatório do magistrado, nos termos da Enunciado 545 da Súmula de Jurisprudência do Superior Tribunal de Justiça. Ademais, o Superior Tribunal de Justiça vem reconhecendo, de maneira tranquila, que a confissão qualificada, ou seja, aquela que apresenta causa excludente da ilicitude ou da culpabilidade, apesar de o agente confessar os fatos, é suficiente para o reconhecimento da atenuante.
    opcoes:
      correta: O aumento da pena base em razão da ameaça de morte configura bis in idem OU que a grave ameaça é elementar do tipo e deveria ser reconhecida a atenuante da confissão, já que, embora qualificada, escorou o decreto condenatório, nos termos da Súmula 545/STJ
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Mário não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90 por se tratar de novatio legis in pejus OU com base na irretroatividade da lei penal mais gravosa o artigo 2º, § 2º, da Lei 8.072/90 não se aplica a situação de Mário OU a antiga redação do artigo 2º, da Lei 8.072/90 é inconstitucional, razão pela qual a progressão deve ocorrer com base no Art. 112 da LEP, observando o quantum de 1/6 de cumprimento de pena. / Tal entendimento é fundamentado nos verbetes 26 da súmula vinculante do STF ou 471 do STJ. Obs.: A justificativa é essencial para atribuição de pontos."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Houve aberratio criminis OU houve resultado diverso do pretendido, devendo o agente responder apenas pelo crime de lesão corporal culposa, nos termos do Art. 74 do CP.
    revisao: *a1
  - id: 21-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Diana, primária e de bons antecedentes, em dificuldades financeiras, com inveja das amigas que exibiam seus automóveis recém-adquiridos, resolve comprar joias em loja localizada no Município de Campinas, para usar em uma festa de comemoração de 10 anos de formatura da faculdade.

      Em razão de sua situação, todavia, no momento do pagamento, entrega no estabelecimento um cheque sem provisão de fundos. Quando a proprietária da loja deposita o cheque, é informada, na cidade de Santos, pelo banco sacado, que inexistiam fundos suficientes, havendo recusa de pagamento, razão pela qual comparece em sede policial na localidade de sua residência, uma cidade do Estado de São Paulo, para narrar o ocorrido.

      Convidada a comparecer em sede policial para esclarecer o ocorrido, Diana confirma a emissão do cheque sem provisão de fundos, mas efetua, de imediato, o pagamento do valor devido à proprietária do estabelecimento comercial.

      Posteriormente, a autoridade policial elabora relatório conclusivo e encaminha o inquérito ao Ministério Público, que oferece denúncia em face de Diana como incursa nas sanções do Art. 171, § 2º, inciso VI, do Código Penal.

      Considerando a situação narrada, na condição de advogado(a) de Diana, responda aos itens a seguir.
    comando: Existe argumento a ser apresentado em favor de Diana para evitar, de imediato, o prosseguimento da ação penal? Em caso positivo, indique; em caso negativo, justifique.
    gabarito: Sim, existem argumentos a serem apresentados pelo(a) advogado(a) de Diana para evitar o prosseguimento da ação penal. De fato, em princípio, a conduta de Diana se adequa perfeitamente ao previsto no Art. 171, § 2º, inciso VI, do Código Penal, tendo em vista que emitiu cheque sem provisão de fundos. O Supremo Tribunal Federal pacificou o entendimento, através do Enunciado 554 da Súmula de Jurisprudências, de que o pagamento dos valores após o recebimento da denúncia não obsta o prosseguimento da ação penal; todavia, a contrario sensu, pacificaram a jurisprudência e a doutrina a posição de que, se o pagamento do cheque for realizado antes do recebimento da denúncia, haverá obstáculo ao prosseguimento da ação. Alguns foram os fundamentos que justificaram tal posição jurisprudencial, mas trata-se, principalmente, do princípio da intervenção mínima, característica do Direito Penal, e da ideia de que aquele que efetua o pagamento antes do recebimento da denúncia indica a inexistência de dolo de enganar e de obter vantagem ilícita em detrimento alheio. No caso apresentado, Diana efetuou o pagamento do cheque antes de o inquérito ser encaminhado ao Ministério Público com relatório final, logo antes do recebimento da denúncia, de modo que pode ser buscado, inclusive por meio de habeas corpus, o imediato trancamento da ação penal.
    opcoes:
      correta: Sim, o argumento a ser apresentado em favor de Diana é que houve pagamento do cheque antes do recebimento da denúncia, obstando o prosseguimento da ação penal, nos termos da Súmula 554/STF.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Aplicação do perdão judicial, nos termos do Art. 121, § 5º, do CP.
        - A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
    revisao: *a1
  - id: 21-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
      Diana, primária e de bons antecedentes, em dificuldades financeiras, com inveja das amigas que exibiam seus automóveis recém-adquiridos, resolve comprar joias em loja localizada no Município de Campinas, para usar em uma festa de comemoração de 10 anos de formatura da faculdade.

      Em razão de sua situação, todavia, no momento do pagamento, entrega no estabelecimento um cheque sem provisão de fundos. Quando a proprietária da loja deposita o cheque, é informada, na cidade de Santos, pelo banco sacado, que inexistiam fundos suficientes, havendo recusa de pagamento, razão pela qual comparece em sede policial na localidade de sua residência, uma cidade do Estado de São Paulo, para narrar o ocorrido.

      Convidada a comparecer em sede policial para esclarecer o ocorrido, Diana confirma a emissão do cheque sem provisão de fundos, mas efetua, de imediato, o pagamento do valor devido à proprietária do estabelecimento comercial.

      Posteriormente, a autoridade policial elabora relatório conclusivo e encaminha o inquérito ao Ministério Público, que oferece denúncia em face de Diana como incursa nas sanções do Art. 171, § 2º, inciso VI, do Código Penal.

      Considerando a situação narrada, na condição de advogado(a) de Diana, responda aos itens a seguir.
    comando: De acordo com a jurisprudência do Supremo Tribunal Federal, qual será o foro competente para julgamento do crime imputado a Diana? Justifique.
    gabarito: Entende o Supremo Tribunal Federal que o crime de estelionato é delito de natureza material, de modo que estará consumado no momento da recusa de pagamento do cheque sem provisão de fundos pelo sacado. Nos termos do Art. 70 do Código de Processo Penal, será competente para processamento e julgamento o foro da comarca onde ocorreu o resultado do crime (Comarca de Santos). Assim, nos termos do Enunciado 521 da Súmula de Jurisprudência do Supremo Tribunal Federal, “o foro competente para processo e julgamento dos crimes de estelionato, sob a modalidade de emissão dolosa de cheques sem provisão de fundos, é o do local onde se deu a recusa do pagamento pelo sacado”.
    opcoes:
      correta: O foro competente para julgamento do crime imputado a Diana é o da Comarca de Santos, onde houve recusa de pagamento pelo sacado, nos termos da Súmula 521/STF.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Aplicação do perdão judicial, nos termos do Art. 121, § 5º, do CP.
        - A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
