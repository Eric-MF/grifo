# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "21"
introducoes:
  peca: "Gabriela, de 20 anos, fugiu das agressões do companheiro e foi parar na rua com o filho de 2 anos, sem família nem ajuda. Em 24/12/2010, vendo o filho chorar e adoecer de fome, escondeu na roupa dois pacotes de macarrão (R$ 18) num grande supermercado e foi detida ao sair. A denúncia por tentativa de furto foi recebida em 18/1/2011, mas ela, sem endereço, só foi citada em 16/3/2015, quando procurou o cartório com você. Recusou a suspensão do processo, e você vai apresentar a resposta à acusação."
  q1: "Numa comemoração, Júlio deu um tapa fraco no rosto de Paulo, que morreu: ele tinha uma lesão antiga numa artéria, que ninguém conhecia. O Ministério Público que atua só no Tribunal do Júri o denunciou, ali, por lesão corporal seguida de morte."
  q2: "Vinícius, reincidente, guardava um revólver .38 de uso permitido, municiado, numa gaveta da loja de que é dono, para se proteger de assaltos. Denunciado por porte de arma, confessou. Depois das alegações finais, foi juntado o laudo da arma, e o juiz condenou na hora, sem dar vista do laudo à defesa."
  q3: "Paulo admitiu na delegacia ter tomado o celular de Mário com ameaça de morte, alegando estado de necessidade. Na instrução, a vítima não foi achada e Paulo foi revel. O juiz o condenou com base só no que os dois disseram na delegacia, aumentou a pena-base pela ameaça de morte e negou a atenuante pedida pela defesa, porque a admissão dos fatos veio com a alegação de estado de necessidade."
  q4: "Diana comprou joias em Campinas com um cheque sem fundos, e o banco recusou o pagamento em Santos. Chamada na delegacia, confirmou a emissão e quitou na hora a dívida com a vítima. Mesmo assim, foi denunciada por estelionato na modalidade de cheque sem fundos."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["21-peca-1", "21-peca-3", "21-peca-7", "21-q4-b"]
perguntas:
  - id: 21-peca-3-1
    categoria: peca-detalhe
    parte: peca
    item: "3.1"
    secao: preliminar
    pergunta: "A denúncia foi recebida em 18/1/2011, e Gabriela tinha 20 anos no fato. Que preliminar a defesa deve alegar em 2015?"
    tese: "Prescrição da pretensão punitiva, com o prazo pela metade (menor de 21 anos)"
    aceitos: [ "prescri*" ]
    artigos: [ "art. 109, IV, CP", "art. 115, CP" ]
    gabarito: "Prescrição em razão de entre a data do recebimento da denúncia e a manifestação do advogado ter sido ultrapassado o prazo prescricional de 04 anos, já que Gabriela era menor de 21 anos na data dos fatos, devendo o prazo ser computado pela metade. Citação do art. 109, IV E do art. 115 do CP"
    revisao: { status: revisado }
  - id: 21-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: merito
    pergunta: "Os pacotes de macarrão valiam R$ 18. Que princípio torna a conduta atípica?"
    tese: "Princípio da insignificância (bagatela), que torna a conduta atípica"
    aceitos: [ "insignifica* | bagatela" ]
    artigos: [ "art. 397, III, CPP" ]
    gabarito: "Arguição de que a conduta narrada evidentemente não constituir crime em razão da atipicidade, diante da aplicação do princípio da bagatela/insignificância"
    revisao: { status: revisado }
  - id: 21-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Gabriela pegou o macarrão porque o filho estava doente de fome. Que excludente ela pode alegar?"
    tese: "Estado de necessidade, que exclui a ilicitude"
    aceitos: [ "estado de necessidade | furto famelico" ]
    artigos: [ "art. 24, CP" ]
    gabarito: "Arguição da existência de manifesta causa de exclusão da ilicitude, pois Gabriela agiu em estado de necessidade diante da situação de fome e risco para a saúde de seu filho, nos termos do Art. 24 do Código Penal."
    revisao: { status: revisado }
  - id: 21-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: pedido
    pergunta: "Na resposta à acusação, que decisão a defesa deve pedir ao juiz?"
    tese: "Absolvição sumária"
    aceitos: [ "absolvicao sumaria | absolvido sumariamente | absolver sumariamente | absolvida sumariamente" ]
    artigos: [ "art. 397, I, CPP", "art. 397, III, CPP", "art. 397, IV, CPP" ]
    gabarito: "Absolvição Sumária, com fundamento no Art. 397, inciso I,, no Art. 397, inciso III, e no Art. 397, inciso IV, todos do CPP."
    revisao: { status: revisado }
  - id: 21-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "O Tribunal do Júri é competente para julgar Júlio?"
    tese: "Incompetência do Tribunal do Júri: a lesão corporal seguida de morte não é crime doloso contra a vida"
    aceitos: [ "nao e doloso | nao e crime doloso | preterdoloso | nao ha dolo de matar | incompet*" ]
    artigos: [ "art. 74, § 1º, CPP", "art. 5, XXXVIII, CRFB" ]
    gabarito: "O(A) examinando(a) deve concluir pela incompetência do Juízo, tendo em vista que o crime praticado não é doloso contra a vida. Nos termos do Art. 74, § 1º, do Código de Processo Penal (ou Art. 5º, inciso XXXVIII, alínea d, da CRFB), ao Tribunal do Júri cabe apenas o julgamento dos crimes dolosos contra a vida e os conexos. No caso, mesmo de acordo com a imputação contida na denúncia, o resultado de morte foi culposo; logo, a competência é do juízo singular."
    revisao: { status: revisado }
  - id: 21-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Por que Júlio não pode responder pela morte de Paulo?"
    tese: "Afastamento do resultado morte: o resultado mais grave só se imputa a quem o causou ao menos com culpa, e ele era imprevisível"
    aceitos: [ [ "previsib* | imprevisib* | imprevisivel" ], [ "responsabilidade objetiva" ], [ "nem culpa | sem culpa | nao houve culpa | ausencia de culpa" ] ]
    artigos: [ "art. 19, CP" ]
    gabarito: "O(A) examinando(a) deve defender que não poderia Júlio responder pelo crime de lesão corporal seguida de morte, porque aquele resultado não foi causado a título de dolo nem culpa. O crime de lesão corporal seguida de morte é chamado de preterdoloso. A ação é dirigida à produção de lesão corporal, sendo o resultado morte produzido a título de culpa. Costuma-se dizer que há dolo no antecedente e culpa no consequente. Um dos elementos da culpa é a previsibilidade objetiva, somente devendo alguém ser punido na forma culposa quando o resultado não querido pudesse ser previsto por um homem médio, sendo que a ausência de previsibilidade subjetiva, capacidade do agente, no caso concreto, de prever o resultado, repercute na culpabilidade.\n\nNa hipótese, não havia previsibilidade objetiva, o que impede a tipificação do delito de lesão corporal seguida de morte. Também poderia o candidato responder que havia uma concausa preexistente, relativamente independente, desconhecida, impedindo Júlio de responder pelo resultado causado. Em princípio, a concausa relativamente independente preexistente não impede a punição do agente pelo crime consumado. Contudo, deve ela ser conhecida do agente ou ao menos existir possibilidade de conhecimento, sob pena de responsabilidade penal objetiva."
    revisao: { status: revisado }
  - id: 21-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que tese processual a defesa de Vinícius deve levantar na apelação?"
    tese: "Nulidade da sentença: o laudo foi juntado sem vista à defesa, em violação ao contraditório"
    aceitos: [ [ "nulidade | nula | anula*" ], [ "contraditorio" ] ]
    artigos: [ "art. 5, LV, CRFB" ]
    gabarito: "Em sede de apelação, deveria o advogado de Vinícius buscar o reconhecimento da nulidade da sentença, tendo em vista que, após manifestação da defesa, houve juntada de laudo de exame de arma de fogo, ou seja, de prova pericial, sem que fosse aberta vista às partes em relação à documentação. O não acesso pela defesa ao laudo de exame pericial violou o princípio da ampla defesa, em sua vertente da defesa técnica, além do próprio princípio do contraditório, já que aquela prova não lhe foi submetida. Assim, deveria a sentença ser anulada, sendo certo que o prejuízo foi constatado com a condenação do réu."
    revisao: { status: revisado }
  - id: 21-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "A arma estava no estabelecimento de que Vinícius é dono. Que tese de direito material leva a uma pena menor?"
    tese: "Desclassificação para posse ilegal de arma de fogo"
    aceitos: [ "posse" ]
    artigos: [ "art. 12, Lei 10.826" ]
    gabarito: "A tese de direito material a ser apresentada pela defesa técnica de Vinícius para buscar uma condenação mais branda é de que o delito praticado pelo réu foi de posse de arma de fogo e não de porte de arma de fogo, tendo em vista que o agente possuía, em seu local de trabalho, arma de fogo de uso permitido. Prevê o Art. 12 da Lei nº 10.826/03 que o crime de posse de arma de fogo poderá ocorrer não apenas quando o material bélico estiver na residência do agente, mas também em seu local de trabalho, desde que o agente seja o titular ou responsável legal pelo estabelecimento. No caso, todos os requisitos foram observados, já que a arma estava no local de trabalho de Vinícius, estabelecimento do qual o agente era proprietário e sócio-gerente. Assim, deveria a defesa buscar a desclassificação para o delito previsto no Art. 12 da Lei nº 10.826/03."
    revisao: { status: revisado }
  - id: 21-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que tese leva à absolvição de Paulo na apelação?"
    tese: "Insuficiência de provas: a condenação se apoiou só em elementos do inquérito"
    aceitos: [ "insuficiencia | falta de provas | ausencia de provas | prova insuficiente | provas insuficientes" ]
    artigos: [ "art. 155, CPP" ]
    gabarito: "A tese jurídica a ser apresentada pela defesa de Paulo para garantir sua absolvição é de insuficiência probatória, já que o magistrado não pode fundamentar sua decisão exclusivamente com base em elementos informativos, nos termos do Art. 155 do Código de Processo Penal. Claramente o magistrado considerou apenas os elementos informativos produzidos em sede policial, que não foram submetidos ao princípio do contraditório.\n\nO conceito de prova exige o respeito a esse princípio. Os elementos informativos somente podem embasar um decreto condenatório se confirmados por provas produzidas sob o crivo do contraditório. Ademais, não estamos diante de nenhuma das exceções trazidas pelo Art. 155, in fine, do CPP. Considerando que a decisão do magistrado baseou-se exclusivamente nas palavras da vítima em sede policial e na confissão do acusado na delegacia, não havendo provas produzidas em juízo, a condenação foi indevida."
    revisao: { status: revisado }
  - id: 21-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Mantida a condenação, que atenuante o juiz devia ter reconhecido, mesmo sendo qualificada?"
    tese: "Atenuante da confissão espontânea, ainda que qualificada, porque serviu para a condenação"
    aceitos: [ "confissao" ]
    artigos: [ "Súmula 545 STJ", "art. 65, III, d, CP" ]
    gabarito: "Em busca da redução da pena aplicada, deveria o(a) advogado(a) de Paulo defender que o aumento da pena-base em razão da ameaça de morte empregada representa violação ao princípio do ne bis in idem, tendo em vista que a grave ameaça constitui elementar do tipo de roubo, e que deveria ser reconhecida a atenuante da confissão, pois, ainda que qualificada, escorou o decreto condenatório do magistrado, nos termos da Enunciado 545 da Súmula de Jurisprudência do Superior Tribunal de Justiça. Ademais, o Superior Tribunal de Justiça vem reconhecendo, de maneira tranquila, que a confissão qualificada, ou seja, aquela que apresenta causa excludente da ilicitude ou da culpabilidade, apesar de o agente confessar os fatos, é suficiente para o reconhecimento da atenuante."
    revisao: { status: revisado }
  - id: 21-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que argumento evita, de imediato, o prosseguimento da ação penal contra Diana?"
    tese: "Falta de justa causa: o pagamento do cheque antes do recebimento da denúncia impede a ação penal"
    aceitos: [ "antes do recebimento | antes de receber a denuncia" ]
    artigos: [ "Súmula 554 STF" ]
    gabarito: "Sim, existem argumentos a serem apresentados pelo(a) advogado(a) de Diana para evitar o prosseguimento da ação penal. De fato, em princípio, a conduta de Diana se adequa perfeitamente ao previsto no Art. 171, § 2º, inciso VI, do Código Penal, tendo em vista que emitiu cheque sem provisão de fundos. O Supremo Tribunal Federal pacificou o entendimento, através do Enunciado 554 da Súmula de Jurisprudências, de que o pagamento dos valores após o recebimento da denúncia não obsta o prosseguimento da ação penal; todavia, a contrario sensu, pacificaram a jurisprudência e a doutrina a posição de que, se o pagamento do cheque for realizado antes do recebimento da denúncia, haverá obstáculo ao prosseguimento da ação. Alguns foram os fundamentos que justificaram tal posição jurisprudencial, mas trata-se, principalmente, do princípio da intervenção mínima, característica do Direito Penal, e da ideia de que aquele que efetua o pagamento antes do recebimento da denúncia indica a inexistência de dolo de enganar e de obter vantagem ilícita em detrimento alheio. No caso apresentado, Diana efetuou o pagamento do cheque antes de o inquérito ser encaminhado ao Ministério Público com relatório final, logo antes do recebimento da denúncia, de modo que pode ser buscado, inclusive por meio de habeas corpus, o imediato trancamento da ação penal."
    revisao: { status: revisado }
