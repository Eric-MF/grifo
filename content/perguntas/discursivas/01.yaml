# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "01"
introducoes:
  peca: "No fim de 2004, Leila, de 14 anos, grávida, abortou depois de tomar um remédio para úlcera que lhe deu a amiga Fátima, estudante de enfermagem de 20 anos. Fátima admite que deu o remédio, mas diz que achava que a amiga tinha úlcera. A perícia achou resquícios de gravidez, mas não pôde dizer se o aborto foi espontâneo ou provocado, e Leila nunca foi ouvida, porque se mudou e não foi localizada. A denúncia por aborto saiu em 30/1/2010. Você defende Fátima nos memoriais escritos, no procedimento do júri."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["01-peca-1"]
perguntas:
  - id: 01-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: preliminar
    pergunta: "Fátima tinha 20 anos na época, e a denúncia veio mais de cinco anos depois do fato. Que preliminar a defesa deve alegar?"
    tese: "Prescrição da pretensão punitiva, com o prazo pela metade porque a ré era menor de 21 anos"
    aceitos: [ "prescri*" ]
    artigos: [ "art. 115, CP", "art. 109, IV, CP" ]
    gabarito: "Prescrição da pretensão punitiva: pena máxima de 4 anos prescreve em 8, mas a ré era menor de 21 anos e o prazo corre pela metade (CP, arts. 109, IV, 115 e 126)."
    revisao: { status: revisado }
  - id: 01-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "A perícia não confirmou que o aborto foi provocado. Que decisão a defesa deve pedir ao fim da primeira fase do júri, por esse motivo?"
    tese: "Impronúncia, por falta de prova da materialidade (laudo inconclusivo)"
    aceitos: [ [ "impronuncia*" ], [ "materialidade" ] ]
    artigos: [ "art. 414, CPP" ]
    gabarito: "Impronúncia por falta de comprovação da materialidade: laudo pericial inconclusivo."
    revisao: { status: revisado }
  - id: 01-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Leila nunca foi ouvida. Que requisito da pronúncia isso deixa sem prova quanto a Fátima?"
    tese: "Indícios suficientes de autoria, que faltam sem as declarações da menor"
    aceitos: [ [ "indicios" ], [ "autoria" ] ]
    artigos: [ "art. 414, CPP" ]
    gabarito: "Inexistência de indícios suficientes de autoria: falta das declarações da menor."
    revisao: { status: revisado }
  - id: 01-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Fátima deu o remédio acreditando que a amiga tinha úlcera. Que elemento do crime de aborto falta na conduta dela?"
    tese: "Atipicidade por falta de dolo: ela não sabia da gravidez"
    aceitos: [ [ "dolo" ], [ "erro de tipo" ] ]
    artigos: [ "art. 18, I, CP", "art. 20, CP" ]
    gabarito: "Ausência de dolo: a ré não sabia da gravidez e forneceu o remédio para curar úlcera."
    revisao: { status: revisado }
  - id: 01-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: pedido
    pergunta: "Reconhecida a prescrição, o que a defesa deve pedir ao juiz?"
    tese: "Extinção da punibilidade pela prescrição"
    aceitos: [ "extin* da punibilidade" ]
    artigos: [ "art. 107, IV, CP" ]
    gabarito: "Reconhecimento da preliminar e extinção da punibilidade; impronúncia, nos termos do art. 414 do CPP (admite-se absolvição sumária, art. 415)."
    revisao: { status: revisado }
