  - id: 09-q3-a
    categoria: discursiva
    parte: q3
    item: A1
    caso: |-
      Mário está sendo processado por tentativa de homicídio uma vez que injetou substância venenosa em Luciano, com o objetivo de matá-lo. No curso do processo, uma amostra da referida substância foi recolhida para análise e enviada ao Instituto de Criminalística, ficando comprovado que, pelas condições de armazenamento e acondicionamento, a substância não fora hábil para produzir os efeitos a que estava destinada. Mesmo assim, arguindo que o magistrado não estava adstrito ao laudo, o Ministério Público pugnou pela pronúncia de Mário nos exatos termos da denúncia.

      Com base apenas nos fatos apresentados, responda justificadamente.
    comando: O magistrado deveria pronunciar Mário, impronunciá-lo ou absolvê-lo sumariamente?
    gabarito: Deveria absolvê-lo sumariamente, por força do Art. 415, III, do CPP. O caso narrado não constitui crime, sendo hipótese de crime impossível.
    opcoes:
      correta: "Deveria absolvê-lo sumariamente, por força do Art. 415, III, do CPP. Obs.: a mera indicação de artigo não pontua. A hipótese é de crime impossível."
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Ilegitimidade do Ministério Público (ou ausência de condição da ação), tendo em vista que o delito de dano é de ação penal privada, na forma do Art. 167 do CP, ou do Art. 95, inciso IV, ou do Art. 564, inciso II, ou do Art. 395, II, todos do CPP.
        - Erika responde como partícipe de tal homicídio.
        - A medida judicial cabível é da revisão criminal, com fundamento no Art. 621, inciso II OU III, do Código de Processo Penal, tendo em vista que a condenação foi baseada em documento comprovadamente falso OU em razão do surgimento de prova nova, após a sentença, apta a demonstrar a inocência do acusado.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
    revisao: *a1
  - id: 09-q3-b
    categoria: discursiva
    parte: q3
    item: B1
    caso: |-
      Mário está sendo processado por tentativa de homicídio uma vez que injetou substância venenosa em Luciano, com o objetivo de matá-lo. No curso do processo, uma amostra da referida substância foi recolhida para análise e enviada ao Instituto de Criminalística, ficando comprovado que, pelas condições de armazenamento e acondicionamento, a substância não fora hábil para produzir os efeitos a que estava destinada. Mesmo assim, arguindo que o magistrado não estava adstrito ao laudo, o Ministério Público pugnou pela pronúncia de Mário nos exatos termos da denúncia.

      Com base apenas nos fatos apresentados, responda justificadamente.
    comando: Caso Mário fosse pronunciado, qual seria o recurso cabível, o prazo de interposição e a quem deveria ser endereçado?
    gabarito: É cabível recurso em sentido estrito (Art. 581, IV, do CPP); deve ser interposto no prazo de cinco dias (Art. 586 CPP); a petição de interposição deve ser endereçada ao juiz a quo e as razões deverão ser endereçadas ao Tribunal de Justiça.
    opcoes:
      correta: Recurso em sentido estrito (Art. 581, IV do CPP); deve ser interposto em 5 dias (Art. 586, do CPP); a petição de interposição deve ser endereçada ao juiz a quo e as razões deverão ser endereçadas ao Tribunal de Justiça.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Resultado diverso do pretendido (ou) atraindo a ocorrência de concurso formal perfeito entre as condutas imputadas, na forma do Art. 70 ou do Art. 74, ambos do CP.
        - Agravo em execução, com fundamento no Art. 197 da LEP.
        - O argumento é de que a conduta de Túlio era atípica, tendo em vista que, objetivamente, Maria era maior de 14 anos na data dos fatos e houve consentimento na prática dos atos sexuais.
        - O argumento é o de que o crime praticado por Carla foi de falsidade ideológica, com inserção de conteúdo falseado, e não falsificação de documento particular, tendo em vista que inseriu informação falsa em documento verdadeiro quanto à sua forma, nos termos do Art. 299 do CP.
    revisao: *a1
  - id: 09-q4-a
    categoria: discursiva
    parte: q4
    item: A1
    caso: |-
      Laura, empresária do ramo de festas e eventos, foi denunciada diretamente no Tribunal de Justiça do Estado “X”, pela prática do delito descrito no Art. 333 do CP (corrupção ativa). Na mesma inicial acusatória, o Procurador Geral de Justiça imputou a Lucas, Promotor de Justiça estadual, a prática da conduta descrita no Art. 317 do CP (corrupção passiva).

      A defesa de Laura, então, impetrou habeas corpus ao argumento de que estariam sendo violados os princípios do juiz natural, do devido processo legal, do contraditório e da ampla defesa; arguiu, ainda, que estaria ocorrendo supressão de instância, o que não se poderia permitir.

      Nesse sentido, considerando apenas os dados fornecidos, responda, fundamentadamente, aos itens a seguir.
    comando: Os argumentos da defesa de Laura procedem?
    gabarito: |-
      A. Não procedem os argumentos da defesa de Laura, com base no Verbete 704, da Súmula do STF. O fato de Laura ser julgada diretamente pelo Tribunal de Justiça não lhe tira a possibilidade de manejar outros recursos.

      Assim, não há qualquer ferimento ao devido processo legal, nem ao contraditório e muito menos à ampla defesa.

      Por fim, também não há que se falar em desrespeito ao princípio do juiz natural, já que a atração por conexão ou continência não configura criação de tribunal de exceção, sendo certo que não se pode confundir “juiz natural”

      com “juízo de primeiro grau”.

      B. Laura não possui direito ao duplo grau de jurisdição. O princípio do duplo grau assegura o julgamento da causa em primeira instância e a revisão da sentença por órgão diverso. O recurso que traduz por excelência o princípio do duplo grau é a apelação, a qual devolve ao Tribunal, para nova análise, toda a matéria de fato e de direito. Como Laura será julgada diretamente pelo Tribunal de Justiça, não terá direito ao duplo grau de jurisdição, mas isso não a impede de exercer o contraditório e nem a ampla defesa, estando-lhe assegurado, assim, o devido processo legal.

      Obs.: Não serão pontuadas respostas contraditórias.
    opcoes:
      correta: Não, com base no Verbete 704, da Súmula do STF. O fato de Laura ser julgada diretamente pelo Tribunal de Justiça não lhe tira a possibilidade de manejar outros recursos OU não há que se falar em desrespeito ao princípio do juiz natural, já que a atração por conexão ou continência não configura criação de tribunal de exceção.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Resultado diverso do pretendido (ou) atraindo a ocorrência de concurso formal perfeito entre as condutas imputadas, na forma do Art. 70 ou do Art. 74, ambos do CP.
        - Wilson, por ser agente garantidor, responde pelo delito de homicídio praticado via omissão imprópria.
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
