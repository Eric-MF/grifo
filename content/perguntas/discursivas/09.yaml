    comando: Que pedido deve ser formulado na peça?
    gabarito: Absolvição por falta de provas OU por não haver prova da existência do fato.
    opcoes:
      correta: Absolvição por falta de provas OU por não haver prova da existência do fato.
      erradas:
        - Reconhecimento da preliminar e extinção da punibilidade; impronúncia, nos termos do art. 414 do CPP (admite-se absolvição sumária, art. 415).
        - Absolvição, na forma do Art. 386, inciso III, do CPP.
        - Pedido de retratação ou efeito regressivo, com fundamento no Art. 589 do CPP.
        - Absolvição sumária, com fundamento no Art. 397, inciso I, do CPP e no Art. 397, inciso III, do CPP.
        - Pedido de acolhimento das alegações para reconhecer a nulidade no ato de recebimento da denúncia ou rejeição da denúncia pela ausência de justa causa.
