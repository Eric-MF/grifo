  - id: 09-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Raimundo, já de posse de veículo automotor furtado de concessionária, percebe que não tem onde guardá-lo antes de vendê-lo para a pessoa que o encomendara. Assim, resolve ligar para um grande amigo seu, Henrique, e após contar toda sua empreitada, pede-lhe que ceda a garagem de sua casa para que possa guardar o veículo, ao menos por aquela noite. Como Henrique aceita ajudá-lo, Raimundo estaciona o carro na casa do amigo. Ao raiar do dia, Raimundo parte com o veículo, que seria levado para o comprador.

      Considerando as informações contidas no texto responda, justificadamente, aos itens a seguir.
    comando: Raimundo e Henrique agiram em concurso de agentes?
    gabarito: ""
    opcoes:
      correta: Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Resultado diverso do pretendido (ou) atraindo a ocorrência de concurso formal perfeito entre as condutas imputadas, na forma do Art. 70 ou do Art. 74, ambos do CP.
        - Wilson, por ser agente garantidor, responde pelo delito de homicídio praticado via omissão imprópria.
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
