# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "09"
introducoes:
  peca: "Em 1/4/2009, Gisele, então com 19 anos, quis chutar Amanda, mas, por confusão, chutou Carolina, que estava grávida e só teve ferimentos leves. Carolina só representou contra Gisele em 18/10/2009, e o exame de corpo de delito não foi feito porque os ferimentos já tinham sarado. O processo, de lesão corporal leve com a agravante de crime contra mulher grávida, não seguiu o rito da Lei 9.099/95: a denúncia foi recebida em 31/10/2010, antes de qualquer resposta da defesa. A única testemunha, Amanda, não viu os fatos. O promotor pediu ainda a agravante da reincidência, porque Gisele aceitou a suspensão condicional do processo em outro caso. Você defende Gisele nos memoriais."
  q1: "Raimundo, já com um carro furtado de uma concessionária, pediu ao amigo Henrique que deixasse guardar o carro na garagem dele por uma noite, antes de entregá-lo ao comprador. Henrique, sabendo de tudo, aceitou."
  q2: "Wilson, muito bêbado, deu quinze facadas no amigo Junior, querendo matá-lo. Ao vê-lo sangrando, desesperou-se, levou Junior de táxi ao hospital, e o socorro o salvou."
  q3: "Mário injetou uma substância venenosa em Luciano para matá-lo e foi processado por tentativa de homicídio. A perícia mostrou que, pelo modo como estava guardada, a substância não tinha como produzir efeito. O Ministério Público pediu a pronúncia mesmo assim."
  q4: "Laura, empresária, foi denunciada diretamente no Tribunal de Justiça por corrupção ativa, na mesma denúncia em que o promotor de justiça Lucas responde por corrupção passiva. Num habeas corpus, a defesa dela alega violação do juiz natural, do devido processo legal e da ampla defesa, e supressão de instância."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["09-peca-1", "09-peca-8b", "09-peca-8c", "09-peca-8d", "09-q4-b"]
perguntas:
  - id: 09-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: preliminar
    pergunta: "A denúncia foi recebida antes da resposta da defesa, fora do rito dos Juizados. Que preliminar cabe?"
    tese: "Nulidade do processo pela inobservância do rito da Lei 9.099/95"
    aceitos: [ "nulidade | nulo | nula | anula*" ]
    artigos: [ "art. 81, Lei 9.099" ]
    gabarito: "Nulidade do processo pela inobservância do rito da Lei 9.099/95, anulando-se o recebimento da denúncia, com a consequente prescrição da pretensão punitiva."
    revisao: { status: revisado }
  - id: 09-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Sem exame de corpo de delito e com uma testemunha que não viu os fatos, que tese de mérito a defesa deve sustentar?"
    tese: "Absolvição, por falta de prova da materialidade"
    aceitos: [ [ "absolvi*" ], [ "materialidade" ] ]
    artigos: [ "art. 386, II, CPP", "art. 386, VII, CPP", "art. 158, CPP" ]
    gabarito: "Absolvição por falta de prova e ausência de materialidade do delito."
    revisao: { status: revisado }
  - id: 09-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Por que não incide a agravante de crime contra mulher grávida?"
    tese: "Erro sobre a pessoa: consideram-se as condições da vítima que Gisele queria atingir"
    aceitos: [ "erro sobre a pessoa | erro quanto a pessoa | error in persona" ]
    artigos: [ "art. 20, § 3º, CP" ]
    gabarito: "Não incidência da agravante de crime contra mulher grávida, pois a hipótese é de erro quanto à pessoa, na forma do Art. 20, § 3º, do CP."
    revisao: { status: revisado }
  - id: 09-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Por que não cabe a agravante da reincidência pedida pelo promotor?"
    tese: "Afastamento da reincidência: não há condenação anterior transitada em julgado, e aceitar a suspensão do processo não a gera"
    aceitos: [ [ "condenacao" ], [ "transit* em julgado" ] ]
    artigos: [ "art. 63, CP" ]
    gabarito: "Não incidência da agravante da reincidência."
    revisao: { status: revisado }
  - id: 09-peca-8a
    categoria: peca-detalhe
    parte: peca
    item: "8a"
    secao: preliminar
    pergunta: "O fato foi em 1/4/2009, e Carolina só representou em 18/10/2009. Que causa extingue a punibilidade?"
    tese: "Extinção da punibilidade pela decadência do direito de representação"
    aceitos: [ "decaden*" ]
    artigos: [ "art. 38, CPP", "art. 103, CP", "art. 107, IV, CP" ]
    gabarito: "Extinção da punibilidade pela decadência do direito de representação."
    revisao: { status: revisado }
  - id: 09-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Raimundo e Henrique agiram em concurso de agentes?"
    tese: "Não há concurso de agentes: o auxílio veio depois da consumação do furto, sem liame subjetivo com ele"
    aceitos: [ [ "apos a consumacao | depois da consumacao | posterior a consumacao | ja consumado | ja estava consumado" ], [ "liame subjetivo | vinculo subjetivo" ] ]
    artigos: [ "art. 29, CP" ]
    gabarito: ""
    revisao: { status: revisado }
  - id: 09-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que crime Henrique cometeu ao guardar o carro?"
    tese: "Favorecimento real"
    aceitos: [ "favorecimento real" ]
    artigos: [ "art. 349, CP" ]
    gabarito: ""
    revisao: { status: revisado }
  - id: 09-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Wilson pode responder por tentativa de homicídio?"
    tese: "Arrependimento eficaz: o agente responde só pelas lesões causadas, não por tentativa de homicídio"
    aceitos: [ "arrependimento eficaz" ]
    artigos: [ "art. 15, CP" ]
    gabarito: "A. Não, pois Wilson será beneficiado pelo instituto do arrependimento eficaz, previsto na parte final do Art. 15 do Código Penal. Assim, somente responderá pelos atos praticados, no caso, as lesões corporais graves sofridas por Júnior.\n\nObs.: A mera indicação de artigo legal não garante atribuição de pontos. Também não serão pontuadas respostas contraditórias.\n\nB. Nesse caso, como não houve eficácia no arrependimento, o que é exigido pelo Art. 15, do Código Penal, Wilson deverá responder pelo resultado morte, ou seja, deverá responder pelo delito de homicídio doloso consumado."
    revisao: { status: revisado }
  - id: 09-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "E se Junior, mesmo socorrido, morresse no dia seguinte, por que crime Wilson responderia?"
    tese: "Homicídio doloso consumado: com a morte da vítima, o arrependimento não foi eficaz"
    aceitos: [ "homicidio doloso | homicidio consumado | homicidio simples | resultado morte | pela morte" ]
    artigos: [ "art. 15, CP", "art. 121, CP" ]
    gabarito: "A. Não, pois Wilson será beneficiado pelo instituto do arrependimento eficaz, previsto na parte final do Art. 15 do Código Penal. Assim, somente responderá pelos atos praticados, no caso, as lesões corporais graves sofridas por Júnior.\n\nObs.: A mera indicação de artigo legal não garante atribuição de pontos. Também não serão pontuadas respostas contraditórias.\n\nB. Nesse caso, como não houve eficácia no arrependimento, o que é exigido pelo Art. 15, do Código Penal, Wilson deverá responder pelo resultado morte, ou seja, deverá responder pelo delito de homicídio doloso consumado."
    revisao: { status: revisado }
  - id: 09-q3-a
    categoria: discursiva
    parte: q3
    item: "A1"
    pergunta: "Diante do laudo, que decisão o juiz deve tomar ao fim da primeira fase do júri?"
    tese: "Absolvição sumária: o fato não constitui crime (crime impossível)"
    aceitos: [ "absolv*", "sumari*" ]
    artigos: [ "art. 415, III, CPP", "art. 17, CP" ]
    gabarito: "Deveria absolvê-lo sumariamente, por força do Art. 415, III, do CPP. O caso narrado não constitui crime, sendo hipótese de crime impossível."
    revisao: { status: revisado }
  - id: 09-q3-b
    categoria: discursiva
    parte: q3
    item: "B1"
    pergunta: "Se Mário fosse pronunciado, que recurso caberia?"
    tese: "Recurso em sentido estrito"
    aceitos: [ "recurso em sentido estrito | rese" ]
    artigos: [ "art. 581, IV, CPP" ]
    gabarito: "É cabível recurso em sentido estrito (Art. 581, IV, do CPP); deve ser interposto no prazo de cinco dias (Art. 586 CPP); a petição de interposição deve ser endereçada ao juiz a quo e as razões deverão ser endereçadas ao Tribunal de Justiça."
    revisao: { status: revisado }
  - id: 09-q4-a
    categoria: discursiva
    parte: q4
    item: "A1"
    pergunta: "Por que os argumentos da defesa de Laura não procedem?"
    tese: "Competência do tribunal do foro por prerrogativa de função, pela continência com o crime do promotor"
    aceitos: [ [ "conexao | continencia" ], [ "prerrogativa" ] ]
    artigos: [ "Súmula 704 STF" ]
    gabarito: "A. Não procedem os argumentos da defesa de Laura, com base no Verbete 704, da Súmula do STF. O fato de Laura ser julgada diretamente pelo Tribunal de Justiça não lhe tira a possibilidade de manejar outros recursos.\n\nAssim, não há qualquer ferimento ao devido processo legal, nem ao contraditório e muito menos à ampla defesa.\n\nPor fim, também não há que se falar em desrespeito ao princípio do juiz natural, já que a atração por conexão ou continência não configura criação de tribunal de exceção, sendo certo que não se pode confundir “juiz natural”\n\ncom “juízo de primeiro grau”.\n\nB. Laura não possui direito ao duplo grau de jurisdição. O princípio do duplo grau assegura o julgamento da causa em primeira instância e a revisão da sentença por órgão diverso. O recurso que traduz por excelência o princípio do duplo grau é a apelação, a qual devolve ao Tribunal, para nova análise, toda a matéria de fato e de direito. Como Laura será julgada diretamente pelo Tribunal de Justiça, não terá direito ao duplo grau de jurisdição, mas isso não a impede de exercer o contraditório e nem a ampla defesa, estando-lhe assegurado, assim, o devido processo legal.\n\nObs.: Não serão pontuadas respostas contraditórias."
    revisao: { status: revisado }
