  - id: 09-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Wilson, extremamente embriagado, discute com seu amigo Junior na calçada de um bar já vazio pelo avançado da hora. A discussão torna-se acalorada e, com intenção de matar, Wilson desfere quinze facadas em Junior, todas na altura do abdômen. Todavia, ao ver o amigo gritando de dor e esvaindo-se em sangue, Wilson, desesperado, pega um taxi para levar Junior ao hospital. Lá chegando, o socorro é eficiente e Junior consegue recuperar-se das graves lesões sofridas.

      Analise o caso narrado e, com base apenas nas informações dadas, responda, fundamentadamente, aos itens a seguir.
    comando: É cabível responsabilizar Wilson por tentativa de homicídio?
    gabarito: |-
      A. Não, pois Wilson será beneficiado pelo instituto do arrependimento eficaz, previsto na parte final do Art. 15 do Código Penal. Assim, somente responderá pelos atos praticados, no caso, as lesões corporais graves sofridas por Júnior.

      Obs.: A mera indicação de artigo legal não garante atribuição de pontos. Também não serão pontuadas respostas contraditórias.

      B. Nesse caso, como não houve eficácia no arrependimento, o que é exigido pelo Art. 15, do Código Penal, Wilson deverá responder pelo resultado morte, ou seja, deverá responder pelo delito de homicídio doloso consumado.
    opcoes:
      correta: Não, pois Wilson será beneficiado pelo instituto do arrependimento eficaz, de modo que somente responderá pelos atos praticados OU somente responderá por lesões corporais graves.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Resultado diverso do pretendido (ou) atraindo a ocorrência de concurso formal perfeito entre as condutas imputadas, na forma do Art. 70 ou do Art. 74, ambos do CP.
        - Wilson, por ser agente garantidor, responde pelo delito de homicídio praticado via omissão imprópria.
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 09-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Wilson, extremamente embriagado, discute com seu amigo Junior na calçada de um bar já vazio pelo avançado da hora. A discussão torna-se acalorada e, com intenção de matar, Wilson desfere quinze facadas em Junior, todas na altura do abdômen. Todavia, ao ver o amigo gritando de dor e esvaindo-se em sangue, Wilson, desesperado, pega um taxi para levar Junior ao hospital. Lá chegando, o socorro é eficiente e Junior consegue recuperar-se das graves lesões sofridas.

