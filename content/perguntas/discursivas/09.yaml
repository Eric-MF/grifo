    comando: Que tese preliminar deve ser alegada na peça, e com qual fundamento?
    gabarito: Nulidade do processo pela inobservância do rito da Lei 9.099/95, anulando-se o recebimento da denúncia, com a consequente prescrição da pretensão punitiva.
    opcoes:
      correta: Nulidade do processo pela inobservância do rito da Lei 9.099/95, anulando-se o recebimento da denúncia, com a consequente prescrição da pretensão punitiva.
      erradas:
        - "Prescrição da pretensão punitiva: pena máxima de 4 anos prescreve em 8, mas a ré era menor de 21 anos e o prazo corre pela metade (CP, arts. 109, IV, 115 e 126)."
        - Preliminar de nulidade do processo OU reconhecimento da extinção da punibilidade OU decadência OU oferecimento de proposta de suspensão condicional do processo
        - Ilicitude por derivação da prova testemunhal, com fundamento no art. 157, § 1º, CPP.
        - Nulidade em razão do não oferecimento de proposta de suspensão condicional do processo, nos termos do Art. 89 da Lei 9.099, já que a pena mínima do delito imputado é de 1 ano.
        - "Preliminar: cerceamento de defesa (ou violação ao contraditório ou ampla defesa, ou ao devido processo legal ou nulidade por omissão de formalidade essencial), porque não poderia ter sido concedido prazo comum ao colaborador e ao corréu delatado, em violação ao Art. 4º, § 10-A, da Lei nº 12.850/2013, ao Art. 5º, inciso LIV ou LV, da CRFB/88, ou ao Art. 564, inciso IV, do CPP."
    revisao: *a1
