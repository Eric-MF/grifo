# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "25-porto-alegre"
introducoes:
  peca: "Breno, de 72 anos, falsificou a assinatura numa folha de cheque e quis pagar com ela R$ 5.000 em compras numa loja. A falsificação era boa, mas o gerente conhecia o correntista, percebeu a fraude e chamou a polícia antes que Breno levasse os produtos. Breno foi condenado por estelionato e falsificação de documento, em concurso material, nas formas consumadas. Ele não foi interrogado: estava doente no dia da audiência, apresentou atestado, e a defesa protestou. Na pena-base do estelionato, o juiz aumentou 2 meses porque Breno agiu com dolo. Na segunda fase, aplicou a reincidência por uma condenação anterior por homicídio culposo no trânsito e não reconheceu nenhuma outra circunstância. Você é o advogado de Breno, e corre o prazo do recurso."
  q1: "Bruna, nascida em 30/3/1999, e a irmã Júlia, já maior, golpearam Maria na cabeça com pedaços de ferro, em 28/3/2017, para matá-la. Maria ficou internada e morreu cinco dias depois. As duas foram denunciadas por homicídio qualificado, e o Ministério Público pediu a preventiva só de Júlia, que é reincidente e está grávida de 20 semanas."
  q2: "João tirou Clara, de 11 anos, de casa, trancou-a num quarto sem janelas e exigiu do pai dela R$ 200.000 para soltá-la. O pai pagou, e Clara foi solta. Concluído o inquérito, os autos ficaram 90 dias com o promotor, sem nenhuma providência."
  q3: "Carlos, primário, foi condenado por roubo a 4 anos no semiaberto. Com 3 anos e 10 dias cumpridos, cometeu falta grave e fugiu, em 10/3/2015, e nunca mais foi encontrado. Ainda em 2015, o juiz da execução reconheceu a falta grave e mandou recomeçar a contagem do prazo do livramento condicional. Por falha do cartório, a defesa só foi intimada em 14/3/2018."
  q4: "Vitor atirou em José para matá-lo, mas acertou só a perna. José foi levado ao hospital e, enquanto dormia no quarto, foi picado por um escorpião e morreu, só por causa do veneno. Vitor foi denunciado por homicídio consumado. Na audiência da primeira fase do júri, o juiz fez ele mesmo as perguntas às testemunhas, sem deixar as partes complementarem, e depois pronunciou Vitor."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["25-porto-alegre-peca-1", "25-porto-alegre-peca-3", "25-porto-alegre-peca-4", "25-porto-alegre-peca-4-2", "25-porto-alegre-peca-6", "25-porto-alegre-peca-12"]
perguntas:
  - id: 25-porto-alegre-peca-4-1
    categoria: peca-detalhe
    parte: peca
    item: "4.1"
    secao: merito
    pergunta: "Que preliminar a defesa deve levantar quanto à falta do interrogatório de Breno?"
    tese: "Nulidade por cerceamento de defesa: Breno faltou por motivo justificado e não foi interrogado"
    aceitos: [ "nulidade | nula | nulo | anula* | cerceamento | ampla defesa | autodefesa" ]
    artigos: [ "art. 5, LV, CRFB", "art. 564, IV, CPP" ]
    gabarito: "porque ocorreu cerceamento de defesa OU porque houve violação ao princípio da ampla defesa, nos termos do Art. 5º, LV, CRFB."
    revisao: { status: revisado }
  - id: 25-porto-alegre-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Breno foi condenado pelos dois crimes, em concurso material. Que tese a defesa deve sustentar quanto a isso?"
    tese: "Absorção da falsificação pelo estelionato (consunção), porque o falso se exauriu no estelionato"
    aceitos: [ "absor* | consun*" ]
    artigos: [ "Súmula 17 STJ" ]
    gabarito: "No mérito: Absorção do crime de falsificação de documento pelo de estelionato, nos termos do Enunciado 17 da Súmula de Jurisprudência do STJ."
    revisao: { status: revisado }
  - id: 25-porto-alegre-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "O que a defesa deve pedir quanto à pena-base do estelionato?"
    tese: "Pena-base no mínimo: o dolo é inerente ao tipo e não justifica o aumento"
    aceitos: [ "minimo" ]
    artigos: [ "art. 59, CP" ]
    gabarito: "Redução da pena base ao mínimo legal, tendo em vista que o elemento subjetivo dolo já é inerente ao tipo. 5"
    revisao: { status: revisado }
  - id: 25-porto-alegre-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Que atenuante o juiz deixou de reconhecer na segunda fase?"
    tese: "A atenuante de ser o réu maior de 70 anos na data da sentença"
    aceitos: [ "70 anos | maior de 70 | mais de 70 | setenta anos | septuagenario | idoso" ]
    artigos: [ "art. 65, I, CP" ]
    gabarito: "Reconhecimento de atenuante em razão de o agente ser maior de 70 anos na data da sentença, nos termos do Art. 65, inciso I, do CP."
    revisao: { status: revisado }
  - id: 25-porto-alegre-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "O gerente percebeu a fraude antes que Breno obtivesse a vantagem. Que tese a defesa deve sustentar quanto à consumação do estelionato?"
    tese: "Tentativa: o estelionato é crime material, e a vantagem não foi obtida"
    aceitos: [ "tentativa | tentado | tentada | nao se consumou | nao consumado | nao consumou" ]
    artigos: [ "art. 14, II, CP" ]
    gabarito: "Reconhecimento da tentativa, tendo em vista que o crime de estelionato é de natureza material e não houve obtenção da vantagem ilícita. 5"
    revisao: { status: revisado }
  - id: 25-porto-alegre-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "A condenação anterior de Breno foi por crime culposo. Que pedido isso permite quanto à espécie de pena?"
    tese: "Substituição da pena privativa de liberdade por restritivas de direitos: só a reincidência em crime doloso a impede"
    aceitos: [ "substitui*", "restritiva* | direitos" ]
    artigos: [ "art. 44, II, CP" ]
    gabarito: "Substituição da pena privativa de liberdade por restritiva de direitos, tendo em vista que a condenação anterior foi pela prática de crime culposo, de acordo com o Art. 44, inciso II, do Código Penal. 5/"
    revisao: { status: revisado }
  - id: 25-porto-alegre-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Se não couber a substituição, que benefício a defesa deve pedir, considerando a pena e a idade de Breno?"
    tese: "Suspensão condicional da pena (sursis etário), para o maior de 70 anos"
    aceitos: [ "suspensao condicional da pena | sursis" ]
    artigos: [ "art. 77, § 2º, CP" ]
    gabarito: "Subsidiariamente, aplicação da suspensão condicional da pena, tendo em vista que a pena aplicada foi inferior a 4 anos e o réu era maior de 70 anos OU em razão do sursis etário, nos termos do Art. 77, §2º, do Código Penal"
    revisao: { status: revisado }
  - id: 25-porto-alegre-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento de direito material impede o prosseguimento da ação penal contra Bruna?"
    tese: "Inimputabilidade: Bruna tinha 17 anos na data da conduta, e o crime se considera praticado no momento da ação (teoria da atividade)"
    aceitos: [ [ "inimputav* | inimputabilidade" ], [ "menor de 18 | menor de idade | 17 anos | teoria da atividade | ato infracional | momento da acao | momento da conduta" ] ]
    artigos: [ "art. 4, CP", "art. 27, CP", "art. 228, CRFB" ]
    gabarito: "O argumento a ser apresentado pela defesa de Bruna é que sua conduta, em tese, poderia configurar ato infracional, mas não crime sob o ponto de vista técnico, já que inimputável na data dos fatos. Inicialmente, importante recordar que, de acordo com a teoria majoritária, três são os elementos do conceito analítico do crime: tipicidade, ilicitude e culpabilidade. Por sua vez, a culpabilidade é formada pelos elementos imputabilidade, exigibilidade de conduta diversa e potencial conhecimento da ilicitude. Prevê o Art. 27 do Código Penal que os menores de 18 anos são penalmente inimputáveis. Diante disso, Bruna, menor de 18 anos na data dos fatos, não pratica crime, mas tão só ato infracional. Isso porque o Art. 4º do Código Penal estabelece que se considera praticado o crime no momento da ação ou omissão, ainda que outro seja o momento do resultado. No momento dos golpes desferidos por Julia e Bruna em Maria, com intenção de matar, Bruna era menor de 18 anos, logo inimputável, ainda que, quando do resultado morte, já fosse maior."
    revisao: { status: revisado }
  - id: 25-porto-alegre-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Presentes os requisitos da preventiva, que pedido evita que Júlia fique no sistema prisional?"
    tese: "A substituição da preventiva por prisão domiciliar, por ser gestante"
    aceitos: [ "domiciliar" ]
    artigos: [ "art. 318, IV, CPP" ]
    gabarito: "O requerimento a ser formulado é de substituição da prisão preventiva por prisão domiciliar, nos termos do Art. 318, inciso IV, do CPP. O Código de Processo Penal prevê, desde a Lei nº 12.403/11, a prisão domiciliar em substituição a prisão provisória, não sendo mais restrita à fase de execução da pena. Já com a Lei nº 13.257/16, passou o CPP a prever, no Art. 318, inciso IV, a possibilidade de requerimento de substituição da prisão preventiva por domiciliar quando a presa for gestante, não mais havendo limitação do período de gestação. Basta a condição de gestante de acordo com a lei. Assim, considerando que Julia estava grávida de 20 semanas, cabível o requerimento. Cabe ressaltar que argumentações no sentido de revogação da prisão pela ausência de fundamentos dos Arts. 312 e 313 do CPP não serão aceitas, tendo em vista que o próprio comando da questão deixa claro o preenchimento dos mesmos."
    revisao: { status: revisado }
  - id: 25-porto-alegre-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "O crime é de ação pública incondicionada. Que medida a família de Clara pode adotar diretamente?"
    tese: "A ação penal privada subsidiária da pública (queixa subsidiária), pela inércia do Ministério Público"
    aceitos: [ "privada subsidiaria | queixa subsidiaria | queixa substitutiva | acao subsidiaria" ]
    artigos: [ "art. 29, CPP", "art. 5, LIX, CRFB" ]
    gabarito: "A medida a ser adotada pela família de Clara e seus advogados é a apresentação de queixa substitutiva da denúncia, dando início à ação penal privada subsidiária da pública. Sem dúvida, o crime a ser imputado a João é de ação penal pública incondicionada, de modo que, em princípio, caberia ao Ministério Público oferecer denúncia. Todavia, de acordo com o que consta do enunciado, houve omissão por parte do Ministério Público, tendo em vista que recebido o inquérito com relatório final de indiciamento de João, o Parquet se manteve inerte, não oferecendo denúncia, requerendo o arquivamento ou solicitando diligências. Assim, diante da omissão do Ministério Público, será admitida ação privada subsidiária da pública, nos termos do Art. 29 do Código de Processo Penal e Art. 5º, inciso LIX, da CRFB/88, cabendo ao Ministério Público aditar a queixa, repudiá-la ou oferecer denúncia substitutiva."
    revisao: { status: revisado }
  - id: 25-porto-alegre-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que crime deve ser imputado a João?"
    tese: "Extorsão mediante sequestro, qualificada porque a vítima tem menos de 18 anos"
    aceitos: [ "extorsao mediante sequestro" ]
    artigos: [ "art. 159, § 1º, CP" ]
    gabarito: "O crime a ser imputado a João é de extorsão mediante sequestro qualificada, nos termos do Art. 159, § 1º, do Código Penal, tendo em vista que João sequestrou Clara, criança de 11 anos, restringindo sua liberdade, com a clara intenção de obter, para si ou para outrem, vantagem econômica indevida como condição para o resgate."
    revisao: { status: revisado }
  - id: 25-porto-alegre-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "No agravo em execução, que argumento combate o mérito da decisão?"
    tese: "A falta grave não interrompe a contagem do prazo para o livramento condicional"
    aceitos: [ "nao interrompe | nao reinicia | nao gera reinicio | nao gera o reinicio | nao recomeca | nao zera | sem interrupcao | nao interrupcao" ]
    artigos: [ "Súmula 441 STJ" ]
    gabarito: "O argumento a ser apresentado pela defesa técnica de Carlos é no sentido de que a prática de falta grave não gera o reinício do prazo de contagem do livramento condicional. Narra o enunciado que Carlos, quando do cumprimento da sua pena, praticou falta grave no interior do estabelecimento penitenciário. De acordo com o Art. 118, inciso I, da Lei nº 7.210/84, a prática de falta grave enseja à regressão de regime. Todavia, a Lei de Execução Penal não prevê como consequência da prática de falta grave o reinício do prazo para obtenção do livramento condicional, sendo certo que a execução penal também está sujeita ao princípio da legalidade. Dessa forma, equivocada a decisão do magistrado de determinar a interrupção do prazo para obtenção de livramento condicional, nos termos da Súmula 441 do Superior Tribunal de Justiça."
    revisao: { status: revisado }
  - id: 25-porto-alegre-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Em habeas corpus, que argumento de direito material evita a execução do restante da pena?"
    tese: "A prescrição da pretensão executória: o restante da pena, de menos de 1 ano, prescreve em 3 anos, contados da fuga"
    aceitos: [ "prescricao da pretensao executoria | prescricao executoria | pretensao executoria" ]
    artigos: [ "art. 113, CP", "art. 110, CP", "art. 109, VI, CP", "art. 112, II, CP", "art. 107, IV, CP" ]
    gabarito: "Sem prejuízo, a defesa técnica de Carlos, de imediato, por meio de Habeas Corpus, poderia buscar o reconhecimento da prescrição da pretensão executória para evitar a execução do restante da pena privativa de liberdade. Isso porque o prazo da prescrição da pretensão executória, quando há início do cumprimento da pena, inicia-se quando da interrupção deste cumprimento, conforme Art. 112, II, CP, que ocorreu em 10/03/2015.\n\nAdemais, o prazo prescricional deverá ser contado considerando a pena que resta a ser cumprida e não a aplicada, nos termos do Art. 113 do CP. No caso, restava menos de 01 ano de pena a ser cumprida, de modo que, na forma do Art. 109, inciso VI, do CP, o prazo prescricional da pretensão executória seria de 03 anos.\n\nUltrapassado o período de 03 anos desde a interrupção do cumprimento da pena, não sendo narrada qualquer causa interruptiva do prazo, deveria a defesa buscar o reconhecimento da perda do Estado do direito de executar o restante da pena imposta."
    revisao: { status: revisado }
  - id: 25-porto-alegre-q4-a
    categoria: discursiva
    parte: q4
    item: "A1"
    pergunta: "Que recurso cabe contra a pronúncia?"
    tese: "Recurso em sentido estrito"
    aceitos: [ "recurso em sentido estrito | rese" ]
    artigos: [ "art. 581, IV, CPP" ]
    gabarito: "O recurso cabível da decisão de pronúncia é o Recurso em Sentido Estrito, nos termos do Art. 581, inciso IV, do CPP. Em relação ao argumento de direito processual, deveria o candidato alegar que houve nulidade durante a instrução probatória, tendo em vista que o magistrado formulou diretamente perguntas às testemunhas, sendo que o Código de Processo Penal prevê o sistema de cross examination para oitiva das testemunhas, cabendo as partes formularem as perguntas diretamente para as testemunhas, podendo ser complementados pelo magistrado, na forma do Art. 411 e do Art. 212, ambos do CPP. No caso, o magistrado formulou diretamente as perguntas, não oportunizou às partes a complementação e houve devida impugnação em momento adequado. A conduta do juiz configura cerceamento de defesa, de modo que devem ser anulados todos os atos desde a instrução."
    revisao: { status: revisado }
  - id: 25-porto-alegre-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que argumento de direito material afasta a imputação de homicídio consumado?"
    tese: "Causa superveniente relativamente independente: a picada do escorpião causou por si só a morte, e Vitor responde só por tentativa de homicídio"
    aceitos: [ [ "relativamente independente" ], [ "superveniente" ], [ "tentativa" ] ]
    artigos: [ "art. 13, § 1º, CP" ]
    gabarito: "Em relação ao argumento de direito material, deveria a defesa de Vitor questionar a capitulação jurídica realizada pelo Ministério Público. De fato, Vitor, ao efetuar disparos de arma de fogo contra José, em direção ao seu peito, tinha a intenção de matá-lo, como o enunciado deixa claro. Todavia, os disparos de Vitor não foram suficientes para causar a morte de seu inimigo por circunstâncias alheias à sua vontade, já que os projéteis atingiram a perna de José. José recebeu atendimento médico e já estava no quarto com curativos.\n\nPosteriormente, José veio a ser mordido por escorpião, sendo que o veneno do animal causou, exclusivamente, sua morte. Certo é que José só estava no hospital em razão dos disparos de Vitor, mas houve causa superveniente, relativamente independente, que por si só causou a morte de José. Diante disso, o resultado fica afastado, mas responde Vitor pelos atos já praticados, conforme previsão do Art. 13, § 1º, do Código Penal.\n\nAssim, por mais que José tenha falecido, Vitor deveria responder pelo crime de tentativa de homicídio."
    revisao: { status: revisado }
