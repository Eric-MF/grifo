  - id: 25-porto-alegre-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Carlos, 50 anos, foi condenado, de maneira definitiva, pela prática de crime de roubo, ao cumprimento de pena de 04 anos de reclusão, em regime inicial semiaberto em razão das peculiaridades do caso, apesar de naquele momento ser primário.

      Após o cumprimento de 03 anos e 10 dias da pena aplicada, considerando o período de prisão provisória, Carlos veio a praticar falta grave, em 10/03/2015, dentro do estabelecimento prisional, sendo que, no mesmo dia, empreendeu fuga. Após processo administrativo disciplinar, inclusive com participação da defesa técnica de Carlos, foi reconhecida a prática de falta grave.

      O juiz da execução penal, em procedimento regular, ainda no ano de 2015, confirmou o reconhecimento da prática de falta grave e determinou o reinício do prazo para obtenção do livramento condicional. Por falhas cartorárias, a defesa técnica de Carlos somente foi intimada da decisão em 14/03/2018. Com a intimação, Carlos, que nunca mais foi localizado para cumprimento do restante da pena, apesar do mandado de prisão em aberto, procura seu advogado, indaga sobre as medidas cabíveis, esclarecendo que, de fato, houve prática de falta grave, mas assegurando estar ressocializado e que nunca mais se envolveu com a prática de crimes.

      Considerando apenas as informações narradas, na condição de advogado de Carlos, responda aos itens a seguir.
    comando: Em sede de Agravo à Execução, qual argumento deverá ser apresentado para combater o mérito da decisão do magistrado? Justifique.
    gabarito: O argumento a ser apresentado pela defesa técnica de Carlos é no sentido de que a prática de falta grave não gera o reinício do prazo de contagem do livramento condicional. Narra o enunciado que Carlos, quando do cumprimento da sua pena, praticou falta grave no interior do estabelecimento penitenciário. De acordo com o Art. 118, inciso I, da Lei nº 7.210/84, a prática de falta grave enseja à regressão de regime. Todavia, a Lei de Execução Penal não prevê como consequência da prática de falta grave o reinício do prazo para obtenção do livramento condicional, sendo certo que a execução penal também está sujeita ao princípio da legalidade. Dessa forma, equivocada a decisão do magistrado de determinar a interrupção do prazo para obtenção de livramento condicional, nos termos da Súmula 441 do Superior Tribunal de Justiça.
    opcoes:
      correta: O argumento a ser apresentado é o de que a prática de falta grave não gera o reinício da contagem do prazo do livramento condicional, nos termos da Súmula 441/STJ.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Remessa dos autos ao órgão superior do Ministério Público, a fim de que seja oferecido o Acordo de Não Persecução Penal, nos termos do Art. 28-A, § 14º, do CPP.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
  - id: 25-porto-alegre-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      Carlos, 50 anos, foi condenado, de maneira definitiva, pela prática de crime de roubo, ao cumprimento de pena de 04 anos de reclusão, em regime inicial semiaberto em razão das peculiaridades do caso, apesar de naquele momento ser primário.

      Após o cumprimento de 03 anos e 10 dias da pena aplicada, considerando o período de prisão provisória, Carlos veio a praticar falta grave, em 10/03/2015, dentro do estabelecimento prisional, sendo que, no mesmo dia, empreendeu fuga. Após processo administrativo disciplinar, inclusive com participação da defesa técnica de Carlos, foi reconhecida a prática de falta grave.

      O juiz da execução penal, em procedimento regular, ainda no ano de 2015, confirmou o reconhecimento da prática de falta grave e determinou o reinício do prazo para obtenção do livramento condicional. Por falhas cartorárias, a defesa técnica de Carlos somente foi intimada da decisão em 14/03/2018. Com a intimação, Carlos, que nunca mais foi localizado para cumprimento do restante da pena, apesar do mandado de prisão em aberto, procura seu advogado, indaga sobre as medidas cabíveis, esclarecendo que, de fato, houve prática de falta grave, mas assegurando estar ressocializado e que nunca mais se envolveu com a prática de crimes.

      Considerando apenas as informações narradas, na condição de advogado de Carlos, responda aos itens a seguir.
    comando: Por meio de Habeas Corpus, qual argumento de direito material poderá ser apresentado para evitar a execução do restante da pena de Carlos? Justifique.
    gabarito: |-
      Sem prejuízo, a defesa técnica de Carlos, de imediato, por meio de Habeas Corpus, poderia buscar o reconhecimento da prescrição da pretensão executória para evitar a execução do restante da pena privativa de liberdade. Isso porque o prazo da prescrição da pretensão executória, quando há início do cumprimento da pena, inicia-se quando da interrupção deste cumprimento, conforme Art. 112, II, CP, que ocorreu em 10/03/2015.

      Ademais, o prazo prescricional deverá ser contado considerando a pena que resta a ser cumprida e não a aplicada, nos termos do Art. 113 do CP. No caso, restava menos de 01 ano de pena a ser cumprida, de modo que, na forma do Art. 109, inciso VI, do CP, o prazo prescricional da pretensão executória seria de 03 anos.

      Ultrapassado o período de 03 anos desde a interrupção do cumprimento da pena, não sendo narrada qualquer causa interruptiva do prazo, deveria a defesa buscar o reconhecimento da perda do Estado do direito de executar o restante da pena imposta.
    opcoes:
      correta: O argumento é o de que ocorreu prescrição da pretensão executória, nos termos do Art. 107, inciso IV, do CP OU do Art. 110 do CP, pois entre a interrupção do cumprimento da pena e a data da manifestação do(a) advogado(a) foi ultrapassado o prazo de 03 anos.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - "Sim, resta configurada a prescrição da pretensão punitiva retroativa. Obs.: A indicação de espécie distinta de prescrição macula a integralidade do item “A”."
        - Não há vedação legal, tendo em vista que Andy ostenta condenação pela prática de contravenção penal e não de crime, sem violação ao Art. 89 da Lei nº 9.099/95.
        - Sim, o argumento de que ocorreu extinção da punibilidade diante da reparação do dano pelo réu, pagamento esse que precedeu sentença irrecorrível, nos termos do Art. 312, § 3º, do CP.
    revisao: *a1
  - id: 25-porto-alegre-q4-a
    categoria: discursiva
    parte: q4
    item: A1
    caso: |-
      Vitor efetuou disparos de arma de fogo contra José, com a intenção de causar sua morte. Ocorre que, por erro durante a execução, os disparos atingiram a perna de seu inimigo e não o peito, como pretendido. Esgotada a munição disponível, Vitor empreendeu fuga, enquanto José solicitou a ajuda de populares e compareceu, de imediato, ao hospital para atendimento médico.

      Após o atendimento médico, já no quarto com curativos, enquanto dormia, José vem a ser picado por um escorpião, vindo a falecer no dia seguinte em razão do veneno do animal, exclusivamente. Descobertos os fatos, considerando que José somente estava no hospital em razão do comportamento de Vitor, o Ministério Público oferece denúncia em face do autor dos disparos pela prática do crime de homicídio consumado, previsto no Art. 121, caput, do Código Penal.

      Após regular prosseguimento do feito, na audiência de instrução e julgamento da primeira fase do procedimento do Tribunal do Júri, quando da oitiva das testemunhas, o magistrado em atuação optou por iniciar a oitiva das testemunhas formulando diretamente suas perguntas, sem permitir às partes complementação. Após alegações finais orais das partes, o magistrado proferiu decisão de pronúncia. Apesar da impugnação da defesa quanto à formulação das perguntas pelo juiz, o magistrado esclareceu que não importaria quem fez a pergunta, pois as respostas seriam as mesmas.

      Com base apenas nas informações narradas, na condição de advogado(a) de Vitor, responda aos itens a seguir.
    comando: Qual o recurso cabível da decisão proferida pelo magistrado e qual argumento de direito processual pode ser apresentado em busca da desconstituição de tal decisão? Justifique.
    gabarito: O recurso cabível da decisão de pronúncia é o Recurso em Sentido Estrito, nos termos do Art. 581, inciso IV, do CPP. Em relação ao argumento de direito processual, deveria o candidato alegar que houve nulidade durante a instrução probatória, tendo em vista que o magistrado formulou diretamente perguntas às testemunhas, sendo que o Código de Processo Penal prevê o sistema de cross examination para oitiva das testemunhas, cabendo as partes formularem as perguntas diretamente para as testemunhas, podendo ser complementados pelo magistrado, na forma do Art. 411 e do Art. 212, ambos do CPP. No caso, o magistrado formulou diretamente as perguntas, não oportunizou às partes a complementação e houve devida impugnação em momento adequado. A conduta do juiz configura cerceamento de defesa, de modo que devem ser anulados todos os atos desde a instrução.
    opcoes:
      correta: O recurso cabível da decisão de pronúncia é o Recurso em Sentido Estrito, na forma do Art. 581, inciso IV, do CPP. O argumento de direito processual a ser apresentado é o de que houve nulidade com a formulação de perguntas diretas por parte do magistrado, sem oportunizar complementação das partes, o que viola o princípio da ampla defesa OU o que gera o cerceamento de defesa.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Remessa dos autos ao órgão superior do Ministério Público, a fim de que seja oferecido o Acordo de Não Persecução Penal, nos termos do Art. 28-A, § 14º, do CPP.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
  - id: 25-porto-alegre-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
      Vitor efetuou disparos de arma de fogo contra José, com a intenção de causar sua morte. Ocorre que, por erro durante a execução, os disparos atingiram a perna de seu inimigo e não o peito, como pretendido. Esgotada a munição disponível, Vitor empreendeu fuga, enquanto José solicitou a ajuda de populares e compareceu, de imediato, ao hospital para atendimento médico.

