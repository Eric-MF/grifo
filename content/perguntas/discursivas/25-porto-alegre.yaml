    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: porque ocorreu cerceamento de defesa OU porque houve violação ao princípio da ampla defesa, nos termos do Art. 5º, LV, CRFB.
    opcoes:
      correta: porque ocorreu cerceamento de defesa OU porque houve violação ao princípio da ampla defesa, nos termos do Art. 5º, LV, CRFB.
      erradas:
        - Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
        - Excludente de culpabilidade, em razão da inimputabilidade.
        - Desenvolvimento jurídico acerca da necessidade de manutenção da pena- base no mínimo legal para o crime de estupro de vulnerável
        - Subsidiariamente, aplicação de pena base no mínimo legal, já que as circunstâncias do Art. 59 são favoráveis.
        - A prática de falta grave não gera o reinício da contagem do prazo de indulto, nos termos da Súmula 535 do STJ.
