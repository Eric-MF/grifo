      Com base apenas nas informações narradas, na condição de advogado(a) de Vitor, responda aos itens a seguir.
    comando: Existe argumento de direito material a ser apresentado, em momento oportuno, para questionar a capitulação jurídica apresentada pelo Ministério Público? Justifique.
    gabarito: |-
      Em relação ao argumento de direito material, deveria a defesa de Vitor questionar a capitulação jurídica realizada pelo Ministério Público. De fato, Vitor, ao efetuar disparos de arma de fogo contra José, em direção ao seu peito, tinha a intenção de matá-lo, como o enunciado deixa claro. Todavia, os disparos de Vitor não foram suficientes para causar a morte de seu inimigo por circunstâncias alheias à sua vontade, já que os projéteis atingiram a perna de José. José recebeu atendimento médico e já estava no quarto com curativos.

      Posteriormente, José veio a ser mordido por escorpião, sendo que o veneno do animal causou, exclusivamente, sua morte. Certo é que José só estava no hospital em razão dos disparos de Vitor, mas houve causa superveniente, relativamente independente, que por si só causou a morte de José. Diante disso, o resultado fica afastado, mas responde Vitor pelos atos já praticados, conforme previsão do Art. 13, § 1º, do Código Penal.

      Assim, por mais que José tenha falecido, Vitor deveria responder pelo crime de tentativa de homicídio.
    opcoes:
      correta: O argumento de direito material é o de que ocorreu causa superveniente relativamente independente que por si só causou o resultado, devendo Vitor responder por tentativa de homicídio, nos termos do Art. 13, § 1º, do CP.
