  - id: 25-porto-alegre-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Bruna, nascida em 30 de março de 1999, e sua irmã Júlia, nascida em 21 de janeiro de 1998, revoltadas com o comportamento de Maria, que, segundo as irmãs, buscava um relacionamento amoroso com o namorado de Júlia, iniciaram uma discussão com esta, no dia 28 de março de 2017.

      Durante a discussão, descontroladas por Maria ter dito que Júlia não tinha capacidade de manter um namorado, as irmãs pegaram pedaços de ferro que estavam no chão da rua e começaram a agredir Maria com golpes na cabeça, com intenção de matar. Após a fuga de Bruna e Júlia do local, Maria é socorrida e recebe atendimento médico no hospital da região, ficando internada por 05 dias, mas vem a falecer em razão dos golpes sofridos.

      Ao tomar conhecimento dos fatos, o Ministério Público oferece denúncia em face de Bruna e Júlia pela prática do crime do Art. 121, §2º, inciso II, do Código Penal, requerendo a prisão preventiva apenas de Júlia, considerando que a mesma já seria reincidente. Após citação de Bruna e Júlia, a família das rés o(a) procura na condição de advogado(a), informando que Júlia está grávida de 20 semanas e que temem por sua saúde dentro da prisão.

      Considerando apenas as informações narradas, na condição de advogado(a) de Bruna e Júlia, responda aos itens a seguir.
    comando: Qual argumento de direito material a ser apresentado em favor de Bruna para evitar o prosseguimento da ação penal em relação a mesma? Justifique.
    gabarito: "O argumento a ser apresentado pela defesa de Bruna é que sua conduta, em tese, poderia configurar ato infracional, mas não crime sob o ponto de vista técnico, já que inimputável na data dos fatos. Inicialmente, importante recordar que, de acordo com a teoria majoritária, três são os elementos do conceito analítico do crime: tipicidade, ilicitude e culpabilidade. Por sua vez, a culpabilidade é formada pelos elementos imputabilidade, exigibilidade de conduta diversa e potencial conhecimento da ilicitude. Prevê o Art. 27 do Código Penal que os menores de 18 anos são penalmente inimputáveis. Diante disso, Bruna, menor de 18 anos na data dos fatos, não pratica crime, mas tão só ato infracional. Isso porque o Art. 4º do Código Penal estabelece que se considera praticado o crime no momento da ação ou omissão, ainda que outro seja o momento do resultado. No momento dos golpes desferidos por Julia e Bruna em Maria, com intenção de matar, Bruna era menor de 18 anos, logo inimputável, ainda que, quando do resultado morte, já fosse maior."
    opcoes:
      correta: Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Remessa dos autos ao órgão superior do Ministério Público, a fim de que seja oferecido o Acordo de Não Persecução Penal, nos termos do Art. 28-A, § 14º, do CPP.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
  - id: 25-porto-alegre-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Bruna, nascida em 30 de março de 1999, e sua irmã Júlia, nascida em 21 de janeiro de 1998, revoltadas com o comportamento de Maria, que, segundo as irmãs, buscava um relacionamento amoroso com o namorado de Júlia, iniciaram uma discussão com esta, no dia 28 de março de 2017.

      Durante a discussão, descontroladas por Maria ter dito que Júlia não tinha capacidade de manter um namorado, as irmãs pegaram pedaços de ferro que estavam no chão da rua e começaram a agredir Maria com golpes na cabeça, com intenção de matar. Após a fuga de Bruna e Júlia do local, Maria é socorrida e recebe atendimento médico no hospital da região, ficando internada por 05 dias, mas vem a falecer em razão dos golpes sofridos.

      Ao tomar conhecimento dos fatos, o Ministério Público oferece denúncia em face de Bruna e Júlia pela prática do crime do Art. 121, §2º, inciso II, do Código Penal, requerendo a prisão preventiva apenas de Júlia, considerando que a mesma já seria reincidente. Após citação de Bruna e Júlia, a família das rés o(a) procura na condição de advogado(a), informando que Júlia está grávida de 20 semanas e que temem por sua saúde dentro da prisão.

      Considerando apenas as informações narradas, na condição de advogado(a) de Bruna e Júlia, responda aos itens a seguir.
    comando: Considerando que verdadeiramente estejam presentes os requisitos previstos nos Artigos 312 e 313 do Código de Processo Penal, qual requerimento deveria ser formulado ao juízo para evitar que Julia permaneça no interior do sistema prisional? Justifique.
    gabarito: O requerimento a ser formulado é de substituição da prisão preventiva por prisão domiciliar, nos termos do Art. 318, inciso IV, do CPP. O Código de Processo Penal prevê, desde a Lei nº 12.403/11, a prisão domiciliar em substituição a prisão provisória, não sendo mais restrita à fase de execução da pena. Já com a Lei nº 13.257/16, passou o CPP a prever, no Art. 318, inciso IV, a possibilidade de requerimento de substituição da prisão preventiva por domiciliar quando a presa for gestante, não mais havendo limitação do período de gestação. Basta a condição de gestante de acordo com a lei. Assim, considerando que Julia estava grávida de 20 semanas, cabível o requerimento. Cabe ressaltar que argumentações no sentido de revogação da prisão pela ausência de fundamentos dos Arts. 312 e 313 do CPP não serão aceitas, tendo em vista que o próprio comando da questão deixa claro o preenchimento dos mesmos.
    opcoes:
      correta: O requerimento a ser formulado é de substituição da prisão preventiva por prisão domiciliar, nos termos do Art. 318, inciso IV, do CPP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Remessa dos autos ao órgão superior do Ministério Público, a fim de que seja oferecido o Acordo de Não Persecução Penal, nos termos do Art. 28-A, § 14º, do CPP.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
  - id: 25-porto-alegre-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      No dia 06 de abril de 2017, João retirou Clara, criança de 11 anos de idade, do interior da residência em que esta morava, sem autorização de qualquer pessoa, vindo a restringir sua liberdade e mantê-la dentro de um quarto trancado e sem janelas. Logo em seguida, João entrou em contato com o pai de Clara, famoso empresário da cidade, exigindo R$200.000,00 para liberar Clara e devolvê-la à sua residência.

      Após o pai de Clara pagar o valor exigido, Clara é liberada e, de imediato, a família comparece à Delegacia para registrar o fato. Depois das investigações, João é identificado e os autos são encaminhados ao Ministério Público com relatório final de investigação, indiciando João. Após 90 (noventa) dias do recebimento do inquérito, os autos permanecem no gabinete do Promotor de Justiça, sem que qualquer medida tenha sido adotada.

      Considerando as informações narradas, responda, na condição de advogado(a) da família de Clara, aos itens a seguir.
    comando: "Considerando que o crime é de ação penal pública incondicionada, qual a medida a ser adotada diretamente pela família de Clara e seu advogado em busca da responsabilização criminal de João? Justifique. (Valor:"
    gabarito: A medida a ser adotada pela família de Clara e seus advogados é a apresentação de queixa substitutiva da denúncia, dando início à ação penal privada subsidiária da pública. Sem dúvida, o crime a ser imputado a João é de ação penal pública incondicionada, de modo que, em princípio, caberia ao Ministério Público oferecer denúncia. Todavia, de acordo com o que consta do enunciado, houve omissão por parte do Ministério Público, tendo em vista que recebido o inquérito com relatório final de indiciamento de João, o Parquet se manteve inerte, não oferecendo denúncia, requerendo o arquivamento ou solicitando diligências. Assim, diante da omissão do Ministério Público, será admitida ação privada subsidiária da pública, nos termos do Art. 29 do Código de Processo Penal e Art. 5º, inciso LIX, da CRFB/88, cabendo ao Ministério Público aditar a queixa, repudiá-la ou oferecer denúncia substitutiva.
    opcoes:
      correta: Caberia à família de Clara dar início à ação penal privada subsidiária da pública OU oferecer queixa substitutiva da denúncia, diante da omissão do Ministério Público, nos termos do Art. 29 do CPP OU do Art. 5º, inciso LIX, da CRFB/88.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Remessa dos autos ao órgão superior do Ministério Público, a fim de que seja oferecido o Acordo de Não Persecução Penal, nos termos do Art. 28-A, § 14º, do CPP.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
  - id: 25-porto-alegre-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      No dia 06 de abril de 2017, João retirou Clara, criança de 11 anos de idade, do interior da residência em que esta morava, sem autorização de qualquer pessoa, vindo a restringir sua liberdade e mantê-la dentro de um quarto trancado e sem janelas. Logo em seguida, João entrou em contato com o pai de Clara, famoso empresário da cidade, exigindo R$200.000,00 para liberar Clara e devolvê-la à sua residência.

      Após o pai de Clara pagar o valor exigido, Clara é liberada e, de imediato, a família comparece à Delegacia para registrar o fato. Depois das investigações, João é identificado e os autos são encaminhados ao Ministério Público com relatório final de investigação, indiciando João. Após 90 (noventa) dias do recebimento do inquérito, os autos permanecem no gabinete do Promotor de Justiça, sem que qualquer medida tenha sido adotada.

      Considerando as informações narradas, responda, na condição de advogado(a) da família de Clara, aos itens a seguir.
    comando: Em caso de inicial acusatória, qual infração penal deve ser imputada a João? Justifique.
    gabarito: O crime a ser imputado a João é de extorsão mediante sequestro qualificada, nos termos do Art. 159, § 1º, do Código Penal, tendo em vista que João sequestrou Clara, criança de 11 anos, restringindo sua liberdade, com a clara intenção de obter, para si ou para outrem, vantagem econômica indevida como condição para o resgate.
    opcoes:
      correta: Extorsão mediante sequestro, presente a qualificadora pelo fato de a vítima ser menor de 18 anos, nos termos do Art. 159, § 1º, do CP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Remessa dos autos ao órgão superior do Ministério Público, a fim de que seja oferecido o Acordo de Não Persecução Penal, nos termos do Art. 28-A, § 14º, do CPP.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
