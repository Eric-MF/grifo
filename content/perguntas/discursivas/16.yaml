  - id: 16-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Carlos foi condenado pelos crimes de tráfico de entorpecentes e posse de arma de fogo de uso permitido, em concurso material, sendo sua conduta tipificada da seguinte forma: Art. 33 da Lei nº 11.343/06 e Art. 12 da Lei nº 10.826/03, na forma do Art. 69 do Código Penal. A pena ficou estabelecida em 05 anos de reclusão em regime fechado para o crime de tráfico e 01 ano de detenção em regime semiaberto pelo crime de posse de arma de fogo. Apenas a defesa técnica apelou, requerendo a mudança do regime de pena aplicado para o crime do Art. 33 da Lei nº 11.343/06, tendo o feito transitado em julgado para a acusação. O recurso foi desprovido. Todavia, de ofício, sem reflexo no quantum, que permaneceu em 06 anos de pena privativa de liberdade, o Tribunal reclassificou o fato para o Art. 33 c/c o Art. 40, IV, da Lei nº 11343/06, afastando o crime autônomo da lei de armas e aplicando a causa de aumento respectiva.

      Considerando as informações narradas na hipótese, responda aos itens a seguir.
    comando: Poderia ser aplicado regime inicial de cumprimento da pena diverso do fechado para o crime de tráfico ilícito de entorpecentes, previsto no Art. 33, caput, da Lei nº 11.343/06?
    gabarito: A questão narra que Carlos foi condenado pela prática de um crime de tráfico de drogas e posse de arma de fogo de uso permitido. Em que pese o crime de tráfico ser equiparado a hediondo, hoje o entendimento que prevalece no âmbito do Supremo Tribunal Federal é no sentido de que é possível a aplicação de regime inicial de cumprimento de pena diverso do fechado, sendo a previsão do Art. 2º, §1º, da Lei nº 8.072/90 inconstitucional, pois violadora do princípio da individualização da pena. Assim, analisando as circunstâncias do caso concreto, nada impede que o magistrado fixe o regime semiaberto ao caso, até porque a pena base não se afastou do mínimo legal, o que indica que as circunstâncias do artigo 59 do CP são favoráveis.
    opcoes:
      correta: "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
      erradas:
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
    revisao: *a1
  - id: 16-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Carlos foi condenado pelos crimes de tráfico de entorpecentes e posse de arma de fogo de uso permitido, em concurso material, sendo sua conduta tipificada da seguinte forma: Art. 33 da Lei nº 11.343/06 e Art. 12 da Lei nº 10.826/03, na forma do Art. 69 do Código Penal. A pena ficou estabelecida em 05 anos de reclusão em regime fechado para o crime de tráfico e 01 ano de detenção em regime semiaberto pelo crime de posse de arma de fogo. Apenas a defesa técnica apelou, requerendo a mudança do regime de pena aplicado para o crime do Art. 33 da Lei nº 11.343/06, tendo o feito transitado em julgado para a acusação. O recurso foi desprovido. Todavia, de ofício, sem reflexo no quantum, que permaneceu em 06 anos de pena privativa de liberdade, o Tribunal reclassificou o fato para o Art. 33 c/c o Art. 40, IV, da Lei nº 11343/06, afastando o crime autônomo da lei de armas e aplicando a causa de aumento respectiva.

      Considerando as informações narradas na hipótese, responda aos itens a seguir.
    comando: Poderia o Tribunal de Justiça em sede de recurso da defesa realizar a reclassificação adotada?
    gabarito: |-
      Ainda consta do enunciado que o Tribunal de Justiça, em julgamento exclusivo da defesa, optou por realizar uma reclassificação da conduta, aplicando a causa de aumento de pena do Art. 40, inciso IV, da Lei nº 11.343, em vez de manter a condenação pelo crime de posse de arma de fogo. Não poderia, porém, o Tribunal ter adotado essa conduta, pois ela é prejudicial ao réu. Como o recurso foi exclusivo da defesa, a reclassificação viola o princípio da vedação da reformatio in pejus. O prejuízo da nova classificação decorre de alguns fatores:

      para o cálculo de eventual prescrição, tendo em vista que a causa de aumento é considerada para fixação do prazo prescricional, enquanto que, havendo dois crimes, o prazo seria fixado de maneira separada para cada um; um dos crimes é punido com detenção, o que impede fixação do regime inicial fechado, deixando isso de ocorrer com a causa de aumento; na execução, a progressão de regime, no caso da causa de aumento, será calculada em 2/5 (ou 3/5, se reincidente) do total de 06 anos, enquanto que, se mantidas as condenações separadas, esse percentual somente seria aplicado sobre a pena de 05 anos, pois sobre 01 ano seria aplicado o percentual de 1/6, já que a posse de arma de fogo não é crime hediondo.
    opcoes:
      correta: Não, pois viola o princípio da vedação da reformatio in pejus, tendo em vista que geraria prejuízo na aplicação do regime OU na prescrição OU na execução da pena
      erradas:
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
