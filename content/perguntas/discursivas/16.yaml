  - id: 16-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      No dia 03/05/2008, Luan foi condenado à pena privativa de liberdade de 12 anos de reclusão pela prática dos crimes previstos nos artigos 213 e 214 do Código Penal, na forma do Art. 69 do mesmo diploma legal, pois, no dia 11/07/2007, por volta das 19h, constrangeu Carla, mediante grave ameaça, a com ele praticar conjunção carnal e ato libidinoso diverso. Ainda cumprindo pena em razão dessa sentença condenatória, Luan, conversando com outro preso, veio a saber que ele havia sido condenado por fatos extremamente semelhantes a uma pena de 07 anos de reclusão. Luan, então, pergunta o nome do advogado do colega de cela, que lhe fornece a informação.

      Luan entra em contato pelo telefone indicado e pergunta se algo pode ser feito para reduzir sua pena, apesar de sua decisão ter transitado em julgado.

      Diante dessa situação, responda aos itens a seguir.
    comando: Qual a tese de direito material que poderia ser suscitada pelo novo advogado em favor de Luan?
    gabarito: |-
      Luan foi condenado pela prática de crimes de estupro e atentado violento ao pudor em concurso material. O entendimento que prevalecia antes da edição da Lei nº 12.015 era a da impossibilidade de aplicação da continuidade delitiva entre essas duas infrações, pois não seriam crimes da mesma espécie. Ocorre que, com a inovação legislativa ocorrida no ano de 2009, a conduta antes prevista no Art. 214 do Código Penal passou a ser englobada pela figura típica do Art. 213 do CP. Apesar de não ter havido abolitio criminis, certo é que a lei é mais benéfica. Sendo assim, poderá retroagir para atingir situações anteriores e caberá a redução de pena de Luan.

      A jurisprudência amplamente majoritária entende que, de acordo com a nova redação, o Art. 213 do CP passou a prever um tipo misto alternativo. Assim, quando praticada conjunção carnal e outro ato libidinoso diverso em um mesmo contexto e contra a mesma vítima, haveria crime único. Outros, minoritariamente, entendem que o artigo traz um tipo misto cumulativo, de modo que ainda seria possível punir o agente que pratica conjunção carnal e outro ato libidinoso diverso por dois crimes. De qualquer forma, mesmo para essa segunda corrente, caberia a redução de pena de Luan, pois agora seria possível a aplicação da continuidade delitiva, já que os crimes são de mesma espécie.

      O examinando poderá adotar qualquer uma das duas correntes, desde que assegure a aplicação da nova lei mais benéfica para Luan.
    opcoes:
      correta: A tese adequada é a da aplicação da lei mais benéfica ao condenado, que importará na redução da sua pena, tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto alternativo, portanto crime único OU tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto cumulativo, sujeito à aplicação da continuidade delitiva o que permite sua aplicação para fatos praticados antes de sua entrada em vigor, ainda que a decisão seja definitiva.
      erradas:
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
