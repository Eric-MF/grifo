# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "16"
introducoes:
  peca: "Gilberto, primário mas com maus antecedentes, foi condenado por roubo simples (um celular, recuperado pela vítima) a 4 anos e 6 meses no regime fechado. Cumpre a pena desde 15/9/2013, sem falta grave, e já progrediu de regime. Em 25/2/2015, pediu o livramento condicional, que o juiz da execução negou por três razões: o roubo seria hediondo, exigindo 2/3 da pena; mesmo que não fosse, Gilberto teria de cumprir metade, por ter maus antecedentes; e seria indispensável o exame criminológico, porque o roubo é, em abstrato, muito grave. Você foi intimado da decisão em 23/3/2015."
  q1: "Carlos foi condenado por tráfico (5 anos, regime fechado) e posse de arma (1 ano) em concurso material. Só a defesa apelou, pedindo outro regime para o tráfico. O Tribunal negou e, por conta própria, sem mudar a pena total, reclassificou o fato para tráfico com a causa de aumento do emprego de arma, afastando o crime autônomo."
  q2: "Em 2008, Luan foi condenado a 12 anos por estupro e atentado violento ao pudor, em concurso material, por obrigar Carla, numa mesma ocasião em 2007, à conjunção carnal e a outro ato libidinoso. Já com a condenação transitada em julgado, ele soube que um colega de cela, por fatos semelhantes e mais recentes, pegou só 7 anos."
  q3: "Numa discussão de futebol, Rubens e Enrico chamaram Eduardo de 'ladrão' e 'estelionatário', e ele ofereceu queixa-crime contra os dois. Rubens pediu desculpas e recebeu o perdão de Eduardo, que aceitou, mas Eduardo recusou o perdão a Enrico."
  q4: "Wesley, estudante de 20 anos, primário, foi preso em flagrante dirigindo um carro que sabia ser produto de crime. Como respondia a outro processo, por furto qualificado, o delegado pediu a conversão do flagrante em preventiva, pela 'ordem pública'."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["16-peca-1", "16-peca-3", "16-peca-4", "16-peca-5", "16-peca-9"]
perguntas:
  - id: 16-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Por que o roubo de Gilberto não pode ser tratado como crime hediondo?"
    tese: "O roubo simples não está no rol taxativo dos crimes hediondos"
    aceitos: [ [ "rol" ], [ "nao e hediondo | nao hediondo | nao e crime hediondo" ], [ "taxativ*" ] ]
    artigos: [ "art. 1, Lei 8.072" ]
    gabarito: "Afastamento da hediondez do crime de roubo simples, pois este não está no rol dos crimes hediondos ou por violação ao princípio da taxatividade."
    revisao: { status: revisado }
  - id: 16-peca-7-1
    categoria: peca-detalhe
    parte: peca
    item: "7.1"
    secao: merito
    pergunta: "Primário, mas com maus antecedentes, que fração da pena Gilberto precisa cumprir para o livramento condicional?"
    tese: "Livramento condicional com um terço da pena para o primário de maus antecedentes"
    aceitos: [ "1/3 | um terco | terco" ]
    artigos: [ "art. 83, I, CP" ]
    gabarito: "O requisito objetivo para a concessão do livramento condicional de condenado não reincidente portador de maus antecedentes é de 1/3 e não de metade;"
    revisao: { status: revisado }
  - id: 16-peca-7-2
    categoria: peca-detalhe
    parte: peca
    item: "7.2"
    secao: merito
    pergunta: "Por que não se pode exigir de Gilberto a metade da pena, a fração do reincidente?"
    tese: "Aplicar a regra do reincidente a quem só tem maus antecedentes seria analogia contra o réu, vedada pela legalidade"
    aceitos: [ [ "analogia" ], [ "legalidade" ], [ "interpretacao mais favoravel" ] ]
    artigos: [ "art. 83, I, CP", "art. 83, II, CP" ]
    gabarito: "Aplicação do Art. 83, I, do CP (OU não aplicabilidade do Art. 83, II, do CP), diante do princípio da legalidade, que veda a aplicação de analogia in malam partem (OU aplicação da interpretação mais favorável ao apenado)."
    revisao: { status: revisado }
  - id: 16-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "O juiz pode exigir o exame criminológico só por causa da gravidade do tipo de crime?"
    tese: "O exame criminológico não é obrigatório: só pode ser exigido em decisão motivada nas peculiaridades concretas do caso"
    aceitos: [ [ "concret*" ], [ "peculiaridade*" ], [ "nao e indispensavel | dispensavel | nao obrigatorio | nao e obrigatorio" ] ]
    artigos: [ "Súmula 439 STJ" ]
    gabarito: "A realização do exame criminológico não é indispensável, porque a decisão que determina o exame criminológico deve ser devidamente fundamentada em fatores concretos (OU a mera gravidade em abstrato do delito não é suficiente para a exigência do exame criminológico), conforme Súmula 439 do STJ."
    revisao: { status: revisado }
  - id: 16-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "No tráfico, o regime inicial poderia ser diferente do fechado?"
    tese: "Inconstitucionalidade do regime fechado obrigatório para os crimes hediondos e equiparados"
    aceitos: [ "inconstitucional*" ]
    artigos: [ "art. 33, § 2º, CP", "art. 5, XLVI, CRFB" ]
    gabarito: "A questão narra que Carlos foi condenado pela prática de um crime de tráfico de drogas e posse de arma de fogo de uso permitido. Em que pese o crime de tráfico ser equiparado a hediondo, hoje o entendimento que prevalece no âmbito do Supremo Tribunal Federal é no sentido de que é possível a aplicação de regime inicial de cumprimento de pena diverso do fechado, sendo a previsão do Art. 2º, §1º, da Lei nº 8.072/90 inconstitucional, pois violadora do princípio da individualização da pena. Assim, analisando as circunstâncias do caso concreto, nada impede que o magistrado fixe o regime semiaberto ao caso, até porque a pena base não se afastou do mínimo legal, o que indica que as circunstâncias do artigo 59 do CP são favoráveis."
    revisao: { status: revisado }
  - id: 16-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Em recurso só da defesa, o Tribunal podia reclassificar o fato, mesmo sem mudar a pena?"
    tese: "Reformatio in pejus: em recurso só da defesa, a reclassificação piora a situação do réu"
    aceitos: [ "reformatio in pejus | reforma para pior" ]
    artigos: [ "art. 617, CPP" ]
    gabarito: "Ainda consta do enunciado que o Tribunal de Justiça, em julgamento exclusivo da defesa, optou por realizar uma reclassificação da conduta, aplicando a causa de aumento de pena do Art. 40, inciso IV, da Lei nº 11.343, em vez de manter a condenação pelo crime de posse de arma de fogo. Não poderia, porém, o Tribunal ter adotado essa conduta, pois ela é prejudicial ao réu. Como o recurso foi exclusivo da defesa, a reclassificação viola o princípio da vedação da reformatio in pejus. O prejuízo da nova classificação decorre de alguns fatores:\n\npara o cálculo de eventual prescrição, tendo em vista que a causa de aumento é considerada para fixação do prazo prescricional, enquanto que, havendo dois crimes, o prazo seria fixado de maneira separada para cada um; um dos crimes é punido com detenção, o que impede fixação do regime inicial fechado, deixando isso de ocorrer com a causa de aumento; na execução, a progressão de regime, no caso da causa de aumento, será calculada em 2/5 (ou 3/5, se reincidente) do total de 06 anos, enquanto que, se mantidas as condenações separadas, esse percentual somente seria aplicado sobre a pena de 05 anos, pois sobre 01 ano seria aplicado o percentual de 1/6, já que a posse de arma de fogo não é crime hediondo."
    revisao: { status: revisado }
  - id: 16-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que tese de direito material o novo advogado pode levantar em favor de Luan?"
    tese: "A retroatividade da lei mais benéfica, que fez do estupro um crime único"
    aceitos: [ [ "lei mais benefica | lei mais favoravel | novatio legis in mellius | retroativ*" ], [ "crime unico" ] ]
    artigos: [ "art. 2, parágrafo único, CP", "art. 5, XL, CRFB" ]
    gabarito: "Luan foi condenado pela prática de crimes de estupro e atentado violento ao pudor em concurso material. O entendimento que prevalecia antes da edição da Lei nº 12.015 era a da impossibilidade de aplicação da continuidade delitiva entre essas duas infrações, pois não seriam crimes da mesma espécie. Ocorre que, com a inovação legislativa ocorrida no ano de 2009, a conduta antes prevista no Art. 214 do Código Penal passou a ser englobada pela figura típica do Art. 213 do CP. Apesar de não ter havido abolitio criminis, certo é que a lei é mais benéfica. Sendo assim, poderá retroagir para atingir situações anteriores e caberá a redução de pena de Luan.\n\nA jurisprudência amplamente majoritária entende que, de acordo com a nova redação, o Art. 213 do CP passou a prever um tipo misto alternativo. Assim, quando praticada conjunção carnal e outro ato libidinoso diverso em um mesmo contexto e contra a mesma vítima, haveria crime único. Outros, minoritariamente, entendem que o artigo traz um tipo misto cumulativo, de modo que ainda seria possível punir o agente que pratica conjunção carnal e outro ato libidinoso diverso por dois crimes. De qualquer forma, mesmo para essa segunda corrente, caberia a redução de pena de Luan, pois agora seria possível a aplicação da continuidade delitiva, já que os crimes são de mesma espécie.\n\nO examinando poderá adotar qualquer uma das duas correntes, desde que assegure a aplicação da nova lei mais benéfica para Luan."
    revisao: { status: revisado }
  - id: 16-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Perante que órgão Luan deve fazer o pedido?"
    tese: "Competência do juízo da execução penal para aplicar a lei mais benéfica depois do trânsito em julgado"
    aceitos: [ "execu*" ]
    artigos: [ "Súmula 611 STF", "art. 66, I, LEP" ]
    gabarito: "O órgão competente perante o qual deverá ser formulado o pedido de aplicação da lei mais benigna e, consequentemente, da redução da pena é o juízo da Vara de Execuções Penais, considerando que já ocorreu o trânsito em julgado da sentença condenatória, na forma da Súmula 611 do STF ou do Art. 66, inciso I, da LEP."
    revisao: { status: revisado }
  - id: 16-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que crime Rubens e Enrico cometeram, em tese?"
    tese: "Injúria: atribuíram qualidade negativa, sem narrar um fato"
    aceitos: [ "injuria" ]
    artigos: [ "art. 140, CP" ]
    gabarito: "O crime praticado por Rubens e Enrico foi o de injúria, na forma do Art. 140 do Código Penal. Apesar das ofensas serem relacionadas à pessoa que pratica crimes, já que Eduardo foi chamado de “ladrão” e “estelionatário”, não há que se falar em crime de calúnia. A calúnia exige, para sua configuração, que seja atribuída ao ofendido a prática de determinado fato que configure crime. No caso, porém, não foram atribuídos fatos, mas sim qualidades pejorativas. Em razão disso, o crime praticado foi o de injúria."
    revisao: { status: revisado }
  - id: 16-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que argumento a defesa de Enrico pode usar para evitar a punição?"
    tese: "O perdão concedido a um dos querelados se estende aos outros"
    aceitos: [ "perdao", "todos | aproveita | estende | extensivo" ]
    artigos: [ "art. 51, CPP", "art. 106, I, CP" ]
    gabarito: "O argumento a ser formulado pela defesa é o de que o perdão do ofendido oferecido a um dos querelados a todos aproveita (Art. 51 do CPP), gerando a extinção da punibilidade dos coautores, caso seja aceito (Art. 107, V, do CP). Ao conceder perdão para Rubens, necessariamente esse perdão deve ser estendido para Enrico, de modo que, com sua aceitação, haverá extinção da sua punibilidade."
    revisao: { status: revisado }
  - id: 16-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Fora o habeas corpus, que medida a defesa de Wesley deve adotar?"
    tese: "Pedido de liberdade provisória"
    aceitos: [ "liberdade provisoria" ]
    artigos: [ "art. 321, CPP", "art. 310, III, CPP" ]
    gabarito: "Considerando que o enunciado narra que foi realizada validamente a prisão em flagrante de Wesley pela prática do crime de receptação simples, a medida processual a ser formulada é o pedido de liberdade provisória, evitando que seja decretada a prisão preventiva do indiciado."
    revisao: { status: revisado }
  - id: 16-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Por que não cabe a preventiva pedida pelo delegado?"
    tese: "Descabimento da preventiva: o crime tem pena máxima de até 4 anos e o indiciado é primário"
    aceitos: [ [ "4 anos | quatro anos" ], [ "hipotese de cabimento | hipoteses de cabimento" ] ]
    artigos: [ "art. 313, I, CPP" ]
    gabarito: "A representação da autoridade policial não foi elaborada de maneira adequada em relação à sua fundamentação, pois não estão preenchidos os requisitos do Art. 313 do Código de Processo Penal, sendo estes indispensáveis para a conversão da prisão em flagrante em preventiva. O crime praticado pelo indiciado não tem pena privativa de liberdade máxima superior a 04 anos. Ademais, não é o acusado reincidente na prática de crime doloso, devendo ser destacado que a existência de ação em curso não afasta a ausência de configuração do inciso II do Art. 313. Os requisitos do inciso III também não estão atendidos, sendo incabível a prisão preventiva, independentemente da fundamentação com os pressupostos do Art. 312 do CPP."
    revisao: { status: revisado }
