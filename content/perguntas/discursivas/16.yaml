      Diante dessa situação, responda aos itens a seguir.
    comando: A pretensão deverá ser manejada perante qual órgão?
    gabarito: O órgão competente perante o qual deverá ser formulado o pedido de aplicação da lei mais benigna e, consequentemente, da redução da pena é o juízo da Vara de Execuções Penais, considerando que já ocorreu o trânsito em julgado da sentença condenatória, na forma da Súmula 611 do STF ou do Art. 66, inciso I, da LEP.
    opcoes:
      correta: "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
      erradas:
