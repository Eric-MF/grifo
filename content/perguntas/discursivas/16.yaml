  - id: 16-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Em uma discussão de futebol, Rubens e Enrico, em comunhão de ações e desígnios, chamaram Eduardo de “ladrão” e “estelionatário”, razão pela qual Eduardo formulou uma queixa-crime em face de ambos.

      No curso da ação penal, porém, Rubens procurou Eduardo para pedir desculpas pelos seus atos, razão pela qual Eduardo expressamente concedeu perdão do ofendido em seu favor, sendo esse prontamente aceito e, consequentemente, extinta a punibilidade de Rubens. Eduardo, contudo, se recusou a conceder o perdão para Enrico, pois disse que não era a primeira vez que o querelado tinha esse tipo de atitude.

      Considerando apenas as informações narradas, responda aos itens a seguir.
    comando: Qual o crime praticado, em tese, por Rubens e Enrico?
    gabarito: O crime praticado por Rubens e Enrico foi o de injúria, na forma do Art. 140 do Código Penal. Apesar das ofensas serem relacionadas à pessoa que pratica crimes, já que Eduardo foi chamado de “ladrão” e “estelionatário”, não há que se falar em crime de calúnia. A calúnia exige, para sua configuração, que seja atribuída ao ofendido a prática de determinado fato que configure crime. No caso, porém, não foram atribuídos fatos, mas sim qualidades pejorativas. Em razão disso, o crime praticado foi o de injúria.
    opcoes:
      correta: "O crime é de injúria, pois apenas foi atribuída qualidade negativa e não houve narração de um fato delitivo, conforme o Art. 140 do CP. Obs.: a mera citação do dispositivo legal não será pontuada."
      erradas:
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
