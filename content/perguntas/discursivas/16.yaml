      Considerando as informações narradas, responda aos itens a seguir.
    comando: A representação da autoridade policial foi elaborada de modo adequado?
    gabarito: A representação da autoridade policial não foi elaborada de maneira adequada em relação à sua fundamentação, pois não estão preenchidos os requisitos do Art. 313 do Código de Processo Penal, sendo estes indispensáveis para a conversão da prisão em flagrante em preventiva. O crime praticado pelo indiciado não tem pena privativa de liberdade máxima superior a 04 anos. Ademais, não é o acusado reincidente na prática de crime doloso, devendo ser destacado que a existência de ação em curso não afasta a ausência de configuração do inciso II do Art. 313. Os requisitos do inciso III também não estão atendidos, sendo incabível a prisão preventiva, independentemente da fundamentação com os pressupostos do Art. 312 do CPP.
    opcoes:
      correta: "A representação da autoridade policial não foi elaborada de maneira adequada em relação à sua fundamentação, pois não estão preenchidos os requisitos para a decretação da prisão preventiva, do Art. 313 do CPP. Obs.: a mera citação do dispositivo legal não será pontuada."
