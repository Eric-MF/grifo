# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "02"
introducoes:
  peca: "A polícia gaúcha investigava Maria por mandar crianças ao exterior com passaportes irregulares. Logo de início, pediu a interceptação dos telefones dela, justificando só com a gravidade e a dificuldade de investigar, e a escuta pegou Maria perguntando a Antônio, servidor do setor de passaportes da Polícia Federal, se os passaportes estavam prontos. A quebra de sigilo achou um depósito de R$ 100 mil na conta dele. O juiz deferiu a busca e apreensão 'diante da gravidade dos fatos'. Nada se achou no apartamento 201 de Antônio, indicado no mandado, mas os policiais entraram no 202, também dele, e apreenderam US$ 50 mil. A denúncia, recebida pela 15ª Vara Criminal de Porto Alegre, imputa a Antônio o crime do ECA de enviar criança ao exterior e corrupção passiva, sem descrever o que cada réu fez. Você defende Antônio na resposta à acusação."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["02-peca-8", "02-peca-9"]
perguntas:
  - id: 02-peca-1
    categoria: peca-detalhe
    parte: peca
    item: "1"
    secao: preliminar
    pergunta: "Antônio é servidor federal e os fatos envolvem passaportes da Polícia Federal e a saída de crianças do país. Que preliminar cabe quanto ao juízo da 15ª Vara Criminal de Porto Alegre?"
    tese: "Incompetência da Justiça Estadual: o caso é da Justiça Federal"
    aceitos: [ [ "incompet*" ], [ "justica federal" ] ]
    artigos: [ "art. 109, V, CRFB", "art. 109, IV, CRFB" ]
    gabarito: "Incompetência da Justiça Estadual: crime de competência federal, art. 109, V (ou IV), da CF."
    revisao: { status: revisado }
  - id: 02-peca-2
    categoria: peca-detalhe
    parte: peca
    item: "2"
    secao: preliminar
    pergunta: "A interceptação foi a primeira medida da investigação, pedida só pela gravidade do caso. Que vício a defesa deve apontar nessa prova?"
    tese: "Nulidade da interceptação, decretada como primeira medida e sem fundamentação adequada"
    aceitos: [ "nulidade | nula | nulo | ilicit*" ]
    artigos: [ "art. 2, II, Lei 9.296", "art. 5, Lei 9.296" ]
    gabarito: "Nulidade da interceptação telefônica decretada como primeira medida investigatória (art. 2º, II, Lei 9.296/96) e sem fundamentação adequada (art. 5º da Lei 9.296/96 ou art. 93, IX, CF)."
    revisao: { status: revisado }
  - id: 02-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: preliminar
    pergunta: "Que vício tem a decisão que deferiu a busca e apreensão só 'diante da gravidade dos fatos'?"
    tese: "Nulidade da decisão de busca e apreensão, genérica e sem fundamentação"
    aceitos: [ "fundamenta* | generic* | motiva*" ]
    artigos: [ "art. 93, IX, CRFB" ]
    gabarito: "Nulidade da busca e apreensão genérica e sem fundamentação, art. 93, IX, CF."
    revisao: { status: revisado }
  - id: 02-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: preliminar
    pergunta: "O mandado era para o apartamento 201, mas os dólares foram apreendidos no 202. Como a defesa deve tratar essa prova?"
    tese: "Prova ilícita, colhida em domicílio sem ordem judicial, que deve ser desentranhada"
    aceitos: [ "ilicit* | inadmiss* | desentranha* | nulidade | nula" ]
    artigos: [ "art. 157, CPP", "art. 5, XI, CRFB" ]
    gabarito: "Nulidade da apreensão dos cinquenta mil dólares em endereço sem autorização judicial (prova ilícita)."
    revisao: { status: revisado }
  - id: 02-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: preliminar
    pergunta: "A denúncia não descreve o que cada réu fez. Que preliminar cabe contra ela?"
    tese: "Inépcia da denúncia genérica"
    aceitos: [ "inepcia | inepta" ]
    artigos: [ "art. 41, CPP", "art. 5, LV, CRFB" ]
    gabarito: "Inépcia da denúncia genérica (art. 8º, 2, ‘b’, do Decreto 678/92; art. 5º, LV, CF; art. 41 do CPP)."
    revisao: { status: revisado }
  - id: 02-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "No mérito, por que não há o crime do ECA imputado a Antônio?"
    tese: "Atipicidade, por ausência de dolo"
    aceitos: [ "dolo" ]
    artigos: [ "art. 239, parágrafo único, Lei 8.069" ]
    gabarito: "Atipicidade do art. 239, parágrafo único, do ECA, por ausência de dolo."
    revisao: { status: revisado }
  - id: 02-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Quanto à corrupção passiva, o que falta para a ação penal contra Antônio, acusado só por um depósito e pelo dinheiro achado?"
    tese: "Falta de justa causa para a ação penal"
    aceitos: [ "justa causa" ]
    artigos: [ "art. 395, III, CPP", "art. 317, § 1º, CP" ]
    gabarito: "Falta de justa causa quanto à corrupção passiva (art. 317, § 1º, CP), com cotejo entre o tipo e os fatos."
    revisao: { status: revisado }
