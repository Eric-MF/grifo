# Gerado por scripts/gerar-perguntas-exames.ts. Revise e marque revisao.status: revisado.
exame: "02"
perguntas:
  - id: 02-peca-1
    categoria: peca-detalhe
    parte: peca
    item: "1"
    secao: preliminar
    caso: |-
      A Polícia Civil do Estado do Rio Grande do Sul recebe notícia crime identificada, imputando a Maria Campos a prática de crime, eis que mandaria crianças brasileiras para o estrangeiro com documentos falsos. Diante da notícia crime, a autoridade policial instaura inquérito policial e, como primeira providência, representa pela decretação da interceptação das comunicações telefônicas de Maria Campos, “dada a gravidade dos fatos noticiados e a notória dificuldade de apurar crime de tráfico de menores para o exterior por outros meios, pois o ‘modus operandi’ envolve sempre atos ocultos e exige estrutura organizacional sofisticada, o que indica a existência de uma organização criminosa integrada pela investigada Maria”. O Ministério Público opina favoravelmente e o juiz defere a medida, limitando-se a adotar, como razão de decidir, “os fundamentos explicitados na representação policial”.

      No curso do monitoramento, foram identificadas pessoas que contratavam os serviços de Maria Campos para providenciar expedição de passaporte para viabilizar viagens de crianças para o exterior. Foi gravada conversa telefônica de Maria com um funcionário do setor de passaportes da Polícia Federal, Antônio Lopes, em que Maria consultava Antônio sobre os passaportes que ela havia solicitado, se já estavam prontos, e se poderiam ser enviados a ela. A pedido da autoridade policial, o juiz deferiu a interceptação das linhas telefônicas utilizadas por Antônio Lopes, mas nenhum diálogo relevante foi interceptado.

      O juiz, também com prévia representação da autoridade policial e manifestação favorável do Ministério Público, deferiu a quebra de sigilo bancário e fiscal dos investigados, tendo sido identificado um depósito de dinheiro em espécie na conta de Antônio, efetuado naquele mesmo ano, no valor de R$ 100.000,00 (cem mil reais). O monitoramento telefônico foi mantido pelo período de quinze dias, após o que foi deferida medida de busca e apreensão nos endereços de Maria e Antônio. A decisão foi proferida nos seguintes termos: “diante da gravidade dos fatos e da real possibilidade de serem encontrados objetos relevantes para investigação, defiro requerimento de busca e apreensão nos endereços de Maria (Rua dos Casais, 213) e de Antônio (Rua Castro, 170, apartamento 201)”. No endereço de Maria Campos, foi encontrada apenas uma relação de nomes que, na visão da autoridade policial, seriam clientes que teriam requerido a expedição de passaportes com os nomes de crianças que teriam viajado para o exterior. No endereço indicado no mandado de Antônio Lopes, nada foi encontrado. Entretanto, os policiais que cumpriram a ordem judicial perceberam que o apartamento 202 do mesmo prédio também pertencia ao investigado, motivo pelo qual nele ingressaram, encontrando e apreendendo a quantia de cinquenta mil dólares em espécie. Nenhuma outra diligência foi realizada.

      Relatado o inquérito policial, os autos foram remetidos ao Ministério Público, que ofereceu a denúncia nos seguintes termos: “o Ministério Público vem oferecer denúncia contra Maria Campos e Antônio Lopes, pelos fatos a seguir descritos: Maria Campos, com o auxílio do agente da polícia federal Antônio Lopes, expediu diversos passaportes para crianças e adolescentes, sem observância das formalidades legais.

      Maria tinha a finalidade de viabilizar a saída dos menores do país. A partir da quantia de dinheiro apreendida na casa de Antônio Lopes, bem como o depósito identificado em sua conta bancária, evidente que ele recebia vantagem indevida para efetuar a liberação dos passaportes. Assim agindo, a denunciada Maria Campos está incursa nas penas do artigo 239, parágrafo único, da Lei n. 8069/90 (Estatuto da Criança e do Adolescente), e nas penas do artigo 333, parágrafo único, c/c o artigo 69, ambos do Código Penal. Já o denunciado Antônio Lopes está incurso nas penas do artigo 239, parágrafo único, da Lei n. 8069/90 (Estatuto da Criança e do Adolescente) e nas penas do artigo 317, § 1º, c/c artigo 69, ambos do Código Penal”.

      O juiz da 15ª Vara Criminal de Porto Alegre, RS, recebeu a denúncia, nos seguintes termos:

      “compulsando os autos, verifico que há prova indiciária suficiente da ocorrência dos fatos descritos na denúncia e do envolvimento dos denunciados. Há justa causa para a ação penal, pelo que recebo a denúncia. Citem-se os réus, na forma da lei”. Antônio foi citado pessoalmente em 27.10.2010 (quarta-feira) e o respectivo mandado foi acostado aos autos dia 01.11.2010 (segunda-feira). Antônio contratou você como Advogado, repassando-lhe nomes de pessoas (Carlos de Tal, residente na Rua 1, n. 10, nesta capital; João de Tal, residente na Rua 4, n. 310, nesta capital; Roberta de Tal, residente na Rua 4, n. 310, nesta capital) que prestariam relevantes informações para corroborar com sua versão.

      Nessa condição, redija a peça processual cabível desenvolvendo TODAS AS TESES DEFENSIVAS que podem ser extraídas do enunciado com indicação de respectivos dispositivos legais. Apresente a peça no último dia do prazo.
    comando: Que tese preliminar deve ser alegada na peça, e com qual fundamento?
    gabarito: "Incompetência da Justiça Estadual: crime de competência federal, art. 109, V (ou IV), da CF."
    opcoes:
      correta: "Incompetência da Justiça Estadual: crime de competência federal, art. 109, V (ou IV), da CF."
      erradas:
        - Prescrição em razão de entre a data do recebimento da denúncia e a manifestação do advogado ter sido ultrapassado o prazo prescricional de 04 anos, já que Gabriela era menor de 21 anos na data dos fatos, devendo o prazo ser computado pela metade. Citação do art. 109, IV E do art. 115 do CP
        - Ilegitimidade/ilicitude da interceptação telefônica por tratar-se de crime apenado com detenção OU por não terem sido esgotados previamente os meios de investigação.
        - "Preliminarmente: Extinção da punibilidade, em razão da prescrição da pretensão punitiva pela pena em abstrato, pois ultrapassados 4 anos desde o recebimento da denúncia, considerando a redução do prazo pela menoridade relativa, com fulcro no Art. 107, IV, do CP OU no Art. 109, IV, c/c Art. 115, ambos do CP."
        - Preliminarmente, nulidade da decisão de pronúncia:.
        - Nulidade decorrente do não oferecimento de proposta de suspensão condicional do processo, tendo em vista que o crime não foi praticado no contexto da violência doméstica e familiar contra mulher ou tendo em vista não ser aplicável a previsão do Art. 41 da Lei nº 11.340 pelo fato de a vítima ser homem.
    revisao: &a1
      status: revisado
