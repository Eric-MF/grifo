        - "Preliminarmente: Extinção da punibilidade, em razão da prescrição da pretensão punitiva pela pena em abstrato, pois ultrapassados 4 anos desde o recebimento da denúncia, considerando a redução do prazo pela menoridade relativa, com fulcro no Art. 107, IV, do CP OU no Art. 109, IV, c/c Art. 115, ambos do CP."
        - Preliminarmente, nulidade da decisão de pronúncia:.
        - Nulidade decorrente do não oferecimento de proposta de suspensão condicional do processo, tendo em vista que o crime não foi praticado no contexto da violência doméstica e familiar contra mulher ou tendo em vista não ser aplicável a previsão do Art. 41 da Lei nº 11.340 pelo fato de a vítima ser homem.
