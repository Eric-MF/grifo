  - id: 36-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      David foi denunciado pela prática do crime de descaminho (Art. 334 do Código Penal), por supostamente ter importado contêiner contendo 1 tonelada de materiais têxteis de procedência estrangeira sem a quitação do imposto de importação devido à União, que soma R$ 750,00 (setecentos e cinquenta reais).

      Na cota que acompanha a denúncia, o Ministério Público Federal se manifestou pelo não oferecimento de proposta de suspensão condicional do processo a David, pois o acusado possui anotação na sua Folha de Antecedentes Criminais (FAC), relativa à condenação definitiva à pena de multa pelo crime de ameaça (Art. 147 do Código Penal).

      Sobre a hipótese apresentada, responda aos itens a seguir.
    comando: Qual é a questão preliminar ao mérito que pode ser invocada pelo Defensor técnico de David no caso concreto? Justifique.
    gabarito: A questão preliminar ao mérito a ser invocada pelo defensor técnico de David é a da necessidade de remessa dos autos à autoridade superior do Ministério Público Federal nos termos da Súmula nº 696 do STF, pois a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do Código Penal.
    opcoes:
      correta: A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Recurso em sentido estrito, art. 581, IV, do CPP; interposição dirigida ao juiz da vara do Tribunal do Júri.
        - "Não foi correta a decisão do Tribunal de Justiça, pois o Tribunal não pode acolher, contra o réu, nulidade não arguida pela acusação em seu recurso. OU Não foi correta a decisão, nos termos do Verbete 160 ou 713 da Súmula do STF. OU Não foi correta a decisão, com base no princípio que veda a reformatio in pejus indireta. Obs.: A justificativa é essencial para a atribuição de pontos."
        - Não é possível a responsabilização penal de Cláudio pelo crime do Art. 154-A do Código Penal, tendo em vista que a lei posterior que de qualquer forma prejudique o acusado não pode retroagir para atingir situação pretérita OU tendo em vista que a lei que tipificou a conduta é posterior à data dos fatos, com base no Art. 5º, inciso XL, da CRFB/88 OU no Art. 1º do Código Penal.
        - Sim. Maria poderá se habilitar como assistente de acusação ou assistente do Ministério Público, na forma do Art. 268 do CPP OU do Art. 271 do CPP
