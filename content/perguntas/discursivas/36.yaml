  - id: 36-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Ana Beatriz foi denunciada pelo Ministério Público pela prática dos crimes de falsificação de documento particular (Art. 298 do CP) e estelionato (Art. 171 do CP), em concurso material (Art. 69 do CP), por ter obtido vantagem patrimonial ilícita às custas da vítima Rita (pessoa civilmente capaz e mentalmente sã, à época com 21 anos de idade), induzindo-a e mantendo-a em erro, mediante meio fraudulento.

      Segundo narra a denúncia, em julho de 2020 Ana Beatriz falsificou bilhete de loteria premiado e o vendeu para Rita por metade do valor do suposto prêmio, alegando urgência em receber valor em espécie para poder custear cirugia da sua filha. Rita, envergonhada, não procurou as autoridades públicas para solicitar a apuração dos fatos.

      A denúncia foi oferecida ao Juízo competente em dezembro de 2020.

      Sobre a hipótese, responda aos itens a seguir.
    comando: Qual é a tese jurídica de mérito que pode ser invocada pela defesa técnica de Ana Beatriz? Justifique.
    gabarito: A tese jurídica de mérito é a ocorrência de consunção, pois o crime-meio de falsificação de documento particular é absorvido pelo crime-fim de estelionato, nos termos da Súmula nº 17 do STJ (“Quando o falso se exaure no estelionato, sem mais potencialidade lesiva, é por este absorvido.”)
    opcoes:
      correta: A tese jurídica de mérito é a ocorrência de consunção, pois o crime-meio de falsificação de documento particular é absorvido pelo crime-fim de estelionato, nos termos da Súmula nº 17 do STJ.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Habeas corpus e agravo em execução penal (0,15 cada).
        - "Mário não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90 por se tratar de novatio legis in pejus OU com base na irretroatividade da lei penal mais gravosa o artigo 2º, § 2º, da Lei 8.072/90 não se aplica a situação de Mário OU a antiga redação do artigo 2º, da Lei 8.072/90 é inconstitucional, razão pela qual a progressão deve ocorrer com base no Art. 112 da LEP, observando o quantum de 1/6 de cumprimento de pena. / Tal entendimento é fundamentado nos verbetes 26 da súmula vinculante do STF ou 471 do STJ. Obs.: A justificativa é essencial para atribuição de pontos."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Houve aberratio criminis OU houve resultado diverso do pretendido, devendo o agente responder apenas pelo crime de lesão corporal culposa, nos termos do Art. 74 do CP.
    revisao: *a1
