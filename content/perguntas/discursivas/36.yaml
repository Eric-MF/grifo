    comando: Que pedido deve ser formulado na peça?
    gabarito: Pedido de nulidade do recebimento da denúncia ou rejeição da denúncia por ausência de justa causa, nos termos do Art. 395, inciso III, do CPP ou Art. 564, inciso III, alínea b, do CPP.
    opcoes:
      correta: Pedido de nulidade do recebimento da denúncia ou rejeição da denúncia por ausência de justa causa, nos termos do Art. 395, inciso III, do CPP ou Art. 564, inciso III, alínea b, do CPP.
      erradas:
        - Requerimento de declaração das nulidades, absolvição sumária e, alternativamente, produção de provas.
        - Reforma da sentença de absolvição sumária;
        - Pedido de retratação.
        - Não provimento do recurso OU manutenção da sentença.
        - "Pedido: Conhecimento e provimento do recurso."
