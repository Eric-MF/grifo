    gabarito: Oferecimento de proposta de suspensão condicional do processo.
    opcoes:
      correta: Oferecimento de proposta de suspensão condicional do processo.
      erradas:
        - Requerimento de declaração das nulidades, absolvição sumária e, alternativamente, produção de provas.
        - "Pedidos (0,50 cada, no mínimo 3, máximo 1,50): redução da pena; mudança de regime; nulidade da prova; afastamento da agravante/causa de aumento."
        - Absolvição do réu, com base no art. 386, III ou VI, do CPP, OU Absolvição do réu por ausência de tipicidade;.
        - Redução do máximo em razão da tentativa.
        - Requerimento do juízo de retratação ou exercício do efeito regressivo, nos termos do Art. 589 do CPP
