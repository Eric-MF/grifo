    gabarito: Nulidade em razão da ausência de exame de corpo de delito, direto ou indireto, nos termos do Art. 158 do CPP.
    opcoes:
      correta: Nulidade em razão da ausência de exame de corpo de delito, direto ou indireto, nos termos do Art. 158 do CPP.
      erradas:
        - "Incompetência da Justiça Estadual: crime de competência federal, art. 109, V (ou IV), da CF."
