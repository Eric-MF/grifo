  - id: 36-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Marcelo, condenado em regime semiaberto, formulou, por meio de sua defesa técnica, pedido de remição de penas em razão de trabalho realizado no curso da execução, o qual é executado mediante supervisão de seu empregador e com autorização do Juiz da Vara de Execuções Penais.

      O Juízo, contudo, indeferiu o pedido, sob o argumento de que Marcelo está em prisão domiciliar, ante a ausência de vagas do regime semiaberto do Estado. Assim, por analogia com o regime aberto, Marcelo não pode usufruir da remição por trabalho, indeferindo o pedido.

      A defesa interpôs Agravo em Execução no prazo de cinco dias da intimação da decisão, o qual foi inadmitido, sob o fundamento de não estar acompanhado das razões respectivas.

      Na qualidade de advogado de Marcelo, responda às perguntas a seguir.
    comando: Qual o recurso cabível contra a decisão do Juiz que inadmitiu o recurso interposto? Justifique.
    gabarito: |-
      A questão envolve conhecimentos de execução penal e de recursos. Nesse sentido, A) Nota-se que a decisão que inadmite o Agravo em Execução desafia Carta Testemunhável, na forma do Art. 639, inciso I, do CPP.

      B) Quanto ao direito material, apenas o regime aberto inadmite a remição de penas por trabalho, sendo inviável, em direito penal, a aplicação de analogia prejudicial ao réu. Assim, conclui-se que há expressa previsão legal de admissibilidade da remissão por trabalho no regime semiaberto, na forma do Art. 126, caput, da LEP, a qual deve ser admitida.
    opcoes:
      correta: Carta testemunhável, na forma do Art. 639, inciso I, do CPP.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Habeas corpus e agravo em execução penal (0,15 cada).
        - "Mário não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90 por se tratar de novatio legis in pejus OU com base na irretroatividade da lei penal mais gravosa o artigo 2º, § 2º, da Lei 8.072/90 não se aplica a situação de Mário OU a antiga redação do artigo 2º, da Lei 8.072/90 é inconstitucional, razão pela qual a progressão deve ocorrer com base no Art. 112 da LEP, observando o quantum de 1/6 de cumprimento de pena. / Tal entendimento é fundamentado nos verbetes 26 da súmula vinculante do STF ou 471 do STJ. Obs.: A justificativa é essencial para atribuição de pontos."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Houve aberratio criminis OU houve resultado diverso do pretendido, devendo o agente responder apenas pelo crime de lesão corporal culposa, nos termos do Art. 74 do CP.
    revisao: *a1
