# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "36"
introducoes:
  peca: "Matheus, nascido em 10/2/2000, tem intolerância ao álcool e só bebia água tônica numa festa de Ano Novo, mas o funcionário do bar lhe entregou por engano um gim-tônica, e um gole o deixou completamente embriagado. Na saída, Caio, seu rival no futebol, riu dele, e Matheus lhe deu uma garrafada na cabeça. Caio disse que levou 15 pontos e ficaria 45 dias sem trabalhar, mas nenhum laudo nem boletim médico sobre as lesões foi juntado. Só com as declarações de Caio, Matheus foi denunciado por lesão corporal grave, e o Ministério Público não ofereceu a suspensão condicional do processo, por causa da pena máxima de 5 anos e de uma condenação definitiva por contravenção penal. Um exame feito na noite do fato atestou a embriaguez completa e a incapacidade total de Matheus. Ele foi citado, e você deve apresentar a defesa."
  q1: "Em julho de 2020, Ana Beatriz falsificou um bilhete de loteria premiado e o vendeu a Rita, de 21 anos e plenamente capaz, pela metade do suposto prêmio. Envergonhada, Rita nunca procurou as autoridades. Em dezembro de 2020, Ana Beatriz foi denunciada por falsificação de documento particular e estelionato, em concurso material."
  q2: "David foi denunciado por descaminho, por ter importado tecidos sem pagar R$ 750 de imposto. O Ministério Público Federal não ofereceu a suspensão condicional do processo porque ele tinha uma condenação definitiva, só à pena de multa, por ameaça."
  q3: "Marcelo, condenado no semiaberto, cumpre prisão domiciliar porque não há vagas no regime e trabalha com autorização do juiz da execução, sob supervisão do empregador. O juiz negou a remição pelo trabalho, por analogia com o regime aberto. A defesa interpôs agravo em execução, mas o juiz não o admitiu, por estar sem as razões."
  q4: "Bruno, Leila, Valter e Vinícius cometeram juntos um crime em 2016. Bruno aceitou a suspensão condicional do processo em 2017; Leila foi condenada definitivamente em 2018 e terminou de cumprir a pena em 2020; Valter foi condenado, mas o acórdão só transitou em julgado em 2022; e Vinícius não foi encontrado, e o processo dele ficou suspenso. Em 2021, os quatro cometeram outro crime, sem violência nem grave ameaça."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["36-peca-1", "36-peca-4-2", "36-peca-6-1", "36-peca-7", "36-peca-8-1", "36-peca-9", "36-q1-b"]
perguntas:
  - id: 36-peca-4-1
    categoria: peca-detalhe
    parte: peca
    item: "4.1"
    secao: pedido
    pergunta: "A denúncia se apoiou só nas declarações de Caio. Que pedido a defesa deve fazer quanto a ela?"
    tese: "Rejeição da denúncia por falta de justa causa"
    aceitos: [ "justa causa" ]
    artigos: [ "art. 395, III, CPP", "art. 564, III, b, CPP" ]
    gabarito: "Pedido de nulidade do recebimento da denúncia ou rejeição da denúncia por ausência de justa causa, nos termos do Art. 395, inciso III, do CPP ou Art. 564, inciso III, alínea b, do CPP."
    revisao: { status: revisado }
  - id: 36-peca-4-3
    categoria: peca-detalhe
    parte: peca
    item: "4.3"
    secao: preliminar
    pergunta: "Por que faltava justa causa para a denúncia por lesão corporal grave?"
    tese: "Nulidade pela falta de exame de corpo de delito, direto ou indireto: o crime deixa vestígios"
    aceitos: [ "exame de corpo de delito | corpo de delito | pericia | vestigio* | materialidade" ]
    artigos: [ "art. 158, CPP" ]
    gabarito: "Nulidade em razão da ausência de exame de corpo de delito, direto ou indireto, nos termos do Art. 158 do CPP."
    revisao: { status: revisado }
  - id: 36-peca-5-2
    categoria: peca-detalhe
    parte: peca
    item: "5.2"
    secao: merito
    pergunta: "O Ministério Público negou a suspensão do processo pela pena máxima de 5 anos. Que tese a defesa deve opor?"
    tese: "Cabimento da suspensão condicional do processo: basta a pena mínima de até 1 ano, ainda que o crime não seja de menor potencial ofensivo"
    aceitos: [ "pena minima" ]
    artigos: [ "art. 89, Lei 9.099" ]
    gabarito: "O sursis processual é admitido mesmo a infração não sendo de menor potencial ofensivo ou relevante é que a pena mínima seja fixada em até 01 ano e não a pena máxima."
    revisao: { status: revisado }
  - id: 36-peca-5-3
    categoria: peca-detalhe
    parte: peca
    item: "5.3"
    secao: merito
    pergunta: "A condenação anterior de Matheus impede a suspensão condicional do processo?"
    tese: "A condenação anterior por contravenção não impede a suspensão condicional do processo: a lei só fala em crime"
    aceitos: [ "nao impede | so fala em crime | so impede por crime | condenacao por crime" ]
    artigos: [ "art. 89, Lei 9.099" ]
    gabarito: "A condenação anterior por contravenção penal não impede a concessão do benefício ou a lei somente proíbe a proposta quando houver condenação por crime."
    revisao: { status: revisado }
  - id: 36-peca-6-2
    categoria: peca-detalhe
    parte: peca
    item: "6.2"
    secao: merito
    pergunta: "Por que Matheus é isento de pena?"
    tese: "Inimputabilidade pela embriaguez completa proveniente de caso fortuito, que isenta de pena"
    aceitos: [ "caso fortuito | forca maior | fortuita | involuntaria" ]
    artigos: [ "art. 28, § 1º, CP" ]
    gabarito: "A embriaguez de Matheus era completa e decorrente de caso fortuito ou força maior, nos termos do Art. 28, §1º, do CP."
    revisao: { status: revisado }
  - id: 36-peca-8-2
    categoria: peca-detalhe
    parte: peca
    item: "8.2"
    secao: pedido
    pergunta: "No mérito, que decisão a defesa deve pedir ao juiz?"
    tese: "Absolvição sumária pela causa de isenção de pena"
    aceitos: [ "absolvicao sumaria | absolvido sumariamente | absolver sumariamente | absolvicao* sumaria*" ]
    artigos: [ "art. 397, II, CPP" ]
    gabarito: "Absolvição sumária, nos termos do Art. 397, inciso II, do CPP."
    revisao: { status: revisado }
  - id: 36-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que tese de mérito a defesa de Ana Beatriz pode invocar?"
    tese: "Consunção: a falsificação, crime-meio, é absorvida pelo estelionato"
    aceitos: [ "consun* | absorcao | absorvid* | absorve" ]
    artigos: [ "Súmula 17 STJ" ]
    gabarito: "A tese jurídica de mérito é a ocorrência de consunção, pois o crime-meio de falsificação de documento particular é absorvido pelo crime-fim de estelionato, nos termos da Súmula nº 17 do STJ (“Quando o falso se exaure no estelionato, sem mais potencialidade lesiva, é por este absorvido.”)"
    revisao: { status: revisado }
  - id: 36-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que tese de mérito a defesa de David pode invocar?"
    tese: "Atipicidade material pela insignificância: o tributo iludido fica muito abaixo do limite de cobrança da Fazenda"
    aceitos: [ "insignifican* | bagatela | atipicidade material" ]
    artigos: [ "art. 20, Lei 10.522" ]
    gabarito: "A tese de mérito a ser invocada pelo defensor técnico de David é a da atipicidade por insignificância da conduta, pois a União está dispensada de ajuizar ações de cobrança de tributos cujo valor esteja aquém do patamar de R$ 20.000.00 (vinte mil reais), com as atualizações efetivadas pelas Portarias nº 75 e 130, ambas do Ministério da Fazenda. Note-se que o valor de R$ 1.000,00 (mil reais) segue insignificante, se considerarmos o valor previsto no Art. 20, § 2º, da Lei nº 10.522/02."
    revisao: { status: revisado }
  - id: 36-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que questão preliminar a defesa de David pode invocar?"
    tese: "A condenação anterior só à pena de multa não impede a suspensão condicional do processo, e a recusa deve ir ao órgão superior do Ministério Público"
    aceitos: [ "orgao superior | procurador-geral | procurador geral | camara de coordenacao | nao impede" ]
    artigos: [ "Súmula 696 STF", "art. 77, § 1º, CP", "art. 89, Lei 9.099" ]
    gabarito: "A questão preliminar ao mérito a ser invocada pelo defensor técnico de David é a da necessidade de remessa dos autos à autoridade superior do Ministério Público Federal nos termos da Súmula nº 696 do STF, pois a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do Código Penal."
    revisao: { status: revisado }
  - id: 36-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que recurso cabe contra a decisão que não admitiu o agravo em execução?"
    tese: "Carta testemunhável contra a decisão que não admitiu o recurso"
    aceitos: [ "carta testemunhavel" ]
    artigos: [ "art. 639, I, CPP" ]
    gabarito: "A questão envolve conhecimentos de execução penal e de recursos. Nesse sentido, A) Nota-se que a decisão que inadmite o Agravo em Execução desafia Carta Testemunhável, na forma do Art. 639, inciso I, do CPP.\n\nB) Quanto ao direito material, apenas o regime aberto inadmite a remição de penas por trabalho, sendo inviável, em direito penal, a aplicação de analogia prejudicial ao réu. Assim, conclui-se que há expressa previsão legal de admissibilidade da remissão por trabalho no regime semiaberto, na forma do Art. 126, caput, da LEP, a qual deve ser admitida."
    revisao: { status: revisado }
  - id: 36-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que direito material Marcelo deve pleitear?"
    tese: "Direito à remição pelo trabalho no semiaberto, mesmo em prisão domiciliar: a analogia in malam partem é proibida"
    aceitos: [ "direito a remicao | direito de remir | pode remir | in malam partem | analogia prejudicial | analogia contra o reu" ]
    artigos: [ "art. 126, § 9º, LEP", "art. 126, LEP" ]
    gabarito: "Quanto ao direito material, apenas o regime aberto inadmite a remição de penas por trabalho, sendo inviável, em direito penal, a aplicação de analogia prejudicial ao réu. Assim, conclui-se que há expressa previsão legal de admissibilidade da remissão por trabalho no regime semiaberto, na forma do Art. 126, caput, da LEP, a qual deve ser admitida."
    revisao: { status: revisado }
  - id: 36-q4-a
    categoria: discursiva
    parte: q4
    item: "A1"
    pergunta: "Por que Bruno não pode receber o acordo de não persecução penal pelo novo crime?"
    tese: "Vedação do acordo de não persecução penal para quem recebeu a suspensão condicional do processo nos 5 anos anteriores"
    aceitos: [ "5 anos | cinco anos | quinquenio | ultimos 5 anos" ]
    artigos: [ "art. 28-A, § 2º, III, CPP" ]
    gabarito: "Assim, em vista de tais informações, certo é que apenas Leila e Bruno estão impedidos de se beneficiar de Acordo de Não Persecução Penal, devendo ser mencionado o Art. 28-A, § 2º, incisos II e III, respectivamente, do CPP."
    revisao: { status: revisado }
  - id: 36-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Valter foi condenado definitivamente só em 2022. Isso impede o regime aberto pelo novo crime?"
    tese: "Valter não é reincidente: o trânsito em julgado veio depois do novo crime, e cabe o regime aberto"
    aceitos: [ "nao e reincidente | nao reincidente | nao ha reincidencia | primario" ]
    artigos: [ "art. 33, § 2º, c, CP", "art. 63, CP" ]
    gabarito: "Quanto a questão material, apenas Leila é reincidente, incidindo na obrigatoriedade de regime inicial, ao menos, semiaberto. Todos os demais podem, em tese, serem beneficiados com o regime aberto, pois considerados primários. Art. 33, § 2º, alínea c, do CP."
    revisao: { status: revisado }
