  - id: 36-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      David foi denunciado pela prática do crime de descaminho (Art. 334 do Código Penal), por supostamente ter importado contêiner contendo 1 tonelada de materiais têxteis de procedência estrangeira sem a quitação do imposto de importação devido à União, que soma R$ 750,00 (setecentos e cinquenta reais).

      Na cota que acompanha a denúncia, o Ministério Público Federal se manifestou pelo não oferecimento de proposta de suspensão condicional do processo a David, pois o acusado possui anotação na sua Folha de Antecedentes Criminais (FAC), relativa à condenação definitiva à pena de multa pelo crime de ameaça (Art. 147 do Código Penal).

      Sobre a hipótese apresentada, responda aos itens a seguir.
    comando: Qual é a tese de mérito que pode ser invocada pelo Defensor técnico de David no caso concreto? Justifique.
    gabarito: A tese de mérito a ser invocada pelo defensor técnico de David é a da atipicidade por insignificância da conduta, pois a União está dispensada de ajuizar ações de cobrança de tributos cujo valor esteja aquém do patamar de R$ 20.000.00 (vinte mil reais), com as atualizações efetivadas pelas Portarias nº 75 e 130, ambas do Ministério da Fazenda. Note-se que o valor de R$ 1.000,00 (mil reais) segue insignificante, se considerarmos o valor previsto no Art. 20, § 2º, da Lei nº 10.522/02.
    opcoes:
      correta: A tese de mérito é a da atipicidade por insignificância da conduta, pois a União está dispensada de ajuizar ações de cobrança de tributos cujo valor esteja aquém do patamar de R$ 20.000.00 (vinte mil reais), com as atualizações efetivadas pelas Portarias nº 75 e 130, ambas do Ministério da Fazenda ou R$ 1.000,00 (mil reais) nos termos do Art. 20, § 2º, da Lei nº 10.522/02.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Habeas corpus e agravo em execução penal (0,15 cada).
        - "Mário não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90 por se tratar de novatio legis in pejus OU com base na irretroatividade da lei penal mais gravosa o artigo 2º, § 2º, da Lei 8.072/90 não se aplica a situação de Mário OU a antiga redação do artigo 2º, da Lei 8.072/90 é inconstitucional, razão pela qual a progressão deve ocorrer com base no Art. 112 da LEP, observando o quantum de 1/6 de cumprimento de pena. / Tal entendimento é fundamentado nos verbetes 26 da súmula vinculante do STF ou 471 do STJ. Obs.: A justificativa é essencial para atribuição de pontos."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Houve aberratio criminis OU houve resultado diverso do pretendido, devendo o agente responder apenas pelo crime de lesão corporal culposa, nos termos do Art. 74 do CP.
