    caso: |-
      Juntos, Bruno, Leila, Valter e Vinícius cometeram determinado ilícito em 2016.

      O processo veio a ser desmembrado, de forma que Bruno aceitou a suspensão condicional do processo, em 2017;

      Leila foi condenada, definitivamente, em 2018, tendo terminado de cumprir a sua condenação em 2020; Valter foi condenado em primeira instância, porém, interpôs recurso, vindo a transitar em julgado o acórdão condenatório em 2022; e Vinícius, por sua vez, não foi encontrado para ser citado, tendo o processo sido suspenso, assim como o prazo prescricional, na forma do Art. 366 do CPP.

      Em 2021, os amigos se reúnem e praticam novo ilícito penal, sem violência ou grave ameaça à pessoa.

      Na qualidade de advogado de todos eles, responda às questões a seguir.
    comando: À vista dos antecedentes criminais mencionados, e considerando preenchidos todos os demais requisitos legais, há algum acusado(s) impedido(s) de se beneficiar, em tese, de oferta de acordo de não persecução penal? justifique.
    gabarito: Assim, em vista de tais informações, certo é que apenas Leila e Bruno estão impedidos de se beneficiar de Acordo de Não Persecução Penal, devendo ser mencionado o Art. 28-A, § 2º, incisos II e III, respectivamente, do CPP.
    opcoes:
      correta: Bruno, em razão de ter celebrado suspensão condicional do processo no quinquênio antecedente, na forma do Art. 28-A, § 2º, inciso III, do CPP. Leila, por ser tecnicamente reincidente na forma do Art. 28-A, § 2º, inciso II, do CPP.
