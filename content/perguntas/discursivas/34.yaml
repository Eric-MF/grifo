  - id: 34-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      Carla, funcionária de determinado estabelecimento comercial, inseriu, em documento particular, informação falsa acerca da data de determinado serviço que teria sido prestado pela empresa, em busca de prejudicar direito de terceiro, sendo realmente a inserção da informação de sua responsabilidade. Descobertos os fatos pelo superior hieráquico de Carla, foi apresentada notitia criminis em desfavor da funcionária, que veio a ser denunciada como incursa nas sanções penais do Art. 298 do Código Penal (falsificação de documento particular).

      No momento da citação, o Oficial de Justiça compareceu ao endereço fornecido pelo Ministério Público, sendo que constatou, na primeira vez que foi ao local, que Carla lá residia, mas que estava se ocultando para não ser citada.

      Diante disso, certificou tal fato e foi determinada a citação por edital pelo magistrado. Carla é informada do teor do edital por uma amiga que trabalhava no Tribunal de Justiça e procura você, como advogado(a), para prestar assistência jurídica.

      Responda, na condição de advogado(a) de Carla, considerando apenas as informações expostas, aos seguintes questionamentos.
    comando: Qual o argumento de direito material a ser apresentado para questionar a capitulação delitiva? Justifique.
    gabarito: |-
      O argumento é no sentido de que houve crime de falsidade ideológica, previsto no Art. 299 do CP, e que tem a pena mais branda do que o crime imputado. O documento é falso em relação ao seu conteúdo e não em relação à sua forma. Não houve falsificação de documento particular, com sua alteração ou elaboração por quem não deveria. Pelo contrário, Carla era responsável por preencher o documento, que, quanto à forma, era hígido.

      Todavia, inseriu informação falsa em seu conteúdo para prejudicar direito de terceiro, o que tipifica a conduta de falsidade ideológica.
    opcoes:
      correta: O argumento é o de que o crime praticado por Carla foi de falsidade ideológica, com inserção de conteúdo falseado, e não falsificação de documento particular, tendo em vista que inseriu informação falsa em documento verdadeiro quanto à sua forma, nos termos do Art. 299 do CP.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
