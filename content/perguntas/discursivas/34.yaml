  - id: 34-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Flávio figurava como indiciado em procedimento em que se investigava a prática do crime de concussão. Após não mais ter disponíveis outros meios de investigação, o Ministério Público formulou requerimento de interceptação das conversas telefônicas de Flávio, sendo o pedido deferido pela autoridade judicial pelo prazo de 10 dias.

      No período interceptado, todas as conversas de Flávio foram transcritas. Em uma das conversas interceptadas, Flávio mantinha contato com seu advogado João e confessava a autoria do crime de concussão, solicitando orientação jurídica, sendo possível perceber que João não teria qualquer conhecimento anterior sobre aquela prática delitiva. A partir do teor das transcrições das conversas de Flávio, o Ministério Público ofereceu denúncia em desfavor do mesmo, imputando-lhe a prática do crime previsto no Art. 316 do Código Penal.

      Ao tomar conhecimento da denúncia, Flávio contata seu advogado, que tem acesso ao procedimento, inclusive ao teor das transcrições obtidas a partir da interceptação das conversas telefônicas. Durante a instrução, após requerimento do Ministério Público, o juiz determina, sem anuência do acusado e de sua defesa técnica, que seja realizada perícia de voz em Flávio para confirmar que ele seria um dos interlocutores da conversa, intimando-o para apresentar gravação a servir de paradigma para o exame.

      Considerando apenas as informações expostas, responda, na condição de advogado(a) de Flávio, aos itens a seguir.
    comando: Qual o argumento a ser apresentado para questionar a prova obtida a partir da interceptação das comunicações telefônicas? Justifique.
    gabarito: O argumento é de que a prova é ilícita, pois não poderia ter havido transcrição das conversas travadas entre o investigado e sua defesa técnica. O crime investigado é punido com pena de reclusão; havia indícios de autoria, tanto que Flávio figurava como indiciado; e não havia outros meios investigatórios para obtenção da prova. O prazo fixado pela autoridade judicial também está dentro do autorizado pela lei. Ocorre que, apesar de a interceptação em si ser válida, de acordo com a jurisprudência dos Tribunais Superiores, não pode haver transcrição, ou seja, a conversa travada entre o investigado e seu advogado não poderá ser utilizada como meio de prova, quando este não for alvo da investigação. Ademais, não estava o advogado praticando novo crime com seu cliente, mas tão só prestando assistência jurídica, de modo que o sigilo na relação advogado-cliente deverá ser resguardado. A garantia do sigilo das comunicações entre advogado e cliente não confere imunidade para a prática de crimes no exercício da advocacia, o que não ocorreu na hipótese. No mesmo sentido, a previsão do Art. 7º, incisos II e III, da Lei nº 8.906/94 ou Art. 157 caput do CPP ou Art. 5º, inciso LVI da CRFB/88.
    opcoes:
      correta: O argumento é de que a prova é ilícita, tendo em vista que não poderia ter havido transcrição da conversa travada entre Flávio e seu advogado, que tem direito ao sigilo ou inviolabilidade das comunicações, não sendo o advogado coautor de crimes e nem figurando como investigado, nos termos do Art. 7º, inciso II ou III, da Lei nº 8.906/94 ou Art. 157 caput do CPP ou Art. 5º, inciso LVI da CRFB/88.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
  - id: 34-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Flávio figurava como indiciado em procedimento em que se investigava a prática do crime de concussão. Após não mais ter disponíveis outros meios de investigação, o Ministério Público formulou requerimento de interceptação das conversas telefônicas de Flávio, sendo o pedido deferido pela autoridade judicial pelo prazo de 10 dias.

      No período interceptado, todas as conversas de Flávio foram transcritas. Em uma das conversas interceptadas, Flávio mantinha contato com seu advogado João e confessava a autoria do crime de concussão, solicitando orientação jurídica, sendo possível perceber que João não teria qualquer conhecimento anterior sobre aquela prática delitiva. A partir do teor das transcrições das conversas de Flávio, o Ministério Público ofereceu denúncia em desfavor do mesmo, imputando-lhe a prática do crime previsto no Art. 316 do Código Penal.

      Ao tomar conhecimento da denúncia, Flávio contata seu advogado, que tem acesso ao procedimento, inclusive ao teor das transcrições obtidas a partir da interceptação das conversas telefônicas. Durante a instrução, após requerimento do Ministério Público, o juiz determina, sem anuência do acusado e de sua defesa técnica, que seja realizada perícia de voz em Flávio para confirmar que ele seria um dos interlocutores da conversa, intimando-o para apresentar gravação a servir de paradigma para o exame.

      Considerando apenas as informações expostas, responda, na condição de advogado(a) de Flávio, aos itens a seguir.
    comando: "Existe argumento a ser apresentado para questionar a decisão do magistrado que determinou a realização da perícia de voz, com apresentação de gravação que servisse de paradigma à perícia? Justifique. (Valor:"
    gabarito: Não poderia o magistrado ter determinado a realização de perícia de voz em Flávio, sem a sua concordância, tendo em vista que ninguém é obrigado a produzir prova contra si. O princípio do nemo tenetur se detegere tem previsão não apenas na legislação nacional, mas também em tratados internacionais, sendo direito relevante de todo aquele que figure como réu ou investigado. Sempre que a prova depender de uma participação ou contribuição positiva do réu, esta somente poderá ser determinada se houver concordância do acusado, sob pena de violação ao princípio supramencionado. Considerando que Flávio não concordou em se submeter à perícia de voz e, ainda, considerando que tal exame dependeria do fornecimento de sua voz para padrão de comparação, não poderia o magistrado ter imposto a produção da prova, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    opcoes:
      correta: Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
  - id: 34-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Carla, funcionária de determinado estabelecimento comercial, inseriu, em documento particular, informação falsa acerca da data de determinado serviço que teria sido prestado pela empresa, em busca de prejudicar direito de terceiro, sendo realmente a inserção da informação de sua responsabilidade. Descobertos os fatos pelo superior hieráquico de Carla, foi apresentada notitia criminis em desfavor da funcionária, que veio a ser denunciada como incursa nas sanções penais do Art. 298 do Código Penal (falsificação de documento particular).

      No momento da citação, o Oficial de Justiça compareceu ao endereço fornecido pelo Ministério Público, sendo que constatou, na primeira vez que foi ao local, que Carla lá residia, mas que estava se ocultando para não ser citada.

      Diante disso, certificou tal fato e foi determinada a citação por edital pelo magistrado. Carla é informada do teor do edital por uma amiga que trabalhava no Tribunal de Justiça e procura você, como advogado(a), para prestar assistência jurídica.

      Responda, na condição de advogado(a) de Carla, considerando apenas as informações expostas, aos seguintes questionamentos.
    comando: A citação de Carla foi realizada de forma válida? Justifique.
    gabarito: A citação de Carla não foi válida, pois a citação por edital é cabível quando o denunciado está em local incerto e não sabido, o que não é o caso, tendo em vista que o oficial de justiça confirmou que Carla residia no endereço informado pelo Ministério Público, apenas alegando que ela estava se ocultando para não ser citada. Em tese, estando se ocultando, pode ocorrer a citação com hora certa, prevista no Art. 362 do CPP, mas, para tanto, deve o Oficial de Justiça comparecer mais vezes ao local, na tentativa de citar a ré.
    opcoes:
      correta: Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
