# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "34"
introducoes:
  peca: "Rodrigo foi denunciado no júri por homicídio simples, com o aumento por não ter prestado socorro à vítima: numa boate, deu um soco na barriga de João e o empurrou, e João caiu sobre a garrafa que segurava e morreu do corte. Câmeras mostraram que um desconhecido pôs, às escondidas, uma droga na bebida de Rodrigo, e o laudo do hospital atestou que ele estava completamente embriagado e inteiramente incapaz de entender o caráter ilícito do fato; ele não quis nem aceitou a morte. Como os policiais arrolados pela acusação se atrasariam, o juiz ouviu primeiro as testemunhas de defesa, apesar do protesto. As provas confirmaram a versão de Rodrigo, mas o juiz o pronunciou nos termos da denúncia. Você foi intimado da pronúncia."
  q1: "Geraldo obrigou Eugênia, com grave ameaça, a transferir R$ 2.000 para a conta dele. No dia seguinte, antes da denúncia, arrependido, devolveu todo o valor. Na audiência, com Geraldo sentado na sala, Eugênia só apontou para ele e disse que era o autor, porque não havia policiais para levá-lo à sala de reconhecimento; as outras testemunhas não viram o fato. Com base nisso, ele foi condenado por extorsão a 4 anos e 3 meses, sem atenuantes."
  q2: "Flávio, investigado por concussão, teve o telefone interceptado por 10 dias com autorização judicial. Todas as conversas foram transcritas, inclusive uma com o advogado dele, em que confessava o crime e pedia orientação; o advogado não sabia de nada antes. Com base nessas transcrições, Flávio foi denunciado. Na instrução, o juiz mandou, sem a concordância da defesa, que ele fornecesse uma gravação da própria voz para uma perícia."
  q3: "Carla inseriu, num documento particular verdadeiro, uma data falsa de um serviço da empresa, para prejudicar terceiro, e foi denunciada por falsificação de documento particular. Na primeira ida à casa dela, o oficial de justiça certificou que ela morava ali, mas se ocultava, e o juiz mandou citá-la por edital."
  q4: "Renato e Abel, sócios de uma farmácia, foram denunciados por expor à venda um lote de fitoterápicos corrompido. A vigilância sanitária apreendeu os frascos e achou um aviso do fabricante pedindo o recolhimento do lote, mas o gerente disse que não abriu a carta nem avisou ninguém. A corrupção do medicamento foi demonstrada só por documentos do laboratório do fabricante. Os sócios disseram desconhecer qualquer problema e foram condenados à pena mínima de 10 anos."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["34-peca-1", "34-peca-4", "34-peca-5", "34-peca-9"]
perguntas:
  - id: 34-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: pedido
    pergunta: "Ao interpor o recurso contra a pronúncia, o que a defesa deve pedir ao próprio juiz?"
    tese: "Juízo de retratação: o juiz pode reformar a pronúncia ao receber o recurso em sentido estrito"
    aceitos: [ "retrata* | efeito regressivo | reconsidera*" ]
    artigos: [ "art. 589, CPP" ]
    gabarito: "Requerimento do juízo de retratação ou exercício do efeito regressivo, nos termos do Art. 589 do CPP"
    revisao: { status: revisado }
  - id: 34-peca-5-1
    categoria: peca-detalhe
    parte: peca
    item: "5.1"
    secao: merito
    pergunta: "Que preliminar a defesa deve levantar quanto à audiência?"
    tese: "Nulidade da instrução pela inversão da ordem de oitiva: as testemunhas de defesa foram ouvidas antes das de acusação"
    aceitos: [ "inver* | ordem | nulidade | nula | nulo" ]
    artigos: [ "art. 411, CPP", "art. 564, IV, CPP", "art. 5, LV, CRFB" ]
    gabarito: "Houve inadequada inversão da ordem de oitiva das testemunhas ou as testemunhas de defesa foram ouvidas antes das testemunhas de acusação, em desrespeito à previsão do Art. 411 do CPP"
    revisao: { status: revisado }
  - id: 34-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "No mérito, que decisão a defesa deve pedir no lugar da pronúncia?"
    tese: "Absolvição sumária pela isenção de pena"
    aceitos: [ "absolvicao sumaria | absolvido sumariamente | absolver sumariamente | absolvicao* sumaria*" ]
    artigos: [ "art. 415, IV, CPP" ]
    gabarito: "No mérito, pedido de absolvição sumária, diante da manifesta causa de isenção de pena ou excludente de culpabilidade, nos termos do Art. 415, inciso IV, do CPP"
    revisao: { status: revisado }
  - id: 34-peca-6-1
    categoria: peca-detalhe
    parte: peca
    item: "6.1"
    secao: merito
    pergunta: "Por que Rodrigo é isento de pena?"
    tese: "Inimputabilidade pela embriaguez completa proveniente de caso fortuito, que isenta de pena"
    aceitos: [ "caso fortuito | forca maior | fortuita | involuntaria | inimputab*" ]
    artigos: [ "art. 28, § 1º, CP" ]
    gabarito: "A imputabilidade penal restou afastada em razão da embriaguez, que foi completa, decorrente de caso fortuito ou força maior, e que tornou o réu inteiramente incapaz de entender o caráter ilícito do fato, conforme o Art. 28, §1º, do CP"
    revisao: { status: revisado }
  - id: 34-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Subsidiariamente, que decisão a defesa deve pedir, já que Rodrigo não quis matar?"
    tese: "Desclassificação para crime não doloso contra a vida: Rodrigo quis lesionar, não matar"
    aceitos: [ "desclassifica*" ]
    artigos: [ "art. 419, CPP" ]
    gabarito: "Subsidiariamente, desclassificação para crime não doloso contra a vida, nos termos do Art. 419 do CPP, pois Rodrigo pretendia desferir um soco na barriga da vítima e um empurrão, tendo apenas intenção de causar lesão, mas não o resultado morte ou houve dolo na lesão e culpa em relação ao resultado morte"
    revisao: { status: revisado }
  - id: 34-peca-7-1
    categoria: peca-detalhe
    parte: peca
    item: "7.1"
    secao: merito
    pergunta: "Afastada a inimputabilidade, por qual crime Rodrigo deveria responder?"
    tese: "Lesão corporal seguida de morte: dolo na lesão e culpa no resultado morte"
    aceitos: [ "lesao corporal seguida de morte | lesao corporal seguida da morte | lesao corporal com resultado morte | preterdolo* | preterintencional" ]
    artigos: [ "art. 129, § 3º, CP" ]
    gabarito: "Deveria Rodrigo responder, caso reconhecida a imputabilidade, pelo crime de lesão corporal seguida da morte, previsto no Art. 129, §3º, do CP"
    revisao: { status: revisado }
  - id: 34-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Que tese a defesa deve sustentar quanto à causa de aumento da denúncia?"
    tese: "Afastamento da causa de aumento da omissão de socorro, que só vale no homicídio culposo"
    aceitos: [ [ "afast* | exclu* | decote | nao incid* | nao se aplica", "aumento | majorante" ], [ "so no culposo | so ao culposo | apenas no culposo | somente no culposo | homicidio culposo" ] ]
    artigos: [ "art. 121, § 4º, CP" ]
    gabarito: "Ainda de maneira subsidiária, afastamento da causa de aumento imputada na denúncia, tendo em vista que somente aplicável ao homicídio culposo ou tendo em vista que foi imputada a prática do crime de homicídio doloso"
    revisao: { status: revisado }
  - id: 34-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento processual contesta a prova produzida na audiência?"
    tese: "Nulidade do reconhecimento pessoal, feito sem as formalidades legais"
    aceitos: [ "formalidade* | nulidade | nulo | nula | invalid* | ilicit*" ]
    artigos: [ "art. 226, CPP" ]
    gabarito: "O argumento de direito processual é o de que a produção de provas não foi integralmente válida, tendo em vista que o reconhecimento do réu não foi realizado observando as formalidades legais. De acordo com o Art. 226 do CPP, o reconhecimento, em sendo possível, deverá ser realizado na presença de outras pessoas com características semelhantes àquelas da pessoa a ser reconhecida. No caso, o reconhecimento foi na própria sala de audiência, apenas com o réu presente na condição de preso, então claramente foi viciado. Dessa forma, aquela prova não poderia ser considerada na sentença condenatória. Havia outros presos disponíveis para serem colocados ao lado do denunciado em sala especial para reconhecimento, não sendo o argumento de economia suficiente para afastar as exigências legais."
    revisao: { status: revisado }
  - id: 34-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Mantida a condenação, que argumento de direito material reduz a pena de Geraldo?"
    tese: "Atenuante da reparação do dano antes do julgamento"
    aceitos: [ "repar*" ]
    artigos: [ "art. 65, III, b, CP" ]
    gabarito: "O argumento é o de que deveria ter sido reconhecida a atenuante da reparação do dano, prevista no Art. 65, inciso III, alínea b, do CP. De acordo com o enunciado, antes mesmo do oferecimento da denúncia, logo após a prática delitiva, o autor do fato procurou minorar as consequências de seu ato e reparou o dano, de modo que aplicável a atenuante antes mencionada. Não haveria de se falar em tentativa a justificar o reconhecimento de causa de diminuição de pena, já que o crime se consumou por ocasião do constrangimento. Ademais, mesmo a reparação tendo ocorrido antes do oferecimento da denúncia, não caberia aplicação da causa de diminuição de pena do arrependimento posterior, prevista no Art. 16 do Código Penal, pois o crime foi praticado com grave ameaça à pessoa."
    revisao: { status: revisado }
  - id: 34-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que argumento contesta a prova obtida na interceptação?"
    tese: "Ilicitude da prova: a conversa entre o investigado e seu advogado é sigilosa e não podia ser transcrita nem usada"
    aceitos: [ "ilicit* | sigilo | inviolabilidade | prerrogativa" ]
    artigos: [ "art. 7, II, Lei 8.906", "art. 157, CPP" ]
    gabarito: "O argumento é de que a prova é ilícita, pois não poderia ter havido transcrição das conversas travadas entre o investigado e sua defesa técnica. O crime investigado é punido com pena de reclusão; havia indícios de autoria, tanto que Flávio figurava como indiciado; e não havia outros meios investigatórios para obtenção da prova. O prazo fixado pela autoridade judicial também está dentro do autorizado pela lei. Ocorre que, apesar de a interceptação em si ser válida, de acordo com a jurisprudência dos Tribunais Superiores, não pode haver transcrição, ou seja, a conversa travada entre o investigado e seu advogado não poderá ser utilizada como meio de prova, quando este não for alvo da investigação. Ademais, não estava o advogado praticando novo crime com seu cliente, mas tão só prestando assistência jurídica, de modo que o sigilo na relação advogado-cliente deverá ser resguardado. A garantia do sigilo das comunicações entre advogado e cliente não confere imunidade para a prática de crimes no exercício da advocacia, o que não ocorreu na hipótese. No mesmo sentido, a previsão do Art. 7º, incisos II e III, da Lei nº 8.906/94 ou Art. 157 caput do CPP ou Art. 5º, inciso LVI da CRFB/88."
    revisao: { status: revisado }
  - id: 34-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que argumento contesta a ordem para Flávio fornecer a própria voz para a perícia?"
    tese: "Violação do direito de não produzir prova contra si mesmo: o réu não pode ser obrigado a fornecer a voz para a perícia"
    aceitos: [ "produzir prova contra si | nemo tenetur | autoincrimina* | nao autoincriminacao" ]
    artigos: [ "art. 5, LXIII, CRFB" ]
    gabarito: "Não poderia o magistrado ter determinado a realização de perícia de voz em Flávio, sem a sua concordância, tendo em vista que ninguém é obrigado a produzir prova contra si. O princípio do nemo tenetur se detegere tem previsão não apenas na legislação nacional, mas também em tratados internacionais, sendo direito relevante de todo aquele que figure como réu ou investigado. Sempre que a prova depender de uma participação ou contribuição positiva do réu, esta somente poderá ser determinada se houver concordância do acusado, sob pena de violação ao princípio supramencionado. Considerando que Flávio não concordou em se submeter à perícia de voz e, ainda, considerando que tal exame dependeria do fornecimento de sua voz para padrão de comparação, não poderia o magistrado ter imposto a produção da prova, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992."
    revisao: { status: revisado }
  - id: 34-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "A citação de Carla foi válida?"
    tese: "Nulidade da citação por edital: quem tem endereço conhecido e se oculta deve ser citado por hora certa"
    aceitos: [ "hora certa | nula | nulidade | invalid*" ]
    artigos: [ "art. 362, CPP", "art. 361, CPP" ]
    gabarito: "A citação de Carla não foi válida, pois a citação por edital é cabível quando o denunciado está em local incerto e não sabido, o que não é o caso, tendo em vista que o oficial de justiça confirmou que Carla residia no endereço informado pelo Ministério Público, apenas alegando que ela estava se ocultando para não ser citada. Em tese, estando se ocultando, pode ocorrer a citação com hora certa, prevista no Art. 362 do CPP, mas, para tanto, deve o Oficial de Justiça comparecer mais vezes ao local, na tentativa de citar a ré."
    revisao: { status: revisado }
  - id: 34-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que argumento de direito material contesta a capitulação do crime de Carla?"
    tese: "Desclassificação para falsidade ideológica: a informação falsa foi inserida num documento verdadeiro na forma"
    aceitos: [ "falsidade ideologica" ]
    artigos: [ "art. 299, CP" ]
    gabarito: "O argumento é no sentido de que houve crime de falsidade ideológica, previsto no Art. 299 do CP, e que tem a pena mais branda do que o crime imputado. O documento é falso em relação ao seu conteúdo e não em relação à sua forma. Não houve falsificação de documento particular, com sua alteração ou elaboração por quem não deveria. Pelo contrário, Carla era responsável por preencher o documento, que, quanto à forma, era hígido.\n\nTodavia, inseriu informação falsa em seu conteúdo para prejudicar direito de terceiro, o que tipifica a conduta de falsidade ideológica."
    revisao: { status: revisado }
  - id: 34-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que preliminar processual a defesa pode sustentar na apelação?"
    tese: "Nulidade pela falta de exame pericial: o crime deixa vestígios, e a perícia dos medicamentos apreendidos era indispensável"
    aceitos: [ "pericia | exame pericial | exame de corpo de delito | vestigio*" ]
    artigos: [ "art. 158, CPP", "art. 564, III, b, CPP" ]
    gabarito: "Como se trata de crime que deixa vestígio, seria necessária a realização de exame pericial dos medicamentos apreendidos – Art. 158 do CPP, sendo esse um ônus da acusação. Essa diligência também poderia ter sido determinada de ofício e supletivamente pelo juiz – Art. 156 e inciso II do CPP."
    revisao: { status: revisado }
  - id: 34-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que tese de direito material leva à absolvição de Renato e Abel?"
    tese: "Absolvição por falta de dolo: os sócios não sabiam que o lote estava corrompido (erro de tipo)"
    aceitos: [ "erro de tipo | falta de dolo | ausencia de dolo | sem dolo | nao sabiam | atipic*" ]
    artigos: [ "art. 20, CP", "art. 386, III, CPP" ]
    gabarito: "Não houve comprovação do crime por falta de prova pericial, os documentos laboratoriais do fabricante não servem para a condenação, sendo o caso de absolvição dos recorrentes. Cabendo ainda absolvição por não estar provado que os recorrentes concorreram quer culposa ou dolosamente para a prática da infração penal. Ainda podemos entender que os recorrentes incorreram em erro de tipo ocasionando o reconhecimento da atipicidade de conduta.\n\nExistem vários dados no enunciado que reforçam as teses dentre eles: o aviso do fabricante era desconhecido dos apelantes ou de qualquer outro funcionário, posto que a correspondência não foi entregue ao farmacêutico da loja e nem sequer foi aberta.\n\nAcresça-se ainda que nenhum consumidor que adquiriu o medicamento do lote de fabricação UR031FT-PLANT fez qualquer reclamação, tendo sido vendidas 15 (quinze) unidades. Conforme o Art. 386, inciso III, IV ou V, do CPP ou Art. 20, caput do CP."
    revisao: { status: revisado }
