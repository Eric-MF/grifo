    gabarito: Requerimento do juízo de retratação ou exercício do efeito regressivo, nos termos do Art. 589 do CPP
    opcoes:
      correta: Requerimento do juízo de retratação ou exercício do efeito regressivo, nos termos do Art. 589 do CPP
      erradas:
        - "Pedido de reconsideração ao juiz de 1º grau e indicação da norma: art. 589, parágrafo único, CPP."
        - Absolvição por falta de provas OU por não haver prova da existência do fato.
        - "Pedidos: Absolvição, na forma do Art. 386, inciso VI, do CPP"
        - Não provimento do recurso OU manutenção da sentença.
        - Pedido de retratação, na forma do Art. 589 do CPP.
