    comando: Que tese preliminar deve ser alegada na peça, e com qual fundamento?
    gabarito: Preliminarmente, nulidade da pronúncia ou nulidade da instrução, por violação ao princípio da ampla defesa e contraditório ou devido processo legal, nos termos do Art. 5º, inciso LIV ou LV, da CRFB/88 ou do Art. 564, inciso IV, do CPP
    opcoes:
      correta: Preliminarmente, nulidade da pronúncia ou nulidade da instrução, por violação ao princípio da ampla defesa e contraditório ou devido processo legal, nos termos do Art. 5º, inciso LIV ou LV, da CRFB/88 ou do Art. 564, inciso IV, do CPP
      erradas:
        - Ilegitimidade/ilicitude da interceptação telefônica por tratar-se de crime apenado com detenção OU por não terem sido esgotados previamente os meios de investigação.
        - "Prescrição da pretensão punitiva: pena máxima de 4 anos prescreve em 8, mas a ré era menor de 21 anos e o prazo corre pela metade (CP, arts. 109, IV, 115 e 126)."
        - Extinção da punibilidade pela decadência do direito de representação.
        - Preliminarmente, deve ser requerido o reconhecimento da nulidade do ato de citação, nos termos do art. 564, inciso III, “e”, do CPP
        - Preliminarmente, nulidade na oitiva das vítimas, tendo em vista que o mero decurso de tempo não é fundamento idôneo para produção antecipada de provas, nos termos do Art. 225 do CPP, ou Art. 564, inciso IV, do CPP, ou Súmula 455 do STJ.
