        - Subsidiariamente, aplicação da suspensão condicional da pena, tendo em vista que a pena aplicada foi inferior a 4 anos e o réu era maior de 70 anos OU em razão do sursis etário, nos termos do Art. 77, §2º, do Código Penal
        - Afastamento da agravante do Art. 61, inciso II, alínea d (ou b), do CP, pois a situação de perigo comum é elementar do tipo imputado ou por configurar bis in idem ou por não haver a intenção de ocultação, vantagem ou impunidade de outro crime.
    revisao: *a1
  - id: 34-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: pedido
    caso: |-
      Rodrigo foi denunciado pelo crime de homicídio simples consumado, com a causa de aumento prevista na primeira parte do Art. 121, § 4º, do CP, perante o Tribunal do Júri da Comarca de São Paulo. De acordo com o que consta na denúncia, no dia 26 de dezembro de 2019, em uma boate localizada na cidade de São Paulo, Rodrigo teria desferido um soco na barriga de João, além de ter lhe dado um empurrão, que fez com que a vítima caísse em cima da garrafa de vidro que segurava. O corte gerado foi a causa eficiente da morte de João, conforme consta do laudo acostado ao procedimento. Rodrigo teria sido encaminhado por seus amigos ao hospital após os fatos, pois se mostrava descontrolado, não tendo prestado socorro à vítima, por isso, sendo imputada a causa de aumento da primeira parte do Art. 121, § 4º, do CP.

      Diante da inicial acusatória, Rodrigo procurou seu (sua) advogado (a), narrando que, no dia dos fatos, câmeras de segurança registraram o momento em que uma pessoa desconhecida, de maneira furtiva, teria colocado substâncias entorpecentes em sua bebida, o que teria causado uma embriaguez completa. Rodrigo teria ficado descontrolado e, em razão disso, sem motivação, teria desferido um soco na barriga de João, empurrando-o em seguida apenas para que, dele, se afastasse, nem mesmo percebendo que a vítima estaria com uma garrafa de cerveja nas mãos. Destacou sequer saber por que quis lesionar João, mas assegurou que o resultado morte não foi pretendido e nem aceito pelo mesmo, que precisou, inclusive, ser submetido a tratamento psicológico em razão dos fatos. Apresentou laudo do hospital, elaborado logo após o ocorrido, constatando que estaria completamente embriagado em razão da ingestão daquela substância entorpecente que teria sido colocada em sua bebida, bem como que, naquele momento, era inteiramente incapaz de entender o caráter ilícito dos fatos.

      Após recebimento da denúncia, citação e apresentação de defesa, foi designada audiência de instrução e julgamento, na primeira fase do procedimento do Tribunal do Júri, para oitiva das testemunhas de acusação e defesa, além do interrogatório do réu. Os policiais responsáveis pelas investigações e pela oitiva dos envolvidos, arrolados como testemunhas pelo Ministério Público, informaram ao magistrado que se atrasariam para o ato judicial, pois estavam em importante diligência. Não querendo fracionar a colheita da prova, o magistrado determinou a oitiva das testemunhas de defesa antes das de acusação, apesar do registro do inconformismo da defesa. Ao final, o réu foi interrogado. As provas colhidas indicaram que a versão apresentada por Rodrigo ao seu advogado era totalmente verdadeira. Considerando que foi constatado o desferimento do soco e do empurrão por parte de Rodrigo em João, após manifestação das partes, o juiz pronunciou o acusado nos termos da denúncia.

      Intimado, o Ministério Público se manteve inerte. Rodrigo e sua defesa técnica foram intimados da decisão em 05 de abril de 2021, segunda-feira.

      Considerando apenas as informações expostas, apresente, na condição de advogado(a) de Rodrigo, a peça jurídica cabível, diferente de habeas corpus e embargos de declaração, expondo todas as teses jurídicas de direito material e processual aplicáveis. A peça deverá ser datada do último dia do prazo para interposição, devendo ser considerado que segunda a sexta-feira são dias úteis em todo o país. (Valor: 5,00)

      Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples menção ou transcrição do dispositivo legal não confere pontuação.
    comando: Que pedido deve ser formulado na peça?
    gabarito: Conhecimento e provimento do recurso
    opcoes:
      correta: Conhecimento e provimento do recurso
      erradas:
        - "Pedido de reconsideração ao juiz de 1º grau e indicação da norma: art. 589, parágrafo único, CPP."
        - Reforma da sentença de absolvição sumária;
        - "Diante da condenação, de forma subsidiária: a) Afastamento do concurso material de crimes, ou reconhecimento de crime único.. b) Incidência da atenuante da menoridade penal relativa.. c) Afastamento da agravante da embriaguez preordenada.. d) Fixação da pena-base no mínimo legal ou diminuição da pena e) Fixação de regime semiaberto."
        - Aplicação da pena base no mínimo legal ou reconhecimento da atenuante da confissão.
        - Absolvição, na forma do Art. 386, inciso III, do CPP.
    revisao: *a1
  - id: 34-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Geraldo, 30 anos, constrangeu Eugênia, desconhecida que passava pela rua, mediante grave ameaça, a transferir R$ 2.000,00 (dois mil reais) para sua conta. Diante da grave ameaça, Eugênia compareceu ao estabelecimento bancário com Geraldo e fez a transferência devida, sendo liberada em seguida.

      Eugênia, nervosa, compareceu à sede policial e narrou o ocorrido, sendo instaurado inquérito para identificação do autor do fato. Ocorre que Geraldo, no dia seguinte, antes de qualquer denúncia, arrependeu-se de sua conduta e transferiu de volta para a conta de Eugênia todo o valor antes obtido de maneira indevida.

      Confirmada a autoria, o Ministério Público ofereceu denúncia em face de Geraldo pela prática do crime de extorsão simples consumada (Art. 158, caput, do Código Penal), sendo decretada sua prisão preventiva, em razão da gravidade do fato e da reincidência. Durante audiência de instrução e julgamento, foi ouvida a vítima, que confirmou os fatos narrados na denúncia. O réu permaneceu em sala de audiência, e o reconhecimento foi realizado ao final da oitiva da vítima, ainda no local, sob o argumento de que, como havia muitos presos no Fórum, não haveria policiais suficientes para transporte de presos até a sala de reconhecimento. Assim, Eugênia apenas apontou para o denunciado e disse que ele seria o autor. As demais testemunhas esclareceram que não presenciaram o ocorrido.

      Com base no reconhecimento realizado, foi o réu condenado nos termos da denúncia, sendo aplicada pena base de 04 anos; pena intermediária de 04 anos e 03 meses em razão da reincidência, não sendo reconhecidas atenuantes ou outras agravantes; na terceira fase, não foram reconhecidas causas de aumento ou de diminuição de pena. O regime inicial aplicado foi o fechado.

      Intimado da sentença, esclareça, na condição de advogado de Geraldo em atuação em recurso de apelação, os itens a seguir.
    comando: Qual argumento de direito processual poderá ser apresentado para questionar a produção probatória em audiência? Justifique.
    gabarito: O argumento de direito processual é o de que a produção de provas não foi integralmente válida, tendo em vista que o reconhecimento do réu não foi realizado observando as formalidades legais. De acordo com o Art. 226 do CPP, o reconhecimento, em sendo possível, deverá ser realizado na presença de outras pessoas com características semelhantes àquelas da pessoa a ser reconhecida. No caso, o reconhecimento foi na própria sala de audiência, apenas com o réu presente na condição de preso, então claramente foi viciado. Dessa forma, aquela prova não poderia ser considerada na sentença condenatória. Havia outros presos disponíveis para serem colocados ao lado do denunciado em sala especial para reconhecimento, não sendo o argumento de economia suficiente para afastar as exigências legais.
    opcoes:
      correta: O argumento é o de que o reconhecimento realizado não foi válido, pois não foram observadas as formalidades legais, nos termos do Art. 226 do CPP.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
  - id: 34-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Geraldo, 30 anos, constrangeu Eugênia, desconhecida que passava pela rua, mediante grave ameaça, a transferir R$ 2.000,00 (dois mil reais) para sua conta. Diante da grave ameaça, Eugênia compareceu ao estabelecimento bancário com Geraldo e fez a transferência devida, sendo liberada em seguida.

      Eugênia, nervosa, compareceu à sede policial e narrou o ocorrido, sendo instaurado inquérito para identificação do autor do fato. Ocorre que Geraldo, no dia seguinte, antes de qualquer denúncia, arrependeu-se de sua conduta e transferiu de volta para a conta de Eugênia todo o valor antes obtido de maneira indevida.

      Confirmada a autoria, o Ministério Público ofereceu denúncia em face de Geraldo pela prática do crime de extorsão simples consumada (Art. 158, caput, do Código Penal), sendo decretada sua prisão preventiva, em razão da gravidade do fato e da reincidência. Durante audiência de instrução e julgamento, foi ouvida a vítima, que confirmou os fatos narrados na denúncia. O réu permaneceu em sala de audiência, e o reconhecimento foi realizado ao final da oitiva da vítima, ainda no local, sob o argumento de que, como havia muitos presos no Fórum, não haveria policiais suficientes para transporte de presos até a sala de reconhecimento. Assim, Eugênia apenas apontou para o denunciado e disse que ele seria o autor. As demais testemunhas esclareceram que não presenciaram o ocorrido.

      Com base no reconhecimento realizado, foi o réu condenado nos termos da denúncia, sendo aplicada pena base de 04 anos; pena intermediária de 04 anos e 03 meses em razão da reincidência, não sendo reconhecidas atenuantes ou outras agravantes; na terceira fase, não foram reconhecidas causas de aumento ou de diminuição de pena. O regime inicial aplicado foi o fechado.

      Intimado da sentença, esclareça, na condição de advogado de Geraldo em atuação em recurso de apelação, os itens a seguir.
    comando: Qual argumento de direito material poderá ser apresentado, caso mantida a condenação, em busca da redução da pena aplicada? Justifique.
    gabarito: O argumento é o de que deveria ter sido reconhecida a atenuante da reparação do dano, prevista no Art. 65, inciso III, alínea b, do CP. De acordo com o enunciado, antes mesmo do oferecimento da denúncia, logo após a prática delitiva, o autor do fato procurou minorar as consequências de seu ato e reparou o dano, de modo que aplicável a atenuante antes mencionada. Não haveria de se falar em tentativa a justificar o reconhecimento de causa de diminuição de pena, já que o crime se consumou por ocasião do constrangimento. Ademais, mesmo a reparação tendo ocorrido antes do oferecimento da denúncia, não caberia aplicação da causa de diminuição de pena do arrependimento posterior, prevista no Art. 16 do Código Penal, pois o crime foi praticado com grave ameaça à pessoa.
    opcoes:
      correta: O argumento seria o de que deveria ter sido reconhecida a atenuante da reparação do dano, tendo em vista que o denunciado devolveu o valor obtido indevidamente, nos termos do Art. 65, inciso III, alínea b, do CP.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
