    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Houve inadequada inversão da ordem de oitiva das testemunhas ou as testemunhas de defesa foram ouvidas antes das testemunhas de acusação, em desrespeito à previsão do Art. 411 do CPP
    opcoes:
      correta: Houve inadequada inversão da ordem de oitiva das testemunhas ou as testemunhas de defesa foram ouvidas antes das testemunhas de acusação, em desrespeito à previsão do Art. 411 do CPP
      erradas:
        - Ausência de prova da materialidade do aborto por inexistência de perícia que vincule o óbito à substância abortiva.
        - Da tese da incidência da atenuante da menoridade penal relativa
        - Substituição da pena privativa de liberdade por restritiva de direitos,pois preenchidos os requisitos do Art. 44 do CP.
        - Subsidiariamente, aplicação da suspensão condicional da pena, tendo em vista que a pena aplicada foi inferior a 4 anos e o réu era maior de 70 anos OU em razão do sursis etário, nos termos do Art. 77, §2º, do Código Penal
        - Afastamento da agravante do Art. 61, inciso II, alínea d (ou b), do CP, pois a situação de perigo comum é elementar do tipo imputado ou por configurar bis in idem ou por não haver a intenção de ocultação, vantagem ou impunidade de outro crime.
