      Ao ser intimada da sentença, ela procura você na condição de advogado(a).

      Considerando a hipótese narrada, responda aos itens a seguir.
    comando: No mérito, foi Vanessa corretamente condenada pela prática do crime de peculato? Justifique.
    gabarito: Vanessa não foi corretamente condenada pela prática do crime de peculato. Em que pese o Art. 30 do Código Penal prever que as “circunstâncias” de caráter pessoal se comunicam quando elementares do crime, não é possível, no caso concreto, a aplicação desse dispositivo, porque o enunciado deixa claro que Vanessa não tinha conhecimento da condição de funcionário público de João, não sendo possível responsabilizá-la por peculato. A simples afirmação de que as circunstâncias pessoais não se comunicam é insuficiente para atribuição da pontuação, pois, quando elementares, poderá haver comunicação, desde que o agente tenha conhecimento dessa situação. Da mesma forma, inadequada a afirmativa no sentido de que o particular não pode ser responsabilizado pelo crime próprio de peculato, pois insuficiente.
    opcoes:
      correta: Vanessa não foi corretamente condenada por peculato porque não tinha conhecimento da condição de funcionário público de João, dependendo a comunicação da elementar desse elemento subjetivo OU porque não pode ser aplicado o Art. 30 do CP pela ausência de elemento subjetivo.
