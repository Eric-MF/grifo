  - id: 19-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Carlos foi condenado pela prática de um crime de receptação qualificada à pena de 04 anos e 06 meses de reclusão, sendo fixado o regime semiaberto para início do cumprimento de pena. Após o trânsito em julgado da decisão, houve início do cumprimento da sanção penal imposta. Cumprido mais de 1/6 da pena imposta e preenchidos os demais requisitos, o advogado de Carlos requer, junto ao Juízo de Execuções Penais, a progressão para o regime aberto. O magistrado competente profere decisão concedendo a progressão e fixa como condição especial o cumprimento de prestação de serviços à comunidade, na forma do Art. 115 da Lei nº 7.210/84. O advogado de Carlos é intimado dessa decisão.

      Considerando apenas as informações apresentadas, responda aos itens a seguir.
    comando: Qual medida processual deverá ser apresentada pelo advogado de Carlos, diferente do habeas corpus, para questionar a decisão do magistrado?
    gabarito: A medida processual a ser apresentada pelo advogado de Carlos é o agravo previsto no Art. 197 da Lei nº 7.210/84, também conhecido como agravo de execução ou agravo em execução. Prevê o mencionado dispositivo que, das decisões proferidas em sede de execução, será cabível o recurso de agravo. No caso, o enunciado deixa claro que houve decisão condenatória com trânsito em julgado e que a decisão a ser combatida foi proferida pelo Juízo da Execução, analisando progressão de regime.
    opcoes:
      correta: A medida processual a ser apresentada é o Agravo OU Agravo de Execução OU Agravo em Execução, na forma do Art. 197 da Lei nº 7.210/84.
      erradas:
        - Houve cerceamento de defesa OU violação ao princípio do contraditório ou da ampla defesa, tendo em vista que as testemunhas referidas não são computadas no número máximo de testemunhas a serem ouvidas, nos termos do Art. 401, § 1º, do CPP OU Art. 209 do CPP OU Art. 5º, LV, CRFB.
        - "A condição jurídica de João se alteraria, na medida em que o resultado de lesões corporais de natureza grave consuma o crime de instigação, auxílio e induzimento ao suicídio, devendo João responder pelo crime previsto no artigo 122 do CP da forma consumada. Obs.1: respostas incompletas não são pontuadas. Obs.2: a mera indicação da sanção penal não é pontuada. Obs.3: a mera transcrição do artigo não é pontuada."
        - A tese adequada é a da aplicação da lei mais benéfica ao condenado, que importará na redução da sua pena, tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto alternativo, portanto crime único OU tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto cumulativo, sujeito à aplicação da continuidade delitiva o que permite sua aplicação para fatos praticados antes de sua entrada em vigor, ainda que a decisão seja definitiva.
        - O argumento é que, diante da parcial procedência do pedido, deveria ter sido analisada a possibilidade de oferecimento de proposta de suspensão condicional do processo, nos termos da Súmula 337 do STJ OU art. 89 da Lei 9.099/95.
        - A condenação anterior à pena de multa não impede a concessão da suspensão condicional da pena, de acordo com o Art. 77, § 1º, do CP.
    revisao: *a1
  - id: 19-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
      Carlos foi condenado pela prática de um crime de receptação qualificada à pena de 04 anos e 06 meses de reclusão, sendo fixado o regime semiaberto para início do cumprimento de pena. Após o trânsito em julgado da decisão, houve início do cumprimento da sanção penal imposta. Cumprido mais de 1/6 da pena imposta e preenchidos os demais requisitos, o advogado de Carlos requer, junto ao Juízo de Execuções Penais, a progressão para o regime aberto. O magistrado competente profere decisão concedendo a progressão e fixa como condição especial o cumprimento de prestação de serviços à comunidade, na forma do Art. 115 da Lei nº 7.210/84. O advogado de Carlos é intimado dessa decisão.

      Considerando apenas as informações apresentadas, responda aos itens a seguir.
    comando: Qual fundamento deverá ser apresentado pelo advogado de Carlos para combater a decisão do magistrado?
    gabarito: |-
      O argumento a ser apresentado pelo advogado de Carlos é o de que a decisão do magistrado foi equivocada, pois não é possível fixar, como condição especial ao regime aberto, o cumprimento de prestação de serviços à comunidade. O Art. 115 da LEP prevê expressamente que o magistrado, no momento de fixar o regime aberto, poderá fixar condições especiais, além das obrigatórias e genéricas estabelecidas nos incisos desse dispositivo.

      Ocorre que a legislação penal não disciplina quais seriam essas condições especiais, de forma que surgiu a controvérsia sobre a possibilidade de serem fixadas penas substitutivas em atenção a esta previsão. O tema, porém, foi pacificado pelo Superior Tribunal de Justiça, que, no Enunciado 493 de sua Súmula de Jurisprudência, estabeleceu a inadmissibilidade de serem fixadas penas substitutivas (Art. 44 do Código Penal) como condições especiais ao regime aberto. A ideia que prevaleceu foi a de que, apesar de ser possível o estabelecimento de condições especiais, estas não podem ser penas previstas no Código Penal, sob pena de bis in idem ou dupla punição.
    opcoes:
      correta: Inadmissibilidade de ser fixada prestação de serviços à comunidade (ou pena substitutiva) como condição especial ao regime aberto, na forma do Enunciado 493 da Súmula do STJ, sob pena de configurar dupla punição OU bis in idem.
      erradas:
        - Houve cerceamento de defesa OU violação ao princípio do contraditório ou da ampla defesa, tendo em vista que as testemunhas referidas não são computadas no número máximo de testemunhas a serem ouvidas, nos termos do Art. 401, § 1º, do CPP OU Art. 209 do CPP OU Art. 5º, LV, CRFB.
        - "A condição jurídica de João se alteraria, na medida em que o resultado de lesões corporais de natureza grave consuma o crime de instigação, auxílio e induzimento ao suicídio, devendo João responder pelo crime previsto no artigo 122 do CP da forma consumada. Obs.1: respostas incompletas não são pontuadas. Obs.2: a mera indicação da sanção penal não é pontuada. Obs.3: a mera transcrição do artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - Em preliminar de defesa, deve ser alegada a extinção de punibilidade pela decadência, tendo em vista que Paulo deixou de oferecer representação no prazo de 6 meses, conhecendo a autoria desde a data do fato, conforme estabelecido no Art. 38 do CPP c/c. o Art. 107, inciso IV, do CP.
