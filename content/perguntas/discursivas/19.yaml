  - id: 19-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      João estava dirigindo seu automóvel a uma velocidade de 100 km/h em uma rodovia em que o limite máximo de velocidade é de 80 km/h. Nesse momento, foi surpreendido por uma bicicleta que atravessou a rodovia de maneira inesperada, vindo a atropelar Juan, condutor dessa bicicleta, que faleceu no local em virtude do acidente. Diante disso, João foi denunciado pela prática do crime previsto no Art. 302 da Lei nº 9.503/97. As perícias realizadas no cadáver da vítima, no automóvel de João, bem como no local do fato, indicaram que João estava acima da velocidade permitida, mas que, ainda que a velocidade do veículo do acusado fosse de 80 km/h, não seria possível evitar o acidente e Juan teria falecido. Diante da prova pericial constatando a violação do dever objetivo de cuidado pela velocidade acima da permitida, João foi condenado à pena de detenção no patamar mínimo previsto no dispositivo legal.

      Considerando apenas os fatos narrados no enunciado, responda aos itens a seguir.
    comando: Qual o recurso cabível da decisão do magistrado, indicando seu prazo e fundamento legal?
    gabarito: O recurso cabível da sentença do magistrado que condenou João é o recurso de apelação, cujo prazo de interposição é de 05 dias e o fundamento é o Art. 593, inciso I, do Código de Processo Penal.
    opcoes:
      correta: O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
      erradas:
        - Houve cerceamento de defesa OU violação ao princípio do contraditório ou da ampla defesa, tendo em vista que as testemunhas referidas não são computadas no número máximo de testemunhas a serem ouvidas, nos termos do Art. 401, § 1º, do CPP OU Art. 209 do CPP OU Art. 5º, LV, CRFB.
        - "A condição jurídica de João se alteraria, na medida em que o resultado de lesões corporais de natureza grave consuma o crime de instigação, auxílio e induzimento ao suicídio, devendo João responder pelo crime previsto no artigo 122 do CP da forma consumada. Obs.1: respostas incompletas não são pontuadas. Obs.2: a mera indicação da sanção penal não é pontuada. Obs.3: a mera transcrição do artigo não é pontuada."
        - Não, pois viola o princípio da vedação da reformatio in pejus, tendo em vista que geraria prejuízo na aplicação do regime OU na prescrição OU na execução da pena
        - O argumento é que a vantagem foi oferecida para particular e não para funcionário público, logo não configurado crime contra a Administração Pública.
        - Atipicidade objetiva da conduta, pois a figura delitiva da perseguição (Art. 147-A do CP); adota verbo nuclear no infinitivo (“perseguir”), o que denota crime habitual, a exigir reiteração do comportamento para a caracterização da tipicidade objetiva
    revisao: *a1
  - id: 19-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      João estava dirigindo seu automóvel a uma velocidade de 100 km/h em uma rodovia em que o limite máximo de velocidade é de 80 km/h. Nesse momento, foi surpreendido por uma bicicleta que atravessou a rodovia de maneira inesperada, vindo a atropelar Juan, condutor dessa bicicleta, que faleceu no local em virtude do acidente. Diante disso, João foi denunciado pela prática do crime previsto no Art. 302 da Lei nº 9.503/97. As perícias realizadas no cadáver da vítima, no automóvel de João, bem como no local do fato, indicaram que João estava acima da velocidade permitida, mas que, ainda que a velocidade do veículo do acusado fosse de 80 km/h, não seria possível evitar o acidente e Juan teria falecido. Diante da prova pericial constatando a violação do dever objetivo de cuidado pela velocidade acima da permitida, João foi condenado à pena de detenção no patamar mínimo previsto no dispositivo legal.

      Considerando apenas os fatos narrados no enunciado, responda aos itens a seguir.
    comando: Qual a principal tese jurídica de direito material a ser alegada nas razões recursais?
    gabarito: |-
      A principal tese jurídica a ser apresentada é o requerimento de absolvição do acusado, pois, em que pese ter havido violação do dever objetivo de cuidado, essa violação não representou incremento do risco no caso concreto, pois, ainda que observada a velocidade máxima prevista para a pista, com respeito ao dever de cuidado, o resultado teria ocorrido da maneira como ocorreu. Dessa forma, o examinando pode fundamentar o pedido de absolvição com base na ausência de incremento do risco, sendo essa ausência, de acordo com a Teoria da Imputação Objetiva, fundamento para absolvição. De qualquer maneira, o cerne da resposta é a indicação de que não foi a violação do dever de cuidado a responsável pelo resultado lesivo, de modo que não deveria João ser por ele responsabilizado.

      A Banca também considerou como correta a resposta que indicava a inexistência de culpa, apesar da violação do dever objetivo de cuidado, em razão da ausência do elemento previsibilidade, sob a alegação de que João não poderia prever que uma bicicleta atravessaria seu caminho em uma rodovia de tráfego intenso, em local inadequado.
    opcoes:
      correta: Não foi praticado crime OU deveria João ser absolvido, razão da aplicação da Teoria da Imputação Objetiva, pois ainda que não houvesse violação do dever objetivo de cuidado, o resultado teria ocorrido da mesma maneira que ocorreu, não havendo incremento do risco realizado no resultado OU porque não havia culpa em razão da ausência do elemento previsibilidade.
      erradas:
        - Houve cerceamento de defesa OU violação ao princípio do contraditório ou da ampla defesa, tendo em vista que as testemunhas referidas não são computadas no número máximo de testemunhas a serem ouvidas, nos termos do Art. 401, § 1º, do CPP OU Art. 209 do CPP OU Art. 5º, LV, CRFB.
        - "A condição jurídica de João se alteraria, na medida em que o resultado de lesões corporais de natureza grave consuma o crime de instigação, auxílio e induzimento ao suicídio, devendo João responder pelo crime previsto no artigo 122 do CP da forma consumada. Obs.1: respostas incompletas não são pontuadas. Obs.2: a mera indicação da sanção penal não é pontuada. Obs.3: a mera transcrição do artigo não é pontuada."
        - A tese adequada é a da aplicação da lei mais benéfica ao condenado, que importará na redução da sua pena, tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto alternativo, portanto crime único OU tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto cumulativo, sujeito à aplicação da continuidade delitiva o que permite sua aplicação para fatos praticados antes de sua entrada em vigor, ainda que a decisão seja definitiva.
        - Aplicação da escusa absolutória OU presente causa de isenção de pena, tendo em vista que o réu era pai da vítima, nos termos do Art. 181, inciso II, do Código Penal.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
