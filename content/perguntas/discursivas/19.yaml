# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "19"
introducoes:
  peca: "Rodrigo bebeu num bloco de Natal e, um pouco tonto, roubou com uma faca, junto com um amigo, os pertences de Maria, que estava grávida de um mês. Foi condenado por roubo com duas majorantes a 5 anos e 4 meses no semiaberto, com a pena-base no mínimo e o aumento de 1/3. O Ministério Público, intimado em 14/9/2015, apelou em 30/9/2015, pedindo o aumento da pena-base por inquéritos e ações em curso, as agravantes de crime contra mulher grávida e de embriaguez preordenada, um aumento maior por serem duas as majorantes e o regime fechado, porque o roubo com faca assusta a população. Você defende Rodrigo nas contrarrazões."
  q1: "João dirigia a 100 km/h numa rodovia de limite 80 km/h quando um ciclista atravessou de repente e morreu atropelado. A perícia mostrou que, mesmo a 80 km/h, o acidente e a morte teriam acontecido. João foi condenado por homicídio culposo na direção de veículo."
  q2: "Ronaldo foi denunciado por integrar organização criminosa, e só ele foi identificado até agora. Arrependido, quer contribuir com a investigação, dando os nomes dos outros integrantes e contando os crimes cometidos."
  q3: "João, servidor de um cartório do Tribunal de Justiça, convidou a vizinha Vanessa, que praticava furtos, para tirarem R$ 1.000 do cofre do cartório, sem contar a ela que era funcionário público e trabalhava lá. Vanessa foi citada por edital, foi revel e acabou condenada por peculato, mas estava presa na mesma comarca desde antes da citação."
  q4: "Carlos cumpria pena no semiaberto e conseguiu a progressão para o regime aberto, mas o juiz da execução fixou como condição especial a prestação de serviços à comunidade."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["19-peca-1", "19-peca-3", "19-peca-10", "19-q1-b"]
perguntas:
  - id: 19-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: preliminar
    pergunta: "O Ministério Público foi intimado em 14/9/2015 e apelou em 30/9/2015. Que preliminar a defesa deve levantar nas contrarrazões?"
    tese: "Não conhecimento da apelação intempestiva"
    aceitos: [ [ "intempestiv*" ], [ "nao conhecimento | nao conhecido | nao seja conhecido | nao conhecer" ] ]
    artigos: [ "art. 593, CPP" ]
    gabarito: "Preliminarmente: Não conhecimento do recurso de Apelação, em razão da intempestividade, nos termos do art. 593 do CPP Obs.: A mera indicação do dispositivo legal ou do número de súmula não pontua."
    revisao: { status: revisado }
  - id: 19-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "O Ministério Público quer aumentar a pena-base por inquéritos e ações penais em curso. O que a defesa deve sustentar?"
    tese: "Inquéritos e ações sem trânsito em julgado não agravam a pena-base (presunção de inocência)"
    aceitos: [ [ "presuncao de inocencia | estado de inocencia" ], [ "nao podem | nao servem | nao configuram | nao caracteriz* | nao sao" ] ]
    artigos: [ "Súmula 444 STJ", "art. 5, LVII, CRFB" ]
    gabarito: "No mérito: manter a pena-base no mínimo legal, pois a existência de ações penais em curso sem trânsito em julgado ou inquéritos policiais não justificam o reconhecimento de circunstâncias judiciais prejudiciais, sob pena de violação do princípio da presunção de inocência (art. 5º, inciso LVII, da CF/88) OU na forma do Enunciado 444 da Súmula do STJ. Obs.: A mera indicação do dispositivo legal ou do número de súmula não pontua."
    revisao: { status: revisado }
  - id: 19-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Por que não cabe a agravante de crime contra mulher grávida pedida pelo Ministério Público?"
    tese: "Afastamento da agravante da gravidez: o réu não sabia dela, e aplicá-la seria responsabilidade objetiva"
    aceitos: [ [ "responsabilidade objetiva" ], [ "nao sabia | desconhec* | sem conhecimento | nao tinha conhecimento | ignorava" ] ]
    artigos: [ "art. 61, II, h, CP" ]
    gabarito: "Não deve ser aplicada a agravante da gravidez da vítima, pois Rodrigo não tinha conhecimento de tal circunstância OU sob pena de configurar responsabilidade objetiva"
    revisao: { status: revisado }
  - id: 19-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Rodrigo bebeu no bloco por diversão. Por que não cabe a agravante da embriaguez preordenada?"
    tese: "Afastamento da agravante da embriaguez preordenada: ele não bebeu para cometer o crime, a embriaguez foi voluntária"
    aceitos: [ [ "voluntaria | culposa | nao preordenada | nao foi preordenada" ], [ "para cometer | com o objetivo de cometer | para criar coragem | dar coragem" ] ]
    artigos: [ "art. 61, II, l, CP" ]
    gabarito: "Não deve ser aplicada a agravante da embriaguez preordenada, pois não existe prova que Rodrigo ingeriu bebida alcoólica com objetivo de cometer crime OU para aumentar sua coragem para cometer o delito OU porque a embriaguez foi voluntária ou culposa, mas não preordenada."
    revisao: { status: revisado }
  - id: 19-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "O Ministério Público pede aumento maior que 1/3 só porque são duas as majorantes. O que a defesa deve sustentar?"
    tese: "O número de majorantes, sozinho, não justifica aumento maior: é preciso fundamentação concreta"
    aceitos: [ [ "concret*" ], [ "fundamentacao idonea" ], [ "numero de majorantes" ] ]
    artigos: [ "Súmula 443 STJ" ]
    gabarito: "A fração do aumento de pena em razão do roubo circunstanciado não deve ser aumentada, pois o número de majorantes, de maneira isolada, não configura fundamentação idônea OU porque deve ser apresentada fundamentação concreta para o aumento de pena acima do mínimo previsto, não sendo o número de majorantes suficientes, na forma do Enunciado 443 da Súmula do STJ. Obs.: A mera indicação do dispositivo legal ou do número de súmula não pontua."
    revisao: { status: revisado }
  - id: 19-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Por que deve ser mantido o regime semiaberto, contra o pedido de regime fechado?"
    tese: "A gravidade em abstrato do crime não justifica regime mais severo que o da pena"
    aceitos: [ [ "abstrata | em abstrato" ], [ "motivacao idonea | fundamentacao idonea | concret*" ] ]
    artigos: [ "Súmula 718 STF", "Súmula 719 STF", "Súmula 440 STJ" ]
    gabarito: "Deverá ser mantido o regime semiaberto para cumprimento de pena /, pois a gravidade em abstrato do crime não configura motivação idônea para aplicação de regime mais severo do que o compatível com a pena aplicada, na forma do Enunciado 718 OU 719 da Súmula do STF OU do Enunciado 440 da Súmula do STJ Obs.: A mera indicação do dispositivo legal ou do número de súmula não pontua."
    revisao: { status: revisado }
  - id: 19-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que recurso cabe contra a condenação de João?"
    tese: "Apelação contra a condenação, no prazo de 5 dias"
    aceitos: [ "apelacao" ]
    artigos: [ "art. 593, I, CPP" ]
    gabarito: "O recurso cabível da sentença do magistrado que condenou João é o recurso de apelação, cujo prazo de interposição é de 05 dias e o fundamento é o Art. 593, inciso I, do Código de Processo Penal."
    revisao: { status: revisado }
  - id: 19-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que medida o advogado de Ronaldo pode buscar para evitar a pena?"
    tese: "Acordo de colaboração premiada"
    aceitos: [ "colaboracao premiada | delacao premiada" ]
    artigos: [ "art. 4, I, Lei 12.850" ]
    gabarito: "Sim, existe medida a ser buscada pelo advogado de Ronaldo para evitar sua punição. Ronaldo foi denunciado pela prática do delito previsto no Art. 2º da Lei nº 12.850/13. Ocorre que o Art. 4º, inciso I, deste mesmo diploma legal prevê o instituto da “colaboração premiada”, que poderá ocorrer quando o agente colaborar efetiva e voluntariamente com investigação, resultando na identificação dos demais coautores e partícipes da organização criminosa e das infrações por eles praticadas. Diante da vontade de Ronaldo de esclarecer sobre quem seriam os demais integrantes da organização criminosa, deveria o seu advogado buscar um acordo de colaboração premiada, sendo certo que algumas das consequências do acordo que podem ser aplicadas pelo juiz são o perdão judicial ou a substituição de pena privativa de liberdade por restritiva de direitos."
    revisao: { status: revisado }
  - id: 19-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Alguém pode ser condenado só pelas declarações de Ronaldo?"
    tese: "As declarações do colaborador não bastam para condenar: precisam ser confirmadas por outras provas"
    aceitos: [ [ "outras provas | outros elementos | corrobora* | outros meios de prova" ], [ "nao pode | nao e possivel | vedad*" ] ]
    artigos: [ "art. 4, § 16, Lei 12.850" ]
    gabarito: "Ainda que o acordo de “colaboração premiada” seja válido, de maneira adequada estabeleceu o legislador a impossibilidade de condenação exclusivamente com base nas declarações do agente colaborador, nos termos do Art. 4º, § 16º, da Lei nº 12.850/13. Para um decreto condenatório, é necessário que as declarações de Ronaldo sejam confirmadas por outros elementos de prova. Os Tribunais Superiores vêm decidindo que as informações procedentes da “colaboração premiada” precisam ser confirmadas por outros elementos de prova – a chamada prova de corroboração."
    revisao: { status: revisado }
  - id: 19-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que argumento processual a defesa de Vanessa tem na apelação?"
    tese: "Nulidade da citação por edital da ré presa, que devia ser citada pessoalmente"
    aceitos: [ "nulidade | nula | nulo | pessoalmente" ]
    artigos: [ "Súmula 351 STF", "art. 360, CPP" ]
    gabarito: "O examinando deveria alegar que, em relação à Vanessa, o processo é nulo desde a citação. Quando Vanessa foi citada por edital, ela estava presa em estabelecimento na mesma unidade da Federação do juízo processante, logo sua citação foi nula, conforme Enunciado 351 da Súmula de Jurisprudência do STF. Como ela não tomou conhecimento da ação e nem mesmo foi interrogada, pois teve sua revelia decretada, o prejuízo é claro. Assim, em sede de apelação, antes de enfrentar o mérito da apelação, deveria o advogado buscar a anulação de todos os atos após sua citação, inclusive da sentença. Poderia, ainda, o candidato justificar a nulidade na exigência trazida pelo Art. 360 do CPP, que prevê que o réu preso deve ser citado pessoalmente."
    revisao: { status: revisado }
  - id: 19-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "No mérito, por que Vanessa não podia ser condenada por peculato?"
    tese: "Incomunicabilidade da elementar desconhecida: ela não sabia que João era funcionário público"
    aceitos: [ "nao sabia | desconhec* | sem conhecimento | nao tinha conhecimento | ignorava" ]
    artigos: [ "art. 30, CP" ]
    gabarito: "Vanessa não foi corretamente condenada pela prática do crime de peculato. Em que pese o Art. 30 do Código Penal prever que as “circunstâncias” de caráter pessoal se comunicam quando elementares do crime, não é possível, no caso concreto, a aplicação desse dispositivo, porque o enunciado deixa claro que Vanessa não tinha conhecimento da condição de funcionário público de João, não sendo possível responsabilizá-la por peculato. A simples afirmação de que as circunstâncias pessoais não se comunicam é insuficiente para atribuição da pontuação, pois, quando elementares, poderá haver comunicação, desde que o agente tenha conhecimento dessa situação. Da mesma forma, inadequada a afirmativa no sentido de que o particular não pode ser responsabilizado pelo crime próprio de peculato, pois insuficiente."
    revisao: { status: revisado }
  - id: 19-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Fora o habeas corpus, que medida a defesa de Carlos deve usar contra a decisão?"
    tese: "Agravo em execução"
    aceitos: [ "agravo" ]
    artigos: [ "art. 197, LEP" ]
    gabarito: "A medida processual a ser apresentada pelo advogado de Carlos é o agravo previsto no Art. 197 da Lei nº 7.210/84, também conhecido como agravo de execução ou agravo em execução. Prevê o mencionado dispositivo que, das decisões proferidas em sede de execução, será cabível o recurso de agravo. No caso, o enunciado deixa claro que houve decisão condenatória com trânsito em julgado e que a decisão a ser combatida foi proferida pelo Juízo da Execução, analisando progressão de regime."
    revisao: { status: revisado }
  - id: 19-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que fundamento a defesa de Carlos deve apresentar contra a condição imposta?"
    tese: "A pena substitutiva não pode ser condição especial do regime aberto (bis in idem)"
    aceitos: [ "inadmissivel | nao pode | vedad* | bis in idem | dupla puni*" ]
    artigos: [ "Súmula 493 STJ" ]
    gabarito: "O argumento a ser apresentado pelo advogado de Carlos é o de que a decisão do magistrado foi equivocada, pois não é possível fixar, como condição especial ao regime aberto, o cumprimento de prestação de serviços à comunidade. O Art. 115 da LEP prevê expressamente que o magistrado, no momento de fixar o regime aberto, poderá fixar condições especiais, além das obrigatórias e genéricas estabelecidas nos incisos desse dispositivo.\n\nOcorre que a legislação penal não disciplina quais seriam essas condições especiais, de forma que surgiu a controvérsia sobre a possibilidade de serem fixadas penas substitutivas em atenção a esta previsão. O tema, porém, foi pacificado pelo Superior Tribunal de Justiça, que, no Enunciado 493 de sua Súmula de Jurisprudência, estabeleceu a inadmissibilidade de serem fixadas penas substitutivas (Art. 44 do Código Penal) como condições especiais ao regime aberto. A ideia que prevaleceu foi a de que, apesar de ser possível o estabelecimento de condições especiais, estas não podem ser penas previstas no Código Penal, sob pena de bis in idem ou dupla punição."
    revisao: { status: revisado }
