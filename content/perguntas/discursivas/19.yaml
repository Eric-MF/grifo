    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: "No mérito: manter a pena-base no mínimo legal, pois a existência de ações penais em curso sem trânsito em julgado ou inquéritos policiais não justificam o reconhecimento de circunstâncias judiciais prejudiciais, sob pena de violação do princípio da presunção de inocência (art. 5º, inciso LVII, da CF/88) OU na forma do Enunciado 444 da Súmula do STJ. Obs.: A mera indicação do dispositivo legal ou do número de súmula não pontua."
    opcoes:
      correta: "No mérito: manter a pena-base no mínimo legal, pois a existência de ações penais em curso sem trânsito em julgado ou inquéritos policiais não justificam o reconhecimento de circunstâncias judiciais prejudiciais, sob pena de violação do princípio da presunção de inocência (art. 5º, inciso LVII, da CF/88) OU na forma do Enunciado 444 da Súmula do STJ. Obs.: A mera indicação do dispositivo legal ou do número de súmula não pontua."
      erradas:
        - Afastamento da nulidade requerida, considerando que não foi arguida em momento adequado.
        - Da consequente fixação do regime aberto, nos termos do artigo 33, § 2º, c, do CP.
        - Caso não seja substituída a pena privativa de liberdade por restritiva de direitos, aplicação da suspensão condicional da pena, na forma do Art. 77 do CP.
        - Não foram iniciados atos executórios do crime de estupro, sendo certo que os atos preparatórios são impuníveis.
        - Excludente de culpabilidade, em razão da inimputabilidade.
