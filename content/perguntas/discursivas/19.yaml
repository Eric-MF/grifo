    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Não deve ser aplicada a agravante da gravidez da vítima, pois Rodrigo não tinha conhecimento de tal circunstância OU sob pena de configurar responsabilidade objetiva
    opcoes:
      correta: Não deve ser aplicada a agravante da gravidez da vítima, pois Rodrigo não tinha conhecimento de tal circunstância OU sob pena de configurar responsabilidade objetiva
      erradas:
        - Afastamento da nulidade requerida, considerando que não foi arguida em momento adequado.
        - Da substituição da pena privativa de liberdade por restritiva de direitos, nos termos do artigo 44 do CP.
        - Aplicação do regime aberto para início do cumprimento da pena, na forma do Art. 33, §2º, alínea c, do Código Penal.
        - A nulidade decorre da ausência de intimação do réu para realização da audiência de instrução e julgamento, o que representa cerceamento de defesa OU configurando violação ao princípio da ampla defesa, nos termos do Art. 5º, LV, CRFB/88 OU Art. 564, IV, do CPP.
        - Ainda de maneira subsidiária, afastamento da causa de aumento imputada na denúncia, tendo em vista que somente aplicável ao homicídio culposo ou tendo em vista que foi imputada a prática do crime de homicídio doloso
