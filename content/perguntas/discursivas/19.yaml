  - id: 19-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Sabendo que Vanessa, uma vizinha com quem nunca tinha conversado, praticava diversos furtos no bairro em que morava, João resolve convidá-la para juntos subtraírem R$ 1.000,00 de um cartório do Tribunal de Justiça, não contando para ela, contudo, que era funcionário público e nem que exercia suas funções nesse cartório.

      Praticam, então, o delito, e Vanessa fica surpresa com a facilidade que tiveram para chegar ao cofre do cartório.

      Descoberto o fato pelas câmeras de segurança, são os dois agentes denunciados, em 10 de março de 2015, pela prática do crime de peculato. João foi notificado e citado pessoalmente, enquanto Vanessa foi notificada e citada por edital, pois não foi localizada em sua residência.

      A família de Vanessa constituiu advogado e o processo prosseguiu, mas dele a ré não tomou conhecimento. Foi decretada a revelia de Vanessa, que não compareceu aos atos processuais. Ao final, os acusados foram condenados pela prática do crime previsto no Art. 312 do Código Penal à pena de 02 anos de reclusão. Ocorre que, na verdade, Vanessa estava presa naquela mesma Comarca, desde 05 de março de 2015, em razão de prisão preventiva decretada em outros dois processos.

      Ao ser intimada da sentença, ela procura você na condição de advogado(a).

      Considerando a hipótese narrada, responda aos itens a seguir.
    comando: Qual argumento de direito processual poderia ser apresentado em favor de Vanessa em sede de apelação? Justifique.
    gabarito: O examinando deveria alegar que, em relação à Vanessa, o processo é nulo desde a citação. Quando Vanessa foi citada por edital, ela estava presa em estabelecimento na mesma unidade da Federação do juízo processante, logo sua citação foi nula, conforme Enunciado 351 da Súmula de Jurisprudência do STF. Como ela não tomou conhecimento da ação e nem mesmo foi interrogada, pois teve sua revelia decretada, o prejuízo é claro. Assim, em sede de apelação, antes de enfrentar o mérito da apelação, deveria o advogado buscar a anulação de todos os atos após sua citação, inclusive da sentença. Poderia, ainda, o candidato justificar a nulidade na exigência trazida pelo Art. 360 do CPP, que prevê que o réu preso deve ser citado pessoalmente.
    opcoes:
      correta: Nulidade dos atos processuais praticados após sua citação OU nulidade da sentença, pois a citação por edital foi inválida, já que Vanessa estava presa OU já que a citação de Vanessa deveria ter sido realizada pessoalmente, nos termos da Súmula 351 do STF OU do art. 360, CPP.
      erradas:
        - Houve cerceamento de defesa OU violação ao princípio do contraditório ou da ampla defesa, tendo em vista que as testemunhas referidas não são computadas no número máximo de testemunhas a serem ouvidas, nos termos do Art. 401, § 1º, do CPP OU Art. 209 do CPP OU Art. 5º, LV, CRFB.
        - "A condição jurídica de João se alteraria, na medida em que o resultado de lesões corporais de natureza grave consuma o crime de instigação, auxílio e induzimento ao suicídio, devendo João responder pelo crime previsto no artigo 122 do CP da forma consumada. Obs.1: respostas incompletas não são pontuadas. Obs.2: a mera indicação da sanção penal não é pontuada. Obs.3: a mera transcrição do artigo não é pontuada."
        - A tese adequada é a da aplicação da lei mais benéfica ao condenado, que importará na redução da sua pena, tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto alternativo, portanto crime único OU tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto cumulativo, sujeito à aplicação da continuidade delitiva o que permite sua aplicação para fatos praticados antes de sua entrada em vigor, ainda que a decisão seja definitiva.
        - Aplicação da escusa absolutória OU presente causa de isenção de pena, tendo em vista que o réu era pai da vítima, nos termos do Art. 181, inciso II, do Código Penal.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
