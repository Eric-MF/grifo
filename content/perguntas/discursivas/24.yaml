    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: O afastamento da hediondez decorre da não previsão do crime de associação no rol trazido pela Lei nº 8.072/90 OU o crime não é hediondo por não se confundir com crime de tráfico, sendo proibida analogia in malam partem OU em razão de o próprio magistrado do conhecimento ter afastado a hediondez do delito
