  - id: 24-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Aroldo, Bernardo, Caio e David, que se conheceram em razão de todos exercerem a função de pintores de residências, durante diversas quartas-feiras do ano de 2015 encontravam-se na garagem da residência do primeiro para organizarem a prática de crimes de receptação simples. Com o objetivo de receber vantagem financeira, nos encontros, muito bem organizados e que ocorreram por mais de 06 meses, era definido como os crimes seriam realizados, havendo plena divisão de funções e tarefas entre os membros do grupo.

      Um morador da região que tinha conhecimento dos encontros, apresenta notícia criminis à autoridade policial, mas informa que acredita que o grupo pretendia realizar a prática de roubos. Diante disso, instaurado o inquérito para apurar o crime de organização criminosa, o delegado de polícia determina diretamente, sem intervenção judicial, a infiltração de agentes de polícia no grupo, de maneira velada, para obtenção de provas. Ao mesmo tempo, realiza outros atos investigatórios e obtém, de forma autônoma, outras provas, que, de fato, confirmam a atividade do grupo; contudo, resta constatado que, verdadeiramente, a pretensão do grupo era apenas a prática de crimes de receptação simples.

      Após a obtenção das provas necessárias, Aroldo, Bernardo, Caio e David são denunciados pela prática do crime previsto no Art. 2º da Lei nº 12.850/13.

      Na condição de advogado(a) dos denunciados, considerando apenas as informações narradas, responda aos questionamentos a seguir.
    comando: A infiltração de agentes determinada pela autoridade policial foi válida? Justifique.
    gabarito: |-
      A infiltração de agentes determinada pela autoridade policial não foi válida, pois não houve autorização judicial e porque havia outros meios de investigação para obtenção de provas, como o próprio enunciado demonstra. O Art. 3º da Lei nº 12.850/13 prevê como meio de obtenção de prova a infiltração, por policial, em atividade de investigação, na forma do Art. 11 do mesmo diploma legal. Ocorre que os artigos 10 e 11 trazem uma série de requisitos para a validade desse meio de obtenção de prova. A infiltração de agentes deverá ser precedida de circunstanciada, motivada e sigilosa autorização judicial, autorização essa que não ocorreu no caso apresentado.

      Ademais, além dos indícios da prática do crime de organização criminosa, necessário que as provas não possam ser obtidas por outros meios. Na hipótese apresentada, as provas poderiam ser obtidas de outra forma, tanto que assim efetivamente o foram. Diante disso, a infiltração de agentes não foi válida.
    opcoes:
      correta: A infiltração não foi válida, tendo em vista que não houve autorização da autoridade judicial e havia outros meios para obtenção da prova, na forma do Art. 10 da Lei nº 12.850/13
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
