    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Possibilidade de concessão de progressão do regime, tendo em vista que a decisão do magistrado foi equivocada
    opcoes:
      correta: Possibilidade de concessão de progressão do regime, tendo em vista que a decisão do magistrado foi equivocada
      erradas:
        - Desenvolvimento jurídico acerca da concessão do livramento condicional, pois a fundamentação trazida pelo magistrado é equivocada.
        - Possibilidade de substituição da pena privativa de liberdade por restritiva de direitos, conforme Art. 44 do CP OU possibilidade de aplicação da pena de multa, conforme art. 155, § 2º, do CP.
        - Aplicação do princípio da bagatela ou insignificância, afastando a tipicidade material
        - Subsidiariamente, afastar a qualificadora pois não há prova nos autos da idade da vítima, nos termos do Art. 213, §1º do CP
        - Atipicidade da conduta ou desclassificação para crime de dano qualificado, tendo em vista que a conduta de Júlio de colocar fogo no imóvel não gerou perigo a número indeterminado de pessoas e o crime de incêndio é crime de perigo comum, exigindo prova de perigo concreto.
    revisao: *a1
