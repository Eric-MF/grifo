  - id: 24-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      No dia 10 de setembro de 2014, Maria conversava na rua com amigas da escola, quando passou pelo local Túlio, jovem de 19 anos, que ficou interessado em conhecer Maria em razão da beleza desta. Um mês após se conhecerem e iniciarem um relacionamento, Túlio e Maria passaram a ter relações sexuais, apesar de Maria ter informado ao namorado que nascera em 09 de julho de 2001. Ao tomar conhecimento dos fatos, o Ministério Público denunciou Túlio pela prática do crime do Art. 217-A do Código Penal.

      Após a instrução e juntada da carteira de identidade de Maria, na qual constava seu nascimento em 09 de julho de 2001, Túlio foi condenado nos termos da denúncia, tendo ocorrido o trânsito em julgado. Dois anos após a sentença condenatória, os pais de Maria procuram os familiares de Túlio e narram que se sentiam mal pelo ocorrido, porque sempre consideraram o condenado um bom namorado para a filha. Afirmaram, ainda, que autorizavam o namoro, porque, na verdade, consideravam sua filha uma jovem, já que ela nasceu em 09 de julho de 2000, mas somente foi registrada no ano seguinte, pois tinham o sonho de sua filha ser profissional do esporte e entenderam que o registro tardio a beneficiaria profissionalmente.

      Diante de tais informações, em posse de fotografias que comprovam que Maria, de fato, nasceu em 09 de julho de 2000 e da retificação no registro civil, os familiares de Túlio procuram você na condição de advogado(a).

      Na condição de advogado(a) de Túlio, considerando apenas as informações narradas, responda aos itens a seguir.
    comando: Diante do trânsito em julgado da sentença condenatória, existe medida judicial a ser apresentada em favor de Túlio, diferente de habeas corpus, em busca da desconstituição da sentença? Justifique e indique, em caso positivo.
    gabarito: Sim, existe. A medida judicial a ser apresentada em favor de Túlio é a ação de impugnação conhecida como Revisão Criminal, com fundamento no Art. 621, inciso II ou inciso III, do Código de Processo Penal. Isso porque, após a sentença condenatória com trânsito em julgado, foi verificado que o documento de identificação de Maria era ideologicamente falso, já que constava data nascimento diferente da real. A mudança na data de nascimento de Maria altera o fundamento para condenação, tendo em vista que, na realidade, era maior de 14 anos na data dos fatos. O examinando pode, ainda, defender o cabimento do instituto da revisão criminal com base no surgimento de provas novas, após a sentença, que comprovem a inocência do acusado, quais sejam as fotografias e declarações dos pais no sentido de que a certidão de nascimento da filha era falsa e que, na verdade, Maria era maior de 14 anos na data dos fatos.
    opcoes:
      correta: A medida judicial cabível é da revisão criminal, com fundamento no Art. 621, inciso II OU III, do Código de Processo Penal, tendo em vista que a condenação foi baseada em documento comprovadamente falso OU em razão do surgimento de prova nova, após a sentença, apta a demonstrar a inocência do acusado.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
