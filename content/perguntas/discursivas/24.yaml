# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "24"
introducoes:
  peca: "Lucas, de 22 anos, foi condenado por associação para o tráfico a 6 anos no semiaberto. Depois, sofreu outra condenação definitiva, só a multa, por uma ameaça cometida antes da associação. Com um ano de pena cumprida e sem falta disciplinar, pediu a progressão. O juiz da execução negou: disse que a associação é crime hediondo, que Lucas é reincidente por causa da ameaça e que faltava cumprir 3/5 da pena. Você foi intimado da decisão em 24/11/2017."
  q1: "Arnaldo, de 72 anos, primário, deu pauladas e socos em Severino num bar, por ciúmes da neta. A denúncia fala em lesão com deformidade permanente, mas a vítima não foi achada, e não há atendimento médico nem perícia nos autos; as testemunhas só viram um soco. Arnaldo confessou e foi condenado a 3 anos, sem substituição da pena, por causa da violência."
  q2: "Túlio, de 19 anos, namorou Maria e teve relações sexuais com ela, que dizia ter nascido em 9/7/2001, como constava do registro. Foi condenado, com trânsito em julgado, por estupro de vulnerável. Anos depois, os pais de Maria contaram que ela nasceu em 9/7/2000 e foi registrada só no ano seguinte, e o registro foi retificado."
  q3: "Aroldo, Bernardo, Caio e David, pintores de residências, reuniram-se toda semana por mais de seis meses para organizar, com divisão de tarefas, crimes de receptação simples. O delegado, achando que o grupo planejava roubos, determinou sozinho, sem o juiz, a infiltração de policiais no grupo. Os quatro foram denunciados por organização criminosa."
  q4: "Pablo, com quatro condenações por crimes violentos, matou com um pedaço de pau um cachorro bravo que entrou no quintal e atacava o filho dele, de 5 anos. Foi preso em flagrante por crime contra animais, e o Ministério Público pediu a conversão do flagrante em preventiva pela reiteração criminosa."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["24-peca-1", "24-peca-3", "24-peca-4", "24-peca-5", "24-peca-7", "24-peca-8", "24-peca-10", "24-peca-11", "24-peca-12", "24-peca-13"]
perguntas:
  - id: 24-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "O juiz da execução tratou a associação para o tráfico como crime hediondo. Por que isso está errado?"
    tese: "A associação para o tráfico não é crime hediondo nem equiparado: não está no rol da lei"
    aceitos: [ [ "rol" ], [ "nao e hediondo | nao hediondo | nao e equiparado | nao equiparado" ] ]
    artigos: [ "art. 2, Lei 8.072" ]
    gabarito: "O crime de associação para o tráfico não pode ser considerado crime hediondo ou equiparado."
    revisao: { status: revisado }
  - id: 24-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Lucas é reincidente por causa da condenação pela ameaça?"
    tese: "O réu não é reincidente: a ameaça foi cometida antes da associação, e a condenação por ela veio depois"
    aceitos: [ "nao e reincidente | nao reincidente | nao ha reincidencia | primario | nao configura reincidencia" ]
    artigos: [ "art. 63, CP" ]
    gabarito: "O apenado não é tecnicamente reincidente, tendo em vista que a condenação pelo crime de ameaça foi posterior à condenação pela prática do crime de associação OU tendo em vista que a agravante não foi reconhecida na sentença que transitou em julgado, em desacordo com o Art. 63 do Código Penal"
    revisao: { status: revisado }
  - id: 24-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Por que a confissão de Arnaldo não basta para condená-lo pela lesão com deformidade permanente?"
    tese: "O crime deixa vestígios: sem exame de corpo de delito, falta a prova da materialidade, e a confissão não o supre"
    aceitos: [ [ "exame de corpo de delito" ], [ "materialidade" ], [ "vestigio*" ] ]
    artigos: [ "art. 158, CPP" ]
    gabarito: "Deveria o advogado de Arnaldo buscar sua absolvição em razão da ausência de prova da materialidade, tendo em vista que o crime deixou vestígios e não consta dos autos exame pericial. Não foi acostado boletim de atendimento médico ou exame de corpo de delito, direto ou indireto, de Severino, que sequer foi ouvido em juízo para confirmar as lesões. As testemunhas ouvidas, em que pese tenham confirmado que Arnaldo desferiu um soco na vítima, também não foram capazes de assegurar a existência de lesão corporal. Por fim, o Art. 158 do Código de Processo Penal prevê expressamente que, quando a infração deixar vestígios, é indispensável o exame de corpo de delito, não o suprindo a confissão do acusado."
    revisao: { status: revisado }
  - id: 24-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Mantida a pena de 3 anos, que benefício a defesa pode pedir para Arnaldo não cumprir a pena?"
    tese: "Suspensão condicional da pena para o maior de 70 anos (sursis etário)"
    aceitos: [ "suspensao condicional da pena | sursis" ]
    artigos: [ "art. 77, § 2º, CP" ]
    gabarito: "Sim, existe o benefício da suspensão condicional da pena, previsto no Art. 77 do Código Penal, em especial em seu parágrafo 2º, no caso concreto. Caso mantida a condenação e a pena aplicada, Arnaldo não poderia ser beneficiado com a substituição da pena privativa de liberdade por restritiva de direitos, já que o crime foi praticado mediante violência, não atendendo ao disposto no Art. 44 do Código Penal. Nada impede, porém, que seja buscada a suspensão condicional da pena, tendo em vista que todos os requisitos estão preenchidos. A regra, de acordo com o Código Penal, é que a pena aplicada em até 02 anos, respeitados os demais requisitos, possa ter sua execução suspensa. Todavia, Arnaldo era maior de 70 anos na data dos fatos, o que permite a aplicação do Art. 77, § 2º, do CP, também conhecido como sursis etário, que traz como requisito objetivo a aplicação de pena privativa de liberdade em até 4 anos e não apenas de 2 anos."
    revisao: { status: revisado }
  - id: 24-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Com o trânsito em julgado, que medida, fora o habeas corpus, pode desconstituir a condenação de Túlio?"
    tese: "Revisão criminal, por prova nova"
    aceitos: [ "revisao criminal" ]
    artigos: [ "art. 621, III, CPP", "art. 621, II, CPP" ]
    gabarito: "Sim, existe. A medida judicial a ser apresentada em favor de Túlio é a ação de impugnação conhecida como Revisão Criminal, com fundamento no Art. 621, inciso II ou inciso III, do Código de Processo Penal. Isso porque, após a sentença condenatória com trânsito em julgado, foi verificado que o documento de identificação de Maria era ideologicamente falso, já que constava data nascimento diferente da real. A mudança na data de nascimento de Maria altera o fundamento para condenação, tendo em vista que, na realidade, era maior de 14 anos na data dos fatos. O examinando pode, ainda, defender o cabimento do instituto da revisão criminal com base no surgimento de provas novas, após a sentença, que comprovem a inocência do acusado, quais sejam as fotografias e declarações dos pais no sentido de que a certidão de nascimento da filha era falsa e que, na verdade, Maria era maior de 14 anos na data dos fatos."
    revisao: { status: revisado }
  - id: 24-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que argumento de direito material a revisão deve apresentar?"
    tese: "Atipicidade da conduta: a vítima já tinha 14 anos e consentiu"
    aceitos: [ [ "atipic*" ], [ "maior de 14 | ja tinha 14 | tinha 14 | nao era menor de 14" ] ]
    artigos: [ "art. 217-A, CP" ]
    gabarito: "O argumento a ser apresentado é de atipicidade da conduta praticada por Túlio, tendo em vista que Maria era maior de 14 anos na data dos fatos. O Art. 217-A do Código Penal prevê o crime de estupro de vulnerável, sendo uma de suas hipóteses quando o agente pratica conjunção carnal ou ato libidinoso diverso com menor de 14 anos. Mesmo que Túlio acreditasse que Maria era menor de 14 anos, objetivamente ela não o era, uma vez que nasceu em 09 de julho de 2000. Provado que seu nascimento ocorreu mais de 14 anos antes dos fatos, necessária a absolvição de Túlio em razão da atipicidade da conduta. Importante destacar que os atos sexuais praticados foram consentidos por Maria, logo não há que se falar em crime de estupro do Art. 213 do Código Penal."
    revisao: { status: revisado }
  - id: 24-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "A infiltração de agentes determinada pelo delegado foi válida?"
    tese: "Nulidade da infiltração sem autorização judicial, que só cabe quando não há outros meios de prova"
    aceitos: [ "autorizacao judicial | ordem judicial | autorizacao do juiz | decisao judicial | autorizacao da autoridade judicial" ]
    artigos: [ "art. 10, Lei 12.850" ]
    gabarito: "A infiltração de agentes determinada pela autoridade policial não foi válida, pois não houve autorização judicial e porque havia outros meios de investigação para obtenção de provas, como o próprio enunciado demonstra. O Art. 3º da Lei nº 12.850/13 prevê como meio de obtenção de prova a infiltração, por policial, em atividade de investigação, na forma do Art. 11 do mesmo diploma legal. Ocorre que os artigos 10 e 11 trazem uma série de requisitos para a validade desse meio de obtenção de prova. A infiltração de agentes deverá ser precedida de circunstanciada, motivada e sigilosa autorização judicial, autorização essa que não ocorreu no caso apresentado.\n\nAdemais, além dos indícios da prática do crime de organização criminosa, necessário que as provas não possam ser obtidas por outros meios. Na hipótese apresentada, as provas poderiam ser obtidas de outra forma, tanto que assim efetivamente o foram. Diante disso, a infiltração de agentes não foi válida."
    revisao: { status: revisado }
  - id: 24-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Por que o grupo não pode ser condenado por organização criminosa?"
    tese: "Não há organização criminosa: a receptação simples tem pena máxima de até 4 anos, e o crime exige infrações mais graves"
    aceitos: [ [ "4 anos | quatro anos" ], [ "pena maxima" ] ]
    artigos: [ "art. 1, § 1º, Lei 12.850" ]
    gabarito: "A defesa deveria buscar a não condenação dos denunciados pelo fato de o crime imputado não ter sido praticado, já que não estão presentes todas as elementares do tipo. Isso porque o Art. 2º da Lei nº 12.850/13 estabelece que é crime promover, constituir, financiar ou integrar organização criminosa. Já o Art. 1º, § 1º do mesmo diploma traz o conceito de organização criminosa, definindo que seria a associação de 4 ou mais pessoas (requisito atendido), estruturalmente organizada e com divisão de tarefas, ainda que informal (requisito atendido), com objetivo de obter vantagem de qualquer natureza (requisito atendido), mediante a prática de infrações penais cujas penas máximas sejam superiores a 4 anos ou que sejam de caráter internacional (requisito não atendido). O grupo de denunciados se organizou para prática de crimes de receptação simples, cuja pena máxima não ultrapassa 4 anos. Assim, a conduta praticada não se adequa ao tipo imputado."
    revisao: { status: revisado }
  - id: 24-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que pedido evita a conversão do flagrante de Pablo em preventiva?"
    tese: "Liberdade provisória: o auto de prisão mostra que ele agiu sob excludente de ilicitude"
    aceitos: [ "liberdade provisoria" ]
    artigos: [ "art. 310, § 1º, CPP" ]
    gabarito: "A defesa de Pablo deverá formular pedido de liberdade provisória, tendo em vista que, apesar de ostentar diversas condenações pela prática de crimes graves, na situação apresentada, com base nas informações constantes do auto de prisão em flagrante, poderá o juiz verificar que Pablo agiu amparado por causa excludente da ilicitude, de modo que poderá conceder liberdade provisória, mediante termo de comparecimento a todos os atos do processo, conforme previsão do Art. 310, parágrafo único, do CPP."
    revisao: { status: revisado }
  - id: 24-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Oferecida a denúncia, que tese leva à absolvição de Pablo?"
    tese: "Estado de necessidade, que exclui a ilicitude"
    aceitos: [ "estado de necessidade" ]
    artigos: [ "art. 24, CP", "art. 23, I, CP" ]
    gabarito: "O argumento de direito material a ser apresentado é que Pablo deverá ser absolvido do crime imputado porque agiu amparado por estado de necessidade, que é causa excludente da ilicitude. Todos os requisitos estabelecidos pelo Art. 24 do CP estão preenchidos, tendo em vista que havia situação de perigo atual ao seu filho, não provocada por Pablo, e não tinha ele outra maneira de agir para proteção, tendo em vista que o cão adotava comportamento agressivo e tentava atacar a criança. Além disso, em que pese a relevência da vida de um cachorro para o seu dono, o sacrifício da vida de uma criança não era razoável exigir nas circunstâncias do caso concreto. Não há que se falar em legítima defesa, porém, pois esta pressupõe injusta agressão, o que, por sua vez, somente se configura com um comportamento humano."
    revisao: { status: revisado }
