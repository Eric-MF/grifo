  - id: 24-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      No dia 11/01/2016, Arnaldo, nascido em 01/02/1943, primário e de bons antecedentes, enquanto estava em um bar, desferiu pauladas na perna e socos na face de Severino, nascido em 30/03/1980, por acreditar que este demonstrara interesse amoroso em sua neta de apenas 16 anos. As agressões praticadas por Arnaldo geraram deformidade permanente em Severino, que, revoltado com o ocorrido, foi morar em outro estado.

      Denunciado pela prática do crime do Art. 129, § 2º, inciso IV, do Código Penal, Arnaldo confessou em juízo, durante o interrogatório, as agressões; contudo, não foram acostados aos autos boletim de atendimento médico e exame de corpo de delito da vítima, que também não foi localizada para ser ouvida. As testemunhas confirmaram ter visto Arnaldo desferir um soco em Severino, mas não viram se da agressão resultou lesão.

      Em sentença, diante da confissão, Arnaldo foi condenado a pena de 03 anos de reclusão, deixando o magistrado de substituir a pena privativa de liberdade por restritiva de direitos em virtude da violência.

      Considerando a situação narrada, na condição de advogado(a) de Arnaldo, responda aos itens a seguir.
    comando: Em sede de recurso de apelação, qual argumento poderá ser apresentado em busca da absolvição de Arnaldo? Justifique.
    gabarito: Deveria o advogado de Arnaldo buscar sua absolvição em razão da ausência de prova da materialidade, tendo em vista que o crime deixou vestígios e não consta dos autos exame pericial. Não foi acostado boletim de atendimento médico ou exame de corpo de delito, direto ou indireto, de Severino, que sequer foi ouvido em juízo para confirmar as lesões. As testemunhas ouvidas, em que pese tenham confirmado que Arnaldo desferiu um soco na vítima, também não foram capazes de assegurar a existência de lesão corporal. Por fim, o Art. 158 do Código de Processo Penal prevê expressamente que, quando a infração deixar vestígios, é indispensável o exame de corpo de delito, não o suprindo a confissão do acusado.
    opcoes:
      correta: O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
