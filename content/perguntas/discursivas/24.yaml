  - id: 24-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Pablo, que possui quatro condenações pela prática de crimes com violência ou grave ameaça à pessoa, estava no quintal de sua residência brincando com seu filho, quando ingressa em seu terreno um cachorro sem coleira. O animal adota um comportamento agressivo e começa a tentar atacar a criança de 05 anos, que brincava no quintal com o pai. Diante disso, Pablo pega um pedaço de pau que estava no chão e desfere forte golpe na cabeça no cachorro, vindo o animal a falecer.

      No momento seguinte, chega ao local o dono do cachorro, que, inconformado com a morte deste, chama a polícia, que realiza a prisão em flagrante de Pablo pela prática do crime do Art. 32 da Lei nº 9.605/98. Os fatos acima descritos são integralmente confirmados no inquérito pelas testemunhas. Considerando que Pablo é multirreincidente na prática de crimes graves, o Ministério Público se manifesta pela conversão do flagrante em preventiva, afirmando o risco à ordem pública pela reiteração delitiva.

      Considerando as informações narradas, na condição de advogado(a) de Pablo, que deverá se manifestar antes da decisão do magistrado quanto ao requerimento do Ministério Público, responda aos itens a seguir.
    comando: Qual pedido deverá ser formulado pela defesa de Pablo para evitar o acolhimento da manifestação pela conversão da prisão em flagrante em preventiva? Justifique.
    gabarito: A defesa de Pablo deverá formular pedido de liberdade provisória, tendo em vista que, apesar de ostentar diversas condenações pela prática de crimes graves, na situação apresentada, com base nas informações constantes do auto de prisão em flagrante, poderá o juiz verificar que Pablo agiu amparado por causa excludente da ilicitude, de modo que poderá conceder liberdade provisória, mediante termo de comparecimento a todos os atos do processo, conforme previsão do Art. 310, parágrafo único, do CPP.
    opcoes:
      correta: Liberdade provisória, nos termos do Art. 310, parágrafo único, do CPP, já que o juiz pode verificar, com base nas informações do auto de prisão em flagrante, que Pablo agiu amparado em causa excludente da ilicitude.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
    revisao: *a1
  - id: 24-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
      Pablo, que possui quatro condenações pela prática de crimes com violência ou grave ameaça à pessoa, estava no quintal de sua residência brincando com seu filho, quando ingressa em seu terreno um cachorro sem coleira. O animal adota um comportamento agressivo e começa a tentar atacar a criança de 05 anos, que brincava no quintal com o pai. Diante disso, Pablo pega um pedaço de pau que estava no chão e desfere forte golpe na cabeça no cachorro, vindo o animal a falecer.

      No momento seguinte, chega ao local o dono do cachorro, que, inconformado com a morte deste, chama a polícia, que realiza a prisão em flagrante de Pablo pela prática do crime do Art. 32 da Lei nº 9.605/98. Os fatos acima descritos são integralmente confirmados no inquérito pelas testemunhas. Considerando que Pablo é multirreincidente na prática de crimes graves, o Ministério Público se manifesta pela conversão do flagrante em preventiva, afirmando o risco à ordem pública pela reiteração delitiva.

      Considerando as informações narradas, na condição de advogado(a) de Pablo, que deverá se manifestar antes da decisão do magistrado quanto ao requerimento do Ministério Público, responda aos itens a seguir.
    comando: Sendo oferecida denúncia, qual argumento de direito material poderá ser apresentado em busca da absolvição de Pablo? Justifique.
    gabarito: O argumento de direito material a ser apresentado é que Pablo deverá ser absolvido do crime imputado porque agiu amparado por estado de necessidade, que é causa excludente da ilicitude. Todos os requisitos estabelecidos pelo Art. 24 do CP estão preenchidos, tendo em vista que havia situação de perigo atual ao seu filho, não provocada por Pablo, e não tinha ele outra maneira de agir para proteção, tendo em vista que o cão adotava comportamento agressivo e tentava atacar a criança. Além disso, em que pese a relevência da vida de um cachorro para o seu dono, o sacrifício da vida de uma criança não era razoável exigir nas circunstâncias do caso concreto. Não há que se falar em legítima defesa, porém, pois esta pressupõe injusta agressão, o que, por sua vez, somente se configura com um comportamento humano.
    opcoes:
      correta: A existência de estado de necessidade, nos termos do Art. 24 do CP OU Art. 23, inciso I, do CP, que funciona como causa excludente da ilicitude.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - Sim, pois Miguel preencheu os requisitos do decreto. OU Sim, pois Miguel preencheu o requisito temporal e a falta grave ocorreu após o decreto. OU Sim, com base no princípio da legalidade. OU Sim, pois o juiz não pode estabelecer outros requisitos que não constem expressamente no decreto.
        - O argumento é que a vantagem foi oferecida para particular e não para funcionário público, logo não configurado crime contra a Administração Pública.
        - O recurso cabível é o Recurso em Sentido Estrito, nos termos do Art. 581, inciso XV, do CPP. O argumento de direito processual é que a apelação deveria ser admitida, pois é o recurso adequado à impugnação das sentenças condenatórias, ainda que se recorra apenas de parte delas.
    revisao: *a1
