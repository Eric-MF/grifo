      (valor: 5,00)
    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: "Desenvolvimento jurídico acerca da impossibilidade de se absolver sumariamente pela inimputabilidade por não ser a única tese defensiva alegada na primeira fase do júri e consequente violação ao art. 415, parágrafo único, do CPP. Obs.: a mera indicação do artigo não pontua."
    opcoes:
      correta: "Desenvolvimento jurídico acerca da impossibilidade de se absolver sumariamente pela inimputabilidade por não ser a única tese defensiva alegada na primeira fase do júri e consequente violação ao art. 415, parágrafo único, do CPP. Obs.: a mera indicação do artigo não pontua."
      erradas:
        - Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
        - Reconhecimento da causa de diminuição de pena da tentativa, já que o crime não se consumou por circunstâncias alheias à vontade dos agentes OU porque não houve subtração do dinheiro que estava no caixa do estabelecimento OU porque não houve inversão da posse como exige a Súmula 582 do STJ.
        - Da tese do afastamento da agravante da embriaguez preordenada.
        - Subsidiariamente, aplicação de pena base no mínimo legal, já que as circunstâncias do Art. 59 são favoráveis.
        - Incabível o reinício da contagem dos prazos do indulto e livramento condicional em razão do princípio da legalidade, que também é aplicável na execução penal.
    revisao: *a1
