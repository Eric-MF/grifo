# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "07"
introducoes:
  peca: "Logo depois do parto, Ana, sob influência do estado puerperal atestada em laudo, bateu repetidas vezes a cabeça do filho recém-nascido na parede, matando-o. Foi denunciada no Tribunal do Júri por homicídio triplamente qualificado. Nas alegações finais, a defesa sustentou que Ana não praticou o fato e, só alternativamente, que seria inimputável. O juiz absolveu Ana sumariamente por inimputabilidade, por causa do estado puerperal. O Ministério Público, intimado em 11/1/2011, não recorreu. Em 20/1/2011, o pai da vítima procura você para recorrer como assistente da acusação."
  q3: "Maria, deprimida, falava em se matar. João, querendo a morte dela, passou a visitá-la todos os dias para incentivá-la a pular da janela. Um dia, Maria pulou e, por sorte, sofreu só arranhões."
  q4: "Na véspera do aniversário de 18 anos da namorada, Joana, Maurício trocou com a própria mãe um cheque de R$ 20 mil que sabia não ter fundos e gastou R$ 18 mil em três dias de luxo com Joana, num hotel. Todos os pagamentos foram feitos por ele, em dinheiro."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["07-peca-3", "07-peca-4", "07-peca-5", "07-peca-8-1", "07-peca-8-2", "07-q3-a"]
perguntas:
  - id: 07-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "A defesa alegou que Ana não praticou o fato e, só alternativamente, a inimputabilidade. Por que o juiz não podia absolvê-la sumariamente pela inimputabilidade?"
    tese: "Vedação da absolvição sumária por inimputabilidade quando ela não é a única tese defensiva"
    aceitos: [ "unica tese | unica tese defensiva | nao era a unica | outra tese | outras teses" ]
    artigos: [ "art. 415, parágrafo único, CPP" ]
    gabarito: "Desenvolvimento jurídico acerca da impossibilidade de se absolver sumariamente pela inimputabilidade por não ser a única tese defensiva alegada na primeira fase do júri e consequente violação ao art. 415, parágrafo único, do CPP. Obs.: a mera indicação do artigo não pontua."
    revisao: { status: revisado }
  - id: 07-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "O juiz tratou o estado puerperal como causa de inimputabilidade. Que erro jurídico há nisso?"
    tese: "O estado puerperal é elementar do infanticídio, não causa de inimputabilidade"
    aceitos: [ [ "elementar | elemento" ], [ "infanticidio" ] ]
    artigos: [ "art. 123, CP" ]
    gabarito: "Desenvolvimento jurídico acerca da impossibilidade de se absolver sumariamente pela inimputabilidade por não ser o estado puerperal considerado como tal, já que é elemento do tipo no art. 123 do CP.. Obs.: a mera indicação do artigo não pontua."
    revisao: { status: revisado }
  - id: 07-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "O Ministério Público não recorreu. Qual o prazo para o pai da vítima, ainda não habilitado como assistente, apelar?"
    tese: "Apelação do ofendido não habilitado como assistente em 15 dias, contados do fim do prazo do Ministério Público"
    aceitos: [ "15 dias | quinze dias" ]
    artigos: [ "art. 598, parágrafo único, CPP" ]
    gabarito: "Indicação do prazo (art. 598, parágrafo único, do CPP)."
    revisao: { status: revisado }
  - id: 07-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Se Maria tivesse sofrido lesão corporal grave na queda, por que crime João responderia?"
    tese: "Induzimento, instigação ou auxílio ao suicídio, com resultado lesão corporal grave"
    aceitos: [ "induzimento | instigacao | auxilio ao suicidio | 122" ]
    artigos: [ "art. 122, § 1º, CP", "art. 122, CP" ]
    gabarito: "O examinando deve responder, no item ‘A’, que João não cometeu qualquer crime, pois o delito descrito no art. 122 do CP, o qual prevê a conduta de instigação, auxílio ou induzimento ao suicídio, não admite a forma tentada (art. 14, II do CP), sendo certo que tal delito somente se consuma com a ocorrência de lesões corporais graves ou morte. Nesse sentido, como Maria teve apenas alguns arranhões, não houve crime.\n\nTodavia, com o fim de privilegiar a demonstração de conhecimento doutrinário, será aceita como resposta correta ao item ‘A’, a indicação de que haveria crime, mas que o fato não seria punível por faltar condição objetiva de punibilidade. Nesse caso específico, o examinando deverá demonstrar conhecimento sobre o conceito analítico de crime (fato típico, antijurídico e culpável), indicando que a punibilidade não o integra.\n\nAinda quanto ao item ‘A’, é indispensável a indicação do dispositivo em análise. Portanto, afirmações vagas e genéricas não são passíveis de pontuação.\n\nJá no item ‘B’, o examinando deveria responder que ante a ocorrência de lesões corporais de natureza grave em Maria, a condição jurídica de João seria alterada, passando ele a responder pelo delito previsto no art. 122 do CP na modalidade consumada.\n\nRessalte-se que levando em consideração a natureza do Exame de Ordem, não será atribuída pontuação para respostas com teses contraditórias, ou mesmo sugestiva de delito na modalidade tentada. Ademais, considera-se errada a resposta indicativa de configuração de concurso de crimes ou a fundamentação isolada.\n\nPelo mesmo motivo exposto no item ‘A’ (impossibilidade de consideração de afirmações vagas ou genéricas), também não é passível de pontuação a resposta, no item ‘B’, que não indique, de maneira expressa, o artigo legal a que se refere a questão. Desse modo, a mera referência à pena de reclusão de 1 a 3 anos, ou seja, a mera indicação do preceito secundário do tipo, dissociada da tipificação da conduta, também não é pontuada.\n\nPor fim, também não será pontuada a simples transcrição do artigo, dissociada da demonstração de conhecimento doutrinário."
    revisao: { status: revisado }
  - id: 07-q4-a
    categoria: discursiva
    parte: q4
    item: "A.3"
    pergunta: "Maurício enganou a própria mãe com o cheque sem fundos. Que tese de defesa impede que ele seja punido por esse estelionato?"
    tese: "A escusa absolutória do crime patrimonial contra ascendente (isenção de pena)"
    aceitos: [ "escusa absolutoria | isencao de pena | isento de pena | imunidade" ]
    artigos: [ "art. 181, II, CP" ]
    gabarito: "Para garantir pontuação, o examinando deveria, no item ‘A’, deixar expresso que Joana não cometeu qualquer crime porque não houve sequer conduta de sua parte. Cabe ressaltar que somente será aceita, como fundamento para essa hipótese, a ausência de conduta, levando em consideração o conhecimento teórico exigido no Exame de Ordem.\n\nAssim, descabe analisar a existência de elemento subjetivo (dolo ou culpa), ilicitude ou culpabilidade, pois tais somente seriam apreciados quando houvesse conduta. Consequentemente, a resposta que trouxer apenas tal análise (sem mencionar a conduta) não será pontuada no item respectivo.\n\nAinda no tocante ao item ‘A’, o examinando deverá indicar que Maurício, diferentemente de Joana, cometeu crime, qual seja, estelionato (OU que teria praticado a conduta descrita no art. 171 caput do CP), mas que poderia alegar em sua defesa a escusa absolutória prevista no art. 181, II do CP.\n\nSobre esse ponto, não será passível de pontuação a mera indicação do dispositivo legal, dissociada da argumentação exigida.\n\nDe igual modo, não será pontuada nenhuma outra modalidade de estelionato senão aquela descrita no caput do art. 171 do CP. Ressalte-se que dados não descritos no enunciado não podem ser presumidos pelos examinandos.\n\nTambém não será passível de pontuação a indicação genérica do art. 181 do CP, sem a especificação do inciso adequado ou de argumentação pertinente ao inciso.\n\nAdemais, aplicação da escusa absolutória não conduz à atipicidade da conduta. A conduta continua típica, ilícita e culpável, havendo apenas opção legislativa pela não imposição de sanção de natureza penal, embora a sentença possa produzir efeitos civis.\n\nEm relação ao item ‘B’, a atribuição de pontos estaria condicionada à expressa argumentação no sentido de que a condição jurídica de Maurício seria alterada na medida em que a isenção de pena prevista no Código Penal não se aplica aos crimes de roubo (OU à prática da conduta descrita no art. 157 caput do CP), nos termos do art.183, I do CP. Portanto, Maurício seria processado e apenado pelo crime cometido.\n\nCumpre salientar que a mera indicação de artigo legal, dissociada da correta argumentação (em qualquer um dos itens), não pode ser pontuada. De igual modo, a mera indicação, no item ‘B’, de que não haveria isenção de pena (ou de que não se aplicaria o art. 181, II do CP por força do disposto no artigo 183, I, do CP), sem a correta tipificação da conduta, não é passível de pontuação.\n\nAlém disso, levando em conta que o delito de roubo não se confunde com a extorsão, não será admitida fungibilidade entre as condutas de forma a se considerar qualquer das duas como a prática empreendida por Maurício.\n\nPor fim, não poderá ser considerada correta a resposta que imponha a causa de aumento de pena prevista no parágrafo segundo, inciso I, do artigo 157 do CP. Isso porque a controvérsia acerca da incidência da referida causa de aumento quanto ao uso de arma de brinquedo foi suficientemente solucionada no âmbito do Superior Tribunal de Justiça, que, em 2001, cancelou o verbete sumular n. 174, no julgamento do RESP 213.054-SP."
    revisao: { status: revisado }
  - id: 07-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "E se Maurício tivesse ameaçado a mãe com uma pistola de brinquedo para conseguir os R$ 20 mil, ainda seria isento de pena?"
    tese: "Sem isenção de pena: seria roubo, e a escusa absolutória não vale para crime com grave ameaça"
    aceitos: [ "roubo" ]
    artigos: [ "art. 183, I, CP", "art. 157, CP" ]
    gabarito: "Para garantir pontuação, o examinando deveria, no item ‘A’, deixar expresso que Joana não cometeu qualquer crime porque não houve sequer conduta de sua parte. Cabe ressaltar que somente será aceita, como fundamento para essa hipótese, a ausência de conduta, levando em consideração o conhecimento teórico exigido no Exame de Ordem.\n\nAssim, descabe analisar a existência de elemento subjetivo (dolo ou culpa), ilicitude ou culpabilidade, pois tais somente seriam apreciados quando houvesse conduta. Consequentemente, a resposta que trouxer apenas tal análise (sem mencionar a conduta) não será pontuada no item respectivo.\n\nAinda no tocante ao item ‘A’, o examinando deverá indicar que Maurício, diferentemente de Joana, cometeu crime, qual seja, estelionato (OU que teria praticado a conduta descrita no art. 171 caput do CP), mas que poderia alegar em sua defesa a escusa absolutória prevista no art. 181, II do CP.\n\nSobre esse ponto, não será passível de pontuação a mera indicação do dispositivo legal, dissociada da argumentação exigida.\n\nDe igual modo, não será pontuada nenhuma outra modalidade de estelionato senão aquela descrita no caput do art. 171 do CP. Ressalte-se que dados não descritos no enunciado não podem ser presumidos pelos examinandos.\n\nTambém não será passível de pontuação a indicação genérica do art. 181 do CP, sem a especificação do inciso adequado ou de argumentação pertinente ao inciso.\n\nAdemais, aplicação da escusa absolutória não conduz à atipicidade da conduta. A conduta continua típica, ilícita e culpável, havendo apenas opção legislativa pela não imposição de sanção de natureza penal, embora a sentença possa produzir efeitos civis.\n\nEm relação ao item ‘B’, a atribuição de pontos estaria condicionada à expressa argumentação no sentido de que a condição jurídica de Maurício seria alterada na medida em que a isenção de pena prevista no Código Penal não se aplica aos crimes de roubo (OU à prática da conduta descrita no art. 157 