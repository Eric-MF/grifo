      Considerando a situação hipotética, na condição de advogado de Flávio, responda aos itens a seguir.
    comando: Qual argumento de direito material a ser alegado para combater a decisão de primeiro grau? Justifique.
    gabarito: |-
      No mérito, o examinando deveria demonstrar o equívoco da decisão do magistrado. A hipótese narrada indica que a ingestão de bebida alcoólica foi consciente e intencional, ainda que o resultado embriaguez não tenha sido.

      Contudo, prevê o Art. 28, inciso II, do Código Penal que a embriaguez, voluntária ou culposa, não exclui a imputabilidade penal. Assim, somente a embriaguez completa, decorrente de caso fortuito ou força maior, poderia afastar a culpabilidade, levando a uma absolvição.

      “Qualquer semelhança nominal e/ou situacional presente nos enunciados das questões é mera coincidência.”
    opcoes:
      correta: O argumento é que a embriaguez de Paulo foi voluntária ou culposa, logo não exclui a imputabilidade penal, na forma do Art. 28, inciso II, do CP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
