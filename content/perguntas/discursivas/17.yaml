      erradas:
        - "Prescrição da pretensão punitiva: pena máxima de 4 anos prescreve em 8, mas a ré era menor de 21 anos e o prazo corre pela metade (CP, arts. 109, IV, 115 e 126)."
        - O crime de lesão corporal leve do Art. 129, § 9º, do CP é de ação penal pública condicionada à representação, nos termos do Art. 88 da Lei nº 9.099/95, e a vítima demonstrou não ter interesse em ver o autor do fato responsabilizado criminalmente
        - Ilegitimidade/ilicitude da interceptação telefônica por tratar-se de crime apenado com detenção OU por não terem sido esgotados previamente os meios de investigação.
        - Preliminarmente, nulidade dos atos de instrução ou da sentença
        - Preliminarmente, nulidade na oitiva das vítimas, tendo em vista que o mero decurso de tempo não é fundamento idôneo para produção antecipada de provas, nos termos do Art. 225 do CPP, ou Art. 564, inciso IV, do CPP, ou Súmula 455 do STJ.
