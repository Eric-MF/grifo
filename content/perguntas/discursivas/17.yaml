        - Existência de Procuração com poderes especiais de acordo com o artigo 44 do CPP em anexo ou menção acerca de sua existência no corpo da qualificação.
        - porque ocorreu cerceamento de defesa OU porque houve violação ao princípio da ampla defesa, nos termos do Art. 5º, LV, CRFB.
        - No mérito, pedido de absolvição sumária, diante da manifesta causa de isenção de pena ou excludente de culpabilidade, nos termos do Art. 415, inciso IV, do CPP
