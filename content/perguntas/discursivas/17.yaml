  - id: 17-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Ruth voltava para sua casa falando ao celular, na cidade de Santos, quando foi abordada por Antônio, que afirmou: “Isso é um assalto! Passa o celular ou verá as consequências!”. Diante da grave ameaça, Ruth entregou o telefone e o agente fugiu em sua motocicleta em direção à cidade de Mogi das Cruzes, consumando o crime.

      Nervosa, Ruth narrou o ocorrido para o genro Thiago, que saiu em seu carro, junto com um policial militar, à procura de Antônio.

      Com base na placa da motocicleta anotada por Ruth, Thiago localizou Antônio, já em Mogi das Cruzes, ainda na posse do celular da vítima e também com uma faca em sua cintura, tendo o policial efetuado a prisão em flagrante. Em razão dos fatos, Antônio foi denunciado pela prática do crime previsto no Art. 157, § 2º, inciso I, do Código Penal, perante uma Vara Criminal da comarca de Mogi das Cruzes, ficando os familiares do réu preocupados, porque todos da região sabem que o magistrado, em atuação naquela Vara, é extremamente severo. A defesa foi intimada a apresentar resposta à acusação.

      Considerando que o flagrante foi regular e que os fatos são verdadeiros, responda, na qualidade de advogado(a)

      de Antônio, aos itens a seguir.
    comando: Que medida processual poderia ser adotada para evitar o julgamento perante a Vara Criminal de Mogi das Cruzes? Justifique.
    gabarito: A medida processual é exceção de incompetência. Pela narrativa apresentada no enunciado é possível concluir que o crime foi praticado, inclusive consumado, na cidade de Santos, logo, na forma do Art. 70 do Código de Processo Penal, o juízo competente será o da comarca de Santos e não o de Mogi das Cruzes. Considerando a incompetência territorial existente, deveria o advogado de Antônio formular uma exceção de incompetência, no prazo de defesa, nos termos do Art. 108 do Código de Processo Penal. A Banca considerou também como resposta correta a apresentação de preliminar de incompetência na resposta à acusação, nos termos do Art. 396-A, CPP, diante do entendimento existente de que todas as regras de competência no Processo Penal têm natureza absoluta.
    opcoes:
      correta: A medida processual a ser adotada é a exceção de incompetência ou a arguição de preliminar de incompetência na resposta à acusação, nos termos do Art. 108 ou 396-A, do CPP, respectivamente, pois o crime se consumou em Santos, logo o juízo competente é o dessa comarca.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
    revisao: *a1
