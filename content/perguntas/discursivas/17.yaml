  - id: 17-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      No interior de uma casa de festas, Paulo estava bebendo whisky com sua namorada Roberta para comemorar um ano de namoro. Em determinado momento, chegou Flávio ao local, ex-namorado de Roberta, indo de imediato cumprimentá-la. Insatisfeito, Paulo foi em direção a Flávio e desferiu três socos em sua cabeça, causando lesões corporais gravíssimas. Paulo foi denunciado pela prática do crime do Art. 129, § 2º, do Código Penal, sendo absolvido em sentença de primeiro grau, entendendo o magistrado que, apesar de Paulo ter ingerido grande quantidade de bebida alcoólica conscientemente, a embriaguez não foi voluntária, logo naquele momento Paulo era inimputável.

      Flávio procura você na condição de advogado, esclarece que não houve habilitação como assistente de acusação e informa que o prazo de recurso do Ministério Público se esgotou no dia anterior, tendo o Promotor se mantido inerte.

      Considerando a situação hipotética, na condição de advogado de Flávio, responda aos itens a seguir.
    comando: Qual medida processual deve ser adotada pelo ofendido para superar a decisão do magistrado e em qual prazo? Justifique.
    gabarito: O ofendido, por intermédio de um advogado, poderia apresentar recurso de apelação, ainda que não tenha se habilitado, em momento anterior, como assistente de acusação. Prevê o Art. 598 do Código de Processo Penal que, se da sentença não for interposta apelação pelo Ministério Público no prazo legal, o ofendido, ainda que não tenha se habilitado como assistente de acusação, poderá interpor apelação. O prazo será de 15 dias a partir do fim do prazo do Ministério Público. No caso, houve omissão do Ministério Público, então caberá o recurso do ofendido, sendo certo que, diante da sentença absolutória, além da legitimidade existe interesse recursal. Deve ser esclarecido que não basta o examinando afirmar que deveria Flavio habilitar-se como assistente de acusação, caso esta afirmação não venha acompanhada da possibilidade de interposição de recurso de apelação.
    opcoes:
      correta: O ofendido poderia interpor recurso de apelação, na forma do Art. 598 do CPP, sendo o prazo de 15 dias.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento é que houve concurso formal de crimes, tendo em vista que, com uma só ação, foram praticados dois delitos, nos termos do Art. 70 do CP.
        - O argumento é de que a prova é ilícita, tendo em vista que não poderia ter havido transcrição da conversa travada entre Flávio e seu advogado, que tem direito ao sigilo ou inviolabilidade das comunicações, não sendo o advogado coautor de crimes e nem figurando como investigado, nos termos do Art. 7º, inciso II ou III, da Lei nº 8.906/94 ou Art. 157 caput do CPP ou Art. 5º, inciso LVI da CRFB/88.
    revisao: *a1
