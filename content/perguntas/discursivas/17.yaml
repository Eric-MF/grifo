    comando: "No mérito, caso Antônio confesse os fatos durante a instrução, qual argumento de direito material poderia ser formulado para garantir uma punição mais branda do que a pleiteada na denúncia? Justifique. (Valor:"
    gabarito: |-
      Envolvendo o mérito, deve o examinando expor que, ainda que confessados os fatos, não houve emprego de arma na hipótese, de modo que deveria ser afastada a majorante do Art. 157, § 2º, inciso I, do Código Penal. A hipótese narrada deixa claro que Antônio abordou Ruth e empregou grave ameaça, mas que, em momento algum, utilizou, mencionou ou mostrou a arma que portava quando de sua prisão em flagrante. O argumento de que a faca, por ser arma branca, não é suficiente para o reconhecimento da causa de aumento não é adequado. O “Qualquer semelhança nominal e/ou situacional presente nos enunciados das questões é mera coincidência.”

      que se exigia era a demonstração de que, no caso concreto, não houve efetivo emprego da arma, como exige o dispositivo supramencionado.
    opcoes:
      correta: O argumento a ser apresentado é que foi praticado um crime de roubo simples OU que deve ser afastada a causa de aumento/majorante do Art. 157, § 2º, inciso I, do CP, pois não houve efetivo emprego de arma.
