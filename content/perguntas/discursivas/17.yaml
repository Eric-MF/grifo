# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "17"
introducoes:
  peca: "Daniel, de 19 anos, filho da empregada doméstica de uma família, soube que os patrões viajavam e, em 2/1/2010, pegou o carro deles para passear com a namorada, com a intenção de devolvê-lo com o tanque cheio. Foi abordado pela polícia na entrada da garagem, quando o devolvia, e confessou. Denunciado por furto, sem proposta de suspensão do processo porque responde a outra ação penal (porte de arma, ainda sem sentença), teve a denúncia recebida em 18/3/2010. O Ministério Público pediu a condenação, e a defesa foi intimada para os memoriais em 17/7/2015."
  q1: "Rodrigo, primário, rompeu o cadeado de uma loja fechada e levou caixas de cigarro de R$ 1.300, recuperadas quando foi abordado na rua e admitiu o furto. A perícia não foi ao local, e os policiais não viram a loja. Ele foi denunciado por furto qualificado pelo rompimento de obstáculo."
  q2: "Numa discussão, Jorge ameaçou de morte a esposa, Glória, que representou contra ele e pediu medidas protetivas. A pedido do Ministério Público, o juiz deferiu a proibição de aproximação e, ao mesmo tempo, decretou a prisão preventiva de Jorge, que é primário."
  q3: "Em Santos, Antônio tomou o celular de Ruth dizendo: 'Isso é um assalto! Passa o celular ou verá as consequências!', e fugiu de moto. Foi preso já em Mogi das Cruzes, com o celular e uma faca na cintura, que não chegou a usar, e foi denunciado por roubo com emprego de arma numa Vara Criminal de Mogi das Cruzes."
  q4: "Paulo bebeu whisky, por vontade própria, numa festa e deu três socos em Flávio, ex-namorado da sua namorada, causando lesões gravíssimas. O juiz o absolveu, por entender que, por causa da bebida, ele estava inimputável. O Ministério Público não recorreu, e Flávio, que não se habilitou como assistente, procura você."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["17-peca-1", "17-peca-9", "17-peca-10", "17-peca-11", "17-q2-b"]
perguntas:
  - id: 17-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: preliminar
    pergunta: "Daniel tinha 19 anos no fato, e a denúncia foi recebida em 18/3/2010. Que preliminar a defesa deve alegar nos memoriais, em julho de 2015?"
    tese: "Prescrição da pretensão punitiva, com o prazo pela metade (menor de 21 anos)"
    aceitos: [ "prescri*" ]
    artigos: [ "art. 109, IV, CP", "art. 115, CP", "art. 107, IV, CP" ]
    gabarito: "Preliminarmente: Extinção da punibilidade, em razão da prescrição da pretensão punitiva pela pena em abstrato, pois ultrapassados 4 anos desde o recebimento da denúncia, considerando a redução do prazo pela menoridade relativa, com fulcro no Art. 107, IV, do CP OU no Art. 109, IV, c/c Art. 115, ambos do CP."
    revisao: { status: revisado }
  - id: 17-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: merito
    pergunta: "Daniel pegou o carro só para passear e ia devolvê-lo. Que tese de mérito a defesa deve sustentar?"
    tese: "O furto de uso é atípico: falta a intenção de ficar com a coisa (para si ou para outrem)"
    aceitos: [ [ "furto de uso" ], [ "atipic*" ], [ "para si ou para outrem" ] ]
    artigos: [ "art. 155, CP", "art. 386, III, CPP" ]
    gabarito: "No mérito: Absolvição OU atipicidade, pois não houve dolo de ter a coisa para si OU não há a elementar “ para si ou para outrem” OU “furto de uso” é indiferente penal"
    revisao: { status: revisado }
  - id: 17-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Na pena-base, o processo em curso por porte de arma pode ser usado como maus antecedentes?"
    tese: "Ações penais em curso não são maus antecedentes nem agravam a pena-base (presunção de inocência)"
    aceitos: [ [ "nao pode | nao podem | vedad* | nao servem | nao configura* | nao caracteriza*" ], [ "presuncao de inocencia | estado de inocencia" ] ]
    artigos: [ "Súmula 444 STJ" ]
    gabarito: "Subsidiariamente, em caso de condenação: Pena base no mínimo legal, pois a existência de ações penais em curso não justifica o reconhecimento de maus antecedentes. Violação do princípio da presunção de inocência"
    revisao: { status: revisado }
  - id: 17-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Que atenuante pode ser reconhecida em favor de Daniel?"
    tese: "Atenuante da menoridade relativa (ou da confissão espontânea)"
    aceitos: [ [ "menoridade | menor de 21" ], [ "confissao" ] ]
    artigos: [ "art. 65, I, CP", "art. 65, III, d, CP" ]
    gabarito: "Reconhecimento de atenuante: menoridade relativa OU confissão espontânea, na forma do Art. 65, I, do CP OU Art. 65, III, “d”, do CP, respectivamente."
    revisao: { status: revisado }
  - id: 17-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Em caso de condenação, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto"
    aceitos: [ "aberto" ]
    artigos: [ "art. 33, § 2º, c, CP" ]
    gabarito: "Regime inicial aberto para início do cumprimento de pena, na forma do art. 33, §2º, “c”, do CP."
    revisao: { status: revisado }
  - id: 17-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Além do regime, o que a defesa deve pedir quanto à espécie de pena?"
    tese: "A substituição da pena privativa de liberdade por restritivas de direitos"
    aceitos: [ "substitui*" ]
    artigos: [ "art. 44, CP" ]
    gabarito: "Substituição da pena privativa de liberdade por restritiva de direitos, na forma do Art. 44 do CP."
    revisao: { status: revisado }
  - id: 17-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Sem perícia no local, que tese a defesa deve sustentar quanto à tipificação?"
    tese: "Desclassificação para furto simples: sem perícia, não há prova do rompimento de obstáculo"
    aceitos: [ [ "furto simples" ], [ "qualificadora", "afast* | exclu* | decote | nao incid*" ] ]
    artigos: [ "art. 171, CPP", "art. 158, CPP" ]
    gabarito: "Foi imputado um crime de furto qualificado, pois houve rompimento de obstáculo. Ocorre que, para a punição por essa modalidade qualificada do crime, é necessária a realização de exame de local e a constatação do rompimento de obstáculo por prova pericial (Art. 158 do CPP). Assim têm decidido de maneira recorrente os Tribunais Superiores, não sendo suficiente a simples afirmação dos policiais, no sentido de que Rodrigo narrou que tinha subtraído os cigarros, pois essa confirmação foi apenas quanto à subtração, e os agentes da lei nem mesmo compareceram ao estabelecimento para verificar se, de fato, houve tal rompimento. Assim, diante da ausência de comprovação pericial da qualificadora, o crime praticado foi de furto simples."
    revisao: { status: revisado }
  - id: 17-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Acolhida essa tese, Rodrigo pode ser condenado de imediato?"
    tese: "Antes da condenação, o Ministério Público deve poder propor a suspensão condicional do processo"
    aceitos: [ "suspensao condicional do processo | sursis processual" ]
    artigos: [ "Súmula 337 STJ", "art. 89, Lei 9.099" ]
    gabarito: "Em caso de acolhimento da tese defensiva, com a consequente desclassificação da conduta de Rodrigo de furto qualificado para furto simples, não poderá ser o acusado de imediato condenado, devendo o magistrado abrir vista para que o Ministério Público se manifeste sobre a possibilidade de oferecer proposta de suspensão condicional do processo, pois a pena mínima passou a ser de 01 ano de reclusão. Nesse sentido é o enunciado 337 da Súmula do STJ, que permite que, em caso de desclassificação ou procedência parcial, seja oferecida proposta de suspensão condicional do processo, ainda que encerrada a instrução.\n\n“Qualquer semelhança nominal e/ou situacional presente nos enunciados das questões é mera coincidência.”"
    revisao: { status: revisado }
  - id: 17-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "A preventiva de Jorge, decretada junto com a medida protetiva, é válida?"
    tese: "Descabimento da preventiva: ela só cabe para garantir a execução de medida protetiva descumprida"
    aceitos: [ [ "descumpri*" ], [ "garantir a execucao | assegurar a execucao" ] ]
    artigos: [ "art. 313, III, CPP" ]
    gabarito: "Deveria o examinando demonstrar que a prisão preventiva decretada em desfavor de Jorge, com base no Art. 313, inciso III, do Código de Processo Penal, não é válida no caso concreto. De início, é possível perceber que os requisitos previstos no Art. 313, incisos I e II, do CPP não estão presentes, pois a pena máxima para o crime praticado é inferior a 04 anos e Jorge é primário e de bons antecedentes. Em relação ao inciso III do Art. 313, não basta que o crime seja praticado em situação de violência doméstica e familiar contra mulher. Para regularidade da prisão, é preciso que seja aplicada para garantir execução de medida protetiva de urgência. Dessa forma, somente será cabível caso exista uma medida protetiva anteriormente aplicada e descumprida ou, ao menos, que, após aplicação da medida protetiva, exista risco concreto de descumprimento. No caso, de imediato o magistrado, após requerimento do Ministério Público, decretou a prisão preventiva, sem que houvesse medida protetiva de urgência previamente aplicada. Assim, não foi válida a prisão."
    revisao: { status: revisado }
  - id: 17-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que medida a defesa pode usar para evitar o julgamento em Mogi das Cruzes?"
    tese: "A exceção de incompetência: o roubo se consumou em Santos"
    aceitos: [ "incompetencia" ]
    artigos: [ "art. 108, CPP", "art. 70, CPP", "art. 396-A, CPP" ]
    gabarito: "A medida processual é exceção de incompetência. Pela narrativa apresentada no enunciado é possível concluir que o crime foi praticado, inclusive consumado, na cidade de Santos, logo, na forma do Art. 70 do Código de Processo Penal, o juízo competente será o da comarca de Santos e não o de Mogi das Cruzes. Considerando a incompetência territorial existente, deveria o advogado de Antônio formular uma exceção de incompetência, no prazo de defesa, nos termos do Art. 108 do Código de Processo Penal. A Banca considerou também como resposta correta a apresentação de preliminar de incompetência na resposta à acusação, nos termos do Art. 396-A, CPP, diante do entendimento existente de que todas as regras de competência no Processo Penal têm natureza absoluta."
    revisao: { status: revisado }
  - id: 17-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Se Antônio confessar, que argumento de direito material garante uma pena menor do que a pedida na denúncia?"
    tese: "Afastamento da causa de aumento: a faca não foi empregada, e o crime é roubo simples"
    aceitos: [ [ "roubo simples" ], [ "majorante | causa de aumento", "afast* | exclu* | decote | nao incid*" ] ]
    artigos: [ "art. 157, CP" ]
    gabarito: "Envolvendo o mérito, deve o examinando expor que, ainda que confessados os fatos, não houve emprego de arma na hipótese, de modo que deveria ser afastada a majorante do Art. 157, § 2º, inciso I, do Código Penal. A hipótese narrada deixa claro que Antônio abordou Ruth e empregou grave ameaça, mas que, em momento algum, utilizou, mencionou ou mostrou a arma que portava quando de sua prisão em flagrante. O argumento de que a faca, por ser arma branca, não é suficiente para o reconhecimento da causa de aumento não é adequado. O “Qualquer semelhança nominal e/ou situacional presente nos enunciados das questões é mera coincidência.”\n\nque se exigia era a demonstração de que, no caso concreto, não houve efetivo emprego da arma, como exige o dispositivo supramencionado."
    revisao: { status: revisado }
  - id: 17-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que recurso Flávio pode interpor contra a absolvição, e em que prazo?"
    tese: "Apelação supletiva do ofendido não habilitado, em 15 dias"
    aceitos: [ "apelacao", "15 dias | quinze dias" ]
    artigos: [ "art. 598, parágrafo único, CPP" ]
    gabarito: "O ofendido, por intermédio de um advogado, poderia apresentar recurso de apelação, ainda que não tenha se habilitado, em momento anterior, como assistente de acusação. Prevê o Art. 598 do Código de Processo Penal que, se da sentença não for interposta apelação pelo Ministério Público no prazo legal, o ofendido, ainda que não tenha se habilitado como assistente de acusação, poderá interpor apelação. O prazo será de 15 dias a partir do fim do prazo do Ministério Público. No caso, houve omissão do Ministério Público, então caberá o recurso do ofendido, sendo certo que, diante da sentença absolutória, além da legitimidade existe interesse recursal. Deve ser esclarecido que não basta o examinando afirmar que deveria Flavio habilitar-se como assistente de acusação, caso esta afirmação não venha acompanhada da possibilidade de interposição de recurso de apelação."
    revisao: { status: revisado }
  - id: 17-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Qual argumento de direito material contra a absolvição de Paulo?"
    tese: "A embriaguez voluntária não exclui a imputabilidade"
    aceitos: [ "voluntaria | culposa" ]
    artigos: [ "art. 28, II, CP" ]
    gabarito: "No mérito, o examinando deveria demonstrar o equívoco da decisão do magistrado. A hipótese narrada indica que a ingestão de bebida alcoólica foi consciente e intencional, ainda que o resultado embriaguez não tenha sido.\n\nContudo, prevê o Art. 28, inciso II, do Código Penal que a embriaguez, voluntária ou culposa, não exclui a imputabilidade penal. Assim, somente a embriaguez completa, decorrente de caso fortuito ou força maior, poderia afastar a culpabilidade, levando a uma absolvição.\n\n“Qualquer semelhança nominal e/ou situacional presente nos enunciados das questões é mera coincidência.”"
    revisao: { status: revisado }
