    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      Ruth voltava para sua casa falando ao celular, na cidade de Santos, quando foi abordada por Antônio, que afirmou: “Isso é um assalto! Passa o celular ou verá as consequências!”. Diante da grave ameaça, Ruth entregou o telefone e o agente fugiu em sua motocicleta em direção à cidade de Mogi das Cruzes, consumando o crime.

