      A família de Jorge o procura em busca de orientação, esclarecendo que o autor é primário e de bons antecedentes.

      Considerando apenas a situação narrada, na condição de advogado(a) de Jorge, esclareça os seguintes questionamentos formulados pelos familiares:
    comando: É possível a retratação do direito de representação por parte de Glória? Em caso negativo, explicite as razões; em caso positivo, esclareça os requisitos.
    gabarito: |-
      Deveria o examinando esclarecer que o crime de ameaça é de ação penal pública condicionada à representação, nos termos do Art. 147, parágrafo único, do Código Penal, de modo que é possível a retratação do direito de representação. Como o crime foi praticado em situação de violência doméstica e familiar contra a mulher, contudo, alguns requisitos são trazidos pela lei de modo a garantir que essa manifestação foi livre de pressões. Tais requisitos são trazidos pelo Art. 16 da Lei 11.340/06, que admite a retratação antes do recebimento da denúncia, desde que realizada em audiência especial, na presença do magistrado, após manifestação do Ministério Público.

      “Qualquer semelhança nominal e/ou situacional presente nos enunciados das questões é mera coincidência.”
