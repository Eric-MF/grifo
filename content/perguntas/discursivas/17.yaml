  - id: 17-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Rodrigo, primário e de bons antecedentes, quando passava em frente a um estabelecimento comercial que estava fechado por ser domingo, resolveu nele ingressar. Após romper o cadeado da porta principal, subtraiu do seu interior algumas caixas de cigarro. A ação não foi notada por qualquer pessoa. Todavia, quando caminhava pela rua com o material subtraído, veio a ser abordado por policiais militares, ocasião em que admitiu a subtração e a forma como ingressou no comércio lesado. O material furtado foi avaliado em R$ 1.300,00 (um mil e trezentos reais), sendo integralmente recuperado. A perícia não compareceu ao local para confirmar o rompimento de obstáculo. O autor do fato foi denunciado como incurso nas sanções penais do Art. 155, § 4º, inciso I, do Código Penal. As únicas testemunhas de acusação foram os policiais militares, que confirmaram que apenas foram responsáveis pela abordagem do réu, que confessou a subtração. Disseram não ter comparecido, porém, ao estabelecimento lesado. Em seu interrogatório, Rodrigo confirmou apenas que subtraiu os cigarros do estabelecimento, recusando-se a responder qualquer outra pergunta. A defesa técnica de Rodrigo é intimada para apresentar alegações finais por memoriais.

      Com base na hipótese apresentada, responda, fundamentadamente, aos itens a seguir.
    comando: Diante da confissão da prática do crime de furto por Rodrigo, qual a principal tese defensiva em relação à tipificação da conduta a ser formulada pela defesa técnica?
    gabarito: Foi imputado um crime de furto qualificado, pois houve rompimento de obstáculo. Ocorre que, para a punição por essa modalidade qualificada do crime, é necessária a realização de exame de local e a constatação do rompimento de obstáculo por prova pericial (Art. 158 do CPP). Assim têm decidido de maneira recorrente os Tribunais Superiores, não sendo suficiente a simples afirmação dos policiais, no sentido de que Rodrigo narrou que tinha subtraído os cigarros, pois essa confirmação foi apenas quanto à subtração, e os agentes da lei nem mesmo compareceram ao estabelecimento para verificar se, de fato, houve tal rompimento. Assim, diante da ausência de comprovação pericial da qualificadora, o crime praticado foi de furto simples.
    opcoes:
      correta: A principal tese defensiva é a desclassificação do furto qualificado para o simples OU que deve ser afastada a qualificadora prevista no inciso I do parágrafo 4º do Art. 155 do Código Penal, pois não existe prova pericial do rompimento de obstáculo, prevista no Art. 158 do CPP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 17-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Rodrigo, primário e de bons antecedentes, quando passava em frente a um estabelecimento comercial que estava fechado por ser domingo, resolveu nele ingressar. Após romper o cadeado da porta principal, subtraiu do seu interior algumas caixas de cigarro. A ação não foi notada por qualquer pessoa. Todavia, quando caminhava pela rua com o material subtraído, veio a ser abordado por policiais militares, ocasião em que admitiu a subtração e a forma como ingressou no comércio lesado. O material furtado foi avaliado em R$ 1.300,00 (um mil e trezentos reais), sendo integralmente recuperado. A perícia não compareceu ao local para confirmar o rompimento de obstáculo. O autor do fato foi denunciado como incurso nas sanções penais do Art. 155, § 4º, inciso I, do Código Penal. As únicas testemunhas de acusação foram os policiais militares, que confirmaram que apenas foram responsáveis pela abordagem do réu, que confessou a subtração. Disseram não ter comparecido, porém, ao estabelecimento lesado. Em seu interrogatório, Rodrigo confirmou apenas que subtraiu os cigarros do estabelecimento, recusando-se a responder qualquer outra pergunta. A defesa técnica de Rodrigo é intimada para apresentar alegações finais por memoriais.

      Com base na hipótese apresentada, responda, fundamentadamente, aos itens a seguir.
    comando: Em caso de acolhimento da tese defensiva, poderá Rodrigo ser, de imediato, condenado nos termos da manifestação da defesa técnica?
    gabarito: |-
      Em caso de acolhimento da tese defensiva, com a consequente desclassificação da conduta de Rodrigo de furto qualificado para furto simples, não poderá ser o acusado de imediato condenado, devendo o magistrado abrir vista para que o Ministério Público se manifeste sobre a possibilidade de oferecer proposta de suspensão condicional do processo, pois a pena mínima passou a ser de 01 ano de reclusão. Nesse sentido é o enunciado 337 da Súmula do STJ, que permite que, em caso de desclassificação ou procedência parcial, seja oferecida proposta de suspensão condicional do processo, ainda que encerrada a instrução.

      “Qualquer semelhança nominal e/ou situacional presente nos enunciados das questões é mera coincidência.”
    opcoes:
      correta: Em caso de acolhimento da tese defensiva, não pode o réu ser de imediato condenado, pois deve ser possibilitado ao Ministério Público o oferecimento de proposta de suspensão condicional do processo, nos termos do enunciado 337 da Súmula do STJ.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
