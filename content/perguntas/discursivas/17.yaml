  - id: 17-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Glória, esposa ciumenta de Jorge, inicia uma discussão com o marido no momento em que ele chega do trabalho à residência do casal. Durante a discussão, Jorge faz ameaças de morte à Glória, que, de imediato comparece à Delegacia, narra os fatos, oferece representação e solicita medidas protetivas de urgência. Encaminhados os autos para o Ministério Público, este requer em favor de Glória a medida protetiva de proibição de aproximação, bem como a prisão preventiva de Jorge, com base no Art. 313, inciso III, do CPP. O juiz acolhe os pedidos do Ministério Público e Jorge é preso.

      Novamente os autos são encaminhados para o Ministério Público, que oferece denúncia pela prática do crime do Art. 147 do Código Penal. Antes do recebimento da inicial acusatória, arrependida, Glória retorna à Delegacia e manifesta seu interesse em não mais prosseguir com o feito.

      A família de Jorge o procura em busca de orientação, esclarecendo que o autor é primário e de bons antecedentes.

      Considerando apenas a situação narrada, na condição de advogado(a) de Jorge, esclareça os seguintes questionamentos formulados pelos familiares:
    comando: "A prisão de Jorge, com fundamento no Art. 313, inciso III, do Código de Processo Penal, é válida? (Valor:"
    gabarito: Deveria o examinando demonstrar que a prisão preventiva decretada em desfavor de Jorge, com base no Art. 313, inciso III, do Código de Processo Penal, não é válida no caso concreto. De início, é possível perceber que os requisitos previstos no Art. 313, incisos I e II, do CPP não estão presentes, pois a pena máxima para o crime praticado é inferior a 04 anos e Jorge é primário e de bons antecedentes. Em relação ao inciso III do Art. 313, não basta que o crime seja praticado em situação de violência doméstica e familiar contra mulher. Para regularidade da prisão, é preciso que seja aplicada para garantir execução de medida protetiva de urgência. Dessa forma, somente será cabível caso exista uma medida protetiva anteriormente aplicada e descumprida ou, ao menos, que, após aplicação da medida protetiva, exista risco concreto de descumprimento. No caso, de imediato o magistrado, após requerimento do Ministério Público, decretou a prisão preventiva, sem que houvesse medida protetiva de urgência previamente aplicada. Assim, não foi válida a prisão.
    opcoes:
      correta: A prisão de Jorge não é válida, pois o Art. 313, III, do CPP, exige que a prisão seja decretada para garantir execução de medida protetiva de urgência OU porque não houve medida protetiva anteriormente aplicada e descumprida.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
