    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: "Desenvolvimento jurídico acerca da nulidade do auto de prisão em flagrante por violação ao direito a não produzir prova contra si (0,5) [art. 5º, LXIII, da CRFB OU art. 8º, 2, “g” do Decreto 678/92 (Pacto de San José da Costa Rica)] Obs.: A mera indicação do artigo não é pontuada."
    opcoes:
      correta: "Desenvolvimento jurídico acerca da nulidade do auto de prisão em flagrante por violação ao direito a não produzir prova contra si (0,5) [art. 5º, LXIII, da CRFB OU art. 8º, 2, “g” do Decreto 678/92 (Pacto de San José da Costa Rica)] Obs.: A mera indicação do artigo não é pontuada."
      erradas:
        - Memoriais endereçados ao Juiz do Tribunal do Júri.
        - "Dos Pedidos: Conhecimento e provimento do recurso OU concessão do livramento condicional; com a consequente expedição do alvará de soltura"
        - No mérito, absolvição de Roberta.
        - Afastamento do pedido de aplicação do regime inicial fechado, pois o crime de tráfico privilegiado não é considerando hediondo pelo STF OU porque é inconstitucional a previsão do Art. 2º, § 1º, da Lei nº 8.072/90 de aplicação obrigatória do regime inicial fechado aos crimes hediondos.
        - Aplicação do regime inicial aberto para cumprimento da pena, na forma do Art. 33, § 2º, alínea c, do CP.
    revisao: *a1
