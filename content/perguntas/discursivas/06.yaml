# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "06"
introducoes:
  peca: "José bebeu um litro de vinho na fazenda e saiu dirigindo por uma estrada deserta, onde foi parado pela Polícia Militar. Os policiais o obrigaram a soprar o etilômetro, que acusou 1 mg de álcool por litro de ar, e o levaram à delegacia, onde se lavrou o flagrante pelo crime de embriaguez ao volante. Ele foi impedido de falar com os advogados e com a família e, dois dias depois, continuava preso sem que a prisão tivesse sido levada ao conhecimento do juiz ou da Defensoria. A família procura você para tirá-lo da prisão."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["06-peca-3", "06-peca-7"]
perguntas:
  - id: 06-peca-4-1
    categoria: peca-detalhe
    parte: peca
    item: "4.1"
    secao: merito
    pergunta: "Os policiais obrigaram José a soprar o etilômetro. Que direito do preso isso violou?"
    tese: "Violação do direito de não produzir prova contra si mesmo"
    aceitos: [ [ "produzir prova contra si" ], [ "nemo tenetur" ], [ "autoincrimina* | auto incrimina* | autoincriminacao" ] ]
    artigos: [ "art. 5º, LXIII, CF", "art. 8º Decreto 678" ]
    gabarito: "Desenvolvimento jurídico acerca da nulidade do auto de prisão em flagrante por violação ao direito a não produzir prova contra si (0,5) [art. 5º, LXIII, da CRFB OU art. 8º, 2, “g” do Decreto 678/92 (Pacto de San José da Costa Rica)] Obs.: A mera indicação do artigo não é pontuada."
    revisao: { status: revisado }
  - id: 06-peca-4-2
    categoria: peca-detalhe
    parte: peca
    item: "4.2"
    secao: merito
    pergunta: "Como a defesa deve tratar o resultado do teste feito à força?"
    tese: "Ilicitude do teste do etilômetro feito à força, que não pode ser usado como prova"
    aceitos: [ "ilicit* | inadmiss* | desentranha*" ]
    artigos: [ "art. 157, CPP", "art. 5º, LVI, CF" ]
    gabarito: "em razão da colheita forçada do exame de teor alcoólico e consequente ilicitude da prova (0,5) [art. 5º, LVI, OU art. 157 do CPP] Obs.: A mera indicação do artigo não é pontuada."
    revisao: { status: revisado }
  - id: 06-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "José não pôde falar com os advogados nem com a família. Que direito do preso foi violado?"
    tese: "Violação do direito do preso de se comunicar com o advogado e com a família"
    aceitos: [ "comunica* | entrevista* | assistencia | contato", "advogad* | familia*" ]
    artigos: [ "art. 5º, LXIII, CF", "art. 7º, III, Lei 8.906" ]
    gabarito: "Desenvolvimento jurídico acerca da nulidade do auto de prisão em flagrante por violação ao direito à comunicação entre o preso e o advogado, bem como familiares (0,8), nos termos do art. 5º, LXIII, da CRFB OU art 7º, III, do EOAB (0,2). Obs.: A mera indicação do artigo não é pontuada."
    revisao: { status: revisado }
  - id: 06-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Dois dias depois, a prisão ainda não tinha sido levada ao juiz. A quem e em quanto tempo a lei manda comunicar o flagrante?"
    tese: "Comunicação do flagrante ao juiz e à Defensoria Pública em até 24 horas"
    aceitos: [ "juiz | autoridade judiciaria | juizo | defensoria", "24 horas | vinte e quatro horas | 24h" ]
    artigos: [ "art. 306, § 1º, CPP", "art. 5, LXII, CRFB" ]
    gabarito: "Desenvolvimento jurídico acerca da nulidade do auto de prisão em flagrante por violação à exigência de comunicação da medida à autoridade judiciária e à defensoria pública dentro de 24 horas (0,8), nos termos do art. 306, §1º, do CPP OU art. 5º, LXII, da CRFB (0,2). Obs.: A mera indicação do artigo não é pontuada."
    revisao: { status: revisado }
