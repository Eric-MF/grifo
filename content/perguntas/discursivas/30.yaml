  - id: 30-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Carleto foi denunciado pela prática do injusto de homicídio simples porque teria desferido disparos, com sua arma regular, contra seu vizinho Mário durante uma discussão, causando-lhe as lesões que foram a causa da morte da vítima. Logo que recebida a denúncia, Carleto foi submetido à exame de insanidade mental, tendo o laudo concluído que ele se encontrava nas condições do Art. 26, caput, do Código Penal.

      Finda a primeira etapa probatória do procedimento dos crimes dolosos contra a vida, no momento das alegações finais, a defesa técnica de Carleto, escorada em uma das vertentes da prova produzida, alegou que o réu atuou em legítima defesa.

      O juiz, ao final da primeira fase do procedimento, absolveu sumariamente o acusado em razão da inimputabilidade reconhecida, aplicando a medida de segurança de internação pelo prazo mínimo de 01 ano.

      A família de Carleto, insatisfeita com a medida de segurança aplicada, procura você, como advogado(a), para a adoção das medidas cabíveis.

      Considerando o caso narrado, responda, na condição de advogado(a) de Carleto, aos itens a seguir.
    comando: Qual o recurso cabível para a defesa combater aquela decisão? Justifique.
    gabarito: Considerando que a decisão do magistrado foi de absolvição sumária, nos termos do Art. 416 do CPP, caberá à defesa apresentar recurso de apelação.
    opcoes:
      correta: Recurso de apelação, nos termos do Art. 416 do CPP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Porque deve obediência aos princípios da imparcialidade e inércia da jurisdição OU Porque tal conduta feriria o sistema/princípio acusatório. OU Porque tal conduta feriria o princípio da correlação/congruência entre acusação e sentença.
        - Deveria ser alegada a ocorrência de desistência voluntária, o que torna a conduta do agente atípica OU o que faz com que responda apenas pelos atos já praticados, na forma do Art. 15, primeira parte, do CP.
        - Houve retratação antes da sentença ser proferida no processo de Antônio, deixando o fato de ser punível, nos termos do Art. 342, § 2º, do CP.
    revisao: *a1
  - id: 30-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Carleto foi denunciado pela prática do injusto de homicídio simples porque teria desferido disparos, com sua arma regular, contra seu vizinho Mário durante uma discussão, causando-lhe as lesões que foram a causa da morte da vítima. Logo que recebida a denúncia, Carleto foi submetido à exame de insanidade mental, tendo o laudo concluído que ele se encontrava nas condições do Art. 26, caput, do Código Penal.

      Finda a primeira etapa probatória do procedimento dos crimes dolosos contra a vida, no momento das alegações finais, a defesa técnica de Carleto, escorada em uma das vertentes da prova produzida, alegou que o réu atuou em legítima defesa.

      O juiz, ao final da primeira fase do procedimento, absolveu sumariamente o acusado em razão da inimputabilidade reconhecida, aplicando a medida de segurança de internação pelo prazo mínimo de 01 ano.

      A família de Carleto, insatisfeita com a medida de segurança aplicada, procura você, como advogado(a), para a adoção das medidas cabíveis.

      Considerando o caso narrado, responda, na condição de advogado(a) de Carleto, aos itens a seguir.
    comando: Qual a tese jurídica de direito processual que a defesa de Carleto poderá alegar para combater a decisão respectiva? Justifique.
    gabarito: Não poderia o magistrado ter absolvido Carleto, com aplicação de medida de segurança, em razão da inimputabilidade, tendo em vista que esta não era a única tese apresentada pela defesa. Pelo contrário, a defesa de Carleto defendeu que o fato sequer seria ilícito, em razão de legítima defesa, tese que, se acolhida pelos jurados, nem mesmo levaria à análise da culpabilidade do agente. Sendo a absolvição própria pela legítima defesa, não seria cabível a aplicação de medida de segurança. Para que esta seja aplicada, em razão da reconhecida inimputabilidade do agente devido à doença mental, exige-se que o mesmo tenha praticado um fato típico e ilícito. Em se tratando de crime doloso contra a vida, a competência para o julgamento respectivo é do Tribunal do Júri, cabendo aos jurados a decisão se o acusado atuou sob a escora de excludente de ilicitude, no caso a da legítima defesa, que encontrava amparo em uma das vertentes dos autos. O Art. 415, parágrafo único, do CPP, autoriza a absolvição sumária em razão da inimputabilidade do agente, quando esta for a única tese defensiva. Na hipótese, a tese principal é a de excludente de ilicitude.
    opcoes:
      correta: O agente não poderia ter sido absolvido sumariamente em razão da inimputabilidade porque essa não era a única tese defensiva, somente podendo o magistrado absolver sumariamente com reconhecimento da legítima defesa e sem aplicação de medida de segurança OU devendo o magistrado submetê-lo a julgamento perante o Tribunal do Júri para análise da excludente de ilicitude, nos termos do Art. 415, parágrafo único, do CPP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
  - id: 30-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Eduardo foi preso em flagrante no momento em que praticava um crime de roubo simples, no bairro de Moema.

      Ainda na unidade policial, compareceram quatro outras vítimas, todas narrando que tiveram seus patrimônios lesados por Eduardo naquela mesma data, com intervalo de cerca de 30 minutos entre cada fato, no bairro de Moema, São Paulo.

      As cinco vítimas descreveram que Eduardo, simulando portar arma de fogo, anunciava o assalto e subtraía os bens, empreendendo fuga em uma bicicleta. Eduardo foi denunciado pela prática do crime do Art. 157, caput, por cinco vezes, na forma do Art. 69, ambos do Código Penal, e, em sede de audiência, as vítimas confirmaram a versão fornecida em sede policial.

      Assistido por seu advogado Pedro, Eduardo confessou os crimes, esclarecendo que pretendia subtrair bens de seis vítimas para conseguir dinheiro suficiente para comprar uma motocicleta. Disse, ainda, que apenas simulou portar arma de fogo, mas não utilizou efetivamente material bélico ou simulacro de arma. O juiz, no momento da sentença, condenou o réu nos termos da denúncia, sendo aplicada a pena mínima de 04 anos para cada um dos delitos, totalizando 20 anos de pena privativa de liberdade a ser cumprida em regime inicial fechado, além da multa. Ao ser intimado do teor da sentença, pessoalmente, já que se encontrava preso, Eduardo tomou conhecimento que Pedro havia falecido, mas que foram apresentadas alegações finais pela Defensoria Pública por determinação do magistrado logo em seguida à informação do falecimento do patrono. A família de Eduardo, então, procura você, na condição de advogado(a), para defendê-lo.

      Considerando apenas as informações narradas, responda, na condição de advogado(a) de Eduardo, constituído para apresentação de apelação, aos itens a seguir.
    comando: Existe argumento de direito processual, em sede de recurso, a ser apresentado para desconstituir a sentença condenatória? Justifique.
    gabarito: O argumento a ser apresentado, em sede de recurso, para desconstituir a sentença condenatória, é o de que haveria violação ao princípio da ampla defesa, em sua vertente de defesa técnica, tendo em vista que as alegações finais foram apresentadas pela Defensoria Pública, não sendo o acusado intimado para, querendo, constituir novo patrono. De acordo com o que consta do enunciado, durante a instrução processual, Eduardo foi assistido por Pedro, advogado por ele constituído. Ocorre que, ao tomar conhecimento de que Pedro teria falecido, de imediato o magistrado encaminhou os autos à Defensoria Pública para apresentação de alegações finais, o que foi incorreto, já que o réu deveria ter sido intimado pessoalmente, pois estava preso, para esclarecer se teria interesse em ser assistido pela Defensoria ou se pretendia constituir novo advogado. Ao retirar esse direito do réu, o magistrado violou direito do acusado e o princípio da ampla defesa.
    opcoes:
      correta: Sim. Tendo em vista que Eduardo deveria ter sido intimado para manifestar seu interesse em constituir novo advogado ou ser assistido pela Defensoria Pública, para oferecimento das alegações finais, em razão do falecimento do antigo patrono, houve violação ao princípio da ampla defesa, nos termos do Art. 5º, inciso LV, da CRFB,
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
  - id: 30-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      Eduardo foi preso em flagrante no momento em que praticava um crime de roubo simples, no bairro de Moema.

      Ainda na unidade policial, compareceram quatro outras vítimas, todas narrando que tiveram seus patrimônios lesados por Eduardo naquela mesma data, com intervalo de cerca de 30 minutos entre cada fato, no bairro de Moema, São Paulo.

      As cinco vítimas descreveram que Eduardo, simulando portar arma de fogo, anunciava o assalto e subtraía os bens, empreendendo fuga em uma bicicleta. Eduardo foi denunciado pela prática do crime do Art. 157, caput, por cinco vezes, na forma do Art. 69, ambos do Código Penal, e, em sede de audiência, as vítimas confirmaram a versão fornecida em sede policial.

      Assistido por seu advogado Pedro, Eduardo confessou os crimes, esclarecendo que pretendia subtrair bens de seis vítimas para conseguir dinheiro suficiente para comprar uma motocicleta. Disse, ainda, que apenas simulou portar arma de fogo, mas não utilizou efetivamente material bélico ou simulacro de arma. O juiz, no momento da sentença, condenou o réu nos termos da denúncia, sendo aplicada a pena mínima de 04 anos para cada um dos delitos, totalizando 20 anos de pena privativa de liberdade a ser cumprida em regime inicial fechado, além da multa. Ao ser intimado do teor da sentença, pessoalmente, já que se encontrava preso, Eduardo tomou conhecimento que Pedro havia falecido, mas que foram apresentadas alegações finais pela Defensoria Pública por determinação do magistrado logo em seguida à informação do falecimento do patrono. A família de Eduardo, então, procura você, na condição de advogado(a), para defendê-lo.

      Considerando apenas as informações narradas, responda, na condição de advogado(a) de Eduardo, constituído para apresentação de apelação, aos itens a seguir.
    comando: Diante da confirmação dos fatos pelo réu, qual argumento de direito material poderá ser apresentado, em sede de apelação, em busca da redução da sanção penal aplicada? Justifique.
    gabarito: Em sede de apelação, poderia ser buscado o reconhecimento da continuidade delitiva, o que geraria redução da sanção penal aplicada. De acordo com o que consta do enunciado, de fato foram praticados cinco crimes de roubo. Mesmo sem emprego de arma de fogo ou simulacro de arma de fogo, houve grave ameaça na subtração dos bens de cinco vítimas diferentes, logo cinco patrimônios foram atingidos e cinco crimes autônomos foram praticados. Ainda que Eduardo tenha confessado os fatos, a pena mínima foi aplicada, não cabendo redução com fundamento na atenuante do Art. 65, III, d, do CP, nos termos da Súmula 231 do STJ. Todavia, o magistrado reconheceu o concurso material de crimes e somou a pena aplicada para cada um dos delitos. De acordo com o Art. 71 do CP, a pena de apenas um dos crimes será aplicada e aumentada de 1/6 a 2/3 quando o agente, mediante mais de uma ação, pratica dois ou mais crimes da mesma espécie, nas mesmas condições de tempo, lugar, maneira de execução, sendo os subsequentes continuação do primeiro. Todas as exigências legais foram preenchidas. Os delitos foram praticados no mesmo bairro, com intervalo de 30 minutos entre eles, sempre com o mesmo modo de execução. A intenção do agente sempre foi praticar vários crimes, um em continuidade do outro, para obter dinheiro suficiente para comprar uma motocicleta. Assim, ao invés do cúmulo material, deveria o magistrado ter aumentado a pena de um dos delitos (04 anos) em 1/6 a 2/3, ou, até mesmo, aplicar a previsão do Art. 71, parágrafo único, do CP.
    opcoes:
      correta: Reconhecimento da continuidade delitiva, na forma do Art. 71 do CP, já que os crimes são da mesma espécie e foram praticados nas mesmas condições de tempo, local e modo de execução
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 30-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Maria foi denunciada pela suposta prática do crime de descaminho, tendo em vista que teria deixado de recolher impostos que totalizavam R$ 500,00 (quinhentos reais) pela saída de mercadoria, fato constatado graças ao lançamento definitivo realizado pela Administração Pública.

      Considerando que constava da Folha de Antecedentes Criminais de Maria outro processo pela suposta prática de crime de roubo, inclusive estando Maria atualmente presa em razão dessa outra ação penal, o Ministério Público deixou de oferecer proposta de suspensão condicional do processo.

      Após a instrução criminal em que foram observadas as formalidades legais, sendo Maria assistida pela Defensoria Pública, foi a ré condenada nos termos da denúncia. A pena aplicada foi a mínima prevista para o delito, a ser cumprida em regime inicial aberto, substituída por restritiva de direitos. Maria foi intimada da sentença através de edital, pois não localizada no endereço constante do processo.

      A família de Maria, ao tomar conhecimento do teor da sentença, procura você, na condição de advogado(a) para prestar esclarecimentos técnicos. Informa estar preocupada com o prazo recursal, já que Maria ainda não tinha conhecimento da condenação, pois permanecia presa.

      Na condição de advogado(a), esclareça os seguintes questionamentos formulados pela família da ré.
    comando: Existe argumento de direito processual para questionar a intimação de Maria do teor da sentença condenatória? Justifique.
    gabarito: O advogado, ao ser procurado pela família de Maria, deveria esclarecer que a intimação de Maria do teor da sentença condenatória não foi correta, tendo em vista que ela encontrava-se presa por outro crime, fato do conhecimento do Ministério Público. De acordo com o Art. 392 do CPP, a intimação da sentença deverá ser pessoal se o réu estiver preso, ainda que a prisão seja decorrente de outro processo. A intimação por edital deve ocorrer quando o réu estiver em local incerto e não sabido, quando não for possível sua localização, ou em alguma das situações previstas no Art. 392, incisos IV, V e V, do CPP, o que não foi o caso. A intimação por edital, como forma de intimação ficta, prejudicou Maria, que ainda não tinha conhecimento do teor da sentença condenatória.
    opcoes:
      correta: Sim. Existe, tendo em vista que Maria deveria ter sido intimada pessoalmente por estar presa, na forma do Art. 392, inciso I, do CPP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
