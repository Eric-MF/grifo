  - id: 30-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Beto e Juca eram vizinhos em um prédio que veio a ser atingido por incêndio. Em razão das longas obras que seriam necessárias para recuperar os apartamentos, decidem se hospedar em quarto de hotel por 06 meses, novamente sendo vizinhos de quarto.

      Em determinada data, policiais militares surpreenderam Juca entrando com uma sacola preta no seu quarto do hotel, ficando claro que ele estava fugindo ao avistar os agentes da lei. Diante disso, ingressaram no quarto e apreenderam 100g de maconha, que estavam na sacola que Juca trazia consigo, e mais 50g de cocaína que estavam sendo guardadas no cômodo, sendo confirmado por Juca que o material seria destinado à venda. Em seguida, os policiais optaram por fazer diligência também no quarto vizinho, que era de Beto, apreendendo uma série de documentos que, após investigação, foi verificado que estavam relacionados a um crime de estelionato.

      O Ministério Público ofereceu denúncia em face de Juca pela prática de dois crimes de tráfico em concurso, tendo em vista que guardava cocaína e trazia consigo maconha. Já Beto, exclusivamente em razão da documentação apreendida, foi denunciado pelo crime de estelionato.

      Considerando apenas as informações narradas, na condição de advogado(a) dos denunciados, responda aos itens a seguir.
    comando: Qual argumento deve ser apresentado pela defesa técnica, em busca da absolvição de Beto? Justifique.
    gabarito: Em busca da absolvição de Beto, a defesa técnica deve alegar que as provas obtidas foram ilícitas, tendo em vista que os policiais apreenderam documentos em local amparado pela inviolabilidade de domicílio. O Art. 5º, inciso XI, da CRFB/88, garante a todos a inviolabilidade de domicílio, prevendo exceção no caso de cumprimento de ordem judicial ou flagrante delito, o que não restou configurado no caso. Ademais, o próprio Art. 150, § 4º do CP e o Art. 246 do CPP dizem que a expressão “casa” compreende aposento ocupado de habitação coletiva, sendo pacífico o entendimento dos Tribunais Superiores no sentido de que quarto de hotel, em especial quando habitado com certa permanência, está abrangido pela inviolabilidade de domicílio. Em sendo os documentos apreendidos com violação deste direito fundamental as únicas provas, impossível a condenação.
    opcoes:
      correta: O argumento é a ilicitude do meio de obtenção das provas na apreensão dos documentos, tendo em vista que o quarto de hotel está amparado pela inviolabilidade de domicílio e não havia situação de flagrante delito ou mandado de busca e apreensão, na forma do Art. 5º, inciso XI, da CRFB/88 OU do Art. 150, § 4º, do CP OU do Art. 246 do CPP OU Art. 157 do CPP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 30-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Beto e Juca eram vizinhos em um prédio que veio a ser atingido por incêndio. Em razão das longas obras que seriam necessárias para recuperar os apartamentos, decidem se hospedar em quarto de hotel por 06 meses, novamente sendo vizinhos de quarto.

      Em determinada data, policiais militares surpreenderam Juca entrando com uma sacola preta no seu quarto do hotel, ficando claro que ele estava fugindo ao avistar os agentes da lei. Diante disso, ingressaram no quarto e apreenderam 100g de maconha, que estavam na sacola que Juca trazia consigo, e mais 50g de cocaína que estavam sendo guardadas no cômodo, sendo confirmado por Juca que o material seria destinado à venda. Em seguida, os policiais optaram por fazer diligência também no quarto vizinho, que era de Beto, apreendendo uma série de documentos que, após investigação, foi verificado que estavam relacionados a um crime de estelionato.

      O Ministério Público ofereceu denúncia em face de Juca pela prática de dois crimes de tráfico em concurso, tendo em vista que guardava cocaína e trazia consigo maconha. Já Beto, exclusivamente em razão da documentação apreendida, foi denunciado pelo crime de estelionato.

      Considerando apenas as informações narradas, na condição de advogado(a) dos denunciados, responda aos itens a seguir.
    comando: Qual argumento a ser apresentado pela defesa técnica para questionar a capitulação jurídica constante na denúncia em face de Juca? Justifique.
    gabarito: Para questionar a capitulação jurídica formulada pelo Ministério Público na denúncia, a defesa técnica deveria esclarecer que não houve concurso de crimes, mas sim crime único de tráfico, tendo em vista que os verbos núcleos do tipo “guardar” e “trazer” estavam sendo praticados em um único contexto. De fato, a apreensão de drogas destinadas à venda configura crime de tráfico, sendo certo que a diligência foi válida porque havia situação de flagrante delito a justificar o ingresso dos policiais no quarto do hotel. O crime de tráfico de drogas é tipo misto alternativo, de modo que a prática de mais de um verbo em um mesmo contexto configura crime único, em respeito ao princípio da alternatividade. Apenas quando os verbos são praticados em contextos diversos é possível a imputação de delitos autônomos ao mesmo agente, o que não ocorreu na situação narrada.
    opcoes:
      correta: O argumento a ser apresentado é que houve crime único, pois os dois verbos núcleos do tipo foram praticados em um mesmo contexto OU diante do princípio da alternatividade OU pelo fato de o crime de tráfico ser misto alternativo OU houve uma única violação ao bem jurídico protegido.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
