    gabarito: Não poderia o magistrado ter condenado em razão de imperícia, já que esta não foi narrada na denúncia OU em razão da violação ao princípio da correlação.
    opcoes:
      correta: Não poderia o magistrado ter condenado em razão de imperícia, já que esta não foi narrada na denúncia OU em razão da violação ao princípio da correlação.
