      Na condição de advogado(a), esclareça os seguintes questionamentos formulados pela família da ré.
    comando: Qual argumento de direito material poderá ser apresentado, em eventual recurso, em busca da absolvição de Maria? Justifique.
    gabarito: O argumento seria de que a conduta praticada por Maria é atípica em razão da aplicação do princípio da insignificância. O conceito de crime envolve um fato típico, ilícito e culpável. Dentro da tipicidade, está a tipicidade material, que é a lesão relevante ao bem jurídico protegido. Em relação aos crimes tributários, a jurisprudência é tranquila no sentido de que haveria atipicidade material sempre que o valor do imposto sonegado não ultrapassar aquele que a Fazenda Pública considera baixo o suficiente para não justificar uma cobrança através de execução fiscal. Ainda que exista controvérsia se tal valor seria de R$ 10.000,00 ou R$ 20.000,00, fato é que, na presente hipótese, considerando que o valor do tributo não ultrapassaria R$ 500,00, o princípio da insignificância deveria ser aplicado. A lesão constatada não é grave o suficiente para justificar a intervenção do Direito Penal, diante de sua característica de subsidiariedade/última ratio.
    opcoes:
      correta: Atipicidade material da conduta, em razão do reconhecimento do princípio da insignificância/bagatela.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
