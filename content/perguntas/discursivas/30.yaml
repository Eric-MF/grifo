# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "30"
introducoes:
  peca: "Carlos, primário e de bons antecedentes, foi denunciado por dois homicídios culposos e uma lesão corporal culposa na direção de veículo, em concurso material. Segundo a denúncia, ele dirigia com imprudência, em excesso de velocidade, quando bateu no carro em que estavam Júlio e Mário, de 9 anos, que morreram, e feriu Pedro, que passava de bicicleta. Pedro saiu do hospital sem ser notado e nunca foi à polícia. A perícia concluiu que não houve excesso de velocidade, que havia um buraco na pista e que talvez houvesse imperícia de Carlos. O juiz o condenou por causa da imperícia, aplicou a agravante de crime contra criança quanto a Mário e somou as penas: 4 anos e 9 meses de detenção, no regime fechado, sem substituição, por causa da quantidade da pena. Você foi intimado da sentença."
  q1: "Beto e Juca, vizinhos, passaram a morar em quartos vizinhos de um hotel depois que o prédio deles pegou fogo. Policiais viram Juca entrar no quarto com uma sacola, fugindo deles; entraram e apreenderam 100 g de maconha na sacola e 50 g de cocaína guardadas no quarto, que Juca disse serem para venda. Depois, entraram também no quarto de Beto e apreenderam documentos que levaram a um estelionato. Juca foi denunciado por dois crimes de tráfico, em concurso, e Beto, só por causa dos documentos, por estelionato."
  q2: "Carleto foi denunciado por homicídio simples, por ter matado o vizinho a tiros numa discussão. O exame de insanidade concluiu que ele era inimputável. Nas alegações finais da primeira fase do júri, a defesa sustentou a legítima defesa. O juiz absolveu Carleto sumariamente pela inimputabilidade e aplicou medida de segurança de internação por, no mínimo, 1 ano."
  q3: "Eduardo foi preso em flagrante num roubo simples em Moema, e outras quatro vítimas contaram que ele as roubou no mesmo dia e bairro, com intervalos de cerca de 30 minutos, sempre simulando estar armado e fugindo de bicicleta. Ele confessou que queria roubar seis pessoas para comprar uma moto. Quando o advogado dele morreu, o juiz mandou a Defensoria Pública apresentar as alegações finais, sem avisar Eduardo, que foi condenado por cinco roubos em concurso material, a 20 anos no regime fechado."
  q4: "Maria foi condenada por descaminho de R$ 500 em impostos, apurados em lançamento definitivo, à pena mínima, no regime aberto, substituída por restritiva de direitos. Ela estava presa por outro processo, por roubo, mas foi intimada da sentença por edital, porque não a encontraram no endereço do processo."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["30-peca-1", "30-peca-3", "30-peca-7-1", "30-peca-10"]
perguntas:
  - id: 30-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: preliminar
    pergunta: "Pedro nunca procurou a polícia nem a Justiça. Que causa extingue a punibilidade quanto à lesão corporal?"
    tese: "Extinção da punibilidade pela decadência quanto à lesão corporal culposa, porque a vítima nunca representou"
    aceitos: [ "decaden*" ]
    artigos: [ "art. 107, IV, CP", "art. 38, CPP" ]
    gabarito: "Extinção da punibilidade em relação ao crime de lesão corporal, em razão da decadência, nos termos do Art. 107, IV, do CP OU 38 do CPP."
    revisao: { status: revisado }
  - id: 30-peca-4-1
    categoria: peca-detalhe
    parte: peca
    item: "4.1"
    secao: merito
    pergunta: "Por que a vontade de Pedro era indispensável para processar Carlos pela lesão corporal?"
    tese: "A lesão corporal culposa no trânsito é crime de ação pública condicionada à representação, que não houve"
    aceitos: [ "representacao | condicionada" ]
    artigos: [ "art. 291, § 1º, Lei 9.503", "art. 88, Lei 9.099" ]
    gabarito: "Não houve representação do ofendido, sendo que essa seria indispensável OU e o crime era de ação penal pública condicionada à representação, nos termos do Art. 291, §1º, do CTB OU do Art. 88 da Lei 9.099/95."
    revisao: { status: revisado }
  - id: 30-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "A perícia afastou o excesso de velocidade. Que pedido a defesa deve fazer quanto às duas mortes?"
    tese: "Absolvição pelos homicídios culposos: ficou provado que não houve imprudência nem excesso de velocidade"
    aceitos: [ "absolvi* | absolver" ]
    artigos: [ "art. 386, III, CPP" ]
    gabarito: "Absolvição de Carlos em relação aos crimes de homicídio culposo, já que comprovado que não houve imprudência e nem excesso de velocidade."
    revisao: { status: revisado }
  - id: 30-peca-5-1
    categoria: peca-detalhe
    parte: peca
    item: "5.1"
    secao: merito
    pergunta: "O juiz condenou Carlos por imperícia. Por que isso não era possível?"
    tese: "Violação da correlação: o juiz condenou por imperícia, modalidade de culpa não narrada na denúncia, sem aditamento"
    aceitos: [ "correlacao | congruencia | aditamento | mutatio libelli | nao narrada | nao descrita" ]
    artigos: [ "art. 384, CPP" ]
    gabarito: "Não poderia o magistrado ter condenado em razão de imperícia, já que esta não foi narrada na denúncia OU em razão da violação ao princípio da correlação."
    revisao: { status: revisado }
  - id: 30-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Por que a agravante de crime contra criança não podia ser aplicada?"
    tese: "Afastamento da agravante da vítima criança, que não se aplica aos crimes culposos, só aos dolosos"
    aceitos: [ [ "afast* | nao incid* | inaplicab* | nao se aplica | nao pode", "agravante" ], [ "so aos dolosos | so dolos* | apenas dolos* | somente dolos* | crimes dolosos | crime doloso" ] ]
    artigos: [ "art. 61, II, h, CP" ]
    gabarito: "Afastamento da agravante em razão da idade da vítima, já que tal agravante somente pode ser aplicada aos crimes dolosos OU não pode ser aplicada aos crimes culposos OU sob pena de configuração de responsabilidade penal objetiva."
    revisao: { status: revisado }
  - id: 30-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Com uma só colisão, Carlos causou as mortes e a lesão. Que concurso de crimes deve ser reconhecido?"
    tese: "Concurso formal: com uma só ação, o réu causou mais de um resultado"
    aceitos: [ "concurso formal" ]
    artigos: [ "art. 70, CP" ]
    gabarito: "Afastamento do concurso material de crimes, devendo ser reconhecido o concurso formal de delitos, nos termos do Art. 70 do CP."
    revisao: { status: revisado }
  - id: 30-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Por que o regime inicial fechado deve ser afastado?"
    tese: "Afastamento do regime fechado: a pena de detenção começa no semiaberto ou no aberto"
    aceitos: [ "semiaberto | aberto | nao admite regime fechado | nao admite o regime fechado" ]
    artigos: [ "art. 33, CP" ]
    gabarito: "Afastamento do regime inicial fechado, tendo em vista que tal regime inicial não pode ser fixado aos crimes punidos exclusivamente com pena de detenção OU considerando a pena aplicada, nos termos do Art. 33 do CP."
    revisao: { status: revisado }
  - id: 30-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "A pena passou de 4 anos. Por que ainda cabe a substituição por restritivas de direitos?"
    tese: "Substituição por restritivas de direitos: nos crimes culposos, ela cabe qualquer que seja a pena"
    aceitos: [ "qualquer que seja a pena | sem limite de pena | nao ha limite | nao tem limite | independentemente da pena | qualquer pena" ]
    artigos: [ "art. 44, I, CP" ]
    gabarito: "Possível a substituição da pena privativa de liberdade por restritiva de direitos, pois o limite do quantum de pena do Art. 44, I, do CP é aplicável exclusivamente aos crimes dolosos OU porque não existe limite de pena quando o crime for de natureza culposa."
    revisao: { status: revisado }
  - id: 30-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento leva à absolvição de Beto?"
    tese: "Ilicitude da prova: o quarto de hotel é protegido como domicílio, e não havia flagrante nem mandado"
    aceitos: [ "ilicit* | domicilio | inviolabilidade" ]
    artigos: [ "art. 5, XI, CRFB", "art. 150, § 4º, CP", "art. 157, CPP", "art. 246, CPP" ]
    gabarito: "Em busca da absolvição de Beto, a defesa técnica deve alegar que as provas obtidas foram ilícitas, tendo em vista que os policiais apreenderam documentos em local amparado pela inviolabilidade de domicílio. O Art. 5º, inciso XI, da CRFB/88, garante a todos a inviolabilidade de domicílio, prevendo exceção no caso de cumprimento de ordem judicial ou flagrante delito, o que não restou configurado no caso. Ademais, o próprio Art. 150, § 4º do CP e o Art. 246 do CPP dizem que a expressão “casa” compreende aposento ocupado de habitação coletiva, sendo pacífico o entendimento dos Tribunais Superiores no sentido de que quarto de hotel, em especial quando habitado com certa permanência, está abrangido pela inviolabilidade de domicílio. Em sendo os documentos apreendidos com violação deste direito fundamental as únicas provas, impossível a condenação."
    revisao: { status: revisado }
  - id: 30-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que argumento contesta a denúncia de Juca por dois crimes de tráfico?"
    tese: "Crime único de tráfico: guardar e trazer consigo, no mesmo contexto, são verbos de um tipo misto alternativo"
    aceitos: [ "crime unico | delito unico | um unico crime | um so crime | misto alternativo" ]
    artigos: [ "art. 33, Lei 11.343" ]
    gabarito: "Para questionar a capitulação jurídica formulada pelo Ministério Público na denúncia, a defesa técnica deveria esclarecer que não houve concurso de crimes, mas sim crime único de tráfico, tendo em vista que os verbos núcleos do tipo “guardar” e “trazer” estavam sendo praticados em um único contexto. De fato, a apreensão de drogas destinadas à venda configura crime de tráfico, sendo certo que a diligência foi válida porque havia situação de flagrante delito a justificar o ingresso dos policiais no quarto do hotel. O crime de tráfico de drogas é tipo misto alternativo, de modo que a prática de mais de um verbo em um mesmo contexto configura crime único, em respeito ao princípio da alternatividade. Apenas quando os verbos são praticados em contextos diversos é possível a imputação de delitos autônomos ao mesmo agente, o que não ocorreu na situação narrada."
    revisao: { status: revisado }
  - id: 30-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que recurso a defesa deve usar contra a decisão do juiz?"
    tese: "Apelação contra a absolvição sumária"
    aceitos: [ "apelacao" ]
    artigos: [ "art. 416, CPP" ]
    gabarito: "Considerando que a decisão do magistrado foi de absolvição sumária, nos termos do Art. 416 do CPP, caberá à defesa apresentar recurso de apelação."
    revisao: { status: revisado }
  - id: 30-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que tese processual a defesa pode opor à absolvição sumária pela inimputabilidade?"
    tese: "Vedação da absolvição sumária por inimputabilidade quando ela não é a única tese defensiva: a legítima defesa deve ir ao júri"
    aceitos: [ "unica tese | nao era a unica | nao e a unica | unica tese defensiva" ]
    artigos: [ "art. 415, parágrafo único, CPP" ]
    gabarito: "Não poderia o magistrado ter absolvido Carleto, com aplicação de medida de segurança, em razão da inimputabilidade, tendo em vista que esta não era a única tese apresentada pela defesa. Pelo contrário, a defesa de Carleto defendeu que o fato sequer seria ilícito, em razão de legítima defesa, tese que, se acolhida pelos jurados, nem mesmo levaria à análise da culpabilidade do agente. Sendo a absolvição própria pela legítima defesa, não seria cabível a aplicação de medida de segurança. Para que esta seja aplicada, em razão da reconhecida inimputabilidade do agente devido à doença mental, exige-se que o mesmo tenha praticado um fato típico e ilícito. Em se tratando de crime doloso contra a vida, a competência para o julgamento respectivo é do Tribunal do Júri, cabendo aos jurados a decisão se o acusado atuou sob a escora de excludente de ilicitude, no caso a da legítima defesa, que encontrava amparo em uma das vertentes dos autos. O Art. 415, parágrafo único, do CPP, autoriza a absolvição sumária em razão da inimputabilidade do agente, quando esta for a única tese defensiva. Na hipótese, a tese principal é a de excludente de ilicitude."
    revisao: { status: revisado }
  - id: 30-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que argumento processual permite anular a sentença de Eduardo?"
    tese: "Nulidade por violação da ampla defesa: morto o advogado, o réu devia ser chamado para constituir outro antes das alegações finais"
    aceitos: [ "ampla defesa | nulidade | nula | nulo | constituir outro | constituir novo" ]
    artigos: [ "art. 5, LV, CRFB", "art. 564, IV, CPP" ]
    gabarito: "O argumento a ser apresentado, em sede de recurso, para desconstituir a sentença condenatória, é o de que haveria violação ao princípio da ampla defesa, em sua vertente de defesa técnica, tendo em vista que as alegações finais foram apresentadas pela Defensoria Pública, não sendo o acusado intimado para, querendo, constituir novo patrono. De acordo com o que consta do enunciado, durante a instrução processual, Eduardo foi assistido por Pedro, advogado por ele constituído. Ocorre que, ao tomar conhecimento de que Pedro teria falecido, de imediato o magistrado encaminhou os autos à Defensoria Pública para apresentação de alegações finais, o que foi incorreto, já que o réu deveria ter sido intimado pessoalmente, pois estava preso, para esclarecer se teria interesse em ser assistido pela Defensoria ou se pretendia constituir novo advogado. Ao retirar esse direito do réu, o magistrado violou direito do acusado e o princípio da ampla defesa."
    revisao: { status: revisado }
  - id: 30-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Diante da confissão, que argumento de direito material reduz a pena de Eduardo?"
    tese: "Crime continuado: os roubos foram da mesma espécie, nas mesmas condições de tempo, lugar e modo de execução"
    aceitos: [ "continuidade delitiva | crime continuado | continuidade" ]
    artigos: [ "art. 71, CP" ]
    gabarito: "Em sede de apelação, poderia ser buscado o reconhecimento da continuidade delitiva, o que geraria redução da sanção penal aplicada. De acordo com o que consta do enunciado, de fato foram praticados cinco crimes de roubo. Mesmo sem emprego de arma de fogo ou simulacro de arma de fogo, houve grave ameaça na subtração dos bens de cinco vítimas diferentes, logo cinco patrimônios foram atingidos e cinco crimes autônomos foram praticados. Ainda que Eduardo tenha confessado os fatos, a pena mínima foi aplicada, não cabendo redução com fundamento na atenuante do Art. 65, III, d, do CP, nos termos da Súmula 231 do STJ. Todavia, o magistrado reconheceu o concurso material de crimes e somou a pena aplicada para cada um dos delitos. De acordo com o Art. 71 do CP, a pena de apenas um dos crimes será aplicada e aumentada de 1/6 a 2/3 quando o agente, mediante mais de uma ação, pratica dois ou mais crimes da mesma espécie, nas mesmas condições de tempo, lugar, maneira de execução, sendo os subsequentes continuação do primeiro. Todas as exigências legais foram preenchidas. Os delitos foram praticados no mesmo bairro, com intervalo de 30 minutos entre eles, sempre com o mesmo modo de execução. A intenção do agente sempre foi praticar vários crimes, um em continuidade do outro, para obter dinheiro suficiente para comprar uma motocicleta. Assim, ao invés do cúmulo material, deveria o magistrado ter aumentado a pena de um dos delitos (04 anos) em 1/6 a 2/3, ou, até mesmo, aplicar a previsão do Art. 71, parágrafo único, do CP."
    revisao: { status: revisado }
  - id: 30-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que argumento processual contesta a intimação de Maria?"
    tese: "Nulidade da intimação da sentença por edital: a ré presa devia ser intimada pessoalmente"
    aceitos: [ "pessoal* | nulidade | nula | nulo" ]
    artigos: [ "art. 392, I, CPP" ]
    gabarito: "O advogado, ao ser procurado pela família de Maria, deveria esclarecer que a intimação de Maria do teor da sentença condenatória não foi correta, tendo em vista que ela encontrava-se presa por outro crime, fato do conhecimento do Ministério Público. De acordo com o Art. 392 do CPP, a intimação da sentença deverá ser pessoal se o réu estiver preso, ainda que a prisão seja decorrente de outro processo. A intimação por edital deve ocorrer quando o réu estiver em local incerto e não sabido, quando não for possível sua localização, ou em alguma das situações previstas no Art. 392, incisos IV, V e V, do CPP, o que não foi o caso. A intimação por edital, como forma de intimação ficta, prejudicou Maria, que ainda não tinha conhecimento do teor da sentença condenatória."
    revisao: { status: revisado }
  - id: 30-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que argumento de direito material leva à absolvição de Maria?"
    tese: "Atipicidade material pela insignificância: o tributo iludido fica muito abaixo do limite de cobrança da Fazenda"
    aceitos: [ "insignifican* | bagatela | atipicidade material" ]
    artigos: [ "art. 20, Lei 10.522" ]
    gabarito: "O argumento seria de que a conduta praticada por Maria é atípica em razão da aplicação do princípio da insignificância. O conceito de crime envolve um fato típico, ilícito e culpável. Dentro da tipicidade, está a tipicidade material, que é a lesão relevante ao bem jurídico protegido. Em relação aos crimes tributários, a jurisprudência é tranquila no sentido de que haveria atipicidade material sempre que o valor do imposto sonegado não ultrapassar aquele que a Fazenda Pública considera baixo o suficiente para não justificar uma cobrança através de execução fiscal. Ainda que exista controvérsia se tal valor seria de R$ 10.000,00 ou R$ 20.000,00, fato é que, na presente hipótese, considerando que o valor do tributo não ultrapassaria R$ 500,00, o princípio da insignificância deveria ser aplicado. A lesão constatada não é grave o suficiente para justificar a intervenção do Direito Penal, diante de sua característica de subsidiariedade/última ratio."
    revisao: { status: revisado }
