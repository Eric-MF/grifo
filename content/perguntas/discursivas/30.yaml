    comando: Que tese preliminar deve ser alegada na peça, e com qual fundamento?
    gabarito: Extinção da punibilidade em relação ao crime de lesão corporal, em razão da decadência, nos termos do Art. 107, IV, do CP OU 38 do CPP.
    opcoes:
      correta: Extinção da punibilidade em relação ao crime de lesão corporal, em razão da decadência, nos termos do Art. 107, IV, do CP OU 38 do CPP.
      erradas:
        - "Preliminarmente: Nulidade da sentença ou de todos os atos processuais desde as alegações finais apresentadas pela Defensoria Pública, tendo em vista que não houve intimação do réu para manifestar interesse em indicar novo advogado OU tendo em vista que houve prejuízo para ampla defesa."
        - "Prescrição da pretensão punitiva: pena máxima de 4 anos prescreve em 8, mas a ré era menor de 21 anos e o prazo corre pela metade (CP, arts. 109, IV, 115 e 126)."
        - Ilicitude por derivação da prova testemunhal, com fundamento no art. 157, § 1º, CPP.
        - Preliminarmente, reconhecimento da nulidade dos atos da instrução OU requerimento de aplicação, por analogia, do art. 28 do CPP, diante do não oferecimento de proposta de suspensão condicional do processo, pois preenchidos os requisitos do Art. 89 da Lei 9099/95 OU pois irrelevante o fato do delito imputado não ser infração de menor potencial ofensivo.
        - Preliminarmente, extinção da punibilidade do agente OU nulidade em razão da ausência de representação, com reconhecimento da decadência, conforme o Art. 107, inciso IV, do CP OU 564, inciso III, alínea a, ou inciso IV, CPP
