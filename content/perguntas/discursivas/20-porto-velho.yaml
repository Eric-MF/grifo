    comando: Que pedido deve ser formulado na peça?
    gabarito: "Pedidos: absolvição do crime de furto, na forma do artigo 386, III, CPP;subsidiariamente, aplicação da pena base no mínimo legal;reconhecimento das atenuantes da confissão espontânea e da menoridade relativa;reconhecimento da forma privilegiada do furto;substituição da pena privativa de liberdade por restritiva de direitos;fixação do regime aberto; sursis da pena."
    opcoes:
      correta: "Pedidos: absolvição do crime de furto, na forma do artigo 386, III, CPP;subsidiariamente, aplicação da pena base no mínimo legal;reconhecimento das atenuantes da confissão espontânea e da menoridade relativa;reconhecimento da forma privilegiada do furto;substituição da pena privativa de liberdade por restritiva de direitos;fixação do regime aberto; sursis da pena."
      erradas:
        - Reconhecimento da preliminar e extinção da punibilidade; impronúncia, nos termos do art. 414 do CPP (admite-se absolvição sumária, art. 415).
        - fixação do regime inicial semiaberto.
        - Absolvição do crime de violação de domicílio OU absolvição nos termos do art. 386, III, do CPP.
        - Requerimento de reconhecimento da prescrição da pretensão punitiva do Estado, com consequente extinção da punibilidade do agente, nos termos do Art. 107, inciso IV, do CP.
        - Apresentação de rol de testemunhas.
    revisao: *a1
  - id: 20-porto-velho-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Jorge, com 21 anos de idade, reincidente, natural de São Gonçalo/RJ, entrou em uma briga com seus pais, razão pela qual foi morar na casa de sua tia Marta, irmã de seu pai, na cidade de Maricá/RJ, já que esta tinha apenas 40 anos e “o entenderia melhor”. Após 06 meses residindo no mesmo local que sua tia, Jorge subtraiu o carro de Marta, levando-o para uma favela em Niterói, onde pretendia morar no futuro. No começo, Marta não desconfiou da autoria, porém após alguns dias, teve certeza de que o autor do crime era seu sobrinho, mas nada fez para vê-lo responsabilizado criminalmente, em razão do afeto que tinha por ele. Apenas, então, comunicou à seguradora que seu veículo fora furtado.

      Jorge, 01 ano após esses fatos, estava na direção do veículo que havia subtraído quando foi abordado por policiais militares que, constatando que aquele bem era produto de crime pretérito, realizaram sua prisão em flagrante. Jorge foi denunciado pela prática do crime de receptação, mas, no curso da instrução, foi descoberto que, na verdade, o acusado era o autor do crime de furto. O Ministério Público aditou a denúncia para adequá-la às novas descobertas e, após manifestação da Defensoria Pública, foi o aditamento recebido. Não houve requerimento de novas provas. Jorge o(a) procura para, na condição de advogado(a), apresentar as Alegações Finais.

      Considerando as informações extraídas da hipótese, responda aos itens a seguir.
    comando: Qual a principal tese defensiva a ser formulada nas Alegações Finais para evitar a condenação de Jorge?
    gabarito: O enunciado narra a prática de um crime de furto simples consumado, praticado por Jorge contra sua tia Marta, com quem ele coabitava. Diante dessa relação de coabitação e parentesco, a ação penal pela prática de tal delito tem natureza de ação pública condicionada à representação. Isso porque o Art. 182, inciso III, do Código Penal prevê que somente se procede mediante representação a ação penal pela prática de crime contra o patrimônio em desfavor de tio, com quem o agente coabita. Não houve violência ou grave ameaça e a vítima não era maior de 60 anos, logo inaplicável o Art. 183 do Código Penal. Sendo a ação condicionada à representação, e não tendo ocorrido no prazo de 06 meses, ocorreu a decadência, de modo que a punibilidade de Jorge deve ser extinta (Art. 107, inciso IV, do Código Penal).
    opcoes:
      correta: Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 20-porto-velho-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Jorge, com 21 anos de idade, reincidente, natural de São Gonçalo/RJ, entrou em uma briga com seus pais, razão pela qual foi morar na casa de sua tia Marta, irmã de seu pai, na cidade de Maricá/RJ, já que esta tinha apenas 40 anos e “o entenderia melhor”. Após 06 meses residindo no mesmo local que sua tia, Jorge subtraiu o carro de Marta, levando-o para uma favela em Niterói, onde pretendia morar no futuro. No começo, Marta não desconfiou da autoria, porém após alguns dias, teve certeza de que o autor do crime era seu sobrinho, mas nada fez para vê-lo responsabilizado criminalmente, em razão do afeto que tinha por ele. Apenas, então, comunicou à seguradora que seu veículo fora furtado.

      Jorge, 01 ano após esses fatos, estava na direção do veículo que havia subtraído quando foi abordado por policiais militares que, constatando que aquele bem era produto de crime pretérito, realizaram sua prisão em flagrante. Jorge foi denunciado pela prática do crime de receptação, mas, no curso da instrução, foi descoberto que, na verdade, o acusado era o autor do crime de furto. O Ministério Público aditou a denúncia para adequá-la às novas descobertas e, após manifestação da Defensoria Pública, foi o aditamento recebido. Não houve requerimento de novas provas. Jorge o(a) procura para, na condição de advogado(a), apresentar as Alegações Finais.

      Considerando as informações extraídas da hipótese, responda aos itens a seguir.
    comando: Na condição de advogado(a) do acusado, o que você alegaria, no campo processual, caso o juiz viesse a condenar Jorge, após o aditamento, de acordo com a imputação original de receptação?
    gabarito: Não poderia o magistrado condenar o denunciado nos termos da imputação original, pois tal conduta violaria os princípios da ampla defesa e do contraditório, além, do princípio da correlação. Ademais, de acordo com Art. 384, §4º, do Código de Processo Penal, o juiz ficará adstrito aos termos do aditamento.
    opcoes:
      correta: Deveria ser alegada a impossibilidade de condenação na imputação originária, pois o juiz está adstrito aos termos do aditamento (Art. 384, §4º, do CPP) OU porque não foram observados os princípios da ampla defesa e do contraditório OU houve violação ao princípio da correlação.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
    revisao: *a1
  - id: 20-porto-velho-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Lívia, primária e de bons antecedentes, foi presa em flagrante enquanto transportava 100g de cocaína a pedido do namorado, conhecido traficante da comunidade em que residiam.

      Apesar de nunca ter participado de qualquer atividade do tráfico em momento anterior, Lívia atendeu ao pedido do namorado com medo de ele terminar o relacionamento em caso de negativa. Já na viatura da Polícia Militar, os policiais passaram a filmar Lívia e conversar sobre o ocorrido quando de sua prisão, tendo ela confirmado os fatos acima descritos sem que soubesse estar sendo filmada.

      Lívia, então, foi denunciada como incursa nas sanções penais do Art. 33 da Lei nº 11.343/06. Durante a instrução, o Ministério Público juntou aos autos o vídeo feito no interior da viatura e dispensou a oitiva dos policiais responsáveis pela prisão, que eram as únicas testemunhas de acusação, tendo em vista que eles foram transferidos para um batalhão de outra comarca. Em seu interrogatório, Lívia permaneceu em silêncio.

      Insatisfeitos com a defesa técnica que atuava até o momento, a família da acusada, no momento das alegações finais, o(a) contrata na condição de advogado(a).

      Considerando apenas os fatos narrados, responda, justificadamente, aos itens a seguir.
    comando: É possível a condenação de Lívia apenas com base no vídeo acostado aos autos?
    gabarito: |-
      Não é possível a condenação de Lívia na hipótese narrada. Os policiais militares responsáveis pela prisão em flagrante não foram ouvidos em juízo, logo não foram produzidas provas testemunhais pela acusação sob o crivo do contraditório, sendo certo que o Art. 155 do Código de Processo Penal impede que uma condenação seja baseada exclusivamente em elementos informativos produzidos durante o inquérito. Por sua vez, o vídeo, acostado aos autos, deve ser considerado prova ilícita, pois realizado em um interrogatório sem assegurar as garantias constitucionais, quais sejam, a de o preso permanecer em silêncio e estar acompanhado por um advogado. Há quem defenda que a gravação por um dos interlocutores, por si só, não constitui prova ilícita.

      Ocorre que, no caso concreto, a particularidade é que foi feito um interrogatório sem as garantias constitucionais, o que a jurisprudência tem chamado de “interrogatório sub-reptício”.
    opcoes:
      correta: Não é possível, devendo o vídeo ser considerado como prova ilícita, pois foi realizado em um interrogatório sem as garantias constitucionais.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 20-porto-velho-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Lívia, primária e de bons antecedentes, foi presa em flagrante enquanto transportava 100g de cocaína a pedido do namorado, conhecido traficante da comunidade em que residiam.

      Apesar de nunca ter participado de qualquer atividade do tráfico em momento anterior, Lívia atendeu ao pedido do namorado com medo de ele terminar o relacionamento em caso de negativa. Já na viatura da Polícia Militar, os policiais passaram a filmar Lívia e conversar sobre o ocorrido quando de sua prisão, tendo ela confirmado os fatos acima descritos sem que soubesse estar sendo filmada.

      Lívia, então, foi denunciada como incursa nas sanções penais do Art. 33 da Lei nº 11.343/06. Durante a instrução, o Ministério Público juntou aos autos o vídeo feito no interior da viatura e dispensou a oitiva dos policiais responsáveis pela prisão, que eram as únicas testemunhas de acusação, tendo em vista que eles foram transferidos para um batalhão de outra comarca. Em seu interrogatório, Lívia permaneceu em silêncio.

      Insatisfeitos com a defesa técnica que atuava até o momento, a família da acusada, no momento das alegações finais, o(a) contrata na condição de advogado(a).

      Considerando apenas os fatos narrados, responda, justificadamente, aos itens a seguir.
    comando: Em caso de condenação de Lívia como incursa nas sanções do Art. 33, § 4º, da Lei nº 11.343/06, é possível a substituição de pena privativa de liberdade por restritiva de direitos?
    gabarito: Sim, é possível a substituição da pena privativa de liberdade aplicada pela restritiva de direito. A redação do Art. 33, §4º, da Lei nº 11.343/06, veda expressamente esta substituição. Ocorre que, em sede de controle difuso de constitucionalidade, o STF considerou tal vedação em abstrato inconstitucional, por violar o princípio da individualização da pena. Em razão disso, o Senado, através da Resolução 05 de 2012, suspendeu a eficácia desta parte do dispositivo. Nada impede, assim, que, avaliando as particularidades do caso concreto, ocorra a substituição. Lívia é primária e de bons antecedentes, não tendo praticado crime com violência ou grave ameaça à pessoa, logo a substituição é adequada.
    opcoes:
      correta: Sim, é possível a substituição de pena privativa de liberdade por restritiva de direitos, pois o STF considerou inconstitucional a vedação em abstrato do Art. 33, §4º, da Lei nº 11.343 OU porque o Senado suspendeu a eficácia de parte da redação do Art. 33, §4º da Lei nº 11.343 por meio da Resolução 05 OU porque é inconstitucional, por violar o princípio da individualização da pena, a vedação em abstrato de substituição trazida pelo Art. 33, §4º, da Lei nº 11.343.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
    revisao: *a1
  - id: 20-porto-velho-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      No curso de uma audiência criminal, João, advogado de Pedro, acusado da prática de um crime de estupro, em sede de alegações finais orais, assevera que o representante do Ministério Público “é arbitrário e tem a sede da condenação, não se importando em acusar uma pessoa comprovadamente inocente”.

      Atendendo à manifestação do Promotor de Justiça, que se sentiu ofendido, o juiz destituiu o advogado e nomeou Defensor Público para continuar na defesa do acusado, que, na ocasião, não estava presente. O Defensor, então, concluiu as alegações finais orais. Na mesma assentada, o magistrado determinou a extração de peças, com o encaminhamento ao Ministério Público, para apurar possível crime contra a honra praticado por João. Pedro, assistido pela Defensoria Pública, acabou condenado na forma do pedido inicial. João, por sua vez, após representação do Promotor de Justiça vítima, foi denunciado pela prática de crime de injúria.

      Considerando apenas as informações constantes na hipótese narrada, responda, fundamentadamente, aos itens a seguir.
    comando: Na condição de advogado(a) de João, qual tese de direito material você alegaria em seu favor para afastar a imputação delitiva?
    gabarito: O examinando deve defender que não foi praticado crime contra a honra de funcionário público por parte de João, pois este estava apenas atuando na condição de advogado de Pedro, não ultrapassando os limites daquilo que sua função lhe permite. Em tese, o crime praticado por João seria o de injúria. Ocorre que, nos termos do Art. 142, inciso I, do Código Penal, não constitui crime de injúria a ofensa irrogada em juízo, na discussão da causa, pela parte ou por seu procurador. Assim, a conduta de João foi atípica, não configurando a prática de crime contra a honra, pois a possível ofensa praticada foi na discussão da causa, defendendo o interesse de Pedro em juízo.
    opcoes:
      correta: João não praticou crime de injúria e deve ser absolvido, pois atuava na condição de advogado e a ofensa irrogada em juízo, na discussão da causa, por parte do procurador não constitui injúria, nos termos do Art. 142, inciso I, do CP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
