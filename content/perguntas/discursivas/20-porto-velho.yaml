# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "20-porto-velho"
introducoes:
  peca: "Bruno, de 18 anos, achou um relógio caído ao lado do banco de um ônibus vazio e o guardou na mochila, sem avisar o motorista. Quinze minutos depois, o dono, Bernardo, voltou com um policial, revistou a mochila e encontrou o relógio, que valia R$ 100. Bruno confirmou os fatos, foi denunciado por furto simples, recusou a suspensão do processo e respondeu em liberdade. O Ministério Público pediu a condenação e o reconhecimento de maus antecedentes pela medida socioeducativa que ele cumpriu aos 16 anos. Você o defende nos memoriais."
  q1: "Jorge, de 21 anos, morava havia seis meses com a tia Marta quando levou o carro dela. Marta logo percebeu que era ele, mas nada fez, por afeto. Um ano depois, Jorge foi preso dirigindo o carro e denunciado por receptação; na instrução, o Ministério Público aditou a denúncia para furto, e o aditamento foi recebido."
  q2: "Lívia, primária, foi presa levando 100 g de cocaína a pedido do namorado traficante. Na viatura, os policiais a filmaram, sem avisar, contando os fatos, e o vídeo foi a única prova da acusação: os policiais nem foram ouvidos."
  q3: "Nas alegações finais orais de um processo por estupro, o advogado João disse que o promotor 'é arbitrário e tem sede de condenação'. O juiz destituiu João, sem a presença do réu Pedro, e nomeou um defensor público, que concluiu as alegações. Pedro foi condenado, e João foi denunciado por injúria."
  q4: "Maria, motorista de van escolar, mudou o roteiro para fazer compras e passou duas horas no supermercado, esquecendo uma criança de 3 anos no veículo. Levou a criança ao hospital, mas ela morreu. Maria foi condenada por abandono de incapaz com resultado morte."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["20-porto-velho-peca-1", "20-porto-velho-peca-12", "20-porto-velho-q4-b"]
perguntas:
  - id: 20-porto-velho-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: merito
    pergunta: "Bruno pegou um relógio que achou caído no ônibus vazio. Por que não houve furto?"
    tese: "Atipicidade do furto: a coisa perdida não pode ser furtada (e ainda não havia passado o prazo da apropriação de coisa achada)"
    aceitos: [ [ "coisa perdida | res desperdicta" ], [ "nao pode ser furtad*" ] ]
    artigos: [ "art. 155, CP", "art. 169, parágrafo único, II, CP" ]
    gabarito: "No mérito: absolvição do crime de furto, pois a coisa perdida (res desperdicta) não pode ser objeto de tal crime. Deve, ainda, ser mencionado que a hipótese não é de desclassificação para o crime de apropriação de coisa achada, pois a elementar de apropriação pelo prazo de 15 dias não foi realizada."
    revisao: { status: revisado }
  - id: 20-porto-velho-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: merito
    pergunta: "O relógio valia R$ 100. Que princípio afasta a tipicidade material da conduta?"
    tese: "Princípio da insignificância (bagatela), que afasta a tipicidade material"
    aceitos: [ "insignifica* | bagatela" ]
    artigos: [ "art. 386, III, CPP" ]
    gabarito: "Aplicação do princípio da bagatela ou insignificância, afastando a tipicidade material"
    revisao: { status: revisado }
  - id: 20-porto-velho-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "A medida socioeducativa que Bruno cumpriu aos 16 anos pode ser usada como maus antecedentes?"
    tese: "Ato infracional não gera maus antecedentes"
    aceitos: [ "nao gera | nao configura | nao serve | nao pode | nao caracteriz* | nao sao" ]
    artigos: [ "art. 59, CP" ]
    gabarito: "Subsidiariamente, em caso de condenação: aplicação da pena base no mínimo legal, destacando que a condenação em ação socioeducativa não gera maus antecedentes ou circunstância judicial desfavorável."
    revisao: { status: revisado }
  - id: 20-porto-velho-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Bruno tinha 18 anos no fato. Que atenuante deve ser reconhecida?"
    tese: "Atenuante da menoridade relativa"
    aceitos: [ "menoridade | menor de 21" ]
    artigos: [ "art. 65, I, CP" ]
    gabarito: "Reconhecimento da atenuante da menoridade relativa,na forma do Art. 65, inciso I, do CP."
    revisao: { status: revisado }
  - id: 20-porto-velho-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Bruno confirmou os fatos no processo. Que outra atenuante cabe?"
    tese: "Atenuante da confissão espontânea"
    aceitos: [ "confissao" ]
    artigos: [ "art. 65, III, d, CP" ]
    gabarito: "Reconhecimento da atenuante da confissão espontânea,na forma do Art. 65, inciso III, alínea d, do CP."
    revisao: { status: revisado }
  - id: 20-porto-velho-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: pedido
    pergunta: "Bruno é primário e o relógio é de pequeno valor. Que forma do furto a defesa deve pedir?"
    tese: "Furto privilegiado: réu primário e coisa de pequeno valor"
    aceitos: [ "privilegi*" ]
    artigos: [ "art. 155, § 2º, CP" ]
    gabarito: "Requerimento de aplicação do furto privilegiado, pleiteando a adoção de alguma das medidas previstas em lei (ou substituição da reclusão por detenção ou causa de diminuição de pena ou aplicação exclusivamente da pena de multa), na forma do Art. 155, §2º, do CP."
    revisao: { status: revisado }
  - id: 20-porto-velho-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Em caso de condenação, o que a defesa deve pedir quanto à espécie de pena?"
    tese: "Substituição da pena privativa de liberdade por restritivas de direitos"
    aceitos: [ "substitui*" ]
    artigos: [ "art. 44, CP" ]
    gabarito: "Substituição da pena privativa de liberdade por restritiva de direitos,pois preenchidos os requisitos do Art. 44 do CP."
    revisao: { status: revisado }
  - id: 20-porto-velho-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto"
    aceitos: [ "aberto" ]
    artigos: [ "art. 33, § 2º, c, CP" ]
    gabarito: "Aplicação do regime aberto para início do cumprimento da pena, na forma do Art. 33, §2º, alínea c, do Código Penal."
    revisao: { status: revisado }
  - id: 20-porto-velho-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Se a pena não for substituída, que benefício a defesa deve pedir?"
    tese: "Suspensão condicional da pena (sursis)"
    aceitos: [ "suspensao condicional da pena | sursis" ]
    artigos: [ "art. 77, CP" ]
    gabarito: "Caso não seja substituída a pena privativa de liberdade por restritiva de direitos, aplicação da suspensão condicional da pena, na forma do Art. 77 do CP."
    revisao: { status: revisado }
  - id: 20-porto-velho-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Marta soube logo que o sobrinho, que morava com ela, tinha levado o carro, mas nada fez. Que tese evita a condenação de Jorge?"
    tese: "Extinção da punibilidade pela decadência: o furto contra tio com quem se coabita depende de representação"
    aceitos: [ "decaden*" ]
    artigos: [ "art. 182, III, CP", "art. 38, CPP" ]
    gabarito: "O enunciado narra a prática de um crime de furto simples consumado, praticado por Jorge contra sua tia Marta, com quem ele coabitava. Diante dessa relação de coabitação e parentesco, a ação penal pela prática de tal delito tem natureza de ação pública condicionada à representação. Isso porque o Art. 182, inciso III, do Código Penal prevê que somente se procede mediante representação a ação penal pela prática de crime contra o patrimônio em desfavor de tio, com quem o agente coabita. Não houve violência ou grave ameaça e a vítima não era maior de 60 anos, logo inaplicável o Art. 183 do Código Penal. Sendo a ação condicionada à representação, e não tendo ocorrido no prazo de 06 meses, ocorreu a decadência, de modo que a punibilidade de Jorge deve ser extinta (Art. 107, inciso IV, do Código Penal)."
    revisao: { status: revisado }
  - id: 20-porto-velho-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Recebido o aditamento, o juiz pode condenar Jorge pela imputação original de receptação?"
    tese: "Princípio da correlação: recebido o aditamento, o juiz fica adstrito aos seus termos"
    aceitos: [ [ "adstrit* | vinculad* | limitad*" ], [ "correlacao | congruencia" ] ]
    artigos: [ "art. 384, § 4º, CPP" ]
    gabarito: "Não poderia o magistrado condenar o denunciado nos termos da imputação original, pois tal conduta violaria os princípios da ampla defesa e do contraditório, além, do princípio da correlação. Ademais, de acordo com Art. 384, §4º, do Código de Processo Penal, o juiz ficará adstrito aos termos do aditamento."
    revisao: { status: revisado }
  - id: 20-porto-velho-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Lívia pode ser condenada só com base no vídeo da viatura?"
    tese: "Ilicitude do vídeo da viatura, um interrogatório informal sem as garantias constitucionais"
    aceitos: [ "ilicit*" ]
    artigos: [ "art. 157, CPP", "art. 5, LXIII, CRFB" ]
    gabarito: "Não é possível a condenação de Lívia na hipótese narrada. Os policiais militares responsáveis pela prisão em flagrante não foram ouvidos em juízo, logo não foram produzidas provas testemunhais pela acusação sob o crivo do contraditório, sendo certo que o Art. 155 do Código de Processo Penal impede que uma condenação seja baseada exclusivamente em elementos informativos produzidos durante o inquérito. Por sua vez, o vídeo, acostado aos autos, deve ser considerado prova ilícita, pois realizado em um interrogatório sem assegurar as garantias constitucionais, quais sejam, a de o preso permanecer em silêncio e estar acompanhado por um advogado. Há quem defenda que a gravação por um dos interlocutores, por si só, não constitui prova ilícita.\n\nOcorre que, no caso concreto, a particularidade é que foi feito um interrogatório sem as garantias constitucionais, o que a jurisprudência tem chamado de “interrogatório sub-reptício”."
    revisao: { status: revisado }
  - id: 20-porto-velho-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Condenada por tráfico privilegiado, Lívia pode ter a pena substituída por restritivas de direitos?"
    tese: "Cabe a substituição por restritivas de direitos no tráfico privilegiado: a vedação foi declarada inconstitucional"
    aceitos: [ "inconstitucional*" ]
    artigos: [ "art. 44, CP" ]
    gabarito: "Sim, é possível a substituição da pena privativa de liberdade aplicada pela restritiva de direito. A redação do Art. 33, §4º, da Lei nº 11.343/06, veda expressamente esta substituição. Ocorre que, em sede de controle difuso de constitucionalidade, o STF considerou tal vedação em abstrato inconstitucional, por violar o princípio da individualização da pena. Em razão disso, o Senado, através da Resolução 05 de 2012, suspendeu a eficácia desta parte do dispositivo. Nada impede, assim, que, avaliando as particularidades do caso concreto, ocorra a substituição. Lívia é primária e de bons antecedentes, não tendo praticado crime com violência ou grave ameaça à pessoa, logo a substituição é adequada."
    revisao: { status: revisado }
  - id: 20-porto-velho-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que tese de direito material afasta a imputação de injúria contra João?"
    tese: "A imunidade judiciária: a ofensa irrogada em juízo, na discussão da causa, não é injúria"
    aceitos: [ [ "imunidade" ], [ "discussao da causa" ], [ "irrogada em juizo" ] ]
    artigos: [ "art. 142, I, CP" ]
    gabarito: "O examinando deve defender que não foi praticado crime contra a honra de funcionário público por parte de João, pois este estava apenas atuando na condição de advogado de Pedro, não ultrapassando os limites daquilo que sua função lhe permite. Em tese, o crime praticado por João seria o de injúria. Ocorre que, nos termos do Art. 142, inciso I, do Código Penal, não constitui crime de injúria a ofensa irrogada em juízo, na discussão da causa, pela parte ou por seu procurador. Assim, a conduta de João foi atípica, não configurando a prática de crime contra a honra, pois a possível ofensa praticada foi na discussão da causa, defendendo o interesse de Pedro em juízo."
    revisao: { status: revisado }
  - id: 20-porto-velho-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que tese a defesa de Pedro deve alegar no recurso para anular a sentença?"
    tese: "Nulidade, por violação da ampla defesa: Pedro não teve a chance de constituir outro advogado"
    aceitos: [ [ "nulidade | nula | nulo" ], [ "ampla defesa" ] ]
    artigos: [ "art. 5, LV, CRFB", "art. 263, CPP" ]
    gabarito: "O examinando deveria manifestar-se pela nulidade do processo a partir do ato ilegal de destituição do advogado legalmente constituído ou da sentença, pois não poderia o magistrado ter desconstituído de ofício o advogado, sendo uma escolha da parte indicar a defesa técnica de sua confiança. No caso de ser necessário outro defensor, deveria o juiz intimar o acusado para que manifeste seu interesse em constituir outro advogado ou ser assistido pela Defensoria Pública. Na hipótese, a desconstituição de João e a posterior nomeação de Defensor Público para elaborar alegações finais, sem nem mesmo ter conversado com Pedro, prejudicou sua ampla defesa, garantida pelo Art. 5º, inciso LV, da CRFB/88, razão pela qual deve a sentença ser anulada."
    revisao: { status: revisado }
  - id: 20-porto-velho-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que tese de direito material afasta a condenação de Maria por abandono de incapaz?"
    tese: "Desclassificação para homicídio culposo: ela não quis abandonar a criança, agiu com culpa"
    aceitos: [ [ "homicidio culposo" ], [ "sem dolo | ausencia de dolo | nao houve dolo | culpa" ] ]
    artigos: [ "art. 121, § 3º, CP" ]
    gabarito: "Deveria o advogado buscar a absolvição de Maria pelo fato de não ter praticado dolosamente o abandono de incapaz ou, ao menos, a desclassificação para homicídio culposo. O crime de abandono de incapaz somente pode ser praticado de forma dolosa, não admitindo a responsabilização criminal do agente a título de culpa. Na hipótese, de acordo com o texto apresentado, Maria não teve a intenção de abandonar a criança no veículo, tendo, de forma negligente, a esquecido no interior do carro. Dessa forma, não há como ser mantida a condenação pelo crime de abandono de incapaz. O Art. 133, §2º, do Código Penal, apesar de ser aplicável quando o resultado morte decorrer de culpa, exige que haja dolo na conduta antecedente, qual seja, abandono de incapaz, o que não ocorreu na presente hipótese."
    revisao: { status: revisado }
