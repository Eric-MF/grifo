    gabarito: Requerimento de aplicação do furto privilegiado, pleiteando a adoção de alguma das medidas previstas em lei (ou substituição da reclusão por detenção ou causa de diminuição de pena ou aplicação exclusivamente da pena de multa), na forma do Art. 155, §2º, do CP.
    opcoes:
      correta: Requerimento de aplicação do furto privilegiado, pleiteando a adoção de alguma das medidas previstas em lei (ou substituição da reclusão por detenção ou causa de diminuição de pena ou aplicação exclusivamente da pena de multa), na forma do Art. 155, §2º, do CP.
      erradas:
        - Reconhecimento da preliminar e extinção da punibilidade; impronúncia, nos termos do art. 414 do CPP (admite-se absolvição sumária, art. 415).
        - Absolvição, na forma do Art. 386, inciso III, do CPP.
        - Pedido de retratação ou efeito regressivo, com fundamento no Art. 589 do CPP.
        - Rol de testemunhas (Maria, José e Natália).
        - Oferecimento de proposta de suspensão condicional do processo.
