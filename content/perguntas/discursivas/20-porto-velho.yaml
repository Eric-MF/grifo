      Considerando apenas as informações constantes na hipótese narrada, responda, fundamentadamente, aos itens a seguir.
    comando: Na condição de advogado(a) de Pedro, qual é a tese a ser alegada, em sede de recurso, para anular a sentença condenatória?
    gabarito: O examinando deveria manifestar-se pela nulidade do processo a partir do ato ilegal de destituição do advogado legalmente constituído ou da sentença, pois não poderia o magistrado ter desconstituído de ofício o advogado, sendo uma escolha da parte indicar a defesa técnica de sua confiança. No caso de ser necessário outro defensor, deveria o juiz intimar o acusado para que manifeste seu interesse em constituir outro advogado ou ser assistido pela Defensoria Pública. Na hipótese, a desconstituição de João e a posterior nomeação de Defensor Público para elaborar alegações finais, sem nem mesmo ter conversado com Pedro, prejudicou sua ampla defesa, garantida pelo Art. 5º, inciso LV, da CRFB/88, razão pela qual deve a sentença ser anulada.
    opcoes:
      correta: Nulidade da sentença ou de todos os atos a partir da desconstituição de João, por violação da ampla defesa de Pedro OU porque deveria Pedro ser intimado para manifestar interesse em constituir novo advogado OU porque não poderia o magistrado ter desconstituído advogado de Pedro na sua ausência.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
