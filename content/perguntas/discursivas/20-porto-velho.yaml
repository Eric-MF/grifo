  - id: 20-porto-velho-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Maria, primária e com bons antecedentes, trabalha há vários anos dirigindo uma van de transporte de crianças.

      Certo dia, após mudar o itinerário sempre observado, resolve fazer compras em um supermercado, onde permaneceu por duas horas, esquecendo de entregar uma das crianças de 03 anos na residência da mesma. Ao retornar ao veículo, encontra a criança desfalecida e, desesperada, leva-a ao hospital, não conseguindo, porém, evitar o óbito. Acabou denunciada e condenada pela prática do injusto do Art. 133, § 2º, do Código Penal (abandono de incapaz com resultado morte) à pena de 04 anos de reclusão em regime aberto.

      Apesar de ter respondido ao processo em liberdade, não foi permitido à Maria apelar em liberdade, fundamentando o juiz a ordem de prisão na grande comoção social que o fato causou. A família dispensou o advogado anterior e o(a) procurou para que assumisse a defesa de Maria.

      Considerando apenas as informações narradas na situação hipotética, responda aos itens a seguir.
    comando: Qual a tese de direito material a ser alegada em eventual recurso defensivo para evitar a punição de Maria pelo crime pelo qual foi denunciada? Justifique.
    gabarito: Deveria o advogado buscar a absolvição de Maria pelo fato de não ter praticado dolosamente o abandono de incapaz ou, ao menos, a desclassificação para homicídio culposo. O crime de abandono de incapaz somente pode ser praticado de forma dolosa, não admitindo a responsabilização criminal do agente a título de culpa. Na hipótese, de acordo com o texto apresentado, Maria não teve a intenção de abandonar a criança no veículo, tendo, de forma negligente, a esquecido no interior do carro. Dessa forma, não há como ser mantida a condenação pelo crime de abandono de incapaz. O Art. 133, §2º, do Código Penal, apesar de ser aplicável quando o resultado morte decorrer de culpa, exige que haja dolo na conduta antecedente, qual seja, abandono de incapaz, o que não ocorreu na presente hipótese.
    opcoes:
      correta: A tese a ser alegada é que Maria deve ser absolvida ou ter sua conduta desclassificada para o crime de homicídio culposo, pois o abandono decorreu de culpa e não de dolo.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
