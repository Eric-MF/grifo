# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "18"
introducoes:
  peca: "Em fevereiro de 2015, Caio, então com 20 anos, entrou no quarto da vizinha Joana e, sob grave ameaça, a obrigou, numa mesma ocasião, à conjunção carnal e a outros atos libidinosos. Confessou na instrução. Foi condenado por dois estupros em continuidade delitiva a 10 anos e 6 meses no regime fechado. Na pena-base, o juiz considerou maus antecedentes duas condenações sem trânsito em julgado e o desrespeito à liberdade sexual da mulher; não reconheceu atenuantes, porque Caio hoje tem mais de 21 anos; aumentou a pena em 1/2 pela gravidade dos crimes; e disse que o regime fechado é obrigatório para crime hediondo. Você defende Caio na apelação."
  q1: "Karen, caixa de um supermercado, tirou dinheiro do caixa quatro vezes na mesma semana, em março de 2008. A denúncia foi recebida em 20/4/2008 e, em 25/4/2012, ela foi condenada a 2 anos por furto, com o aumento de 1/4 pela continuidade, total de 2 anos e 6 meses, substituídos por restritivas de direitos. Ninguém recorreu."
  q2: "Em 2012, João foi condenado, com trânsito em julgado, a 6 anos por quadrilha armada, com a pena dobrada por ser armada. Enquanto ele cumpria a pena, a Lei 12.850/2013 mudou o artigo: a mesma pena-base, mas o aumento pela arma passou a ser de até a metade."
  q3: "No júri, Fernando e a namorada disseram que ele agiu em legítima defesa contra Henrique; a namorada da vítima e uma testemunha negaram a agressão. Os jurados absolveram Fernando, e o Ministério Público apelou dizendo que a decisão contrariou manifestamente a prova. Dois dos jurados eram irmãos, o que ninguém questionou, nem no recurso."
  q4: "John, primário, foi condenado por tráfico privilegiado a 1 ano e 8 meses no regime aberto. Na apelação, a Câmara manteve a sentença por maioria; o voto vencido substituía a pena por duas restritivas de direitos."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["18-peca-1", "18-peca-3", "18-peca-4", "18-peca-8", "18-peca-12-1", "18-peca-12-2"]
perguntas:
  - id: 18-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Que tese a defesa deve opor à condenação por dois estupros, cometidos contra a mesma vítima numa só ocasião?"
    tese: "Crime único: o estupro é tipo misto alternativo"
    aceitos: [ [ "crime unico | delito unico | um so crime | unico crime" ], [ "tipo misto alternativo" ] ]
    artigos: [ "art. 213, CP" ]
    gabarito: "Afastar o concurso de crimes, com o reconhecimento de um crime único de estupro (1,0), tendo em vista que o Art. 213 do CP traz um tipo misto alternativo OU tendo em vista que os atos foram praticados em um mesmo contexto e contra a mesma vítima."
    revisao: { status: revisado }
  - id: 18-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Duas condenações sem trânsito em julgado podem aumentar a pena-base como maus antecedentes?"
    tese: "Processos sem trânsito em julgado não são maus antecedentes nem agravam a pena-base (presunção de inocência)"
    aceitos: [ [ "presuncao de inocencia | estado de inocencia" ], [ "nao configuram | nao podem | nao servem | nao caracteriz* | nao sao" ] ]
    artigos: [ "Súmula 444 STJ" ]
    gabarito: "Afastar o aumento da pena base pelo reconhecimento de maus antecedentes, pois ações penais em curso não funcionam como circunstância judicial desfavorável, na forma da Súmula 444 do STJ OU em face do princípio da presunção de inocência."
    revisao: { status: revisado }
  - id: 18-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Por que o juiz não podia aumentar a pena-base pelo desrespeito à liberdade sexual da mulher?"
    tese: "Bis in idem: o desrespeito à liberdade sexual é inerente ao tipo do estupro"
    aceitos: [ [ "inerente | elementar" ], [ "bis in idem" ] ]
    artigos: [ "art. 59, CP" ]
    gabarito: "Afastar o aumento da pena base pela violação da liberdade sexual da mulher, tendo em vista que é inerente ao tipo.."
    revisao: { status: revisado }
  - id: 18-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Caio confessou na instrução. Que outra atenuante o juiz deixou de reconhecer?"
    tese: "Atenuante da confissão espontânea"
    aceitos: [ "confissao" ]
    artigos: [ "art. 65, III, d, CP" ]
    gabarito: "Reconhecimento da atenuante da confissão espontânea, na forma do Art. 65, inciso III, alínea d, do CP."
    revisao: { status: revisado }
  - id: 18-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Mantidos os dois crimes, qual deve ser o aumento pela continuidade delitiva?"
    tese: "Aumento mínimo de um sexto pela continuidade delitiva: o aumento segue o número de crimes, não a gravidade"
    aceitos: [ "1/6 | um sexto | minimo" ]
    artigos: [ "art. 71, CP" ]
    gabarito: "Subsidiariamente, em caso de manutenção da condenação por dois crimes de estupro, redução do quantum de aumento pelo concurso de crimes para o mínimo legal, pois o critério a ser adotado é o número de delitos e não sua gravidade em abstrato."
    revisao: { status: revisado }
  - id: 18-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Com a pena reduzida, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial semiaberto: o regime fechado obrigatório para crime hediondo é inconstitucional"
    aceitos: [ "semiaberto | semi-aberto | semi aberto" ]
    artigos: [ "art. 33, § 2º, b, CP", "art. 5, XLVI, CRFB" ]
    gabarito: "Fixação do regime semiaberto, pois a imposição trazida pelo Art. 2º, § 1º, da Lei nº 8.072 é inconstitucional OU viola o princípio da individualização da pena."
    revisao: { status: revisado }
  - id: 18-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que tese impede Karen de cumprir a pena?"
    tese: "A prescrição da pretensão punitiva, calculada pela pena de cada crime, sem o aumento da continuidade"
    aceitos: [ "prescri*" ]
    artigos: [ "art. 119, CP", "art. 109, V, CP" ]
    gabarito: "A questão exige do candidato conhecimento do tema da prescrição. Foi narrada, na hipótese, a condenação de Karen por quatro crimes de furto qualificado, sendo de 02 anos a pena definitiva de cada um deles.\n\nReconhecida a continuidade delitiva, a pena final fixada foi de 02 anos e 06 meses de reclusão.\n\nPrevê o Art. 119 do Código Penal que, em caso de concurso de crimes, a análise da prescrição deverá ser feita sobre a pena de cada um dos crimes isoladamente. Assim, no caso, a prescrição deveria considerar a pena aplicada de 02 anos para cada um dos delitos, não de 02 anos e 06 meses. A pena fixada entre 01 e 02 anos prescreverá em 04 anos, na forma do Art. 109, V, do Código Penal. Entre o recebimento da denúncia e a publicação da sentença condenatória, foram ultrapassados mais de 04 anos; logo, ocorreu a prescrição da pretensão punitiva do Estado.\n\nDiante do exposto, a tese defensiva a ser alegada é a ocorrência da prescrição da pretensão punitiva do Estado em sua modalidade retroativa."
    revisao: { status: revisado }
  - id: 18-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Acolhida a tese, essa condenação poderá gerar reincidência no futuro?"
    tese: "A prescrição da pretensão punitiva apaga os efeitos da condenação, que não gera reincidência"
    aceitos: [ [ "pretensao punitiva" ], [ "nao gera | nao pode | nao servira | nao produz | nenhum efeito | sem efeito | apaga" ] ]
    artigos: [ "art. 107, IV, CP" ]
    gabarito: "A consequência jurídica do acolhimento da tese é o reconhecimento da extinção da punibilidade de Karen, na forma do Art. 107, inciso IV, do Código Penal. Além disso, considerando que a prescrição foi da pretensão punitiva, essa condenação não gerará qualquer efeito, não podendo funcionar como maus antecedentes, reincidência ou título executivo na esfera cível."
    revisao: { status: revisado }
  - id: 18-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "O que a defesa de João pode pedir por causa da lei nova?"
    tese: "A aplicação retroativa da lei mais benéfica, com a redução da pena"
    aceitos: [ "retroativ* | lei mais benefica | lei mais favoravel | novatio legis in mellius" ]
    artigos: [ "art. 2, parágrafo único, CP", "art. 5, XL, CRFB" ]
    gabarito: "A defesa técnica de João poderia requerer a aplicação da lei nova, que é mais benéfica para o acusado. A redação anterior do Art. 288, parágrafo único, do CP previa que, no caso daquele crime ser praticado com armas de fogo, a pena seria dobrada. Hoje, o dispositivo prevê que a pena, nessa mesma hipótese, será “apenas” aumentada de, no máximo, metade. Assim, no caso de João, como sua pena base foi aplicada em 03 anos, a pena final restaria em, no máximo, 04 anos e 06 meses. A nova lei, então, é favorável ao condenado, de modo que pode retroagir para atingir situações pretéritas, na forma do Art. 2º, parágrafo único, do CP."
    revisao: { status: revisado }
  - id: 18-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "A que juízo esse pedido deve ser dirigido?"
    tese: "Competência do juízo da execução penal para aplicar a lei mais benéfica"
    aceitos: [ "execu*" ]
    artigos: [ "Súmula 611 STF", "art. 66, I, LEP" ]
    gabarito: "Considerando que já houve trânsito em julgado da sentença condenatória, o juízo competente para formulação do requerimento é o da Vara de Execuções Penais, na forma do enunciado 611 da Súmula não vinculante do STF ou do Art. 66, inciso I, da LEP."
    revisao: { status: revisado }
  - id: 18-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "A absolvição de Fernando foi manifestamente contrária à prova dos autos?"
    tese: "Soberania dos veredictos: os jurados escolheram uma das versões com apoio na prova"
    aceitos: [ [ "soberania" ], [ "intima convic*" ] ]
    artigos: [ "art. 5, XXXVIII, c, CRFB" ]
    gabarito: "A decisão dos jurados não foi manifestamente contrária à prova dos autos, tendo em vista que o acusado e sua namorada alegaram a existência de legítima defesa. De fato, a namorada da vítima e uma testemunha afirmaram que esta causa excludente da ilicitude não existiu. Contudo, existem duas versões nos autos, com provas em ambos os sentidos, logo os jurados são livres para optar por uma delas, de acordo com a íntima convicção. Não houve arbitrariedade ou total dissociação da prova dos autos, mas apenas escolha de uma das versões. Assim, a soberania dos vereditos deve prevalecer, não cabendo ao Tribunal fazer nova análise do mérito, se a decisão não foi manifestamente contrária às provas produzidas."
    revisao: { status: revisado }
  - id: 18-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "No recurso do Ministério Público, o Tribunal pode anular o júri porque dois jurados eram irmãos?"
    tese: "O tribunal fica limitado aos fundamentos do recurso e não pode reconhecer contra o réu nulidade não alegada"
    aceitos: [ [ "limitad* | adstrit* | vinculad*" ], [ "nao arguid* | nao alegad* | nao suscitad*" ] ]
    artigos: [ "Súmula 713 STF", "Súmula 160 STF" ]
    gabarito: "Não poderá o Tribunal anular o julgamento com base na existência de nulidade ocorrida durante a sessão plenária. De fato, prevê o Art. 448, inciso IV, do CPP, que estão impedidos de servir no mesmo Conselho os irmãos. Ocorre que o enunciado 713 da Súmula não vinculante do STF afirma categoricamente que “o efeito devolutivo da apelação contra decisões do júri é adstrito aos fundamentos de sua interposição”. O Ministério Público apresentou apelação apenas com fundamento na alínea ‘d’ do Art. 593, inciso III, do Código de Processo Penal. Assim, está limitado o efeito devolutivo, de modo que o Tribunal somente poderá analisar a existência de decisão manifestamente contrária à prova dos autos. Decisão em contrário prejudicaria a ampla defesa, pois eventual nulidade não foi combatida pela defesa em sede de contrarrazões. Poderia, ainda, o candidato basear sua resposta no enunciado 160 da Súmula do STF, que afirma que é nula a decisão que acolhe, contra réu, nulidade não arguida pela acusação."
    revisao: { status: revisado }
  - id: 18-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Fora o habeas corpus, que medida a defesa de John deve usar contra o acórdão?"
    tese: "Embargos infringentes"
    aceitos: [ "embargos infringentes" ]
    artigos: [ "art. 609, parágrafo único, CPP" ]
    gabarito: "A medida processual a ser adotada pelo advogado de John é a interposição de recurso de Embargos Infringentes, na forma do Art. 609, parágrafo único, do CPP, considerando que a decisão proferida em sede de Apelação não foi, em relação à substituição da pena, unânime."
    revisao: { status: revisado }
  - id: 18-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que fundamento de direito material faz prevalecer o voto vencido?"
    tese: "A vedação da substituição da pena no tráfico privilegiado foi declarada inconstitucional"
    aceitos: [ "inconstitucional*" ]
    artigos: [ "art. 44, CP" ]
    gabarito: "Para fazer prevalecer o voto vencido, deverá o examinando demonstrar a possibilidade de ser substituída a pena privativa de liberdade por restritiva de direitos, tendo em vista que foi reconhecido que o acusado é primário, de bons antecedentes e que não se dedica ao crime e nem integra organização criminosa. Em que pese o Art. 33, § 4º, da Lei nº 11.343/06, vedar a substituição da pena privativa de liberdade por restritiva de direitos, o Supremo Tribunal Federal, em sede de controle difuso de inconstitucionalidade, entendeu que tal vedação viola o princípio da individualização da pena. Ademais, diante dessa decisão o Senado Federal editou a Resolução nº 05, suspendendo a eficácia da parte da redação do Art. 33, § 4º, da Lei nº 11.343/06, que veda a substituição."
    revisao: { status: revisado }
