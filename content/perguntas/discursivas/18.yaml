      Obs.: o examinando deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.
    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Reconhecimento de crime único de estupro; aplicação da pena base no mínimo legal; reconhecimento da atenuante da confissão e da menoridade relativa; subsidiariamente, redução do quantum de aumento pelo concurso de crimes; e fixação do regime semiaberto.
    opcoes:
      correta: Reconhecimento de crime único de estupro; aplicação da pena base no mínimo legal; reconhecimento da atenuante da confissão e da menoridade relativa; subsidiariamente, redução do quantum de aumento pelo concurso de crimes; e fixação do regime semiaberto.
      erradas:
        - Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
        - Atipicidade da conduta ou desclassificação para crime de dano qualificado, tendo em vista que a conduta de Júlio de colocar fogo no imóvel não gerou perigo a número indeterminado de pessoas e o crime de incêndio é crime de perigo comum, exigindo prova de perigo concreto.
        - Da tese da prática de crime único, pois o delito de estupro de vulnerável é um tipo misto alternativo (de conteúdo múltiplo ou variado).
        - O reconhecimento do erro de tipo tem como consequência a exclusão do dolo ou atipicidade da conduta.
        - A prática de falta grave não gera o reinício da contagem do prazo de indulto, nos termos da Súmula 535 do STJ.
