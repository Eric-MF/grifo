  - id: 18-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
      John, primário e de bons antecedentes, foi denunciado pela prática do crime de tráfico de drogas. Após a instrução, inclusive com realização do interrogatório, ocasião em que o acusado confessou os fatos, John foi condenado, na forma do Art. 33, § 4º, da Lei nº 11.343/06, à pena de 1 ano e 08 meses de reclusão, a ser cumprido em regime inicial aberto. O advogado de John interpôs o recurso cabível da sentença condenatória. Em julgamento pela Câmara Criminal do Tribunal de Justiça, a sentença foi integralmente mantida por maioria de votos. O Desembargador revisor, por sua vez, votou no sentido de manter a pena de 01 ano e 08 meses de reclusão, assim como o regime, mas foi favorável à substituição da pena privativa de liberdade por duas restritivas de direitos, no que restou vencido. O advogado de John é intimado do acórdão.

      Considerando a situação narrada, responda aos itens a seguir.
    comando: Qual fundamento de direito material deverá ser apresentado para fazer prevalecer o voto vencido?
    gabarito: Para fazer prevalecer o voto vencido, deverá o examinando demonstrar a possibilidade de ser substituída a pena privativa de liberdade por restritiva de direitos, tendo em vista que foi reconhecido que o acusado é primário, de bons antecedentes e que não se dedica ao crime e nem integra organização criminosa. Em que pese o Art. 33, § 4º, da Lei nº 11.343/06, vedar a substituição da pena privativa de liberdade por restritiva de direitos, o Supremo Tribunal Federal, em sede de controle difuso de inconstitucionalidade, entendeu que tal vedação viola o princípio da individualização da pena. Ademais, diante dessa decisão o Senado Federal editou a Resolução nº 05, suspendendo a eficácia da parte da redação do Art. 33, § 4º, da Lei nº 11.343/06, que veda a substituição.
    opcoes:
      correta: O fundamento seria a possibilidade de substituição da pena privativa de liberdade por restritiva de direitos, tendo em vista que o STF considerou inconstitucional a vedação trazida pelo Art. 33, § 4º, da Lei nº 11.343/06 OU porque a vedação do Art. 33, § 4º, da Lei nº 11.343/06, viola o princípio da individualização da pena OU porque a Resolução 5 do Senado suspendeu a eficácia de parte da redação do Art. 33, § 4º, da Lei nº 11.343/06.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
