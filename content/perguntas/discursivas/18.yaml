    gabarito: "Endereçamento correto: 1ª Vara Criminal da Comarca de Natal/RN"
    opcoes:
      correta: "Endereçamento correto: 1ª Vara Criminal da Comarca de Natal/RN"
      erradas:
        - "Endereçamento correto das razões: Tribunal de Justiça do Estado."
