  - id: 18-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      No dia 02 de março de 2008, Karen, 30 anos, funcionária do caixa do Supermercado Rei, subtraiu para si a quantia de R$ 700,00 (setecentos reais) do estabelecimento, ao final de seu expediente. No dia seguinte, percebendo a facilidade ocorrida no dia anterior, Karen voltou a subtrair determinada quantia do caixa do supermercado. Ainda na mesma semana, a funcionária, com o mesmo modus operandi, subtraiu, por mais duas vezes, valores pertencentes ao estabelecimento comercial. Ocorre que as condutas de Karen foram filmadas e os vídeos foram encaminhados para o Ministério Público, que ofereceu denúncia pela prática do crime descrito no Art. 155, § 4º, inciso II, do Código Penal, por quatro vezes, na forma do Art. 71 do mesmo diploma legal. Em 20 de abril de 2008 a denúncia foi recebida, tendo o feito seu regular processamento, até que, em 25 de abril de 2012, foi publicada decisão condenando Karen à pena final de 02 anos e 06 meses de reclusão e 12 dias multa, substituída por restritiva de direitos. Para cada um dos crimes foi aplicada a pena mínima de 02 anos de reclusão e 10 dias multa, mas fixou o magistrado a fração de 1/4 para aumento da pena, em virtude do reconhecimento do crime continuado. As partes não interpuseram recurso de apelação.

      Considerando que não existe mais possibilidade de interposição de recurso da decisão, responda aos itens a seguir.
    comando: Qual a tese defensiva a ser alegada, de modo a impedir que Karen cumpra a pena que lhe foi aplicada? Fundamente.
    gabarito: |-
      A questão exige do candidato conhecimento do tema da prescrição. Foi narrada, na hipótese, a condenação de Karen por quatro crimes de furto qualificado, sendo de 02 anos a pena definitiva de cada um deles.

      Reconhecida a continuidade delitiva, a pena final fixada foi de 02 anos e 06 meses de reclusão.

      Prevê o Art. 119 do Código Penal que, em caso de concurso de crimes, a análise da prescrição deverá ser feita sobre a pena de cada um dos crimes isoladamente. Assim, no caso, a prescrição deveria considerar a pena aplicada de 02 anos para cada um dos delitos, não de 02 anos e 06 meses. A pena fixada entre 01 e 02 anos prescreverá em 04 anos, na forma do Art. 109, V, do Código Penal. Entre o recebimento da denúncia e a publicação da sentença condenatória, foram ultrapassados mais de 04 anos; logo, ocorreu a prescrição da pretensão punitiva do Estado.

      Diante do exposto, a tese defensiva a ser alegada é a ocorrência da prescrição da pretensão punitiva do Estado em sua modalidade retroativa.
    opcoes:
      correta: Ocorrência da prescrição da pretensão punitiva, já que a análise da prescrição ocorre de acordo com a pena fixada para cada um dos delitos em separado, segundo o Art. 109, V, do CP e/ou Art. 119, CP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 18-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      No dia 02 de março de 2008, Karen, 30 anos, funcionária do caixa do Supermercado Rei, subtraiu para si a quantia de R$ 700,00 (setecentos reais) do estabelecimento, ao final de seu expediente. No dia seguinte, percebendo a facilidade ocorrida no dia anterior, Karen voltou a subtrair determinada quantia do caixa do supermercado. Ainda na mesma semana, a funcionária, com o mesmo modus operandi, subtraiu, por mais duas vezes, valores pertencentes ao estabelecimento comercial. Ocorre que as condutas de Karen foram filmadas e os vídeos foram encaminhados para o Ministério Público, que ofereceu denúncia pela prática do crime descrito no Art. 155, § 4º, inciso II, do Código Penal, por quatro vezes, na forma do Art. 71 do mesmo diploma legal. Em 20 de abril de 2008 a denúncia foi recebida, tendo o feito seu regular processamento, até que, em 25 de abril de 2012, foi publicada decisão condenando Karen à pena final de 02 anos e 06 meses de reclusão e 12 dias multa, substituída por restritiva de direitos. Para cada um dos crimes foi aplicada a pena mínima de 02 anos de reclusão e 10 dias multa, mas fixou o magistrado a fração de 1/4 para aumento da pena, em virtude do reconhecimento do crime continuado. As partes não interpuseram recurso de apelação.

      Considerando que não existe mais possibilidade de interposição de recurso da decisão, responda aos itens a seguir.
    comando: Quais as consequências jurídicas do acolhimento dessa tese? Aquela condenação poderá ser considerada para efeito de reincidência futuramente?
    gabarito: A consequência jurídica do acolhimento da tese é o reconhecimento da extinção da punibilidade de Karen, na forma do Art. 107, inciso IV, do Código Penal. Além disso, considerando que a prescrição foi da pretensão punitiva, essa condenação não gerará qualquer efeito, não podendo funcionar como maus antecedentes, reincidência ou título executivo na esfera cível.
    opcoes:
      correta: A principal consequência é a extinção da punibilidade, na forma do Art. 107, IV, do CP, não podendo aquela condenação funcionar como reincidência por não gerar qualquer efeito, já que a prescrição é da pretensão punitiva estatal e não executória.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 18-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      No dia 10 de fevereiro de 2012, João foi condenado pela prática do delito de quadrilha armada, previsto no Art. 288, parágrafo único, do Código Penal. Considerando as particularidades do caso concreto, sua pena foi fixada no máximo de 06 anos de reclusão, eis que duplicada a pena base por força da quadrilha ser armada. A decisão transitou em julgado. Enquanto cumpria pena, entrou em vigor a Lei nº 12.850/2013, que alterou o artigo pelo qual João fora condenado. Apesar da sanção em abstrato, excluídas as causas de aumento, ter permanecido a mesma (reclusão, de 1 (um) a 3 (três) anos), o aumento de pena pelo fato da associação ser armada passou a ser de até a metade e não mais do dobro.

      Procurado pela família de João, responda aos itens a seguir.
    comando: O que a defesa técnica poderia requerer em favor dele?
    gabarito: A defesa técnica de João poderia requerer a aplicação da lei nova, que é mais benéfica para o acusado. A redação anterior do Art. 288, parágrafo único, do CP previa que, no caso daquele crime ser praticado com armas de fogo, a pena seria dobrada. Hoje, o dispositivo prevê que a pena, nessa mesma hipótese, será “apenas” aumentada de, no máximo, metade. Assim, no caso de João, como sua pena base foi aplicada em 03 anos, a pena final restaria em, no máximo, 04 anos e 06 meses. A nova lei, então, é favorável ao condenado, de modo que pode retroagir para atingir situações pretéritas, na forma do Art. 2º, parágrafo único, do CP.
    opcoes:
      correta: Poderia requerer a redução de sua pena pela aplicação da Lei nº 12.850/13 ou pela aplicação da nova redação do artigo 288, parágrafo único, do Código Penal, que traz previsão mais favorável ao acusado e deve retroagir, na forma do artigo 2º, parágrafo único, do Código Penal OU do artigo 5º, XL, CRFB.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 18-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      No dia 10 de fevereiro de 2012, João foi condenado pela prática do delito de quadrilha armada, previsto no Art. 288, parágrafo único, do Código Penal. Considerando as particularidades do caso concreto, sua pena foi fixada no máximo de 06 anos de reclusão, eis que duplicada a pena base por força da quadrilha ser armada. A decisão transitou em julgado. Enquanto cumpria pena, entrou em vigor a Lei nº 12.850/2013, que alterou o artigo pelo qual João fora condenado. Apesar da sanção em abstrato, excluídas as causas de aumento, ter permanecido a mesma (reclusão, de 1 (um) a 3 (três) anos), o aumento de pena pelo fato da associação ser armada passou a ser de até a metade e não mais do dobro.

      Procurado pela família de João, responda aos itens a seguir.
    comando: Qual o juízo competente para a formulação desse requerimento?
    gabarito: Considerando que já houve trânsito em julgado da sentença condenatória, o juízo competente para formulação do requerimento é o da Vara de Execuções Penais, na forma do enunciado 611 da Súmula não vinculante do STF ou do Art. 66, inciso I, da LEP.
    opcoes:
      correta: O juízo competente é o da Vara de Execuções Penais, na forma do enunciado 611 da Súmula não vinculante do STF OU do Art. 66, inciso I, da LEP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
  - id: 18-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Fernando foi pronunciado pela prática de um crime de homicídio doloso consumado que teve como vítima Henrique. Em sessão plenária do Tribunal do Júri, o réu e sua namorada, ouvida na condição de informante, afirmaram que Henrique iniciou agressões contra Fernando e que este agiu em legítima defesa. Por sua vez, a namorada da vítima e uma testemunha presencial asseguraram que não houve qualquer agressão pretérita por parte de Henrique.

      No momento do julgamento, os jurados reconheceram a autoria e materialidade, mas optaram por absolver Fernando da imputação delitiva. Inconformado, o Ministério Público apresentou recurso de apelação com fundamento no Art. 593, inciso III, alínea ‘d’, do CPP, alegando que a decisão foi manifestamente contrária à prova dos autos. A família de Fernando fica preocupada com o recurso, em especial porque afirma que todos tinham conhecimento que dois dos jurados que atuaram no julgamento eram irmãos, mas em momento algum isso foi questionado pelas partes, alegado no recurso ou avaliado pelo Juiz Presidente.

      Considerando a situação narrada, esclareça, na condição de advogado(a) de Fernando, os seguintes questionamentos da família do réu:
    comando: A decisão dos jurados foi manifestamente contrária à prova dos autos? Justifique.
    gabarito: A decisão dos jurados não foi manifestamente contrária à prova dos autos, tendo em vista que o acusado e sua namorada alegaram a existência de legítima defesa. De fato, a namorada da vítima e uma testemunha afirmaram que esta causa excludente da ilicitude não existiu. Contudo, existem duas versões nos autos, com provas em ambos os sentidos, logo os jurados são livres para optar por uma delas, de acordo com a íntima convicção. Não houve arbitrariedade ou total dissociação da prova dos autos, mas apenas escolha de uma das versões. Assim, a soberania dos vereditos deve prevalecer, não cabendo ao Tribunal fazer nova análise do mérito, se a decisão não foi manifestamente contrária às provas produzidas.
    opcoes:
      correta: Não. A decisão dos jurados não foi manifestamente contrária à prova dos autos, pois está baseada em uma das versões existentes nos autos OU porque as declarações do réu e de sua namorada escoram a decisão, devendo prevalecer a soberania dos vereditos OU a íntima convicção dos jurados.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 18-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      Fernando foi pronunciado pela prática de um crime de homicídio doloso consumado que teve como vítima Henrique. Em sessão plenária do Tribunal do Júri, o réu e sua namorada, ouvida na condição de informante, afirmaram que Henrique iniciou agressões contra Fernando e que este agiu em legítima defesa. Por sua vez, a namorada da vítima e uma testemunha presencial asseguraram que não houve qualquer agressão pretérita por parte de Henrique.

      No momento do julgamento, os jurados reconheceram a autoria e materialidade, mas optaram por absolver Fernando da imputação delitiva. Inconformado, o Ministério Público apresentou recurso de apelação com fundamento no Art. 593, inciso III, alínea ‘d’, do CPP, alegando que a decisão foi manifestamente contrária à prova dos autos. A família de Fernando fica preocupada com o recurso, em especial porque afirma que todos tinham conhecimento que dois dos jurados que atuaram no julgamento eram irmãos, mas em momento algum isso foi questionado pelas partes, alegado no recurso ou avaliado pelo Juiz Presidente.

      Considerando a situação narrada, esclareça, na condição de advogado(a) de Fernando, os seguintes questionamentos da família do réu:
    comando: Poderá o Tribunal, no recurso do Ministério Público, anular o julgamento com fundamento em nulidade na formação do Conselho de Sentença? Justifique.
    gabarito: Não poderá o Tribunal anular o julgamento com base na existência de nulidade ocorrida durante a sessão plenária. De fato, prevê o Art. 448, inciso IV, do CPP, que estão impedidos de servir no mesmo Conselho os irmãos. Ocorre que o enunciado 713 da Súmula não vinculante do STF afirma categoricamente que “o efeito devolutivo da apelação contra decisões do júri é adstrito aos fundamentos de sua interposição”. O Ministério Público apresentou apelação apenas com fundamento na alínea ‘d’ do Art. 593, inciso III, do Código de Processo Penal. Assim, está limitado o efeito devolutivo, de modo que o Tribunal somente poderá analisar a existência de decisão manifestamente contrária à prova dos autos. Decisão em contrário prejudicaria a ampla defesa, pois eventual nulidade não foi combatida pela defesa em sede de contrarrazões. Poderia, ainda, o candidato basear sua resposta no enunciado 160 da Súmula do STF, que afirma que é nula a decisão que acolhe, contra réu, nulidade não arguida pela acusação.
    opcoes:
      correta: Não, pois o Tribunal está limitado ao conteúdo da apelação apresentada pelo Ministério Público, OU Não, pois decisão em contrário prejudicaria a ampla defesa e/ou contraditório, tendo em vista que não foi rebatido em contrarrazões, na forma do enunciado 713 da Súmula não vinculante do STF OU do enunciado 160 da Súmula do STF.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
