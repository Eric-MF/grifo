    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Afastar o concurso de crimes, com o reconhecimento de um crime único de estupro (1,0), tendo em vista que o Art. 213 do CP traz um tipo misto alternativo OU tendo em vista que os atos foram praticados em um mesmo contexto e contra a mesma vítima.
    opcoes:
      correta: Afastar o concurso de crimes, com o reconhecimento de um crime único de estupro (1,0), tendo em vista que o Art. 213 do CP traz um tipo misto alternativo OU tendo em vista que os atos foram praticados em um mesmo contexto e contra a mesma vítima.
      erradas:
        - Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
        - Pois a embriaguez era completa e proveniente de caso fortuito ou de força maior, na forma do Art. 28, §1º, do CP.
        - "Qualificação do querelante e da querelada: Indicação da qualificação do querelante e da querelada"
        - Reconhecimento da causa de diminuição do arrependimento posterior, tendo em vista que houve restituição da coisa subtraída, nos termos do Art. 16 do Código Penal.
        - O não comparecimento do réu configura violação ao princípio da ampla defesa, nos termos do Art. 5º, inciso LV, da CRFB
