    categoria: discursiva
    parte: q3
    item: "C"
    pergunta: "O Tribunal de Justiça, ao julgar a apelação, poderia aplicar a mutatio libelli?"
    tese: "Vedação da mutatio libelli em segundo grau, que causaria supressão de instância"
    aceitos: [ "supressao de instancia" ]
    artigos: [ "Súmula 453 STF" ]
