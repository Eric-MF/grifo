# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "08"
introducoes:
  peca: "José devia a Caio R$ 20 mil, por uma nota promissória vencida, e não pagou. Depois de cobranças educadas por telefone, presenciadas por Joaquim e Manoel, Caio foi ao restaurante de José em 24/5/2010, mostrou uma pistola e disse que a dívida tinha de ser paga na hora, senão José pagaria com a vida. Caio foi denunciado por extorsão qualificada pelo emprego de arma, a denúncia foi recebida pela 5ª Vara Criminal e ele foi citado em 18/1/2011. Você é o advogado de Caio."
  q2: "Sem combinarem nada entre si, Abel e Felipe vestiram uniformes de manobrista de um restaurante. Tércio, enganado, entregou a Abel a chave do carro, e Abel fugiu com o veículo. Narcísio não entregou a chave, mas Felipe a pegou sem que ele percebesse e também fugiu com o carro."
  q3: "João e José foram denunciados por concussão. Terminada a instrução, viu-se que os fatos eram de corrupção passiva, e o juiz mandou os autos ao Ministério Público para aditar a denúncia com a nova capitulação."
  q4: "João, reincidente, foi condenado por falsidade ideológica a 1 ano, 11 meses e 10 dias de reclusão. A denúncia foi recebida em 30/10/2000 e a sentença foi publicada em 29/7/2005; só a defesa apelou. O Tribunal negou a extinção da punibilidade por causa da reincidência."
