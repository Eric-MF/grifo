  - id: 32-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Gabriel, estudante de farmácia, 22 anos, descobre que seu tio Jorge possuía grave doença no fígado, que lhe causava dores físicas. Durante seus estudos sobre medicina alternativa em livro oficial fornecido pela faculdade pública em que estudava, vem a ler que a droga conhecida como heroína poderia, em doenças semelhantes à de seu tio, funcionar como analgésico e aliviar a dor do paciente.

      Tendo acesso ao material que sabia ser heroína e sua classificação como droga, Gabriel, em 27 de maio de 2019, transporta e entrega o material para o tio, acreditando que, apesar de existir a figura típica do tráfico de drogas, sua conduta seria lícita diante dos fins medicinais. Avisou que o material deveria ser usado naquele dia, de forma imediata.

      No dia 29 de maio de 2019, após denúncia, policiais militares, com autorização para ingresso na residência de Jorge, apreendem o material ilícito e descobrem que Jorge o recebera de Gabriel, mas não o utilizou. Em seguida, comparecem à faculdade de Gabriel e realizam sua prisão em flagrante.

      Jorge e Gabriel foram indiciados, após juntada do laudo confirmando a natureza do material, pelo crime de tráfico de drogas (Art. 33 da Lei nº 11.343/06), mas, em razão da doença, Jorge vem a falecer naquela mesma data. Ao tomar conhecimento dos fatos, de imediato a família de Gabriel procura você, como advogado, para esclarecimentos.

      Considerando apenas as informações expostas, responda, na condição de advogado(a) de Gabriel, aos itens a seguir.
    comando: Qual o argumento de direito processual a ser apresentado para questionar a prisão em flagrante de Gabriel? Justifique.
    gabarito: A defesa técnica de Gabriel deveria argumentar que sua prisão em flagrante foi ilegal, o que ensejaria o relaxamento da mesma. Isso porque nenhuma das situações do Art. 302 do CPP restou configurada. Em que pese houvesse drogas sendo guardadas na residência de Jorge no momento da prisão em flagrante, não havia atuação deste em comunhão de ações e desígnios com Gabriel. Gabriel, em tese, teria praticado crime de tráfico ao transportar material entorpecente e entregá-lo para Jorge em 27 de maio de 2019. Ocorre que a apreensão do material só ocorreu em 29 de maio de 2019, logo não estava Gabriel cometendo o crime, não tinha acabado de cometê-lo, não foi perseguido logo após a infração e nem encontrado com instrumentos do delito que fizessem presumir a autoria. Diante da ausência das situações previstas no Art. 302 do CPP, impossível a prisão em flagrante de Gabriel.
    opcoes:
      correta: A prisão em flagrante foi ilegal, já que não estava configurada em qualquer das situações previstas no Art. 302 do CPP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não, pois o emprego de arma é uma circunstância objetiva elementar do delito, razão pela qual há comunicabilidade, nos termos do Art. 30, do CP.
        - "Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior. OBS.1: A justificativa correta é essencial para atribuição de pontos, pois não há intervalo de pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
    revisao: *a1
  - id: 32-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Gabriel, estudante de farmácia, 22 anos, descobre que seu tio Jorge possuía grave doença no fígado, que lhe causava dores físicas. Durante seus estudos sobre medicina alternativa em livro oficial fornecido pela faculdade pública em que estudava, vem a ler que a droga conhecida como heroína poderia, em doenças semelhantes à de seu tio, funcionar como analgésico e aliviar a dor do paciente.

      Tendo acesso ao material que sabia ser heroína e sua classificação como droga, Gabriel, em 27 de maio de 2019, transporta e entrega o material para o tio, acreditando que, apesar de existir a figura típica do tráfico de drogas, sua conduta seria lícita diante dos fins medicinais. Avisou que o material deveria ser usado naquele dia, de forma imediata.

      No dia 29 de maio de 2019, após denúncia, policiais militares, com autorização para ingresso na residência de Jorge, apreendem o material ilícito e descobrem que Jorge o recebera de Gabriel, mas não o utilizou. Em seguida, comparecem à faculdade de Gabriel e realizam sua prisão em flagrante.

      Jorge e Gabriel foram indiciados, após juntada do laudo confirmando a natureza do material, pelo crime de tráfico de drogas (Art. 33 da Lei nº 11.343/06), mas, em razão da doença, Jorge vem a falecer naquela mesma data. Ao tomar conhecimento dos fatos, de imediato a família de Gabriel procura você, como advogado, para esclarecimentos.

      Considerando apenas as informações expostas, responda, na condição de advogado(a) de Gabriel, aos itens a seguir.
    comando: Existe argumento de direito material a ser apresentado em busca da absolvição de Gabriel pelo crime pelo qual foi indiciado? Justifique.
    gabarito: |-
      Sim, o argumento de direito material a ser apresentado pela defesa técnica de Gabriel é o de que houve erro de proibição, afastando o potencial conhecimento da ilicitude indispensável para o reconhecimento da culpabilidade como elemento do crime. Para a doutrina majoritária, crime seria um fato típico, ilícito e culpável.

      Sem dúvida, a conduta de Gabriel de transportar drogas seria típica e ilícita. Ocorre que o agente agiu por acreditar que, naquela situação, sua conduta seria lícita, já que estaria transportando droga para fins medicinais, conforme aprendeu em livro oficial obtido em faculdade pública. Diante disso, fica afastado o elemento da culpabilidade do potencial conhecimento da ilicitude. Cabe esclarecer que não estamos diante de hipótese de erro de tipo, já que ele tinha conhecimento sobre todas as elementares do crime e não houve falsa percepção da situação fática. Gabriel sabia estar transportando drogas. Também não há que se falar em desconhecimento da lei, que é inescusável. Gabriel sabia que o tráfico configura crime, apenas atuando em erro sobre a ilicitude do fato, nos termos da parte final do Art. 21 do CP. O advogado deveria defender que o erro foi inevitável, logo buscando a isenção de pena, ou, ao menos, que houve erro evitável, o que poderia funcionar como causa de diminuição de pena
    opcoes:
      correta: Sim, o argumento seria de que ocorreu erro de proibição OU erro sobre ilicitude, nos termos do Art. 21 do CP, que poderia funcionar como causa de isenção de pena OU que afasta a culpabilidade do agente OU que afasta o potencial conhecimento da ilicitude
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não, pois o emprego de arma é uma circunstância objetiva elementar do delito, razão pela qual há comunicabilidade, nos termos do Art. 30, do CP.
        - "Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior. OBS.1: A justificativa correta é essencial para atribuição de pontos, pois não há intervalo de pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
