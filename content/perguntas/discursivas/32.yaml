    comando: Que pedido deve ser formulado na peça?
    gabarito: Fixação do regime aberto OU concessão de suspensão condicional da pena
    opcoes:
      correta: Fixação do regime aberto OU concessão de suspensão condicional da pena
      erradas:
        - Reconhecimento da preliminar e extinção da punibilidade; impronúncia, nos termos do art. 414 do CPP (admite-se absolvição sumária, art. 415).
        - Subsidiariamente, o acolhimento das teses defensivas de aplicação da pena.
        - Pedido de retratação ou efeito regressivo, com fundamento no Art. 589 do CPP.
        - Absolvição sumária, com fundamento no Art. 397, inciso I, do CPP e no Art. 397, inciso III, do CPP.
