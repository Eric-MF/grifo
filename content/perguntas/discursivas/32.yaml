  - id: 32-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      O apenado Fabrício cumpria pena pela prática do delito de extorsão simples, tendo requerido, por meio de advogado, a extinção da punibilidade por satisfazer os requisitos, objetivos e subjetivos, previstos no Decreto Presidencial de Indulto, publicado no ano de 2018 (requisito objetivo temporal e requisito subjetivo de não possuir falta grave nos últimos 12 meses anteriores ao decreto).

      Enquanto aguardava o deferimento do benefício requerido, no dia 02 de março de 2019, ocorreu uma rebelião na galeria em que se encontrava. O diretor do presídio, em procedimento disciplinar próprio, no qual foi garantida a ampla defesa e o contraditório, não conseguindo identificar aqueles que efetivamente participararam da rebelião, reconheceu que todos os apenados daquela galeria praticaram falta grave.

      Ao tomar conhecimento dessa punição disciplinar, o juiz da execução indeferiu o pedido de indulto por ausência do requisito subjetivo. Ultrapassado o prazo recursal por desídia da defesa, novo advogado contratado pela família impetrou habeas corpus junto ao Tribunal de Justiça, na busca da extinção da punibilidade. A ordem foi denegada pelo Tribunal.

      Considerando a situação fática apresentada, na condição de novo advogado contratado, ao ser intimado da decisão que denegou a ordem, responda aos itens a seguir.
    comando: Qual o recurso a ser apresentado pela defesa para combater a decisão do Tribunal de Justiça que denegou a ordem no habeas corpus impetrado em favor do apenado Fabrício? Justifique.
    gabarito: De acordo com o Art. 105, inciso II, alínea a, da CRFB, caberá ao Superior Tribunal de Justiça, em sede de recurso ordinário constitucional, julgar os habeas corpus decididos em única ou última instância pelos Tribunais estaduais quando denegatória a decisão. Assim, considerando que o Tribunal denegou a ordem de habeas corpus pleiteada pela defesa, o único recurso cabível seria o Recurso Ordinário Constitucional. Poderia, também, a defesa apresentar novo habeas corpus ao STJ, mas o questionamento formulado era sobre o recurso cabível.
    opcoes:
      correta: Considerando a decisão do Tribunal de denegar a ordem de habeas corpus, o recurso cabível é o recurso ordinário constitucional, nos termos do Art. 105, inciso II, alínea a, da CRFB OU Art. 30 da Lei 8038/90
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não, pois o emprego de arma é uma circunstância objetiva elementar do delito, razão pela qual há comunicabilidade, nos termos do Art. 30, do CP.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento é que houve concurso formal de crimes, tendo em vista que, com uma só ação, foram praticados dois delitos, nos termos do Art. 70 do CP.
        - O argumento é de que a prova é ilícita, tendo em vista que não poderia ter havido transcrição da conversa travada entre Flávio e seu advogado, que tem direito ao sigilo ou inviolabilidade das comunicações, não sendo o advogado coautor de crimes e nem figurando como investigado, nos termos do Art. 7º, inciso II ou III, da Lei nº 8.906/94 ou Art. 157 caput do CPP ou Art. 5º, inciso LVI da CRFB/88.
    revisao: *a1
  - id: 32-q3-b
    categoria: discursiva
    parte: q3
    item: B.1
    caso: |-
      O apenado Fabrício cumpria pena pela prática do delito de extorsão simples, tendo requerido, por meio de advogado, a extinção da punibilidade por satisfazer os requisitos, objetivos e subjetivos, previstos no Decreto Presidencial de Indulto, publicado no ano de 2018 (requisito objetivo temporal e requisito subjetivo de não possuir falta grave nos últimos 12 meses anteriores ao decreto).

      Enquanto aguardava o deferimento do benefício requerido, no dia 02 de março de 2019, ocorreu uma rebelião na galeria em que se encontrava. O diretor do presídio, em procedimento disciplinar próprio, no qual foi garantida a ampla defesa e o contraditório, não conseguindo identificar aqueles que efetivamente participararam da rebelião, reconheceu que todos os apenados daquela galeria praticaram falta grave.

      Ao tomar conhecimento dessa punição disciplinar, o juiz da execução indeferiu o pedido de indulto por ausência do requisito subjetivo. Ultrapassado o prazo recursal por desídia da defesa, novo advogado contratado pela família impetrou habeas corpus junto ao Tribunal de Justiça, na busca da extinção da punibilidade. A ordem foi denegada pelo Tribunal.

      Considerando a situação fática apresentada, na condição de novo advogado contratado, ao ser intimado da decisão que denegou a ordem, responda aos itens a seguir.
    comando: Na busca da concessão do indulto e, consequentemente, da extinção da punibilidade, quais argumentos jurídicos poderão ser apresentados? Justifique.
    gabarito: |-
      Existem dois principais argumentos em busca da extinção da punibilidade com o reconhecimento do indulto:

      proibição de sanções disciplinares coletivas e aplicação do princípio da legalidade, o que impediria o magistrado de considerar faltas graves praticadas após a publicação do decreto de indulto, ainda que tivessem sido validamente reconhecidas. A sentença que tem por objeto o indulto tem natureza meramente declaratória, na medida em que o direito já fora constituído pelo decreto presidencial concessivo do benefício, devendo ser examinado se o apenado satisfazia os requisitos legais na data de sua edição, não podendo interferir no exame respectivo fato posterior. Fato é que Fabrício não praticou falta grave nos 12 meses anteriores ao decreto, logo, em respeito ao princípio da legalidade, não poderia o magistrado vedar a concessão do benefício com esse fundamento. Ademais, ainda que pudesse ser considerado no exame do requisito subjetivo fato posterior à edição do decreto presidencial, a LEP veda expressamente a punição coletiva (Art. 45, § 3º, da Lei nº 7.210), sendo o que ocorreu na hipótese vertente, porquanto o diretor do presídio puniu todos os apenados da galeria ao não identificar aqueles que efetivamente participaram da rebelião.
    opcoes:
      correta: A defesa deveria alegar a proibição de aplicação de sanções coletivas, nos termos do Art. 45, §3º, da LEP Não pode ser considerado fato posterior como falta grave a afastar o preenchimento do requisito subjetivo OU o decreto mencionava que o apenado não poderia ter praticado falta grave nos 12 meses anteriores ao decreto, em respeito ao princípio da legalidade OU porque a decisão que reconhece o indulto é meramente declaratória
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não, pois o emprego de arma é uma circunstância objetiva elementar do delito, razão pela qual há comunicabilidade, nos termos do Art. 30, do CP.
        - "Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior. OBS.1: A justificativa correta é essencial para atribuição de pontos, pois não há intervalo de pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
    revisao: *a1
  - id: 32-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Maria, no dia 07 de julho de 2020, compareceu à Delegacia e narrou que foi vítima, dois dias antes, de um crime de lesão corporal praticada por seu marido, Francisco, e motivada pela insatisfação com a qualidade da refeição que teria sido feita pela vítima.

      Maria foi encaminhada para perícia, que constatou, por meio de laudo, a existência de lesão corporal de natureza leve. Ouvido, Francisco confessou a prática delitiva, dizendo que este seria um evento isolado em sua vida. Diante disso, Francisco foi indiciado pelo crime do Art. 129, § 9º, do CP, na forma da Lei nº 11.340/06.

      Considerando a pena prevista para o delito e a inexistência de envolvimento pretérito com aparato judicial ou policial pelo autor do fato, o Ministério Público apresentou proposta de acordo de não persecução penal a Francisco. Ao tomar conhecimento dos fatos, Maria procura você, como advogado, para esclarecimentos.

      Considerando apenas as informações expostas, responda na qualidade de advogado de Maria, aos itens a seguir.
    comando: Existem argumentos para questionar a proposta de acordo de não persecução penal formulada pelo Ministério Público? Justifique.
    gabarito: Sim, existem argumentos para questionar a proposta de acordo de não persecução penal (ANPP) formulada pelo Ministério Público. De fato, considerando unicamente a pena de detenção de 3 meses a 3 anos prevista para o delito em tese praticado e a confissão, seria possível a proposta do acordo de não persecução penal (ANPP), pois a pena mínima cominada é inferior a 4 anos. Contudo, o Art. 28-A do CPP estabelece que o crime não poderá ter sido praticado com violência ou grave ameaça à pessoa. Ademais, em seu parágrafo 2º, inciso IV, o dispositivo veda a aplicação do instituto quando o crime for praticado no contexto da violência doméstica e familiar contra a mulher, como na situação apresentada. A vítima era do sexo feminino, as partes tinham relação de matrimônio e a motivação do delito foi relacionada à condição de mulher.
    opcoes:
      correta: Sim, tendo em vista que o crime em tese praticado envolveu violência à pessoa OU porque foi praticado no contexto da violência doméstica e familiar contra a mulher, impossibilitando a proposta de ANPP, nos termos do Art. 28-A, caput, do CPP OU do Art. 28-A, § 2º, inciso IV, do CPP
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não, pois o emprego de arma é uma circunstância objetiva elementar do delito, razão pela qual há comunicabilidade, nos termos do Art. 30, do CP.
        - "Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior. OBS.1: A justificativa correta é essencial para atribuição de pontos, pois não há intervalo de pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
    revisao: *a1
