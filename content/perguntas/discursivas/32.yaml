# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "32"
introducoes:
  peca: "Na virada de 2019 para 2020, um fogo de artifício incendiou a casa de Luiz, nascido em 24/4/1948, onde ele morava com os filhos e o irmão Igor. Todos correram para a única porta, e Luiz, que tem dificuldade de locomoção e era o último da fila, deu um soco na cabeça de Igor para sair antes que o fogo o alcançasse. Depois, levou Igor ao hospital e pagou o tratamento. Igor teve lesão leve e disse na delegacia e em juízo que não queria ver o irmão processado. Luiz foi denunciado por lesão corporal no âmbito doméstico, e o Ministério Público negou benefícios despenalizadores, invocando a Lei Maria da Penha. Na folha de antecedentes, havia só uma condenação definitiva por contravenção penal, de dezembro de 2019. O Ministério Público pediu a condenação com a agravante da reincidência, e você foi intimado para a manifestação cabível."
  q1: "Gabriel, estudante de farmácia, leu num livro da faculdade que a heroína aliviaria a dor de doenças como a do tio Jorge. Sabendo que era droga, levou heroína ao tio, convicto de que, pelo fim medicinal, a conduta seria lícita. Dois dias depois, policiais acharam a droga na casa de Jorge, que não a usou, foram à faculdade e prenderam Gabriel em flagrante por tráfico."
  q2: "Luiz entrou na casa de Henrique e, com grave ameaça, quis levar a televisão, mas foi preso ainda dentro da casa. José, que lhe passara o horário em que a vítima estaria só e a fechadura com defeito, também foi denunciado. Os dois foram condenados por roubo majorado consumado. A pena-base de Luiz ficou acima do mínimo por má conduta social, por causa de cinco processos por roubo ainda sem trânsito em julgado. Só José apelou, pedindo que o roubo fosse considerado não consumado e que se reconhecesse a participação de menor importância."
  q3: "Fabrício pediu o indulto de 2018, cumpridos os requisitos. Antes da decisão, houve rebelião na galeria dele, e o diretor, sem conseguir identificar quem participou, reconheceu falta grave para todos os presos da galeria, em procedimento com defesa. O juiz negou o indulto por isso. Perdido o prazo do recurso, a defesa impetrou habeas corpus no Tribunal de Justiça, que denegou a ordem."
  q4: "Maria contou na delegacia que o marido, Francisco, a agrediu porque não gostou da comida, e a perícia constatou lesão leve. Francisco, sem antecedentes, confessou e foi indiciado por lesão corporal em violência doméstica, na forma da Lei Maria da Penha. O Ministério Público propôs a ele um acordo de não persecução penal."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["32-peca-1", "32-peca-4", "32-peca-5-1", "32-peca-10", "32-peca-12", "32-peca-14", "32-peca-15"]
perguntas:
  - id: 32-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: preliminar
    pergunta: "Igor nunca quis processar o irmão. Que preliminar a defesa deve levantar?"
    tese: "Extinção da punibilidade pela decadência, porque a vítima não representou"
    aceitos: [ "decaden* | extin* da punibilidade" ]
    artigos: [ "art. 107, IV, CP", "art. 38, CPP" ]
    gabarito: "Preliminarmente, extinção da punibilidade do agente OU nulidade em razão da ausência de representação, com reconhecimento da decadência, conforme o Art. 107, inciso IV, do CP OU 564, inciso III, alínea a, ou inciso IV, CPP"
    revisao: { status: revisado }
  - id: 32-peca-3-1
    categoria: peca-detalhe
    parte: peca
    item: "3.1"
    secao: preliminar
    pergunta: "Por que a vontade de Igor era indispensável para processar Luiz?"
    tese: "A lesão corporal leve contra homem, mesmo no âmbito doméstico, é crime de ação pública condicionada à representação"
    aceitos: [ "representacao | condicionada" ]
    artigos: [ "art. 88, Lei 9.099" ]
    gabarito: "O crime de lesão corporal leve do Art. 129, § 9º, do CP é de ação penal pública condicionada à representação, nos termos do Art. 88 da Lei nº 9.099/95, e a vítima demonstrou não ter interesse em ver o autor do fato responsabilizado criminalmente"
    revisao: { status: revisado }
  - id: 32-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "No mérito, que tese justifica o soco de Luiz em Igor?"
    tese: "Estado de necessidade, que exclui a ilicitude: o fogo era um perigo atual que Luiz não provocou"
    aceitos: [ "estado de necessidade" ]
    artigos: [ "art. 24, CP", "art. 23, I, CP" ]
    gabarito: "No mérito, reconhecimento do estado de necessidade, que é causa excludente da ilicitude, na forma do Art. 24 ou do Art. 23, inciso I, ambos do CP"
    revisao: { status: revisado }
  - id: 32-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Na primeira fase da dosimetria, o que a defesa deve pedir?"
    tese: "Pena-base no mínimo legal, porque as circunstâncias judiciais são favoráveis"
    aceitos: [ "minimo" ]
    artigos: [ "art. 59, CP" ]
    gabarito: "Aplicação da pena base no mínimo legal, já que circunstâncias do art. 59 do CP são favoráveis"
    revisao: { status: revisado }
  - id: 32-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Por que não cabe a agravante pedida pelo Ministério Público?"
    tese: "Afastamento da reincidência: a condenação anterior por contravenção não gera reincidência em crime"
    aceitos: [ [ "reincid*", "afast* | nao incid* | exclu* | nao gera" ], [ "nao e reincidente | nao ha reincidencia" ] ]
    artigos: [ "art. 63, CP", "art. 61, I, CP" ]
    gabarito: "Afastamento da agravante da reincidência OU afastamento da agravante do art. 61, I, do CP, tendo em vista que a condenação anterior se refere à contravenção ou tendo em vista que não ostenta condenação anterior definitiva pela prática de crime"
    revisao: { status: revisado }
  - id: 32-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Que atenuante cabe pela idade de Luiz?"
    tese: "Atenuante de ser o réu maior de 70 anos na data da sentença"
    aceitos: [ "70 anos | maior de 70 | mais de 70 | setenta anos | septuagenario | idoso" ]
    artigos: [ "art. 65, I, CP" ]
    gabarito: "Reconhecimento da atenuante prevista no Art. 65, inciso I, do CP, tendo em vista que o réu era maior de 70 anos na data da sentença"
    revisao: { status: revisado }
  - id: 32-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Luiz levou Igor ao hospital e pagou o tratamento. Que atenuante isso configura?"
    tese: "Atenuante de ter procurado minorar as consequências do crime, logo depois dele"
    aceitos: [ "consequencias | repar*" ]
    artigos: [ "art. 65, III, b, CP" ]
    gabarito: "Reconhecimento da atenuante prevista no Art. 65, inciso III, alínea b, do CP, pois Luiz procurou reduzir as consequências de seus atos levando Igor para o hospital e pagando por seu tratamento"
    revisao: { status: revisado }
  - id: 32-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: pedido
    pergunta: "Em caso de condenação, que benefício a defesa deve pedir para Luiz não cumprir a pena?"
    tese: "Suspensão condicional da pena (sursis)"
    aceitos: [ "suspensao condicional da pena | sursis" ]
    artigos: [ "art. 77, CP", "art. 77, § 2º, CP" ]
    gabarito: "Requerimento de suspensão condicional da pena, nos termos do Art. 77 do CP"
    revisao: { status: revisado }
  - id: 32-peca-13
    categoria: peca-detalhe
    parte: peca
    item: "13"
    secao: pedido
    pergunta: "Qual é o pedido principal da defesa?"
    tese: "Absolvição pela excludente de ilicitude do estado de necessidade"
    aceitos: [ "absolvi* | absolver" ]
    artigos: [ "art. 386, VI, CPP" ]
    gabarito: "Absolvição, na forma do Art. 386, VI, do CPP"
    revisao: { status: revisado }
  - id: 32-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento processual contesta a prisão de Gabriel?"
    tese: "Ilegalidade da prisão em flagrante: dois dias depois da entrega, Gabriel não estava em nenhuma situação de flagrante"
    aceitos: [ "relaxamento | ilegal* | nao havia flagrante | nao estava em flagrante | sem flagrante | nao ha flagrante | nao era flagrante" ]
    artigos: [ "art. 302, CPP", "art. 5, LXV, CRFB" ]
    gabarito: "A defesa técnica de Gabriel deveria argumentar que sua prisão em flagrante foi ilegal, o que ensejaria o relaxamento da mesma. Isso porque nenhuma das situações do Art. 302 do CPP restou configurada. Em que pese houvesse drogas sendo guardadas na residência de Jorge no momento da prisão em flagrante, não havia atuação deste em comunhão de ações e desígnios com Gabriel. Gabriel, em tese, teria praticado crime de tráfico ao transportar material entorpecente e entregá-lo para Jorge em 27 de maio de 2019. Ocorre que a apreensão do material só ocorreu em 29 de maio de 2019, logo não estava Gabriel cometendo o crime, não tinha acabado de cometê-lo, não foi perseguido logo após a infração e nem encontrado com instrumentos do delito que fizessem presumir a autoria. Diante da ausência das situações previstas no Art. 302 do CPP, impossível a prisão em flagrante de Gabriel."
    revisao: { status: revisado }
  - id: 32-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que argumento de direito material leva à absolvição de Gabriel?"
    tese: "Erro de proibição inevitável: Gabriel achava lícita a conduta, e isso o isenta de pena"
    aceitos: [ "erro de proibicao | erro sobre a ilicitude" ]
    artigos: [ "art. 21, CP" ]
    gabarito: "Sim, o argumento de direito material a ser apresentado pela defesa técnica de Gabriel é o de que houve erro de proibição, afastando o potencial conhecimento da ilicitude indispensável para o reconhecimento da culpabilidade como elemento do crime. Para a doutrina majoritária, crime seria um fato típico, ilícito e culpável.\n\nSem dúvida, a conduta de Gabriel de transportar drogas seria típica e ilícita. Ocorre que o agente agiu por acreditar que, naquela situação, sua conduta seria lícita, já que estaria transportando droga para fins medicinais, conforme aprendeu em livro oficial obtido em faculdade pública. Diante disso, fica afastado o elemento da culpabilidade do potencial conhecimento da ilicitude. Cabe esclarecer que não estamos diante de hipótese de erro de tipo, já que ele tinha conhecimento sobre todas as elementares do crime e não houve falsa percepção da situação fática. Gabriel sabia estar transportando drogas. Também não há que se falar em desconhecimento da lei, que é inescusável. Gabriel sabia que o tráfico configura crime, apenas atuando em erro sobre a ilicitude do fato, nos termos da parte final do Art. 21 do CP. O advogado deveria defender que o erro foi inevitável, logo buscando a isenção de pena, ou, ao menos, que houve erro evitável, o que poderia funcionar como causa de diminuição de pena"
    revisao: { status: revisado }
  - id: 32-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Sem apelar, Luiz pode se beneficiar do recurso de José?"
    tese: "Extensão do recurso ao corréu: a tentativa, de caráter objetivo, beneficia Luiz; a participação de menor importância, pessoal, não"
    aceitos: [ "efeito extensivo | extensao | se estende | estende | objetiv* | nao exclusivamente pessoal" ]
    artigos: [ "art. 580, CPP" ]
    gabarito: "Luiz não poderá ser beneficiado por eventual reconhecimento de causa de diminuição de pena de participação de menor importância, enquanto poderá ser beneficiado em caso de reconhecimento da modalidade tentada do delito, ainda que não tenha apresentado recurso de apelação questionando tal tema. De acordo com o Art. 580 do CPP, no caso de concurso de agentes, a decisão do recurso interposto por um dos réus, se fundado em motivos que não sejam de caráter exclusivamente pessoal, aproveitará aos outros. A causa de diminuição de pena da tentativa é dado objetivo, não sendo de caráter pessoal, já que o crime restou ou não consumado em relação a todos os agentes. Assim, reconhecida a modalidade tentada, possível a extensão dos efeitos ao corréu que não recorreu. Por outro lado, a participação de menor importância, trazida pelo Art. 29, § 1º, do CP, é dado exclusivamente pessoal. Luiz adotou conduta relevante na execução do crime, sendo o executor direto da grave ameaça e da subtração da televisão. A situação de José seria diferente, já que sua participação poderia vir a ser considerada de menor relevância. Luiz sequer é partícipe, mas sim autor. Dessa forma, mesmo que reconhecida a causa de diminuição de pena do Art. 29, § 1º, do CP, para José, não haverá extensão para Luiz."
    revisao: { status: revisado }
  - id: 32-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que argumento de direito material reduz a pena-base de Luiz?"
    tese: "Processos sem trânsito em julgado não podem agravar a pena-base, nem como má conduta social (presunção de inocência)"
    aceitos: [ "presuncao de inocencia | nao culpabilidade | nao podem agravar | nao pode agravar | nao servem | nao podem ser usad*" ]
    artigos: [ "Súmula 444 STJ", "art. 5, LVII, CRFB", "art. 59, CP" ]
    gabarito: "Sim, existe argumento a ser apresentado em busca da redução da pena base aplicada, tendo em vista que ações em curso não podem ser valorizadas de maneira negativa no momento da aplicação da pena base. Durante muito tempo se controverteu sobre a possibilidade de as ações em curso, com ou sem condenações sem trânsito em julgado, poderem ser reconhecidas como maus antecedentes. Prevaleceu o entendimento pela impossibilidade, sob pena de violação ao princípio da presunção de inocência. Contudo, diversos magistrados valorizavam essas ações em curso como condição social negativa ou personalidade voltada para prática de crimes, aumentando a pena base. Ocorre que o Superior Tribunal de Justiça, por meio da Súmula 444, afastou a possibilidade de tal conduta por parte dos magistrados, já que decidiu que as ações em curso e inquéritos policiais não poderão ser considerados no momento da aplicação da pena base como um todo e não apenas como maus antecedentes, sob pena de violação transversa/indireta ao princípio da não culpabilidade.\n\nObs.: não será suficiente a mera afirmativa de que ações em curso não podem funcionar como maus antecedentes, já que esse não foi o argumento utilizado pelo magistrado para aumento da pena base."
    revisao: { status: revisado }
  - id: 32-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que recurso cabe contra o acórdão que denegou o habeas corpus?"
    tese: "Recurso ordinário constitucional ao Superior Tribunal de Justiça"
    aceitos: [ "recurso ordinario constitucional | recurso ordinario" ]
    artigos: [ "art. 105, II, a, CRFB", "art. 30, Lei 8.038" ]
    gabarito: "De acordo com o Art. 105, inciso II, alínea a, da CRFB, caberá ao Superior Tribunal de Justiça, em sede de recurso ordinário constitucional, julgar os habeas corpus decididos em única ou última instância pelos Tribunais estaduais quando denegatória a decisão. Assim, considerando que o Tribunal denegou a ordem de habeas corpus pleiteada pela defesa, o único recurso cabível seria o Recurso Ordinário Constitucional. Poderia, também, a defesa apresentar novo habeas corpus ao STJ, mas o questionamento formulado era sobre o recurso cabível."
    revisao: { status: revisado }
  - id: 32-q3-b
    categoria: discursiva
    parte: q3
    item: "B.1"
    pergunta: "Que argumento leva à concessão do indulto?"
    tese: "Vedação das sanções coletivas: a falta grave não pode ser atribuída a todos da galeria sem individualizar a conduta"
    aceitos: [ "sancoes coletivas | sancao coletiva | punicao coletiva | coletiva | individualiza*" ]
    artigos: [ "art. 45, § 3º, LEP" ]
    gabarito: "Existem dois principais argumentos em busca da extinção da punibilidade com o reconhecimento do indulto:\n\nproibição de sanções disciplinares coletivas e aplicação do princípio da legalidade, o que impediria o magistrado de considerar faltas graves praticadas após a publicação do decreto de indulto, ainda que tivessem sido validamente reconhecidas. A sentença que tem por objeto o indulto tem natureza meramente declaratória, na medida em que o direito já fora constituído pelo decreto presidencial concessivo do benefício, devendo ser examinado se o apenado satisfazia os requisitos legais na data de sua edição, não podendo interferir no exame respectivo fato posterior. Fato é que Fabrício não praticou falta grave nos 12 meses anteriores ao decreto, logo, em respeito ao princípio da legalidade, não poderia o magistrado vedar a concessão do benefício com esse fundamento. Ademais, ainda que pudesse ser considerado no exame do requisito subjetivo fato posterior à edição do decreto presidencial, a LEP veda expressamente a punição coletiva (Art. 45, § 3º, da Lei nº 7.210), sendo o que ocorreu na hipótese vertente, porquanto o diretor do presídio puniu todos os apenados da galeria ao não identificar aqueles que efetivamente participaram da rebelião."
    revisao: { status: revisado }
  - id: 32-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que argumento contesta a proposta de acordo de não persecução penal?"
    tese: "Vedação do acordo de não persecução penal: o crime teve violência à pessoa e foi cometido em violência doméstica contra a mulher"
    aceitos: [ "vedad* | vedacao | nao cabe | incabivel | descabimento | nao e cabivel" ]
    artigos: [ "art. 28-A, § 2º, IV, CPP", "art. 28-A, CPP" ]
    gabarito: "Sim, existem argumentos para questionar a proposta de acordo de não persecução penal (ANPP) formulada pelo Ministério Público. De fato, considerando unicamente a pena de detenção de 3 meses a 3 anos prevista para o delito em tese praticado e a confissão, seria possível a proposta do acordo de não persecução penal (ANPP), pois a pena mínima cominada é inferior a 4 anos. Contudo, o Art. 28-A do CPP estabelece que o crime não poderá ter sido praticado com violência ou grave ameaça à pessoa. Ademais, em seu parágrafo 2º, inciso IV, o dispositivo veda a aplicação do instituto quando o crime for praticado no contexto da violência doméstica e familiar contra a mulher, como na situação apresentada. A vítima era do sexo feminino, as partes tinham relação de matrimônio e a motivação do delito foi relacionada à condição de mulher."
    revisao: { status: revisado }
  - id: 32-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Como Maria pode atuar no processo, produzindo provas e recorrendo?"
    tese: "Habilitação da vítima como assistente de acusação"
    aceitos: [ "assistente" ]
    artigos: [ "art. 268, CPP", "art. 271, CPP" ]
    gabarito: "Sim, a vítima poderia, por meio de seu advogado, se habilitar como assistente de acusação, na forma do Art. 268 do CPP. De acordo com o dispositivo, em todos os termos da ação pública, poderá intervir, como assistente do Ministério Público, o ofendido. No caso, temos uma vítima determinada, Maria. Ademais, a ação penal é pública incondicionada, já que não se aplicam as previsões da Lei nº 9.099/95, nos termos do Art. 41 da Lei nº 11.340/06. Uma vez habilitada como assistente de acusação, Maria poderá interferir de diversas maneiras no processo, inclusive para propor meios de prova, realizar perguntas para testemunhas, apresentar manifestações de mérito e recursos, tudo na forma do Art. 271 do CPP."
    revisao: { status: revisado }
