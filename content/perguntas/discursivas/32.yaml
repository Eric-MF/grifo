  - id: 32-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Luiz, no dia 05 de fevereiro de 2019, ingressou na residência de Henrique e, mediante grave ameaça contra a vítima, buscou subtrair a televisão do imóvel. Após o emprego da grave ameaça à pessoa e a retirada dos parafusos da televisão, mas ainda quando estava dentro da casa com o bem, Luiz é surpreendido pela Policía Militar, que informada dos fatos por vizinhos, realizou sua prisão em flagrante.

      Em sede policial, foi descoberto que Luiz contou com a participação de José, que, sabendo do plano criminoso do amigo, foi o responsável por dizer o horário em que a vítima estaria sozinha em sua residência, bem como a porta que teria uma falha na fechadura, facilitando o ingresso de Luiz no imóvel. Luiz e José foram denunciados pela prática do crime de roubo majorado pelo concurso de agentes.

      Observado o procedimento previsto em lei e confirmados os fatos, foi proferida sentença condenatória, sendo aplicada a pena mínima possível de 5 anos e 4 meses de reclusão, além de 13 dias-multa, para José. Já Luiz teve sua pena base fixada acima do mínimo legal, em 4 anos e 6 meses de reclusão e 12 dias-multa, reconhecendo o magistrado a existência de má conduta social, pelo fato de Luiz possuir 5 condenações sem trânsito em julgado pela suposta prática de crimes de roubo, apesar de admitir, na decisão, que as anotações constantes da Folha de Antecedentes Criminais não poderiam justificar o reconhecimento de maus antecedentes. Não foram reconhecidas agravantes, sendo, na terceira fase, a pena aumentada, no mínimo possível, em razão da majorante do concurso de agentes. Assim, a pena final de Luiz restou acomodada em 06 anos de reclusão e 15 dias-multa.

      Intimado da decisão, o advogado de José apresentou recurso buscando reconhecimento da modalidade tentada do delito, bem como da causa de diminuição da participação de menor importância.

      Luiz, então, consulta você, como advogado(a), para avaliar o interesse em apresentar recurso de apelação.

      Na condição de advogado(a) de Luiz, esclareça os questionamentos formulados pelo seu cliente.
    comando: Não sendo apresentado recurso de apelação por Luiz, poderá ele ser beneficiado pelo reconhecimento da causa de diminuição de pena da tentativa no julgamento do recurso apresentado por José? E da causa de diminuição de pena da participação de menor importância? Justifique.
    gabarito: Luiz não poderá ser beneficiado por eventual reconhecimento de causa de diminuição de pena de participação de menor importância, enquanto poderá ser beneficiado em caso de reconhecimento da modalidade tentada do delito, ainda que não tenha apresentado recurso de apelação questionando tal tema. De acordo com o Art. 580 do CPP, no caso de concurso de agentes, a decisão do recurso interposto por um dos réus, se fundado em motivos que não sejam de caráter exclusivamente pessoal, aproveitará aos outros. A causa de diminuição de pena da tentativa é dado objetivo, não sendo de caráter pessoal, já que o crime restou ou não consumado em relação a todos os agentes. Assim, reconhecida a modalidade tentada, possível a extensão dos efeitos ao corréu que não recorreu. Por outro lado, a participação de menor importância, trazida pelo Art. 29, § 1º, do CP, é dado exclusivamente pessoal. Luiz adotou conduta relevante na execução do crime, sendo o executor direto da grave ameaça e da subtração da televisão. A situação de José seria diferente, já que sua participação poderia vir a ser considerada de menor relevância. Luiz sequer é partícipe, mas sim autor. Dessa forma, mesmo que reconhecida a causa de diminuição de pena do Art. 29, § 1º, do CP, para José, não haverá extensão para Luiz.
    opcoes:
      correta: Luiz poderá ser beneficiado por eventual causa de diminuição de pena em razão da tentativa, mesmo não apresentando recurso, tendo em vista que se trata de circunstância objetiva ou de caráter não exclusivamente pessoal. A participação de menor importância é circunstância pessoal, não se estendendo ao corréu, nos termos do Art. 580 do CPP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "A hipótese é de resultado diverso do pretendido (art. 74 do CP), devendo responder por dano em concurso formal com o crime de homicídio culposo. OBS.: a mera indicação de dispositivo legal ou transcrição de seu conteúdo não será pontuada."
        - O requerimento a ser formulado é de relaxamento da prisão, tendo em vista que não está presente nenhuma das situações de flagrante elencadas no Art. 302 do CPP.
        - O argumento seria o de que deveria ter sido reconhecida a atenuante da reparação do dano, tendo em vista que o denunciado devolveu o valor obtido indevidamente, nos termos do Art. 65, inciso III, alínea b, do CP.
    revisao: *a1
  - id: 32-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Luiz, no dia 05 de fevereiro de 2019, ingressou na residência de Henrique e, mediante grave ameaça contra a vítima, buscou subtrair a televisão do imóvel. Após o emprego da grave ameaça à pessoa e a retirada dos parafusos da televisão, mas ainda quando estava dentro da casa com o bem, Luiz é surpreendido pela Policía Militar, que informada dos fatos por vizinhos, realizou sua prisão em flagrante.

      Em sede policial, foi descoberto que Luiz contou com a participação de José, que, sabendo do plano criminoso do amigo, foi o responsável por dizer o horário em que a vítima estaria sozinha em sua residência, bem como a porta que teria uma falha na fechadura, facilitando o ingresso de Luiz no imóvel. Luiz e José foram denunciados pela prática do crime de roubo majorado pelo concurso de agentes.

      Observado o procedimento previsto em lei e confirmados os fatos, foi proferida sentença condenatória, sendo aplicada a pena mínima possível de 5 anos e 4 meses de reclusão, além de 13 dias-multa, para José. Já Luiz teve sua pena base fixada acima do mínimo legal, em 4 anos e 6 meses de reclusão e 12 dias-multa, reconhecendo o magistrado a existência de má conduta social, pelo fato de Luiz possuir 5 condenações sem trânsito em julgado pela suposta prática de crimes de roubo, apesar de admitir, na decisão, que as anotações constantes da Folha de Antecedentes Criminais não poderiam justificar o reconhecimento de maus antecedentes. Não foram reconhecidas agravantes, sendo, na terceira fase, a pena aumentada, no mínimo possível, em razão da majorante do concurso de agentes. Assim, a pena final de Luiz restou acomodada em 06 anos de reclusão e 15 dias-multa.

      Intimado da decisão, o advogado de José apresentou recurso buscando reconhecimento da modalidade tentada do delito, bem como da causa de diminuição da participação de menor importância.

      Luiz, então, consulta você, como advogado(a), para avaliar o interesse em apresentar recurso de apelação.

      Na condição de advogado(a) de Luiz, esclareça os questionamentos formulados pelo seu cliente.
    comando: Existe argumento de direito material a ser apresentado em busca da redução da pena base aplicada a Luiz? Justifique.
    gabarito: |-
      Sim, existe argumento a ser apresentado em busca da redução da pena base aplicada, tendo em vista que ações em curso não podem ser valorizadas de maneira negativa no momento da aplicação da pena base. Durante muito tempo se controverteu sobre a possibilidade de as ações em curso, com ou sem condenações sem trânsito em julgado, poderem ser reconhecidas como maus antecedentes. Prevaleceu o entendimento pela impossibilidade, sob pena de violação ao princípio da presunção de inocência. Contudo, diversos magistrados valorizavam essas ações em curso como condição social negativa ou personalidade voltada para prática de crimes, aumentando a pena base. Ocorre que o Superior Tribunal de Justiça, por meio da Súmula 444, afastou a possibilidade de tal conduta por parte dos magistrados, já que decidiu que as ações em curso e inquéritos policiais não poderão ser considerados no momento da aplicação da pena base como um todo e não apenas como maus antecedentes, sob pena de violação transversa/indireta ao princípio da não culpabilidade.

      Obs.: não será suficiente a mera afirmativa de que ações em curso não podem funcionar como maus antecedentes, já que esse não foi o argumento utilizado pelo magistrado para aumento da pena base.
    opcoes:
      correta: Sim, o argumento seria de que ações penais em curso não podem ser valoradas de maneira negativa ao réu no momento de aplicação da pena base, sob pena de violação ao princípio da presunção de inocência ou da não culpabilidade, conforme Súmula 444 do STJ OU Art. 5º, inciso LVII, da CRFB.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não, pois o emprego de arma é uma circunstância objetiva elementar do delito, razão pela qual há comunicabilidade, nos termos do Art. 30, do CP.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento é que houve concurso formal de crimes, tendo em vista que, com uma só ação, foram praticados dois delitos, nos termos do Art. 70 do CP.
        - O argumento seria o de que deveria ter sido reconhecida a atenuante da reparação do dano, tendo em vista que o denunciado devolveu o valor obtido indevidamente, nos termos do Art. 65, inciso III, alínea b, do CP.
