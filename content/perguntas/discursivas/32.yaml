      Considerando a pena prevista para o delito e a inexistência de envolvimento pretérito com aparato judicial ou policial pelo autor do fato, o Ministério Público apresentou proposta de acordo de não persecução penal a Francisco. Ao tomar conhecimento dos fatos, Maria procura você, como advogado, para esclarecimentos.

      Considerando apenas as informações expostas, responda na qualidade de advogado de Maria, aos itens a seguir.
    comando: Em caso de denúncia, diante da natureza da ação pública incondicionada, existe alguma forma de participação direta da vítima no processo, inclusive com posição ativa na produção das provas e interposição de recursos? Justifique.
    gabarito: Sim, a vítima poderia, por meio de seu advogado, se habilitar como assistente de acusação, na forma do Art. 268 do CPP. De acordo com o dispositivo, em todos os termos da ação pública, poderá intervir, como assistente do Ministério Público, o ofendido. No caso, temos uma vítima determinada, Maria. Ademais, a ação penal é pública incondicionada, já que não se aplicam as previsões da Lei nº 9.099/95, nos termos do Art. 41 da Lei nº 11.340/06. Uma vez habilitada como assistente de acusação, Maria poderá interferir de diversas maneiras no processo, inclusive para propor meios de prova, realizar perguntas para testemunhas, apresentar manifestações de mérito e recursos, tudo na forma do Art. 271 do CPP.
    opcoes:
      correta: Sim. Maria poderá se habilitar como assistente de acusação ou assistente do Ministério Público, na forma do Art. 268 do CPP OU do Art. 271 do CPP
