    comando: Que tese preliminar deve ser alegada na peça, e com qual fundamento?
    gabarito: Preliminarmente, extinção da punibilidade do agente OU nulidade em razão da ausência de representação, com reconhecimento da decadência, conforme o Art. 107, inciso IV, do CP OU 564, inciso III, alínea a, ou inciso IV, CPP
    opcoes:
      correta: Preliminarmente, extinção da punibilidade do agente OU nulidade em razão da ausência de representação, com reconhecimento da decadência, conforme o Art. 107, inciso IV, do CP OU 564, inciso III, alínea a, ou inciso IV, CPP
      erradas:
        - "Prescrição da pretensão punitiva: pena máxima de 4 anos prescreve em 8, mas a ré era menor de 21 anos e o prazo corre pela metade (CP, arts. 109, IV, 115 e 126)."
        - Nulidade da interceptação telefônica decretada como primeira medida investigatória (art. 2º, II, Lei 9.296/96) e sem fundamentação adequada (art. 5º da Lei 9.296/96 ou art. 93, IX, CF).
        - Violação das regras da mutatio libelli, art. 384 do CPP, c/c art. 411, § 3º, do CPP.
        - Nulidade em razão do não oferecimento de proposta de suspensão condicional do processo, nos termos do Art. 89 da Lei 9.099, já que a pena mínima do delito imputado é de 1 ano.
        - Nulidade em razão da ausência de exame de corpo de delito, direto ou indireto, nos termos do Art. 158 do CPP.
