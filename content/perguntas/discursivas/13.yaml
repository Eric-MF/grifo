    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: "Da aplicação do princípio da consunção ou absorção: o crime de violação de domicílio deve ser absorvido pelo delito de furto qualificado, pois configurou crime-meio, essencial à execução do crime-fim; deve ser excluída a condenação pela violação de domicílio."
    opcoes:
      correta: "Da aplicação do princípio da consunção ou absorção: o crime de violação de domicílio deve ser absorvido pelo delito de furto qualificado, pois configurou crime-meio, essencial à execução do crime-fim; deve ser excluída a condenação pela violação de domicílio."
      erradas:
        - Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
        - No mérito, absolvição de Júlio, na forma do Art. 386, incisos III ou VI, do CPP.
        - Da tese da incidência da atenuante da menoridade penal relativa
        - Subsidiariamente, aplicação de pena base no mínimo legal, já que as circunstâncias do Art. 59 são favoráveis.
        - A prática de falta grave não gera o reinício da contagem do prazo de indulto, nos termos da Súmula 535 do STJ.
