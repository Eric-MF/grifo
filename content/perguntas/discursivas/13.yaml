# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "13"
introducoes:
  peca: "Diogo pulou o muro de três metros de uma casa e levou joias, celulares, um notebook e dinheiro, R$ 9 mil no total. Foi condenado por violação de domicílio em concurso material com furto qualificado pela escalada, a 4 anos e 40 dias no semiaberto, sem nenhum benefício. O juiz aplicou a agravante da reincidência por causa de uma condenação por estelionato proferida uma semana antes, ainda sem trânsito em julgado, por um fato posterior ao furto. Você defende Diogo na apelação."
  q1: "Parado numa blitz com o carro todo irregular, Gustavo cochichou à esposa, na fila: 'Vou oferecer cem reais pra ele liberar a gente.' Um policial atrás dele ouviu e o prendeu em flagrante por tentativa de corrupção ativa."
  q2: "Antônio, faxineiro de uma empresa, entrou com uma chave falsa na sala do chefe e levou na bolsa uma escultura de R$ 250. Foi preso por policiais 400 metros depois de sair do prédio. Primário, foi condenado por furto qualificado pelo uso de chave falsa, consumado, a 2 anos."
  q4: "Pedro foi condenado por tráfico privilegiado, com a redução máxima da pena. O juiz fixou o regime inicial fechado só porque a lei dos crimes hediondos o determina e negou a substituição da pena porque a Lei de Drogas a veda nesse crime."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["13-peca-1", "13-peca-4", "13-peca-5-2b", "13-peca-5-3", "13-peca-6a", "13-peca-6b", "13-peca-6c", "13-peca-6d", "13-peca-6e"]
perguntas:
  - id: 13-peca-5-1
    categoria: peca-detalhe
    parte: peca
    item: "5.1"
    secao: merito
    pergunta: "Diogo entrou na casa só para furtar. O que deve acontecer com a condenação por violação de domicílio?"
    tese: "Consunção: a violação de domicílio foi meio para o furto e é absorvida por ele"
    aceitos: [ "consun* | absorc* | absorvid* | absorve" ]
    artigos: [ "art. 386, III, CPP", "art. 150, CP" ]
    gabarito: "Da aplicação do princípio da consunção ou absorção: o crime de violação de domicílio deve ser absorvido pelo delito de furto qualificado, pois configurou crime-meio, essencial à execução do crime-fim; deve ser excluída a condenação pela violação de domicílio."
    revisao: { status: revisado }
  - id: 13-peca-5-2a
    categoria: peca-detalhe
    parte: peca
    item: "5.2a"
    secao: merito
    pergunta: "Diogo pode ser considerado reincidente por causa da condenação por estelionato?"
    tese: "Não há reincidência: a condenação não transitou em julgado e o fato é posterior ao furto"
    aceitos: [ "nao e reincidente | nao ha reincidencia | nao reincidente | sem reincidencia | nao pode | primario" ]
    artigos: [ "art. 63, CP" ]
    gabarito: "Da inaplicabilidade da reincidência: não há que se falar em reincidência, nos termos do artigo 63 do CP."
    revisao: { status: revisado }
  - id: 13-peca-5-4
    categoria: peca-detalhe
    parte: peca
    item: "5.4"
    secao: merito
    pergunta: "Afastada a reincidência, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto"
    aceitos: [ "aberto" ]
    artigos: [ "art. 33, § 2º, c, CP" ]
    gabarito: "Da consequente fixação do regime aberto, nos termos do artigo 33, § 2º, c, do CP."
    revisao: { status: revisado }
  - id: 13-peca-5-5
    categoria: peca-detalhe
    parte: peca
    item: "5.5"
    secao: merito
    pergunta: "Além do regime, o que a defesa deve pedir quanto à espécie de pena?"
    tese: "A substituição da pena privativa de liberdade por restritivas de direitos"
    aceitos: [ "substitui*" ]
    artigos: [ "art. 44, CP" ]
    gabarito: "Da substituição da pena privativa de liberdade por restritiva de direitos, nos termos do artigo 44 do CP."
    revisao: { status: revisado }
  - id: 13-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Gustavo deve responder por tentativa de corrupção ativa?"
    tese: "Não há tentativa de corrupção ativa: houve só cogitação, sem início da execução"
    aceitos: [ [ "cogitacao" ], [ "inicio da execucao | iniciou a execucao | iniciada a execucao" ], [ "ato preparatorio | atos preparatorios" ] ]
    artigos: [ "art. 14, II, CP", "art. 333, CP" ]
    gabarito: "A questão objetiva extrair do examinando conhecimento acerca do iter criminis e dos crimes praticados por particular contra a administração pública.\n\nNesse sentido, relativamente à alternativa “A”, o examinando deve lastrear sua resposta no sentido de que o delito de corrupção ativa (artigo 333 do CP) é crime formal que não admite, via de regra, a modalidade tentada (exceto, como exemplo recorrente na doutrina, se o crime for praticado via escritos). Além disso, levando em conta a narrativa do enunciado, percebe-se que o delito em análise sequer teve o início da execução e, muito menos, atingiu a consumação. Isso porque a corrupção ativa somente se consuma com o efetivo oferecimento ou promessa de vantagem indevida, o que não ocorreu no caso narrado.\n\nConsequentemente, a conduta levada a efeito por Gustavo é atípica.\n\nNo que se refere a alternativa “B”, por sua vez, o examinando deve indicar que caso Gustavo pagasse a quantia solicitada pelo policial ele não responderia por corrupção ativa pelo simples fato de que tal conduta sequer está descrita no tipo penal do artigo 333 do CP, configurando, portanto, fato atípico."
    revisao: { status: revisado }
  - id: 13-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "E se o policial tivesse exigido o dinheiro e Gustavo, com medo, pagasse, ele responderia por corrupção ativa?"
    tese: "Quem paga a vantagem exigida pelo policial não comete corrupção ativa: o policial é que comete concussão"
    aceitos: [ [ "concussao" ], [ "atipic*" ], [ "nao esta prevista | nao prevista" ] ]
    artigos: [ "art. 316, CP", "art. 333, CP" ]
    gabarito: "A questão objetiva extrair do examinando conhecimento acerca do iter criminis e dos crimes praticados por particular contra a administração pública.\n\nNesse sentido, relativamente à alternativa “A”, o examinando deve lastrear sua resposta no sentido de que o delito de corrupção ativa (artigo 333 do CP) é crime formal que não admite, via de regra, a modalidade tentada (exceto, como exemplo recorrente na doutrina, se o crime for praticado via escritos). Além disso, levando em conta a narrativa do enunciado, percebe-se que o delito em análise sequer teve o início da execução e, muito menos, atingiu a consumação. Isso porque a corrupção ativa somente se consuma com o efetivo oferecimento ou promessa de vantagem indevida, o que não ocorreu no caso narrado.\n\nConsequentemente, a conduta levada a efeito por Gustavo é atípica.\n\nNo que se refere a alternativa “B”, por sua vez, o examinando deve indicar que caso Gustavo pagasse a quantia solicitada pelo policial ele não responderia por corrupção ativa pelo simples fato de que tal conduta sequer está descrita no tipo penal do artigo 333 do CP, configurando, portanto, fato atípico."
    revisao: { status: revisado }
  - id: 13-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Por que o furto de Antônio se consumou, mesmo com a prisão a 400 metros do prédio?"
    tese: "Consumação do furto pela inversão da posse: a escultura saiu da esfera de vigilância da vítima"
    aceitos: [ [ "inversao da posse" ], [ "amotio" ], [ "disponibilidade" ], [ "esfera de vigilancia | esfera de disponibilidade" ] ]
    artigos: [ "art. 155, CP" ]
    gabarito: "A questão trata do crime de furto e busca extrair do examinando conhecimento específico sobre dois pontos importantes acerca do tema: o momento consumativo do delito e a incidência do privilégio. A primeira indagação tem cunho eminentemente teórico, enquanto a segunda é de caráter prático, pois exige que o examinando saiba interpretar informações dadas no enunciado e, a partir delas, identificar a incidência do privilégio, o que será capaz de reduzir significativamente a resposta penal a ser dada ao personagem da questão. Nesse sentido, para fazer jus aos pontos relativos ao item “A” o examinando deve responder afirmativamente, indicando que o furto atingiu a consumação. Com efeito, diversas teorias existem sobre o momento consumativo do crime de furto, sendo certo que a predominante, tanto na doutrina quanto na jurisprudência dos Tribunais Superiores, é a Teoria da Amotio, segundo a qual a consumação ocorre quando a coisa subtraída passa para o poder do agente, mesmo que num curto espaço de tempo – tal como ocorreu no caso narrado -, independentemente de deslocamento ou posse mansa e pacífica da coisa. Também merece destaque, embora não seja o entendimento majoritário, reflexão sobre o momento consumativo do crime de furto narrado no enunciado com a adoção da Teoria da Ablatio.\n\nPerceba-se que ainda assim a resposta seria a mesma: o furto foi consumado. Isso porque, para aqueles que adotam a Teoria da Ablatio, o furto consuma-se quando o agente, depois de apoderar-se da coisa, consegue deslocá-la de um lugar para o outro – fato que, da mesma forma, foi narrado no enunciado. Cabe ressaltar que a Banca Examinadora, com o intuito de privilegiar a demonstração de conhecimento jurídico, aceitará como justificativa correta ambas as fundamentações acima expostas, sem perder de vista que os Tribunais Superiores adotam a Teoria da Amotio. Pelo mesmo motivo, entretanto, não será pontuada a resposta que traga apenas a afirmativa “sim”, desprovida de qualquer justificativa ou mesmo com justificativa equivocada.\n\nNo tocante ao item “B”, para que receba a pontuação respectiva, o examinando deve indicar que de acordo com a questão, desconsiderando a argumentação no sentido de aplicação do princípio da insignificância (que pelo próprio enunciado afigura-se como inaplicável), a principal tese defensiva deve ser o reconhecimento do furto qualificado e privilegiado (artigo 155, § 2º, c/c artigo 155, § 4º, III, ambos do CP).\n\nIsso porque a qualificadora da utilização de chave falsa possui natureza objetiva, sendo compatível com o furto privilegiado, que é de ordem subjetiva. O reconhecimento do furto privilegiado ou mínimo deve ser o argumento defensivo em sede de apelação por trazer vários benefícios a Antônio como a substituição da pena de reclusão pela pena de detenção, a diminuição da pena de um a dois terços ou aplicação da pena de multa. Cabe destacar que há muito tempo a controvérsia sobre a possibilidade de furto privilegiado e qualificado foi superada, existindo diversos julgados tanto no STF quanto no STJ sobre o tema. Inclusive, o próprio STF, no Informativo 580, manifestou-se sobre a possibilidade de tal combinação, sendo, portanto, a melhor tese defensiva."
    revisao: { status: revisado }
  - id: 13-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Sem a insignificância, qual a principal tese defensiva na apelação de Antônio?"
    tese: "O furto privilegiado, compatível com a qualificadora"
    aceitos: [ "privilegi*" ]
    artigos: [ "art. 155, § 2º, CP", "Súmula 511 STJ" ]
    gabarito: "A questão trata do crime de furto e busca extrair do examinando conhecimento específico sobre dois pontos importantes acerca do tema: o momento consumativo do delito e a incidência do privilégio. A primeira indagação tem cunho eminentemente teórico, enquanto a segunda é de caráter prático, pois exige que o examinando saiba interpretar informações dadas no enunciado e, a partir delas, identificar a incidência do privilégio, o que será capaz de reduzir significativamente a resposta penal a ser dada ao personagem da questão. Nesse sentido, para fazer jus aos pontos relativos ao item “A” o examinando deve responder afirmativamente, indicando que o furto atingiu a consumação. Com efeito, diversas teorias existem sobre o momento consumativo do crime de furto, sendo certo que a predominante, tanto na doutrina quanto na jurisprudência dos Tribunais Superiores, é a Teoria da Amotio, segundo a qual a consumação ocorre quando a coisa subtraída passa para o poder do agente, mesmo que num curto espaço de tempo – tal como ocorreu no caso narrado -, independentemente de deslocamento ou posse mansa e pacífica da coisa. Também merece destaque, embora não seja o entendimento majoritário, reflexão sobre o momento consumativo do crime de furto narrado no enunciado com a adoção da Teoria da Ablatio.\n\nPerceba-se que ainda assim a resposta seria a mesma: o furto foi consumado. Isso porque, para aqueles que adotam a Teoria da Ablatio, o furto consuma-se quando o agente, depois de apoderar-se da coisa, consegue deslocá-la de um lugar para o outro – fato que, da mesma forma, foi narrado no enunciado. Cabe ressaltar que a Banca Examinadora, com o intuito de privilegiar a demonstração de conhecimento jurídico, aceitará como justificativa correta ambas as fundamentações acima expostas, sem perder de vista que os Tribunais Superiores adotam a Teoria da Amotio. Pelo mesmo motivo, entretanto, não será pontuada a resposta que traga apenas a afirmativa “sim”, desprovida de qualquer justificativa ou mesmo com justificativa equivocada.\n\nNo tocante ao item “B”, para que receba a pontuação respectiva, o examinando deve indicar que de acordo com a questão, desconsiderando a argumentação no sentido de aplicação do princípio da insignificância (que pelo próprio enunciado afigura-se como inaplicável), a principal tese defensiva deve ser o reconhecimento do furto qualificado e privilegiado (artigo 155, § 2º, c/c artigo 155, § 4º, III, ambos do CP).\n\nIsso porque a qualificadora da utilização de chave falsa possui natureza objetiva, sendo compatível com o furto privilegiado, que é de ordem subjetiva. O reconhecimento do furto privilegiado ou mínimo deve ser o argumento defensivo em sede de apelação por trazer vários benefícios a Antônio como a substituição da pena de reclusão pela pena de detenção, a diminuição da pena de um a dois terços ou aplicação da pena de multa. Cabe destacar que há muito tempo a controvérsia sobre a possibilidade de furto privilegiado e qualificado foi superada, existindo diversos julgados tanto no STF quanto no STJ sobre o tema. Inclusive, o próprio STF, no Informativo 580, manifestou-se sobre a possibilidade de tal combinação, sendo, portanto, a melhor tese defensiva."
    revisao: { status: revisado }
  - id: 13-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "A defesa pode impugnar o regime fechado fixado só com base na lei dos crimes hediondos?"
    tese: "Inconstitucionalidade do regime inicial fechado obrigatório dos crimes hediondos: o regime segue as regras gerais"
    aceitos: [ "inconstitucional*" ]
    artigos: [ "art. 33, § 2º, CP", "art. 5, XLVI, CRFB" ]
    gabarito: "A questão objetiva extrair do examinando conhecimento atualizado acerca da jurisprudência do STF.\n\nNesse sentido, relativamente ao item A, a resposta deve ser lastreada no sentido de que cabe, sim, impugnação ao regime inicial fechado, fixado exclusivamente com base no artigo 2º, § 1º, da Lei nº 8.072/90. Isso porque o STF, no HC 111.840/ES, declarou inconstitucional a previsão, na Lei dos Crimes Hediondos, da exigência da fixação do regime inicial fechado. Na oportunidade a Corte se manifestou no sentido de que a definição do regime deveria sempre ser analisada independentemente da natureza da infração. A CRFB/88 contemplaria as restrições aplicadas à Lei nº 8.072/90, dentre as quais não estaria a obrigatoriedade de imposição de regime extremo para início de cumprimento de pena. Tal posicionamento vem sendo reiterado pela Suprema Corte, sendo certo que a fixação do regime inicialmente fechado deve conter uma fundamentação em concreto, sob pena de ofensa à individualização da pena.\n\nNo tocante ao item B, devemos observar que o STF, no HC 97.256/RS, decidiu que o artigo 33, § 4º, da Lei nº 11.343/2006 é inconstitucional ao vedar a conversão da pena privativa de liberdade em pena restritiva de direitos. Após a reiteração do entendimento pela Suprema Corte foi editada a resolução nº 5 do Senado com o seguinte teor: “artigo 1º - É suspensa a execução da expressão \"vedada a conversão em penas restritivas de direitos\" do § 4º do artigo 33, da Lei nº 11.343, de 23 de agosto de 2006, declarada inconstitucional por decisão definitiva do Supremo Tribunal Federal nos autos do Habeas Corpus nº 97.256/RS.” Desta forma, é possível a conversão da pena privativa de liberdade em pena restritiva de direitos, desde que o réu preencha os requisitos do artigo 44, do CP."
    revisao: { status: revisado }
  - id: 13-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "No tráfico privilegiado, a pena pode ser substituída por restritivas de direitos?"
    tese: "Cabe a substituição por restritivas de direitos no tráfico privilegiado: a vedação foi declarada inconstitucional"
    aceitos: [ [ "inconstitucional*" ], [ "requisitos" ] ]
    artigos: [ "art. 44, CP" ]
    gabarito: "A questão objetiva extrair do examinando conhecimento atualizado acerca da jurisprudência do STF.\n\nNesse sentido, relativamente ao item A, a resposta deve ser lastreada no sentido de que cabe, sim, impugnação ao regime inicial fechado, fixado exclusivamente com base no artigo 2º, § 1º, da Lei nº 8.072/90. Isso porque o STF, no HC 111.840/ES, declarou inconstitucional a previsão, na Lei dos Crimes Hediondos, da exigência da fixação do regime inicial fechado. Na oportunidade a Corte se manifestou no sentido de que a definição do regime deveria sempre ser analisada independentemente da natureza da infração. A CRFB/88 contemplaria as restrições aplicadas à Lei nº 8.072/90, dentre as quais não estaria a obrigatoriedade de imposição de regime extremo para início de cumprimento de pena. Tal posicionamento vem sendo reiterado pela Suprema Corte, sendo certo que a fixação do regime inicialmente fechado deve conter uma fundamentação em concreto, sob pena de ofensa à individualização da pena.\n\nNo tocante ao item B, devemos observar que o STF, no HC 97.256/RS, decidiu que o artigo 33, § 4º, da Lei nº 11.343/2006 é inconstitucional ao vedar a conversão da pena privativa de liberdade em pena restritiva de direitos. Após a reiteração do entendimento pela Suprema Corte foi editada a resolução nº 5 do Senado com o seguinte teor: “artigo 1º - É suspensa a execução da expressão \"vedada a conversão em penas restritivas de direitos\" do § 4º do artigo 33, da Lei nº 11.343, de 23 de agosto de 2006, declarada inconstitucional por decisão definitiva do Supremo Tribunal Federal nos autos do Habeas Corpus nº 97.256/RS.” Desta forma, é possível a conversão da pena privativa de liberdade em pena restritiva de direitos, desde que o réu preencha os requisitos do artigo 44, do CP."
    revisao: { status: revisado }
