  - id: 13-peca-6e
    categoria: peca-detalhe
    parte: peca
    item: 6e
    secao: pedido
    caso: |-
      Diogo está sendo regularmente processado pela prática dos crimes de violação de domicílio (artigo 150, do CP) em concurso material com o crime de furto qualificado pela escalada (artigo 155, § 4º, II, do CP). Isso porque, segundo narrou a inicial acusatória, no dia 10/11/2012 (sábado), Diogo pulou o muro de cerca de três metros que guarnecia a casa da vítima e, então, após ingressar clandestinamente na residência, subtraiu diversos pertences e valores, a saber: três anéis de ouro, dois relógios de ouro, dois aparelhos de telefone celular, um notebook e quinhentos reais em espécie, totalizando R$9.000,00 (nove mil reais).

      Na audiência de instrução e julgamento, realizada em 29/08/2013 (quinta-feira), foram ouvidas duas testemunhas de acusação que, cada uma a seu turno, disseram ter visto Diogo pular o muro da residência da vítima e dali sair, cerca de vinte minutos após, levando uma mochila cheia. A defesa, por sua vez, não apresentou testemunhas. Também na audiência de instrução e julgamento foi exibido um DVD contendo as imagens gravadas pelas câmeras de segurança presentes na casa da vítima, sendo certo que à defesa foi assegurado o acesso ao conteúdo do DVD, mas essa se manifestou no sentido de que nada havia a impugnar.

      Nas imagens exibidas em audiência ficou constatado (dada a nitidez das mesmas) que fora Diogo quem realmente pulou o muro da residência e realizou a subtração dos bens. Em seu interrogatório o réu exerceu o direito ao silêncio.

      Em alegações finais orais, o Ministério Público exibiu cópia de sentença prolatada cerca de uma semana antes (ainda sem trânsito em julgado definitivo, portanto), onde se condenou o réu pela prática, em 25/12/2012 (terça-feira), do crime de estelionato. A defesa, em alegações finais, limitou-se a falar do princípio do estado de inocência, bem como que eventual silêncio do réu não poderia importar-lhe em prejuízo. O Juiz, então, proferiu sentença em audiência condenando Diogo pela prática do crime de violação de domicílio em concurso material com o crime de furto qualificado pela escalada. Para a dosimetria da pena o magistrado ponderou o fato de que nenhum dos bens subtraídos fora recuperado.

      Além disso, fez incidir a circunstância agravante da reincidência, pois considerou que a condenação de Diogo pelo crime de estelionato o faria reincidente. O total da condenação foi de 4 anos e 40 dias de reclusão em regime inicial semi-aberto e multa à proporção de um trigésimo do salário mínimo. Por fim, o magistrado, na sentença, deixou claro que Diogo não fazia jus a nenhum outro benefício legal, haja vista o fato de não preencher os requisitos para tanto. A sentença foi lida em audiência.

      O advogado(a) de Diogo, atento(a) tão somente às informações descritas no texto, deve apresentar o recurso cabível à impugnação da decisão, respeitando as formalidades legais e desenvolvendo, de maneira fundamentada, as teses defensivas pertinentes. O recurso deve ser datado com o último dia cabível para a interposição. (Valor: 5,0)
    comando: Que pedido deve ser formulado na peça?
    gabarito: Substituição da pena privativa de liberdade por restritiva de direitos.
    opcoes:
      correta: Substituição da pena privativa de liberdade por restritiva de direitos.
      erradas:
        - Absolvição, com argumento e base legal.
        - Reconhecimento da preliminar e extinção da punibilidade; impronúncia, nos termos do art. 414 do CPP (admite-se absolvição sumária, art. 415).
        - "Pedidos: Absolvição, na forma do Art. 386, inciso VI, do CPP"
        - Conhecimento e provimento do recurso.
        - Pedido de reconhecimento do crime impossível, ante a absoluta ineficácia do meio empregado, nos termos do Art. 17 do CP.
