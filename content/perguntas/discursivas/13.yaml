  - id: 13-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Antônio, auxiliar de serviços gerais de uma multinacional, nos dias de limpeza, passa a observar uma escultura colocada na mesa de seu chefe. Com o tempo, o desejo de ter aquele objeto fica incontrolável, razão pela qual ele decide subtraí-lo.

      Como Antônio não tem acesso livre à sala onde a escultura fica exposta, utiliza-se de uma chave adaptável a qualquer fechadura, adquirida por meio de um amigo chaveiro, que nada sabia sobre suas intenções.

      Com ela, Antônio ingressa na sala do chefe, após o expediente de trabalho, e subtrai a escultura pretendida, colocando-a em sua bolsa.

      Após subtrair o objeto e sair do edifício onde fica localizada a empresa, Antônio caminha tranquilamente cerca de 400 metros. Apenas nesse momento é que os seguranças da portaria suspeitam do ocorrido. Eles acham estranha a saída de Antônio do local após o expediente (já que não era comum a realização de horas extras), razão pela qual acionam policiais militares que estavam próximos do local, apontando Antônio como suspeito. Os policiais conseguem alcançá-lo e decidem revistá-lo, encontrando a escultura da sala do chefe na sua bolsa. Preso em flagrante, Antônio é conduzido até a Delegacia de Polícia.

      Antônio, então, é denunciado e regularmente processado. Ocorre que, durante a instrução processual, verifica-se que a escultura subtraída, apesar de bela, foi construída com material barato, avaliada em R$ 250,00 (duzentos e cinquenta reais), sendo, portanto, de pequeno valor. A FAC (folha de antecedentes criminais) aponta que Antônio é réu primário.

      Ao final da instrução, em que foram respeitadas todas as exigências legais, o juiz, em decisão fundamentada, condena Antônio a 2 (dois) anos de reclusão pela prática do crime de furto qualificado pela utilização de chave falsa, consumado, com base no artigo 155, § 4º, III, do CP.

      Nesse sentido, levando em conta apenas os dados contidos no enunciado, responda aos itens a seguir.
    comando: "É correto afirmar que o crime de furto praticado por Antônio atingiu a consumação? Justifique. (Valor:"
    gabarito: |-
      A questão trata do crime de furto e busca extrair do examinando conhecimento específico sobre dois pontos importantes acerca do tema: o momento consumativo do delito e a incidência do privilégio. A primeira indagação tem cunho eminentemente teórico, enquanto a segunda é de caráter prático, pois exige que o examinando saiba interpretar informações dadas no enunciado e, a partir delas, identificar a incidência do privilégio, o que será capaz de reduzir significativamente a resposta penal a ser dada ao personagem da questão. Nesse sentido, para fazer jus aos pontos relativos ao item “A” o examinando deve responder afirmativamente, indicando que o furto atingiu a consumação. Com efeito, diversas teorias existem sobre o momento consumativo do crime de furto, sendo certo que a predominante, tanto na doutrina quanto na jurisprudência dos Tribunais Superiores, é a Teoria da Amotio, segundo a qual a consumação ocorre quando a coisa subtraída passa para o poder do agente, mesmo que num curto espaço de tempo – tal como ocorreu no caso narrado -, independentemente de deslocamento ou posse mansa e pacífica da coisa. Também merece destaque, embora não seja o entendimento majoritário, reflexão sobre o momento consumativo do crime de furto narrado no enunciado com a adoção da Teoria da Ablatio.

      Perceba-se que ainda assim a resposta seria a mesma: o furto foi consumado. Isso porque, para aqueles que adotam a Teoria da Ablatio, o furto consuma-se quando o agente, depois de apoderar-se da coisa, consegue deslocá-la de um lugar para o outro – fato que, da mesma forma, foi narrado no enunciado. Cabe ressaltar que a Banca Examinadora, com o intuito de privilegiar a demonstração de conhecimento jurídico, aceitará como justificativa correta ambas as fundamentações acima expostas, sem perder de vista que os Tribunais Superiores adotam a Teoria da Amotio. Pelo mesmo motivo, entretanto, não será pontuada a resposta que traga apenas a afirmativa “sim”, desprovida de qualquer justificativa ou mesmo com justificativa equivocada.

      No tocante ao item “B”, para que receba a pontuação respectiva, o examinando deve indicar que de acordo com a questão, desconsiderando a argumentação no sentido de aplicação do princípio da insignificância (que pelo próprio enunciado afigura-se como inaplicável), a principal tese defensiva deve ser o reconhecimento do furto qualificado e privilegiado (artigo 155, § 2º, c/c artigo 155, § 4º, III, ambos do CP).

      Isso porque a qualificadora da utilização de chave falsa possui natureza objetiva, sendo compatível com o furto privilegiado, que é de ordem subjetiva. O reconhecimento do furto privilegiado ou mínimo deve ser o argumento defensivo em sede de apelação por trazer vários benefícios a Antônio como a substituição da pena de reclusão pela pena de detenção, a diminuição da pena de um a dois terços ou aplicação da pena de multa. Cabe destacar que há muito tempo a controvérsia sobre a possibilidade de furto privilegiado e qualificado foi superada, existindo diversos julgados tanto no STF quanto no STJ sobre o tema. Inclusive, o próprio STF, no Informativo 580, manifestou-se sobre a possibilidade de tal combinação, sendo, portanto, a melhor tese defensiva.
    opcoes:
      correta: Sim, porque a subtração foi completa, já que a res furtiva foi encontrada na bolsa de Antônio, havendo perda da disponibilidade por parte do proprietário do bem subtraído.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - À autoridade judiciária, na forma do Art. 24-A, §2º, da Lei nº 11.340/2006.
        - "Sim, resta configurada a prescrição da pretensão punitiva retroativa. Obs.: A indicação de espécie distinta de prescrição macula a integralidade do item “A”."
        - Não agiu corretamente a autoridade policial, pois o delito praticado por Patrícia foi de injúria racial e não de racismo, conforme o Art. 140, § 3º, do Código Penal, pois a intenção da agente era ofender a honra de Joana.
        - O crime do Art. 306, do CTB deve ser absorvido pelo crime do Art. 303, § 2º, do CTB, em razão da aplicação do princípio da consunção OU já que a capacidade psicomotora alterada em razão de álcool é elementar do crime de lesão corporal.
