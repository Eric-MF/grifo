      No dia seguinte, antes mesmo de qualquer busca e apreensão do bem ou atitude da autoridade policial, Roberta restituiu a coisa subtraída. As imagens da câmera de segurança foram encaminhadas ao Ministério Público, que denunciou Roberta pela prática do crime de furto simples, tipificado no Art. 155, caput, do Código Penal. O Ministério Público deixou de oferecer proposta de suspensão condicional do processo, destacando que o delito de furto não é de menor potencial ofensivo, não se sujeitando à aplicação da Lei nº 9.099/95, tendo a defesa se insurgido.

      Recebida a denúncia, durante a instrução, foi ouvida Cláudia, que confirmou ter deixado seu notebook acoplado à tomada, mas que Roberta o subtraíra, somente havendo restituição do bem com a descoberta dos agentes da lei.

      Também foram ouvidos os funcionários do curso preparatório, que disseram ter identificado a autoria a partir das câmeras de segurança. Roberta, em seu interrogatório, confirma os fatos, mas esclarece que acreditava que o notebook subtraído era seu e, por isso, levara-o para casa. Foi juntada a Folha de Antecedentes Criminais da ré sem qualquer outra anotação, o laudo de avaliação do bem subtraído, que constatou seu valor de R$ 3.000,00 (três mil reais), e o CD com as imagens captadas pela câmera de segurança. O Ministério Público, em sua manifestação derradeira, requereu a condenação da ré nos termos da denúncia.

