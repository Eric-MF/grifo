      Com base na prova produzida a partir da apreensão da faca, o Ministério Público oferece denúncia em face de José Barbosa, imputando-lhe a prática do crime de homicídio consumado.

      Considerando a situação narrada, na condição de advogado(a) de José Barbosa, responda aos itens a seguir.
    comando: Existe argumento de direito material a ser apresentado em favor de José Barbosa para evitar o prosseguimento da ação penal? Justifique.
    gabarito: Sim, existe, tendo em vista que José Barbosa não poderia ser denunciado pela prática de crime de homicídio qualificado, já que era inimputável na data dos fatos. O Código Penal, para definir o momento do crime, adota a Teoria da Atividade, prevendo o Art. 4º que se considerado praticado o crime no momento da ação ou omissão, ainda que em outro seja produzido o resultado. Dessa forma, o crime foi praticado no dia 07.03.2016, quando José Barbosa tinha 17 anos. Estabelece o Art. 27 do CP que será inimputável o menor de 18 anos. O fato de a consumação do delito só ter ocorrido após a maioridade penal de José Barbosa é irrelevante para o caso concreto, já que outro foi o momento da ação.
    opcoes:
      correta: Não poderia José Barbosa ser processado criminalmente pela prática do crime de homicídio, tendo em vista que era inimputável na data dos golpes desferidos OU tendo em vista que praticou ato infracional análogo ao crime de homicídio, pois o Código Penal adota a Teoria da Atividade para definir o momento do crime.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 23-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Gabriel, condenado pela prática do crime de porte de arma de fogo de uso restrito, obteve livramento condicional quando restava 01 ano e 06 meses de pena privativa de liberdade a ser cumprida.

      No curso do livramento condicional, após 06 meses da obtenção do benefício, vem Gabriel a ser novamente condenado, definitivamente, pela prática de crime de roubo, que havia sido praticado antes mesmo do delito de porte de arma de fogo, mas cuja instrução foi prolongada.

      Diante da nova condenação, o magistrado competente revogou o livramento condicional concedido e determinou que Gabriel deve cumprir aquele 01 ano e 06 meses de pena restante quando da obtenção do livramento em relação ao crime de porte, além da nova sanção imposta em razão do roubo.

      Considerando a situação narrada, na condição de advogado(a) de Gabriel, responda aos itens a seguir.
    comando: Qual o recurso cabível da decisão do magistrado que revogou o benefício do livramento condicional e determinou o cumprimento da pena restante quando da obtenção do benefício? É cabível juízo de retratação em tal modalidade recursal? Justifique.
    gabarito: |-
      Narra o enunciado que Gabriel cumpria pena privativa de liberdade pela prática de crime de porte de arma de fogo, quando obteve livramento condicional. No curso do livramento condicional, todavia, vem a ser condenado pela prática de crime de roubo, tendo o magistrado da execução decidido pela revogação do benefício e também por desconsiderar o período de pena cumprido em livramento. Da decisão proferida pelo juízo da execução cabe Agravo em Execução, na forma do Art. 197 da Lei de Execuções Penais, com prazo de interposição de 05 dias. Não há previsão expressa em lei sobre o procedimento a ser adotado no recurso de agravo, de modo que pacificou a doutrina e a jurisprudência que o processamento a ser adotado é semelhante ao do recurso em sentido estrito.

      Diante disso, cabível o juízo de retratação pelo magistrado competente para execução.
    opcoes:
      correta: O recurso cabível da decisão é de Agravo de Execução, na forma do Art. 197 da LEP, cabendo ao magistrado exercer juízo de retratação em razão da aplicação, no recurso de agravo, do rito previsto para o recurso em sentido estrito.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento é que houve concurso formal de crimes, tendo em vista que, com uma só ação, foram praticados dois delitos, nos termos do Art. 70 do CP.
        - O argumento é de que a prova é ilícita, tendo em vista que não poderia ter havido transcrição da conversa travada entre Flávio e seu advogado, que tem direito ao sigilo ou inviolabilidade das comunicações, não sendo o advogado coautor de crimes e nem figurando como investigado, nos termos do Art. 7º, inciso II ou III, da Lei nº 8.906/94 ou Art. 157 caput do CPP ou Art. 5º, inciso LVI da CRFB/88.
    revisao: *a1
  - id: 23-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Gabriel, condenado pela prática do crime de porte de arma de fogo de uso restrito, obteve livramento condicional quando restava 01 ano e 06 meses de pena privativa de liberdade a ser cumprida.

      No curso do livramento condicional, após 06 meses da obtenção do benefício, vem Gabriel a ser novamente condenado, definitivamente, pela prática de crime de roubo, que havia sido praticado antes mesmo do delito de porte de arma de fogo, mas cuja instrução foi prolongada.

      Diante da nova condenação, o magistrado competente revogou o livramento condicional concedido e determinou que Gabriel deve cumprir aquele 01 ano e 06 meses de pena restante quando da obtenção do livramento em relação ao crime de porte, além da nova sanção imposta em razão do roubo.

      Considerando a situação narrada, na condição de advogado(a) de Gabriel, responda aos itens a seguir.
    comando: Qual argumento deverá ser apresentado pela defesa de Gabriel para combater a decisão do magistrado? Justifique.
    gabarito: O argumento a ser apresentado pela defesa de Gabriel é que não poderiam ter sido desconsiderados os dias de livramento condicional como pena cumprida. De fato, Gabriel foi condenado, definitivamente, pela prática de crime no curso do livramento condicional, logo cabível a revogação do benefício. Trata-se, inclusive, de hipótese de revogação obrigatória. Ocorre que a condenação que justificou a revogação foi em razão da prática de delito anterior à obtenção do benefício, e não de novo crime praticado no curso do livramento. Dessa forma, as condições do livramento condicional vinham sendo regularmente cumpridas pelo apenado, de modo que os dias em que ficou em livramento deverão ser computados como pena cumprida e não desconsiderados. Assim, errou o magistrado ao afirmar que deveria Gabriel cumprir 01 ano e 06 meses de pena, desconsiderando os 06 meses cumpridos de livramento. Nos termos do aqui exposto estão as previsões dos Art. 86 e do Art. 88, ambos do Código Penal, além do Art. 141 da Lei 7.210/84.
    opcoes:
      correta: O argumento para combater a decisão é o de que o período em livramento condicional deveria ser considerado como pena cumprida, tendo em vista que o delito que justificou a revogação é anterior ao benefício, nos termos do Art. 88 do CP OU Art. 141 da Lei nº 7.210/84.
