  - id: 23-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Manoel conduzia sua bicicleta, levando em seu colo, sem qualquer observância às regras de segurança, seu filho de 02 anos de idade. Para tornar o passeio do filho mais divertido, Manoel pedalava em alta velocidade, quando, em determinado momento, perdeu o controle da bicicleta e caiu, vindo seu filho a bater a cabeça e falecer de imediato.

      Após ser instaurado procedimento para investigar os fatos, a perícia constata que, de fato, Manoel estava em alta velocidade e não havia qualquer segurança para o filho em seu colo. O Ministério Público oferece denúncia em face de Manoel, imputando-lhe a prática do crime previsto no Art. 121, §§ 3º e 4º, do Código Penal, já que a vítima era menor de 14 anos. Durante a instrução, todos os fatos são confirmados por diversos meios de prova.

      Considerando apenas as informações narradas, responda, na qualidade de advogado(a) de Manoel, aos itens a seguir.
    comando: A capitulação delitiva realizada pelo Ministério Público está integralmente correta? Justifique.
    gabarito: |-
      A capitulação delitiva realizada pelo Ministério Público não está integralmente correta, pois, em que pese exista prova da materialidade e indícios de autoria em relação ao crime de homicídio culposo, não poderia ter sido imputada a causa de aumento prevista no Art. 121, § 4º, do CP, tendo em vista que a idade da vítima somente é relevante, no momento de analisar tal causa de aumento, quando o homicídio é de natureza dolosa.

      Assim, deveria ser afastada a causa de aumento imputada.
    opcoes:
      correta: Não foi correta a capitulação delitiva do Ministério Público, pois em sendo o crime culposo, a idade da vítima não é relevante para imputação da causa de aumento do Art. 121, § 4º, do CP, OU pois a causa de aumento em razão de a vítima ser menor de 14 anos somente será aplicada ao crime de homicídio doloso.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
