# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "23"
introducoes:
  peca: "Roberta, de 20 anos, deixou o notebook carregando na sala do curso e foi à cantina. Na volta, tirou da tomada o notebook de uma colega, Cláudia, que estava no lugar do dela, e o levou para casa, acreditando ser o seu; o dela estava ao lado. No dia seguinte, antes de qualquer medida da polícia, devolveu o aparelho. Foi denunciada por furto simples, sem proposta de suspensão do processo, porque o Ministério Público disse que o furto não é de menor potencial ofensivo. Ré primária, confirmou os fatos e explicou o engano. Você a defende nos memoriais."
  q1: "José Barbosa, nascido em 11/3/1998, deu várias facadas em Daniel, por ciúmes, em 7/3/2016; Daniel morreu cinco dias depois. No dia seguinte às facadas, policiais viram pela janela uma faca suja de sangue na casa de José, vazia, entraram sem mandado e a apreenderam. Com base nessa prova, ele foi denunciado por homicídio."
  q2: "Gabriel, condenado por porte de arma de uso restrito, obteve livramento condicional quando faltava 1 ano e 6 meses de pena. Seis meses depois, foi condenado por um roubo que cometera antes do porte de arma. O juiz revogou o livramento e mandou cumprir o 1 ano e 6 meses inteiro, além da pena nova."
  q3: "Em 29/12/2011, Cláudio invadiu um dispositivo informático alheio para obter dados de um ator famoso. Em 2014, recebeu proposta de transação penal pelo crime de invasão de dispositivo informático, incluído no Código Penal pela Lei 12.737, de dezembro de 2012. Aceitou, mas deixou de cumprir as condições, e o Ministério Público ofereceu denúncia."
  q4: "Manoel pedalava em alta velocidade com o filho de 2 anos no colo, sem segurança, caiu, e o menino morreu. Foi denunciado por homicídio culposo com a causa de aumento de vítima menor de 14 anos."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["23-peca-1", "23-peca-4a", "23-peca-4c", "23-peca-11", "23-peca-11-1", "23-peca-11-2", "23-peca-11-3", "23-peca-11-4", "23-peca-11-5"]
perguntas:
  - id: 23-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: preliminar
    pergunta: "O Ministério Público não ofereceu a suspensão do processo porque o furto não é de menor potencial ofensivo. Que preliminar a defesa deve levantar?"
    tese: "A suspensão condicional do processo cabe (pena mínima de até 1 ano): a recusa deve ir ao Procurador-Geral, ou a instrução é nula"
    aceitos: [ [ "procurador-geral | procurador geral | orgao superior | art 28 | artigo 28" ], [ "nulidade | nula | nulos" ], [ "pena minima" ] ]
    artigos: [ "art. 89, Lei 9.099", "Súmula 696 STF" ]
    gabarito: "Preliminarmente, reconhecimento da nulidade dos atos da instrução OU requerimento de aplicação, por analogia, do art. 28 do CPP, diante do não oferecimento de proposta de suspensão condicional do processo, pois preenchidos os requisitos do Art. 89 da Lei 9099/95 OU pois irrelevante o fato do delito imputado não ser infração de menor potencial ofensivo."
    revisao: { status: revisado }
  - id: 23-peca-4b
    categoria: peca-detalhe
    parte: peca
    item: "4B"
    secao: merito
    pergunta: "Roberta levou o notebook achando que era o dela. Que tese leva à absolvição?"
    tese: "Erro de tipo, que exclui o dolo"
    aceitos: [ "erro de tipo" ]
    artigos: [ "art. 20, CP" ]
    gabarito: "Reconhecimento da ocorrência de erro de tipo, previsto no artigo 20 do Código Penal."
    revisao: { status: revisado }
  - id: 23-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Sendo favoráveis as circunstâncias judiciais, como deve ser fixada a pena-base de Roberta?"
    tese: "Pena-base no mínimo legal, porque as circunstâncias judiciais são favoráveis"
    aceitos: [ "minimo" ]
    artigos: [ "art. 59, CP" ]
    gabarito: "Subsidiariamente, aplicação de pena base no mínimo legal, já que as circunstâncias do Art. 59 são favoráveis."
    revisao: { status: revisado }
  - id: 23-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Roberta tinha 20 anos no fato. Que atenuante deve ser reconhecida?"
    tese: "Atenuante da menoridade relativa"
    aceitos: [ "menoridade | menor de 21" ]
    artigos: [ "art. 65, I, CP" ]
    gabarito: "Reconhecimento da atenuante da menoridade relativa, já que menor de 21 anos na data dos fatos, conforme Art. 65, inciso I, do Código Penal."
    revisao: { status: revisado }
  - id: 23-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Roberta confirmou os fatos no interrogatório. Que outra atenuante cabe?"
    tese: "Atenuante da confissão espontânea"
    aceitos: [ "confissao" ]
    artigos: [ "art. 65, III, d, CP" ]
    gabarito: "Reconhecimento da atenuação da confissão, nos termos do Art. 65, inciso III, alínea d, do CP."
    revisao: { status: revisado }
  - id: 23-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Roberta devolveu o notebook no dia seguinte, antes de qualquer medida da polícia. Que causa de diminuição de pena isso configura?"
    tese: "Arrependimento posterior, que diminui a pena"
    aceitos: [ "arrependimento posterior" ]
    artigos: [ "art. 16, CP" ]
    gabarito: "Reconhecimento da causa de diminuição do arrependimento posterior, tendo em vista que houve restituição da coisa subtraída, nos termos do Art. 16 do Código Penal."
    revisao: { status: revisado }
  - id: 23-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Em caso de condenação, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto"
    aceitos: [ "aberto" ]
    artigos: [ "art. 33, § 2º, c, CP" ]
    gabarito: "Aplicação do regime inicial aberto, nos termos do Art. 33, §2º, alínea c, do Código Penal."
    revisao: { status: revisado }
  - id: 23-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Além do regime, o que a defesa deve pedir quanto à espécie de pena?"
    tese: "Substituição da pena privativa de liberdade por restritivas de direitos"
    aceitos: [ "substitui*" ]
    artigos: [ "art. 44, CP" ]
    gabarito: "Substituição da pena privativa de liberdade por restritiva de direitos, já que preenchidos os requisitos do Art. 44 do Código Penal."
    revisao: { status: revisado }
  - id: 23-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento combate a prova da faca apreendida pelos policiais?"
    tese: "Ilicitude da apreensão: os policiais entraram na casa sem autorização, sem flagrante e sem ordem judicial"
    aceitos: [ "ilicit* | ilegal* | inadmiss*" ]
    artigos: [ "art. 5, XI, CRFB", "art. 157, CPP" ]
    gabarito: "A defesa deveria alegar que a prova obtida a partir da apreensão da faca é ilícita, não podendo ser valorada no momento da sentença. Estabelece o Art. 5º, inciso XI, da CRFB/88 que a casa é asilo inviolável, não podendo nela ninguém ingressar sem consentimento do morador. A própria Constituição, todavia, traz exceções a esta regra, como na hipótese de flagrante delito ou mediante ordem judicial, durante o dia. Não havia, no caso apresentado, situação de flagrante delito, já que a simples posse de faca não configura crime e, em relação ao crime/ato infracional praticado no dia anterior, não havia situação de flagrância, pois ausentes os requisitos do Art. 302 do CPP. Ademais, não houve autorização do morador e nem existia ordem judicial de busca e apreensão, já que os policiais decidiram ingressar no imóvel porque viram a arma suja de sangue através da janela aberta."
    revisao: { status: revisado }
  - id: 23-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "José tinha 17 anos no dia das facadas e 18 quando Daniel morreu. Por que ele não pode ser processado por homicídio?"
    tese: "Inimputabilidade no momento da ação: vale a teoria da atividade, e o fato é ato infracional"
    aceitos: [ [ "inimputav* | menor de 18 | ato infracional" ], [ "atividade" ] ]
    artigos: [ "art. 4, CP", "art. 27, CP" ]
    gabarito: "Sim, existe, tendo em vista que José Barbosa não poderia ser denunciado pela prática de crime de homicídio qualificado, já que era inimputável na data dos fatos. O Código Penal, para definir o momento do crime, adota a Teoria da Atividade, prevendo o Art. 4º que se considerado praticado o crime no momento da ação ou omissão, ainda que em outro seja produzido o resultado. Dessa forma, o crime foi praticado no dia 07.03.2016, quando José Barbosa tinha 17 anos. Estabelece o Art. 27 do CP que será inimputável o menor de 18 anos. O fato de a consumação do delito só ter ocorrido após a maioridade penal de José Barbosa é irrelevante para o caso concreto, já que outro foi o momento da ação."
    revisao: { status: revisado }
  - id: 23-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que recurso cabe contra a revogação do livramento condicional?"
    tese: "Agravo em execução, que admite juízo de retratação"
    aceitos: [ "agravo" ]
    artigos: [ "art. 197, LEP" ]
    gabarito: "Narra o enunciado que Gabriel cumpria pena privativa de liberdade pela prática de crime de porte de arma de fogo, quando obteve livramento condicional. No curso do livramento condicional, todavia, vem a ser condenado pela prática de crime de roubo, tendo o magistrado da execução decidido pela revogação do benefício e também por desconsiderar o período de pena cumprido em livramento. Da decisão proferida pelo juízo da execução cabe Agravo em Execução, na forma do Art. 197 da Lei de Execuções Penais, com prazo de interposição de 05 dias. Não há previsão expressa em lei sobre o procedimento a ser adotado no recurso de agravo, de modo que pacificou a doutrina e a jurisprudência que o processamento a ser adotado é semelhante ao do recurso em sentido estrito.\n\nDiante disso, cabível o juízo de retratação pelo magistrado competente para execução."
    revisao: { status: revisado }
  - id: 23-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "O roubo que levou à revogação é anterior ao livramento. Como deve ser tratado o tempo que Gabriel passou em livramento?"
    tese: "O tempo em livramento conta como pena cumprida, porque o crime é anterior ao benefício"
    aceitos: [ "pena cumprida | cumprimento de pena | computa* | desconta* | considerado como cumprido | cumprida" ]
    artigos: [ "art. 88, CP", "art. 141, LEP" ]
    gabarito: "O argumento a ser apresentado pela defesa de Gabriel é que não poderiam ter sido desconsiderados os dias de livramento condicional como pena cumprida. De fato, Gabriel foi condenado, definitivamente, pela prática de crime no curso do livramento condicional, logo cabível a revogação do benefício. Trata-se, inclusive, de hipótese de revogação obrigatória. Ocorre que a condenação que justificou a revogação foi em razão da prática de delito anterior à obtenção do benefício, e não de novo crime praticado no curso do livramento. Dessa forma, as condições do livramento condicional vinham sendo regularmente cumpridas pelo apenado, de modo que os dias em que ficou em livramento deverão ser computados como pena cumprida e não desconsiderados. Assim, errou o magistrado ao afirmar que deveria Gabriel cumprir 01 ano e 06 meses de pena, desconsiderando os 06 meses cumpridos de livramento. Nos termos do aqui exposto estão as previsões dos Art. 86 e do Art. 88, ambos do Código Penal, além do Art. 141 da Lei 7.210/84."
    revisao: { status: revisado }
  - id: 23-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Segundo o STF, é possível revogar a transação penal descumprida e oferecer a denúncia?"
    tese: "A homologação da transação penal não faz coisa julgada material: descumprida, ela pode ser revogada e a denúncia oferecida"
    aceitos: [ "coisa julgada" ]
    artigos: [ "Súmula Vinculante 35" ]
    gabarito: "Sim, de acordo com a jurisprudência do Supremo Tribunal Federal, é possível a revogação do benefício da transação penal, com posterior oferecimento de denúncia pelo Ministério Público, caso as condições impostas venham a ser descumpridas, nos termos do Enunciado 35 da Súmula Vinculante do STF. Durante muito tempo se controverteu sobre as consequências do descumprimento das condições impostas quando da transação penal, alguns defendendo que apenas seria cabível a execução das mesmas, pois, uma vez homologada, haveria imediata extinção da punibilidade, enquanto outros admitiam a revogação do benefício, que estaria condicionado ao cumprimento das imposições. O STF, diante da controvérsia, pacificou o entendimento, por meio de enunciado vinculante, entendendo que a decisão homologatória de transação penal, nos termos do Art. 76 da Lei nº 9.099/95, não faz coisa julgada material, de modo que, descumpridas suas cláusulas, a situação anterior deve ser retomada, inclusive possibilitando ao Ministério Público o oferecimento de denúncia."
    revisao: { status: revisado }
  - id: 23-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Cláudio pode responder por invasão de dispositivo informático pelo fato de 2011?"
    tese: "Irretroatividade da lei penal mais grave: o crime de invasão de dispositivo informático foi criado depois do fato"
    aceitos: [ "nao retroage | irretroativ* | anterioridade | posterior ao fato | lei posterior | nao existia" ]
    artigos: [ "art. 5, XL, CRFB", "art. 1, CP" ]
    gabarito: "Embora, literalmente, os fatos praticados por Cláudio se adequem à figura típica descrita no Art. 154-A do Código Penal, não é possível a responsabilização penal do autor pelo crime em questão, tendo em vista que os fatos ocorreram antes da entrada em vigor da Lei nº 12.737/12, de modo que não pode uma lei mais grave ao acusado retroagir para prejudicá-lo. O princípio da legalidade impõe que não é possível a punição de qualquer pessoa por fato que a lei não define como crime no momento de sua ocorrência. Como consequência desse princípio, estabeleceu o Art. 5º, inciso XL, da CRFB/88 que a lei não retroagirá, salvo para favorecer o réu. No mesmo sentido as previsões do Art. 1º do Código Penal. Assim, diante da irretroatividade da lei penal desfavorável, considerando que os fatos ocorreram em 29/12/2011 e a Lei que introduziu o Art. 154-A no Código Penal somente foi editada no ano de 2012, incabível a punição de Cláudio pelo delito em questão, ainda que a denúncia seja em momento posterior."
    revisao: { status: revisado }
  - id: 23-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "A causa de aumento por ser a vítima menor de 14 anos vale no homicídio culposo?"
    tese: "A causa de aumento pela vítima menor de 14 anos vale só no doloso, não no homicídio culposo"
    aceitos: [ "so no doloso | apenas no doloso | somente no doloso | so ao doloso | apenas ao doloso | somente ao doloso | nao se aplica ao culposo" ]
    artigos: [ "art. 121, § 4º, CP" ]
    gabarito: "A capitulação delitiva realizada pelo Ministério Público não está integralmente correta, pois, em que pese exista prova da materialidade e indícios de autoria em relação ao crime de homicídio culposo, não poderia ter sido imputada a causa de aumento prevista no Art. 121, § 4º, do CP, tendo em vista que a idade da vítima somente é relevante, no momento de analisar tal causa de aumento, quando o homicídio é de natureza dolosa.\n\nAssim, deveria ser afastada a causa de aumento imputada."
    revisao: { status: revisado }
  - id: 23-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que argumento evita a punição de Manoel pelo homicídio culposo?"
    tese: "Perdão judicial"
    aceitos: [ "perdao judicial" ]
    artigos: [ "art. 121, § 5º, CP" ]
    gabarito: "O argumento a ser apresentado pela defesa técnica é da aplicação do perdão judicial, devendo o juiz deixar de aplicar a pena. De acordo com o Art. 121, § 5º, do CP, o juiz poderá deixar de aplicar a pena se as consequências da infração atingirem o próprio agente de forma tão grave que a sanção se torne desnecessária. De fato, pelas circunstâncias narradas no enunciado, houve crime de homicídio culposo, já que Manoel conduzia sua bicicleta em alta velocidade, com o filho de 02 anos no colo, sem observância do dever objetivo de cuidado. Todavia, seu comportamento causou a morte de seu próprio filho, o que, por si só, demonstra que as consequências da infração já foram graves o suficiente para o autor do fato, tornando a sanção penal efetivamente desnecessária."
    revisao: { status: revisado }
