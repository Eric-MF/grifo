  - id: 23-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      No dia 29 de dezembro de 2011, Cláudio, 30 anos, profissional do ramo de informática, invadiu dispositivo informático alheio, mediante violação indevida de mecanismo de segurança, com o fim de obter informações pessoais de famoso ator da televisão brasileira, sem autorização do titular do dispositivo.

      Após longa investigação e representação da vítima, o fato e a autoria de Cláudio foram identificados no ano de 2014, vindo o autor a ser indiciado e, posteriormente, oferecida pelo Ministério Público proposta de transação penal em razão da prática do crime do Art. 154-A do Código Penal, dispositivo este incluído pela Lei nº 12737/12.

      Cláudio aceitou a proposta de transação penal, mas, em julho de 2015, interrompeu o cumprimento das condições impostas.

      Temeroso em razão de sua conduta, Cláudio procura seu advogado, informando que não justificou o descumprimento e, diante disso, o Ministério Público ofereceu denúncia por aquele delito, tendo o juiz competente recebido a inicial acusatória em agosto de 2015.

      Considerando apenas as informações narradas, esclareça, na condição de advogado(a) prestando consultoria jurídica para Cláudio, os seguintes questionamentos.
    comando: Os fatos praticados por Cláudio, de fato, permitem sua responsabilização penal pelo crime do Art. 154-A do Código Penal? Justifique.
    gabarito: Embora, literalmente, os fatos praticados por Cláudio se adequem à figura típica descrita no Art. 154-A do Código Penal, não é possível a responsabilização penal do autor pelo crime em questão, tendo em vista que os fatos ocorreram antes da entrada em vigor da Lei nº 12.737/12, de modo que não pode uma lei mais grave ao acusado retroagir para prejudicá-lo. O princípio da legalidade impõe que não é possível a punição de qualquer pessoa por fato que a lei não define como crime no momento de sua ocorrência. Como consequência desse princípio, estabeleceu o Art. 5º, inciso XL, da CRFB/88 que a lei não retroagirá, salvo para favorecer o réu. No mesmo sentido as previsões do Art. 1º do Código Penal. Assim, diante da irretroatividade da lei penal desfavorável, considerando que os fatos ocorreram em 29/12/2011 e a Lei que introduziu o Art. 154-A no Código Penal somente foi editada no ano de 2012, incabível a punição de Cláudio pelo delito em questão, ainda que a denúncia seja em momento posterior.
    opcoes:
      correta: Não é possível a responsabilização penal de Cláudio pelo crime do Art. 154-A do Código Penal, tendo em vista que a lei posterior que de qualquer forma prejudique o acusado não pode retroagir para atingir situação pretérita OU tendo em vista que a lei que tipificou a conduta é posterior à data dos fatos, com base no Art. 5º, inciso XL, da CRFB/88 OU no Art. 1º do Código Penal.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
