  - id: 23-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      No dia 29 de dezembro de 2011, Cláudio, 30 anos, profissional do ramo de informática, invadiu dispositivo informático alheio, mediante violação indevida de mecanismo de segurança, com o fim de obter informações pessoais de famoso ator da televisão brasileira, sem autorização do titular do dispositivo.

      Após longa investigação e representação da vítima, o fato e a autoria de Cláudio foram identificados no ano de 2014, vindo o autor a ser indiciado e, posteriormente, oferecida pelo Ministério Público proposta de transação penal em razão da prática do crime do Art. 154-A do Código Penal, dispositivo este incluído pela Lei nº 12737/12.

      Cláudio aceitou a proposta de transação penal, mas, em julho de 2015, interrompeu o cumprimento das condições impostas.

      Temeroso em razão de sua conduta, Cláudio procura seu advogado, informando que não justificou o descumprimento e, diante disso, o Ministério Público ofereceu denúncia por aquele delito, tendo o juiz competente recebido a inicial acusatória em agosto de 2015.

      Considerando apenas as informações narradas, esclareça, na condição de advogado(a) prestando consultoria jurídica para Cláudio, os seguintes questionamentos.
    comando: De acordo com a jurisprudência do Supremo Tribunal Federal, é possível a revogação do benefício da transação penal pelo descumprimento das condições impostas, com posterior oferecimento de denúncia? Justifique.
    gabarito: Sim, de acordo com a jurisprudência do Supremo Tribunal Federal, é possível a revogação do benefício da transação penal, com posterior oferecimento de denúncia pelo Ministério Público, caso as condições impostas venham a ser descumpridas, nos termos do Enunciado 35 da Súmula Vinculante do STF. Durante muito tempo se controverteu sobre as consequências do descumprimento das condições impostas quando da transação penal, alguns defendendo que apenas seria cabível a execução das mesmas, pois, uma vez homologada, haveria imediata extinção da punibilidade, enquanto outros admitiam a revogação do benefício, que estaria condicionado ao cumprimento das imposições. O STF, diante da controvérsia, pacificou o entendimento, por meio de enunciado vinculante, entendendo que a decisão homologatória de transação penal, nos termos do Art. 76 da Lei nº 9.099/95, não faz coisa julgada material, de modo que, descumpridas suas cláusulas, a situação anterior deve ser retomada, inclusive possibilitando ao Ministério Público o oferecimento de denúncia.
    opcoes:
      correta: Sim, é possível a revogação do benefício, nos termos da Súmula Vinculante 35 do STF OU Sim, pois a decisão que homologa transação penal não faz coisa julgada material
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
