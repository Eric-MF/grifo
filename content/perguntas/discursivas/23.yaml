  - id: 23-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      José Barbosa, nascido em 11/03/1998, caminhava para casa após sair da faculdade, às 11h da manhã, no dia 07/03/2016, quando se deparou com Daniel, ex-namorado de sua atual companheira, conversando com esta. Em razão de ciúmes, retirou a faca que trazia na mochila e aplicou numerosas facadas no peito de Daniel, com a intenção de matá-lo. Daniel recebeu pronto atendimento médico, foi encaminhado para um hospital de Niterói, mas faleceu 05 dias após os golpes de faca.

      Já no dia 08/03/2016, policiais militares, informados sobre o fato ocorrido no dia anterior, comparecem à residência de José Barbosa, já que um dos agentes da lei era seu vizinho. Apesar de não ter ninguém em casa, a janela estava aberta, e os policiais puderam ver seu interior, verificando que havia uma faca suja de sangue escondida junto ao sofá. Diante disso, para evitar que José Barbosa desaparecesse com a arma utilizada, ingressaram no imóvel e apreenderam a arma branca, que foi devidamente apresentada pela autoridade policial.

      Com base na prova produzida a partir da apreensão da faca, o Ministério Público oferece denúncia em face de José Barbosa, imputando-lhe a prática do crime de homicídio consumado.

      Considerando a situação narrada, na condição de advogado(a) de José Barbosa, responda aos itens a seguir.
    comando: Qual argumento a ser apresentado pela defesa técnica do denunciado para combater a prova decorrente da apreensão da faca? Justifique.
    gabarito: A defesa deveria alegar que a prova obtida a partir da apreensão da faca é ilícita, não podendo ser valorada no momento da sentença. Estabelece o Art. 5º, inciso XI, da CRFB/88 que a casa é asilo inviolável, não podendo nela ninguém ingressar sem consentimento do morador. A própria Constituição, todavia, traz exceções a esta regra, como na hipótese de flagrante delito ou mediante ordem judicial, durante o dia. Não havia, no caso apresentado, situação de flagrante delito, já que a simples posse de faca não configura crime e, em relação ao crime/ato infracional praticado no dia anterior, não havia situação de flagrância, pois ausentes os requisitos do Art. 302 do CPP. Ademais, não houve autorização do morador e nem existia ordem judicial de busca e apreensão, já que os policiais decidiram ingressar no imóvel porque viram a arma suja de sangue através da janela aberta.
    opcoes:
      correta: O meio de obtenção da prova quando da apreensão da faca foi ilícito, tendo em vista que houve ingresso na residência de José Barbosa sem autorização do morador, flagrante delito ou ordem judicial, nos termos do art. 5º, XI, CRFB OU 157 do CPP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
