    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Afastamento da nulidade requerida, considerando que não foi arguida em momento adequado.
    opcoes:
      correta: Afastamento da nulidade requerida, considerando que não foi arguida em momento adequado.
      erradas:
        - "No mérito: manter a pena-base no mínimo legal, pois a existência de ações penais em curso sem trânsito em julgado ou inquéritos policiais não justificam o reconhecimento de circunstâncias judiciais prejudiciais, sob pena de violação do princípio da presunção de inocência (art. 5º, inciso LVII, da CF/88) OU na forma do Enunciado 444 da Súmula do STJ. Obs.: A mera indicação do dispositivo legal ou do número de súmula não pontua."
        - Da tese do afastamento da agravante da embriaguez preordenada.
        - Arguição de que a conduta narrada evidentemente não constituir crime em razão da atipicidade, diante da aplicação do princípio da bagatela/insignificância
        - Subsidiariamente, afastar a qualificadora pois não há prova nos autos da idade da vítima, nos termos do Art. 213, §1º do CP
        - Excludente de culpabilidade, em razão da inimputabilidade.
