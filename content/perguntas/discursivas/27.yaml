    caso: |-
      João, 22 anos, no dia 04 de maio de 2018, caminhava com o adolescente Marcelo, cada um deles trazendo consigo uma mochila nas costas. Realizada uma abordagem por policiais, foi constatado que, no interior da mochila de cada um, havia uma certa quantidade de drogas, razão pela qual elas foram, de imediato, encaminhadas para a Delegacia.

      Realizado laudo de exame de material entorpecente, constatou-se que João trazia 25 g de cocaína, acondicionados em 35 pinos plásticos, enquanto, na mochila do adolescente, foram encontrados 30 g de cocaína, quantidade essa distribuída em 50 pinos. Após a oitiva das testemunhas em sede policial, da juntada do laudo e da oitiva do adolescente e de João, que permaneceram em silêncio com relação aos fatos, foram lavrados o auto de prisão em flagrante em desfavor do imputável e o auto de apreensão em desfavor do adolescente. Toda a documentação foi encaminhada aos Promotores de Justiça com atribuição. O Promotor de Justiça, junto à 1ª Vara Criminal de Maceió/AL, órgão competente, ofereceu denúncia em face de João, imputando-lhe a prática dos crimes previstos nos artigos 33 e 35, ambos com a causa de aumento do Art. 40, inciso VI, todos da Lei nº 11.343/06. Foi concedida a liberdade provisória ao denunciado, aplicando-se as medidas cautelares alternativas.

      Após a notificação, a apresentação de resposta prévia e o recebimento da denúncia e da citação, foi designada a audiência de instrução e julgamento, ocasião em que foram ouvidas as testemunhas de acusação. Estas confirmaram a apreensão de drogas em poder de Marcelo e João, bem como que eles estariam juntos, esclarecendo que não se conheciam anteriormente e nem tinham informações pretéritas sobre o adolescente e o denunciado. O adolescente, ouvido, disse que conhecera João no dia anterior ao de sua apreensão e que nunca o tinha visto antes vendendo drogas. Em seguida à oitiva das testemunhas de acusação e defesa, foi realizado o interrogatório do acusado, sendo que nenhuma das partes questionou o momento em que este foi realizado. Na ocasião, João confirmou que o material que ele e Marcelo traziam seria destinado à ilícita comercialização. Ele ainda esclareceu que conhecera o adolescente no dia anterior, que era a primeira vez que venderia drogas e que tinha a intenção de praticar o ato junto com o adolescente somente aquela vez, com o objetivo de conseguir dinheiro para comprar uma moto.

      Foi acostado o laudo de exame definitivo de material entorpecente confirmando o laudo preliminar e a Folha de Antecedentes Criminais de João, onde constava uma anotação referente a crime de furto, ainda pendente de julgamento.

      O juiz, após a devida manifestação das partes, proferiu sentença julgando parcialmente procedente a pretensão punitiva estatal. Em um primeiro momento, absolveu o acusado do crime de associação para o tráfico por insuficiência probatória. Em seguida, condenou o réu pela prática do crime de tráfico de drogas, ressaltando que o réu confirmou a destinação das drogas à ilícita comercialização. No momento de aplicar a pena, fixou a pena-base no mínimo legal, reconhecendo a existência da atenuante da confissão espontânea; aumentou a pena em razão da causa de aumento do Art. 40, inciso VI, da Lei nº 11.343/06 e aplicou a causa de diminuição de pena do Art. 33, § 4º, da Lei nº 11.343/06, restando a pena final em 1 ano, 11 meses e 10 dias de reclusão e 195 dias multa, a ser cumprida em regime inicial aberto. Entendeu o magistrado pela substituição da pena privativa de liberdade por duas restritivas de direitos.

      O Ministério Público, ao ser intimado pessoalmente em 22 de outubro de 2018, apresentou o recurso cabível, em 25 de outubro de 2018, acompanhado das respectivas razões recursais, requerendo:

      a) nulidade da instrução, porque o interrogatório não foi o primeiro ato, como prevê a Lei nº 11.343/06;

      b) condenação do réu pelo crime de associação para o tráfico, já que ele estaria agindo em comunhão de ações e desígnios com o adolescente no momento da prisão, e o Art. 35 da Lei nº 11.343/06 fala em “reiteradamente ou não”;

      c) aumento da pena-base em relação ao crime de tráfico diante das consequências graves que vem causando para a saúde pública e a sociedade brasileira;

      d) afastamento da atenuante da confissão, já que ela teria sido parcial;

      e) afastamento da causa de diminuição do Art. 33, § 4º, da Lei nº 11.343/06, independentemente da condenação pelo crime do Art. 35 da Lei nº 11.343/06, considerando que o réu seria portador de maus antecedentes, já que responde a ação penal em que se imputa a prática do crime de furto;

      f) aplicação do regime inicial fechado, diante da natureza hedionda do delito de tráfico;

      g) afastamento da substituição da pena privativa de liberdade por restritiva de direitos, diante da vedação legal do Art. 33, § 4º, da Lei nº 11.343/06.

      Já o acusado e a defesa técnica, intimados do teor da sentença, mantiveram-se inertes, não demonstrando interesse em questioná-la.

      O magistrado, então, recebeu o recurso do Ministério Público e intimou, no dia 05 de novembro de 2018 (segunda-feira), sendo terça-feira dia útil em todo o país, você, advogado(a) de João, a apresentar a medida cabível.

      Com base nas informações expostas na situação hipotética e naquelas que podem ser inferidas do caso concreto, redija a peça cabível, excluídas as possibilidades de habeas corpus e embargos de declaração, no último dia do prazo, sustentando todas as teses jurídicas pertinentes. (Valor: 5,00)

      Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples menção ou transcrição do dispositivo legal não confere pontuação.
    comando: Que pedido deve ser formulado na peça?
    gabarito: Não provimento do recurso OU manutenção da sentença.
    opcoes:
      correta: Não provimento do recurso OU manutenção da sentença.
      erradas:
        - Reconhecimento da preliminar e extinção da punibilidade; impronúncia, nos termos do art. 414 do CPP (admite-se absolvição sumária, art. 415).
        - Conhecimento e provimento do recurso, com a desclassificação para homicídio culposo na direção de veículo automotor.
        - "Pedidos: absolvição do crime de furto, na forma do artigo 386, III, CPP;subsidiariamente, aplicação da pena base no mínimo legal;reconhecimento das atenuantes da confissão espontânea e da menoridade relativa;reconhecimento da forma privilegiada do furto;substituição da pena privativa de liberdade por restritiva de direitos;fixação do regime aberto; sursis da pena."
        - Requerimento de reconhecimento da prescrição da pretensão punitiva do Estado, com consequente extinção da punibilidade do agente, nos termos do Art. 107, inciso IV, do CP.
        - Pedido de reconhecimento do crime impossível, ante a absoluta ineficácia do meio empregado, nos termos do Art. 17 do CP.
    revisao: *a1
  - id: 27-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Rafael subtraiu, mediante grave ameaça, coisa alheia móvel de Joana juntamente com outro indivíduo não identificado e com restrição da liberdade da vítima. Foi, então, denunciado pela prática do crime previsto no Art. 157, § 2º, incisos II e V, do Código Penal.

      Durante a instrução, quando da oitiva da vítima, esta mencionou que todos os fatos foram presenciados, de longe, por sua amiga Carla, não tendo ela contado em momento anterior para preservar a amiga. Diante dessa menção, o advogado de Rafael requereu ao juízo a oitiva da testemunha Carla, mas o magistrado indeferiu o pedido sob o argumento de que, na resposta à acusação, foram arroladas testemunhas no número máximo permitido pela lei, de modo que não poderia a defesa acrescentar mais uma, apesar de reconhecer a conveniência da oitiva.

      O advogado registrou seu inconformismo, foram ouvidas as testemunhas de defesa arroladas e foi realizado o interrogatório, em que o acusado negou o fato. Rafael foi condenado ao cumprimento da pena de 05 anos e 06 meses de reclusão, reconhecendo o magistrado o aumento de 3/8 na terceira fase de aplicação da pena exclusivamente em razão da existência de duas causas de aumento, não tendo a pena-base e a intermediária se afastado do mínimo legal.

      Considerando as informações narradas, responda, na condição de advogado(a) de Rafael, na ocasião da apresentação de recurso de apelação:
    comando: qual argumento de direito processual poderia ser alegado em busca de desconstituir a sentença condenatória? Justifique.
    gabarito: |-
      O argumento de direito processual é que houve nulidade da sentença em razão da existência de cerceamento de defesa, uma vez que a testemunha Carla poderia ter sido ouvida pelo magistrado. Primeiramente ressalta-se que Carla é classificada pela doutrina como testemunha referida, tendo em vista que somente se teve conhecimento da mesma e de que esta presenciou os fatos quando da oitiva da vítima em juízo. O Art. 209 do CPP menciona a possibilidade de oitiva das testemunhas referidas. Ademais, o Art. 401, § 1º do CPP estabelece que as testemunhas referidas, assim como as que não prestem compromisso, não serão computadas no número máximo de 08 testemunhas a serem ouvidas. Dessa forma, a decisão do magistrado, que reconheceu a conveniência da oitiva, mas indeferiu apenas por já ter atingido a defesa o limite máximo de testemunhas, foi equivocada e gerou um cerceamento no exercício do direito de defesa, precisando ser ressaltado que o advogado manifestou de imediato seu inconformismo com a decisão.

      A alegação em abstrato no sentido de que o magistrado poderia ouvir testemunhas para além das arroladas não foi considerada suficiente pela Banca, tendo em vista que não combate o argumento do juiz no sentido de que as testemunhas referidas estariam abrangidas pelo limite máximo de testemunhas estabelecido no procedimento comum ordinário.
    opcoes:
      correta: Houve cerceamento de defesa OU violação ao princípio do contraditório ou da ampla defesa, tendo em vista que as testemunhas referidas não são computadas no número máximo de testemunhas a serem ouvidas, nos termos do Art. 401, § 1º, do CPP OU Art. 209 do CPP OU Art. 5º, LV, CRFB.
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - "A condição jurídica de João se alteraria, na medida em que o resultado de lesões corporais de natureza grave consuma o crime de instigação, auxílio e induzimento ao suicídio, devendo João responder pelo crime previsto no artigo 122 do CP da forma consumada. Obs.1: respostas incompletas não são pontuadas. Obs.2: a mera indicação da sanção penal não é pontuada. Obs.3: a mera transcrição do artigo não é pontuada."
        - Não, pois viola o princípio da vedação da reformatio in pejus, tendo em vista que geraria prejuízo na aplicação do regime OU na prescrição OU na execução da pena
        - O argumento é que, diante da parcial procedência do pedido, deveria ter sido analisada a possibilidade de oferecimento de proposta de suspensão condicional do processo, nos termos da Súmula 337 do STJ OU art. 89 da Lei 9.099/95.
        - A condenação anterior à pena de multa não impede a concessão da suspensão condicional da pena, de acordo com o Art. 77, § 1º, do CP.
    revisao: *a1
  - id: 27-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Rafael subtraiu, mediante grave ameaça, coisa alheia móvel de Joana juntamente com outro indivíduo não identificado e com restrição da liberdade da vítima. Foi, então, denunciado pela prática do crime previsto no Art. 157, § 2º, incisos II e V, do Código Penal.

      Durante a instrução, quando da oitiva da vítima, esta mencionou que todos os fatos foram presenciados, de longe, por sua amiga Carla, não tendo ela contado em momento anterior para preservar a amiga. Diante dessa menção, o advogado de Rafael requereu ao juízo a oitiva da testemunha Carla, mas o magistrado indeferiu o pedido sob o argumento de que, na resposta à acusação, foram arroladas testemunhas no número máximo permitido pela lei, de modo que não poderia a defesa acrescentar mais uma, apesar de reconhecer a conveniência da oitiva.

      O advogado registrou seu inconformismo, foram ouvidas as testemunhas de defesa arroladas e foi realizado o interrogatório, em que o acusado negou o fato. Rafael foi condenado ao cumprimento da pena de 05 anos e 06 meses de reclusão, reconhecendo o magistrado o aumento de 3/8 na terceira fase de aplicação da pena exclusivamente em razão da existência de duas causas de aumento, não tendo a pena-base e a intermediária se afastado do mínimo legal.

      Considerando as informações narradas, responda, na condição de advogado(a) de Rafael, na ocasião da apresentação de recurso de apelação:
    comando: qual argumento de direito material deverá ser apresentado em busca de redução da sanção penal aplicada? Justifique.
    gabarito: |-
      O argumento de direito material em busca da redução da sanção aplicada é o de que o aumento realizado na terceira fase de aplicação da pena deveria ser do mínimo legal, ou seja, de 1/3, uma vez que não foi apresentada fundamentação razoável para aumento acima do mínimo. Certo é que a mera indicação do número de majorantes – fundamento este exclusivo utilizado pelo magistrado – é considerada insuficiente para justificar o aumento acima do mínimo, nos termos da Súmula 443 do Superior Tribunal de Justiça. Assim, diante da ausência de fundamentação para o aumento de 3/8, o aumento deveria ser da fração mínima de 1/3.

      Não será considerado suficiente pela Banca a afirmativa de não aplicação das causas de aumento pelo fato de o coautor não ser identificado.
    opcoes:
      correta: O número de majorantes não é fundamento adequado para aplicação da causa de aumento de pena acima do mínimo legal, nos termos da Súmula 443 do STJ.
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - Joana não cometeu crime algum, pois não houve conduta de sua parte.
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - Em preliminar de defesa, deve ser alegada a extinção de punibilidade pela decadência, tendo em vista que Paulo deixou de oferecer representação no prazo de 6 meses, conhecendo a autoria desde a data do fato, conforme estabelecido no Art. 38 do CPP c/c. o Art. 107, inciso IV, do CP.
    revisao: *a1
  - id: 27-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Em cumprimento de mandado de busca e apreensão, o oficial de justiça Jorge compareceu ao local de trabalho de Lucas, sendo encontradas, no interior do imóvel, duas armas de fogo de calibre .38, calibre esse considerado de uso permitido, devidamente municiadas, ambas com numeração suprimida. Em razão disso, Lucas foi preso em flagrante e denunciado pela prática de dois crimes previstos no Art. 16, caput, da Lei 10.826/2003, em concurso material, sendo narrado que “Lucas, de forma livre e consciente, guardava, em seu local de trabalho, duas armas de fogo de calibre restrito, devidamente municiadas”.

      Após a instrução, em que os fatos foram confirmados, foi juntado o laudo confirmando o calibre .38 das armas de fogo, a capacidade de efetuar disparos, bem como que ambas tinham a numeração suprimida. As partes apresentaram alegações finais, e o magistrado, em sentença, considerando o teor do laudo, condenou Lucas pela prática de dois crimes previstos no Art. 16, parágrafo único, inciso IV, da Lei nº 10.826/2003, em concurso formal.

      Intimada a defesa técnica da sentença condenatória, responda, na condição de advogado(a) de Lucas, aos itens a seguir.
    comando: Qual o argumento de direito processual a ser apresentado em busca da desconstituição da sentença condenatória? Justifique.
    gabarito: |-
      O argumento de direito processual a ser apresentado é o de que houve violação ao princípio da correlação, o que gera a nulidade da sentença por violação ao princípio da ampla defesa e ao princípio do contraditório. Isso porque a denúncia narrou que Lucas guardava, em seu local de trabalho, duas armas de fogo de calibre restrito.

      Sem que houvesse aditamento da denúncia, o magistrado condenou o réu pela prática de dois crimes de posse de arma de fogo de numeração suprimida, previsto no Art. 16, parágrafo único, inciso IV, da Lei 10.826/03. Apesar do crime imputado na denúncia e o reconhecido na sentença estarem previsto no mesmo dispositivo legal, eles não se confundem e a narrativa dos fatos é diferente. O réu somente se defendeu sobre as armas apreendidas como sendo de uso restrito, não podendo, então, o magistrado modificar os fatos para dar nova capitulação jurídica, nos termos do Art. 384 do CPP. Se não houvesse alteração dos fatos, poderia o juiz aplicar o Art. 383 do CPP, mas não foi isso que ocorreu na hipótese narrada. Dessa forma, deve ser reconhecida a nulidade da sentença.
    opcoes:
      correta: Houve violação ao princípio da correlação OU não houve aditamento dos fatos narrados na denúncia, não podendo o magistrado alterá-los, nos termos do Art. 384 do CPP, o que representa violação ao princípio da ampla defesa OU contraditório
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - "A condição jurídica de João se alteraria, na medida em que o resultado de lesões corporais de natureza grave consuma o crime de instigação, auxílio e induzimento ao suicídio, devendo João responder pelo crime previsto no artigo 122 do CP da forma consumada. Obs.1: respostas incompletas não são pontuadas. Obs.2: a mera indicação da sanção penal não é pontuada. Obs.3: a mera transcrição do artigo não é pontuada."
        - Não, pois viola o princípio da vedação da reformatio in pejus, tendo em vista que geraria prejuízo na aplicação do regime OU na prescrição OU na execução da pena
        - O argumento é que, diante da parcial procedência do pedido, deveria ter sido analisada a possibilidade de oferecimento de proposta de suspensão condicional do processo, nos termos da Súmula 337 do STJ OU art. 89 da Lei 9.099/95.
        - A condenação anterior à pena de multa não impede a concessão da suspensão condicional da pena, de acordo com o Art. 77, § 1º, do CP.
