# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "27"
introducoes:
  peca: "João, de 22 anos, foi preso andando com o adolescente Marcelo, que conhecera no dia anterior; cada um levava cocaína em pinos na mochila. João disse que venderia a droga com Marcelo só daquela vez, para comprar uma moto. Foi denunciado por tráfico e associação para o tráfico, com aumento por envolver adolescente. O interrogatório foi feito depois das testemunhas, e ninguém se opôs a essa ordem. Na folha de antecedentes havia só um processo por furto, ainda sem julgamento. O juiz o absolveu da associação e o condenou por tráfico, apoiado no que ele confessou: pena-base sem aumento, a atenuante da confissão, a causa de aumento e a redução do tráfico privilegiado, num total de 1 ano, 11 meses e 10 dias no regime aberto, substituídos por duas restritivas de direitos. O Ministério Público apelou pedindo a nulidade, porque o interrogatório não foi o primeiro ato, como diz a Lei de Drogas; a condenação pela associação; o aumento da pena-base pelos danos do tráfico à saúde pública; o afastamento da confissão, que seria parcial; o afastamento do tráfico privilegiado, por maus antecedentes; o regime fechado, por ser crime hediondo; e o fim da substituição, por vedação legal. Você foi intimado para responder ao recurso."
  q1: "Rafael foi denunciado por roubo com concurso de agentes e restrição da liberdade da vítima. Ouvida na instrução, a vítima disse que a amiga Carla viu tudo de longe. A defesa pediu que Carla fosse ouvida, mas o juiz negou, porque a defesa já tinha arrolado o número máximo de testemunhas, embora reconhecesse que o depoimento seria útil. A defesa protestou. Rafael foi condenado a 5 anos e 6 meses: o juiz aumentou 3/8 na terceira fase só porque havia duas causas de aumento."
  q2: "Num mandado de busca, acharam no local de trabalho de Lucas duas armas calibre .38, de uso permitido, municiadas e com a numeração raspada. A denúncia narrou só que ele guardava duas armas de calibre restrito e pediu a condenação por dois crimes, em concurso material. O laudo confirmou o calibre .38 e a numeração suprimida, e o juiz, com base nele, condenou Lucas por dois crimes de posse de arma com numeração suprimida, em concurso formal."
  q3: "Alberto, João, Francisco e Ronaldo, que se conheceram num ônibus, aceitaram dinheiro de Lucas para ajudá-lo a importar um fuzil, cada um com uma tarefa. Assustado, Francisco procurou o Ministério Público para fazer delação premiada. Participaram das negociações Francisco, o advogado dele, o promotor e o juiz que julgaria o caso, e ficou acertada a redução de 1/3 da pena. Os cinco foram denunciados por organização criminosa, e Francisco, que achou o acordo ruim, contratou você."
  q4: "Maria discutia com Clara, policial militar, que disse que a mataria com um tiro se fosse xingada de novo. Maria xingou outra vez, e Clara abriu a bolsa e tirou um objeto preto. Achando que era a arma, Maria acertou a cabeça de Clara com um pedaço de pau e a matou. Depois se soube que a arma estava mesmo na bolsa, mas Clara só tinha pegado o celular. Maria foi pronunciada por homicídio qualificado."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["27-peca-1", "27-peca-3", "27-peca-12"]
perguntas:
  - id: 27-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: merito
    pergunta: "A defesa não se opôs à ordem dos atos na audiência. Que tese afasta a nulidade pedida pelo Ministério Público?"
    tese: "Preclusão: a nulidade não foi arguida no momento adequado e ficou sanada"
    aceitos: [ "preclus* | nao foi arguida | momento adequado | momento oportuno | sanad*" ]
    artigos: [ "art. 571, II, CPP", "art. 572, I, CPP" ]
    gabarito: "Afastamento da nulidade requerida, considerando que não foi arguida em momento adequado."
    revisao: { status: revisado }
  - id: 27-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "O Ministério Público diz que, pela Lei de Drogas, o interrogatório deveria ser o primeiro ato. Que tese a defesa deve opor?"
    tese: "O interrogatório como último ato da instrução, previsto no CPP, vale também na Lei de Drogas, por ser meio de defesa"
    aceitos: [ "ultimo ato | meio de defesa | instrumento de defesa | ao final | no final" ]
    artigos: [ "art. 400, CPP" ]
    gabarito: "O interrogatório, como instrumento de defesa, poderá ser realizado como último ato da instrução OU o procedimento da Lei nº 11.343/06 deve se adequar àquele previsto no CPP."
    revisao: { status: revisado }
  - id: 27-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Por que deve ser mantida a absolvição pela associação para o tráfico?"
    tese: "Atipicidade da associação para o tráfico, que exige estabilidade e permanência, ausentes num encontro de um dia"
    aceitos: [ "estabilidade | permanencia | estavel | permanente" ]
    artigos: [ "art. 35, Lei 11.343" ]
    gabarito: "Manutenção da absolvição em relação crime de associação para o tráfico, tendo em vista que não restou provada situação de permanência/estabilidade entre o adolescente e o acusado."
    revisao: { status: revisado }
  - id: 27-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "O Ministério Público quer aumentar a pena-base pelos danos do tráfico à saúde pública. Que tese a defesa deve opor?"
    tese: "Manutenção da pena-base no mínimo: a gravidade em abstrato do tráfico é inerente ao tipo e não justifica o aumento"
    aceitos: [ "minimo | gravidade em abstrato | abstrat* | inerente | bis in idem" ]
    artigos: [ "art. 59, CP", "art. 42, Lei 11.343" ]
    gabarito: "Manutenção da pena base no mínimo legal, uma vez que o argumento utilizado pelo Ministério Público considera a gravidade em abstrato do delito OU tendo em vista que haveria bis in idem no aumento da pena em razão de violação ao bem jurídico protegido pela norma."
    revisao: { status: revisado }
  - id: 27-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "O Ministério Público quer afastar a atenuante da confissão, que seria parcial. Que tese a defesa deve opor?"
    tese: "Manutenção da atenuante da confissão: mesmo parcial, ela deve ser reconhecida quando o juiz a usa para condenar"
    aceitos: [ "usa para condenar | usou para condenar | usada para condenar | utilizada para condenar | usada na condenacao | utilizada na condenacao | serviu para condenar | serviu para a condenacao | fundamentou a condenacao | formacao da conviccao | conviccao do juiz | convencimento do juiz | mesmo parcial | ainda que parcial | qualificada" ]
    artigos: [ "Súmula 545 STJ", "art. 65, III, d, CP" ]
    gabarito: "Manutenção do reconhecimento da atenuante da confissão espontânea, considerando que foi a confissão utilizada como argumento/para formação da convicção do juiz, nos termos da Súmula 545 do STJ."
    revisao: { status: revisado }
  - id: 27-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "O Ministério Público quer afastar o tráfico privilegiado por causa do processo por furto, ainda sem julgamento. Que tese a defesa deve opor?"
    tese: "Manutenção do tráfico privilegiado: ação penal em curso não gera maus antecedentes (presunção de inocência)"
    aceitos: [ "presuncao de inocencia | nao culpabilidade | nao gera maus antecedentes | nao sao maus antecedentes | nao configura maus antecedentes | nao caracteriza maus antecedentes | nao e mau antecedente" ]
    artigos: [ "Súmula 444 STJ", "art. 33, § 4º, Lei 11.343", "art. 5, LVII, CRFB" ]
    gabarito: "Manutenção do reconhecimento da causa de diminuição do Art. 33, § 4º, da Lei nº 11.343, eis que o fato de o réu responder à ação penal por crime de furto não justifica o reconhecimento de maus antecedentes, nos termos da Súmula 444 do STJ, por analogia OU conforme o Art. 5º, LVII, da CRFB/88 (princípio da não culpabilidade ou da presunção de inocência)."
    revisao: { status: revisado }
  - id: 27-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Por que não cabe o regime fechado pedido pelo Ministério Público?"
    tese: "Manutenção do regime aberto: o tráfico privilegiado não é hediondo, e o regime fechado obrigatório é inconstitucional"
    aceitos: [ "nao e hediondo | nao hediondo | nao e crime hediondo | nao equiparado | inconstitucional" ]
    artigos: [ "art. 112, § 5º, LEP", "art. 33, § 2º, c, CP" ]
    gabarito: "Afastamento do pedido de aplicação do regime inicial fechado, pois o crime de tráfico privilegiado não é considerando hediondo pelo STF OU porque é inconstitucional a previsão do Art. 2º, § 1º, da Lei nº 8.072/90 de aplicação obrigatória do regime inicial fechado aos crimes hediondos."
    revisao: { status: revisado }
  - id: 27-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Por que deve ser mantida a substituição da pena por restritivas de direitos?"
    tese: "Manutenção da substituição: a vedação no tráfico privilegiado foi declarada inconstitucional, por ferir a individualização da pena"
    aceitos: [ "inconstitucional | individualizacao | resolucao do senado" ]
    artigos: [ "art. 44, CP", "art. 33, § 4º, Lei 11.343" ]
    gabarito: "Manutenção da substituição da pena privativa de liberdade por restritiva de direitos, já que a vedação em abstrato viola o princípio da individualização da pena OU porque o STF declarou a inconstitucionalidade da vedação trazida pelo Art. 33, § 4º, da Lei nº 11.343/06 OU porque a Resolução 05 do Senado suspendeu a eficácia da expressão que vedava a substituição."
    revisao: { status: revisado }
  - id: 27-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento processual a defesa pode usar para anular a sentença?"
    tese: "Cerceamento de defesa: a testemunha referida não entra no número máximo de testemunhas"
    aceitos: [ "cerceamento | ampla defesa | contraditorio | referida | nao se computa | nao computa | nao conta" ]
    artigos: [ "art. 401, § 1º, CPP", "art. 209, § 1º, CPP", "art. 5, LV, CRFB" ]
    gabarito: "O argumento de direito processual é que houve nulidade da sentença em razão da existência de cerceamento de defesa, uma vez que a testemunha Carla poderia ter sido ouvida pelo magistrado. Primeiramente ressalta-se que Carla é classificada pela doutrina como testemunha referida, tendo em vista que somente se teve conhecimento da mesma e de que esta presenciou os fatos quando da oitiva da vítima em juízo. O Art. 209 do CPP menciona a possibilidade de oitiva das testemunhas referidas. Ademais, o Art. 401, § 1º do CPP estabelece que as testemunhas referidas, assim como as que não prestem compromisso, não serão computadas no número máximo de 08 testemunhas a serem ouvidas. Dessa forma, a decisão do magistrado, que reconheceu a conveniência da oitiva, mas indeferiu apenas por já ter atingido a defesa o limite máximo de testemunhas, foi equivocada e gerou um cerceamento no exercício do direito de defesa, precisando ser ressaltado que o advogado manifestou de imediato seu inconformismo com a decisão.\n\nA alegação em abstrato no sentido de que o magistrado poderia ouvir testemunhas para além das arroladas não foi considerada suficiente pela Banca, tendo em vista que não combate o argumento do juiz no sentido de que as testemunhas referidas estariam abrangidas pelo limite máximo de testemunhas estabelecido no procedimento comum ordinário."
    revisao: { status: revisado }
  - id: 27-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que argumento de direito material reduz a pena de Rafael?"
    tese: "O número de majorantes, sozinho, não justifica aumento acima do mínimo no roubo: é preciso fundamentação concreta"
    aceitos: [ "numero de majorantes | quantidade de majorantes | numero de causas de aumento | mero numero | fundamentacao concreta | so pelo numero" ]
    artigos: [ "Súmula 443 STJ" ]
    gabarito: "O argumento de direito material em busca da redução da sanção aplicada é o de que o aumento realizado na terceira fase de aplicação da pena deveria ser do mínimo legal, ou seja, de 1/3, uma vez que não foi apresentada fundamentação razoável para aumento acima do mínimo. Certo é que a mera indicação do número de majorantes – fundamento este exclusivo utilizado pelo magistrado – é considerada insuficiente para justificar o aumento acima do mínimo, nos termos da Súmula 443 do Superior Tribunal de Justiça. Assim, diante da ausência de fundamentação para o aumento de 3/8, o aumento deveria ser da fração mínima de 1/3.\n\nNão será considerado suficiente pela Banca a afirmativa de não aplicação das causas de aumento pelo fato de o coautor não ser identificado."
    revisao: { status: revisado }
  - id: 27-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que argumento processual a defesa pode usar para anular a sentença?"
    tese: "Violação da correlação: a sentença condenou por fato não narrado na denúncia (a numeração suprimida), sem aditamento"
    aceitos: [ "correlacao | congruencia | aditamento | mutatio libelli" ]
    artigos: [ "art. 384, CPP" ]
    gabarito: "O argumento de direito processual a ser apresentado é o de que houve violação ao princípio da correlação, o que gera a nulidade da sentença por violação ao princípio da ampla defesa e ao princípio do contraditório. Isso porque a denúncia narrou que Lucas guardava, em seu local de trabalho, duas armas de fogo de calibre restrito.\n\nSem que houvesse aditamento da denúncia, o magistrado condenou o réu pela prática de dois crimes de posse de arma de fogo de numeração suprimida, previsto no Art. 16, parágrafo único, inciso IV, da Lei 10.826/03. Apesar do crime imputado na denúncia e o reconhecido na sentença estarem previsto no mesmo dispositivo legal, eles não se confundem e a narrativa dos fatos é diferente. O réu somente se defendeu sobre as armas apreendidas como sendo de uso restrito, não podendo, então, o magistrado modificar os fatos para dar nova capitulação jurídica, nos termos do Art. 384 do CPP. Se não houvesse alteração dos fatos, poderia o juiz aplicar o Art. 383 do CPP, mas não foi isso que ocorreu na hipótese narrada. Dessa forma, deve ser reconhecida a nulidade da sentença."
    revisao: { status: revisado }
  - id: 27-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Mantida a sentença, que argumento de direito material reduz a pena de Lucas?"
    tese: "Crime único: as duas armas foram apreendidas no mesmo contexto"
    aceitos: [ "crime unico | delito unico | um so crime | um crime so" ]
    artigos: [ "art. 16, § 1º, IV, Lei 10.826" ]
    gabarito: "Em busca de questionar o mérito da decisão, o advogado deveria argumentar que a conduta de Lucas de guardar, em seu local de trabalho, duas armas de fogo com numeração suprimida configura crime único previsto no Art. 16, parágrafo único, inciso IV, da Lei 10.826/03 e não dois crimes autônomos, seja em concurso material ou formal. As armas estavam sendo guardadas em um mesmo contexto, logo a violação ao bem jurídico protegido foi única, podendo, porém, a quantidade de armas ser considerada no momento da aplicação da pena."
    revisao: { status: revisado }
  - id: 27-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que argumento formal permite desconstituir o acordo de Francisco?"
    tese: "Nulidade do acordo de colaboração premiada: o juiz não pode participar das negociações"
    aceitos: [ "nao pode participar | nao podia participar | nao deve participar | participacao do juiz | participacao do magistrado | imparcialidade" ]
    artigos: [ "art. 4, § 6º, Lei 12.850" ]
    gabarito: "A. A delação foi realizada de maneira inadequada sob o aspecto formal, podendo o novo advogado de Francisco buscar desconstituí-la. De acordo com o Art. 4º, § 6º, da Lei nº 12.850/2013, o juiz não participará do acordo de delação premiada. Em que pese o magistrado sempre deva assegurar o respeito ao direito dos envolvidos e a paridade de armas, fato é que nas negociações do acordo de colaboração o juiz deve se manter inerte, cabendo apenas a ele homologar o acordo caso tenham sido observadas as formalidades legais. No momento em que o magistrado participou das negociações, a ilegalidade do acordo restou configurada, podendo ser o mesmo desconstituído.\n\nB. O argumento de direito material em busca de questionar a capitulação jurídica e, consequentemente, da absolvição, é o de que apesar de o crime envolver 05 agentes e haver plena divisão de tarefas, a reunião e comunhão de esforços era voltada para a prática de um crime específico e não de vários delitos, não havendo estabilidade e permanência a justificar a imputação do crime do Art. 2º da Lei nº 12.850/2013. Para a configuração do crime imputado, não basta a reunião com a intenção de praticar um crime específico, como consta do enunciado. Ainda que apenas um delito tenha sido praticado, a intenção do grupo deve ser a prática de CRIMES (no plural) e não uma infração penal em comunhão de ações e desígnios. A mera alegação em abstrato de que os requisitos do Art. 2º da Lei nº 12.850/2013 não foram preenchidos, sem enfrentar especificamente a pluralidade de crimes ou a exigência de estabilidade/permanência, não será considerada suficiente para a atribuição de pontos."
    revisao: { status: revisado }
  - id: 27-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que argumento de direito material afasta a imputação de organização criminosa?"
    tese: "Não há organização criminosa: o grupo se juntou para um só crime, sem estabilidade e permanência"
    aceitos: [ "estabilidade | permanencia | um so crime | crime especifico | unico crime | um unico crime" ]
    artigos: [ "art. 1, § 1º, Lei 12.850" ]
    gabarito: "A. A delação foi realizada de maneira inadequada sob o aspecto formal, podendo o novo advogado de Francisco buscar desconstituí-la. De acordo com o Art. 4º, § 6º, da Lei nº 12.850/2013, o juiz não participará do acordo de delação premiada. Em que pese o magistrado sempre deva assegurar o respeito ao direito dos envolvidos e a paridade de armas, fato é que nas negociações do acordo de colaboração o juiz deve se manter inerte, cabendo apenas a ele homologar o acordo caso tenham sido observadas as formalidades legais. No momento em que o magistrado participou das negociações, a ilegalidade do acordo restou configurada, podendo ser o mesmo desconstituído.\n\nB. O argumento de direito material em busca de questionar a capitulação jurídica e, consequentemente, da absolvição, é o de que apesar de o crime envolver 05 agentes e haver plena divisão de tarefas, a reunião e comunhão de esforços era voltada para a prática de um crime específico e não de vários delitos, não havendo estabilidade e permanência a justificar a imputação do crime do Art. 2º da Lei nº 12.850/2013. Para a configuração do crime imputado, não basta a reunião com a intenção de praticar um crime específico, como consta do enunciado. Ainda que apenas um delito tenha sido praticado, a intenção do grupo deve ser a prática de CRIMES (no plural) e não uma infração penal em comunhão de ações e desígnios. A mera alegação em abstrato de que os requisitos do Art. 2º da Lei nº 12.850/2013 não foram preenchidos, sem enfrentar especificamente a pluralidade de crimes ou a exigência de estabilidade/permanência, não será considerada suficiente para a atribuição de pontos."
    revisao: { status: revisado }
  - id: 27-q4-a
    categoria: discursiva
    parte: q4
    item: "A1"
    pergunta: "Que recurso cabe contra a pronúncia de Maria?"
    tese: "Recurso em sentido estrito contra a pronúncia"
    aceitos: [ "recurso em sentido estrito | rese" ]
    artigos: [ "art. 581, IV, CPP" ]
    gabarito: "A questão narra que Maria foi pronunciada pela suposta prática de crime de homicídio qualificado, sendo que, ao final da primeira fase do procedimento do Tribunal do Júri, entendeu o magistrado por pronunciar Maria nos termos da denúncia. Da decisão de pronúncia caberá recurso em sentido estrito, nos termos do Art. 581, inciso IV, do CPP. Caso a decisão proferida pelo magistrado fosse de impronúncia, não haveria que se falar em recurso em sentido estrito. Antes da edição da 11.689/08, a decisão de impronúncia também era combatida através de recurso em sentido estrito. Todavia, houve alteração legislativa e, desde então, da decisão de impronúncia, por ser terminativa, caberá recurso de apelação, assim como ocorreria na absolvição sumária, conforme previsão do Art. 416 do CPP."
    revisao: { status: revisado }
  - id: 27-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que tese de direito material combate a pronúncia de Maria?"
    tese: "Legítima defesa putativa (descriminante putativa por erro de tipo permissivo)"
    aceitos: [ "legitima defesa putativa | descriminante putativa | erro de tipo permissivo" ]
    artigos: [ "art. 20, § 1º, CP" ]
    gabarito: "A tese de direito material seria que Maria agiu em legítima defesa putativa, nos termos do Art. 20, §1º do Código Penal (erro de tipo permissivo), tendo em vista que acreditava estar atuando em legítima defesa. Isso porque Clara havia ameaçado Maria de morte caso essa realizasse um xingamento, o que foi feito por Maria.\n\nAinda que diante de eventual injúria, se verídica, a conduta de Clara de efetuar disparo de arma de fogo configuraria uma injusta agressão, pois, no mínimo, haveria excesso em sua conduta. Caso, de fato, Clara tivesse pego, em sua bolsa, sua arma de fogo, configurada estaria a legítima defesa e, consequentemente, a conduta de Maria seria legítima. Todavia, na verdade Maria supôs situação que não existia, já que Clara apenas pegou seu celular para realizar uma ligação. Diante disso, a atuação em legítima defesa foi apenas putativa."
    revisao: { status: revisado }
