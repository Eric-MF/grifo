  - id: 27-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      No interior de um coletivo, Alberto, João, Francisco e Ronaldo, até então desconhecidos, começaram a conversar sobre a crise financeira que assombra o país e sobre as dificuldades financeiras que estavam passando.

      Em determinado momento da conversa, Alberto informa que tinha um conhecido seu, Lucas, com intenção de importar uma arma de fogo de significativo potencial ofensivo, que seria um fuzil de venda proibida no Brasil, mas que ele precisava da ajuda de outras pessoas para conseguir a importação. Diante da oferta em dinheiro pelo serviço específico, todos concordaram em participar do plano criminoso, sendo que Alberto iria ao exterior adquirir a arma, João alugaria um barco para trazer o material, Francisco auxiliaria junto à imigração brasileira para que a conduta não fosse descoberta e Ronaldo entregaria o material para Lucas, que era o mentor do plano.

      Após toda a organização do grupo e divisão de tarefas, assustado com as informações veiculadas na mídia sobre as punições de crime de organização criminosa, Francisco comparece ao Ministério Público com seu advogado e indica a intenção de realizar delação premiada.

      Participaram das negociações do acordo Francisco, sua defesa técnica, o membro do Ministério Público com atribuição e o juiz que seria competente para julgamento, sendo acordada a redução de 1/3 da pena em relação ao crime de organização criminosa.

      Após ser denunciado junto com Alberto, João, Ronaldo e Lucas pela prática do crime de organização criminosa (Art. 2º, da Lei nº 12.850/2013), Francisco contrata você, como novo(a) advogado(a), para patrocinar seus interesses.

      Na condição de advogado(a) de Francisco, com base apenas nas informações narradas, esclareça os itens a seguir.
    comando: "Considerando que aquela delação premiada não seria benéfica ao seu cliente, existe argumento a ser apresentado em busca de desconstituir o acordo celebrado quanto ao seu aspecto formal? Justifique. (Valor:"
    gabarito: |-
      A. A delação foi realizada de maneira inadequada sob o aspecto formal, podendo o novo advogado de Francisco buscar desconstituí-la. De acordo com o Art. 4º, § 6º, da Lei nº 12.850/2013, o juiz não participará do acordo de delação premiada. Em que pese o magistrado sempre deva assegurar o respeito ao direito dos envolvidos e a paridade de armas, fato é que nas negociações do acordo de colaboração o juiz deve se manter inerte, cabendo apenas a ele homologar o acordo caso tenham sido observadas as formalidades legais. No momento em que o magistrado participou das negociações, a ilegalidade do acordo restou configurada, podendo ser o mesmo desconstituído.

      B. O argumento de direito material em busca de questionar a capitulação jurídica e, consequentemente, da absolvição, é o de que apesar de o crime envolver 05 agentes e haver plena divisão de tarefas, a reunião e comunhão de esforços era voltada para a prática de um crime específico e não de vários delitos, não havendo estabilidade e permanência a justificar a imputação do crime do Art. 2º da Lei nº 12.850/2013. Para a configuração do crime imputado, não basta a reunião com a intenção de praticar um crime específico, como consta do enunciado. Ainda que apenas um delito tenha sido praticado, a intenção do grupo deve ser a prática de CRIMES (no plural) e não uma infração penal em comunhão de ações e desígnios. A mera alegação em abstrato de que os requisitos do Art. 2º da Lei nº 12.850/2013 não foram preenchidos, sem enfrentar especificamente a pluralidade de crimes ou a exigência de estabilidade/permanência, não será considerada suficiente para a atribuição de pontos.
    opcoes:
      correta: Sim, poderia ser buscada a desconstituição do acordo de colaboração premiada, pois não poderia o magistrado ter participado das negociações do acordo, conforme o Art. 4º, § 6º, da Lei nº 12.850/13.
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - Joana não cometeu crime algum, pois não houve conduta de sua parte.
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - Em preliminar de defesa, deve ser alegada a extinção de punibilidade pela decadência, tendo em vista que Paulo deixou de oferecer representação no prazo de 6 meses, conhecendo a autoria desde a data do fato, conforme estabelecido no Art. 38 do CPP c/c. o Art. 107, inciso IV, do CP.
    revisao: *a1
  - id: 27-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      No interior de um coletivo, Alberto, João, Francisco e Ronaldo, até então desconhecidos, começaram a conversar sobre a crise financeira que assombra o país e sobre as dificuldades financeiras que estavam passando.

      Em determinado momento da conversa, Alberto informa que tinha um conhecido seu, Lucas, com intenção de importar uma arma de fogo de significativo potencial ofensivo, que seria um fuzil de venda proibida no Brasil, mas que ele precisava da ajuda de outras pessoas para conseguir a importação. Diante da oferta em dinheiro pelo serviço específico, todos concordaram em participar do plano criminoso, sendo que Alberto iria ao exterior adquirir a arma, João alugaria um barco para trazer o material, Francisco auxiliaria junto à imigração brasileira para que a conduta não fosse descoberta e Ronaldo entregaria o material para Lucas, que era o mentor do plano.

      Após toda a organização do grupo e divisão de tarefas, assustado com as informações veiculadas na mídia sobre as punições de crime de organização criminosa, Francisco comparece ao Ministério Público com seu advogado e indica a intenção de realizar delação premiada.

      Participaram das negociações do acordo Francisco, sua defesa técnica, o membro do Ministério Público com atribuição e o juiz que seria competente para julgamento, sendo acordada a redução de 1/3 da pena em relação ao crime de organização criminosa.

      Após ser denunciado junto com Alberto, João, Ronaldo e Lucas pela prática do crime de organização criminosa (Art. 2º, da Lei nº 12.850/2013), Francisco contrata você, como novo(a) advogado(a), para patrocinar seus interesses.

      Na condição de advogado(a) de Francisco, com base apenas nas informações narradas, esclareça os itens a seguir.
    comando: Qual argumento de direito material deve ser apresentado para questionar a capitulação jurídica realizada pelo Ministério Público na denúncia? Justifique.
    gabarito: |-
      A. A delação foi realizada de maneira inadequada sob o aspecto formal, podendo o novo advogado de Francisco buscar desconstituí-la. De acordo com o Art. 4º, § 6º, da Lei nº 12.850/2013, o juiz não participará do acordo de delação premiada. Em que pese o magistrado sempre deva assegurar o respeito ao direito dos envolvidos e a paridade de armas, fato é que nas negociações do acordo de colaboração o juiz deve se manter inerte, cabendo apenas a ele homologar o acordo caso tenham sido observadas as formalidades legais. No momento em que o magistrado participou das negociações, a ilegalidade do acordo restou configurada, podendo ser o mesmo desconstituído.

      B. O argumento de direito material em busca de questionar a capitulação jurídica e, consequentemente, da absolvição, é o de que apesar de o crime envolver 05 agentes e haver plena divisão de tarefas, a reunião e comunhão de esforços era voltada para a prática de um crime específico e não de vários delitos, não havendo estabilidade e permanência a justificar a imputação do crime do Art. 2º da Lei nº 12.850/2013. Para a configuração do crime imputado, não basta a reunião com a intenção de praticar um crime específico, como consta do enunciado. Ainda que apenas um delito tenha sido praticado, a intenção do grupo deve ser a prática de CRIMES (no plural) e não uma infração penal em comunhão de ações e desígnios. A mera alegação em abstrato de que os requisitos do Art. 2º da Lei nº 12.850/2013 não foram preenchidos, sem enfrentar especificamente a pluralidade de crimes ou a exigência de estabilidade/permanência, não será considerada suficiente para a atribuição de pontos.
    opcoes:
      correta: Não restou configurado o crime imputado, tendo em vista que o grupo tinha intenção de praticar apenas um crime específico e não várias infrações penais OU tendo em vista que não havia relação de estabilidade e permanência.
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - Joana não cometeu crime algum, pois não houve conduta de sua parte.
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - Em preliminar de defesa, deve ser alegada a extinção de punibilidade pela decadência, tendo em vista que Paulo deixou de oferecer representação no prazo de 6 meses, conhecendo a autoria desde a data do fato, conforme estabelecido no Art. 38 do CPP c/c. o Art. 107, inciso IV, do CP.
