  - id: 27-q4-a
    categoria: discursiva
    parte: q4
    item: A1
    caso: |-
      Revoltada com o fato de que sua melhor amiga Clara estaria se relacionando com seu ex-companheiro João, Maria a procurou e iniciou uma discussão.

      Durante a discussão, Clara, policial militar, afirmou que, se Maria a xingasse novamente, ela a mataria gastando apenas uma munição da sua arma. Persistindo na discussão, Maria voltou a ofender Clara. Esta, então, abriu sua bolsa e pegou um bem de cor preta. Acreditando que Clara cumpriria sua ameaça, Maria desferiu um golpe na cabeça da rival, utilizando um pedaço de pau que estava no chão. A perícia constatou que o golpe foi a causa eficiente da morte de Clara. Posteriormente, também foi constatado que Clara, de fato, estava com sua arma de fogo na bolsa, mas que ela apenas pegara seu telefone celular para ligar para João.

      Após denúncia pela prática do crime de homicídio qualificado e encerrada a instrução da primeira fase do procedimento do Tribunal do Júri, entendeu o magistrado por pronunciar Maria nos termos da inicial acusatória.

      Com base nas informações expostas, responda, na condição de advogado(a) de Maria, aos itens a seguir.
    comando: Qual o recurso cabível da decisão proferida pelo magistrado? Caso tivesse ocorrido a impronúncia, o recurso pela parte interessada seria o mesmo? Justifique.
    gabarito: A questão narra que Maria foi pronunciada pela suposta prática de crime de homicídio qualificado, sendo que, ao final da primeira fase do procedimento do Tribunal do Júri, entendeu o magistrado por pronunciar Maria nos termos da denúncia. Da decisão de pronúncia caberá recurso em sentido estrito, nos termos do Art. 581, inciso IV, do CPP. Caso a decisão proferida pelo magistrado fosse de impronúncia, não haveria que se falar em recurso em sentido estrito. Antes da edição da 11.689/08, a decisão de impronúncia também era combatida através de recurso em sentido estrito. Todavia, houve alteração legislativa e, desde então, da decisão de impronúncia, por ser terminativa, caberá recurso de apelação, assim como ocorreria na absolvição sumária, conforme previsão do Art. 416 do CPP.
    opcoes:
      correta: O recurso cabível da decisão de pronúncia é o recurso em sentido estrito, conforme Art. 581, inciso IV, do CPP. Caso a decisão fosse de impronúncia, o recurso cabível seria de apelação, conforme previsão do Art. 416 do CPP.
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - Joana não cometeu crime algum, pois não houve conduta de sua parte.
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - Aplicação da escusa absolutória OU presente causa de isenção de pena, tendo em vista que o réu era pai da vítima, nos termos do Art. 181, inciso II, do Código Penal.
        - Fábio atuou em legítima defesa, uma vez que, usando moderadamente dos meios necessários, repeliu injusta e iminente agressão de Paulo, que foi em sua direção para lhe dar um soco com o intuito de quebrar seu nariz. Assim, houve exclusão da ilicitude do fato, na forma do Art. 23, inciso II, c/c. o Art. 25, caput, ambos do CP.
    revisao: *a1
  - id: 27-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
      Revoltada com o fato de que sua melhor amiga Clara estaria se relacionando com seu ex-companheiro João, Maria a procurou e iniciou uma discussão.

      Durante a discussão, Clara, policial militar, afirmou que, se Maria a xingasse novamente, ela a mataria gastando apenas uma munição da sua arma. Persistindo na discussão, Maria voltou a ofender Clara. Esta, então, abriu sua bolsa e pegou um bem de cor preta. Acreditando que Clara cumpriria sua ameaça, Maria desferiu um golpe na cabeça da rival, utilizando um pedaço de pau que estava no chão. A perícia constatou que o golpe foi a causa eficiente da morte de Clara. Posteriormente, também foi constatado que Clara, de fato, estava com sua arma de fogo na bolsa, mas que ela apenas pegara seu telefone celular para ligar para João.

      Após denúncia pela prática do crime de homicídio qualificado e encerrada a instrução da primeira fase do procedimento do Tribunal do Júri, entendeu o magistrado por pronunciar Maria nos termos da inicial acusatória.

      Com base nas informações expostas, responda, na condição de advogado(a) de Maria, aos itens a seguir.
    comando: Qual a tese de direito material a ser apresentada em sede de recurso para combater a decisão de submeter a ré ao julgamento pelo Tribunal do Júri? Justifique.
    gabarito: |-
      A tese de direito material seria que Maria agiu em legítima defesa putativa, nos termos do Art. 20, §1º do Código Penal (erro de tipo permissivo), tendo em vista que acreditava estar atuando em legítima defesa. Isso porque Clara havia ameaçado Maria de morte caso essa realizasse um xingamento, o que foi feito por Maria.

      Ainda que diante de eventual injúria, se verídica, a conduta de Clara de efetuar disparo de arma de fogo configuraria uma injusta agressão, pois, no mínimo, haveria excesso em sua conduta. Caso, de fato, Clara tivesse pego, em sua bolsa, sua arma de fogo, configurada estaria a legítima defesa e, consequentemente, a conduta de Maria seria legítima. Todavia, na verdade Maria supôs situação que não existia, já que Clara apenas pegou seu celular para realizar uma ligação. Diante disso, a atuação em legítima defesa foi apenas putativa.
    opcoes:
      correta: A tese de direito material seria que Maria agiu em legítima defesa putativa, estando amparada por descriminante putativa OU erro de tipo permissivo, conforme Art. 20, §1º do CP.
      erradas:
        - O recurso cabível da sentença do magistrado é a Apelação, cujo fundamento legal é previsto no Art. 593, inciso I, do CPP, com prazo de interposição de 05 dias.
        - Joana não cometeu crime algum, pois não houve conduta de sua parte.
        - A tese adequada é a da aplicação da lei mais benéfica ao condenado, que importará na redução da sua pena, tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto alternativo, portanto crime único OU tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto cumulativo, sujeito à aplicação da continuidade delitiva o que permite sua aplicação para fatos praticados antes de sua entrada em vigor, ainda que a decisão seja definitiva.
        - O argumento é que, diante da parcial procedência do pedido, deveria ter sido analisada a possibilidade de oferecimento de proposta de suspensão condicional do processo, nos termos da Súmula 337 do STJ OU art. 89 da Lei 9.099/95.
        - A condenação anterior à pena de multa não impede a concessão da suspensão condicional da pena, de acordo com o Art. 77, § 1º, do CP.
    revisao: *a1
