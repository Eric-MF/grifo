        - A tese jurídica processual é a necessidade de rejeição da denúncia por falta de representação da vítima, pois, a partir da Lei nº 13.964/19, o crime de estelionato, em regra, comporta ação penal de iniciativa pública condicionada à representação, segundo o Art. 171, § 5º, do CP.
