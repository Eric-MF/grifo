  - id: 15-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Com o trânsito em julgado, que tese a defesa de Júlia deve alegar para impedir o cumprimento da pena?"
    tese: "A prescrição da pretensão punitiva retroativa, com o prazo pela metade (menor de 21 anos)"
    aceitos: [ "prescri*" ]
    artigos: [ "art. 109, V, CP", "art. 115, CP" ]
    gabarito: "A questão exige do candidato conhecimento acerca do tema prescrição. O enunciado deixa clara a data de nascimento de Julia, demonstrando que esta era menor de 21 anos na data dos fatos. Entre o recebimento da denúncia e a data da publicação da sentença condenatória foram ultrapassados mais de 03 anos. A pena privativa de liberdade definitiva aplicada para Julia foi de 01 ano, que, na forma do artigo 109, V, do Código Penal, prescreve em 04 anos. Ocorre que, como Julia era menor de 21 anos na data dos fatos, o prazo prescricional deverá ser contado pela metade, conforme prevê o artigo 115 do Código Penal; dois anos, portanto.\n\nNesse sentido, para fazer jus à pontuação relativa ao item ‘A’, considerando-se o comando da questão, a tese defensiva a ser alegada para impedir o cumprimento da pena é justamente a ocorrência da prescrição da pretensão punitiva retroativa, pois entre o recebimento da denúncia e a publicação da sentença condenatória foi ultrapassado o prazo prescricional de dois anos, nos termos acima descritos. Fundamenta-se, tal resposta, no artigo 109, V, c/c 115, ambos do CP.\n\nRessalte-se que somente poderá ser pontuada a resposta que indicar corretamente a espécie de prescrição incidente ao caso, até porque era esse o objeto da questão.\n\nTodavia, para privilegiar a demonstração de conhecimento jurídico, a Banca pontuará a resposta que não destacar a “prescrição da pretensão punitiva retroativa”, desde que o examinando indique expressamente tratar-se de prescrição da pretensão punitiva e também aponte os marcos interruptivos em que ela se operou, a saber: entre a data do recebimento da denúncia e a publicação da sentença condenatória. Para ter direito a essa flexibilização, entretanto, o examinando deve atender ambas as exigências.\n\nDe igual modo, a resposta que traga duas ou mais espécies de prescrição (mesmo que uma delas seja a correta), não será pontuada por considerar-se contraditória.\n\nJá no que tange ao item ‘B’, faz-se necessário à atribuição dos pontos respectivos que o examinando responda que a principal consequência do acolhimento da tese acima esposada é o reconhecimento da extinção da punibilidade de Júlia (art. 107, IV, CP) e, em decorrência disso, desaparecem também todos os demais efeitos penais e/ou civis, tais como a reincidência, os maus antecedentes ou mesmo a possibilidade de a condenação funcionar como título executivo no juízo cível."
    revisao: { status: revisado }
