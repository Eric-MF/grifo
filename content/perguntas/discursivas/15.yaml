  - id: 15-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que medida cabe, de imediato, para impedir o prosseguimento da ação penal contra Raquel?"
    tese: "Habeas corpus, para trancar a ação penal"
    aceitos: [ "habeas corpus" ]
    artigos: [ "art. 648, I, CPP", "art. 5, LXVIII, CRFB", "art. 647, CPP" ]
    gabarito: "Para auferir a pontuação relativa ao item ‘A’, considerando-se o comando da questão, o examinando deve indicar que a medida jurídica a ser adotada para impedir de imediato o prosseguimento da ação penal é o Habeas Corpus, devendo fundamentar sua resposta no artigo 5º, LXVIII, CRFB/88, ou no art. 647 do CPP, ou no art. 648, incisos I ou VI, do CPP. Ressalte-se que em virtude da celeridade na tramitação inerente ao Habeas Corpus, tal medida é aquela que de imediato atenderia os interesses em jogo, sendo, portanto, a mais acertada ao caso narrado.\n\nCumpre destacar que o Habeas Corpus deveria ter por objetivo o trancamento da ação penal, tendo em vista que o fato praticado ainda não era típico. Além disso, não serão pontuadas as respostas que indicarem duas ou mais medidas jurídicas a serem adotadas, ainda que uma delas seja o Habeas Corpus, isso porque o comando da questão era claro ao pedir a indicação de apenas uma.\n\nPor fim, no tocante ao item ‘B’, destaca-se que a situação narrada pelo enunciado representa um constrangimento ilegal a Raquel. Nesse sentido, levando-se em conta o comando da questão, resta evidente que a principal tese jurídica a ser apresentada é aquela calcada no verbete 24 da Súmula Vinculante do STF, segundo a qual não se tipifica crime material contra a ordem tributária antes do lançamento definitivo do tributo. Inclusive, dessa forma, vêm entendendo os Tribunais Superiores que, antes do esgotamento da instância administrativa com lançamento do tributo, não pode ser oferecida denúncia pela prática do crime (Art. 1º, incisos I ao IV, da Lei nº 8.137).\n\nRessalte-se que a mera indicação do verbete sumular não será pontuada, tampouco a resposta que indicar apenas a atipicidade ou a falta de lançamento definitivo do tributo, sem qualquer outra justificativa ou desenvolvimento. Esclareça-se: o fato praticado por Raquel é atípico porque não houve o efetivo lançamento definitivo do crédito tributário, sendo certo que tal justificativa é essencial para a atribuição dos pontos. De igual modo, o lançamento definitivo do tributo e/ou a necessidade de esgotamento da via administrativa e/ou a falta de justa causa para a propositura da ação penal, são teses alegáveis desde que calcadas no verbete 24 da Súmula Vinculante do STF."
    revisao: { status: revisado }
  - id: 15-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Qual a principal tese jurídica para trancar a ação penal contra Raquel?"
