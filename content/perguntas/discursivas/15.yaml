    opcoes:
      correta: Sim, pois Miguel preencheu os requisitos do decreto. OU Sim, pois Miguel preencheu o requisito temporal e a falta grave ocorreu após o decreto. OU Sim, com base no princípio da legalidade. OU Sim, pois o juiz não pode estabelecer outros requisitos que não constem expressamente no decreto.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Como não houve eficácia no arrependimento OU como não houve atendimento à exigência do Art. 15, CP, Wilson deverá responder pelo resultado morte OU deverá responder pelo crime de homicídio doloso consumado.
        - Nulidade dos atos processuais praticados após sua citação OU nulidade da sentença, pois a citação por edital foi inválida, já que Vanessa estava presa OU já que a citação de Vanessa deveria ter sido realizada pessoalmente, nos termos da Súmula 351 do STF OU do art. 360, CPP.
        - Houve cerceamento de defesa OU violação ao princípio do contraditório ou da ampla defesa, tendo em vista que as testemunhas referidas não são computadas no número máximo de testemunhas a serem ouvidas, nos termos do Art. 401, § 1º, do CPP OU Art. 209 do CPP OU Art. 5º, LV, CRFB.
        - Carta testemunhável, na forma do Art. 639, inciso I, do CPP.
