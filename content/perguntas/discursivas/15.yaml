  - id: 15-q1-a
    categoria: discursiva
    parte: q1
    item: "A.1"
    pergunta: "Fora o habeas corpus, que medida a defesa de Miguel deve adotar contra a decisão que negou o indulto?"
    tese: "Agravo em execução, em 5 dias"
    aceitos: [ "agravo" ]
    artigos: [ "art. 197, LEP" ]
    gabarito: "A questão tem como objetivo extrair do examinando conhecimento acerca do tema Execução Penal. Conforme o enunciado informa, o Decreto de Indulto previa que apenas impediria o benefício a punição pela prática de falta grave nos 12 meses anteriores à sua publicação. Diante disso, a jurisprudência vem entendendo que a prática de falta grave após a publicação do Decreto, ainda que antes da análise do requerimento do benefício pelo órgão competente, não impede sua concessão, respeitando-se, assim, o princípio da legalidade. Miguel faz jus ao benefício, motivo pelo qual deve o seu advogado interpor Agravo de Execução da decisão do juiz da VEP, sendo o seu prazo de 05 dias, conforme artigos 197 da Lei nº 7.210 c/c 586, CPP e Súmula 700 do STF.\n\nCumpre destacar que a questão em análise foi dividida em dois itens. Nesse sentido, para fazer jus à pontuação relativa ao item ‘A’, o examinando deveria indicar de modo expresso o cabimento do recurso de Agravo em Execução, cuja previsão legal está no art. 197 da Lei de Execuções Penais; outrossim, deveria indicar que o prazo para a interposição de referido recurso é de 5 (cinco) dias, tal como indica o verbete 700 da Súmula do STF. Por fim, para receber a pontuação relativa ao item ‘B’, o examinando deveria indicar que Miguel fazia jus ao benefício do indulto porque preenchia os requisitos nele previstos, a saber: o tempo exigido pelo decreto e a ausência de cometimento de falta grave (ou ausência de sanção pela prática de falta grave no período mencionado em referido decreto), de modo que, em respeito ao princípio da legalidade, o magistrado não poderia estabelecer outros requisitos que não constassem expressamente do decreto.\n\nComo determina o próprio espelho de correção, a simples indicação de dispositivo legal não pontua. De igual modo, as respostas devem ser sempre justificadas. Além disso, a indicação de duas ou mais medidas processuais (ainda que uma delas seja a correta), não será pontuada, pois o comando da questão determina a indicação de apenas uma."
    revisao: { status: revisado }
  - id: 15-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "O juiz podia decretar a prisão preventiva por conta própria, no inquérito?"
    tese: "Vedação da preventiva decretada de ofício pelo juiz (sistema acusatório)"
    aceitos: [ [ "de oficio" ], [ "acusatorio" ], [ "imparcialidade" ], [ "inercia" ] ]
    artigos: [ "art. 311, CPP", "art. 282, § 2º, CPP" ]
    gabarito: "A questão em análise busca extrair conhecimento acerca do tema prisão preventiva. Durante muito tempo se controverteu sobre a possibilidade de o magistrado decretar a prisão preventiva de ofício, em especial durante as investigações policiais. A lei 12.403 conferiu novo tratamento ao tema. Na hipótese narrada, o juiz, ainda durante a fase de investigação, sem ação penal em curso, decretou a prisão preventiva do indiciado de ofício, o que não é admitido pelo artigo 311 do Código de Processo Penal, tendo em vista que violaria o princípio da imparcialidade, o princípio da inércia e até mesmo o sistema acusatório. Ainda que a decretação da prisão preventiva de ofício neste momento fosse admitida, a fundamentação apresentada seria insuficiente, pois a gravidade em abstrato do crime não pode justificar a aplicação de medidas cautelares pessoais. O juiz não fundamentou a prisão preventiva, medida excepcional considerando o princípio da presunção de inocência e o direito à liberdade, com circunstâncias em concreto do caso.\n\nNesse sentido, perceba-se que a questão em análise dividiu-se em dois itens distintos.\n\nPara receber a pontuação relativa ao item ‘A’, considerando-se o comando da questão (“Poderia o magistrado adotar tal medida? Justifique.”), o examinando deveria responder que o magistrado não poderia ter agido daquela forma, calcando-se no sistema acusatório que norteia o processo penal brasileiro desde sua expressa adoção pela nossa Magna Carta. Consoante o sistema acusatório o juiz deve ser inerte e imparcial, de sorte que a decretação de uma prisão cautelar de ofício por parte do magistrado fere frontalmente tais postulados. Ademais, interpretando-se o art. 311 do CPP, resta claro que o juiz não pode decretar prisão preventiva de ofício na fase de inquérito. Tal interpretação decorre, obviamente, de uma leitura baseada no sistema acusatório. Nesse ínterim, é oportuno destacar que eventuais respostas calcadas no art. 311 do CPP, necessariamente, deveriam demonstrar que tal dispositivo veda a decretação de prisão preventiva de ofício pelo juiz na fase de inquérito policial; a tal constatação somente se chega a partir de uma interpretação principiológica, razão pela qual não merecem pontuação as respostas que se limitarem a indicar como fundamento da negativa o art. 311 do CPP, simplesmente, sem qualquer análise mais aprofundada.\n\nPor fim, para fazer jus à pontuação relativa ao item ‘B’, considerando-se o comando da questão, o examinando deveria indicar que a fundamentação apresentada pelo magistrado não foi suficiente, pois a gravidade em abstrato do delito, segundo entendimento pacífico, não é argumento idôneo, capaz de justificar uma prisão cautelar. Mais uma vez, a simples indicação de dispositivo legal não deve ser pontuada, sendo necessário, tal como manda o enunciado, que o examinando justifique sua resposta."
    revisao: { status: revisado }
