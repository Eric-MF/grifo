        - Não, pois Wilson será beneficiado pelo instituto do arrependimento eficaz, de modo que somente responderá pelos atos praticados OU somente responderá por lesões corporais graves.
        - Vanessa não foi corretamente condenada por peculato porque não tinha conhecimento da condição de funcionário público de João, dependendo a comunicação da elementar desse elemento subjetivo OU porque não pode ser aplicado o Art. 30 do CP pela ausência de elemento subjetivo.
        - Houve cerceamento de defesa OU violação ao princípio do contraditório ou da ampla defesa, tendo em vista que as testemunhas referidas não são computadas no número máximo de testemunhas a serem ouvidas, nos termos do Art. 401, § 1º, do CPP OU Art. 209 do CPP OU Art. 5º, LV, CRFB.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
