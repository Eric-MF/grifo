      A peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão.
    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: "Qualificação do querelante e da querelada: Indicação da qualificação do querelante e da querelada"
    opcoes:
      correta: "Qualificação do querelante e da querelada: Indicação da qualificação do querelante e da querelada"
      erradas:
        - Memoriais endereçados ao Juiz do Tribunal do Júri.
        - "No mérito: Absolvição OU atipicidade, pois não houve dolo de ter a coisa para si OU não há a elementar “ para si ou para outrem” OU “furto de uso” é indiferente penal"
        - No mérito, absolvição de Roberta.
        - Manutenção do reconhecimento da causa de diminuição do Art. 33, § 4º, da Lei nº 11.343, eis que o fato de o réu responder à ação penal por crime de furto não justifica o reconhecimento de maus antecedentes, nos termos da Súmula 444 do STJ, por analogia OU conforme o Art. 5º, LVII, da CRFB/88 (princípio da não culpabilidade ou da presunção de inocência).
        - Afastamento da agravante do Art. 61, inciso II, alínea d (ou b), do CP, pois a situação de perigo comum é elementar do tipo imputado ou por configurar bis in idem ou por não haver a intenção de ocultação, vantagem ou impunidade de outro crime.
    revisao: *a1
