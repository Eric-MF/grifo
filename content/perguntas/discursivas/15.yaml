# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "15"
introducoes:
  peca: "No dia do aniversário, Enrico convidou os amigos pela rede social. Helena, sua ex-namorada, comentou no perfil dele, à vista de todos os contatos: 'Enrico não passa de um idiota, bêbado, irresponsável e sem vergonha!', e acrescentou que ele trabalha embriagado e que, no mês anterior, a empresa teve de chamar uma ambulância porque ele estava bêbado no expediente. Os amigos Carlos, Miguel e Ramirez estavam com ele e viram a publicação. Cinco meses depois, Enrico procura você para processar Helena, em Niterói."
  q1: "Miguel, condenado por roubo a 5 anos e 4 meses, já tinha cumprido 4 anos quando saiu, em 24/12/2013, um decreto de indulto para penas de até 8 anos, cumprido 1/3 da pena (primário) e sem falta grave nos 12 meses anteriores. Cinco dias depois do decreto, antes da análise do pedido, Miguel cometeu falta grave, e o juiz da execução negou o indulto."
  q2: "Vencido o prazo do inquérito por extorsão mediante sequestro, o delegado pediu só a renovação do prazo. O juiz, antes de ouvir o Ministério Público, decretou a prisão preventiva do investigado, considerando só a gravidade do tipo de crime."
  q3: "A Receita Federal apurou que Raquel teria sonegado R$ 27 mil de Imposto de Renda e abriu procedimento administrativo, ainda sem lançamento definitivo do crédito. Mesmo assim, o Ministério Público Federal a denunciou por sonegação fiscal, e o juiz manteve o recebimento da denúncia depois da resposta à acusação."
  q4: "Júlia, nascida em 6/4/1991, furtou a carteira de Ricardo em 6/7/2010. A denúncia foi recebida em 11/8/2011, e ela foi condenada a 1 ano de reclusão em sentença publicada em 8/10/2014, que transitou em julgado sem recurso."
