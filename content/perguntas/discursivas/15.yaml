  - id: 15-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      No dia 06/07/2010, Júlia, nascida em 06/04/1991, aproveitando-se de um momento de distração de Ricardo, subtraiu-lhe a carteira. Após recebimento da denúncia, em 11/08/2011, e regular processamento do feito, Júlia foi condenada a uma pena privativa de liberdade de 01 ano de reclusão, em sentença publicada em 08/10/2014.

      Nem o Ministério Público nem a defesa de Júlia interpuseram recurso, tendo o feito transitado em julgado em 22/10/2014.

      Sobre esses fatos, responda aos itens a seguir.
    comando: Diante do trânsito em julgado, qual a tese defensiva a ser alegada em favor de Júlia para impedir o cumprimento da pena?
    gabarito: |-
      A questão exige do candidato conhecimento acerca do tema prescrição. O enunciado deixa clara a data de nascimento de Julia, demonstrando que esta era menor de 21 anos na data dos fatos. Entre o recebimento da denúncia e a data da publicação da sentença condenatória foram ultrapassados mais de 03 anos. A pena privativa de liberdade definitiva aplicada para Julia foi de 01 ano, que, na forma do artigo 109, V, do Código Penal, prescreve em 04 anos. Ocorre que, como Julia era menor de 21 anos na data dos fatos, o prazo prescricional deverá ser contado pela metade, conforme prevê o artigo 115 do Código Penal; dois anos, portanto.

      Nesse sentido, para fazer jus à pontuação relativa ao item ‘A’, considerando-se o comando da questão, a tese defensiva a ser alegada para impedir o cumprimento da pena é justamente a ocorrência da prescrição da pretensão punitiva retroativa, pois entre o recebimento da denúncia e a publicação da sentença condenatória foi ultrapassado o prazo prescricional de dois anos, nos termos acima descritos. Fundamenta-se, tal resposta, no artigo 109, V, c/c 115, ambos do CP.

      Ressalte-se que somente poderá ser pontuada a resposta que indicar corretamente a espécie de prescrição incidente ao caso, até porque era esse o objeto da questão.

      Todavia, para privilegiar a demonstração de conhecimento jurídico, a Banca pontuará a resposta que não destacar a “prescrição da pretensão punitiva retroativa”, desde que o examinando indique expressamente tratar-se de prescrição da pretensão punitiva e também aponte os marcos interruptivos em que ela se operou, a saber: entre a data do recebimento da denúncia e a publicação da sentença condenatória. Para ter direito a essa flexibilização, entretanto, o examinando deve atender ambas as exigências.

      De igual modo, a resposta que traga duas ou mais espécies de prescrição (mesmo que uma delas seja a correta), não será pontuada por considerar-se contraditória.

      Já no que tange ao item ‘B’, faz-se necessário à atribuição dos pontos respectivos que o examinando responda que a principal consequência do acolhimento da tese acima esposada é o reconhecimento da extinção da punibilidade de Júlia (art. 107, IV, CP) e, em decorrência disso, desaparecem também todos os demais efeitos penais e/ou civis, tais como a reincidência, os maus antecedentes ou mesmo a possibilidade de a condenação funcionar como título executivo no juízo cível.
    opcoes:
      correta: "A ocorrência da prescrição da pretensão punitiva retroativa, / conforme arts. 109, V, c/c 115, ambos do CP. OU A ocorrência da prescrição da pretensão punitiva entre a data do recebimento da denúncia e a publicação da sentença condenatória, / conforme arts. 109, V, c/c 115, ambos do CP. Obs.: a mera citação do artigo não pontua."
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não, pois Wilson será beneficiado pelo instituto do arrependimento eficaz, de modo que somente responderá pelos atos praticados OU somente responderá por lesões corporais graves.
        - Não é possível a condenação exclusivamente com base nas declarações do agente colaborador, segundo o Art. 4º, § 16º, da Lei nº 12.850/13, devendo ser corroborada por outros elementos de prova.
        - Recurso de apelação, no prazo de 10 dias, conforme Art. 82, caput OU §1º, da Lei nº 9.099/95.
        - A tese jurídica processual é a necessidade de rejeição da denúncia por falta de representação da vítima, pois, a partir da Lei nº 13.964/19, o crime de estelionato, em regra, comporta ação penal de iniciativa pública condicionada à representação, segundo o Art. 171, § 5º, do CP.
