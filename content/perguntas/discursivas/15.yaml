  - id: 15-q1-a
    categoria: discursiva
    parte: q1
    item: A.1
    caso: |-
      Miguel foi condenado pela prática do crime previsto no Art. 157, § 2º, inciso V, do Código Penal, à pena privativa de liberdade de 05 anos e 04 meses de reclusão e 13 dias-multa. Após cumprir 04 anos da reprimenda penal aplicada, foi publicado, no dia 24/12/2013, um Decreto prevendo que caberia indulto para o condenado à pena privativa de liberdade não superior a 08 anos que tivesse cumprido 1/3 da pena, se primário, ou 1/2, se reincidente, além da inexistência de aplicação de sanção pela prática de falta grave nos 12 meses anteriores ao Decreto. Cinco dias após a publicação do Decreto, mas antes de apreciado seu pedido de indulto, Miguel praticou falta grave, razão pela qual teve seu requerimento indeferido pelo Juiz em atuação junto à Vara de Execução Penal.

      Considerando apenas as informações contidas na presente hipótese, responda aos itens a seguir.
    comando: Qual medida processual, diferente do habeas corpus, deve ser adotada pelo advogado de Miguel e qual seria o seu prazo?
    gabarito: |-
      A questão tem como objetivo extrair do examinando conhecimento acerca do tema Execução Penal. Conforme o enunciado informa, o Decreto de Indulto previa que apenas impediria o benefício a punição pela prática de falta grave nos 12 meses anteriores à sua publicação. Diante disso, a jurisprudência vem entendendo que a prática de falta grave após a publicação do Decreto, ainda que antes da análise do requerimento do benefício pelo órgão competente, não impede sua concessão, respeitando-se, assim, o princípio da legalidade. Miguel faz jus ao benefício, motivo pelo qual deve o seu advogado interpor Agravo de Execução da decisão do juiz da VEP, sendo o seu prazo de 05 dias, conforme artigos 197 da Lei nº 7.210 c/c 586, CPP e Súmula 700 do STF.

      Cumpre destacar que a questão em análise foi dividida em dois itens. Nesse sentido, para fazer jus à pontuação relativa ao item ‘A’, o examinando deveria indicar de modo expresso o cabimento do recurso de Agravo em Execução, cuja previsão legal está no art. 197 da Lei de Execuções Penais; outrossim, deveria indicar que o prazo para a interposição de referido recurso é de 5 (cinco) dias, tal como indica o verbete 700 da Súmula do STF. Por fim, para receber a pontuação relativa ao item ‘B’, o examinando deveria indicar que Miguel fazia jus ao benefício do indulto porque preenchia os requisitos nele previstos, a saber: o tempo exigido pelo decreto e a ausência de cometimento de falta grave (ou ausência de sanção pela prática de falta grave no período mencionado em referido decreto), de modo que, em respeito ao princípio da legalidade, o magistrado não poderia estabelecer outros requisitos que não constassem expressamente do decreto.

      Como determina o próprio espelho de correção, a simples indicação de dispositivo legal não pontua. De igual modo, as respostas devem ser sempre justificadas. Além disso, a indicação de duas ou mais medidas processuais (ainda que uma delas seja a correta), não será pontuada, pois o comando da questão determina a indicação de apenas uma.
    opcoes:
      correta: "Agravo em execução./ Art. 197 da LEP Obs.: a mera citação do artigo não pontua. 5 dias./ Verbete 700 da Súmula do STF OU art. 586 CPP Obs.: a mera citação do artigo não pontua."
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Como não houve eficácia no arrependimento OU como não houve atendimento à exigência do Art. 15, CP, Wilson deverá responder pelo resultado morte OU deverá responder pelo crime de homicídio doloso consumado.
        - A medida processual a ser apresentada é o Agravo OU Agravo de Execução OU Agravo em Execução, na forma do Art. 197 da Lei nº 7.210/84.
        - O número de majorantes não é fundamento adequado para aplicação da causa de aumento de pena acima do mínimo legal, nos termos da Súmula 443 do STJ.
        - Carta testemunhável, na forma do Art. 639, inciso I, do CPP.
    revisao: *a1
