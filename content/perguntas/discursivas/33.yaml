  - id: 33-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Em uma pequena cidade do interior do Amazonas, uma virose se espalha entre os adolescentes locais, gerando diversos casos de jovens com febre, vômitos e infecções. Considerando a dificuldade de acesso à cidade, que dependia de viagem de barco, e a inexistência de profissionais de medicina no local, os pais dos adolescentes procuram Jorge, 22 anos, estudante de odontologia, para auxílio. Verificando o estado de desidratação dos adolescentes e a urgência da situação, Jorge, que sempre gostara de ler livros sobre medicina, realiza o atendimento e indica os remédios e os tratamentos que deveriam ser realizados. Os adolescentes ficaram curados após o atendimento “médico” de Jorge e, em razão disso, passaram a ser constantes os atendimentos por ele realizados em casos urgentes, com perigo atual à vida e à saúde das pessoas da cidade, mas que não tinham qualquer vínculo com a virose anterior.

      Descobertos os fatos e verificado que foram realizados 10 atendimentos diferentes ao longo de um ano, o Ministério Público denunciou Jorge como incurso nas sanções penais do Art. 282 do Código Penal, por 10 vezes, em continuidade delitiva. A proposta de suspensão condicional do processo não foi aceita pelo réu.

      Após regular instrução, a pretensão punitiva do Estado foi julgada procedente, sendo Jorge condenado à pena de 10 meses de detenção (pena base no mínimo legal, aumentada de 2/3 em razão da continuidade delitiva), substituída a privativa de liberdade por uma restritiva de direitos.

      Intimado da decisão, responda na condição de advogado de Jorge, aos itens a seguir.
    comando: Existe argumento de direito material a ser apresentado em busca da absolvição de Jorge? Justifique.
    gabarito: |-
      Sim, existe argumento a ser apresentado pelo advogado de Jorge em busca de sua absolvição. O conceito de crime, de acordo com a doutrina majoritária, envolve o fato típico, ilícito e culpável. A princípio, a conduta de Jorge seria típica, já que realizou, com habitualidade, ao longo de um ano, atendimentos médicos sem autorização para exercer a profissão, sendo certo, porém, que tais atendimentos somente era realizados em situações de emergência. No caso, a conduta narrada seria típica de acordo com as previsões do Art. 282 do CP.

      Todavia, claramente há situação de estado de necessidade. A todo momento consta do enunciado que Jorge somente atuava em situações de risco e urgência para vida e saúde das pessoas, sendo ainda destacado que a pequena cidade não tinha médico e que a obtenção de um profissional demandaria longo tempo. Assim, todos os requisitos do Art. 24 do CP foram preenchidos. Jorge agiu para salvar perigo atual, que não provocou por sua vontade, cujo sacrifício não era exigível na situação. Em razão disso, o advogado deveria pleitear o reconhecimento do estado de necessidade e, consequentemente, a exclusão da ilicitude da conduta.
    opcoes:
      correta: Sim, deveria a defesa técnica alegar a existência de excludente de ilicitude, em razão do estado de necessidade, nos termos do Art. 24 ou do Art. 23, inciso I, do CP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - À autoridade judiciária, na forma do Art. 24-A, §2º, da Lei nº 11.340/2006.
        - Não, nos termos do verbete 453 da Súmula do STF. OU Não, pois nesse caso haveria supressão de instância.
        - Deveria ser alegada a ocorrência de desistência voluntária, o que torna a conduta do agente atípica OU o que faz com que responda apenas pelos atos já praticados, na forma do Art. 15, primeira parte, do CP.
        - Sim, o argumento de que ocorreu extinção da punibilidade diante da reparação do dano pelo réu, pagamento esse que precedeu sentença irrecorrível, nos termos do Art. 312, § 3º, do CP.
    revisao: *a1
  - id: 33-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Em uma pequena cidade do interior do Amazonas, uma virose se espalha entre os adolescentes locais, gerando diversos casos de jovens com febre, vômitos e infecções. Considerando a dificuldade de acesso à cidade, que dependia de viagem de barco, e a inexistência de profissionais de medicina no local, os pais dos adolescentes procuram Jorge, 22 anos, estudante de odontologia, para auxílio. Verificando o estado de desidratação dos adolescentes e a urgência da situação, Jorge, que sempre gostara de ler livros sobre medicina, realiza o atendimento e indica os remédios e os tratamentos que deveriam ser realizados. Os adolescentes ficaram curados após o atendimento “médico” de Jorge e, em razão disso, passaram a ser constantes os atendimentos por ele realizados em casos urgentes, com perigo atual à vida e à saúde das pessoas da cidade, mas que não tinham qualquer vínculo com a virose anterior.

      Descobertos os fatos e verificado que foram realizados 10 atendimentos diferentes ao longo de um ano, o Ministério Público denunciou Jorge como incurso nas sanções penais do Art. 282 do Código Penal, por 10 vezes, em continuidade delitiva. A proposta de suspensão condicional do processo não foi aceita pelo réu.

      Após regular instrução, a pretensão punitiva do Estado foi julgada procedente, sendo Jorge condenado à pena de 10 meses de detenção (pena base no mínimo legal, aumentada de 2/3 em razão da continuidade delitiva), substituída a privativa de liberdade por uma restritiva de direitos.

      Intimado da decisão, responda na condição de advogado de Jorge, aos itens a seguir.
    comando: Em caso de manutenção da condenação, qual argumento poderá ser apresentado para questionar a capitulação realizada e a pena aplicada? Justifique.
    gabarito: O argumento a ser apresentado é que, ainda que se considere que o crime foi praticado, haveria crime único do Art. 282 do CP e não concurso de delitos. A capitulação imputada pelo Ministério Público e acolhida pelo magistrado foi equivocada, não se tratando de erro apenas no momento de aplicação da pena. A acusação imputou na denúncia 10 CRIMES autônomos do Art. 282 do CP, o que era equivocado. O crime do Art. 282 do Código Penal é classificado, pela doutrina e pela jurisprudência, como crime de natureza habitual, ou seja, a própria configuração do delito exige situação de habitualidade, reiteração na prática dos atos. Apesar de realizados 10 “atendimentos médicos”, essas condutadas reiteradas configurariam, em tese, um crime de exercício ilegal da medicina, que pressupõe essa habitualidade. Assim, deveria a defesa técnica esclarecer que houve equívoco na imputação de 10 crimes, buscando o reconhecimento de delito único e, consequentemente, redução da pena com o afastamento da causa de aumento da continuidade delitiva.
    opcoes:
      correta: O argumento é o de que não houve concurso de crimes, mas sim crime único, diante da natureza de crime habitual da infração imputada ou diante da imprescindibilidade da reiteração para configuração do delito.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 33-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Bernardo, em 31 de dezembro de 2018, com a intenção de causar dano à loja de Bruno, seu inimigo, arremessou uma pedra na direção de uma janela com mosaico, que tinha valor significativo de mercado. Ocorre que, no momento da execução do crime, Bernardo errou o arremesso e a pedra acabou por atingir Joana, funcionária que passava em frente à loja e que não tinha sido percebida, causando-lhe lesões corporais que a impossibilitaram de trabalhar por 50 dias. A janela restou intacta. No momento do crime, não foi identificada a autoria, mas, após investigação, em 04 de março de 2019, foi descoberto que Bernardo seria o autor do arremesso.

      O Ministério Público iniciou procedimento em face de Bernardo imputando-lhe o crime de lesão corporal de natureza culposa, figurando como vítima Joana, que apresentou representação quando da descoberta do autor.

      Bruno, revoltado com o ocorrido, contratou um advogado, conferindo-lhe procuração com poderes gerais, constando o nome do ofendido e do ofensor. O procurador apresenta queixa-crime, em 02 de julho de 2019, imputando a prática do crime de tentativa de dano a Bernardo. Ao tomar conhecimento da queixa-crime, Bernardo o procura, como advogado.

      Considerando apenas as informações narradas, na condição de advogado(a) de Bernardo, responda aos questionamentos a seguir.
    comando: Qual argumento de direito processual poderá ser apresentado em busca da rejeição da queixa-crime apresentada? Justifique.
    gabarito: |-
      O argumento é o de que não foram observadas as formalidades legais, tendo em vista que a queixa-crime foi apresentada por procurador sem poderes especiais. De acordo com o Art. 44 do Código de Processo Penal, a queixa-crime poderá ser apresentada por procurador, desde que sejam concedidos poderes especiais. Na hipótese, de acordo com o enunciado, a procuração concedida pelo querelante apenas previa poderes gerais;

      logo, a queixa deveria ser rejeitada.
    opcoes:
      correta: A queixa-crime somente poderia ter sido apresentada por procurador com poderes especiais OU a procuração apenas previa poderes gerais, o que não é admitido, nos termos do Art. 44 do CPP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 33-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Bernardo, em 31 de dezembro de 2018, com a intenção de causar dano à loja de Bruno, seu inimigo, arremessou uma pedra na direção de uma janela com mosaico, que tinha valor significativo de mercado. Ocorre que, no momento da execução do crime, Bernardo errou o arremesso e a pedra acabou por atingir Joana, funcionária que passava em frente à loja e que não tinha sido percebida, causando-lhe lesões corporais que a impossibilitaram de trabalhar por 50 dias. A janela restou intacta. No momento do crime, não foi identificada a autoria, mas, após investigação, em 04 de março de 2019, foi descoberto que Bernardo seria o autor do arremesso.

      O Ministério Público iniciou procedimento em face de Bernardo imputando-lhe o crime de lesão corporal de natureza culposa, figurando como vítima Joana, que apresentou representação quando da descoberta do autor.

      Bruno, revoltado com o ocorrido, contratou um advogado, conferindo-lhe procuração com poderes gerais, constando o nome do ofendido e do ofensor. O procurador apresenta queixa-crime, em 02 de julho de 2019, imputando a prática do crime de tentativa de dano a Bernardo. Ao tomar conhecimento da queixa-crime, Bernardo o procura, como advogado.

      Considerando apenas as informações narradas, na condição de advogado(a) de Bernardo, responda aos questionamentos a seguir.
    comando: Qual argumento de direito material a ser apresentado para questionar o delito imputado na queixa-crime? Justifique.
    gabarito: A intenção de Bernardo era causar um dano à loja de Bruno, tendo o agente iniciado a execução desse ato, o que configuraria crime de tentativa de dano. Ocorre que, por política criminal, no Art. 74 do Código Penal, o legislador previu o instituto do “resultado diverso do pretendido” ou aberratio criminis, estabelecendo que quando, por erro na execução, advém resultado diverso do pretendido, o agente responde por culpa se o fato é previsto como culposo. Somente se ocorrer, também, o resultado inicialmente pretendido, será aplicada a regra do concurso formal. Diante da previsão legal, o crime de dano inicialmente pretendido fica afastado. Se houvesse dano e lesão, haveria concurso formal. Não ocorrendo o dano, o crime de tentativa de dano fica afastado, restando apenas o crime de lesão corporal culposa, que efetivamente foi imputado pelo Ministério Público, diante da previsão do Art. 74 do CP.
    opcoes:
      correta: Houve aberratio criminis OU houve resultado diverso do pretendido, devendo o agente responder apenas pelo crime de lesão corporal culposa, nos termos do Art. 74 do CP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 33-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Beatriz e seu esposo José, no dia 02/01/2021, enquanto celebravam o aniversário de casamento em um restaurante, iniciaram uma discussão, por José entender que a esposa não lhe dispensava a devida atenção.

      Durante a discussão, José desferiu um soco no rosto de Beatriz, causando-lhe lesão corporal de natureza leve.

      Testemunhas presenciais do fato chamaram a Polícia, sendo José preso em flagrante, mas posteriormente liberado pelo magistrado, em sede de audiência de custódia.

      O Ministério Público ofereceu denúncia imputando a José a prática do crime do Art. 129, § 9º, do Código Penal, havendo habilitação imediata de Beatriz, por meio de seu advogado, como assistente de acusação, já que ela não aceitou ter sido agredida pelo então marido.

      O magistrado em atuação no Juizado de Violência Doméstica e Familiar contra a Mulher não recebeu a denúncia, afirmando a inexistência de fato culpável, escorado em laudo apresentado pela defesa indicando que, no momento dos fatos, em razão da paixão, José era inteiramente incapaz de determinar-se de acordo com seu entendimento. Destacou o magistrado a possibilidade de rejeição da denúncia por não ser necessária a aplicação de medida de segurança, já que, atualmente, não haveria incapacidade de José.

      Insatisfeita com o teor da decisão, Beatriz procura você, como advogado(a), para a adoção das medidas cabíveis e assistência técnica. Na condição de advogado(a) de Beatriz, esclareça os questionamentos a seguir.
    comando: Para combater a decisão do magistrado, qual o recurso cabível? Justifique.
    gabarito: A decisão do magistrado foi de rejeição da inicial acusatória. Contra a decisão de rejeição da denúncia, segundo o Art. 581, inciso I, do CPP, cabe recurso em sentido estrito, a ser apresentado no prazo de 05 dias.
    opcoes:
      correta: Caberá recurso em sentido estrito, nos termos do Art. 581, inciso I, do CPP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Tendo em vista que o delito de tráfico privilegiado não é crime equiparado a hediondo, aplica-se a progressão pelo percentual de 16%, nos termos do Art. 112, § 5º ou Art. 112, inciso I, da LEP.
        - Favorecimento real OU praticou o delito descrito no Art. 349, do CP.
        - Deveria ser alegada a impossibilidade de condenação na imputação originária, pois o juiz está adstrito aos termos do aditamento (Art. 384, §4º, do CPP) OU porque não foram observados os princípios da ampla defesa e do contraditório OU houve violação ao princípio da correlação.
        - Sim, o argumento seria de que ocorreu a prescrição da pretensão executória, com consequente extinção da punibilidade do agente, conforme o Art. 107, inciso IV, do CP, OU o Art. 109, inciso V, do CP, OU o Art. 110 do CP.
    revisao: *a1
