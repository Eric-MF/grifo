# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "33"
introducoes:
  peca: "Breno, de 19 anos, conheceu Carlos numa festa proibida para menores de 18 e lhe contou que, armado, pretendia roubar a loja de conveniência de um posto. Carlos topou, e os dois anunciaram o assalto em 3/11/2017, mas foram presos pela polícia no exato momento em que abriam o caixa. Só na delegacia se descobriu que Carlos tinha 16 anos e entrara na festa com documento falso; a vítima disse que os dois pareciam ter uns 25 anos. Na audiência, o juiz fez ele mesmo as perguntas às testemunhas, sem deixar as partes perguntarem, e a defesa protestou. Breno foi condenado por roubo majorado consumado e corrupção de menores, em concurso formal: a pena-base subiu pela personalidade voltada ao crime, com base em inquéritos e ações penais ainda sem trânsito em julgado; nenhuma atenuante foi reconhecida; e o roubo foi aumentado em 2/3 pela arma de fogo, conforme a lei de 2018. A pena final foi de 8 anos e 8 meses, no regime fechado. Você foi intimado da sentença."
  q1: "Numa cidade isolada do Amazonas, sem médicos, Jorge, estudante de odontologia, atendeu adolescentes doentes de uma virose e indicou remédios, e eles se curaram. Depois, passou a fazer atendimentos em casos urgentes, com perigo atual à vida e à saúde: foram 10 ao longo de um ano. Foi condenado por exercício ilegal da medicina, 10 vezes, em continuidade delitiva."
  q2: "Em 31/12/2018, Bernardo jogou uma pedra para quebrar o vitral da loja de Bruno, seu inimigo, mas errou e acertou Joana, que passava, causando-lhe lesões. O vitral ficou intacto. Bernardo foi processado por lesão corporal culposa contra Joana. Bruno deu ao advogado procuração com poderes gerais, e o advogado ofereceu queixa-crime contra Bernardo por tentativa de dano."
  q3: "No restaurante, em 2/1/2021, José deu um soco no rosto da esposa, Beatriz, causando lesão leve. Denunciado por lesão corporal em violência doméstica, José teve a denúncia rejeitada: um laudo da defesa disse que, por causa da paixão, ele estava inteiramente incapaz de se determinar na hora, e o juiz disse não haver fato culpável. Beatriz é assistente de acusação."
  q4: "Lauro, a 120 km/h numa via de limite 50 km/h, bateu na traseira do carro de Talita, que teve lesão leve, e fugiu sem prestar socorro. O Ministério Público propôs a ele transação penal pela lesão corporal culposa no trânsito, e o juiz a homologou. Talita não concordou."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["33-peca-1", "33-peca-3", "33-peca-4-1", "33-peca-6", "33-peca-12"]
perguntas:
  - id: 33-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: preliminar
    pergunta: "Que preliminar a defesa deve levantar quanto à audiência?"
    tese: "Nulidade da instrução: o juiz inverteu a ordem das perguntas às testemunhas e não deixou as partes perguntarem diretamente"
    aceitos: [ "nulidade | nula | nulo | anula* | inver* | complementa*" ]
    artigos: [ "art. 212, CPP", "art. 564, IV, CPP" ]
    gabarito: "Preliminar: Nulidade da instrução, tendo em vista que houve inversão na ordem da realização das perguntas para as testemunhas OU tendo em vista que o juiz iniciou as perguntas para as partes, não permitindo complementação, o que viola o Art. 212 OU o Art. 564, inciso IV, ambos do CPP."
    revisao: { status: revisado }
  - id: 33-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Breno achava que Carlos era maior de idade. Que tese leva à absolvição pela corrupção de menores?"
    tese: "Erro de tipo quanto à idade do adolescente, que exclui o dolo na corrupção de menores"
    aceitos: [ "erro de tipo | erro sobre elementar | erro sobre a elementar | erro sobre a idade" ]
    artigos: [ "art. 20, CP" ]
    gabarito: "No mérito, deveria ser buscada a absolvição do réu em relação ao crime de corrupção de menores, tendo em vista que ocorreu erro de tipo, nos termos do Art. 20, caput, do CP."
    revisao: { status: revisado }
  - id: 33-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Que tese a defesa deve opor ao aumento da pena-base pela personalidade de Breno?"
    tese: "Ações penais e inquéritos em curso não podem elevar a pena-base, nem como personalidade (presunção de inocência)"
    aceitos: [ "presuncao de inocencia | nao culpabilidade | nao podem elevar | nao podem agravar | nao pode agravar | nao servem | minimo" ]
    artigos: [ "Súmula 444 STJ", "art. 5, LVII, CRFB", "art. 59, CP" ]
    gabarito: "No que tange à aplicação da pena, deveria ser reduzida a pena base, considerando que inquéritos policiais e ações em curso não podem ser valoradas negativamente na pena base, nem mesmo para avaliar personalidade, nos termos do Art. 5º, inciso LVII, da CRFB, OU da Súmula 444 do STJ."
    revisao: { status: revisado }
  - id: 33-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Que atenuante o juiz deixou de reconhecer pela idade de Breno?"
    tese: "Atenuante da menoridade relativa: o réu tinha menos de 21 anos na data do fato"
    aceitos: [ "menoridade relativa | menor de 21 | menos de 21" ]
    artigos: [ "art. 65, I, CP" ]
    gabarito: "Reconhecimento da atenuante da menoridade relativa, já que o réu era menor de 21 anos na data dos fatos, nos termos do Art. 65, inciso I, do CP."
    revisao: { status: revisado }
  - id: 33-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Que tese a defesa deve opor ao aumento de 2/3 pelo emprego da arma de fogo?"
    tese: "Irretroatividade da lei que elevou para 2/3 o aumento pela arma de fogo: o roubo é anterior a ela"
    aceitos: [ "irretroativ* | nao retroage | lei anterior | lei da epoca | lei vigente na epoca" ]
    artigos: [ "art. 5, XL, CRFB" ]
    gabarito: "Redução do quantum de aumento realizado na terceira fase da dosimetria do crime de roubo, já que os fatos foram praticados antes da entrada em vigor da lei que aumentou o percentual de aumento em razão do emprego de arma de fogo OU em razão do princípio da irretroatividade da lei penal prejudicial ao réu, conforme Art. 5º, inciso XL, da CRFB."
    revisao: { status: revisado }
  - id: 33-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Os dois foram presos quando abriam o caixa. Que tese a defesa deve sustentar quanto à consumação do roubo?"
    tese: "Tentativa: o roubo não se consumou, porque não houve inversão da posse do dinheiro"
    aceitos: [ "tentativa | tentado | nao se consumou | nao consumado | nao consumou" ]
    artigos: [ "art. 14, II, CP", "Súmula 582 STJ" ]
    gabarito: "Reconhecimento da causa de diminuição de pena da tentativa, já que o crime não se consumou por circunstâncias alheias à vontade dos agentes OU porque não houve subtração do dinheiro que estava no caixa do estabelecimento OU porque não houve inversão da posse como exige a Súmula 582 do STJ."
    revisao: { status: revisado }
  - id: 33-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Com a pena reduzida, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial semiaberto ou aberto, conforme a pena reduzida e a primariedade do réu"
    aceitos: [ "semiaberto | semi-aberto | semi aberto | aberto" ]
    artigos: [ "art. 33, § 2º, b, CP", "art. 33, § 2º, c, CP" ]
    gabarito: "Aplicação do regime inicial semiaberto ou aberto com base na pena a ser aplicada e primariedade do réu, nos termos do Art. 33, § 2º, alíneas b ou c, do CP."
    revisao: { status: revisado }
  - id: 33-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento de direito material leva à absolvição de Jorge?"
    tese: "Estado de necessidade, que exclui a ilicitude: não havia médicos, e os casos eram urgentes"
    aceitos: [ "estado de necessidade | excludente de ilicitude | exclui a ilicitude" ]
    artigos: [ "art. 24, CP", "art. 23, I, CP" ]
    gabarito: "Sim, existe argumento a ser apresentado pelo advogado de Jorge em busca de sua absolvição. O conceito de crime, de acordo com a doutrina majoritária, envolve o fato típico, ilícito e culpável. A princípio, a conduta de Jorge seria típica, já que realizou, com habitualidade, ao longo de um ano, atendimentos médicos sem autorização para exercer a profissão, sendo certo, porém, que tais atendimentos somente era realizados em situações de emergência. No caso, a conduta narrada seria típica de acordo com as previsões do Art. 282 do CP.\n\nTodavia, claramente há situação de estado de necessidade. A todo momento consta do enunciado que Jorge somente atuava em situações de risco e urgência para vida e saúde das pessoas, sendo ainda destacado que a pequena cidade não tinha médico e que a obtenção de um profissional demandaria longo tempo. Assim, todos os requisitos do Art. 24 do CP foram preenchidos. Jorge agiu para salvar perigo atual, que não provocou por sua vontade, cujo sacrifício não era exigível na situação. Em razão disso, o advogado deveria pleitear o reconhecimento do estado de necessidade e, consequentemente, a exclusão da ilicitude da conduta."
    revisao: { status: revisado }
  - id: 33-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Mantida a condenação, que argumento contesta a continuidade delitiva?"
    tese: "Crime único: o exercício ilegal da medicina é crime habitual, e a reiteração forma um só crime, não a continuidade"
    aceitos: [ "crime unico | delito unico | habitual | um so crime | um unico crime" ]
    artigos: [ "art. 282, CP" ]
    gabarito: "O argumento a ser apresentado é que, ainda que se considere que o crime foi praticado, haveria crime único do Art. 282 do CP e não concurso de delitos. A capitulação imputada pelo Ministério Público e acolhida pelo magistrado foi equivocada, não se tratando de erro apenas no momento de aplicação da pena. A acusação imputou na denúncia 10 CRIMES autônomos do Art. 282 do CP, o que era equivocado. O crime do Art. 282 do Código Penal é classificado, pela doutrina e pela jurisprudência, como crime de natureza habitual, ou seja, a própria configuração do delito exige situação de habitualidade, reiteração na prática dos atos. Apesar de realizados 10 “atendimentos médicos”, essas condutadas reiteradas configurariam, em tese, um crime de exercício ilegal da medicina, que pressupõe essa habitualidade. Assim, deveria a defesa técnica esclarecer que houve equívoco na imputação de 10 crimes, buscando o reconhecimento de delito único e, consequentemente, redução da pena com o afastamento da causa de aumento da continuidade delitiva."
    revisao: { status: revisado }
  - id: 33-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que argumento processual leva à rejeição da queixa-crime?"
    tese: "Rejeição da queixa: a procuração do querelante precisa de poderes especiais"
    aceitos: [ "poderes especiais" ]
    artigos: [ "art. 44, CPP" ]
    gabarito: "O argumento é o de que não foram observadas as formalidades legais, tendo em vista que a queixa-crime foi apresentada por procurador sem poderes especiais. De acordo com o Art. 44 do Código de Processo Penal, a queixa-crime poderá ser apresentada por procurador, desde que sejam concedidos poderes especiais. Na hipótese, de acordo com o enunciado, a procuração concedida pelo querelante apenas previa poderes gerais;\n\nlogo, a queixa deveria ser rejeitada."
    revisao: { status: revisado }
  - id: 33-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que argumento de direito material contesta a imputação de tentativa de dano?"
    tese: "Resultado diverso do pretendido (aberratio criminis): Bernardo responde só pela lesão corporal culposa"
    aceitos: [ "aberratio criminis | resultado diverso | aberratio delicti" ]
    artigos: [ "art. 74, CP" ]
    gabarito: "A intenção de Bernardo era causar um dano à loja de Bruno, tendo o agente iniciado a execução desse ato, o que configuraria crime de tentativa de dano. Ocorre que, por política criminal, no Art. 74 do Código Penal, o legislador previu o instituto do “resultado diverso do pretendido” ou aberratio criminis, estabelecendo que quando, por erro na execução, advém resultado diverso do pretendido, o agente responde por culpa se o fato é previsto como culposo. Somente se ocorrer, também, o resultado inicialmente pretendido, será aplicada a regra do concurso formal. Diante da previsão legal, o crime de dano inicialmente pretendido fica afastado. Se houvesse dano e lesão, haveria concurso formal. Não ocorrendo o dano, o crime de tentativa de dano fica afastado, restando apenas o crime de lesão corporal culposa, que efetivamente foi imputado pelo Ministério Público, diante da previsão do Art. 74 do CP."
    revisao: { status: revisado }
  - id: 33-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que recurso cabe contra a decisão que rejeitou a denúncia?"
    tese: "Recurso em sentido estrito contra a decisão que não recebeu a denúncia"
    aceitos: [ "recurso em sentido estrito | rese" ]
    artigos: [ "art. 581, I, CPP" ]
    gabarito: "A decisão do magistrado foi de rejeição da inicial acusatória. Contra a decisão de rejeição da denúncia, segundo o Art. 581, inciso I, do CPP, cabe recurso em sentido estrito, a ser apresentado no prazo de 05 dias."
    revisao: { status: revisado }
  - id: 33-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que argumento de direito material contesta a decisão do juiz?"
    tese: "A paixão não exclui a imputabilidade: José responde pelo crime"
    aceitos: [ "paixao nao exclui | nao exclui a imputabilidade | nao exclui a culpabilidade | imputavel" ]
    artigos: [ "art. 28, I, CP" ]
    gabarito: "Sim, existe, tendo em vista que a paixão não exclui a culpabilidade, nos termos do Art. 28, inciso I, do CP. De acordo com a doutrina majoritária, existe crime quando for praticado fato típico, ilícito e culpável. O magistrado entendeu que, apesar de praticado fato típico e ilícito, não haveria culpabilidade em razão da inimputabilidade momentânea do agente. Um dos elementos da culpabilidade é a imputabilidade, relacionada à capacidade do agente ter consciência de seus atos e determinar-se de acordo com esse entendimento. Ocorre que o Art. 28, inciso I, do CP, prevê expressamente que a emoção e a paixão não excluem a imputabilidade penal, de modo que não poderia o magistrado deixar de receber a denúncia sob o fundamento de que, em razão da paixão, o agente não tinha capacidade de determinar-se de acordo com seu entendimento e, consequentemente, a culpabilidade estaria afastada."
    revisao: { status: revisado }
  - id: 33-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Há recurso contra a decisão que homologou a transação penal?"
    tese: "Apelação contra a sentença que homologa a transação penal"
    aceitos: [ "apelacao" ]
    artigos: [ "art. 76, § 5º, Lei 9.099" ]
    gabarito: "Sim, de acordo com o Art. 76, § 5º, da Lei nº 9.099/95, da decisão que homologa a transação penal caberá recurso de apelação, nos termos do Art. 82 do mesmo diploma legal. Diferente do que ocorre com a sentença que homologa composição civil dos danos, que é irrecorrível, conforme Art. 74 da Lei nº 9.099/95, a sentença que homologa a transação penal pode ser questionada por meio de recurso."
    revisao: { status: revisado }
  - id: 33-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que argumento contesta a transação penal oferecida a Lauro?"
    tese: "Vedação da transação penal: Lauro dirigia a mais de 50 km/h acima do limite da via"
    aceitos: [ "vedad* | vedacao | nao cabe | incabivel | nao admite | nao e cabivel | descabimento" ]
    artigos: [ "art. 291, § 1º, III, Lei 9.503" ]
    gabarito: "O advogado de Talita deverá esclarecer que existe argumento para questionar a proposta de transação penal oferecida pelo Ministério Público. Com base na Folha de Antecedentes Criminais do autor do fato, ele é, tecnicamente, primário. Ademais, o benefício da transação penal anterior foi oferecido, cumprido e extinto há mais de 05 anos, de modo que não haveria impedimento, com base no Art. 76 da Lei nº 9.099/95. O Art. 291 do CTB (Lei nº 9.503/97), a princípio permite que sejam aplicados os institutos da composição dos danos civis, transação penal e exigência de representação da vítima nos crimes de lesão corporal culposa praticadas na condução de veículo automotor. Ocorre que o próprio Art. 291, § 1º, inciso III, do CTB, prevê que não serão aplicáveis tais institutos despenalizadores quando o crime for praticado por agente que esteja transitando em velocidade acima da máxima permitida para a via em 50 km/h. No caso, a velocidade máxima da via era de 50 km/h e Lauro conduzia seu automóvel a 120km/h, afastando a possibilidade de oferecimento de proposta de transação penal.\n\nNão será considerado suficiente pela Banca apenas a afirmativa de que a pena máxima prevista para o delito supera 02 anos, tendo em vista que, mesmo com essa pena, se não constatadas as situações dos incisos I, II ou III do Art. 291, § 1º, do CTB, a proposta seria possível."
    revisao: { status: revisado }
