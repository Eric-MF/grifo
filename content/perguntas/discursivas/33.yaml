    comando: Que pedido deve ser formulado na peça?
    gabarito: Conhecimento e provimento do recurso.
    opcoes:
      correta: Conhecimento e provimento do recurso.
      erradas:
        - Absolvição, com argumento e base legal.
        - Requerimento de declaração das nulidades, absolvição sumária e, alternativamente, produção de provas.
        - Requerimento de aplicação do furto privilegiado, pleiteando a adoção de alguma das medidas previstas em lei (ou substituição da reclusão por detenção ou causa de diminuição de pena ou aplicação exclusivamente da pena de multa), na forma do Art. 155, §2º, do CP.
