  - id: 33-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Talita conduzia seu veículo automotor quando sofreu uma colisão na traseira de seu automóvel causada por Lauro, que conduzia seu automóvel a 120 km/h, apesar de a velocidade máxima permitida, na via pública em que estavam, ser de 50km/h.

      A perícia realizada no local indicou que o acidente foi causado pela violação do dever de cuidado de Lauro, que, em razão da alta velocidade imprimida, não conseguiu frear a tempo de evitar a colisão. Talita realizou exame de corpo de delito que constatou a existência de lesão corporal de natureza leve. Lauro, por sua vez, fugiu do local do acidente sem prestar auxílio.

      O Ministério Público, ao tomar conhecimento dos fatos e não havendo composição dos danos civis, ofereceu proposta de transação penal em favor de Lauro, destacando que o crime de lesão corporal culposa, previsto no Art. 303, § 1º, da Lei nº 9.503/97, admitia o benefício e que a Folha de Antecedentes Criminais do autor do fato apenas indicava a existência de uma outra anotação referente à infração em que Lauro foi beneficiado também por transação penal, mas o benefício foi oferecido e extinto há mais de 06 anos.

      Talita ficou insatisfeita com a proposta do Ministério Público e procurou você, como advogado(a), para esclarecimentos.

      Considerando as informações expostas, responda, na condição de advogado(a) de Talita, aos itens a seguir.
    comando: Existe previsão de recurso para questionar a decisão homologatória de transação penal? Justifique.
    gabarito: Sim, de acordo com o Art. 76, § 5º, da Lei nº 9.099/95, da decisão que homologa a transação penal caberá recurso de apelação, nos termos do Art. 82 do mesmo diploma legal. Diferente do que ocorre com a sentença que homologa composição civil dos danos, que é irrecorrível, conforme Art. 74 da Lei nº 9.099/95, a sentença que homologa a transação penal pode ser questionada por meio de recurso.
    opcoes:
      correta: Sim, a decisão homologatória de transação penal pode ser questionada por meio de apelação, nos termos do Art. 76, § 5º, da Lei nº 9.099/95.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Remessa dos autos ao órgão superior do Ministério Público, a fim de que seja oferecido o Acordo de Não Persecução Penal, nos termos do Art. 28-A, § 14º, do CPP.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
  - id: 33-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
      Talita conduzia seu veículo automotor quando sofreu uma colisão na traseira de seu automóvel causada por Lauro, que conduzia seu automóvel a 120 km/h, apesar de a velocidade máxima permitida, na via pública em que estavam, ser de 50km/h.

      A perícia realizada no local indicou que o acidente foi causado pela violação do dever de cuidado de Lauro, que, em razão da alta velocidade imprimida, não conseguiu frear a tempo de evitar a colisão. Talita realizou exame de corpo de delito que constatou a existência de lesão corporal de natureza leve. Lauro, por sua vez, fugiu do local do acidente sem prestar auxílio.

      O Ministério Público, ao tomar conhecimento dos fatos e não havendo composição dos danos civis, ofereceu proposta de transação penal em favor de Lauro, destacando que o crime de lesão corporal culposa, previsto no Art. 303, § 1º, da Lei nº 9.503/97, admitia o benefício e que a Folha de Antecedentes Criminais do autor do fato apenas indicava a existência de uma outra anotação referente à infração em que Lauro foi beneficiado também por transação penal, mas o benefício foi oferecido e extinto há mais de 06 anos.

      Talita ficou insatisfeita com a proposta do Ministério Público e procurou você, como advogado(a), para esclarecimentos.

      Considerando as informações expostas, responda, na condição de advogado(a) de Talita, aos itens a seguir.
    comando: Existe argumento para questionar o oferecimento de transação penal ao autor do fato? Justifique.
    gabarito: |-
      O advogado de Talita deverá esclarecer que existe argumento para questionar a proposta de transação penal oferecida pelo Ministério Público. Com base na Folha de Antecedentes Criminais do autor do fato, ele é, tecnicamente, primário. Ademais, o benefício da transação penal anterior foi oferecido, cumprido e extinto há mais de 05 anos, de modo que não haveria impedimento, com base no Art. 76 da Lei nº 9.099/95. O Art. 291 do CTB (Lei nº 9.503/97), a princípio permite que sejam aplicados os institutos da composição dos danos civis, transação penal e exigência de representação da vítima nos crimes de lesão corporal culposa praticadas na condução de veículo automotor. Ocorre que o próprio Art. 291, § 1º, inciso III, do CTB, prevê que não serão aplicáveis tais institutos despenalizadores quando o crime for praticado por agente que esteja transitando em velocidade acima da máxima permitida para a via em 50 km/h. No caso, a velocidade máxima da via era de 50 km/h e Lauro conduzia seu automóvel a 120km/h, afastando a possibilidade de oferecimento de proposta de transação penal.

      Não será considerado suficiente pela Banca apenas a afirmativa de que a pena máxima prevista para o delito supera 02 anos, tendo em vista que, mesmo com essa pena, se não constatadas as situações dos incisos I, II ou III do Art. 291, § 1º, do CTB, a proposta seria possível.
    opcoes:
      correta: Sim. Considerando que não poderia ser aplicado o instituto da transação penal, tendo em vista que o crime foi praticado quando o agente transitava em velocidade superior à máxima permitida para a via em mais de 50 km/h, conforme o Art. 291, § 1º, inciso III, do CTB.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
