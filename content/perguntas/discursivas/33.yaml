    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: A conduta do magistrado de não permitir complementação viola o princípio da ampla defesa OU do devido processo legal OU gera cerceamento de defesa, em desconformidade com Art. 5º, inciso LIV OU LV, da CRFB.
    opcoes:
      correta: A conduta do magistrado de não permitir complementação viola o princípio da ampla defesa OU do devido processo legal OU gera cerceamento de defesa, em desconformidade com Art. 5º, inciso LIV OU LV, da CRFB.
      erradas:
        - Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
        - Excludente de culpabilidade, em razão da inimputabilidade.
        - Em consequência da pena base no mínimo legal deve ser fixado o regime semiaberto, pois a imposição obrigatória do regime inicial fechado é inconstitucional.
        - Reconhecimento da atenuação da confissão, nos termos do Art. 65, inciso III, alínea d, do CP.
        - Entre a data do fato e do recebimento da denúncia foi ultrapassado o prazo prescricional aplicável de 10 anos OU entre a data do fato e do recebimento da denúncia foi ultrapassado o prazo prescricional do crime de homicídio, que deverá ser computado pela metade considerando a idade do réu na data do fato
    revisao: *a1
