      Na audiência de instrução e julgamento, realizada no dia 18/10/2012 (quinta-feira), o Ministério Público apresentou certidão cartorária apta a atestar que no dia 15/05/2012 (terça-feira) ocorrera o trânsito em julgado definitivo de sentença que condenava Rita pela prática do delito de estelionato. A ré, em seu interrogatório, exerceu o direito ao silêncio. As alegações finais foram orais; acusação e defesa manifestaram-se. Finda a instrução criminal, o magistrado proferiu sentença em audiência. Na dosimetria da pena, o magistrado entendeu por bem elevar a penabase em patamar acima do mínimo, ao argumento de que o trânsito em julgado de outra sentença condenatória configurava maus antecedentes; na segunda fase da dosimetria da pena o magistrado também entendeu ser cabível a incidência da agravante da reincidência, levando em conta a data do trânsito em julgado definitivo da sentença de estelionato, bem como a data do cometimento do furto (ora objeto de julgamento); não verificando a incidência de nenhuma causa de aumento ou de diminuição, o magistrado fixou a pena definitiva em 4 (quatro) anos de reclusão no regime inicial semiaberto e 80 (oitenta) dias-multa. O valor do dia-multa foi fixado no patamar mínimo legal. Por entender que a ré não atendia aos requisitos legais, o magistrado não substituiu a pena privativa de liberdade por pena restritiva de direitos. Ao final, assegurou-se à ré o direito de recorrer em liberdade.

      O advogado da ré deseja recorrer da decisão.

      Atento ao caso narrado e levando em conta tão somente as informações contidas no texto, elabore o recurso cabível. (Valor: 5,0)
    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Como a ré não é reincidente, faz jus ao regime aberto, conforme o Art. 33, § 2º, ‘c’, do CP ou Súmula 269 do STJ.
    opcoes:
      correta: Como a ré não é reincidente, faz jus ao regime aberto, conforme o Art. 33, § 2º, ‘c’, do CP ou Súmula 269 do STJ.
      erradas:
        - Falta de observância da formalidade legal do reconhecimento, prevista no art. 226, II, do CPP.
        - Aplicação do regime inicial semiaberto ou aberto com base na pena a ser aplicada e primariedade do réu, nos termos do Art. 33, § 2º, alíneas b ou c, do CP.
        - Da tese do afastamento da agravante da embriaguez preordenada.
        - O reconhecimento do erro de tipo tem como consequência a exclusão do dolo ou atipicidade da conduta.
        - A prática de falta grave não gera o reinício da contagem do prazo do livramento condicional, nos termos da Súmula 441 do STJ.
    revisao: *a1
