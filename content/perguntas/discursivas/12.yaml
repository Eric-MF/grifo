      DIREITO PENAL
    opcoes:
      correta: "- A hipótese é de crime impossível (OU o fato é atípico), consoante Verbete 145 da Súmula do STF. Obs.: A mera indicação ou reprodução do conteúdo da Súmula não pontua.."
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - "Sim, resta configurada a prescrição da pretensão punitiva retroativa. Obs.: A indicação de espécie distinta de prescrição macula a integralidade do item “A”."
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
  - id: 12-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Marcos, jovem inimputável conforme o Art. 26 do CP, foi denunciado pela prática de determinado crime.

      Após o regular andamento do feito, o magistrado entendeu por bem aplicar medida de segurança consistente em internação em hospital psiquiátrico por período mínimo de 03 (três) anos. Após o cumprimento do período supramencionado, o advogado de Marcos requer ao juízo de execução que seja realizado o exame de cessação de periculosidade, requerimento que foi deferido. É realizada uma rigorosa perícia, e os experts atestam a cura do internado, opinando, consequentemente, por sua desinternação. O magistrado então, baseando-se no exame pericial realizado por médicos psiquiatras, exara sentença determinando a desinternação de Marcos. O Parquet, devidamente intimado da sentença proferida pelo juízo da execução, interpõe o recurso cabível na espécie.

      A partir do caso apresentado, responda, fundamentadamente, aos itens a seguir.
    comando: Qual o recurso cabível da sentença proferida pelo magistrado determinando a desinternação de Marcos?
    gabarito: Como se trata de decisão proferida pelo juiz da execução penal, o recurso cabível é o Agravo, previsto no Art. 197, da Lei de Execução Penal - 7.210/84.
    opcoes:
      correta: "- Agravo em Execução, previsto no Art. 197 da Lei de Execução Penal - 7.210/84. Obs.: A mera indicação ou reprodução do conteúdo do artigo não pontua."
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Deveria ser alegada a impossibilidade de condenação na imputação originária, pois o juiz está adstrito aos termos do aditamento (Art. 384, §4º, do CPP) OU porque não foram observados os princípios da ampla defesa e do contraditório OU houve violação ao princípio da correlação.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
