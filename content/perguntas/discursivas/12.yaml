# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "12"
introducoes:
  peca: "Em 10/11/2011, Rita, de 60 anos, arrebentou a fechadura de um armário de uma grande rede de farmácias e levou cinco tintas de cabelo, R$ 49,95 no total. Foi condenada por furto qualificado pelo rompimento de obstáculo a 4 anos, no semiaberto, sem pena alternativa. Na dosimetria, o juiz usou a mesma condenação por estelionato, transitada em julgado em 15/5/2012, para elevar a pena-base como maus antecedentes e, na segunda fase, como agravante. Você defende Rita na apelação."
  q2: "Wilson, policial e irmão de uma vítima de Ricardo, ladrão conhecido, ganhou a confiança dele e propôs assaltar uma lotérica seguindo um plano. No dia, ao sinal de Wilson, Ricardo entrou e anunciou o assalto, mas todos os 'clientes' eram policiais disfarçados, e ele foi preso em flagrante por roubo tentado."
  q4: "Marcos, inimputável, cumpriu três anos de internação em hospital psiquiátrico. A perícia atestou o fim da periculosidade, e o juiz da execução determinou a desinternação. O Ministério Público recorreu."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["12-peca-1", "12-peca-3", "12-peca-5a", "12-peca-5b"]
perguntas:
  - id: 12-peca-4-1
    categoria: peca-detalhe
    parte: peca
    item: "4.1"
    secao: merito
    pergunta: "As tintas valiam R$ 49,95, numa grande rede de farmácias. Que tese de mérito leva à absolvição de Rita?"
    tese: "Atipicidade material, pela insignificância da lesão ao patrimônio"
    aceitos: [ [ "insignifica*" ], [ "tipicidade material" ], [ "atipic*" ] ]
    artigos: [ "art. 386, III, CPP" ]
    gabarito: "Atipicidade da conduta pela falta de tipicidade material: a conduta de Rita não configurou efetiva lesão ao patrimônio da grande rede de farmácias, assim, o fato é atípico pela falta de tipicidade material."
    revisao: { status: revisado }
  - id: 12-peca-4-2
    categoria: peca-detalhe
    parte: peca
    item: "4.2"
    secao: pedido
    pergunta: "Subsidiariamente, sendo Rita primária e a coisa de pequeno valor, que forma do furto a defesa deve pedir?"
    tese: "Furto privilegiado: ré primária e coisa de pequeno valor"
    aceitos: [ "privilegi*" ]
    artigos: [ "art. 155, § 2º, CP" ]
    gabarito: "Pedido subsidiário: aplicação do furto privilegiado, já que Rita é primária e o objeto furtado é de pequeno valor, conforme o § 2º do artigo 155 do CP."
    revisao: { status: revisado }
  - id: 12-peca-4-3
    categoria: peca-detalhe
    parte: peca
    item: "4.3"
    secao: merito
    pergunta: "O juiz usou a mesma condenação para elevar a pena-base e como agravante. Que princípio isso viola?"
    tese: "Vedação do bis in idem: a mesma condenação não pode elevar a pena-base e servir de agravante"
    aceitos: [ [ "bis in idem" ], [ "dupla valoracao | dupla puni*" ] ]
    artigos: [ "Súmula 241 STJ" ]
    gabarito: "Impossibilidade de bis in idem: o trânsito em julgado da sentença de estelionato não pode ensejar, ao mesmo tempo, elevação da pena-base e da pena intermediária, pois não se admite o bis in idem."
    revisao: { status: revisado }
  - id: 12-peca-4-4
    categoria: peca-detalhe
    parte: peca
    item: "4.4"
    secao: merito
    pergunta: "Na segunda fase da dosimetria, Rita deveria ser tratada como reincidente?"
    tese: "Afastamento da reincidência: ela era primária, porque o furto é anterior ao trânsito em julgado da condenação por estelionato"
    aceitos: [ [ "primaria" ], [ "nao e reincidente | nao ha reincidencia | nao reincidente | sem reincidencia | nao era reincidente" ] ]
    artigos: [ "art. 63, CP" ]
    gabarito: "Não há reincidência, pois o furto foi cometido antes do trânsito em julgado definitivo do estelionato, ausentes os pressupostos do Art. 63 do CP."
    revisao: { status: revisado }
  - id: 12-peca-4-5
    categoria: peca-detalhe
    parte: peca
    item: "4.5"
    secao: merito
    pergunta: "Sem a reincidência e com pena de até 4 anos, que regime inicial a defesa deve pedir?"
    tese: "Regime inicial aberto para a ré primária com pena de até 4 anos"
    aceitos: [ "aberto" ]
    artigos: [ "art. 33, § 2º, c, CP", "Súmula 269 STJ" ]
    gabarito: "Como a ré não é reincidente, faz jus ao regime aberto, conforme o Art. 33, § 2º, ‘c’, do CP ou Súmula 269 do STJ."
    revisao: { status: revisado }
  - id: 12-peca-4-6
    categoria: peca-detalhe
    parte: peca
    item: "4.6"
    secao: merito
    pergunta: "Além do regime, o que a defesa deve pedir quanto à espécie de pena?"
    tese: "Substituição da pena privativa de liberdade por restritiva de direitos (ou aplicação só da multa)"
    aceitos: [ [ "substitui*" ], [ "multa" ] ]
    artigos: [ "art. 44, CP", "art. 155, § 2º, CP" ]
    gabarito: "Possibilidade de substituição da pena privativa de liberdade por restritiva de direitos, conforme Art. 44 do CP OU possibilidade de aplicação da pena de multa, conforme art. 155, § 2º, do CP."
    revisao: { status: revisado }
  - id: 12-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que espécie de flagrante Ricardo sofreu?"
    tese: "Flagrante preparado (ou provocado)"
    aceitos: [ "preparado | provocado" ]
    artigos: [ "Súmula 145 STF" ]
    gabarito: "A situação narrada configura hipótese de flagrante preparado (ou provocado). Tal prisão em flagrante é nula e deve ser imediatamente relaxada, haja vista o fato de ter sido preparada por um agente provocador, que adotou medidas aptas a impedir por completo a consumação do crime.\n\nInclusive, o Verbete 145 da Súmula do STF disciplina que nas situações como a descrita no enunciado inexiste crime.\n\nAplica-se, também, o Art. 17 do Código Penal: o flagrante preparado constitui hipótese de crime impossível.\n\nSendo assim, a melhor tese defensiva aplicável a Ricardo é aquela no sentido de excluir a prática de crime com base no Verbete 145, da Súmula do STF, e no Art. 17, do Código Penal.\n\nNote-se que o enunciado da questão deixa claro que busca a melhor tese defensiva no campo jurídico-penal. Assim, eventuais respostas indicativas de soluções no âmbito processual (tais como: prisão ilegal que deve ser relaxada), ainda que corretas, não serão consideradas para efeito de pontuação, haja vista o fato de não responderem ao questionado.\n\nDIREITO PENAL"
    revisao: { status: revisado }
  - id: 12-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Qual a melhor tese defensiva quanto à responsabilidade penal de Ricardo?"
    tese: "Crime impossível: o fato é atípico"
    aceitos: [ [ "crime impossivel" ], [ "atipic*" ] ]
    artigos: [ "art. 17, CP", "Súmula 145 STF" ]
    gabarito: "A situação narrada configura hipótese de flagrante preparado (ou provocado). Tal prisão em flagrante é nula e deve ser imediatamente relaxada, haja vista o fato de ter sido preparada por um agente provocador, que adotou medidas aptas a impedir por completo a consumação do crime.\n\nInclusive, o Verbete 145 da Súmula do STF disciplina que nas situações como a descrita no enunciado inexiste crime.\n\nAplica-se, também, o Art. 17 do Código Penal: o flagrante preparado constitui hipótese de crime impossível.\n\nSendo assim, a melhor tese defensiva aplicável a Ricardo é aquela no sentido de excluir a prática de crime com base no Verbete 145, da Súmula do STF, e no Art. 17, do Código Penal.\n\nNote-se que o enunciado da questão deixa claro que busca a melhor tese defensiva no campo jurídico-penal. Assim, eventuais respostas indicativas de soluções no âmbito processual (tais como: prisão ilegal que deve ser relaxada), ainda que corretas, não serão consideradas para efeito de pontuação, haja vista o fato de não responderem ao questionado.\n\nDIREITO PENAL"
    revisao: { status: revisado }
  - id: 12-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que recurso cabe contra a decisão que determinou a desinternação de Marcos?"
    tese: "Agravo em execução"
    aceitos: [ "agravo" ]
    artigos: [ "art. 197, LEP" ]
    gabarito: "Como se trata de decisão proferida pelo juiz da execução penal, o recurso cabível é o Agravo, previsto no Art. 197, da Lei de Execução Penal - 7.210/84."
    revisao: { status: revisado }
  - id: 12-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Qual o prazo desse recurso?"
    tese: "Prazo de 5 dias para o agravo em execução"
    aceitos: [ "5 dias | cinco dias" ]
    artigos: [ "Súmula 700 STF" ]
    gabarito: "O prazo para a interposição do recurso é de 05 (cinco) dias, contados da data da publicação da decisão no D.O., conforme dispõem as Súmulas do STF 699 e 700.\n\nSÚMULA 699 - O PRAZO PARA INTERPOSIÇÃO DE AGRAVO, EM PROCESSO PENAL, É DE CINCO DIAS, DE ACORDO COM A LEI 8038/1990, NÃO SE APLICANDO O DISPOSTO A RESPEITO NAS ALTERAÇÕES DA LEI 8950/1994 AO CÓDIGO DE PROCESSO CIVIL.\n\nSÚMULA 700 - É DE CINCO DIAS O PRAZO PARA INTERPOSIÇÃO DE AGRAVO CONTRA DECISÃO DO JUIZ DA EXECUÇÃO PENAL."
    revisao: { status: revisado }
  - id: 12-q4-c
    categoria: discursiva
    parte: q4
    item: "C"
    pergunta: "Que efeito a interposição desse recurso tem sobre a desinternação de Marcos?"
    tese: "Efeito suspensivo do agravo: a desinternação só vale depois do trânsito em julgado"
    aceitos: [ "re:(?<!nao )suspen" ]
    artigos: [ "art. 179, LEP" ]
    gabarito: "Via de regra, o recurso de Agravo em Execução não tem efeito suspensivo, conforme previsão do Art. 197, da LEP. Todavia, a hipótese tratada no enunciado é a única exceção à regra supramencionada, i.e., o agravo possui, na hipótese do enunciado, efeito suspensivo, conforme previsto no Art. 179, da LEP.\n\nPortanto, a interposição desse recurso suspende a eficácia da sentença.\n\nDIREITO PENAL"
    revisao: { status: revisado }
