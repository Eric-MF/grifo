# Gerado por scripts/gerar-perguntas-exames.ts. Revise e marque revisao.status: revisado.
exame: "12"
perguntas:
  - id: 12-peca-1
    categoria: peca-detalhe
    parte: peca
    item: "1"
    secao: enderecamento
    caso: |-
      Rita, senhora de 60 anos, foi presa em flagrante no dia 10/11/2011 (quinta-feira), ao sair da filial de uma grande rede de farmácias, após ter furtado cinco tintas de cabelo. Para subtrair os itens, Rita arrebentou a fechadura do armário onde estavam os referidos produtos, conforme imagens gravadas pelas câmeras de segurança do estabelecimento. O valor total dos itens furtados perfazia a quantia de R$49,95 (quarenta e nove reais e noventa e cinco centavos).

      Instaurado inquérito policial, as investigações seguiram normalmente. O Ministério Público, então, por entender haver indícios suficientes de autoria, provas da materialidade e justa causa, resolveu denunciar Rita pela prática da conduta descrita no Art. 155, § 4º, inciso I, do CP (furto qualificado pelo rompimento de obstáculo). A denúncia foi regularmente recebida pelo juízo da 41ª Vara Criminal da Comarca da Capital do Estado ‘X’ e a ré foi citada para responder à acusação, o que foi devidamente feito. O processo teve seu curso regular e, durante todo o tempo, a ré ficou em liberdade.

      Na audiência de instrução e julgamento, realizada no dia 18/10/2012 (quinta-feira), o Ministério Público apresentou certidão cartorária apta a atestar que no dia 15/05/2012 (terça-feira) ocorrera o trânsito em julgado definitivo de sentença que condenava Rita pela prática do delito de estelionato. A ré, em seu interrogatório, exerceu o direito ao silêncio. As alegações finais foram orais; acusação e defesa manifestaram-se. Finda a instrução criminal, o magistrado proferiu sentença em audiência. Na dosimetria da pena, o magistrado entendeu por bem elevar a penabase em patamar acima do mínimo, ao argumento de que o trânsito em julgado de outra sentença condenatória configurava maus antecedentes; na segunda fase da dosimetria da pena o magistrado também entendeu ser cabível a incidência da agravante da reincidência, levando em conta a data do trânsito em julgado definitivo da sentença de estelionato, bem como a data do cometimento do furto (ora objeto de julgamento); não verificando a incidência de nenhuma causa de aumento ou de diminuição, o magistrado fixou a pena definitiva em 4 (quatro) anos de reclusão no regime inicial semiaberto e 80 (oitenta) dias-multa. O valor do dia-multa foi fixado no patamar mínimo legal. Por entender que a ré não atendia aos requisitos legais, o magistrado não substituiu a pena privativa de liberdade por pena restritiva de direitos. Ao final, assegurou-se à ré o direito de recorrer em liberdade.

      O advogado da ré deseja recorrer da decisão.

      Atento ao caso narrado e levando em conta tão somente as informações contidas no texto, elabore o recurso cabível. (Valor: 5,0)
    comando: A quem deve ser endereçada a peça?
    gabarito: "Endereçamento da petição de interposição: Juiz da 41ª Vara Criminal da Comarca da Capital do Estado ‘X’."
    opcoes:
      correta: "Endereçamento da petição de interposição: Juiz da 41ª Vara Criminal da Comarca da Capital do Estado ‘X’."
      erradas:
        - "Endereçamento correto das razões: Tribunal de Justiça do Estado."
        - "Endereçamento: Tribunal de Justiça do Estado do Rio de Janeiro."
        - "Endereçamento correto (Juiz da 1ª Vara Criminal – Tribunal do Júri) e indicação da norma: art. 581, IV, CPP."
        - "Endereçamento: Juízo da Vara de Execuções Penais de Belo Horizonte/MG"
        - "Endereçamento: Tribunal de Justiça do Estado do Rio de Janeiro"
    revisao: &a1
      status: revisado
