    caso: |-
      Marcos, jovem inimputável conforme o Art. 26 do CP, foi denunciado pela prática de determinado crime.

      Após o regular andamento do feito, o magistrado entendeu por bem aplicar medida de segurança consistente em internação em hospital psiquiátrico por período mínimo de 03 (três) anos. Após o cumprimento do período supramencionado, o advogado de Marcos requer ao juízo de execução que seja realizado o exame de cessação de periculosidade, requerimento que foi deferido. É realizada uma rigorosa perícia, e os experts atestam a cura do internado, opinando, consequentemente, por sua desinternação. O magistrado então, baseando-se no exame pericial realizado por médicos psiquiatras, exara sentença determinando a desinternação de Marcos. O Parquet, devidamente intimado da sentença proferida pelo juízo da execução, interpõe o recurso cabível na espécie.

      A partir do caso apresentado, responda, fundamentadamente, aos itens a seguir.
    comando: A interposição desse recurso suspende ou não a eficácia da sentença proferida pelo magistrado?
    gabarito: |-
      Via de regra, o recurso de Agravo em Execução não tem efeito suspensivo, conforme previsão do Art. 197, da LEP. Todavia, a hipótese tratada no enunciado é a única exceção à regra supramencionada, i.e., o agravo possui, na hipótese do enunciado, efeito suspensivo, conforme previsto no Art. 179, da LEP.

      Portanto, a interposição desse recurso suspende a eficácia da sentença.

      DIREITO PENAL
    opcoes:
      correta: "- A interposição desse recurso suspende a eficácia da sentença, conforme previsto no Art. 179, da LEP c/c Art. 197, da LEP."
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Remessa dos autos ao órgão superior do Ministério Público, a fim de que seja oferecido o Acordo de Não Persecução Penal, nos termos do Art. 28-A, § 14º, do CPP.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
