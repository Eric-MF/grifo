  - id: 29-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      No dia 01 de janeiro de 2008, após ingerir bebida alcoólica, Caio, 50 anos, policial militar reformado, efetuou dois disparos de arma de fogo em direção à parede de sua casa vazia, localizada no interior de grande quintal, com arma de sua propriedade, devidamente registrada e com posse autorizada.

      Apesar de os tiros terem sido efetuados em direção ao interior do imóvel, vizinhos que passavam pela rua naquele momento, ao ouvirem os disparos, entraram em contato com a Polícia Militar, que compareceu ao local e constatou que as duas munições deflagradas ficaram alojadas na parede do imóvel, sendo a perícia acostada ao procedimento. Caio obteve liberdade provisória e foi denunciado como incurso nas sanções do Art. 15 da Lei nº 10.826/03, não sendo localizado, porém, por ocasião da citação, por ter mudado de endereço, apesar das diversas diligências adotadas pelo juízo.

      Após não ser localizado, Caio foi corretamente citado por edital e, não comparecendo, nem constituindo advogado, foi aplicado o Art. 366 do Código de Processo Penal, suspendendo-se o processo e o curso do prazo prescricional, em 04 de abril de 2008. Em 06 de julho de 2018, o novo juiz titular da vara criminal competente determinou que fossem realizadas novas diligências na tentativa de localizar o denunciado, confirmando que o processo, assim como o curso do prazo prescricional, deveria permanecer suspenso.

      Com base nas informações narradas, na condição de advogado(a) de Caio, que veio a tomar conhecimento dos fatos em julho de 2018, responda aos questionamentos a seguir.
    comando: Existe argumento para questionar a decisão do magistrado que, em julho de 2018, determinou que o processo e o curso do prazo prescricional permanecessem suspensos?
    gabarito: A decisão do magistrado não foi correta. De fato, uma vez que o denunciado não foi localizado para citação pessoal, seria cabível sua citação por edital. Em consequência, não comparecendo o denunciado e nem constituindo advogado, em razão da natureza de citação ficta, o processo, assim como o curso do prazo prescricional, deve ficar suspenso. Ocorre que uma suspensão indefinida do prazo prescricional acabaria por criar um crime, na prática, imprescritível, o que, de acordo com grande parte da doutrina, não poderia ocorrer através de legislação ordinária. Diante disso, através da Súmula 415 do STJ, foi pacificado o entendimento de que a suspensão do prazo prescricional somente poderia durar o período do prazo prescricional, regulado pela pena máxima do crime imputado. O delito do Art. 15 da Lei nº 10.826/03 tem pena máxima prevista de 04 anos, de modo que o prazo prescricional seria de 08 anos. Desde a suspensão do processo, na forma do Art. 366 do CPP, passaram-se mais de 08 anos, logo o prazo prescricional deveria voltar a correr em abril de 2016, sendo equivocada a decisão do magistrado de, em 2018, determinar que fosse mantida a suspensão do prazo prescricional.
    opcoes:
      correta: Sim, a suspensão da prescrição somente poderia durar o período do prazo prescricional, computado de acordo com o máximo da pena em abstrato prevista, voltando a correr em abril de 2016, nos termos da Súmula 415 do STJ.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
    revisao: *a1
