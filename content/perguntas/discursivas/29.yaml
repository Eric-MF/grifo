  - id: 29-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Em patrulhamento de rotina, policiais militares receberam uma informação não identificada de que Wesley, que estava parado em frente à padaria naquele momento, estaria envolvido com o tráfico de drogas da localidade.

      Diante disso, os policiais identificaram e realizaram a abordagem de Wesley, não sendo, em um primeiro momento, encontrado qualquer material ilícito com ele. Diante da notícia recebida momentos antes da abordagem, porém, e considerando que o crime de associação para o tráfico seria de natureza permanente, os policiais apreenderam o celular de Wesley e, sem autorização, passaram a ter acesso às fotografias e conversas no WhatsApp, sendo verificado que existiam fotos armazenadas de Wesley portando suposta arma de fogo, bem como conversas sobre compra e venda de material entorpecente.

      Entendendo pela existência de flagrante em relação ao crime permanente de associação para o tráfico, Wesley foi encaminhado para a Delegacia, sendo lavrado auto de prisão em flagrante. Após liberdade concedida em audiência de custódia, Wesley é denunciado como incurso nas sanções do Art. 35 da Lei nº 11.343/06. No curso da instrução, foram acostadas imagens das conversas de Wesley via aplicativo a que os agentes da lei tiveram acesso, assim como das fotografias. Os policiais foram ouvidos em audiência, ocasião em que confirmaram as circunstâncias do flagrante. O réu exerceu seu direito ao silêncio.

      Com base nas fotografias acostadas, o juiz competente julgou a pretensão punitiva do estado procedente, aplicando a pena mínima de 03 anos de reclusão, além de multa, e fixando o regime inicial fechado, já que o crime imputado seria equiparado a hediondo. Ainda assim, substituiu a pena privativa de liberdade por restritiva de direitos.

      Considerando as informações narradas, responda, na condição de advogado(a) de Wesley, intimado(a) para apresentação de recurso de apelação.
    comando: Existe argumento a ser apresentado para questionar as provas utilizadas pelo magistrado como fundamento para condenação? Justifique.
    gabarito: Sim, existe argumento para questionar as provas que serviram de fundamento para a condenação, tendo em vista que se tratam de provas ilícitas. As provas utilizadas pelo magistrado foram obtidas com violação ao direito à intimidade, já que os policiais obtiveram acesso ao teor das conversas de Wesley por mensagens e suas fotografias sem sua autorização ou sem prévia autorização judicial. Ocorreu violação à garantia de inviolabilidade da intimidade e vida privada, assegurada no Art. 5º, inciso X, da CRFB, já que não houve o indispensável requerimento (e autorização judicial) de quebra de sigilo de dados. Dessa forma, estamos diante de provas ilícitas, que devem ser desentranhadas do processo, nos termos do Art. 157 do CPP.
    opcoes:
      correta: Sim, a prova foi obtida por meio ilícito, diante da ausência de autorização judicial para quebra de sigilo de dados OU diante da ausência de autorização de Wesley para acesso ao conteúdo de seu celular, com violação ao direito à intimidade/privacidade/vida privada.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
