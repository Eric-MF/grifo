# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "29"
introducoes:
  peca: "Guilherme cumpria no semiaberto uma pena de 6 anos e trabalhava para remir a pena quando acharam um celular escondido no colchão dele. O diretor do presídio registrou de imediato a falta grave, sem ouvi-lo, e o juiz da execução, a pedido do Ministério Público, determinou a regressão ao regime fechado, a perda de todos os dias remidos e o reinício dos prazos do livramento condicional e do indulto. Guilherme nunca foi ouvido sobre a falta. Você foi procurado assim que ele foi intimado da decisão."
  q1: "Os irmãos Caio e Bruno, cada um sem saber do outro, entraram ao mesmo tempo na casa dos vizinhos: Caio levou um celular de R$ 500, e Bruno, uma bolsa de R$ 450. Os dois têm só um processo por estelionato, sem condenação definitiva. Foram condenados por furto qualificado pelo concurso de pessoas à pena mínima de 2 anos, no regime aberto, substituída por restritiva de direitos."
  q2: "Em 1/1/2008, depois de beber, Caio deu dois tiros na parede da própria casa, vazia e no meio de um grande quintal, com arma registrada. Vizinhos que passavam na rua ouviram e chamaram a polícia. Denunciado por disparo de arma de fogo, Caio não foi encontrado e foi citado por edital; em 4/4/2008, o processo e a prescrição foram suspensos. Em julho de 2018, o novo juiz mandou continuar as buscas e manteve suspensos o processo e a prescrição."
  q3: "Por uma denúncia anônima, policiais abordaram Wesley, que estava em frente a uma padaria, e nada encontraram. Mesmo assim, pegaram o celular dele e, sem autorização, abriram as fotos e as conversas, onde havia fotos dele com uma suposta arma e conversas sobre compra e venda de drogas. Com base nessas fotos, Wesley foi condenado por associação para o tráfico à pena mínima de 3 anos, no regime fechado, por ser o crime equiparado a hediondo, com a pena substituída por restritivas de direitos."
  q4: "No processo de Antônio por constituição de milícia privada, as testemunhas de acusação faltaram, e o juiz, por economia processual, ouviu primeiro as de defesa, apesar do protesto do advogado. Uma delas, Pablo, mentiu para ajudar Antônio e foi denunciado por falso testemunho. Na audiência seguinte, ainda antes da sentença do processo de Antônio, Pablo voltou a depor e disse que tinha mentido. Antônio foi condenado, e Pablo também, com a atenuante de ter procurado reduzir as consequências do crime."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["29-peca-1", "29-peca-3", "29-peca-4", "29-peca-5", "29-peca-6-1", "29-peca-9", "29-peca-10"]
perguntas:
  - id: 29-peca-5-1
    categoria: peca-detalhe
    parte: peca
    item: "5.1"
    secao: merito
    pergunta: "Por que o reconhecimento da falta grave pelo diretor é inválido?"
    tese: "Nulidade do reconhecimento da falta grave, que exige procedimento administrativo disciplinar prévio, com direito de defesa"
    aceitos: [ "procedimento administrativo | procedimento disciplinar | pad" ]
    artigos: [ "Súmula 533 STJ" ]
    gabarito: "O reconhecimento de falta grave depende de prévio procedimento administrativo, garantido o direito de defesa, conforme a Súmula 533 do STJ"
    revisao: { status: revisado }
  - id: 29-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Ainda que válida a falta grave, o que a defesa deve sustentar quanto aos dias remidos?"
    tese: "A perda dos dias remidos pela falta grave é limitada a 1/3"
    aceitos: [ "1/3 | um terco | ate um terco" ]
    artigos: [ "art. 127, LEP" ]
    gabarito: "Não é possível a perda da totalidade dos dias remidos, conforme Art. 127 da LEP."
    revisao: { status: revisado }
  - id: 29-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "O que a defesa deve sustentar quanto ao prazo do livramento condicional?"
    tese: "A falta grave não interrompe a contagem do prazo para o livramento condicional"
    aceitos: [ "nao interrompe | nao reinicia | nao gera reinicio | nao gera o reinicio | nao recomeca | nao zera | sem interrupcao" ]
    artigos: [ "Súmula 441 STJ" ]
    gabarito: "A prática de falta grave não gera o reinício da contagem do prazo do livramento condicional, nos termos da Súmula 441 do STJ."
    revisao: { status: revisado }
  - id: 29-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "O que a defesa deve sustentar quanto ao prazo do indulto?"
    tese: "A falta grave não interrompe a contagem do prazo para o indulto"
    aceitos: [ "nao interrompe | nao reinicia | nao gera reinicio | nao gera o reinicio | nao recomeca | nao zera | sem interrupcao" ]
    artigos: [ "Súmula 535 STJ" ]
    gabarito: "A prática de falta grave não gera o reinício da contagem do prazo de indulto, nos termos da Súmula 535 do STJ."
    revisao: { status: revisado }
  - id: 29-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento de direito material contesta a capitulação do furto?"
    tese: "Afastamento da qualificadora do concurso de pessoas: não havia liame subjetivo entre os irmãos"
    aceitos: [ "liame subjetivo | vinculo subjetivo | acordo de vontades | unidade de designios | liame" ]
    artigos: [ "art. 155, § 4º, IV, CP", "art. 29, CP" ]
    gabarito: "Sim, a capitulação jurídica realizada pelo Ministério Público e acolhida na sentença poderá ser questionada, tendo em vista que não deveria ter sido imputada a qualificadora do concurso de agentes. O Art. 155, § 4º, inciso IV, do CP prevê qualificadora do furto quando este for praticado mediante concurso de duas ou mais pessoas.\n\nOcorre que, apesar de Caio e Bruno serem irmãos e terem praticado crimes de furto no mesmo local, data e horário, não houve concurso de agentes. Dentre os requisitos para configuração do concurso de agentes está o liame subjetivo, que não restou configurado na hipótese apresentada. A todo momento o enunciado deixa claro que Caio e Bruno sequer sabiam da conduta um do outro, não havendo que se falar, então, em comunhão de ações e desígnios e, consequentemente, concurso de agentes, apesar de configurado o crime de furto simples em relação a ambos."
    revisao: { status: revisado }
  - id: 29-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Mantida a qualificadora, que argumento reduz a pena?"
    tese: "Furto privilegiado, compatível com a qualificadora objetiva: réus primários e coisa de pequeno valor"
    aceitos: [ "privilegi*" ]
    artigos: [ "Súmula 511 STJ", "art. 155, § 2º, CP" ]
    gabarito: "Mesmo em caso de manutenção da capitulação apresentada, ou seja, de furto qualificado, seria possível a redução da pena aplicada em razão do privilégio previsto no Art. 155, § 2º, do CP. Apesar de os agentes responderem a outras ações penais, nos termos da Súmula 444 do STJ, não havendo sentença condenatória anterior com trânsito em julgado, são considerados tecnicamente primários e de bons antecedentes. Ademais, as coisas furtadas podem ser consideradas de pequeno valor, não havendo que se falar em insignificância, na hipótese, seja pelo valor dos bens seja porque o enunciado indaga sobre a redução da pena aplicada e não afastamento da tipicidade da conduta.\n\nÉ preciso, ainda, ressaltar que os Tribunais Superiores pacificaram o entendimento de que a figura do furto privilegiado poderá ser reconhecida ainda que o crime em questão seja de furto qualificado, topograficamente localizado após a disciplina do privilégio, nos termos da Súmula 511 do Superior Tribunal de Justiça."
    revisao: { status: revisado }
  - id: 29-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que argumento contesta a decisão que manteve suspensa a prescrição em 2018?"
    tese: "Limite da suspensão da prescrição: ela dura no máximo o prazo prescricional da pena máxima em abstrato e voltou a correr em abril de 2016"
    aceitos: [ "pena maxima | maximo da pena | maxima em abstrato | limit*" ]
    artigos: [ "Súmula 415 STJ", "art. 366, CPP" ]
    gabarito: "A decisão do magistrado não foi correta. De fato, uma vez que o denunciado não foi localizado para citação pessoal, seria cabível sua citação por edital. Em consequência, não comparecendo o denunciado e nem constituindo advogado, em razão da natureza de citação ficta, o processo, assim como o curso do prazo prescricional, deve ficar suspenso. Ocorre que uma suspensão indefinida do prazo prescricional acabaria por criar um crime, na prática, imprescritível, o que, de acordo com grande parte da doutrina, não poderia ocorrer através de legislação ordinária. Diante disso, através da Súmula 415 do STJ, foi pacificado o entendimento de que a suspensão do prazo prescricional somente poderia durar o período do prazo prescricional, regulado pela pena máxima do crime imputado. O delito do Art. 15 da Lei nº 10.826/03 tem pena máxima prevista de 04 anos, de modo que o prazo prescricional seria de 08 anos. Desde a suspensão do processo, na forma do Art. 366 do CPP, passaram-se mais de 08 anos, logo o prazo prescricional deveria voltar a correr em abril de 2016, sendo equivocada a decisão do magistrado de, em 2018, determinar que fosse mantida a suspensão do prazo prescricional."
    revisao: { status: revisado }
  - id: 29-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que argumento de direito material leva à absolvição de Caio?"
    tese: "Atipicidade do disparo de arma de fogo: os tiros não foram feitos em lugar habitado nem em via pública ou em direção a ela"
    aceitos: [ "atipic* | lugar habitado | local habitado | via publica" ]
    artigos: [ "art. 15, Lei 10.826" ]
    gabarito: "Sim, existe argumento de direito material a ser apresentado pela defesa técnica de Caio em busca de sua absolvição. Deveria o advogado alegar a atipicidade da conduta, tendo em vista que nem todas as elementares do crime do Art. 15 da Lei nº 10.826/03 foram preenchidas. Em que pese tenha Caio realizado disparos de arma de fogo, não haveria que se falar no crime imputado, pois os disparos não foram realizados em via pública e nem em direção à via pública. Apesar de a rua da residência do denunciado ser habitada, os disparos foram realizados dentro de um quintal, em direção à parede da casa onde não havia ninguém. Independentemente de a conduta ser moralmente reprovável, não foi praticado o delito imputado."
    revisao: { status: revisado }
  - id: 29-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que argumento a defesa pode usar contra as provas da condenação?"
    tese: "Ilicitude da prova: os policiais acessaram as conversas e as fotos do celular sem autorização judicial"
    aceitos: [ "ilicit* | ilegal* | sem autorizacao judicial | autorizacao judicial" ]
    artigos: [ "art. 5, X, CRFB", "art. 157, CPP", "art. 5, XII, CRFB" ]
    gabarito: "Sim, existe argumento para questionar as provas que serviram de fundamento para a condenação, tendo em vista que se tratam de provas ilícitas. As provas utilizadas pelo magistrado foram obtidas com violação ao direito à intimidade, já que os policiais obtiveram acesso ao teor das conversas de Wesley por mensagens e suas fotografias sem sua autorização ou sem prévia autorização judicial. Ocorreu violação à garantia de inviolabilidade da intimidade e vida privada, assegurada no Art. 5º, inciso X, da CRFB, já que não houve o indispensável requerimento (e autorização judicial) de quebra de sigilo de dados. Dessa forma, estamos diante de provas ilícitas, que devem ser desentranhadas do processo, nos termos do Art. 157 do CPP."
    revisao: { status: revisado }
  - id: 29-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Mantida a condenação, que argumento contesta o regime fixado?"
    tese: "A associação para o tráfico não é crime hediondo nem equiparado, e cabe o regime aberto"
    aceitos: [ "nao e hediondo | nao hediondo | nao e equiparado | nao equiparado | aberto" ]
    artigos: [ "art. 2, Lei 8.072", "art. 33, § 2º, c, CP" ]
    gabarito: "O argumento a ser apresentado para questionar a sanção penal aplicada é o de que o crime de associação para o tráfico não é delito equiparado ao hediondo, diferente do tráfico do Art. 33, caput, da Lei nº 11.343/06, tendo em vista que não está previsto no rol taxativo do Art. 1º da Lei nº 8.072/90. Em respeito ao princípio da legalidade, não há que se falar em analogia in malam partem. Considerando que o crime de associação para o tráfico não está previsto na Constituição como equiparado a hediondo e nem é mencionado no Art. 1º da Lei de Crimes Hediondos, não pode o magistrado conferir tal natureza em sua decisão, ainda que exista previsão no sentido de que o prazo do livramento condicional será de mais de 2/3, prazo esse típico dos crimes hediondos e equiparados. Ademais, ainda que fosse considerada a natureza hedionda do delito, a previsão de regime inicial fechado obrigatória vem sendo considerada inconstitucional pelos Tribunais Superiores (Art. 2º, § 1º, da Lei nº 8.072/90) por violar o princípio da individualização da pena."
    revisao: { status: revisado }
  - id: 29-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que argumento processual permite anular a condenação de Antônio?"
    tese: "Nulidade pela inversão da ordem de oitiva: as testemunhas de defesa foram ouvidas antes das de acusação, apesar do protesto"
    aceitos: [ "inver* | ordem" ]
    artigos: [ "art. 400, CPP", "art. 564, IV, CPP" ]
    gabarito: "O advogado de Antônio poderá buscar o reconhecimento da nulidade da sentença condenatória em razão da violação ao devido processo legal. Isso porque, de acordo com o Art. 400 do CPP, na audiência, primeiro devem ser ouvidas as testemunhas da acusação. Somente após a produção de provas pela acusação poderiam ser ouvidas as testemunhas de defesa e interrogado o acusado. Violando a ordem da oitiva das testemunhas, tendo a defesa se insurgido contra tal inversão e ficando claro o prejuízo com a condenação e alteração dos fatos por parte de Pablo, deverá ser reconhecida a nulidade do processo desde a primeira audiência de instrução e julgamento."
    revisao: { status: revisado }
  - id: 29-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que argumento de direito material contesta a condenação de Pablo?"
    tese: "Extinção da punibilidade pela retratação do falso testemunho antes da sentença do processo em que mentiu"
    aceitos: [ "retrata*" ]
    artigos: [ "art. 342, § 2º, CP", "art. 107, VI, CP" ]
    gabarito: "A conduta de Pablo de, em audiência de instrução e julgamento de processo criminal, fazer afirmação falsa como testemunha, a princípio, configura o crime realmente imputado: Art. 342, § 1º, do CP. Ocorre que, até como forma de incentivar a retratação e minorar os prejuízos causados em processos, previu o legislador, no Art. 342, § 2º, do CP, que se o agente se retrata ou declara a verdade antes da sentença ser proferida no processo em que ocorreu o ilícito, o fato deixa de ser punível. No caso, Pablo se retratou, narrou a verdade, antes mesmo de ser proferida a sentença condenatória de Antônio. Dessa forma, não poderia o magistrado reconhecer que tal retratação funcionaria apenas como atenuante do Art. 65, inciso III, alínea b, do CP, ou arrependimento posterior, devendo reconhecer a extinção da punibilidade do agente, já que o fato deixa de ser punível."
    revisao: { status: revisado }
