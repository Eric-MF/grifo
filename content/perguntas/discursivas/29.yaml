  - id: 29-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Caio e Bruno são irmãos e estão em dificuldades financeiras. Caio, que estava sozinho em seu quarto, verifica que a janela da casa dos vizinhos está aberta; então, ingressa no local e subtrai um telefone celular avaliado em R$ 500,00. Ao mesmo tempo, apesar de não saber da conduta de seu irmão, Bruno percebe que a porta da residência dos vizinhos também ficou aberta. Tendo conhecimento que os proprietários eram um casal de empresários muito rico, ingressa no local e subtrai uma bolsa, avaliada em R$ 450,00.

      Os fatos são descobertos dois dias depois, e Bruno e Caio são denunciados pelo crime de furto qualificado (Art. 155, § 4º, inciso IV, do Código Penal), sendo acostadas as Folhas de Antecedentes Criminais (FAC), contendo, cada uma delas, outra anotação pela suposta prática de crime de estelionato, sem, contudo, haver condenação com trânsito em julgado em ambas.

      Após instrução, a pretensão punitiva do Estado é julgada procedente, sendo aplicada pena mínima de 02 anos de reclusão e 10 dias-multa, em regime inicial aberto, devidamente substituída por restritiva de direitos.

      Com base nas informações expostas, intimado(a) para apresentação de recurso, responda, na condição de advogado(a) de Caio e Bruno, aos itens a seguir.
    comando: Existe argumento de direito material a ser apresentado para questionar a capitulação jurídica apresentada pelo Ministério Público e acolhida na sentença?
    gabarito: |-
      Sim, a capitulação jurídica realizada pelo Ministério Público e acolhida na sentença poderá ser questionada, tendo em vista que não deveria ter sido imputada a qualificadora do concurso de agentes. O Art. 155, § 4º, inciso IV, do CP prevê qualificadora do furto quando este for praticado mediante concurso de duas ou mais pessoas.

      Ocorre que, apesar de Caio e Bruno serem irmãos e terem praticado crimes de furto no mesmo local, data e horário, não houve concurso de agentes. Dentre os requisitos para configuração do concurso de agentes está o liame subjetivo, que não restou configurado na hipótese apresentada. A todo momento o enunciado deixa claro que Caio e Bruno sequer sabiam da conduta um do outro, não havendo que se falar, então, em comunhão de ações e desígnios e, consequentemente, concurso de agentes, apesar de configurado o crime de furto simples em relação a ambos.
    opcoes:
      correta: Sim, o argumento seria pela inexistência de liame subjetivo entre os agentes, afastando-se a qualificadora do concurso de pessoas.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
    revisao: *a1
  - id: 29-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Caio e Bruno são irmãos e estão em dificuldades financeiras. Caio, que estava sozinho em seu quarto, verifica que a janela da casa dos vizinhos está aberta; então, ingressa no local e subtrai um telefone celular avaliado em R$ 500,00. Ao mesmo tempo, apesar de não saber da conduta de seu irmão, Bruno percebe que a porta da residência dos vizinhos também ficou aberta. Tendo conhecimento que os proprietários eram um casal de empresários muito rico, ingressa no local e subtrai uma bolsa, avaliada em R$ 450,00.

      Os fatos são descobertos dois dias depois, e Bruno e Caio são denunciados pelo crime de furto qualificado (Art. 155, § 4º, inciso IV, do Código Penal), sendo acostadas as Folhas de Antecedentes Criminais (FAC), contendo, cada uma delas, outra anotação pela suposta prática de crime de estelionato, sem, contudo, haver condenação com trânsito em julgado em ambas.

      Após instrução, a pretensão punitiva do Estado é julgada procedente, sendo aplicada pena mínima de 02 anos de reclusão e 10 dias-multa, em regime inicial aberto, devidamente substituída por restritiva de direitos.

      Com base nas informações expostas, intimado(a) para apresentação de recurso, responda, na condição de advogado(a) de Caio e Bruno, aos itens a seguir.
    comando: Mantida a capitulação acolhida na sentença (Art. 155, § 4º, inciso IV, do Código Penal), existe argumento em busca da redução da pena aplicada?
    gabarito: |-
      Mesmo em caso de manutenção da capitulação apresentada, ou seja, de furto qualificado, seria possível a redução da pena aplicada em razão do privilégio previsto no Art. 155, § 2º, do CP. Apesar de os agentes responderem a outras ações penais, nos termos da Súmula 444 do STJ, não havendo sentença condenatória anterior com trânsito em julgado, são considerados tecnicamente primários e de bons antecedentes. Ademais, as coisas furtadas podem ser consideradas de pequeno valor, não havendo que se falar em insignificância, na hipótese, seja pelo valor dos bens seja porque o enunciado indaga sobre a redução da pena aplicada e não afastamento da tipicidade da conduta.

      É preciso, ainda, ressaltar que os Tribunais Superiores pacificaram o entendimento de que a figura do furto privilegiado poderá ser reconhecida ainda que o crime em questão seja de furto qualificado, topograficamente localizado após a disciplina do privilégio, nos termos da Súmula 511 do Superior Tribunal de Justiça.
    opcoes:
      correta: Sim, aplicação do furto privilegiado, já que a coisa é de pequeno valor e os réus são primários, conforme a Súmula 511 do STJ.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
