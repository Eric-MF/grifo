exame: "29"
perguntas:
  - id: 29-peca-1
    categoria: peca-detalhe
    parte: peca
    item: "1"
    secao: enderecamento
    caso: |-
      Guilherme foi condenado definitivamente pela prática do crime de lesão corporal seguida de morte, sendo-lhe aplicada a pena de 06 anos de reclusão, a ser cumprida em regime inicial fechado, em razão das circunstâncias do fato.

      Após cumprir 01 ano da pena aplicada, Guilherme foi beneficiado com progressão para o regime semiaberto. Na unidade penitenciária, o apenado trabalhava internamente em busca da remição. Durante o cumprimento da pena nesse regime, veio a ser encontrado escondido em seu colchão um aparelho de telefonia celular.

      O diretor do estabelecimento penitenciário, ao tomar conhecimento do fato por meio dos agentes penitenciários, de imediato reconheceu na ficha do preso a prática de falta grave, apenas afirmando que a conduta narrada pelos agentes, e que teria sido praticada por Guilherme, se adequava ao Art. 50, inciso VII, da Lei nº 7.210/84.

      O reconhecimento da falta pelo diretor foi comunicado ao Ministério Público, que apresentou promoção ao juízo da Vara de Execuções Penais de São Paulo, juízo este competente, requerendo a perda de benefícios da execução por parte do apenado. O juiz competente, analisando o requerimento do Ministério Público, decidiu que, “considerando a falta grave reconhecida pelo diretor da unidade, impõe-se: a) a regressão do regime de cumprimento de pena para o fechado; b) perda da totalidade dos dias remidos; c) reinício da contagem do prazo de livramento condicional; d) reinício da contagem do prazo do indulto.”

      Ao ser intimado do teor da decisão, em 09 de julho de 2019, terça-feira, Guilherme entra em contato, de imediato, com você, na condição de advogado(a), esclarecendo que nunca fora ouvido sobre a aplicação da falta grave, apenas tendo conhecimento de que a Defensoria se manifestou no processo de execução após o requerimento do Ministério Público.

      Considerando apenas as informações narradas, na condição de advogado(a) de Guilherme, redija a peça jurídica cabível, diferente de habeas corpus e embargos de declaração, apresentando todas as teses jurídicas pertinentes.

      A peça deverá ser datada no último dia do prazo para interposição, considerando que, em todos os locais do país, de segunda a sexta-feira são dias úteis. (Valor: 5,00).

      Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples menção ou transcrição do dispositivo legal não confere pontuação.
    comando: A quem deve ser endereçada a peça?
    gabarito: "Endereçamento: Juízo da Vara de Execução Penal da Comarca de São Paulo/SP."
    opcoes:
      correta: "Endereçamento: Juízo da Vara de Execução Penal da Comarca de São Paulo/SP."
      erradas:
        - "Endereçamento correto: Juízo da Vara de Execuções Penais do Rio de Janeiro/RJ."
        - Endereçamento correto das razões (Tribunal de Justiça).
        - "Endereçamento correto: 1ª Vara Criminal da Comarca de Natal/RN"
        - "Endereçamento: Juízo de Direito do Tribunal do Júri da Comarca de Porto Alegre/RS."
        - A petição deve ser endereçada à 05ª Vara Criminal da Comarca de Barnabeu/CN.
    revisao: &a1
      status: rascunho
