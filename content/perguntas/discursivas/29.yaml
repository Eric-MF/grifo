    item: B
    caso: |-
      Em processo no qual se imputava a Antônio a prática do crime de constituição de milícia privada, foi designada audiência de instrução e julgamento para oitiva das testemunhas arroladas pela acusação e pela defesa. No dia da audiência, as testemunhas de acusação não compareceram, determinando o magistrado, por economia processual, a oitiva das testemunhas de defesa presentes, apesar de o advogado de Antônio se insurgir contra esse fato. Na ocasião, foram ouvidas três testemunhas de defesa, dentre as quais Pablo, que prestou declarações falsas para auxiliar o colega nesse processo criminal. Identificada sua conduta, porém, houve extração de peças ao Ministério Público, que, em 09 de abril de 2019, ofereceu denúncia em face de Pablo, imputando-lhe a prática do crime de falso testemunho na forma majorada.

      No processo de Antônio, foi designada nova audiência de instrução e julgamento, ocasião em que foram ouvidas as testemunhas de acusação; novamente, Pablo, a seu pedido, prestou declarações, confirmando que havia mentido na audiência anterior, mas que agora contava a verdade, o que veio a prejudicar a própria defesa do réu.

      Com base nas declarações das testemunhas de acusação e nas novas declarações de Pablo, Antônio veio a ser condenado. Pablo, por sua vez, em seu processo pelo crime de falso testemunho, também veio a ser condenado, reconhecendo o magistrado a atenuante do Art. 65, inciso III, alínea b, do Código Penal.

      Considerando as informações narradas, responda, na condição de advogado(a) de Antônio e Pablo.
    comando: Qual o argumento de direito material a ser apresentado pela defesa técnica de Pablo para questionar a sentença condenatória? Justifique.
    gabarito: "A conduta de Pablo de, em audiência de instrução e julgamento de processo criminal, fazer afirmação falsa como testemunha, a princípio, configura o crime realmente imputado: Art. 342, § 1º, do CP. Ocorre que, até como forma de incentivar a retratação e minorar os prejuízos causados em processos, previu o legislador, no Art. 342, § 2º, do CP, que se o agente se retrata ou declara a verdade antes da sentença ser proferida no processo em que ocorreu o ilícito, o fato deixa de ser punível. No caso, Pablo se retratou, narrou a verdade, antes mesmo de ser proferida a sentença condenatória de Antônio. Dessa forma, não poderia o magistrado reconhecer que tal retratação funcionaria apenas como atenuante do Art. 65, inciso III, alínea b, do CP, ou arrependimento posterior, devendo reconhecer a extinção da punibilidade do agente, já que o fato deixa de ser punível."
    opcoes:
      correta: Houve retratação antes da sentença ser proferida no processo de Antônio, deixando o fato de ser punível, nos termos do Art. 342, § 2º, do CP.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
