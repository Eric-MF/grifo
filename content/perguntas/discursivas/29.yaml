      Com base nas fotografias acostadas, o juiz competente julgou a pretensão punitiva do estado procedente, aplicando a pena mínima de 03 anos de reclusão, além de multa, e fixando o regime inicial fechado, já que o crime imputado seria equiparado a hediondo. Ainda assim, substituiu a pena privativa de liberdade por restritiva de direitos.

      Considerando as informações narradas, responda, na condição de advogado(a) de Wesley, intimado(a) para apresentação de recurso de apelação.
    comando: Mantida a condenação, qual o argumento a ser apresentado para questionar a sanção penal aplicada? Justifique.
    gabarito: O argumento a ser apresentado para questionar a sanção penal aplicada é o de que o crime de associação para o tráfico não é delito equiparado ao hediondo, diferente do tráfico do Art. 33, caput, da Lei nº 11.343/06, tendo em vista que não está previsto no rol taxativo do Art. 1º da Lei nº 8.072/90. Em respeito ao princípio da legalidade, não há que se falar em analogia in malam partem. Considerando que o crime de associação para o tráfico não está previsto na Constituição como equiparado a hediondo e nem é mencionado no Art. 1º da Lei de Crimes Hediondos, não pode o magistrado conferir tal natureza em sua decisão, ainda que exista previsão no sentido de que o prazo do livramento condicional será de mais de 2/3, prazo esse típico dos crimes hediondos e equiparados. Ademais, ainda que fosse considerada a natureza hedionda do delito, a previsão de regime inicial fechado obrigatória vem sendo considerada inconstitucional pelos Tribunais Superiores (Art. 2º, § 1º, da Lei nº 8.072/90) por violar o princípio da individualização da pena.
    opcoes:
      correta: O crime de associação para o tráfico não é delito equiparado a hediondo porque não está previsto no Art. 1º da Lei nº 8.072 OU porque não cabe analogia in malam partem, OU em respeito ao princípio da legalidade, podendo ser aplicado regime aberto.
      erradas:
        - "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados, prevista no Art. 2º, § 1º, da Lei nº 8.072/90, por violar o Princípio da Individualização da Pena Obs.: a mera citação do dispositivo legal não será pontuada."
        - "Poderia argumentar que não agiu com dolo, / agiu em erro de tipo (0,6), nos termos do art. 20 caput OU art. 20, §2º, do CP. (0,2). Obs.: A mera indicação do artigo não é pontuada."
        - A fundamentação não foi suficiente porque a gravidade em abstrato do crime não é argumento hábil a fundamentar uma prisão
        - Bruna era inimputável na data dos fatos OU Bruna deveria responder por ato infracional, tendo em vista que era menor de 18 anos na data dos fatos, ainda que maior no momento do resultado OU em razão da Teoria da Atividade, nos termos do Art. 4º OU Art. 27 do Código de Processo Penal OU Art. 228 da CRFB/88.
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
