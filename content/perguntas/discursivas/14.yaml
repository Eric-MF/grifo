    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Da tese da prática de crime único, pois o delito de estupro de vulnerável é um tipo misto alternativo (de conteúdo múltiplo ou variado).
    opcoes:
      correta: Da tese da prática de crime único, pois o delito de estupro de vulnerável é um tipo misto alternativo (de conteúdo múltiplo ou variado).
      erradas:
        - Memoriais endereçados ao Juiz do Tribunal do Júri.
        - Afastamento da agravante do Art. 61, inciso II, alínea ´f´, do CP, pois o crime não foi praticado em situação de violência doméstica, familiar ou de coabitação contra mulher.
        - "Da aplicação do princípio da consunção ou absorção: o crime de violação de domicílio deve ser absorvido pelo delito de furto qualificado, pois configurou crime-meio, essencial à execução do crime-fim; deve ser excluída a condenação pela violação de domicílio."
        - Absolvição sumária, tendo em vista que a conduta narrada evidentemente não constitui crime.
        - Redução do quantum de aumento realizado na terceira fase da dosimetria do crime de roubo, já que os fatos foram praticados antes da entrada em vigor da lei que aumentou o percentual de aumento em razão do emprego de arma de fogo OU em razão do princípio da irretroatividade da lei penal prejudicial ao réu, conforme Art. 5º, inciso XL, da CRFB.
    revisao: *a1
