      De acordo com a jurisprudência atualizada dos Tribunais Superiores, responda aos itens a seguir.
    comando: Qual o prazo e para qual Tribunal deverá ser dirigido?
    gabarito: De acordo com a jurisprudência atualizada, tanto do STJ como do STF, bem como com o mandamento descrito no Art. 105, II, “a”, da Constituição Federal, em Habeas Corpus caberá Recurso Ordinário. O Art. 30, da Lei nº 8.038/90, determina ser de 05 (cinco) dias o prazo para interposição de recurso ordinário contra decisão denegatória de Habeas Corpus proferida pelos Tribunais dos Estados. No caso narrado no enunciado, o recurso deve ser dirigido ao Superior Tribunal de Justiça, conforme informa o Art. 105, II, “a”, da Constituição Federal, já que se trata de decisão proferida pelo Tribunal de Justiça.
    opcoes:
      correta: O recurso deve ser dirigido ao Superior Tribunal de Justiça, no prazo de 05 (cinco) dias
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento é que houve concurso formal de crimes, tendo em vista que, com uma só ação, foram praticados dois delitos, nos termos do Art. 70 do CP.
        - O argumento seria o de que deveria ter sido reconhecida a atenuante da reparação do dano, tendo em vista que o denunciado devolveu o valor obtido indevidamente, nos termos do Art. 65, inciso III, alínea b, do CP.
    revisao: *a1
