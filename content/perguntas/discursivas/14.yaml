    opcoes:
      correta: "Justiça Estadual, pois o BB está fora do alcance da regra insculpida no artigo 109, IV da CF, sendo certo que a competência da Justiça Estadual é residual OU Justiça Estadual, nos termos do verbete 42 da Súmula do STJ. Obs.: a mera indicação de artigo ou súmula não pontua."
      erradas:
