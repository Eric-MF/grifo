        - "A hipótese é de resultado diverso do pretendido (art. 74 do CP), devendo responder por dano em concurso formal com o crime de homicídio culposo. OBS.: a mera indicação de dispositivo legal ou transcrição de seu conteúdo não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - O argumento é de que a prova é ilícita, tendo em vista que não poderia ter havido transcrição da conversa travada entre Flávio e seu advogado, que tem direito ao sigilo ou inviolabilidade das comunicações, não sendo o advogado coautor de crimes e nem figurando como investigado, nos termos do Art. 7º, inciso II ou III, da Lei nº 8.906/94 ou Art. 157 caput do CPP ou Art. 5º, inciso LVI da CRFB/88.
    revisao: *a1
  - id: 14-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Cristiano foi denunciado pela prática do delito tipificado no Art. 171, do Código Penal. No curso da instrução criminal, o magistrado que presidia o feito decretou a prisão preventiva do réu, com o intuito de garantir a ordem pública, “já que o crime causou grave comoção social, além de tratar-se de um crime grave, que coloca em risco a integridade social, configurando conduta inadequada ao meio social.”

      O advogado de Cristiano, inconformado com a fundamentação da medida constritiva de liberdade, impetrou Habeas Corpus perante o Tribunal de Justiça, no intuito de relaxar tal prisão, já que a considerava ilegal, tendo em vista que toda decisão judicial deve estar amparada em uma fundamentação idônea.

      O Tribunal de Justiça, por unanimidade, não concedeu a ordem, entendendo que a decisão que decretou a prisão preventiva estava corretamente fundamentada.

      De acordo com a jurisprudência atualizada dos Tribunais Superiores, responda aos itens a seguir.
    comando: Qual o recurso que o advogado de Cristiano deve manejar visando à reforma do acórdão?
    gabarito: De acordo com a jurisprudência atualizada, tanto do STJ como do STF, bem como com o mandamento descrito no Art. 105, II, “a”, da Constituição Federal, em Habeas Corpus caberá Recurso Ordinário. O Art. 30, da Lei nº 8.038/90, determina ser de 05 (cinco) dias o prazo para interposição de recurso ordinário contra decisão denegatória de Habeas Corpus proferida pelos Tribunais dos Estados. No caso narrado no enunciado, o recurso deve ser dirigido ao Superior Tribunal de Justiça, conforme informa o Art. 105, II, “a”, da Constituição Federal, já que se trata de decisão proferida pelo Tribunal de Justiça.
    opcoes:
      correta: Recurso Ordinário.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "A hipótese é de resultado diverso do pretendido (art. 74 do CP), devendo responder por dano em concurso formal com o crime de homicídio culposo. OBS.: a mera indicação de dispositivo legal ou transcrição de seu conteúdo não será pontuada."
        - O requerimento a ser formulado é de relaxamento da prisão, tendo em vista que não está presente nenhuma das situações de flagrante elencadas no Art. 302 do CPP.
        - O argumento é o de que o reconhecimento realizado não foi válido, pois não foram observadas as formalidades legais, nos termos do Art. 226 do CPP.
    revisao: *a1
  - id: 14-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
