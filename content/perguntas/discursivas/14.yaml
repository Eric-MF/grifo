    opcoes:
      correta: "Não foi correta a decisão do Tribunal de Justiça, pois o Tribunal não pode acolher, contra o réu, nulidade não arguida pela acusação em seu recurso. OU Não foi correta a decisão, nos termos do Verbete 160 ou 713 da Súmula do STF. OU Não foi correta a decisão, com base no princípio que veda a reformatio in pejus indireta. Obs.: A justificativa é essencial para a atribuição de pontos."
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "A hipótese é de resultado diverso do pretendido (art. 74 do CP), devendo responder por dano em concurso formal com o crime de homicídio culposo. OBS.: a mera indicação de dispositivo legal ou transcrição de seu conteúdo não será pontuada."
        - O requerimento a ser formulado é de relaxamento da prisão, tendo em vista que não está presente nenhuma das situações de flagrante elencadas no Art. 302 do CPP.
        - O argumento seria o de que deveria ter sido reconhecida a atenuante da reparação do dano, tendo em vista que o denunciado devolveu o valor obtido indevidamente, nos termos do Art. 65, inciso III, alínea b, do CP.
    revisao: *a1
  - id: 14-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Mário foi condenado a 24 (vinte e quatro) anos de reclusão no regime inicialmente fechado, com trânsito em julgado no dia 20/04/2005, pela prática de latrocínio (artigo 157, § 3º, parte final, do Código Penal).

      Iniciou a execução da pena no dia seguinte. No dia 22/04/2009, seu advogado, devidamente constituído nos autos da execução penal, ingressou com pedido de progressão de regime, com fulcro no artigo 112 da Lei de Execuções Penais. O juiz indeferiu o pedido com base no artigo 2º, § 2º, da Lei 8.072/90, argumentando que o condenado não preencheu o requisito objetivo para a progressão de regime.

      Como advogado de Mário, responda, de forma fundamentada e de acordo com o entendimento sumulado dos Tribunais Superiores, aos itens a seguir:
    comando: Excetuando-se a possibilidade de Habeas Corpus, qual recurso deve ser interposto pelo advogado de Mário e qual o respectivo fundamento legal?
    gabarito: |-
      A questão objetiva extrair do examinando conhecimento acerca da lei penal no tempo (regramento legal e entendimento jurisprudencial), bem como da execução penal.

      Nesse sentido, relativamente à alternativa “A”, o examinando deve indicar que o recurso a ser interposto é o agravo, previsto no artigo 197 da LEP.

      Tendo em conta a própria natureza do Exame de Ordem, a mera indicação do dispositivo legal não será pontuada. No que tange ao item “B”, por sua vez, a resposta deve ser lastreada no sentido de que, de acordo com os verbetes 26 da súmula vinculante do STF e 471 da súmula do STJ, Mário, por ter cometido o crime hediondo antes da Lei 11.464/2007, não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90, por se tratar de novatio legis in pejus, devendo ocorrer sua progressão de regime com base no artigo 112 da Lei de Execuções Penais, observando o quantum de 1/6 de cumprimento de pena.

      Cabe destacar que tal entendimento surgiu do combate ao artigo 2º, § 2º, da Lei 8.072/90, que previa o cumprimento de pena no regime integralmente fechado para os crimes hediondos ou equiparados. Após longo debate nos Tribunais Superiores, reconheceu-se a inconstitucionalidade da previsão legal, por violação ao princípio da individualização da pena, culminando na progressão de regime com o quorum até então existente, qual seja, 1/6 com base no artigo 112 da LEP.

      O legislador pátrio, após o panorama jurisprudencial construído, alterou a redação do artigo 2º, § 2º, da Lei 8.072/90, autorizando a progressão de regime de forma mais gravosa para aqueles que cometeram crimes hediondos, por meio do cumprimento de 2/5 para os réus primários e 3/5 para os reincidentes.

      No entanto, a nova redação conferida ao artigo 2º, § 2º, da Lei 8.072/90, por meio da Lei 11.464/2007, externa-se de forma prejudicial àqueles que cometeram crimes hediondos em data anterior a sua publicação, tendo em vista que os Tribunais Superiores autorizavam a sua progressão com o cumprimento de 1/6 da pena.

      Diante dessa construção jurisprudencial, os Tribunais Superiores pacificaram o entendimento por meio dos verbetes 26 da súmula vinculante do STF e 471 da súmula do STJ.
    opcoes:
      correta: "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Agravo em execução, na forma do Art. 197 da LEP.
        - "Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior. OBS.1: A justificativa correta é essencial para atribuição de pontos, pois não há intervalo de pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - Liberdade provisória, nos termos do Art. 310, parágrafo único, do CPP, já que o juiz pode verificar, com base nas informações do auto de prisão em flagrante, que Pablo agiu amparado em causa excludente da ilicitude.
        - O argumento é o de que o crime praticado por Carla foi de falsidade ideológica, com inserção de conteúdo falseado, e não falsificação de documento particular, tendo em vista que inseriu informação falsa em documento verdadeiro quanto à sua forma, nos termos do Art. 299 do CP.
    revisao: *a1
