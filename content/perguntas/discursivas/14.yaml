  - id: 14-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Daniel, Ana Paula, Leonardo e Mariana, participantes da quadrilha “X”, e Carolina, Roberta, Cristiano, Juliana, Flavia e Ralph, participantes da quadrilha “Y”, fazem parte de grupos criminosos especializados em assaltar agências bancárias. Após intensos estudos sobre divisão de tarefas, locais, armas, bancos etc., ambos os grupos, sem ciência um do outro, planejaram viajar até a pacata cidade de Arroizinho com o intuito de ali realizarem o roubo. Cumpre ressaltar que, na cidade de Arroizinho, havia apenas duas únicas agências bancárias, a saber: uma agência do Banco do Brasil, sociedade de economia mista, e outra da Caixa Econômica Federal, empresa pública federal. No dia marcado, os integrantes da quadrilha "X"

      praticaram o crime objetivado contra o Banco do Brasil; os integrantes da quadrilha "Y" o fizeram contra a Caixa Econômica Federal. Cada grupo, com sua conduta, conseguiu auferir a vultosa quantia de R$ 1.000.000,00 (um milhão de reais).

      Nesse caso, atento tão somente aos dados contidos no enunciado, responda fundamentadamente de acordo com a Constituição:
    comando: Qual a justiça competente para o processo e julgamento do crime cometido pela quadrilha "Y"?
    gabarito: |-
      A Constituição da República, em seu artigo 109, IV, estabelece que compete à Justiça Federal o julgamento das as infrações penais praticadas em detrimento de bens, serviços ou interesse da União ou de suas entidades autárquicas ou empresas públicas. Trata-se de competência determinada ratione personae.

      Assim, para se estabelecer a competência de julgamento dos crimes mencionados no enunciado, o examinando deverá, em primeiro lugar, levar em consideração a natureza jurídica da pessoa lesada.

      Destarte, no caso do item "A", a competência para julgamento do crime em que foi lesada a CEF é da Justiça Federal, nos termos do art. 109, IV da CRFB/88.

      Relativamente ao item "B", levando-se em conta que o lesado foi o Banco do Brasil, a competência para o julgamento do crime praticado é da Justiça Estadual, pois, como visto anteriormente, referida instituição está fora do alcance da regra insculpida no artigo 109, IV da CF, sendo certo que a competência da Justiça Estadual é residual. Além disso, há o verbete 42 da Súmula do STJ sobre o tema: Compete à Justiça Comum Estadual processar e julgar as causas cíveis em que é parte sociedade de economia mista e os crimes praticados em seu detrimento."
    opcoes:
      correta: "Justiça Federal, conforme disposto no Art. 109, IV da CRFB/88. Obs.: a mera indicação de artigo ou súmula não pontua."
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior. OBS.1: A justificativa correta é essencial para atribuição de pontos, pois não há intervalo de pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
