  - id: 14-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Gustavo está sendo regularmente processado, perante o Tribunal do Júri da Comarca de Niterói-RJ, pela prática do crime de homicídio simples, conexo ao delito de sequestro e cárcere privado. Os jurados consideraram-no inocente em relação ao delito de homicídio, mas culpado em relação ao delito de sequestro e cárcere privado. O juiz presidente, então, proferiu a respectiva sentença. Irresignado, o Ministério Público interpôs apelação, sustentando que a decisão dos jurados fora manifestamente contrária à prova dos autos. A defesa, de igual modo, apelou, objetivando também a absolvição em relação ao delito de sequestro e cárcere privado.

      O Tribunal de Justiça, no julgamento, negou provimento aos apelos, mas determinou a anulação do processo (desde o ato viciado, inclusive) com base no Art. 564, III, i, do CPP, porque restou verificado que, para a constituição do Júri, somente estavam presentes 14 jurados.

      Nesse sentido, tendo como base apenas as informações contidas no enunciado, responda justificadamente às questões a seguir.
    comando: A nulidade apresentada pelo Tribunal é absoluta ou relativa? Dê o respectivo fundamento legal.
    gabarito: |-
      A questão objetiva extrair do examinando conhecimento acerca da teoria geral das nulidades no Processo Penal. Nesse sentido, para garantir os pontos relativos à questão, o examinando deve, na alternativa "A", indicar que a hipótese é de nulidade absoluta, nos termos do artigo 564, III, alínea "i" c/c 572, ambos do CPP. Em relação à alternativa "B", o examinando deve lastrear sua resposta no sentido de que não foi correta a atitude do Tribunal de Justiça. Isso porque, de acordo com o Verbete 160 da Súmula do STF, o Tribunal de Justiça não pode acolher, contra o réu, nulidade não aventada pela acusação em seu recurso.

      Assim agir significaria desrespeito ao princípio da veda a reformatio in pejus indireta.

      O enunciado da questão foi claro ao informar que o recurso do Ministério Público não alegou nenhuma nulidade. Destarte, levando em conta que o réu foi absolvido em relação ao delito de homicídio, o reconhecimento de nulidade implicar-lhe-á em prejuízo.

      Por fim, com a finalidade de privilegiar a demonstração de conhecimento jurídico, a Banca convencionou aceitar também, no item “B”, o verbete 713 da Súmula do STF como fundamento à impossibilidade de o Tribunal acolher, contra o réu, nulidade não aventada pela acusação em seu recurso.
    opcoes:
      correta: 'Nulidade Absoluta, nos termos do artigo 564, III, alínea "i" c/c 572, ambos do CPP. Obs: A mera indicação de artigo não pontua.'
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
