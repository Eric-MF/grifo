# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "14"
introducoes:
  peca: "Felipe, de 18 anos, conheceu Ana num bar de adultos, e, na mesma noite, ela praticou com ele, de forma voluntária, sexo oral e vaginal. No dia seguinte, ele descobriu que Ana, de aparência adulta e que fugia de casa para frequentar bares, tinha 13 anos. Foi denunciado por dois estupros de vulnerável em concurso material, e o Ministério Público pediu a agravante da embriaguez preordenada e o regime fechado da lei dos crimes hediondos. As testemunhas disseram que qualquer um acharia que Ana tinha mais de 14 anos e que Felipe não estava bêbado. Primário e de bons antecedentes, ele responde em liberdade. Você o defende nos memoriais."
  q1: "Gustavo foi julgado pelo júri: absolvido do homicídio e condenado pelo sequestro conexo. As duas partes apelaram, só quanto ao mérito. O Tribunal negou as apelações, mas anulou o processo, por conta própria, porque o júri foi instalado com só 14 jurados presentes."
  q2: "Mário cumpre 24 anos por latrocínio, cometido antes de 2007, com condenação transitada em julgado em 2005. Em 2009, o juiz da execução negou a progressão de regime porque ele não teria cumprido 2/5 da pena, como exige a lei dos crimes hediondos alterada em 2007."
  q3: "Duas quadrilhas, sem saber uma da outra, roubaram R$ 1 milhão cada numa cidadezinha. A quadrilha X roubou a agência do Banco do Brasil, sociedade de economia mista; a quadrilha Y roubou a da Caixa Econômica Federal, empresa pública federal."
  q4: "Cristiano, acusado de estelionato, teve a prisão preventiva decretada pela 'grave comoção social' e pela gravidade do crime. O Tribunal de Justiça negou, por unanimidade, o habeas corpus da defesa."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["14-peca-1", "14-peca-3-4", "14-peca-3-6", "14-peca-4-1", "14-peca-4-2"]
perguntas:
  - id: 14-peca-3-1
    categoria: peca-detalhe
    parte: peca
    item: "3.1"
    secao: merito
    pergunta: "Felipe acreditava que Ana tinha mais de 14 anos. Que tese leva à absolvição dele?"
    tese: "Erro de tipo essencial, que torna a conduta atípica"
    aceitos: [ "erro de tipo" ]
    artigos: [ "art. 20, CP" ]
    gabarito: "Absolvição pelo erro de tipo essencial, instituto descrito no artigo 20, caput, do CP que gera a atipicidade da conduta."
    revisao: { status: revisado }
  - id: 14-peca-3-2
    categoria: peca-detalhe
    parte: peca
    item: "3.2"
    secao: merito
    pergunta: "O Ministério Público denunciou dois estupros, pelo sexo oral e pelo vaginal na mesma ocasião. Que tese a defesa deve opor a isso?"
    tese: "Crime único: o estupro de vulnerável é tipo misto alternativo"
    aceitos: [ [ "crime unico | delito unico | um so crime | unico crime" ], [ "tipo misto alternativo" ] ]
    artigos: [ "art. 217-A, CP" ]
    gabarito: "Da tese da prática de crime único, pois o delito de estupro de vulnerável é um tipo misto alternativo (de conteúdo múltiplo ou variado)."
    revisao: { status: revisado }
  - id: 14-peca-3-3
    categoria: peca-detalhe
    parte: peca
    item: "3.3"
    secao: merito
    pergunta: "As testemunhas disseram que Felipe não estava bêbado. O que a defesa deve pedir quanto à agravante pedida pelo Ministério Público?"
    tese: "Afastamento da agravante da embriaguez preordenada, porque o réu não estava bêbado"
    aceitos: [ "afast* | nao incid* | exclu* | decote | inaplica*" ]
    artigos: [ "art. 61, II, l, CP" ]
    gabarito: "Da tese do afastamento da agravante da embriaguez preordenada."
    revisao: { status: revisado }
  - id: 14-peca-3-5
    categoria: peca-detalhe
    parte: peca
    item: "3.5"
    secao: merito
    pergunta: "Felipe é primário e de bons antecedentes. Como deve ser fixada a pena-base?"
    tese: "Pena-base no mínimo legal para o réu primário e de bons antecedentes"
    aceitos: [ "minimo" ]
    artigos: [ "art. 59, CP" ]
    gabarito: "Desenvolvimento jurídico acerca da necessidade de manutenção da pena- base no mínimo legal para o crime de estupro de vulnerável"
    revisao: { status: revisado }
  - id: 14-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que espécie de nulidade é a da instalação do júri com só 14 jurados?"
    tese: "Nulidade absoluta da instalação do júri sem o mínimo de 15 jurados"
    aceitos: [ "absoluta" ]
    artigos: [ "art. 564, III, i, CPP" ]
    gabarito: "A questão objetiva extrair do examinando conhecimento acerca da teoria geral das nulidades no Processo Penal. Nesse sentido, para garantir os pontos relativos à questão, o examinando deve, na alternativa \"A\", indicar que a hipótese é de nulidade absoluta, nos termos do artigo 564, III, alínea \"i\" c/c 572, ambos do CPP. Em relação à alternativa \"B\", o examinando deve lastrear sua resposta no sentido de que não foi correta a atitude do Tribunal de Justiça. Isso porque, de acordo com o Verbete 160 da Súmula do STF, o Tribunal de Justiça não pode acolher, contra o réu, nulidade não aventada pela acusação em seu recurso.\n\nAssim agir significaria desrespeito ao princípio da veda a reformatio in pejus indireta.\n\nO enunciado da questão foi claro ao informar que o recurso do Ministério Público não alegou nenhuma nulidade. Destarte, levando em conta que o réu foi absolvido em relação ao delito de homicídio, o reconhecimento de nulidade implicar-lhe-á em prejuízo.\n\nPor fim, com a finalidade de privilegiar a demonstração de conhecimento jurídico, a Banca convencionou aceitar também, no item “B”, o verbete 713 da Súmula do STF como fundamento à impossibilidade de o Tribunal acolher, contra o réu, nulidade não aventada pela acusação em seu recurso."
    revisao: { status: revisado }
  - id: 14-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "O Tribunal podia anular o júri por essa nulidade, que nenhuma das apelações apontou?"
    tese: "O tribunal não pode reconhecer contra o réu nulidade que a acusação não arguiu no recurso"
    aceitos: [ [ "nao arguida | nao alegada | nao suscitada | nao apontada | nao arguiu | nao alegou" ], [ "reformatio in pejus" ] ]
    artigos: [ "Súmula 160 STF" ]
    gabarito: "A questão objetiva extrair do examinando conhecimento acerca da teoria geral das nulidades no Processo Penal. Nesse sentido, para garantir os pontos relativos à questão, o examinando deve, na alternativa \"A\", indicar que a hipótese é de nulidade absoluta, nos termos do artigo 564, III, alínea \"i\" c/c 572, ambos do CPP. Em relação à alternativa \"B\", o examinando deve lastrear sua resposta no sentido de que não foi correta a atitude do Tribunal de Justiça. Isso porque, de acordo com o Verbete 160 da Súmula do STF, o Tribunal de Justiça não pode acolher, contra o réu, nulidade não aventada pela acusação em seu recurso.\n\nAssim agir significaria desrespeito ao princípio da veda a reformatio in pejus indireta.\n\nO enunciado da questão foi claro ao informar que o recurso do Ministério Público não alegou nenhuma nulidade. Destarte, levando em conta que o réu foi absolvido em relação ao delito de homicídio, o reconhecimento de nulidade implicar-lhe-á em prejuízo.\n\nPor fim, com a finalidade de privilegiar a demonstração de conhecimento jurídico, a Banca convencionou aceitar também, no item “B”, o verbete 713 da Súmula do STF como fundamento à impossibilidade de o Tribunal acolher, contra o réu, nulidade não aventada pela acusação em seu recurso."
    revisao: { status: revisado }
  - id: 14-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Fora o habeas corpus, que recurso cabe contra a decisão que negou a progressão?"
    tese: "Agravo em execução"
    aceitos: [ "agravo" ]
    artigos: [ "art. 197, LEP" ]
    gabarito: "A questão objetiva extrair do examinando conhecimento acerca da lei penal no tempo (regramento legal e entendimento jurisprudencial), bem como da execução penal.\n\nNesse sentido, relativamente à alternativa “A”, o examinando deve indicar que o recurso a ser interposto é o agravo, previsto no artigo 197 da LEP.\n\nTendo em conta a própria natureza do Exame de Ordem, a mera indicação do dispositivo legal não será pontuada. No que tange ao item “B”, por sua vez, a resposta deve ser lastreada no sentido de que, de acordo com os verbetes 26 da súmula vinculante do STF e 471 da súmula do STJ, Mário, por ter cometido o crime hediondo antes da Lei 11.464/2007, não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90, por se tratar de novatio legis in pejus, devendo ocorrer sua progressão de regime com base no artigo 112 da Lei de Execuções Penais, observando o quantum de 1/6 de cumprimento de pena.\n\nCabe destacar que tal entendimento surgiu do combate ao artigo 2º, § 2º, da Lei 8.072/90, que previa o cumprimento de pena no regime integralmente fechado para os crimes hediondos ou equiparados. Após longo debate nos Tribunais Superiores, reconheceu-se a inconstitucionalidade da previsão legal, por violação ao princípio da individualização da pena, culminando na progressão de regime com o quorum até então existente, qual seja, 1/6 com base no artigo 112 da LEP.\n\nO legislador pátrio, após o panorama jurisprudencial construído, alterou a redação do artigo 2º, § 2º, da Lei 8.072/90, autorizando a progressão de regime de forma mais gravosa para aqueles que cometeram crimes hediondos, por meio do cumprimento de 2/5 para os réus primários e 3/5 para os reincidentes.\n\nNo entanto, a nova redação conferida ao artigo 2º, § 2º, da Lei 8.072/90, por meio da Lei 11.464/2007, externa-se de forma prejudicial àqueles que cometeram crimes hediondos em data anterior a sua publicação, tendo em vista que os Tribunais Superiores autorizavam a sua progressão com o cumprimento de 1/6 da pena.\n\nDiante dessa construção jurisprudencial, os Tribunais Superiores pacificaram o entendimento por meio dos verbetes 26 da súmula vinculante do STF e 471 da súmula do STJ."
    revisao: { status: revisado }
  - id: 14-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "O crime é anterior à lei que exigiu 2/5 para a progressão. Qual a principal tese defensiva?"
    tese: "A lei posterior mais grave não retroage: a progressão segue a regra antiga (1/6)"
    aceitos: [ [ "irretroativ* | nao retroage | nao pode retroagir | nao retroagir" ], [ "novatio legis in pejus | lex gravior" ], [ "1/6 | um sexto" ] ]
    artigos: [ "Súmula 471 STJ", "Súmula Vinculante 26" ]
    gabarito: "A questão objetiva extrair do examinando conhecimento acerca da lei penal no tempo (regramento legal e entendimento jurisprudencial), bem como da execução penal.\n\nNesse sentido, relativamente à alternativa “A”, o examinando deve indicar que o recurso a ser interposto é o agravo, previsto no artigo 197 da LEP.\n\nTendo em conta a própria natureza do Exame de Ordem, a mera indicação do dispositivo legal não será pontuada. No que tange ao item “B”, por sua vez, a resposta deve ser lastreada no sentido de que, de acordo com os verbetes 26 da súmula vinculante do STF e 471 da súmula do STJ, Mário, por ter cometido o crime hediondo antes da Lei 11.464/2007, não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90, por se tratar de novatio legis in pejus, devendo ocorrer sua progressão de regime com base no artigo 112 da Lei de Execuções Penais, observando o quantum de 1/6 de cumprimento de pena.\n\nCabe destacar que tal entendimento surgiu do combate ao artigo 2º, § 2º, da Lei 8.072/90, que previa o cumprimento de pena no regime integralmente fechado para os crimes hediondos ou equiparados. Após longo debate nos Tribunais Superiores, reconheceu-se a inconstitucionalidade da previsão legal, por violação ao princípio da individualização da pena, culminando na progressão de regime com o quorum até então existente, qual seja, 1/6 com base no artigo 112 da LEP.\n\nO legislador pátrio, após o panorama jurisprudencial construído, alterou a redação do artigo 2º, § 2º, da Lei 8.072/90, autorizando a progressão de regime de forma mais gravosa para aqueles que cometeram crimes hediondos, por meio do cumprimento de 2/5 para os réus primários e 3/5 para os reincidentes.\n\nNo entanto, a nova redação conferida ao artigo 2º, § 2º, da Lei 8.072/90, por meio da Lei 11.464/2007, externa-se de forma prejudicial àqueles que cometeram crimes hediondos em data anterior a sua publicação, tendo em vista que os Tribunais Superiores autorizavam a sua progressão com o cumprimento de 1/6 da pena.\n\nDiante dessa construção jurisprudencial, os Tribunais Superiores pacificaram o entendimento por meio dos verbetes 26 da súmula vinculante do STF e 471 da súmula do STJ."
    revisao: { status: revisado }
  - id: 14-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que Justiça julga o roubo da quadrilha Y, contra a Caixa Econômica Federal?"
    tese: "Competência da Justiça Federal: a Caixa Econômica Federal é empresa pública federal"
    aceitos: [ "justica federal" ]
    artigos: [ "art. 109, IV, CRFB" ]
    gabarito: "A Constituição da República, em seu artigo 109, IV, estabelece que compete à Justiça Federal o julgamento das as infrações penais praticadas em detrimento de bens, serviços ou interesse da União ou de suas entidades autárquicas ou empresas públicas. Trata-se de competência determinada ratione personae.\n\nAssim, para se estabelecer a competência de julgamento dos crimes mencionados no enunciado, o examinando deverá, em primeiro lugar, levar em consideração a natureza jurídica da pessoa lesada.\n\nDestarte, no caso do item \"A\", a competência para julgamento do crime em que foi lesada a CEF é da Justiça Federal, nos termos do art. 109, IV da CRFB/88.\n\nRelativamente ao item \"B\", levando-se em conta que o lesado foi o Banco do Brasil, a competência para o julgamento do crime praticado é da Justiça Estadual, pois, como visto anteriormente, referida instituição está fora do alcance da regra insculpida no artigo 109, IV da CF, sendo certo que a competência da Justiça Estadual é residual. Além disso, há o verbete 42 da Súmula do STJ sobre o tema: Compete à Justiça Comum Estadual processar e julgar as causas cíveis em que é parte sociedade de economia mista e os crimes praticados em seu detrimento.\""
    revisao: { status: revisado }
  - id: 14-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "E o roubo da quadrilha X, contra o Banco do Brasil?"
    tese: "Competência da Justiça Estadual: o Banco do Brasil é sociedade de economia mista"
    aceitos: [ "justica estadual | estadual" ]
    artigos: [ "Súmula 42 STJ" ]
    gabarito: "A Constituição da República, em seu artigo 109, IV, estabelece que compete à Justiça Federal o julgamento das as infrações penais praticadas em detrimento de bens, serviços ou interesse da União ou de suas entidades autárquicas ou empresas públicas. Trata-se de competência determinada ratione personae.\n\nAssim, para se estabelecer a competência de julgamento dos crimes mencionados no enunciado, o examinando deverá, em primeiro lugar, levar em consideração a natureza jurídica da pessoa lesada.\n\nDestarte, no caso do item \"A\", a competência para julgamento do crime em que foi lesada a CEF é da Justiça Federal, nos termos do art. 109, IV da CRFB/88.\n\nRelativamente ao item \"B\", levando-se em conta que o lesado foi o Banco do Brasil, a competência para o julgamento do crime praticado é da Justiça Estadual, pois, como visto anteriormente, referida instituição está fora do alcance da regra insculpida no artigo 109, IV da CF, sendo certo que a competência da Justiça Estadual é residual. Além disso, há o verbete 42 da Súmula do STJ sobre o tema: Compete à Justiça Comum Estadual processar e julgar as causas cíveis em que é parte sociedade de economia mista e os crimes praticados em seu detrimento.\""
    revisao: { status: revisado }
  - id: 14-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que recurso cabe contra o acórdão que negou o habeas corpus?"
    tese: "Recurso ordinário constitucional"
    aceitos: [ "recurso ordinario" ]
    artigos: [ "art. 105, II, a, CRFB" ]
    gabarito: "De acordo com a jurisprudência atualizada, tanto do STJ como do STF, bem como com o mandamento descrito no Art. 105, II, “a”, da Constituição Federal, em Habeas Corpus caberá Recurso Ordinário. O Art. 30, da Lei nº 8.038/90, determina ser de 05 (cinco) dias o prazo para interposição de recurso ordinário contra decisão denegatória de Habeas Corpus proferida pelos Tribunais dos Estados. No caso narrado no enunciado, o recurso deve ser dirigido ao Superior Tribunal de Justiça, conforme informa o Art. 105, II, “a”, da Constituição Federal, já que se trata de decisão proferida pelo Tribunal de Justiça."
    revisao: { status: revisado }
  - id: 14-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Para que tribunal e em que prazo esse recurso deve ser interposto?"
    tese: "Recurso ordinário constitucional para o Superior Tribunal de Justiça, no prazo de 5 dias"
    aceitos: [ "superior tribunal de justica | stj", "5 dias | cinco dias" ]
    artigos: [ "art. 30, Lei 8.038" ]
    gabarito: "De acordo com a jurisprudência atualizada, tanto do STJ como do STF, bem como com o mandamento descrito no Art. 105, II, “a”, da Constituição Federal, em Habeas Corpus caberá Recurso Ordinário. O Art. 30, da Lei nº 8.038/90, determina ser de 05 (cinco) dias o prazo para interposição de recurso ordinário contra decisão denegatória de Habeas Corpus proferida pelos Tribunais dos Estados. No caso narrado no enunciado, o recurso deve ser dirigido ao Superior Tribunal de Justiça, conforme informa o Art. 105, II, “a”, da Constituição Federal, já que se trata de decisão proferida pelo Tribunal de Justiça."
    revisao: { status: revisado }
