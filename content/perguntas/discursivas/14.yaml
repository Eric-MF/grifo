      erradas:
        - Reconhecimento da preliminar e extinção da punibilidade; impronúncia, nos termos do art. 414 do CPP (admite-se absolvição sumária, art. 415).
        - afastamento da causa de aumento.
        - Absolvição com base na atipicidade da conduta ou art. 386, inciso III, do CPP.
        - Não provimento do recurso OU manutenção da sentença.
        - Absolvição sumária, nos termos do Art. 397, inciso II, do CPP.
