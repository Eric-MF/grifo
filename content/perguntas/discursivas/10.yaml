        - Manutenção do reconhecimento da atenuante da confissão espontânea, considerando que foi a confissão utilizada como argumento/para formação da convicção do juiz, nos termos da Súmula 545 do STJ.
        - "Subsidiariamente: aplicação da pena base no mínimo legal, tendo em vista que o fato posterior ao crime julgado não pode ser considerado maus antecedentes."
