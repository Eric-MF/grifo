# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "10"
introducoes:
  peca: "Em 18/10/2010, em Cuiabá, Jane levou o carro de Gabriela, deixado aberto com a chave na ignição, para revendê-lo no Paraguai, e foi presa no dia seguinte, quando ia cruzar a fronteira para negociar a venda; o carro ficou escondido no Brasil. Reincidente específica e com maus antecedentes, foi condenada a 5 anos, no regime fechado, como se o veículo tivesse sido levado ao exterior, e a condenação transitou em julgado. Agora você descobre um fato que nunca apareceu no processo: em 27/10/2010, antes de a denúncia ser recebida (30/10/2010), Jane indicou ao filho da vítima onde estava o carro, e ele o pegou de volta intacto. Você defende Jane."
  q3: "José, conhecido por vender drogas, foi preso pela Polícia Militar em Foz do Iguaçu (PR) levando 500 g de cocaína e 50 ampolas de cloreto de etila. No flagrante, disse que levaria a droga para Porto Vera Cruz (RS) e mostrou a passagem de avião já comprada."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["10-peca-1", "10-peca-3-2", "10-peca-6", "10-q3-b"]
perguntas:
  - id: 10-peca-3-1
    categoria: peca-detalhe
    parte: peca
    item: "3.1"
    secao: merito
    pergunta: "Jane indicou onde estava o carro, e ele foi devolvido inteiro antes do recebimento da denúncia. Que causa de diminuição de pena isso configura?"
    tese: "Arrependimento posterior, que diminui a pena"
    aceitos: [ "arrependimento posterior" ]
    artigos: [ "art. 16, CP" ]
    gabarito: "Da tese do arrependimento posterior: incide o instituto do arrependimento posterior, nos termos do Art. 16 do CP."
    revisao: { status: revisado }
  - id: 10-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: merito
    pergunta: "O carro nunca saiu do país. Para que crime a defesa deve pedir a desclassificação?"
    tese: "Desclassificação para furto simples: o carro nunca saiu do país"
    aceitos: [ "furto simples" ]
    artigos: [ "art. 155, CP" ]
    gabarito: "Desclassificação para furto simples, pois não houve efetivo deslocamento do bem para o exterior, restando o crime do Art. 155, caput, do CP."
    revisao: { status: revisado }
  - id: 10-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Com a pena reduzida, que regime inicial a defesa deve pedir, apesar da reincidência?"
    tese: "Regime inicial semiaberto para o reincidente com pena de até 4 anos"
    aceitos: [ "semiaberto | semi-aberto | semi aberto" ]
    artigos: [ "Súmula 269 STJ" ]
    gabarito: "Consequente modificação do regime para o semiaberto, conforme a Súmula 269 do STJ."
    revisao: { status: revisado }
  - id: 10-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "O destino da droga era outra cidade brasileira. A que Justiça cabe julgar José?"
    tese: "Competência da Justiça Estadual: não houve tráfico para o exterior"
    aceitos: [ "justica estadual | estadual" ]
    artigos: [ "Súmula 522 STF", "art. 70, Lei 11.343" ]
    gabarito: "A. O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil (Porto Vera Cruz é município do Rio Grande do Sul e Foz do Iguaçu é município do Paraná) e que não há qualquer menção à transposição de fronteira nacional. A competência somente poderia ser atribuída à Justiça Federal se José tivesse cometido o crime de tráfico internacional de entorpecentes (objetivo de traficar para o exterior), na forma do disposto no art. 70, caput, da Lei 11.343/2006 e do verbete 522 da Súmula do STF.\n\nB. Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior."
    revisao: { status: revisado }
