  - id: 10-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      José, conhecido em seu bairro por vender entorpecentes, resolve viajar para Foz do Iguaçu (PR). Em sua bagagem, José transporta 500g de cocaína e 50 ampolas de cloreto de etila. Em Foz do Iguaçu, José foi preso em flagrante pela Polícia Militar em virtude do transporte das substâncias entorpecentes. Na lavratura do flagrante, José afirma que seu objetivo era transportar a droga até a cidade de Porto Vera Cruz (RS), mencionando inclusive a passagem de avião que já havia comprado.

      Você é contratado para efetuar um pedido de liberdade provisória e o que mais entender de Direito em favor de José.

      Atento somente ao que foi narrado na hipótese acima, responda aos itens a seguir.
    comando: O órgão competente para julgamento é a Justiça Estadual ou a Justiça Federal? Justifique.
    gabarito: |-
      A. O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil (Porto Vera Cruz é município do Rio Grande do Sul e Foz do Iguaçu é município do Paraná) e que não há qualquer menção à transposição de fronteira nacional. A competência somente poderia ser atribuída à Justiça Federal se José tivesse cometido o crime de tráfico internacional de entorpecentes (objetivo de traficar para o exterior), na forma do disposto no art. 70, caput, da Lei 11.343/2006 e do verbete 522 da Súmula do STF.

      B. Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior.
    opcoes:
      correta: "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Como não houve eficácia no arrependimento OU como não houve atendimento à exigência do Art. 15, CP, Wilson deverá responder pelo resultado morte OU deverá responder pelo crime de homicídio doloso consumado.
        - Vanessa não foi corretamente condenada por peculato porque não tinha conhecimento da condição de funcionário público de João, dependendo a comunicação da elementar desse elemento subjetivo OU porque não pode ser aplicado o Art. 30 do CP pela ausência de elemento subjetivo.
        - Houve cerceamento de defesa OU violação ao princípio do contraditório ou da ampla defesa, tendo em vista que as testemunhas referidas não são computadas no número máximo de testemunhas a serem ouvidas, nos termos do Art. 401, § 1º, do CPP OU Art. 209 do CPP OU Art. 5º, LV, CRFB.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
  - id: 10-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      José, conhecido em seu bairro por vender entorpecentes, resolve viajar para Foz do Iguaçu (PR). Em sua bagagem, José transporta 500g de cocaína e 50 ampolas de cloreto de etila. Em Foz do Iguaçu, José foi preso em flagrante pela Polícia Militar em virtude do transporte das substâncias entorpecentes. Na lavratura do flagrante, José afirma que seu objetivo era transportar a droga até a cidade de Porto Vera Cruz (RS), mencionando inclusive a passagem de avião que já havia comprado.

      Você é contratado para efetuar um pedido de liberdade provisória e o que mais entender de Direito em favor de José.

      Atento somente ao que foi narrado na hipótese acima, responda aos itens a seguir.
    comando: Se José objetivasse apenas traficar drogas em Foz do Iguaçu, o órgão competente seria o mesmo da situação acima? Justifique.
    gabarito: |-
      A. O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil (Porto Vera Cruz é município do Rio Grande do Sul e Foz do Iguaçu é município do Paraná) e que não há qualquer menção à transposição de fronteira nacional. A competência somente poderia ser atribuída à Justiça Federal se José tivesse cometido o crime de tráfico internacional de entorpecentes (objetivo de traficar para o exterior), na forma do disposto no art. 70, caput, da Lei 11.343/2006 e do verbete 522 da Súmula do STF.

      B. Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior.
    opcoes:
      correta: "Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior. OBS.1: A justificativa correta é essencial para atribuição de pontos, pois não há intervalo de pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Como não houve eficácia no arrependimento OU como não houve atendimento à exigência do Art. 15, CP, Wilson deverá responder pelo resultado morte OU deverá responder pelo crime de homicídio doloso consumado.
        - Não é possível a condenação exclusivamente com base nas declarações do agente colaborador, segundo o Art. 4º, § 16º, da Lei nº 12.850/13, devendo ser corroborada por outros elementos de prova.
        - O argumento é o de que o início da contagem do prazo decadencial somente ocorreu em 23/10/2017 OU no dia em que o ofendido teve conhecimento sobre a autoria, logo não havia se encerrado quando do oferecimento da queixa-crime, nos termos do Art. 38 do CPP OU Art. 103 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
