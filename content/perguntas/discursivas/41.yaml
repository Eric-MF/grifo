  - id: 41-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      No Supermercado Boa Fartura, há uma área de descarte de mercadorias violadas, vencidas ou que, de qualquer forma, estejam sem condições de venda. William, aproveitando-se da baixa luminosidade do período noturno e do reduzido fluxo de pessoas, ingressou nesta área, localizada em pátio externo com acesso à via pública (por onde passa o caminhão de coleta de descartes) e subtraiu, para si, 20 (vinte) quilos de picanha, 2 (dois) litros de iogurte, 10 (dez) litros de detergente e 5 (cinco) litros de refrigerante, todos com data de validade ultrapassada.

      Enquanto se afastava da área designada em direção à via pública, foi flagranteado pelos seguranças e levado à autoridade policial competente que autuou William por furto majorado pelo horário de repouso noturno, na forma tentada (Art. 155, caput c/c Art. 155, § 1º, na forma do Art. 14, inciso II, todos do Código Penal).

      O gerente do supermercado, ouvido em conjunto com os agentes de segurança que realizaram o flagrante, confirmou à autoridade policial que as mercadorias subtraídas eram destinadas ao descarte, por não poderem ser comercializadas.

      Durante a lavratura do flagrante, William informou ao delegado que não possui advogado, e não há defensoria pública instalada na comarca, o que levou você a ser designado como advogado(a) dativo(a) de William pelo Juízo, tão logo o acusado recebeu a comunicação de prisão em flagrante. Aceitado o encargo, e considerando apenas as informações constantes do enunciado, responda às perguntas a seguir.
    comando: Como advogado(a) constituído(a) no momento processual indicado nos autos, qual será a oportunidade mais próxima para defender oralmente, perante o Juiz, a liberdade de Wiliam? Justifique.
    gabarito: A pergunta inicial exige do examinando a identificação de que na audiência de custódia haverá a primeira oportunidade em que, formalmente, há participação obrigatória da defesa. Assim, na forma do Art. 310, caput, do CPP, a primeira oportunidade da defesa técnica de postular a liberdade é na audiência de custódia.
    opcoes:
      correta: Na audiência de custódia, na forma do Art. 310, caput, do CPP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
