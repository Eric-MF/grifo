  - id: 41-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Luana, sem querer criar seu filho Joaquim, de 8 meses de idade, decidiu abandoná-lo em um movimentado supermercado da cidade, deixando-o agasalhado e acomodado em uma cadeira própria para bebês, com o cinto de segurança afivelado. Poucos minutos após ser abandonado, Joaquim foi acolhido por pessoas que estavam no supermercado e levado, sem qualquer risco ou lesão, às autoridades competentes.

      Luana foi denunciada por abandono de incapaz (Art. 133, § 3º, inciso II, do CP). Em diligências finais, vieram aos autos as imagens da câmera de vigilância, demonstrando que, ao sair do supermercado, Luana subtraiu um chocolate. O Ministério Público, em alegações finais, pediu a condenação de Luana nos termos da denúncia, ao passo que a defesa técnica postulou sua absolvição.

      O Juízo proferiu sentença e condenou Luana pelos delitos de abandono de incapaz e furto simples, em concurso material (Art. 133, § 3º, inciso II, e Art. 155, caput, na forma do Art. 69, todos do CP), com base nos elementos factuais surgidos no curso do processo (notadamente, as imagens da câmera de vigilância do mercado). Na qualidade de advogado de Luana, responda às questões a seguir.
    comando: A fim de impugnar a condenação de Luana pelo delito de abandono de incapaz, qual a tese de Direito Penal a ser sustentada? Justifique.
    gabarito: Quanto ao aspecto material, deveria o examinando defender a atipicidade da conduta. O crime de abandono de incapaz é de perigo concreto, exige que a integridade física da vítima seja efetivamente colocada em risco iminente. A descrição das condições de abandono, em que a criança foi cautelosamente colocada em cadeira própria e afivelada, deixada em local de grande circulação de pessoas, não configura o tipo penal, por não ensejar risco concreto à segurança do infante.
    opcoes:
      correta: Atipicidade da conduta, diante da inexistência de perigo concreto à integridade física do menor.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
