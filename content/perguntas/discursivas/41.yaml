      O Juiz titular, que presidiu a instrução, afastou-se por dois dias para participar de um curso oficial, razão pela qual a sentença foi prolatada pelo Juiz substituto, designado para atuar apenas em causas urgentes, ainda que nenhuma urgência houvesse neste processo. Assim, Mendonça foi condenado como incurso nas penas do Art. 317, § 1º, c/c o Art. 327, § 2º, ambos do CP, considerando provada a corrupção passiva por meio do interrogatório de Lineu, colaborador, o que foi reputado suficiente para provar materialidade e autoria delitivas. Aplicou a pena-base no mínimo legal de dois anos, majorada em um terço por duas vezes consecutivas, justificada exclusivamente pela existência de duas causas de aumento previstas na parte especial do Código Penal, alcançando a pena de 3 (três)

      anos, 6 (seis) meses e 20 (vinte) dias de reclusão, em regime aberto, e substituiu a pena privativa de liberdade por duas restritivas de direitos. Determinou a cassação da aposentadoria de Mendonça, na forma do Art. 92, inciso I, a, do CP, aplicável por analogia, bem como a perda do imóvel de sua propriedade, uma vez que de valor incompatível com seus proventos, fato suficiente para autorizar o perdimento. O Ministério Público, intimado da sentença, manteve-se inerte. Você, como advogado(a) de Mendonça, é intimado(a) no dia 6 de setembro de 2024, sexta-feira, sendo o dia seguinte e os dias de segunda a sexta-feira úteis em todo o país.

      Considerando apenas as informações narradas, na condição de advogado(a) de Mendonça, redija a peça jurídica cabível, diferente de habeas corpus, e considerando que a sentença não padece de vício de contradição, obscuridade, ambiguidade ou omissão, apresente todas as teses jurídicas pertinentes. A peça deverá ser datada no último dia do prazo para interposição. (Valor: 5,00)

      Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples
    comando: Que pedido deve ser formulado na peça?
    gabarito: Conhecimento e provimento do recurso.
    opcoes:
      correta: Conhecimento e provimento do recurso.
      erradas:
        - Absolvição, com argumento e base legal.
        - Requerimento de declaração das nulidades, absolvição sumária e, alternativamente, produção de provas.
        - Requerimento de aplicação do furto privilegiado, pleiteando a adoção de alguma das medidas previstas em lei (ou substituição da reclusão por detenção ou causa de diminuição de pena ou aplicação exclusivamente da pena de multa), na forma do Art. 155, §2º, do CP.
        - Pedido de retratação pelo juízo a quo.
        - Subsidiariamente, o acolhimento das teses defensivas de aplicação da pena.
    revisao: *a1
  - id: 41-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Adriano foi autuado em flagrante delito pela prática de caça em Unidade de Conservação (Art. 29, § 4º, inciso V, da Lei nº 9605/98) e foi condenado pelo Juizado Especial Criminal competente a uma pena de um ano de detenção, em regime aberto, substituída a pena privativa de liberdade por uma pena restritiva de direito. A sentença exasperou a pena-base em seis meses com base na culpabilidade acentuada de Adriano, que se valeu de espingarda para a prática de caça.

      O Ministério Público não recorreu da sentença. Adriano, por meio de sua defesa técnica, interpôs recurso de apelação, aduzindo que a valoração da culpabilidade se valeu de argumento genérico e inerente ao tipo penal, devendo ser afastada a exasperação da pena-base. O apelo foi julgado e foi negado provimento, mantendo a pena-base em um ano de detenção. Além disso, a Turma Recursal considerou a existência de error in judicando e reformou a sentença, reconhecendo a incidência da causa de aumento (Art. 29, § 4º, inciso V, da Lei nº 9605/98), que deixou de ser aplicada pelo Juízo a quo por mero erro material. Assim, fixou a pena final em um ano e seis meses de detenção.

      A defesa de Adriano impetrou habeas corpus em favor do acusado, perante o Tribunal ao qual está vinculado o Juizado onde correu a ação penal, tendo sido concedida a ordem. O Ministério Público interpôs recurso ordinário constitucional em face dessa decisão.

      Na qualidade de advogado(a) de Adriano, responda às questões a seguir.
    comando: Qual questão preliminar deve ser arguida em contrarrazões recursais? Justifique.
    gabarito: Na condição de advogado(a) de Adriano, deve ser alegado o descabimento do recurso ordinário constitucional, uma vez que a decisão recorrida foi concessiva de habeas corpus. O recurso só é cabível em face de decisão denegatória, na forma do Art. 105, inciso II, alínea a, da CRFB/88 ou Art. 30, da Lei nº 8.038/90.
    opcoes:
      correta: O descabimento de recurso ordinário constitucional em face de decisão concessiva de habeas corpus, na forma do Art. 105, inciso II, alínea a, da CRFB/88 ou Art. 30, da Lei nº 8.038/90.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - Atipicidade objetiva da conduta, pois a figura delitiva da perseguição (Art. 147-A do CP); adota verbo nuclear no infinitivo (“perseguir”), o que denota crime habitual, a exigir reiteração do comportamento para a caracterização da tipicidade objetiva
        - Não, nos termos do verbete 453 da Súmula do STF. OU Não, pois nesse caso haveria supressão de instância.
        - Não há vedação legal, tendo em vista que Andy ostenta condenação pela prática de contravenção penal e não de crime, sem violação ao Art. 89 da Lei nº 9.099/95.
        - Sim, o argumento de que ocorreu extinção da punibilidade diante da reparação do dano pelo réu, pagamento esse que precedeu sentença irrecorrível, nos termos do Art. 312, § 3º, do CP.
    revisao: *a1
