# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "41"
introducoes:
  peca: "Abelardo, empresário, pagou R$ 500.000 a Lineu, servidor municipal, para que deixasse de praticar atos de ofício. Lineu fez colaboração premiada e disse que dividiu o dinheiro com o chefe, Mendonça, e agia sob as ordens dele, mas não apresentou prova disso. Mendonça negou e provou que o imóvel em que mora veio de herança da mãe; aposentou-se durante o processo. Nos memoriais, o juiz deu prazo comum às defesas dos três réus, inclusive à do colaborador, e a defesa de Mendonça protestou. O juiz titular, que presidiu a instrução, ausentou-se por dois dias para um curso, e a sentença foi dada pelo juiz substituto designado só para casos urgentes, sem urgência no processo. Mendonça foi condenado por corrupção passiva com base só na palavra de Lineu; a pena-base de 2 anos subiu um terço duas vezes, só por haver duas causas de aumento da parte especial; e o juiz cassou a aposentadoria dele por analogia e decretou a perda do imóvel, por ser incompatível com os proventos. Você foi intimado da sentença."
  q1: "Adriano foi condenado no Juizado Especial Criminal por caça em unidade de conservação a 1 ano de detenção, substituída por restritiva de direitos; por erro material, o juiz não aplicou a causa de aumento. Só a defesa apelou, e a Turma Recursal negou o recurso e ainda aplicou a causa de aumento, chegando a 1 ano e 6 meses. O Tribunal concedeu habeas corpus a Adriano, e o Ministério Público interpôs recurso ordinário constitucional."
  q2: "William entrou à noite na área de descarte de um supermercado, num pátio aberto para a rua, e pegou picanha, iogurte, detergente e refrigerante vencidos, separados para o lixo. Foi preso pelos seguranças ao sair e autuado por furto tentado com o aumento do repouso noturno; o gerente confirmou que tudo seria jogado fora. Você foi nomeado advogado dativo dele logo após a comunicação da prisão."
  q3: "Luana, sem querer criar o filho Joaquim, de 8 meses, deixou-o num supermercado movimentado, agasalhado e preso numa cadeirinha de bebê; minutos depois, o bebê foi acolhido, sem nenhum risco, e levado às autoridades. Ela foi denunciada por abandono de incapaz. Nas diligências finais, as imagens mostraram que, ao sair, ela pegou um chocolate. O Ministério Público pediu a condenação nos termos da denúncia, e o juiz a condenou por abandono de incapaz e por furto, com base nas imagens."
  q4: "Jorge foi condenado definitivamente por desacato a 1 ano de detenção, substituída por prestação pecuniária em 12 parcelas. Morreu depois de pagar cinco. A filha, Janaína, herdeira dele, tem novas provas da inocência do pai e quer saber se terá de pagar as parcelas restantes."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["41-peca-1", "41-peca-4", "41-peca-12"]
perguntas:
  - id: 41-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: preliminar
    pergunta: "Que preliminar a defesa de Mendonça deve levantar quanto ao prazo dos memoriais?"
    tese: "Nulidade por cerceamento de defesa: o delatado deve falar depois do colaborador, e não em prazo comum com ele"
    aceitos: [ "cerceamento | ampla defesa | contraditorio | depois do colaborador | apos o colaborador | prazo sucessivo | prazos sucessivos" ]
    artigos: [ "art. 4, § 10-A, Lei 12.850", "art. 5, LV, CRFB", "art. 564, IV, CPP" ]
    gabarito: "Preliminar: cerceamento de defesa (ou violação ao contraditório ou ampla defesa, ou ao devido processo legal ou nulidade por omissão de formalidade essencial), porque não poderia ter sido concedido prazo comum ao colaborador e ao corréu delatado, em violação ao Art. 4º, § 10-A, da Lei nº 12.850/2013, ao Art. 5º, inciso LIV ou LV, da CRFB/88, ou ao Art. 564, inciso IV, do CPP."
    revisao: { status: revisado }
  - id: 41-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: preliminar
    pergunta: "Que preliminar a defesa deve levantar quanto ao juiz que deu a sentença?"
    tese: "Nulidade da sentença por violação da identidade física do juiz: quem presidiu a instrução devia julgar"
    aceitos: [ "identidade fisica | juiz natural" ]
    artigos: [ "art. 399, § 2º, CPP", "art. 5, LIII, CRFB" ]
    gabarito: "Nulidade da sentença, ante a violação ao princípio da identidade física do Juiz ou do Juiz Natural, nos termos do Art. 399, § 2º, do CPP ou Art. 5º, LIII, CRFB."
    revisao: { status: revisado }
  - id: 41-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "No mérito, qual é o pedido principal da defesa de Mendonça?"
    tese: "Absolvição por insuficiência de provas"
    aceitos: [ "absolvi* | absolver" ]
    artigos: [ "art. 386, VII, CPP", "art. 386, V, CPP" ]
    gabarito: "No mérito, deve ser defendida a absolvição de Mendonça, diante da ausência de provas suficientes para a condenação, na forma do Art. 386, inciso II, ou V, ou VII, do CPP."
    revisao: { status: revisado }
  - id: 41-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Por que a palavra de Lineu não basta para condenar Mendonça?"
    tese: "A palavra do colaborador, sem provas de corroboração, não basta para condenar o delatado"
    aceitos: [ "corrobora* | palavra do colaborador sozinha | so a palavra | apenas a palavra | exclusivamente" ]
    artigos: [ "art. 4, § 16, III, Lei 12.850" ]
    gabarito: "Tendo em vista que a palavra do colaborador, sem provas de corroboração, não pode ensejar a condenação do corréu delatado, na forma do Art. 4º, § 16, inciso III, da Lei nº 12.850/13."
    revisao: { status: revisado }
  - id: 41-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Que tese a defesa deve sustentar quanto aos dois aumentos de um terço?"
    tese: "Com duas causas de aumento da parte especial, o juiz pode aplicar só um aumento, o maior: deve ser afastada a duplicidade"
    aceitos: [ [ "um so aumento | uma so causa | apenas um aumento | apenas uma causa | so uma causa | so um aumento" ], [ "afast* | exclu* | decot*", "duplicidade | dois aumentos | duas causas" ] ]
    artigos: [ "art. 68, parágrafo único, CP" ]
    gabarito: "Subsidiariamente, deve ser requerido o afastamento da duplicidade de causas de aumento previstas na parte especial, com aplicação do Art. 68, parágrafo único, do CP."
    revisao: { status: revisado }
  - id: 41-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Que tese a defesa deve sustentar quanto à aposentadoria de Mendonça?"
    tese: "Afastamento da cassação da aposentadoria: não há previsão legal, e a analogia in malam partem é proibida"
    aceitos: [ [ "cassacao", "afast* | nao cabe | inadmiss* | incab* | descab* | nao ha previsao" ], [ "analogia in malam partem | analogia prejudicial | analogia contra o reu | sem previsao legal" ] ]
    artigos: [ "art. 92, I, CP", "art. 1, CP" ]
    gabarito: "Afastamento da cassação da aposentadoria, sendo inadmissível a analogia prejudicial ao réu ou por ausência de previsão legal."
    revisao: { status: revisado }
  - id: 41-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Que tese a defesa deve sustentar quanto ao imóvel de Mendonça?"
    tese: "Afastamento da perda do imóvel, recebido por herança: a origem lícita do bem impede o confisco"
    aceitos: [ [ "perdimento | perda", "afast* | nao cabe | descab* | incab*" ], [ "origem licita | licitude | aquisicao licita | meio licito" ] ]
    artigos: [ "art. 91-A, § 2º, CP", "art. 91, II, b, CP" ]
    gabarito: "Afastamento do perdimento do imóvel, pois a herança configura meio lícito de aquisição de propriedade ou porque não constitui proveito ou produto de crime, forma do Art. 91, II, b ou 91-A, § 2º do CP."
    revisao: { status: revisado }
  - id: 41-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que preliminar a defesa de Adriano deve arguir nas contrarrazões ao recurso do Ministério Público?"
    tese: "Não cabe recurso ordinário constitucional contra decisão que concede habeas corpus, só contra a que denega"
    aceitos: [ "nao cabe | descabi* | incabi* | inadmiss* | nao e cabivel | so contra a que denega | denegatoria" ]
    artigos: [ "art. 105, II, a, CRFB", "art. 30, Lei 8.038" ]
    gabarito: "Na condição de advogado(a) de Adriano, deve ser alegado o descabimento do recurso ordinário constitucional, uma vez que a decisão recorrida foi concessiva de habeas corpus. O recurso só é cabível em face de decisão denegatória, na forma do Art. 105, inciso II, alínea a, da CRFB/88 ou Art. 30, da Lei nº 8.038/90."
    revisao: { status: revisado }
  - id: 41-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que tese processual afasta a causa de aumento aplicada pela Turma Recursal?"
    tese: "Vedação da reformatio in pejus: em recurso só da defesa, o tribunal não pode piorar a pena"
    aceitos: [ "reformatio | reforma para pior | reforma em prejuizo" ]
    artigos: [ "art. 617, CPP", "Súmula 160 STF" ]
    gabarito: "A tese defensiva deduzida em favor de Adriano é a vedação à reformatio in pejus em recurso exclusivo da defesa, consoante o Art. 617 do CPP ou a Súmula 160 do STF."
    revisao: { status: revisado }
  - id: 41-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Qual é a oportunidade mais próxima para defender oralmente a liberdade de William diante do juiz?"
    tese: "Audiência de custódia, logo depois da prisão em flagrante"
    aceitos: [ "audiencia de custodia" ]
    artigos: [ "art. 310, CPP" ]
    gabarito: "A pergunta inicial exige do examinando a identificação de que na audiência de custódia haverá a primeira oportunidade em que, formalmente, há participação obrigatória da defesa. Assim, na forma do Art. 310, caput, do CPP, a primeira oportunidade da defesa técnica de postular a liberdade é na audiência de custódia."
    revisao: { status: revisado }
  - id: 41-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que tese de direito material evita a responsabilização de William?"
    tese: "Atipicidade: as mercadorias descartadas são coisa abandonada, não coisa alheia, e não têm valor econômico relevante"
    aceitos: [ "atipic* | coisa abandonada | res derelicta | abandonad* | nao e coisa alheia | insignifican*" ]
    artigos: [ "art. 155, CP" ]
    gabarito: "Quanto ao direito material, nota-se que William subtraiu bens sem valor econômico e que estavam destinados a descarte. Há atipicidade formal da conduta, pois os bens foram abandonados pelo proprietário (res derelictae), não configurando coisa alheia. Com efeito, o tipo penal de furto exige que se proceda a uma subtração de patrimônio alheio. Ao subtrair bens sem valor econômico, a conduta é formal e materialmente atípica. É igualmente aceito que se manifeste pela inexistência de tipicidade material, ante a incidência do princípio da insignificância, pois os bens não possuem valor econômico significativo."
    revisao: { status: revisado }
  - id: 41-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que tese de direito penal contesta a condenação de Luana por abandono de incapaz?"
    tese: "Atipicidade do abandono de incapaz, crime de perigo concreto: o bebê nunca correu perigo"
    aceitos: [ "perigo concreto | atipic* | sem perigo | nenhum perigo | nao houve perigo | nunca correu perigo" ]
    artigos: [ "art. 133, CP" ]
    gabarito: "Quanto ao aspecto material, deveria o examinando defender a atipicidade da conduta. O crime de abandono de incapaz é de perigo concreto, exige que a integridade física da vítima seja efetivamente colocada em risco iminente. A descrição das condições de abandono, em que a criança foi cautelosamente colocada em cadeira própria e afivelada, deixada em local de grande circulação de pessoas, não configura o tipo penal, por não ensejar risco concreto à segurança do infante."
    revisao: { status: revisado }
  - id: 41-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que tese processual contesta a condenação de Luana pelo furto?"
    tese: "Violação da correlação: o furto não estava na denúncia, e o juiz não podia condenar por ele sem aditamento (mutatio libelli)"
    aceitos: [ "congruencia | correlacao | mutatio libelli | aditamento" ]
    artigos: [ "art. 384, CPP" ]
    gabarito: "Quanto ao direito processual, é de se notar que a sentença violou o princípio da congruência ou da correlação entre a acusação e a sentença, ao deixar de observar o procedimento previsto no Art. 384 do CPP, que determina que o Ministério Público deve aditar a denúncia e reabrir a instrução para que a defesa possa se manifestar sobre os novos fatos."
    revisao: { status: revisado }
  - id: 41-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Janaína terá de pagar as parcelas restantes da prestação pecuniária?"
    tese: "A morte do condenado extingue a punibilidade, e a pena não passa da pessoa dele (intranscendência)"
    aceitos: [ "intranscendencia | personalidade da pena | nao passa da pessoa | responsabilidade pessoal | intransmissib* | extincao da punibilidade | extingue a punibilidade" ]
    artigos: [ "art. 107, I, CP", "art. 5, XLV, CRFB" ]
    gabarito: "Não, diante do princípio da intranscendência da pena ou o da responsabilidade pessoal ou personalidade ou intransmissibilidade da pena, a morte do condenado extingue a punibilidade, na forma do Art. 107, inciso I, do CP, ou do Art. 5º, inciso XLV, da CRFB/88 ou Artigo 5, item 3, da Convenção Americana sobre Direitos Humanos o Pacto de San José da Costa Rica (aprovada pelo Decreto 678/92)."
    revisao: { status: revisado }
  - id: 41-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que meio processual permite a Janaína provar a inocência do pai?"
    tese: "Revisão criminal, que cabe mesmo após a morte do condenado e pode ser pedida pela filha"
    aceitos: [ "revisao criminal" ]
    artigos: [ "art. 623, CPP", "art. 621, III, CPP" ]
    gabarito: "Janaína pode pleitear a revisão criminal em favor de seu pai, na forma do Art. 621, inciso III, ou o Art. 623, ambos do CPP."
    revisao: { status: revisado }
