# Gerado por scripts/gerar-perguntas-exames.ts. Revise e marque revisao.status: revisado.
exame: "41"
perguntas:
  - id: 41-peca-1
    categoria: peca-detalhe
    parte: peca
    item: "1"
    secao: enderecamento
    caso: |-
      O Ministério Público denunciou Abelardo, Lineu e Mendonça, afirmando que Abelardo, empresário, teria oferecido vantagem indevida a fim de obstar os atos de ofício de Lineu, subordinado a Mendonça, ambos servidores públicos municipais da administração direta. Foi imputada ao acusado Abelardo a conduta tipificada no Art. 333, parágrafo único, do CP; a Lineu, a prática das condutas descritas no Art. 317, § 1º, do CP; e a Mendonça, a conduta descrita no Art. 317, § 1º, c/c o Art. 327, § 2º, ambos do CP, pois provas documentais corroboraram que Lineu deixou de praticar os atos de ofício que lhe competiam, e que Mendonça ocupava a função de direção do órgão público.

      A denúncia foi distribuída à Vara Criminal da Comarca de Flores, Estado de Campo Belo (CB), local dos fatos.

      Lineu celebrou acordo de colaboração premiada com o Ministério Público, nos termos da Lei nº 12.850/13, devidamente homologado pelo Juízo competente, fornecendo provas de que Abelardo lhe fez pagamentos no valor total de R$ 500.000,00 (quinhentos mil reais), a fim de que não realizasse os atos de ofício que lhe cabiam.

      Asseverou que dividiu essa vantagem patrimonial indevida com Mendonça, seu superior imediato, e que agia sob suas ordens e comando, mas, quanto a este ponto, não apresentou provas de corroboração. A instrução processual ocorreu sem intercorrências, sendo que Mendonça se aposentou no curso do processo. Lineu reafirmou os termos de sua colaboração, Abelardo, por sua vez, fez uso de seu direito ao silêncio, enquanto Mendonça negou os fatos e afirmou que o imóvel onde reside é herança de sua mãe, exibindo os documentos públicos que comprovam a regular transmissão causa mortis.

      O Juízo convolou os debates orais em memoriais e concedeu prazo para o Ministério Público e, em seguida, prazo comum às defesas dos três acusados, o que motivou os protestos da defesa de Mendonça.

      O Juiz titular, que presidiu a instrução, afastou-se por dois dias para participar de um curso oficial, razão pela qual a sentença foi prolatada pelo Juiz substituto, designado para atuar apenas em causas urgentes, ainda que nenhuma urgência houvesse neste processo. Assim, Mendonça foi condenado como incurso nas penas do Art. 317, § 1º, c/c o Art. 327, § 2º, ambos do CP, considerando provada a corrupção passiva por meio do interrogatório de Lineu, colaborador, o que foi reputado suficiente para provar materialidade e autoria delitivas. Aplicou a pena-base no mínimo legal de dois anos, majorada em um terço por duas vezes consecutivas, justificada exclusivamente pela existência de duas causas de aumento previstas na parte especial do Código Penal, alcançando a pena de 3 (três)

      anos, 6 (seis) meses e 20 (vinte) dias de reclusão, em regime aberto, e substituiu a pena privativa de liberdade por duas restritivas de direitos. Determinou a cassação da aposentadoria de Mendonça, na forma do Art. 92, inciso I, a, do CP, aplicável por analogia, bem como a perda do imóvel de sua propriedade, uma vez que de valor incompatível com seus proventos, fato suficiente para autorizar o perdimento. O Ministério Público, intimado da sentença, manteve-se inerte. Você, como advogado(a) de Mendonça, é intimado(a) no dia 6 de setembro de 2024, sexta-feira, sendo o dia seguinte e os dias de segunda a sexta-feira úteis em todo o país.

      Considerando apenas as informações narradas, na condição de advogado(a) de Mendonça, redija a peça jurídica cabível, diferente de habeas corpus, e considerando que a sentença não padece de vício de contradição, obscuridade, ambiguidade ou omissão, apresente todas as teses jurídicas pertinentes. A peça deverá ser datada no último dia do prazo para interposição. (Valor: 5,00)

      Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples
    comando: A quem deve ser endereçada a peça?
    gabarito: "Endereçamento: Vara Criminal da Comarca de Flores/CB."
    opcoes:
      correta: "Endereçamento: Vara Criminal da Comarca de Flores/CB."
      erradas:
        - "Endereçamento correto das razões: Tribunal de Justiça do Estado."
        - "Endereçamento: Tribunal de Justiça do Estado do Rio Grande do Sul."
        - A peça deve ser endereçada ao Juiz do Juizado Especial Criminal.
        - "Endereçamento correto: Tribunal de Justiça do Rio de Janeiro."
        - "Endereçamento: Tribunal Regional Federal da 10ª Região."
    revisao: &a1
      status: revisado
