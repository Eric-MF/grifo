  - id: 41-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Jorge foi definitivamente condenado à pena de desacato, fixada em um ano de detenção, em regime aberto.

      Presentes os requisitos, a pena de reclusão foi substituída por uma pena de prestação pecuniária. Foi autorizado o parcelamento do cumprimento da pena em 12 (doze) prestações iguais e sucessivas.

      Após o pagamento de cinco parcelas, Jorge faleceu. A filha de Jorge, Janaína, maior e herdeira de bens deixados pelo falecido, procura você, como advogado(a), informando ter obtido novas provas capazes de comprovar a inocência de seu pai, bem como indagando a respeito da sua responsabilidade pessoal pelo pagamento das parcelas da prestação pecuniária que seu pai não quitou em vida.

      Assim, responda às questões a seguir.
    comando: As parcelas remanescentes da pena de prestação pecuniária poderão ser cobradas de Janaína? Responda, fundamentadamente, indicando o princípio de Direito Penal aplicável.
    gabarito: Não, diante do princípio da intranscendência da pena ou o da responsabilidade pessoal ou personalidade ou intransmissibilidade da pena, a morte do condenado extingue a punibilidade, na forma do Art. 107, inciso I, do CP, ou do Art. 5º, inciso XLV, da CRFB/88 ou Artigo 5, item 3, da Convenção Americana sobre Direitos Humanos o Pacto de San José da Costa Rica (aprovada pelo Decreto 678/92).
    opcoes:
      correta: Não, diante do princípio da intranscendência da pena ou o da responsabilidade pessoal ou personalidade ou intransmissibilidade da pena, a morte do condenado extingue a punibilidade, na forma do Art. 107, inciso I, do CP, ou do Art. 5º, inciso XLV, da CRFB/88 ou Artigo 5, item 3, da Convenção Americana sobre Direitos Humanos o Pacto de San José da Costa Rica (aprovada pelo Decreto 678/92).
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A medida a ser adotada pelo defensor técnico do acusado para viabilizar proposta de transação penal é requerer ao Juízo a remessa dos autos ao órgão superior do Ministério Público para reexame do cabimento dessa proposta. Isso porque a extinção da pena há mais de cinco anos deixa de produzir efeitos jurídicos, nos termos do Art. 64, inciso I, do CP.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
    revisao: *a1
