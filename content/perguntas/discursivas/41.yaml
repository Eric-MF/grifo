      Na qualidade de advogado(a) de Adriano, responda às questões a seguir.
    comando: Qual a tese processual cabível a ser defendida, a fim de garantir o afastamento da causa de aumento aplicada a Adriano? Fundamente.
    gabarito: A tese defensiva deduzida em favor de Adriano é a vedação à reformatio in pejus em recurso exclusivo da defesa, consoante o Art. 617 do CPP ou a Súmula 160 do STF.
    opcoes:
      correta: A tese defensiva é a impossibilidade de promover reformatio in pejus, na forma do Art. 617 do CPP ou da Súmula 160 do STF.
      erradas:
