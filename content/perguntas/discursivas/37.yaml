      O(A) advogado(a) constituído(a) foi intimado(a) no dia 11/04/2023 (terça-feira).

      Considerando apenas as informações expostas, apresente, na condição de advogado(a) de Ricardo e Roberto, a peça jurídica cabível, diferente do habeas corpus e embargos de declaração, expondo todas as teses pertinentes de direito material e processual. A peça deverá ser datada no último dia do prazo para apresentação, devendo segunda a sexta-feira serem considerados dias úteis em todo o país. (Valor: 5,00)

      Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples menção ou transcrição do dispositivo legal não confere pontuação.
    comando: Que pedido deve ser formulado na peça?
    gabarito: Subsidiariamente, o acolhimento das teses defensivas de aplicação da pena.
    opcoes:
      correta: Subsidiariamente, o acolhimento das teses defensivas de aplicação da pena.
      erradas:
        - Reconhecimento da preliminar e extinção da punibilidade; impronúncia, nos termos do art. 414 do CPP (admite-se absolvição sumária, art. 415).
        - Fixação do regime aberto OU concessão de suspensão condicional da pena
        - Conhecimento e provimento do recurso, com a desclassificação para homicídio culposo na direção de veículo automotor.
        - Rol de testemunhas (Maria, José e Natália).
        - Oferecimento de proposta de suspensão condicional do processo.
