  - id: 37-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Débora e Cristiane são amigas e se encontraram em um restaurante. Durante o almoço, elas começaram a conversar, de forma reservada e sem expectativa de estarem sendo ouvidas por terceiros, sobre Jéssica, conhecida de ambas. As amigas mencionaram que Jéssica era “ridícula” e que “se acha”.

      Jenifer, amiga de Jéssica, sem que Débora e Cristiane percebessem, aproximou-se da mesa de ambas de forma discreta e iniciou uma gravação ambiental (com amplificação sonora), captando o áudio da conversa com todas as qualidades negativas que Débora e Cristiane atribuiam a Jéssica.

      Jenifer entregou a gravação à ofendida. De posse da referida gravação ambiental, Jéssica ajuízou uma queixa-crime contra Débora e Cristiane, dando-as como incursas nas penas do Art. 140, caput, do Código Penal.

      Na qualidade de advogado(a) contratado(a) por Débora e Cristiane, responda às questões a seguir.
    comando: Qual a tese de direito processual a ser deduzida em favor das quereladas, notadamente, sobre a prova utilizada para embasar a queixa? Justifique.
    gabarito: A questão processual envolve conhecimentos sobre a (i)licitude de provas produzidas mediante gravação ambiental, sem autorização judicial e sem conhecimento de qualquer dos interlocutores, devendo ser destacada a inexistência de qualquer objetivo de autodefesa. Assim, a conduta de Jenifer viola o direito à intimidade das quereladas, tratando-se de prova ilícita, ante a violação expressa do que dispõe o Art. 8º-A da Lei nº 9.296/96 (ou Art. 157, do CPP ou Art. 5º, inciso LVI, da CRFB/88). A conduta de Jenifer, inclusive, poderia em tese ser tipificada no Art. 10-A, da mesma lei, pois não autorizada por nenhuma das interlocutoras.
    opcoes:
      correta: Ilicitude do meio de obtenção da prova, produzida a partir da captação ambiental realizada por Jenifer, pois a gravação ambiental dependeria de autorização judicial, na forma do Art. 8º-A da Lei nº 9.296/96 OU Art. 157, do CPP OU Art. 5º, inciso LVI, da CRFB/88.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não pode ser considerado fato posterior como falta grave a afastar o preenchimento do requisito subjetivo OU o decreto mencionava que o apenado não poderia ter praticado falta grave nos 12 meses anteriores ao decreto, em respeito ao princípio da legalidade OU porque a decisão que reconhece o indulto é meramente declaratória
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
