  - id: 37-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Luís, sócio administrador de Exatas Contábeis S/A, foi condenado pela supressão de tributos praticada pela prestação de informações falsas às autoridades fazendárias (Art. 1º, inciso I, da Lei nº 8.137/90), apurado definitivamente em procedimento fiscal, no montante de R$ 1.500.000,00 (um milhão e quinhentos mil reais).

      A sentença condenou o acusado a uma pena de dois anos de reclusão, em regime aberto, substituída por duas penas restritivas de direito a serem fixadas pelo MM Juízo de Execução Penal. Expedida a carta de execução ao Juízo de Execução Penal, este fixou as penas restritivas substitutivas da pena privativa de liberdade em prestação de serviços à comunidade, em jornada semanal de 8h (oito horas), calculada à razão de uma hora por dia de condenação, e prestação pecuniária, esta equivalente ao valor do prejuízo apurado (R$ 1.500.000,00). Insatisfeito com a decisão do Juiz de Execução Penal, Luís solicita que você, como advogado(a), adote as providências necessárias à observância da legalidade estrita na aplicação das penas restritivas de direitos.

      Na qualidade de advogado de Luís, responda aos itens a seguir.
    comando: Qual o recurso cabível contra a decisão mencionada? Fundamente.
    gabarito: Tendo em vista que foi prolatada decisão pelo Juízo de Execução Penal, a decisão deve ser atacada pela via de agravo em execução, na forma do Art. 197 da LEP.
    opcoes:
      correta: Agravo em execução, na forma do Art. 197 da LEP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - A defesa deveria alegar a proibição de aplicação de sanções coletivas, nos termos do Art. 45, §3º, da LEP
        - "A hipótese é de resultado diverso do pretendido (art. 74 do CP), devendo responder por dano em concurso formal com o crime de homicídio culposo. OBS.: a mera indicação de dispositivo legal ou transcrição de seu conteúdo não será pontuada."
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
