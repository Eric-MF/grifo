  - id: 37-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Em 15 de julho de 2020, surgiu uma calorosa discussão entre os amigos Pedro e Júnior, durante uma comemoração de aniversário em um bar da cidade. Pedro, sem querer mais discussões, levantou-se para ir embora. Júnior, ainda transtornado, olhou para a porta do bar e, vendo que o amigo ia embora, arremessou uma caneca de cerveja contra ele, no intuito de lesioná-lo. Ocorre que Júnior errou o alvo e acabou acertando seu próprio irmão, Geraldo, que usava uma camisa idêntica à de Pedro, causando-lhe lesão leve.

      Em 16 de julho de 2020, a lesão leve foi atestada em laudo pericial e o fato foi registrado na Delegacia, por Pedro e Geraldo, que acharam absurda a reação de Júnior.

      Em 23 de julho de 2020, Pedro e Geraldo mudaram de ideia. Eles retornaram à Delegacia, afirmando que Júnior tem sangue quente e que não merecia ser processado, porque era boa pessoa. Relataram que se conhecem há muitos anos, que é comum discutirem daquela forma e que já tinham esquecido o ocorrido.

      Em 30 de março de 2021, o Ministério Público ofereceu denúncia em face de Júnior, como incurso nas sanções do Art. 129, caput, agravada pelo Art. 61, inciso II, alínea e, ambos do CP, crime de lesão corporal leve agravado por ter sido cometido contra irmão.

      Sobre o caso narrado, responda aos itens a seguir.
    comando: Qual o argumento de direito processual que pode ser alegado em favor de Júnior para o não recebimento da denúncia? Justifique.
    gabarito: Embora tenha feito o registro de ocorrência sobre o fato, dias após e antes do oferecimento da denúncia, Geraldo manifestou na Delegacia que não tinha interesse em processar Júnior. Houve, portanto, retratação da representação, na forma do Art. 25, a contrario sensu, do CPP. Ausente a condição de procedibilidade para a ação penal pública condicionada, a denúncia deve ser rejeitada pelo juiz, na forma do Art. 395, inciso II, do CPP.
    opcoes:
      correta: Ausência de condição de procedibilidade pois houve a retratação da representação antes do oferecimento da denúncia, nos moldes do Art. 395, inciso II do CPP OU Art. 25, a contrario sensu, do CPP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não pode ser considerado fato posterior como falta grave a afastar o preenchimento do requisito subjetivo OU o decreto mencionava que o apenado não poderia ter praticado falta grave nos 12 meses anteriores ao decreto, em respeito ao princípio da legalidade OU porque a decisão que reconhece o indulto é meramente declaratória
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 37-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Em 15 de julho de 2020, surgiu uma calorosa discussão entre os amigos Pedro e Júnior, durante uma comemoração de aniversário em um bar da cidade. Pedro, sem querer mais discussões, levantou-se para ir embora. Júnior, ainda transtornado, olhou para a porta do bar e, vendo que o amigo ia embora, arremessou uma caneca de cerveja contra ele, no intuito de lesioná-lo. Ocorre que Júnior errou o alvo e acabou acertando seu próprio irmão, Geraldo, que usava uma camisa idêntica à de Pedro, causando-lhe lesão leve.

      Em 16 de julho de 2020, a lesão leve foi atestada em laudo pericial e o fato foi registrado na Delegacia, por Pedro e Geraldo, que acharam absurda a reação de Júnior.

      Em 23 de julho de 2020, Pedro e Geraldo mudaram de ideia. Eles retornaram à Delegacia, afirmando que Júnior tem sangue quente e que não merecia ser processado, porque era boa pessoa. Relataram que se conhecem há muitos anos, que é comum discutirem daquela forma e que já tinham esquecido o ocorrido.

      Em 30 de março de 2021, o Ministério Público ofereceu denúncia em face de Júnior, como incurso nas sanções do Art. 129, caput, agravada pelo Art. 61, inciso II, alínea e, ambos do CP, crime de lesão corporal leve agravado por ter sido cometido contra irmão.

      Sobre o caso narrado, responda aos itens a seguir.
    comando: É cabível a incidência da agravante imputada em desfavor de Júnior? Justifique.
    gabarito: |-
      Não. Houve erro de tipo acidental, erro quanto à pessoa, previsto no Art. 20, § 3º, do CP. Nesse caso, não se consideram as condições ou qualidades da vítima, senão as da pessoa contra quem o agente queria praticar o crime. Júnior, pensando que seu amigo ia embora, arremessou uma caneca de cerveja no intuito de lesioná-lo.

      Entretanto, Júnior acabou acertando Geraldo, seu irmão, causando-lhe lesão leve. Alternativamente, admite-se aplicação do Art. 73, do CP, com a conclusão de ter havido erro na execução. De todo modo, Júnior está incurso nas sanções do crime de lesão corporal leve, na forma do Art. 129, caput, do CP, devendo ser afastada a agravante do Art. 61, inciso II, alínea e, do CP.
    opcoes:
      correta: Não. Houve erro quanto à pessoa OU erro na execução. Nesse caso, não se consideram as condições ou qualidades da vítima, e sim as da pessoa contra quem o agente queria praticar o crime, conforme o Art. 20, § 3º, do CP OU Art. 73 do CP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não pode ser considerado fato posterior como falta grave a afastar o preenchimento do requisito subjetivo OU o decreto mencionava que o apenado não poderia ter praticado falta grave nos 12 meses anteriores ao decreto, em respeito ao princípio da legalidade OU porque a decisão que reconhece o indulto é meramente declaratória
        - "Sim, é competente a Justiça Estadual, pois conforme já mencionado não houve dolo de traficar para o exterior. OBS.1: A justificativa correta é essencial para atribuição de pontos, pois não há intervalo de pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - Sim, poderia ser buscada a suspensão condicional da pena, já que Arnaldo era maior de 70 anos na data dos fatos E a sanção penal aplicada é inferior a 4 anos, nos termos do Art. 77, §2º, do Código Penal.
        - Não foi válida a citação de Carla, já que ela não estava em local incerto e não sabido ou que não estava se ocultando para não ser citada, já que Carla possuía endereço fixo e conhecido, conforme Art. 361 ou 362 ambos do CPP
