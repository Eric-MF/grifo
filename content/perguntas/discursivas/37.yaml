    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Atipicidade da conduta.
    opcoes:
      correta: Atipicidade da conduta.
      erradas:
        - Memoriais endereçados ao Juiz do Tribunal do Júri.
        - A nulidade decorre da ausência de intimação do réu para realização da audiência de instrução e julgamento, o que representa cerceamento de defesa OU configurando violação ao princípio da ampla defesa, nos termos do Art. 5º, LV, CRFB/88 OU Art. 564, IV, do CPP.
        - "Da inaplicabilidade da reincidência: não há que se falar em reincidência, nos termos do artigo 63 do CP."
        - Absolvição sumária, tendo em vista que a conduta narrada evidentemente não constitui crime.
        - Reconhecimento da atenuante da menoridade relativa, já que o réu era menor de 21 anos na data dos fatos, nos termos do Art. 65, inciso I, do CP.
