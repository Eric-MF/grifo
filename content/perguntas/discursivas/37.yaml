# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "37"
introducoes:
  peca: "Ricardo e Roberto passaram 30 minutos numa agência bancária tentando, com serrote e chave de fenda, romper a placa de aço de um caixa eletrônico, mas só conseguiram arranhá-la; desistiram e foram presos ao sair. Foram denunciados por furto qualificado pelo rompimento de obstáculo e pelo concurso de pessoas, na forma tentada; a prova se resumiu aos depoimentos dos policiais e dos réus. O banco informou que a estrutura de aço é imune à ação mecânica da força humana. Ricardo, que tinha uma condenação por furto com pena extinta em 10/4/2019, ficou 30 dias preso preventivamente; Roberto, 2 dias. Os dois confessaram. O Ministério Público pediu a condenação nos termos da denúncia, e você foi intimado para a manifestação final."
  q1: "Em 15/7/2020, numa discussão num bar, Júnior jogou uma caneca de cerveja em Pedro para machucá-lo, mas errou e acertou o próprio irmão, Geraldo, que usava uma camisa igual à de Pedro, causando-lhe lesão leve. Pedro e Geraldo registraram o fato na delegacia no dia seguinte, mas, uma semana depois, voltaram e disseram que não queriam mais ver Júnior processado. Em março de 2021, Júnior foi denunciado por lesão corporal leve, com a agravante de crime contra irmão."
  q2: "Luís foi condenado por sonegação fiscal de R$ 1.500.000 a 2 anos no regime aberto, substituídos por duas penas restritivas de direitos. O juiz da execução fixou prestação de serviços à comunidade e uma prestação pecuniária igual a todo o prejuízo apurado."
  q3: "Débora e Cristiane conversavam reservadamente num restaurante e disseram que Jéssica era “ridícula” e que “se acha”. Sem que percebessem, Jenifer, amiga de Jéssica, gravou a conversa com amplificação sonora e entregou a gravação a Jéssica, que ofereceu queixa-crime por injúria contra as duas."
  q4: "Lúcio apontava a arma para a cabeça de Vilma enquanto Adamastor exigia as chaves do carro, ameaçando-a de morte, e os dois levaram o veículo. Ambos foram condenados por roubo com emprego de arma de fogo, e só Adamastor apelou, dizendo que a arma era só de Lúcio e que ela não disparava."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["37-peca-1", "37-peca-4-1", "37-peca-11"]
perguntas:
  - id: 37-peca-4-2
    categoria: peca-detalhe
    parte: peca
    item: "4.2"
    secao: pedido
    pergunta: "O caixa era imune à força humana. Que tese a defesa deve sustentar quanto ao furto tentado?"
    tese: "Crime impossível, pela absoluta ineficácia do meio empregado"
    aceitos: [ "crime impossivel" ]
    artigos: [ "art. 17, CP" ]
    gabarito: "Pedido de reconhecimento do crime impossível, ante a absoluta ineficácia do meio empregado, nos termos do Art. 17 do CP."
    revisao: { status: revisado }
  - id: 37-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Que tese a defesa deve sustentar quanto à qualificadora do rompimento de obstáculo?"
    tese: "Afastamento da qualificadora do rompimento de obstáculo, porque não houve perícia"
    aceitos: [ [ "afast* | exclu* | decote | nao incid*", "qualificadora | rompimento | obstaculo" ], [ "sem pericia | falta de pericia | ausencia de pericia | nao houve pericia | sem laudo | sem exame" ] ]
    artigos: [ "art. 158, CPP", "art. 171, CPP" ]
    gabarito: "Impõe-se o afastamento da qualificadora de rompimento de obstáculo, ante a ausência de prova pericial nos termos do Art. 158 do CPP."
    revisao: { status: revisado }
  - id: 37-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Os réus admitiram a tentativa de arrombamento. Que atenuante a defesa deve pedir?"
    tese: "Atenuante da confissão espontânea"
    aceitos: [ "confissao espontanea | confissao" ]
    artigos: [ "art. 65, III, d, CP" ]
    gabarito: "Reconhecimento da atenuante da confissão espontânea, nos termos do Art. 65, inciso III, alínea d, do CP."
    revisao: { status: revisado }
  - id: 37-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Se mantida a condenação pela tentativa, que fração de redução a defesa deve pedir?"
    tese: "Pena-base no mínimo e redução máxima da tentativa, de 2/3, porque o crime ficou longe da consumação"
    aceitos: [ "2/3 | dois tercos | fracao maxima | reducao maxima" ]
    artigos: [ "art. 14, parágrafo único, CP", "art. 14, II, CP" ]
    gabarito: "Aplicação da pena base no mínimo legal e aplicação da fração máxima da causa de diminuição pelo crime tentado, nos moldes do Art. 14, inciso II, do CP."
    revisao: { status: revisado }
  - id: 37-peca-8-1
    categoria: peca-detalhe
    parte: peca
    item: "8.1"
    secao: merito
    pergunta: "Que regime ou espécie de pena a defesa deve pedir para Roberto, que é primário?"
    tese: "Regime aberto ou substituição da pena por restritivas de direitos para o réu primário"
    aceitos: [ "aberto | substitui* | restritiva*" ]
    artigos: [ "art. 33, § 2º, c, CP", "art. 44, CP" ]
    gabarito: "Em relação a Roberto, fixação do regime aberto OU aplicação de penas substitutivas, na forma do Art. 33, § 2º, alínea c OU Art. 44, ambos do CP."
    revisao: { status: revisado }
  - id: 37-peca-8-2
    categoria: peca-detalhe
    parte: peca
    item: "8.2"
    secao: merito
    pergunta: "Ricardo é reincidente. Que regime inicial a defesa deve pedir para ele?"
    tese: "Regime inicial semiaberto para o reincidente com pena de até 4 anos e circunstâncias judiciais favoráveis"
    aceitos: [ "semiaberto | semi-aberto | semi aberto" ]
    artigos: [ "Súmula 269 STJ", "art. 33, § 2º, b, CP" ]
    gabarito: "Em relação a Ricardo, fixação de regime semiaberto, na forma do Art. 33, § 2º, alínea b, do CP ou Súmula 269 do STJ."
    revisao: { status: revisado }
  - id: 37-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "O que a defesa deve pedir quanto aos dias em que os réus ficaram presos?"
    tese: "Detração do tempo de prisão provisória: 30 dias para Ricardo e 2 para Roberto"
    aceitos: [ "detracao | tempo de prisao provisoria | tempo de prisao preventiva | desconto do tempo" ]
    artigos: [ "art. 387, § 2º, CPP" ]
    gabarito: "Deve ser reconhecida a detração do período de prisão preventiva, de 30 dias para Ricardo e 2 (dois) dias para Roberto, nos termos do Art. 387, § 2º, do CPP."
    revisao: { status: revisado }
  - id: 37-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: pedido
    pergunta: "Qual é o pedido principal da defesa?"
    tese: "Absolvição, porque o fato não constitui crime (crime impossível)"
    aceitos: [ "absolvi* | absolver" ]
    artigos: [ "art. 386, III, CPP" ]
    gabarito: "Absolvição, na forma do Art. 386, inciso III, do CPP."
    revisao: { status: revisado }
  - id: 37-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento processual impede o recebimento da denúncia?"
    tese: "Falta de condição de procedibilidade: as vítimas se retrataram da representação antes da denúncia"
    aceitos: [ "retrata* | condicao de procedibilidade | falta de representacao | ausencia de representacao" ]
    artigos: [ "art. 395, II, CPP", "art. 25, CPP" ]
    gabarito: "Embora tenha feito o registro de ocorrência sobre o fato, dias após e antes do oferecimento da denúncia, Geraldo manifestou na Delegacia que não tinha interesse em processar Júnior. Houve, portanto, retratação da representação, na forma do Art. 25, a contrario sensu, do CPP. Ausente a condição de procedibilidade para a ação penal pública condicionada, a denúncia deve ser rejeitada pelo juiz, na forma do Art. 395, inciso II, do CPP."
    revisao: { status: revisado }
  - id: 37-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Cabe a agravante de crime contra irmão?"
    tese: "Erro na execução (aberratio ictus): consideram-se as condições da vítima visada, e não as do irmão atingido"
    aceitos: [ "erro sobre a pessoa | erro quanto a pessoa | erro na execucao | aberratio ictus | error in persona" ]
    artigos: [ "art. 73, CP", "art. 20, § 3º, CP" ]
    gabarito: "Não. Houve erro de tipo acidental, erro quanto à pessoa, previsto no Art. 20, § 3º, do CP. Nesse caso, não se consideram as condições ou qualidades da vítima, senão as da pessoa contra quem o agente queria praticar o crime. Júnior, pensando que seu amigo ia embora, arremessou uma caneca de cerveja no intuito de lesioná-lo.\n\nEntretanto, Júnior acabou acertando Geraldo, seu irmão, causando-lhe lesão leve. Alternativamente, admite-se aplicação do Art. 73, do CP, com a conclusão de ter havido erro na execução. De todo modo, Júnior está incurso nas sanções do crime de lesão corporal leve, na forma do Art. 129, caput, do CP, devendo ser afastada a agravante do Art. 61, inciso II, alínea e, do CP."
    revisao: { status: revisado }
  - id: 37-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que recurso cabe contra a decisão do juiz da execução?"
    tese: "Agravo em execução contra a decisão do juiz da execução"
    aceitos: [ "agravo em execucao | agravo de execucao" ]
    artigos: [ "art. 197, LEP" ]
    gabarito: "Tendo em vista que foi prolatada decisão pelo Juízo de Execução Penal, a decisão deve ser atacada pela via de agravo em execução, na forma do Art. 197 da LEP."
    revisao: { status: revisado }
  - id: 37-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que argumento de mérito favorece Luís?"
    tese: "A prestação pecuniária tem o limite de 360 salários mínimos"
    aceitos: [ "360 salarios | 360 salarios minimos | limite" ]
    artigos: [ "art. 45, § 1º, CP" ]
    gabarito: "O advogado de Luís deve alegar que a pena de prestação pecuniária é limitada ao valor de 360 salários mínimos, conforme Art. 45, § 1º, do Código Penal."
    revisao: { status: revisado }
  - id: 37-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que tese processual contesta a prova que embasou a queixa?"
    tese: "Ilicitude da prova: a captação ambiental de conversa reservada, feita por terceiro sem autorização judicial, é ilícita"
    aceitos: [ "ilicit* | ilegal* | autorizacao judicial" ]
    artigos: [ "art. 8-A, Lei 9.296", "art. 157, CPP", "art. 5, LVI, CRFB" ]
    gabarito: "A questão processual envolve conhecimentos sobre a (i)licitude de provas produzidas mediante gravação ambiental, sem autorização judicial e sem conhecimento de qualquer dos interlocutores, devendo ser destacada a inexistência de qualquer objetivo de autodefesa. Assim, a conduta de Jenifer viola o direito à intimidade das quereladas, tratando-se de prova ilícita, ante a violação expressa do que dispõe o Art. 8º-A da Lei nº 9.296/96 (ou Art. 157, do CPP ou Art. 5º, inciso LVI, da CRFB/88). A conduta de Jenifer, inclusive, poderia em tese ser tipificada no Art. 10-A, da mesma lei, pois não autorizada por nenhuma das interlocutoras."
    revisao: { status: revisado }
  - id: 37-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que tese de direito material leva à absolvição das quereladas?"
    tese: "Atipicidade da injúria: faltou o dolo de ofender, porque a conversa era privada e não era para chegar a Jéssica"
    aceitos: [ "atipic* | dolo de ofender | animus injuriandi | sem dolo | falta de dolo | ausencia de dolo" ]
    artigos: [ "art. 140, CP" ]
    gabarito: "Quanto à questão material, deve ser observado que o delito de injúria se caracteriza por ser um delito doloso, requer o dolo direto de causar ofensa à honra subjetiva da vítima. Dessa forma, somente é possível a prática do delito se houver intenção deliberada de atingir o destinatário da ofensa, o que não ocorreu no caso presente, pois Débora e Cristiane conversavam entre si, sem qualquer expectativa de fazer chegar à Jéssica as ofensas proferidas. Por isso, deve ser reconhecida a atipicidade da conduta."
    revisao: { status: revisado }
  - id: 37-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "A tese de que só Lúcio portava a arma favorece Adamastor?"
    tese: "O emprego da arma é circunstância objetiva e se comunica ao coautor que sabia dela"
    aceitos: [ "objetiva | comunica* | elementar" ]
    artigos: [ "art. 30, CP" ]
    gabarito: "Não, pois a dinâmica delitiva deixa claro que ambos agiram com dolo, conhecimento e vontade de empregar a arma de fogo na atividade criminosa. Nesse sentido, era exigido do examinando o conhecimento do Art. 30 do Código Penal, que trata sobre a incomunicabilidade das circunstâncias pessoais, salvo quando elementares do crime. Assim, pouco importa se quem portava a arma era Lúcio, havendo concurso de pessoas, e sendo o emprego de arma uma circunstância objetiva, há comunicabilidade a todos os co-autores. Por isso, a alegação de que apenas Lúcio portava a arma não poderia, no caso, prejudicá-lo ou conceder a Adamastor tratamento penal mais vantajoso."
    revisao: { status: revisado }
  - id: 37-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Se o Tribunal reconhecer que a arma não disparava, Lúcio se beneficia?"
    tese: "Efeito extensivo do recurso: a tese objetiva da arma inapta beneficia também o corréu que não recorreu"
    aceitos: [ "efeito extensivo | extensao | se estende | estende" ]
    artigos: [ "art. 580, CPP" ]
    gabarito: "Em razão do exposto acima, quanto à questão processual, esperava-se a resposta positiva, pois o efeito extensivo do recurso beneficia Lúcio por ser embasado em circunstância objetiva, na forma do Art. 580, do CPP."
    revisao: { status: revisado }
