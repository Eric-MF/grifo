    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Em relação a Roberto, fixação do regime aberto OU aplicação de penas substitutivas, na forma do Art. 33, § 2º, alínea c OU Art. 44, ambos do CP.
    opcoes:
      correta: Em relação a Roberto, fixação do regime aberto OU aplicação de penas substitutivas, na forma do Art. 33, § 2º, alínea c OU Art. 44, ambos do CP.
      erradas:
        - Memoriais endereçados ao Juiz do Tribunal do Júri.
        - A nulidade decorre da ausência de intimação do réu para realização da audiência de instrução e julgamento, o que representa cerceamento de defesa OU configurando violação ao princípio da ampla defesa, nos termos do Art. 5º, LV, CRFB/88 OU Art. 564, IV, do CPP.
        - O delito não foi praticado após o trânsito em julgado de condenação anterior; sentença condenatória recorrível não gera reincidência.
        - A arma de fogo utilizada não era apta a efetuar disparos, logo houve absoluta ineficácia do meio utilizado.
        - Aplicação do regime inicial semiaberto ou aberto com base na pena a ser aplicada e primariedade do réu, nos termos do Art. 33, § 2º, alíneas b ou c, do CP.
