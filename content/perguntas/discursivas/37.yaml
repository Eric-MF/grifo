  - id: 37-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Lúcio e Adamastor, em comunhão de ações e desígnios, com o emprego de arma de fogo, subtraíram o veículo dirigido pela vítima, Vilma. Pela dinâmica delituosa, Lúcio empunhava a arma de fogo contra a cabeça da vítima, enquanto Adamastor exigia a entrega das chaves do veículo, sob palavras de ordem e graves ameaças contra a vida de Vilma, afirmando que “caso não entregasse o veículo, levaria um tiro.”

      Ambos foram condenados, sendo que Lúcio e o Ministério Público não recorreram da condenação.

      Adamastor, por meio de sua defesa técnica (distinta da defesa de Lúcio), interpôs recurso, alegando que a arma de fogo era portada apenas por Lúcio e que esta era incapaz de produzir disparos.

      Lúcio afirma ao advogado que se sentiu traído pelo argumento deduzido por Adamastor, sendo sua intenção, apenas, que ambos tivessem a mesma condenação.

      Na qualidade de advogado de Lúcio, responda às questões a seguir.
    comando: A primeira tese recursal pode garantir tratamento penal mais vantajoso a Adamastor? Justifique, levando em consideração o Direito Penal aplicável.
    gabarito: Não, pois a dinâmica delitiva deixa claro que ambos agiram com dolo, conhecimento e vontade de empregar a arma de fogo na atividade criminosa. Nesse sentido, era exigido do examinando o conhecimento do Art. 30 do Código Penal, que trata sobre a incomunicabilidade das circunstâncias pessoais, salvo quando elementares do crime. Assim, pouco importa se quem portava a arma era Lúcio, havendo concurso de pessoas, e sendo o emprego de arma uma circunstância objetiva, há comunicabilidade a todos os co-autores. Por isso, a alegação de que apenas Lúcio portava a arma não poderia, no caso, prejudicá-lo ou conceder a Adamastor tratamento penal mais vantajoso.
    opcoes:
      correta: Não, pois o emprego de arma é uma circunstância objetiva elementar do delito, razão pela qual há comunicabilidade, nos termos do Art. 30, do CP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não pode ser considerado fato posterior como falta grave a afastar o preenchimento do requisito subjetivo OU o decreto mencionava que o apenado não poderia ter praticado falta grave nos 12 meses anteriores ao decreto, em respeito ao princípio da legalidade OU porque a decisão que reconhece o indulto é meramente declaratória
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
  - id: 37-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
      Lúcio e Adamastor, em comunhão de ações e desígnios, com o emprego de arma de fogo, subtraíram o veículo dirigido pela vítima, Vilma. Pela dinâmica delituosa, Lúcio empunhava a arma de fogo contra a cabeça da vítima, enquanto Adamastor exigia a entrega das chaves do veículo, sob palavras de ordem e graves ameaças contra a vida de Vilma, afirmando que “caso não entregasse o veículo, levaria um tiro.”

      Ambos foram condenados, sendo que Lúcio e o Ministério Público não recorreram da condenação.

      Adamastor, por meio de sua defesa técnica (distinta da defesa de Lúcio), interpôs recurso, alegando que a arma de fogo era portada apenas por Lúcio e que esta era incapaz de produzir disparos.

      Lúcio afirma ao advogado que se sentiu traído pelo argumento deduzido por Adamastor, sendo sua intenção, apenas, que ambos tivessem a mesma condenação.

      Na qualidade de advogado de Lúcio, responda às questões a seguir.
    comando: Caso o Tribunal acolha a segunda tese recursal de Adamastor, esta poderia ser aproveitada a Lúcio? Justifique, considerando as normas de Direito Processual Penal aplicáveis.
