      Jenifer entregou a gravação à ofendida. De posse da referida gravação ambiental, Jéssica ajuízou uma queixa-crime contra Débora e Cristiane, dando-as como incursas nas penas do Art. 140, caput, do Código Penal.

      Na qualidade de advogado(a) contratado(a) por Débora e Cristiane, responda às questões a seguir.
    comando: Qual a tese de direito material a ser deduzida em favor das quereladas? Justifique.
    gabarito: Quanto à questão material, deve ser observado que o delito de injúria se caracteriza por ser um delito doloso, requer o dolo direto de causar ofensa à honra subjetiva da vítima. Dessa forma, somente é possível a prática do delito se houver intenção deliberada de atingir o destinatário da ofensa, o que não ocorreu no caso presente, pois Débora e Cristiane conversavam entre si, sem qualquer expectativa de fazer chegar à Jéssica as ofensas proferidas. Por isso, deve ser reconhecida a atipicidade da conduta.
    opcoes:
      correta: Atipicidade da conduta, diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas.
