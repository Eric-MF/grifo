  - id: 25-q4-b
    categoria: discursiva
    parte: q4
    item: B
    caso: |-
      Vitor, 23 anos, decide emprestar sua motocicleta, que é seu instrumento de trabalho, para seu pai, Francisco, 45 anos, por um mês, já que este se encontrava em dificuldade financeira. Após o prazo do empréstimo, Vitor, que não residia com Francisco, solicitou a devolução da motocicleta, mas este se recusou a devolver e passou a atuar como se proprietário do bem fosse, inclusive anunciando sua venda.

      Diante do registro dos fatos em sede policial, o Ministério Público ofereceu denúncia em face de Francisco, imputando-lhe a prática do crime previsto no Art. 168, § 1º, inciso II, do Código Penal.

      Após a confirmação dos fatos em juízo e a juntada da Folha de Antecedentes Criminais sem qualquer outra anotação, o magistrado julgou parcialmente procedente a pretensão punitiva, afastando a causa de aumento, mas condenando Francisco, pela prática do crime de apropriação indébita simples, à pena mínima prevista para o delito em questão (01 ano), substituindo a pena privativa de liberdade por restritiva de direito.

      Considerando apenas as informações narradas no enunciado, na condição de advogado(a) de Francisco, responda aos itens a seguir.
    comando: Qual argumento de direito material, em sede de apelação, poderia ser apresentado em busca de evitar a punição de Francisco? Justifique.
    gabarito: |-
      O argumento de direito material a ser apresentado em busca de evitar a punição de Francisco é da aplicação da previsões do Art. 181, inciso II, do Código Penal, que traz o instituto conhecido como escusa absolutória. Em que pese a conduta praticada por Francisco abstratamente se adeque as previsões do Art. 168, caput, do Código Penal, de acordo com o dispositivo antes mencionado, é isento de pena quem comete crime previsto no título contra descendente, sendo certo que nenhuma das exceções trazidas pelo Art. 183 do Código Penal ocorreu.

      Assim, em sendo o autor do fato pai da vítima e não havendo violência ou grave ameaça à pessoa, é ele isento de pena, não podendo ser criminalmente punido.
    opcoes:
      correta: Aplicação da escusa absolutória OU presente causa de isenção de pena, tendo em vista que o réu era pai da vítima, nos termos do Art. 181, inciso II, do Código Penal.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Habeas corpus e agravo em execução penal (0,15 cada).
        - "Agravo, artigo 197 da LEP. Obs.: A mera indicação do artigo não pontua."
        - Não foi correta a capitulação delitiva do Ministério Público, pois em sendo o crime culposo, a idade da vítima não é relevante para imputação da causa de aumento do Art. 121, § 4º, do CP, OU pois a causa de aumento em razão de a vítima ser menor de 14 anos somente será aplicada ao crime de homicídio doloso.
        - Sim, deveria a defesa técnica alegar a existência de excludente de ilicitude, em razão do estado de necessidade, nos termos do Art. 24 ou do Art. 23, inciso I, do CP.
    revisao: *a1
