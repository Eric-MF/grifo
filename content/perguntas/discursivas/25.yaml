    gabarito: Preliminarmente, deve ser requerido o reconhecimento da nulidade do ato de citação, nos termos do art. 564, inciso III, “e”, do CPP
    opcoes:
      correta: Preliminarmente, deve ser requerido o reconhecimento da nulidade do ato de citação, nos termos do art. 564, inciso III, “e”, do CPP
      erradas:
        - "Incompetência da Justiça Estadual: crime de competência federal, art. 109, V (ou IV), da CF."
        - Inépcia da denúncia pois deixou de descrever todas as circunstâncias elementares do crime de lavagem de dinheiro, notadamente, a infração penal antecedente, nos termos do Art. 41 do CPP ou Art. 2º, § 1º, da Lei nº 9.613/98.
        - Extinção da punibilidade pela decadência do direito de representação.
        - Preliminarmente, nulidade da decisão de pronúncia:.
        - Preliminar de nulidade do processo OU reconhecimento da extinção da punibilidade OU decadência OU oferecimento de proposta de suspensão condicional do processo
