  - id: 25-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Rodrigo, pela primeira vez envolvido com o aparato judicial, foi condenado definitivamente, pela prática do crime de rixa, ao pagamento de pena exclusivamente de multa. Para pensar sobre as consequências de seu ato, vai para local que acredita ser deserto, onde há uma linda lagoa. Ao chegar ao local, após longa caminhada, depara-se com uma criança, sozinha, banhando-se, mas verifica que ela tem dificuldades para deixar a água e, então, começa a se afogar.

      Apesar de ter conhecimento sobre a situação da criança, Rodrigo nada faz, pois não sabia nadar, logo acreditando que não era possível prestar assistência sem risco pessoal. Ao mesmo tempo, o local era isolado e não havia autoridades públicas nas proximidades, além de Rodrigo estar sem celular ou outro meio de comunicação para avisar sobre a situação. Cerca de 10 minutos depois, chega ao local Marcus, que, ao ver o corpo da criança na lagoa, entra na água e retira a criança já falecida. Nesse momento, Rodrigo verifica que a lagoa não era profunda e que a água bateria na altura de sua cintura, não havendo risco pessoal para a prestação da assistência.

      Após a perícia constatar a profundidade da lagoa, Rodrigo é denunciado pela prática do crime previsto no Art. 135, parágrafo único, do Código Penal. Não houve composição dos danos civis, e o Ministério Público não ofereceu proposta de transação penal, sob o argumento de que havia vedação legal diante da condenação de Rodrigo pela prática do crime de rixa.

      Considerando apenas as informações narradas, responda, na condição de advogado(a) de Rodrigo, aos itens a seguir.
    comando: Existe argumento a ser apresentado pela defesa para combater o fundamento utilizado pelo Ministério Público para não oferecer proposta de transação penal? Justifique.
    gabarito: Sim, existe argumento. Inicialmente deve ser destacado que o delito imputado a Rodrigo, ainda que considerando a aplicação da pena de maneira triplificada em razão do resultado morte, é de menor potencial ofensivo. Prevê o Art. 76 da Lei 9.099/95 que o Ministério Público poderá oferecer proposta de aplicação imediata de pena restritiva de direitos ou multa, caso não haja composição dos danos e não seja hipótese de arquivamento. Todavia, o próprio Art. 76, em seu parágrafo 2º, traz hipóteses em que a proposta de transação penal não poderá ser realizada. O inciso I do dispositivo mencionado afirma que não caberá a proposta quando o autor da infração já tiver sido condenado, pela prática de crime, por sentença definitiva, à pena privativa de liberdade. Na hipótese apresentada, Rodrigo possuía condenação anterior com trânsito em julgado, mas apenas ao cumprimento de pena de multa e não pena privativa de liberdade. Assim, não há vedação legal, podendo o Ministério Público oferecer proposta de transação penal.
    opcoes:
      correta: Sim. O argumento é que não há vedação legal para oferecimento de transação porque a condenação anterior de Rodrigo foi apenas ao cumprimento de pena de multa e não de pena privativa de liberdade, nos termos do Art. 76, §2º, inciso I, da Lei 9.099/95
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Habeas corpus e agravo em execução penal (0,15 cada).
        - "Mário não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90 por se tratar de novatio legis in pejus OU com base na irretroatividade da lei penal mais gravosa o artigo 2º, § 2º, da Lei 8.072/90 não se aplica a situação de Mário OU a antiga redação do artigo 2º, da Lei 8.072/90 é inconstitucional, razão pela qual a progressão deve ocorrer com base no Art. 112 da LEP, observando o quantum de 1/6 de cumprimento de pena. / Tal entendimento é fundamentado nos verbetes 26 da súmula vinculante do STF ou 471 do STJ. Obs.: A justificativa é essencial para atribuição de pontos."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Houve aberratio criminis OU houve resultado diverso do pretendido, devendo o agente responder apenas pelo crime de lesão corporal culposa, nos termos do Art. 74 do CP.
