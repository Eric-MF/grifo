  - id: 25-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Vitor, 23 anos, decide emprestar sua motocicleta, que é seu instrumento de trabalho, para seu pai, Francisco, 45 anos, por um mês, já que este se encontrava em dificuldade financeira. Após o prazo do empréstimo, Vitor, que não residia com Francisco, solicitou a devolução da motocicleta, mas este se recusou a devolver e passou a atuar como se proprietário do bem fosse, inclusive anunciando sua venda.

      Diante do registro dos fatos em sede policial, o Ministério Público ofereceu denúncia em face de Francisco, imputando-lhe a prática do crime previsto no Art. 168, § 1º, inciso II, do Código Penal.

      Após a confirmação dos fatos em juízo e a juntada da Folha de Antecedentes Criminais sem qualquer outra anotação, o magistrado julgou parcialmente procedente a pretensão punitiva, afastando a causa de aumento, mas condenando Francisco, pela prática do crime de apropriação indébita simples, à pena mínima prevista para o delito em questão (01 ano), substituindo a pena privativa de liberdade por restritiva de direito.

      Considerando apenas as informações narradas no enunciado, na condição de advogado(a) de Francisco, responda aos itens a seguir.
    comando: Para combater a decisão do magistrado, que, após afastar a causa de aumento, imediatamente decidiu por condenar o réu pela prática do crime de apropriação indébita simples, qual argumento de direito processual poderia ser apresentado? Justifique.
    gabarito: |-
      O argumento de direito processual a ser apresentado seria no sentido de que não poderia o magistrado, de imediato, condenar o réu pela prática do crime de apropriação indébita simples, tendo em vista que com o afastamento da causa de aumento, a pena mínima prevista para o delito do Art. 168, caput, do Código Penal admite o oferecimento de proposta de suspensão condicional do processo, de modo que deveria o magistrado ter encaminhado os autos ao Ministério Público para manifestação sobre o previsto no Art. 89 da Lei nº 9.099/95.

      Ressalta-se que todos os demais requesitos previstos no dispositivo estão preenchidos, já que Francisco era primário, de bons antecedentes e as circunstâncias do crime eram favoráveis. Ademais, o Superior Tribunal de Justiça, na Súmula 337, prevê expressamente que é cabível a suspensão condicional do processo na desclassificação do crime ou na procedência parcial do pedido.
    opcoes:
      correta: O argumento é que, diante da parcial procedência do pedido, deveria ter sido analisada a possibilidade de oferecimento de proposta de suspensão condicional do processo, nos termos da Súmula 337 do STJ OU art. 89 da Lei 9.099/95.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Habeas corpus e agravo em execução penal (0,15 cada).
        - "Mário não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90 por se tratar de novatio legis in pejus OU com base na irretroatividade da lei penal mais gravosa o artigo 2º, § 2º, da Lei 8.072/90 não se aplica a situação de Mário OU a antiga redação do artigo 2º, da Lei 8.072/90 é inconstitucional, razão pela qual a progressão deve ocorrer com base no Art. 112 da LEP, observando o quantum de 1/6 de cumprimento de pena. / Tal entendimento é fundamentado nos verbetes 26 da súmula vinculante do STF ou 471 do STJ. Obs.: A justificativa é essencial para atribuição de pontos."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Houve aberratio criminis OU houve resultado diverso do pretendido, devendo o agente responder apenas pelo crime de lesão corporal culposa, nos termos do Art. 74 do CP.
