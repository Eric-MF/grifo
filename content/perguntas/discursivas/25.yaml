    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Patrick não estava se ocultando para ser citado e o oficial de justiça somente compareceu em uma oportunidade, não preenchendo os requisitos do Art. 362 do CPP.
    opcoes:
      correta: Patrick não estava se ocultando para ser citado e o oficial de justiça somente compareceu em uma oportunidade, não preenchendo os requisitos do Art. 362 do CPP.
      erradas:
        - Atipicidade do art. 239, parágrafo único, do ECA, por ausência de dolo.
        - Da consequente fixação do regime aberto, nos termos do artigo 33, § 2º, c, do CP.
        - "No mérito: absolvição do crime de furto, pois a coisa perdida (res desperdicta) não pode ser objeto de tal crime. Deve, ainda, ser mencionado que a hipótese não é de desclassificação para o crime de apropriação de coisa achada, pois a elementar de apropriação pelo prazo de 15 dias não foi realizada."
        - Afastamento da agravante do Art. 61, inciso II, alínea ´f´, do CP, pois o crime não foi praticado em situação de violência doméstica, familiar ou de coabitação contra mulher.
        - A imputabilidade penal restou afastada em razão da embriaguez, que foi completa, decorrente de caso fortuito ou força maior, e que tornou o réu inteiramente incapaz de entender o caráter ilícito do fato, conforme o Art. 28, §1º, do CP
