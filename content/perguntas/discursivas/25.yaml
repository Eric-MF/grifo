  - id: 25-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Lucas, jovem de 22 anos, primário, foi denunciado pela prática do crime de extorsão simples, tendo o magistrado, em 05/05/2016, recebido a denúncia e decretado a prisão preventiva do acusado. Cumprido o mandado de prisão no dia seguinte, Lucas permaneceu acautelado durante toda a instrução de seu processo, vindo a ser condenado, em 24 de janeiro de 2017, à pena de 04 anos e 03 meses de reclusão, além de 12 dias-multa, sendo certo que o aumento da pena-base foi fundamentado de maneira correta pelo magistrado em razão das circunstâncias do crime. Foi, ainda, aplicado o regime semiaberto para início do cumprimento da sanção, exclusivamente diante do quantum de pena aplicada, e o valor do dia-multa foi fixado em 3 vezes o salário mínimo, em razão das circunstâncias do fato.

      Apesar de não se opor à condenação, nem à pena aplicada, Lucas, ainda preso, pergunta a seu advogado sobre a possibilidade de recurso para aplicação de regime de cumprimento de pena menos gravoso, ainda que mantido o quantum de pena. Também informa ao patrono que não tem condições de arcar com a multa aplicada, pois mora em comunidade carente e recebia, antes dos fatos, remuneração de meio salário mínimo pela prestação de serviços informais.

      Considerando apenas as informações narradas, na condição de advogado de Lucas, responda aos itens a seguir.
    comando: Qual o argumento a ser formulado em sede de recurso para alteração do regime prisional de início de cumprimento de pena aplicado, mantida a pena final em 04 anos e 03 meses de reclusão? Justifique.
    gabarito: O argumento a ser apresentado pela defesa de Lucas é que o período de pena provisória cumprido deverá ser computado para aplicação do regime inicial do cumprimento de pena, nos termos do Art. 387, § 2º do Código de Processo Penal, de modo que o regime a ser fixado é o aberto. De início, destaca-se que a questão não apresentava elementos suficientes para justificar um pedido de redução de pena, de modo que a pena final aplicada fosse de até 04 anos e permitisse a aplicação do regime aberto. Ademais, o próprio enunciado da questão requer que o patrono de Lucas apresente argumento para alteração do regime ainda que mantida a pena de 04 anos e 03 meses de reclusão. Em princípio, estabelece o Art. 33, § 2º, alínea b, do Código Penal, que cabível o regime semiaberto ao condenado não reincidente, quando a pena aplicada for superior a 04 anos ou não exceda a oito, como é a situação de Lucas. Ao mesmo tempo, estabelece o Art. 42 do Código Penal que será computado, na pena privativa de liberdade, o tempo de prisão provisória, disciplinando, assim, o instituto conhecido como detração. Outrossim, o Art. 387, § 2º, do Código de Processo Penal, acrescentado pela Lei nº 12.736/12, prevê expressamente que o tempo de prisão provisória será computado para fins de determinação do regime inicial de pena privativa de liberdade. No caso, Lucas ficou preso por período superior a 08 meses, período esse que deve ser computado como pena cumprida, na forma da detração, para determinação do regime inicial. Assim, considerando os oitos meses apenas para fins de aplicação do regime inicial, seria possível a aplicação do regime aberto.
    opcoes:
      correta: O argumento a ser apresentado é o de que o tempo de prisão provisória deve ser computado no momento da determinação do regime inicial de cumprimento de pena, nos termos do Art. 387, § 2º do Código de Processo Penal.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Habeas corpus e agravo em execução penal (0,15 cada).
        - "Mário não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90 por se tratar de novatio legis in pejus OU com base na irretroatividade da lei penal mais gravosa o artigo 2º, § 2º, da Lei 8.072/90 não se aplica a situação de Mário OU a antiga redação do artigo 2º, da Lei 8.072/90 é inconstitucional, razão pela qual a progressão deve ocorrer com base no Art. 112 da LEP, observando o quantum de 1/6 de cumprimento de pena. / Tal entendimento é fundamentado nos verbetes 26 da súmula vinculante do STF ou 471 do STJ. Obs.: A justificativa é essencial para atribuição de pontos."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Houve aberratio criminis OU houve resultado diverso do pretendido, devendo o agente responder apenas pelo crime de lesão corporal culposa, nos termos do Art. 74 do CP.
    revisao: *a1
