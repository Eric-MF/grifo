      Em busca do cumprimento do mandado de citação, o oficial de justiça comparece à residência de Patrick e verifica que o imóvel se encontrava trancado. Apenas em razão desse único comparecimento no dia 26/02/2018, certifica que o réu estava se ocultando para não ser citado e realiza, no dia seguinte, citação por hora certa, juntando o resultado do mandado de citação e intimação para defesa aos autos no mesmo dia. Maria, vizinha que presenciou a conduta do oficial de justiça, se assusta e liga para o advogado de Patrick, informando o ocorrido e esclarecendo que ele se encontra trabalhando e ficará embarcado por 15 dias. O advogado entra em contato com Patrick por e-mail e este apenas consegue encaminhar uma procuração para adoção das medidas cabíveis, fazendo uma pequena síntese do ocorrido por escrito.

      Considerando a situação narrada, apresente, na qualidade do advogado de Patrick, a peça jurídica cabível, diferente do habeas corpus, apresentando todas as teses jurídicas de direito material e processual pertinentes. A peça deverá ser datada do último dia do prazo. (Valor: 5,00)

      Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples menção ou transcrição do dispositivo legal não confere pontuação.
    comando: Que pedido deve ser formulado na peça?
    gabarito: Absolvição sumária, com fundamento no Art. 397, inciso I, do CPP e no Art. 397, inciso III, do CPP.
    opcoes:
      correta: Absolvição sumária, com fundamento no Art. 397, inciso I, do CPP e no Art. 397, inciso III, do CPP.
      erradas:
        - Requerimento de declaração das nulidades, absolvição sumária e, alternativamente, produção de provas.
        - Pedido de habilitação, na interposição, do pai da vítima como assistente de acusação.
        - a) designação de audiência preliminar ou de conciliação b) a citação da querelada; c) recebimento da queixa d) a oitiva das testemunhas arroladas; e) a condenação da querelada pelo crime de injúria (Art. 140 do CP) e pelo crime de difamação (Art. 139 do CP) com a causa de aumento de pena (Art. 141, III do CP) em concurso formal de delitos (Art. 70 do CP) f) a fixação de valor mínimo de indenização, nos termos do Art. 387, IV, do CPP. OBS:. A mera indicação de dispositivo legal não pontua.
        - Aplicação de regime inicial aberto ou semiaberto.
        - Conhecimento e provimento do recurso
