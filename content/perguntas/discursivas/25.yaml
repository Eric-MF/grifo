  - id: 25-q3-a
    categoria: discursiva
    parte: q3
    item: A1
    caso: |-
      Na cidade de Goiânia funciona a boate Noite Cheia, onde ocorrem shows de música ao vivo toda sexta-feira. Em razão da grande quantidade de frequentadores, os proprietários João e Maria estabeleceram que somente poderia ingressar na boate aquele que colocasse o nome na lista de convidados, até 24 horas antes do evento.

      Em determinada sexta-feira, Eduardo, morador de São Paulo, comparece ao local com a intenção de assistir ao show, mas foi informado sobre a impossibilidade de ingresso, já que seu nome não constava na lista.

      Pretendendo ingressar ainda assim, Eduardo ofereceu vantagem indevida, qual seja, R$ 500,00, a Natan, integrante da segurança privada do evento, em troca de este permitir seu ingresso no local sem que os proprietários soubessem. Ocorre que a conduta foi filmada pelas câmeras de segurança e, de imediato, Natan recusou a vantagem, sendo Eduardo encaminhado à Delegacia mais próxima.

      O Ministério Público ofereceu denúncia em face de Eduardo pela prática do crime de corrupção ativa consumada, previsto no Art. 333 do Código Penal. Durante a instrução, foi expedida carta precatória para determinada cidade de Minas Gerais, para oitiva de Natan, única testemunha, tendo em vista a mudança de endereço residencial do antigo segurança do estabelecimento, não sendo a defesa de Eduardo intimada do ato, uma vez que consta expressamente do Código de Processo Penal que a expedição de carta precatória não suspende o feito. Após o interrogatório, a defesa de Eduardo é intimada a apresentar alegações finais.

      Considerando as informações narradas, na condição de advogado(a) de Eduardo, responda aos itens a seguir.
    comando: Para questionar a prova testemunhal produzida durante a instrução, qual o argumento de direito processual a ser apresentado pela defesa? Justifique.
    gabarito: O advogado de Eduardo deve alegar que ocorreu cerceamento de defesa, havendo violação aos princípios do contraditório e da ampla defesa, tendo em vista que não houve intimação em relação à expedição da carta precatória, conforme determina o CPP, que prevê expressamente, em seu Art. 222, que as partes deverão ser intimadas. De fato, conforme consta do enunciado, a expedição de carta precatória, de acordo com o Art. 222, § 1º, do CPP, não gera suspensão do processo. Todavia, essa informação não se confunde com a necessidade de intimação da defesa em relação à expedição. A jurisprudência admite que não ocorra intimação da defesa em relação à data da audiência a ser realizada no juízo deprecado somente no caso de ter ocorrido a devida intimação em relação à expedição da carta precatória, nos termos da Súmula 273 do Superior Tribunal de Justiça, o que não ocorreu na hipótese.
    opcoes:
      correta: Ocorrência de cerceamento de defesa ou violação ao princípio do contraditório ou violação ao princípio da ampla defesa, nos termos do art. 5º, inciso LV da CRFB/88. A defesa deveria ter sido intimada da expedição da carta precatória, nos termos do Art. 222 do CPP OU Súmula 273 do STJ.
      erradas:
        - "Prova ilícita: a gravação informal da confissão viola o direito ao silêncio; as demais provas são ilícitas por derivação (art. 157, § 1º, CPP)."
        - Habeas corpus e agravo em execução penal (0,15 cada).
        - "Mário não se sujeita ao artigo 2º, § 2º, da Lei 8.072/90 por se tratar de novatio legis in pejus OU com base na irretroatividade da lei penal mais gravosa o artigo 2º, § 2º, da Lei 8.072/90 não se aplica a situação de Mário OU a antiga redação do artigo 2º, da Lei 8.072/90 é inconstitucional, razão pela qual a progressão deve ocorrer com base no Art. 112 da LEP, observando o quantum de 1/6 de cumprimento de pena. / Tal entendimento é fundamentado nos verbetes 26 da súmula vinculante do STF ou 471 do STJ. Obs.: A justificativa é essencial para atribuição de pontos."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Houve aberratio criminis OU houve resultado diverso do pretendido, devendo o agente responder apenas pelo crime de lesão corporal culposa, nos termos do Art. 74 do CP.
    revisao: *a1
  - id: 25-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      Na cidade de Goiânia funciona a boate Noite Cheia, onde ocorrem shows de música ao vivo toda sexta-feira. Em razão da grande quantidade de frequentadores, os proprietários João e Maria estabeleceram que somente poderia ingressar na boate aquele que colocasse o nome na lista de convidados, até 24 horas antes do evento.

