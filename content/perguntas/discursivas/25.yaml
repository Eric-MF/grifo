      O Ministério Público ofereceu denúncia em face de Eduardo pela prática do crime de corrupção ativa consumada, previsto no Art. 333 do Código Penal. Durante a instrução, foi expedida carta precatória para determinada cidade de Minas Gerais, para oitiva de Natan, única testemunha, tendo em vista a mudança de endereço residencial do antigo segurança do estabelecimento, não sendo a defesa de Eduardo intimada do ato, uma vez que consta expressamente do Código de Processo Penal que a expedição de carta precatória não suspende o feito. Após o interrogatório, a defesa de Eduardo é intimada a apresentar alegações finais.

      Considerando as informações narradas, na condição de advogado(a) de Eduardo, responda aos itens a seguir.
    comando: Em busca da absolvição de Eduardo pelo delito imputado, qual o argumento de direito material a ser apresentado? Justifique.
    gabarito: O argumento a ser apresentado é o de que, apesar de Eduardo ter oferecido vantagem indevida para o segurança do estabelecimento para que ele não praticasse ato de seu ofício, não há que se falar em crime de corrupção ativa. O crime de corrupção ativa, previsto no Art. 333 do Código Penal, é crime praticado por particular contra a Administração Pública em Geral. Ocorre que, no caso, a vantagem foi oferecida para particular e não funcionário público, logo o fato é atípico.
    opcoes:
      correta: O argumento é que a vantagem foi oferecida para particular e não para funcionário público, logo não configurado crime contra a Administração Pública.
