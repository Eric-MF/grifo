# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "25"
introducoes:
  peca: "Patrick viu Lauro agredir violentamente a sobrinha dele, Natália. Gritou, mas Lauro não parou, e Patrick, com a perna enfaixada, não tinha outro modo de intervir: pegou a arma registrada que tinha em casa, mirou a perna de Lauro e apertou o gatilho. A arma não disparou, e a perícia concluiu que ela era totalmente incapaz de disparar. Patrick foi denunciado por tentativa de lesão corporal grave. O oficial de justiça foi à casa dele num só dia, encontrou-a trancada, certificou que ele se ocultava e fez a citação por hora certa; Patrick estava embarcado, a trabalho. Você é o advogado dele, e corre o prazo da defesa."
  q1: "Lucas, primário, ficou preso preventivamente desde maio de 2016 até a sentença, em janeiro de 2017, que o condenou por extorsão a 4 anos e 3 meses no semiaberto, só por causa da quantidade da pena, e fixou o dia-multa em 3 salários mínimos. Lucas mora numa comunidade carente e ganhava meio salário mínimo com serviços informais."
  q2: "Rodrigo tinha uma condenação definitiva por rixa, só ao pagamento de multa. Numa lagoa deserta, viu uma criança se afogando e nada fez: não sabia nadar e achou que não poderia ajudar sem risco pessoal. Não havia autoridade por perto nem telefone, e a criança morreu. Depois, a perícia mostrou que a água batia na cintura dele. Rodrigo foi denunciado por omissão de socorro com resultado morte, e o Ministério Público não ofereceu transação penal, dizendo haver vedação legal por causa da condenação pela rixa."
  q3: "Eduardo ofereceu R$ 500 a Natan, segurança contratado por uma boate, para entrar sem estar na lista de convidados. Natan recusou, e Eduardo foi denunciado por corrupção ativa. Natan, a única testemunha, foi ouvido por carta precatória em outro estado, e a defesa não foi intimada da expedição da carta."
  q4: "Vitor, de 23 anos, emprestou a moto ao pai, Francisco, que não morava com ele, e Francisco se recusou a devolvê-la e a anunciou para venda. Denunciado por apropriação indébita com aumento de pena, Francisco, sem antecedentes, teve a causa de aumento afastada pelo juiz, que logo o condenou por apropriação indébita simples a 1 ano, com a pena substituída por restritiva de direitos."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["25-peca-1", "25-peca-5", "25-peca-7", "25-peca-8", "25-peca-10", "25-peca-11", "25-peca-13"]
perguntas:
  - id: 25-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: preliminar
    pergunta: "Que preliminar a defesa deve levantar quanto à citação de Patrick?"
    tese: "Nulidade da citação por hora certa"
    aceitos: [ "nulidade | nula | nulo | anula*" ]
    artigos: [ "art. 564, III, e, CPP" ]
    gabarito: "Preliminarmente, deve ser requerido o reconhecimento da nulidade do ato de citação, nos termos do art. 564, inciso III, “e”, do CPP"
    revisao: { status: revisado }
  - id: 25-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: merito
    pergunta: "Por que a citação por hora certa não era cabível?"
    tese: "Descabimento da citação por hora certa: Patrick não se ocultava, e o oficial foi só uma vez à casa"
    aceitos: [ "nao se ocult* | nao estava se ocultando | nao houve ocultacao | sem ocultacao | ausencia de ocultacao | uma vez | uma unica vez | uma oportunidade | unico comparecimento" ]
    artigos: [ "art. 362, CPP" ]
    gabarito: "Patrick não estava se ocultando para ser citado e o oficial de justiça somente compareceu em uma oportunidade, não preenchendo os requisitos do Art. 362 do CPP."
    revisao: { status: revisado }
  - id: 25-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "A arma de Patrick não podia disparar. Que tese afasta a punição da tentativa?"
    tese: "Crime impossível, pela absoluta ineficácia do meio"
    aceitos: [ "crime impossivel" ]
    artigos: [ "art. 17, CP" ]
    gabarito: "Não há que se falar em punição da tentativa, tendo em vista que houve crime impossível, previsto no Art. 17 do CP."
    revisao: { status: revisado }
  - id: 25-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Que excludente de ilicitude justifica a conduta de Patrick?"
    tese: "Legítima defesa de terceiro, a sobrinha"
    aceitos: [ "legitima defesa" ]
    artigos: [ "art. 25, CP", "art. 23, II, CP" ]
    gabarito: "Patrick agiu amparado pela legítima defesa, prevista no Art. 25 do CP OU no Art. 23, II, do CP."
    revisao: { status: revisado }
  - id: 25-peca-12
    categoria: peca-detalhe
    parte: peca
    item: "12"
    secao: pedido
    pergunta: "Que pedido principal a defesa deve fazer?"
    tese: "Absolvição sumária, pela atipicidade (crime impossível) e pela excludente de ilicitude"
    aceitos: [ "absolvicao sumaria | absolvido sumariamente | absolver sumariamente | absolvicao* sumaria*" ]
    artigos: [ "art. 397, I, CPP", "art. 397, III, CPP" ]
    gabarito: "Absolvição sumária, com fundamento no Art. 397, inciso I, do CPP e no Art. 397, inciso III, do CPP."
    revisao: { status: revisado }
  - id: 25-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que argumento permite pedir regime inicial menos grave, mantida a pena de 4 anos e 3 meses?"
    tese: "A detração: o tempo de prisão provisória deve ser descontado na fixação do regime inicial"
    aceitos: [ "detracao | tempo de prisao provisoria | tempo de prisao preventiva | tempo de prisao cautelar | tempo em que ficou preso" ]
    artigos: [ "art. 387, § 2º, CPP" ]
    gabarito: "O argumento a ser apresentado pela defesa de Lucas é que o período de pena provisória cumprido deverá ser computado para aplicação do regime inicial do cumprimento de pena, nos termos do Art. 387, § 2º do Código de Processo Penal, de modo que o regime a ser fixado é o aberto. De início, destaca-se que a questão não apresentava elementos suficientes para justificar um pedido de redução de pena, de modo que a pena final aplicada fosse de até 04 anos e permitisse a aplicação do regime aberto. Ademais, o próprio enunciado da questão requer que o patrono de Lucas apresente argumento para alteração do regime ainda que mantida a pena de 04 anos e 03 meses de reclusão. Em princípio, estabelece o Art. 33, § 2º, alínea b, do Código Penal, que cabível o regime semiaberto ao condenado não reincidente, quando a pena aplicada for superior a 04 anos ou não exceda a oito, como é a situação de Lucas. Ao mesmo tempo, estabelece o Art. 42 do Código Penal que será computado, na pena privativa de liberdade, o tempo de prisão provisória, disciplinando, assim, o instituto conhecido como detração. Outrossim, o Art. 387, § 2º, do Código de Processo Penal, acrescentado pela Lei nº 12.736/12, prevê expressamente que o tempo de prisão provisória será computado para fins de determinação do regime inicial de pena privativa de liberdade. No caso, Lucas ficou preso por período superior a 08 meses, período esse que deve ser computado como pena cumprida, na forma da detração, para determinação do regime inicial. Assim, considerando os oitos meses apenas para fins de aplicação do regime inicial, seria possível a aplicação do regime aberto."
    revisao: { status: revisado }
  - id: 25-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que argumento leva à redução do valor do dia-multa?"
    tese: "O dia-multa deve ser fixado conforme a situação econômica do réu, e Lucas é pobre"
    aceitos: [ "situacao economica | capacidade economica | condicao economica | condicoes economicas | capacidade financeira | situacao financeira | condicao financeira" ]
    artigos: [ "art. 60, CP" ]
    gabarito: "Na sentença condenatória, entendeu o magistrado que os dias-multa deveriam ser fixados no valor de 3 vezes o salário mínimo em razão das circunstâncias do fato. Ocorre que é pacificado o entendimento jurisprudencial, em especial diante da previsão do Art. 60 do Código Penal, que o critério para fixação do VALOR do dia-multa será o da capacidade econômica do réu. Na situação apresentada, Lucas era pessoa humilde, que recebia, antes da prisão, remuneração de meio salário mínimo em razão da prestação de serviços informais, logo não se justifica o fundamento apresentado pelo magistrado para fixação do valor do dia-multa."
    revisao: { status: revisado }
  - id: 25-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "A condenação pela rixa impede a transação penal?"
    tese: "A condenação só a multa não impede a transação penal: só a pena privativa de liberdade a impede"
    aceitos: [ "privativa de liberdade | apenas multa | so multa | somente multa | exclusivamente multa | apenas a multa | so a multa | somente a multa | apenas de multa | so de multa | somente de multa" ]
    artigos: [ "art. 76, § 2º, I, Lei 9.099" ]
    gabarito: "Sim, existe argumento. Inicialmente deve ser destacado que o delito imputado a Rodrigo, ainda que considerando a aplicação da pena de maneira triplificada em razão do resultado morte, é de menor potencial ofensivo. Prevê o Art. 76 da Lei 9.099/95 que o Ministério Público poderá oferecer proposta de aplicação imediata de pena restritiva de direitos ou multa, caso não haja composição dos danos e não seja hipótese de arquivamento. Todavia, o próprio Art. 76, em seu parágrafo 2º, traz hipóteses em que a proposta de transação penal não poderá ser realizada. O inciso I do dispositivo mencionado afirma que não caberá a proposta quando o autor da infração já tiver sido condenado, pela prática de crime, por sentença definitiva, à pena privativa de liberdade. Na hipótese apresentada, Rodrigo possuía condenação anterior com trânsito em julgado, mas apenas ao cumprimento de pena de multa e não pena privativa de liberdade. Assim, não há vedação legal, podendo o Ministério Público oferecer proposta de transação penal."
    revisao: { status: revisado }
  - id: 25-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que tese de direito material leva à absolvição de Rodrigo?"
    tese: "Erro de tipo sobre a elementar “sem risco pessoal”: exclui o dolo, e a omissão de socorro não tem forma culposa"
    aceitos: [ "erro de tipo | erro sobre a elementar | erro sobre elementar | erro sobre o elemento | erro sobre elemento" ]
    artigos: [ "art. 20, CP" ]
    gabarito: "Rodrigo deve ser absolvido pois sua omissão ocorreu em erro de tipo. Para configuração do delito de omissão de socorro, previsto no Art. 135 do Código Penal, é preciso que a omissão tenha ocorrido quando era possível ao agente prestar assistência sem risco pessoal. Rodrigo somente não agiu porque acreditava que existia risco para si, já que não sabia nadar e a criança estava se afogando na lagoa. Em que pese a lagoa fosse rasa e não apresentasse risco para Rodrigo, ele não tinha conhecimento de tal situação, logo agiu em erro sobre a elementar “sem risco pessoal”. Havendo erro sobre elementar do tipo, a consequência é o afastamento do dolo, somente podendo o agente ser responsabilizado se o erro for evitável e prevista a modalidade culposa do delito, nos termos do Art. 20 do Código Penal. No caso, o crime do Art. 135 do Código Penal não traz a modalidade culposa, logo o fato é atípico."
    revisao: { status: revisado }
  - id: 25-q3-a
    categoria: discursiva
    parte: q3
    item: "A1"
    pergunta: "Que argumento processual a defesa pode usar contra o depoimento de Natan?"
    tese: "Cerceamento de defesa: sem a intimação da expedição da precatória, foram violados o contraditório e a ampla defesa"
    aceitos: [ "cerceamento | contraditorio | ampla defesa" ]
    artigos: [ "art. 5, LV, CRFB", "art. 222, CPP" ]
    gabarito: "O advogado de Eduardo deve alegar que ocorreu cerceamento de defesa, havendo violação aos princípios do contraditório e da ampla defesa, tendo em vista que não houve intimação em relação à expedição da carta precatória, conforme determina o CPP, que prevê expressamente, em seu Art. 222, que as partes deverão ser intimadas. De fato, conforme consta do enunciado, a expedição de carta precatória, de acordo com o Art. 222, § 1º, do CPP, não gera suspensão do processo. Todavia, essa informação não se confunde com a necessidade de intimação da defesa em relação à expedição. A jurisprudência admite que não ocorra intimação da defesa em relação à data da audiência a ser realizada no juízo deprecado somente no caso de ter ocorrido a devida intimação em relação à expedição da carta precatória, nos termos da Súmula 273 do Superior Tribunal de Justiça, o que não ocorreu na hipótese."
    revisao: { status: revisado }
  - id: 25-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que argumento de direito material leva à absolvição de Eduardo?"
    tese: "Atipicidade: a vantagem foi oferecida a um particular, e a corrupção ativa exige que ela seja oferecida a funcionário público"
    aceitos: [ "particular | nao era funcionario publico | nao e funcionario publico | nao era servidor | nao e servidor | atipic*" ]
    artigos: [ "art. 333, CP" ]
    gabarito: "O argumento a ser apresentado é o de que, apesar de Eduardo ter oferecido vantagem indevida para o segurança do estabelecimento para que ele não praticasse ato de seu ofício, não há que se falar em crime de corrupção ativa. O crime de corrupção ativa, previsto no Art. 333 do Código Penal, é crime praticado por particular contra a Administração Pública em Geral. Ocorre que, no caso, a vantagem foi oferecida para particular e não funcionário público, logo o fato é atípico."
    revisao: { status: revisado }
  - id: 25-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Ao afastar a causa de aumento, o que o juiz deveria ter feito antes de condenar Francisco?"
    tese: "Suspensão condicional do processo: afastada a causa de aumento, o juiz devia abrir vista ao Ministério Público para a proposta"
    aceitos: [ "suspensao condicional do processo | sursis processual | suspensao do processo" ]
    artigos: [ "Súmula 337 STJ", "art. 89, Lei 9.099" ]
    gabarito: "O argumento de direito processual a ser apresentado seria no sentido de que não poderia o magistrado, de imediato, condenar o réu pela prática do crime de apropriação indébita simples, tendo em vista que com o afastamento da causa de aumento, a pena mínima prevista para o delito do Art. 168, caput, do Código Penal admite o oferecimento de proposta de suspensão condicional do processo, de modo que deveria o magistrado ter encaminhado os autos ao Ministério Público para manifestação sobre o previsto no Art. 89 da Lei nº 9.099/95.\n\nRessalta-se que todos os demais requesitos previstos no dispositivo estão preenchidos, já que Francisco era primário, de bons antecedentes e as circunstâncias do crime eram favoráveis. Ademais, o Superior Tribunal de Justiça, na Súmula 337, prevê expressamente que é cabível a suspensão condicional do processo na desclassificação do crime ou na procedência parcial do pedido."
    revisao: { status: revisado }
  - id: 25-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que argumento de direito material evita a punição de Francisco?"
    tese: "Escusa absolutória: o pai que comete crime patrimonial sem violência contra o filho é isento de pena"
    aceitos: [ "escusa absolutoria | isencao de pena | isento de pena | imunidade absoluta" ]
    artigos: [ "art. 181, II, CP" ]
    gabarito: "O argumento de direito material a ser apresentado em busca de evitar a punição de Francisco é da aplicação da previsões do Art. 181, inciso II, do Código Penal, que traz o instituto conhecido como escusa absolutória. Em que pese a conduta praticada por Francisco abstratamente se adeque as previsões do Art. 168, caput, do Código Penal, de acordo com o dispositivo antes mencionado, é isento de pena quem comete crime previsto no título contra descendente, sendo certo que nenhuma das exceções trazidas pelo Art. 183 do Código Penal ocorreu.\n\nAssim, em sendo o autor do fato pai da vítima e não havendo violência ou grave ameaça à pessoa, é ele isento de pena, não podendo ser criminalmente punido."
    revisao: { status: revisado }
