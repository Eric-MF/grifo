# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "03"
introducoes:
  peca: "Um recém-nascido foi achado morto num córrego. Helena, a mãe, sob estado puerperal, negou ter jogado a criança. Como primeira medida, a polícia interceptou o telefone dela e ouviu Helena contar a uma conhecida, Lia, que atirou a filha no córrego; Lia, chamada por causa da escuta, confirmou. Helena foi denunciada por infanticídio no Tribunal do Júri, mas a necropsia mostrou que a criança já nasceu morta. Na audiência, Lia trouxe um fato novo: Helena teria tomado substância abortiva. Sem que a acusação mudasse a denúncia e sem perícia sobre a substância, o juiz pronunciou Helena por aborto (art. 124 do CP). Você defende Helena."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["03-peca-4", "03-peca-8"]
perguntas:
  - id: 03-peca-1
    categoria: peca-detalhe
    parte: peca
    item: "1"
    secao: enderecamento
    pergunta: "Que recurso cabe contra a pronúncia de Helena?"
    tese: "Recurso em sentido estrito"
    aceitos: [ "recurso em sentido estrito | rese" ]
    artigos: [ "art. 581, IV, CPP" ]
    gabarito: "Endereçamento correto (Juiz da 1ª Vara Criminal – Tribunal do Júri) e indicação da norma: art. 581, IV, CPP."
    revisao: { status: revisado }
  - id: 03-peca-2
    categoria: peca-detalhe
    parte: peca
    item: "2"
    secao: pedido
    pergunta: "Ao interpor o recurso, o que a defesa deve pedir ao próprio juiz que pronunciou Helena?"
    tese: "Juízo de retratação: o juiz pode reconsiderar a pronúncia ao receber o recurso"
    aceitos: [ "retrata* | reconsidera* | efeito regressivo" ]
    artigos: [ "art. 589, CPP" ]
    gabarito: "Pedido de reconsideração ao juiz de 1º grau e indicação da norma: art. 589, parágrafo único, CPP."
    revisao: { status: revisado }
  - id: 03-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: preliminar
    pergunta: "O crime investigado é punido com detenção, e a interceptação foi a primeira medida da investigação. Que preliminar cabe quanto às conversas gravadas?"
    tese: "Ilicitude da interceptação telefônica"
    aceitos: [ "ilicit* | ilegal* | ilegitim* | nulidade | nula" ]
    artigos: [ "art. 2º, III, Lei 9.296", "art. 2º, II, Lei 9.296" ]
    gabarito: "Ilegitimidade/ilicitude da interceptação telefônica por tratar-se de crime apenado com detenção OU por não terem sido esgotados previamente os meios de investigação."
    revisao: { status: revisado }
  - id: 03-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: preliminar
    pergunta: "Lia só foi ouvida por causa da escuta. Que vício contamina o depoimento dela?"
    tese: "Ilicitude por derivação: o depoimento vem da interceptação ilícita"
    aceitos: [ [ "deriva*" ], [ "arvore envenenada" ], [ "frutos da arvore" ] ]
    artigos: [ "art. 157, § 1º, CPP" ]
    gabarito: "Ilicitude por derivação da prova testemunhal, com fundamento no art. 157, § 1º, CPP."
    revisao: { status: revisado }
  - id: 03-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: preliminar
    pergunta: "O juiz pronunciou Helena por um crime diferente do da denúncia, por causa de um fato novo surgido na audiência. Que regra processual foi violada?"
    tese: "Violação da mutatio libelli: o fato novo exigia aditamento da denúncia"
    aceitos: [ [ "mutatio libelli" ], [ "aditamento | aditar" ] ]
    artigos: [ "art. 384, CPP", "art. 411, § 3º, CPP" ]
    gabarito: "Violação das regras da mutatio libelli, art. 384 do CPP, c/c art. 411, § 3º, do CPP."
    revisao: { status: revisado }
  - id: 03-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Nenhuma perícia ligou a morte da criança à substância abortiva. Que requisito da pronúncia por aborto fica sem prova?"
    tese: "Falta de prova da materialidade do aborto, que impede a pronúncia"
    aceitos: [ "materialidade" ]
    artigos: [ "art. 158, CPP", "art. 414, CPP" ]
    gabarito: "Ausência de prova da materialidade do aborto por inexistência de perícia que vincule o óbito à substância abortiva."
    revisao: { status: revisado }
