      erradas:
        - "Ausência de dolo eventual: além da previsão do resultado, o dolo eventual exige que o agente assuma o risco de produzi-lo, nos termos do Art. 18, I, parte final, do CP (teoria do consentimento)."
        - Da substituição da pena privativa de liberdade por restritiva de direitos, nos termos do artigo 44 do CP.
        - "Subsidiariamente, em caso de condenação: aplicação da pena base no mínimo legal, destacando que a condenação em ação socioeducativa não gera maus antecedentes ou circunstância judicial desfavorável."
        - Reconhecimento da tentativa, tendo em vista que o crime de estelionato é de natureza material e não houve obtenção da vantagem ilícita. 5
        - "Subsidiariamente: aplicação da pena base no mínimo legal, tendo em vista que o fato posterior ao crime julgado não pode ser considerado maus antecedentes."
    revisao: *a1
  - id: 03-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: pedido
    caso: |-
      O recurso cabível é o recurso em sentido estrito, na forma do art. 581, IV, do Código de Processo Penal, dirigido ao Juiz da 1ª Vara Criminal (Tribunal do Júri).

      Em primeiro lugar, deverá o examinando requerer, em preliminar, o desentranhamento das provas ilícitas.

      Isso porque o crime investigado, infanticídio (art. 123 do Código Penal), é punido com pena de detenção. Em razão disso, não era admissível a interceptação telefônica prevista na Lei 9.296/96, pois a lei em tela não admite a medida quando o crime só é punido com pena de detenção (art. 2º, III). É de ressaltar que o crime de aborto, previsto no art. 124, também só é punido com pena de detenção. Além disso, o enunciado indica não existir indícios suficientes de autoria, uma vez que o delegado representou pela decretação da quebra com base em meras suspeitas. Finalmente, não foram esgotados todos os meios de investigação, condição sine qua non para que a medida seja decretada.

      Por outro lado, o examinando deverá registrar também que o testemunho de Lia, embora seja prova realizada de modo lícito, será ilícito por derivação, na forma do art. 157, § 1º, do Código e Processo Penal e, portanto, imprestável.

      Ainda em preliminar, deverá o examinando suscitar a nulidade do processo por violação do art. 411, § 3º do Código de Processo Penal, c/c art. 384 do Código de Processo Penal. Com efeito, diante das regras acima referidas, o Juiz, vislumbrando a possibilidade de nova definição do fato em razão de prova nova, surgida durante a instrução, deverá abrir vista dos autos para que o Ministério Público, se for o caso, adite a denúncia, mesmo que a pena prevista para a nova definição jurídica seja menor, conforme a nova redação do art. 384 do Código de Processo Penal, dada pela Lei 11.719/2008.

      O candidato deverá, ainda, sustentar que não restou provada a materialidade do crime de aborto, uma vez que nenhuma perícia foi feita no sentido de comprovar que a criança faleceu em decorrência da ingestão de substância abortiva.

      Finalmente, deveria requerer, em caráter sucessivo, a impronúncia da acusada, uma vez que, retiradas as provas ilícitas dos autos, nenhuma prova de autoria existiria contra a denunciada.

      Em relação aos itens da correção, assim ficaram divididos:
    comando: Que pedido deve ser formulado na peça?
    gabarito: "Pedidos principais (0,20 cada): desentranhamento da prova ilícita; impronúncia por ausência de indícios de autoria; impronúncia por ausência de prova da materialidade; absolvição sumária OU nulidade da pronúncia pela mutatio libelli."
    opcoes:
      correta: "Pedidos principais (0,20 cada): desentranhamento da prova ilícita; impronúncia por ausência de indícios de autoria; impronúncia por ausência de prova da materialidade; absolvição sumária OU nulidade da pronúncia pela mutatio libelli."
      erradas:
        - Pedido de retratação ou efeito regressivo, com fundamento no Art. 589 do CPP.
        - Pronúncia da ré nos exatos termos da denúncia OU pronúncia por homicídio triplamente qualificado OU pronúncia da ré por infanticídio
        - "Pedido: Não conhecimento do recurso e, subsidiariamente, não provimento do recurso OU que seja mantida a sentença de 1º grau em sua integralidade"
        - Não provimento do recurso OU manutenção da sentença.
        - Conhecimento e provimento do recurso.
    revisao: *a1
