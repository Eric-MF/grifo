      correta: Afastamento da causa de aumento de pena relativa no caso de emprego de arma de fogo, pois efetivamente comprovado que não havia potencialidade lesiva, sendo impossível a caracterização do simulacro como arma de fogo.
      erradas:
        - Memoriais endereçados ao Juiz do Tribunal do Júri.
        - Aplicação de regime inicial aberto.
        - "Da inaplicabilidade da reincidência: não há que se falar em reincidência, nos termos do artigo 63 do CP."
        - Não há que se falar em punição da tentativa, tendo em vista que houve crime impossível, previsto no Art. 17 do CP.
        - Reconhecimento da causa de diminuição de pena da tentativa, já que o crime não se consumou por circunstâncias alheias à vontade dos agentes OU porque não houve subtração do dinheiro que estava no caixa do estabelecimento OU porque não houve inversão da posse como exige a Súmula 582 do STJ.
