# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "45"
introducoes:
  peca: "Gabriel, de 20 anos, com um simulacro de arma, mandou o casal Andrea e Fabiano sair do carro em 10/4/2025, mas policiais viram e deram voz de prisão antes que ele pegasse o veículo; ele fugiu e foi identificado depois. A perícia confirmou que a arma era um simulacro. Denunciado por roubo com emprego de arma de fogo, confessou. Tem uma condenação anterior por crime doloso, só à pena de multa, extinta pelo cumprimento em 2024. Nos memoriais, o Ministério Público pediu a condenação nos termos da denúncia, a pena-base elevada por maus antecedentes e, pela mesma anotação, a agravante da reincidência. Você foi intimado para a manifestação final."
  q1: "Irritada com a derrota do time, Nina jogou uma pedra no ônibus do clube para danificá-lo, achando que estava vazio, sem se certificar disso. A pedra atingiu Maria, funcionária que estava lá dentro, que ficou gravemente ferida e representou. Recusada a transação no Juizado, o Ministério Público denunciou Nina por dano e por lesão corporal culposa, em concurso material."
  q2: "Cristiano, endividado com apostas, falsificou um contracheque e obteve R$ 100.000 de empréstimo pessoal num banco privado. O Ministério Público Federal o denunciou por obter financiamento mediante fraude, crime contra o sistema financeiro, equiparando financiamento a empréstimo. A denúncia foi rejeitada, o Ministério Público Federal recorreu, e o tribunal, depois de nomear um defensor dativo porque Cristiano ainda não fora citado, recebeu a denúncia."
  q3: "Amauri foi condenado em 20/2/2023 pelo feminicídio da esposa, Joana, a 12 anos, a pena mínima da época. Só ele apelou, e o tribunal anulou o júri. No novo julgamento, em 10/11/2024, foi condenado a 20 anos, a pena mínima do feminicídio pela Lei 14.994/2024, vigente na data do novo júri."
  q4: "Antenor cumpre 10 anos no regime fechado por um roubo com arma de fogo cometido em 2020, como reincidente em crime doloso sem violência, e já cumpriu 4 anos sem nenhuma falta. A defesa quer pedir o benefício cabível."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["45-peca-1", "45-peca-3", "45-peca-10", "45-peca-11", "45-peca-12", "45-peca-13", "45-peca-14", "45-q4-a"]
perguntas:
  - id: 45-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: merito
    pergunta: "A arma usada era um simulacro. Que tese a defesa deve sustentar quanto à causa de aumento?"
    tese: "Afastamento da majorante da arma de fogo: o simulacro não tem potencial lesivo e não é arma de fogo"
    aceitos: [ [ "afast* | exclu* | nao incid* | decote", "majorante | causa de aumento | aumento" ], [ "simulacro nao e arma | nao e arma de fogo | sem potencial lesivo | potencialidade lesiva | potencial lesivo" ] ]
    artigos: [ "art. 157, § 2º-A, I, CP" ]
    gabarito: "Afastamento da causa de aumento de pena relativa no caso de emprego de arma de fogo, pois efetivamente comprovado que não havia potencialidade lesiva, sendo impossível a caracterização do simulacro como arma de fogo."
    revisao: { status: revisado }
  - id: 45-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Gabriel não chegou a pegar o carro. Que tese a defesa deve sustentar quanto à consumação?"
    tese: "Tentativa: não houve inversão da posse do veículo, nem por um instante"
    aceitos: [ "tentativa | tentado | nao se consumou | nao consumado | nao consumou" ]
    artigos: [ "art. 14, II, CP", "Súmula 582 STJ" ]
    gabarito: "Reconhecimento da incidência da causa de diminuição da tentativa, diante de não ter havido a inversão da posse, sequer por breve espaço de tempo, ante a eficiente ação da Polícia, nos termos do Art. 14, inciso II, do CP ou Súmula 582, do STJ."
    revisao: { status: revisado }
  - id: 45-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "O Ministério Público quer usar a mesma condenação como maus antecedentes e como reincidência. Que tese a defesa deve opor?"
    tese: "Pena-base no mínimo: a mesma condenação não pode ser maus antecedentes e reincidência (bis in idem)"
    aceitos: [ "minimo | bis in idem" ]
    artigos: [ "Súmula 241 STJ", "art. 59, CP" ]
    gabarito: "Fixação da pena-base no mínimo legal, pois a reincidência não pode ser usada, simultaneamente, como circunstância judicial e agravante, nos termos da Súmula 241 do STJ."
    revisao: { status: revisado }
  - id: 45-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Na segunda fase, como a confissão de Gabriel deve repercutir diante da reincidência?"
    tese: "Compensação da reincidência com a atenuante da confissão espontânea"
    aceitos: [ "compensac*" ]
    artigos: [ "art. 65, III, d, CP", "art. 67, CP" ]
    gabarito: "Compensação da reincidência com a atenuante de confissão, prevista no Art. 65, inciso III, alínea d, do CP e"
    revisao: { status: revisado }
  - id: 45-peca-7-1
    categoria: peca-detalhe
    parte: peca
    item: "7.1"
    secao: merito
    pergunta: "Que outra atenuante cabe pela idade de Gabriel?"
    tese: "Atenuante da menoridade relativa: o réu tinha menos de 21 anos na data do fato"
    aceitos: [ "menoridade relativa | menor de 21 | menos de 21" ]
    artigos: [ "art. 65, I, CP" ]
    gabarito: "com a atenuante da menoridade relativa, prevista no Art. 65, inciso I, do CP."
    revisao: { status: revisado }
  - id: 45-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Que regime inicial a defesa deve pedir para Gabriel, que é reincidente?"
    tese: "Regime inicial semiaberto para o reincidente com pena de até 4 anos e circunstâncias judiciais favoráveis"
    aceitos: [ "semiaberto | semi-aberto | semi aberto" ]
    artigos: [ "Súmula 269 STJ", "art. 33, § 2º, b, CP" ]
    gabarito: "Fixação de regime inicial semiaberto, nos termos da Súmula 269 do STJ ou do Art. 33, § 2º, alínea b, do CP."
    revisao: { status: revisado }
  - id: 45-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "A condenação anterior de Gabriel foi só à multa. Que benefício isso permite pedir?"
    tese: "Suspensão condicional da pena: a condenação anterior só à multa não a impede"
    aceitos: [ "suspensao condicional da pena | sursis" ]
    artigos: [ "art. 77, § 1º, CP", "Súmula 499 STF" ]
    gabarito: "Concessão de suspensão condicional da pena, nos termos do Art. 77, §1º, do CP ou Súmula 499 do STF."
    revisao: { status: revisado }
  - id: 45-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Que tese de direito penal favorece Nina?"
    tese: "Resultado diverso do pretendido, com concurso formal entre o dano e a lesão culposa, e não concurso material"
    aceitos: [ "resultado diverso | aberratio | concurso formal" ]
    artigos: [ "art. 74, CP", "art. 70, CP" ]
    gabarito: "Deveria o examinando identificar a ocorrência de resultado diverso do pretendido, atraindo a ocorrência de concurso formal perfeito entre as condutas imputadas, na forma do Art. 70 ou do Art. 74, ambos do CP."
    revisao: { status: revisado }
  - id: 45-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que tese processual a defesa de Nina deve alegar quanto ao dano?"
    tese: "Ilegitimidade do Ministério Público quanto ao dano simples, crime de ação penal privada"
    aceitos: [ "ilegitim* | acao penal privada | acao privada | queixa" ]
    artigos: [ "art. 167, CP", "art. 395, II, CPP" ]
    gabarito: "Ilegitimidade ativa do Ministério Público quanto ao delito de dano (ou ausência de condição da ação penal), tendo em vista que o delito de dano é de ação penal privada, na forma do Art. 167 do CP, ou do Art. 95, inciso IV, ou do Art. 564, inciso II, ou do Art. 395, II, todos do CPP."
    revisao: { status: revisado }
  - id: 45-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que preliminar a defesa de Cristiano deve levantar contra a decisão do tribunal?"
    tese: "Nulidade: o denunciado devia ser intimado para contra-arrazoar o recurso, e o defensor dativo não supre essa falta"
    aceitos: [ "nulidade | nula | nulo | contrarrazo* | contra-arrazo*" ]
    artigos: [ "Súmula 707 STF", "art. 263, CPP" ]
    gabarito: "Constitui nulidade a falta de intimação do denunciado para oferecer contrarrazões ao recurso interposto da rejeição da denúncia, não a suprindo a nomeação de defensor dativo, nos termos da Súmula 707 da jurisprudência do Supremo Tribunal Federal ou Art. 263, do CPP ou Art. 5º, LV da CRFB."
    revisao: { status: revisado }
  - id: 45-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Que tese de direito penal favorece Cristiano?"
    tese: "Desclassificação para estelionato: o empréstimo pessoal não é financiamento, e a analogia contra o réu é proibida"
    aceitos: [ [ "desclassific* | atipic*" ], [ "estelionato" ], [ "analogia in malam partem | analogia prejudicial | analogia contra o reu" ] ]
    artigos: [ "art. 171, CP", "art. 1, CP" ]
    gabarito: "Deve ser sustentada a atipicidade ou a desclassificação da conduta, pois a obtenção de empréstimo fraudulento se amolda, em tese, ao delito de estelionato, uma vez que é inadmissível a analogia em prejuízo do acusado."
    revisao: { status: revisado }
  - id: 45-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "Que tese de direito penal reduz a pena de Amauri?"
    tese: "Irretroatividade da lei penal mais grave: vale a pena do tempo do crime"
    aceitos: [ "irretroativ* | nao retroage | tempo do crime" ]
    artigos: [ "art. 5, XL, CRFB", "art. 2, parágrafo único, CP", "art. 1, CP" ]
    gabarito: "A tese de direito penal cabível é a irretroatividade da lei penal mais gravosa, uma vez que, ao tempo do fato, a pena abstratamente cominada era inferior, conforme o Art. 2º, parágrafo único, do CP, ou o Art. 5º, inciso XL, da CRFB/88."
    revisao: { status: revisado }
  - id: 45-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que tese processual reduz a pena de Amauri?"
    tese: "Vedação da reformatio in pejus indireta: anulado o júri por recurso só da defesa, a nova pena não pode ser maior"
    aceitos: [ "reformatio | nao pode ser maior | nao pode agravar" ]
    artigos: [ "art. 617, CPP" ]
    gabarito: "Em relação à tese processual, visto que apenas a defesa recorreu da condenação, o novo julgamento não pode impor pena mais severa que o julgamento anterior, ante a vedação à reformatio in pejus indireta, com aplicação do Art. 617 do CPP."
    revisao: { status: revisado }
  - id: 45-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que meio a defesa de Antenor deve usar para pedir o benefício, e a quem?"
    tese: "Simples petição ao juízo da execução penal"
    aceitos: [ [ "peticao | requerimento", "execucao" ] ]
    artigos: [ "art. 66, III, b, LEP" ]
    gabarito: "Por simples petição, deve a defesa dirigir-se ao Juízo da Execução Penal, na forma do Art. 66, inciso III, alínea b, da LEP."
    revisao: { status: revisado }
