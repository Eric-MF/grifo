    comando: Que tese de mérito deve ser desenvolvida na peça, e com qual fundamento?
    gabarito: Afastamento da causa de aumento de pena relativa no caso de emprego de arma de fogo, pois efetivamente comprovado que não havia potencialidade lesiva, sendo impossível a caracterização do simulacro como arma de fogo.
