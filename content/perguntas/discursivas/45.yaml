  - id: 45-q2-a
    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Cristiano, após ficar totalmente endividado por apostar dinheiro em jogos eletrônicos, decidiu obter vantagem indevida sobre o Banco Tigre, instituição financeira privada. Para tanto, falsificou um contracheque e logrou induzir o banco em erro e obter um empréstimo pessoal no montante de R$ 100.000,00 (cem mil reais).

      Ao constatar a fraude, o Banco Tigre acionou as autoridades. Após a recusa de Cristiano em celebrar um Acordo de Não Persecução Penal (ANPP), o Ministério Público Federal denunciou Cristiano, dando-o como incurso nas penas do Art. 19 da Lei de Crimes Financeiros (Lei nº 7.492/1986), tendo em vista a analogia entre o financiamento, modalidade de empréstimo vinculada a uma finalidade específica, e o empréstimo pessoal obtido por Cristiano.

      A denúncia foi rejeitada pelo Juiz, de forma que o Ministério Público Federal interpôs recurso em sentido estrito em face dessa decisão. O Tribunal Regional Federal nomeou um defensor dativo para oferecer contrarrazões, pois Cristiano ainda não havia sido citado. Em seguida, o Tribunal deu provimento ao recurso do MPF e recebeu a denúncia.

      Como advogado(a) constituído(a) por Cristiano, responda às questões a seguir.
    comando: Em face da decisão do Tribunal Regional Federal, qual a tese preliminar pertinente a ser defendida? Fundamente.
    gabarito: Constitui nulidade a falta de intimação do denunciado para oferecer contrarrazões ao recurso interposto da rejeição da denúncia, não a suprindo a nomeação de defensor dativo, nos termos da Súmula 707 da jurisprudência do Supremo Tribunal Federal ou Art. 263, do CPP ou Art. 5º, LV da CRFB.
    opcoes:
      correta: Constitui nulidade a falta de intimação do denunciado para oferecer contrarrazões ao recurso interposto da rejeição da denúncia, não a suprindo a nomeação de defensor dativo, nos termos da Súmula 707 da Jurisprudência do Supremo Tribunal Federal ou Art. 263, do CPP ou Art. 5º, LV da CRFB.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - A defesa deveria alegar a proibição de aplicação de sanções coletivas, nos termos do Art. 45, §3º, da LEP
        - "A hipótese é de resultado diverso do pretendido (art. 74 do CP), devendo responder por dano em concurso formal com o crime de homicídio culposo. OBS.: a mera indicação de dispositivo legal ou transcrição de seu conteúdo não será pontuada."
        - O requerimento a ser formulado é de relaxamento da prisão, tendo em vista que não está presente nenhuma das situações de flagrante elencadas no Art. 302 do CPP.
        - O argumento seria o de que deveria ter sido reconhecida a atenuante da reparação do dano, tendo em vista que o denunciado devolveu o valor obtido indevidamente, nos termos do Art. 65, inciso III, alínea b, do CP.
    revisao: *a1
