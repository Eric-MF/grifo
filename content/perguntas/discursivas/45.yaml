  - id: 45-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Antenor foi condenado a uma pena de dez anos de reclusão, em regime inicial fechado, pela prática do delito de roubo circunstanciado pelo emprego de arma de fogo (Art. 157, § 2º-A, inciso I, do CP), fato ocorrido em 2020. Antenor foi considerado reincidente, porque anteriormente havia sido condenado pela prática de crime doloso, cometido sem violência ou grave ameaça à pessoa, cuja pena já havia sido extinta, pelo cumprimento.

      Após iniciar o cumprimento da pena relativa ao roubo, transcorrido o período de quatro anos sem que a execução penal tenha sofrido interrupções e sem que Antenor tenha praticado qualquer falta disciplinar, na qualidade de advogado(a) de Antenor, responda às questões a seguir.
    comando: Em favor de Antenor, qual benefício de execução penal é cabível? Fundamente.
    gabarito: É cabível a progressão para o regime semiaberto, diante do cumprimento de lapso temporal de 40% da condenação, considerando que Antenor não é reincidente em crime hediondo ou equiparado (ou não é reincidente específico), nos termos do Art. 112, inciso V, da LEP.
    opcoes:
      correta: Progressão para o regime semiaberto, diante do cumprimento de 40% da pena privativa de liberdade, pois Antenor não é reincidente em crime hediondo ou equiparado (ou não é reincidente específico), nos termos do Art. 112, inciso V, da LEP.
      erradas:
        - "Não: o valor mínimo da sentença (art. 387, IV, CPP) só pode ser executado após o trânsito em julgado (art. 63 do CPP)."
        - Não pode ser considerado fato posterior como falta grave a afastar o preenchimento do requisito subjetivo OU o decreto mencionava que o apenado não poderia ter praticado falta grave nos 12 meses anteriores ao decreto, em respeito ao princípio da legalidade OU porque a decisão que reconhece o indulto é meramente declaratória
        - "O órgão competente é a Justiça Estadual, haja vista que as duas cidades mencionadas ficam no Brasil OU porque não houve efetivo tráfico internacional OU porque deve ser observado o disposto no Verbete 522 da Súmula do STF OU nos termos do art. 70 da Lei 11.343/06.. OBS.1: A mera indicação de justificativa cabível, dissociada da adequada menção à competência da Justiça Estadual, não enseja pontuação. OBS.2: A mera indicação ou transcrição do conteúdo de dispositivo legal ou de verbete sumular não será pontuada."
        - O argumento a ser apresentado em favor de Arnaldo é que a infração deixou vestígios e não existe prova da materialidade do crime de lesão corporal OU que não foi realizado exame de corpo de delito na vítima, não o suprindo a confissão do acusado, nos termos do Art. 158 do CPP.
        - Sim, o argumento seria o de que não poderia o réu ser obrigado a fornecer sua voz para perícia ou que não poderia o magistrado ter exigido um comportamento positivo/ativo por parte do réu ou a perícia de voz dependeria da concordância de Flávio, já que o acusado não pode ser obrigado a produzir prova contra si, conforme Art. 5º, inciso LXIII da CRFB/88 ou Art. 8º, item 2, alínea g, do anexo do Decreto 678/1992.
    revisao: *a1
