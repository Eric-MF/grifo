    categoria: discursiva
    parte: q2
    item: A
    caso: |-
      Em inquérito policial, Antônio é indiciado pela prática de crime de estupro de vulnerável, figurando como vítima Joana, filha da grande amiga da Promotora de Justiça Carla, que, inclusive, aconselhou a família sobre como agir diante do ocorrido.

      Segundo consta do inquérito, Antônio encontrou Joana durante uma festa de música eletrônica e, após conversa em que Joana afirmara que cursava a Faculdade de Direito, foram para um motel onde mantiveram relações sexuais, vindo Antônio, posteriormente, a tomar conhecimento de que Joana tinha apenas 13 anos de idade.

      Recebido o inquérito concluído, Carla oferece denúncia em face de Antônio, imputando-lhe a prática do crime previsto no Art. 217-A do Código Penal, ressaltando a jurisprudência do Supremo Tribunal Federal no sentido de que, para a configuração do delito, não se deve analisar o passado da vítima, bastando que a mesma seja menor de 14 anos.

      Considerando a situação narrada, na condição de advogado(a) de Antônio, responda aos itens a seguir.
    comando: Existe alguma medida a ser apresentada pela defesa técnica para impedir Carla de participar do processo? Justifique.
    gabarito: Sim, o advogado de Antônio, já no momento de apresentar resposta à acusação, deveria apresentar exceção de suspeição em face da Promotora de Justiça, tendo em vista a presença da causa de suspeição prevista no Art. 254, incisos I e IV, do Código de Processo Penal (CPP). Prevê o dispositivo em questão que o juiz dar-se-á por suspeito quando for amigo íntimo de alguma das partes ou quando tiver aconselhado uma das partes. Carla é muito amiga da genitora da vítima e ainda aconselhou a ofendida e sua família sobre como agir diante do ocorrido. Ademais, o Art. 258 do CPP estabelece que as previsões referentes às causas de impedimento e suspeição do magistrado são aplicáveis, no que couber, ao Ministério Público. Claro está o envolvimento de Carla com a causa, de modo que sua suspeição deve ser reconhecida. Considerando que a mesma não se declarou suspeita, oferecendo denúncia, caberia ao advogado apresentar exceção de suspeição, nos termos do Art. 95, inciso I, do CPP, e do Art. 104 do CPP.
    opcoes:
      correta: Sim, com apresentação de exceção de suspeição, nos termos do Art. 95, inciso I, do CPP OU do Art. 104 do CPP
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
