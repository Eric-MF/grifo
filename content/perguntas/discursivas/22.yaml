      Considerando apenas as informações narradas, na condição de advogado de Marcos, responda, de acordo com a jurisprudência dos Tribunais Superiores, aos itens a seguir.
    comando: Oferecida denúncia na forma do indiciamento, qual argumento de direito material poderá ser apresentado pela defesa para questionar a capitulação delitiva constante da nota de culpa, em busca de uma punição mais branda? Justifique.
    gabarito: |-
      O equívoco a ser alegado em relação à capitulação delitiva refere-se ao concurso de crimes. Sem dúvidas, confirmados os fatos, houve crime de roubo, já que foram subtraídas coisas alheias móveis e houve emprego de grave ameaça, ainda que apenas através de palavras de ordem e emprego de simulacro de arma de fogo. Da mesma forma, dois foram os crimes patrimoniais praticados. Isso porque dois patrimônios foram atingidos e presente o elemento subjetivo, tendo em vista que Marcos sabia que estava subtraindo pertences de duas pessoas diversas. Todavia, com uma só ação, mediante uma ameaça, foram subtraídos bens de dois patrimônios diferentes. Assim, deverá ser reconhecido o concurso formal de delitos, aplicando-se a regra da exasperação da pena, e não o concurso material, com aplicação do cúmulo material de sanções.

      Tabela de Pontos
    opcoes:
      correta: O argumento é que houve concurso formal de crimes, tendo em vista que, com uma só ação, foram praticados dois delitos, nos termos do Art. 70 do CP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
