  - id: 22-q4-a
    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Diego e Júlio caminham pela rua, por volta das 21h, retornando para suas casas após mais um dia de aula na faculdade, quando são abordados por Marcos, que, mediante grave ameaça de morte e utilizando simulacro de arma de fogo, exige que ambos entreguem as mochilas e os celulares que carregavam.

      Após os fatos, Diego e Júlio comparecem em sede policial, narram o ocorrido e descrevem as características físicas do autor do crime. Por volta das 5h da manhã do dia seguinte, policiais militares em patrulhamento se deparam com Marcos nas proximidades do local do fato e verificam que ele possuía as mesmas características físicas do roubador. Todavia, não são encontrados com Marcos quaisquer dos bens subtraídos, nem o simulacro de arma de fogo. Ele é encaminhado para a Delegacia e, tendo-se verificado que era triplamente reincidente na prática de crimes patrimoniais, a autoridade policial liga para as residências de Diego e Júlio, que comparecem em sede policial e, em observância de todas as formalidades legais, realizam o reconhecimento de Marcos como responsável pelo assalto. O Delegado, então, lavra auto de prisão em flagrante em desfavor de Marcos, permanecendo este preso, e o indicia pela prática do crime previsto no Art. 157, caput, do Código Penal, por duas vezes, na forma do Art. 69 do Código Penal.

      Diante disso, Marcos liga para seu advogado para informar sua prisão. Este comparece, imediatamente, em sede policial, para acesso aos autos do procedimento originado do Auto de Prisão em Flagrante.

      Considerando apenas as informações narradas, na condição de advogado de Marcos, responda, de acordo com a jurisprudência dos Tribunais Superiores, aos itens a seguir.
    comando: Qual requerimento deverá ser formulado, de imediato, em busca da liberdade de Marcos e sob qual fundamento? Justifique.
    gabarito: |-
      A defesa de Marcos deverá formular requerimento de relaxamento da prisão, tendo em vista que não havia situação de flagrante a justificar a formalização do Auto de Prisão em Flagrante. Narra o enunciado que, de fato, Marcos, mediante grave ameaça, inclusive com emprego de simulacro de arma de fogo, subtraiu coisas alheias móveis de Diego e Julio, logo praticou dois crimes de roubo. As vítimas reconheceram o acusado, de modo que há justa causa para o oferecimento de denúncia. Todavia, não havia situação de flagrante a justificar a prisão do acusado. Isso porque o reconhecimento e prisão de Marcos ocorreram mais de 07 horas após o fato, sendo certo que não houve perseguição e nem com o agente foram encontrados instrumentos ou produtos do crime.

      Dessa forma, nenhuma das situações previstas no Art. 302 do Código de Processo Penal restou configurada. Em sendo a prisão ilegal, o requerimento a ser formulado é de relaxamento da prisão. Insuficiente, no caso, o examinando apresentar requerimento de liberdade provisória. Primeiro porque, em sendo a prisão ilegal, sequer deveriam ser analisados os pressupostos dos Artigos 312 e 313 do Código de Processo Penal nesse momento.

      Além disso, a princípio, não seria caso de reconhecimento de ausência dos motivos da preventiva, já que foi praticado crime com circunstâncias graves e o agente é triplamente reincidente.
    opcoes:
      correta: O requerimento a ser formulado é de relaxamento da prisão, tendo em vista que não está presente nenhuma das situações de flagrante elencadas no Art. 302 do CPP.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
