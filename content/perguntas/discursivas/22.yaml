  - id: 22-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Na cidade de Porto Alegre, no Rio Grande do Sul, Maurício iniciou a execução de determinada contravenção penal que visava atingir e gerar prejuízo em detrimento de patrimônio de entidade autárquica federal, mas a infração penal não veio a se consumar por circunstâncias alheias à sua vontade.

      Ao tomar conhecimento dos fatos, o Ministério Público dá início a procedimento criminal perante juízo do Tribunal Regional Federal com competência para atuar no local dos fatos, imputando ao agente a prática da contravenção penal em sua modalidade tentada, oferecendo, desde já, proposta de transação penal.

      Maurício conversa com sua família e procura um(a) advogado(a) para patrocinar seus interesses, destacando que não tem interesse em aceitar transação penal, suspensão condicional do processo ou qualquer outro benefício despenalizador.

      Com base apenas nas informações narradas e na condição de advogado(a) de Maurício, responda:
    comando: Considerando que a contravenção penal causaria prejuízo ao patrimônio de entidade autárquica federal, o órgão perante o qual o procedimento criminal foi iniciado é competente para julgamento da infração penal imputada? Justifique.
    gabarito: Apesar de a contravenção penal causar prejuízo ao patrimônio de autarquia federal, a Justiça Federal não é competente para julgar a infração penal, tendo em vista que o Art. 109, inciso IV, da Constituição da República Federativa do Brasil prevê expressamente que a Justiça Federal terá competência para julgar infrações penais patricadas em detrimento de bens, serviços ou interesses da União e de suas entidades autárquicas e empresas públicas, excluídas as contravenções penais. Diferente da regra geral, as contravenções penais, ainda que nas circunstâncias do dispositivo acima mencionado, devem ser julgadas perante a Justiça Estadual, no caso, Juizado Especial Criminal Estadual.
    opcoes:
      correta: Não, a Justiça Federal não é competente para julgamento de contravenções penais, ainda que praticadas em detrimento de bens, serviços e patrimônio de entidade autárquica da União, nos termos do Art. 109, inciso IV, da CRFB/88 OU Súmula 38/STJ.
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
