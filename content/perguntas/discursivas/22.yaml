      Considerando a situação narrada, na condição de advogado(a) de Antônio, responda aos itens a seguir.
    comando: Qual a principal alegação defensiva de direito material a ser apresentada em busca da absolvição do denunciado? Justifique.
    gabarito: |-
      A principal alegação defensiva, de mérito, de direito material, é a de que houve erro de tipo por parte do denunciado, nos termos do Art. 20 do Código Penal, de modo que fica afastado o seu dolo. Diante da situação apresentada, claro está que Antônio não tinha conhecimento que Joana tinha apenas 13 anos de idade, merecendo destaque as partes se conheceram em uma festa de música eletrônica, ocasião em que a ofendida afirmara estar na faculdade, o que, por si só, já afastaria as suspeitas de que fosse menor de 14 anos. Ainda que se entendesse que o erro foi vencível, não poderia Antônio ser responsabilizado, tendo em vista que esse afasta o dolo e não há previsão de responsabilização culposa pelo crime de estupro de vulnerável. No caso, é irrelevante a posição dos Tribunais Superiores no sentido de que o passado sexual da vítima não deve ser analisado, bastando que a mesma tenha, objetivamente, menos de 14 anos de idade. Ocorre que o problema apresentado em nada com esse tema se confunde, já que sequer sabia o réu a idade da vítima, que é uma das elementares do tipo.

