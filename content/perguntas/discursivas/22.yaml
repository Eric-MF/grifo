  - id: 22-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Chegou ao Ministério Público denúncia de pessoa identificada apontando Cássio como traficante de drogas. Com base nessa informação, entendendo haver indícios de autoria e não havendo outra forma de obter prova do crime, a autoridade policial representou pela interceptação da linha telefônica que seria utilizada por Cássio e que fora mencionada na denúncia recebida, tendo o juiz da comarca deferido a medida pelo prazo inicial de 30 dias.

      Nas conversas ouvidas, ficou certo que Cássio havia adquirido certa quantidade de cocaína, pela primeira vez, para ser consumida por ele, juntamente com seus amigos Pedro e Paulo, na comemoração de seu aniversário, no dia seguinte. Diante dessa prova, policiais militares obtiveram ordem judicial e chegaram à casa de Cássio quando este consumia e oferecia a seus amigos os seis papelotes de cocaína para juntos consumirem. Cássio, portador de maus antecedentes, foi preso em flagrante e autuado pela prática do crime de tráfico, sendo, depois, denunciado como incurso nas penas do Art. 33, caput, da Lei nº 11.343/06.

      Considerando os fatos narrados, responda, na qualidade de advogado(a) de Cássio, aos itens a seguir.
    comando: Qual a tese de direito processual a ser suscitada para afastar a validade da prova obtida?
    gabarito: |-
      A tese de direito processual a ser suscitada para defesa de Cássio para afastar a prova obtida é a invalidade da decisão que determinou a interceptação telefônica de Cássio, tendo em vista que, de início, foi determinada pelo prazo de 30 dias. Inicialmente deve ser destacado que a autoridade policial possui legitimidade para representar pela decretação da interceptação de comunicações telefônicas, nos termos do Art. 3º, inciso I, da Lei nº 9.296/96.

      Ademais, o crime investigado é punido com pena de reclusão e consta do enunciado que a prova não poderia ser obtida por outros meios disponíveis. Todavia, prevê o Art. 5º do mesmo diploma legal que a decisão que concede a medida deverá ser fundamentada e que não poderá exceder o prazo de 15 dias, renovável por igual período se comprovada a indispensabilidade do meio de prova. Diante disso, ainda que possa o período de 15 dias ser renovado, não pode, de início, a autoridade judicial determinar a interceptação por mais de 15 dias, sob pena de nulidade.
    opcoes:
      correta: A nulidade da decisão que decretou a interceptação das comunicações telefônicas OU ilicitude da prova obtida a partir das interceptações telefônicas, pois decretada a medida pelo prazo inicial de 30 dias, em desacordo com a previsão do Art. 5º da Lei nº 9.296/96
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, pois o auxílio foi proposto após a consumação do crime de furto OU Não, pois inexistente liame subjetivo e identidade da infração penal entre ambos.
        - Extinção da punibilidade pela decadência,pois a ação penal no caso de furto praticado por sobrinho contra tio com quem coabite é pública condicionada à representação, na forma do Art. 182, inciso III, do CP.
        - A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas, de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento, nos termos do Art. 44, § 4º, do CP.
    revisao: *a1
  - id: 22-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Chegou ao Ministério Público denúncia de pessoa identificada apontando Cássio como traficante de drogas. Com base nessa informação, entendendo haver indícios de autoria e não havendo outra forma de obter prova do crime, a autoridade policial representou pela interceptação da linha telefônica que seria utilizada por Cássio e que fora mencionada na denúncia recebida, tendo o juiz da comarca deferido a medida pelo prazo inicial de 30 dias.

      Nas conversas ouvidas, ficou certo que Cássio havia adquirido certa quantidade de cocaína, pela primeira vez, para ser consumida por ele, juntamente com seus amigos Pedro e Paulo, na comemoração de seu aniversário, no dia seguinte. Diante dessa prova, policiais militares obtiveram ordem judicial e chegaram à casa de Cássio quando este consumia e oferecia a seus amigos os seis papelotes de cocaína para juntos consumirem. Cássio, portador de maus antecedentes, foi preso em flagrante e autuado pela prática do crime de tráfico, sendo, depois, denunciado como incurso nas penas do Art. 33, caput, da Lei nº 11.343/06.

      Considerando os fatos narrados, responda, na qualidade de advogado(a) de Cássio, aos itens a seguir.
    comando: Reconhecidos como verdadeiros os fatos narrados, qual a tese de direito material a ser alegada para tornar menos gravosa a tipificação da conduta de Cássio?
    gabarito: |-
      A tese de direito material a ser alegada para tornar a conduta de Cássio menos gravosa é que foi praticado o delito previsto no Art. 33, § 3º da Lei nº 11.343/06, já que o agente oferecia drogas, de maneira eventual, sem objetivo de lucro, para seus amigos para juntos consumirem. Não há, assim, que se falar em prática de tráfico do Art. 33 da Lei nº 11.343/06 e nem mesmo na aplicação do §4º do mesmo dispositivo, já que o agente era portador de maus antecedentes.

      Tabela de Pontos
    opcoes:
      correta: A tese de direito material é que foi praticado o crime previsto no Art. 33, § 3º da Lei nº 11.343/06, tendo em vista que o agente tinha o material e o oferecia para junto consumir com seus amigos, de maneira eventual e sem intenção de lucro
      erradas:
        - "Sim: apropriação indébita qualificada (ou majorada) em razão do ofício, art. 168, § 1º, III, do CP."
        - A vítima não pode se retratar, pois o delito de lesão corporal leve no âmbito da violência doméstica e familiar contra a mulher é de ação penal pública incondicionada (ou porque a Lei nº 9.099/95 não é aplicável no âmbito da violência doméstica e familiar contra a mulher), na forma do Art. 41 da Lei nº 11.340/2006 ou da Súmula 542 do STJ.
        - Não, o referido dispositivo somente é aplicado em se tratando de prescrição da pretensão executória. OU Não, conforme o verbete 220 da Súmula do STJ.
        - Sim, o argumento defensivo é de que houve decadência, já que o crime de injúria racial é de ação penal pública condicionada à representação, nos termos do Art. 145, parágrafo único, do Código Penal.
        - Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez, nos termos do Art. 291, § 1º, inciso I, do CTB.
