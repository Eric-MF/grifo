      Com base apenas nas informações narradas e na condição de advogado(a) de Maurício, responda:
    comando: Qual argumento de direito material deverá ser apresentado para evitar a punição de Maurício? Justifique.
    gabarito: |-
      Apesar de Maurício ter iniciado a execução de uma contravenção penal e a mesma não ter se consumado por circunstâncias alheias à vontade do agente, o que, em tese, configura tentativa, que, pela regra do Código Penal, impõe a punição pelo crime pretendido com redução de pena, na hipótese apresentada, a infração penal que não restou consumada foi uma contravenção. Nos termos do previsto no Art. 4º do Decreto-Lei 3.688/41, não se pune a tentativa de contravenção penal. Assim, no momento em que Maurício não conseguiu consumar o delito por circunstâncias alheias à sua vontade, sua conduta não é punível.

