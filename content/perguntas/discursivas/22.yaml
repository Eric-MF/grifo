# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "22"
introducoes:
  peca: "Leonardo, de 19 anos e sem antecedentes, entrou numa loja para roubar o caixa, simulou estar armado e fez o único cliente sair. Já no caixa, viu que o funcionário era um senhor em cadeira de rodas, arrependeu-se e saiu sem levar nada, sendo preso do lado de fora; não tinha arma. O cliente ameaçado nunca foi ouvido e não quis vê-lo processado. Leonardo confessou. O advogado dele renunciou, e o juiz abriu vista direto à Defensoria, sem intimar Leonardo. Na sentença por roubo tentado com emprego de arma, o juiz considerou maus antecedentes um ato infracional, aplicou a majorante pela arma simulada, reduziu a pena em só 1/3 pela tentativa e fixou o regime fechado pela gravidade do roubo. Você defende Leonardo na apelação."
  q1: "Por uma denúncia identificada, a polícia pediu a interceptação do telefone de Cássio, e o juiz a deferiu pelo prazo inicial de 30 dias. As conversas mostraram que Cássio comprou cocaína, pela primeira vez, para consumir com os amigos Pedro e Paulo no aniversário; no dia, ele foi preso oferecendo os papelotes aos dois e denunciado por tráfico."
  q2: "Antônio conheceu Joana numa festa de música eletrônica; ela disse que cursava Direito, e os dois foram a um motel. Depois, ele soube que Joana tinha 13 anos. Foi denunciado por estupro de vulnerável pela promotora Carla, grande amiga da mãe de Joana, que até aconselhou a família sobre o caso."
  q3: "Em Porto Alegre, Maurício tentou cometer uma contravenção penal contra o patrimônio de uma autarquia federal, sem conseguir. O Ministério Público iniciou o procedimento na Justiça Federal e ofereceu transação penal, que ele não quer aceitar."
  q4: "Marcos foi acusado de roubar, com um simulacro de arma, as mochilas e os celulares de Diego e Júlio, numa só abordagem. Oito horas depois, a polícia o achou perto do local, sem nenhum dos bens; as vítimas o reconheceram na delegacia, e o delegado lavrou o flagrante, indiciando-o por dois roubos em concurso material."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["22-peca-1", "22-peca-3", "22-peca-12"]
perguntas:
  - id: 22-peca-4
    categoria: peca-detalhe
    parte: peca
    item: "4"
    secao: preliminar
    pergunta: "O advogado renunciou e o juiz deu vista direto à Defensoria, sem intimar Leonardo. Que preliminar a defesa deve levantar?"
    tese: "Nulidade, por violação da ampla defesa: Leonardo devia ser intimado para constituir outro advogado"
    aceitos: [ [ "nulidade | nula | nulo" ], [ "ampla defesa" ] ]
    artigos: [ "art. 5, LV, CRFB", "art. 263, CPP" ]
    gabarito: "Preliminarmente: Nulidade da sentença ou de todos os atos processuais desde as alegações finais apresentadas pela Defensoria Pública, tendo em vista que não houve intimação do réu para manifestar interesse em indicar novo advogado OU tendo em vista que houve prejuízo para ampla defesa."
    revisao: { status: revisado }
  - id: 22-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: merito
    pergunta: "Se o fato for desclassificado para ameaça, que causa extingue a punibilidade, já que a vítima não quis processar Leonardo?"
    tese: "Extinção da punibilidade pela decadência do direito de representação"
    aceitos: [ "decaden*" ]
    artigos: [ "art. 103, CP", "art. 147, § 2º, CP" ]
    gabarito: "No mérito: absolvição de Leonardo OU desclassificação para o delito de ameaça com consequente reconhecimento da decadência"
    revisao: { status: revisado }
  - id: 22-peca-5-1
    categoria: peca-detalhe
    parte: peca
    item: "5.1"
    secao: merito
    pergunta: "Leonardo se arrependeu e saiu sem levar nada, antes de ser notado. Que tese afasta o roubo tentado?"
    tese: "Desistência voluntária"
    aceitos: [ "desistencia voluntaria" ]
    artigos: [ "art. 15, CP" ]
    gabarito: "Houve desistência voluntária, nos termos do Art. 15 do CP"
    revisao: { status: revisado }
  - id: 22-peca-5-2
    categoria: peca-detalhe
    parte: peca
    item: "5.2"
    secao: merito
    pergunta: "Com a desistência, por qual crime Leonardo pode responder, no máximo?"
    tese: "Na desistência voluntária, o agente responde só pelos atos já praticados: a ameaça ao cliente"
    aceitos: [ "ameaca" ]
    artigos: [ "art. 147, CP" ]
    gabarito: "Leonardo deve responder apenas pelos atos já praticados OU não deve responder pela tentativa."
    revisao: { status: revisado }
  - id: 22-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "O ato infracional de Leonardo, quando era adolescente, pode ser usado como maus antecedentes?"
    tese: "Ato infracional não gera maus antecedentes"
    aceitos: [ "nao gera | nao configura | nao serve | nao pode | nao caracteriz* | nao sao" ]
    artigos: [ "art. 59, CP" ]
    gabarito: "Subsidiariamente: a pena base deve ser fixada no mínimo legal, pois a existência de ação socioeducativa julgada procedente não justifica o reconhecimento de maus antecedentes"
    revisao: { status: revisado }
  - id: 22-peca-7
    categoria: peca-detalhe
    parte: peca
    item: "7"
    secao: merito
    pergunta: "Leonardo tinha 19 anos no fato. Que atenuante deve ser reconhecida?"
    tese: "Atenuante da menoridade relativa"
    aceitos: [ "menoridade | menor de 21" ]
    artigos: [ "art. 65, I, CP" ]
    gabarito: "Reconhecimento da atenuante da menoridade relativa, nos termos do Art. 65, inciso I, do CP."
    revisao: { status: revisado }
  - id: 22-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "Leonardo confirmou os fatos no interrogatório. Que outra atenuante cabe?"
    tese: "Atenuante da confissão espontânea"
    aceitos: [ "confissao" ]
    artigos: [ "art. 65, III, d, CP" ]
    gabarito: "Reconhecimento da atenuante da confissão, nos termos do Art. 65, inciso III, alínea d, do CP"
    revisao: { status: revisado }
  - id: 22-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Leonardo só simulou estar armado. O que a defesa deve pedir quanto à majorante aplicada?"
    tese: "Afastamento da majorante: a arma simulada não aumenta o potencial lesivo"
    aceitos: [ "afast* | exclu* | decote | nao incid*" ]
    artigos: [ "art. 157, § 2º-A, I, CP" ]
    gabarito: "Afastamento da causa de aumento do Art. 157, §2º, inciso I, do CP, pois houve apenas simulação de porte de arma de fogo, sem incremento do potencial lesivo OU pois não existe prova do emprego de arma de fogo."
    revisao: { status: revisado }
  - id: 22-peca-10
    categoria: peca-detalhe
    parte: peca
    item: "10"
    secao: merito
    pergunta: "Leonardo ficou longe da consumação. Qual deve ser a redução da pena pela tentativa?"
    tese: "Redução máxima da tentativa, de 2/3, porque o crime ficou longe da consumação"
    aceitos: [ "2/3 | dois tercos | maxim*" ]
    artigos: [ "art. 14, parágrafo único, CP" ]
    gabarito: "Redução da tentativa em seu patamar máximo, permitindo aplicação da suspensão condicional da pena"
    revisao: { status: revisado }
  - id: 22-peca-11
    categoria: peca-detalhe
    parte: peca
    item: "11"
    secao: merito
    pergunta: "Por que o regime fechado fixado pela gravidade do roubo deve ser afastado?"
    tese: "A gravidade em abstrato do crime não justifica regime mais severo que o da pena"
    aceitos: [ [ "abstrata | em abstrato" ], [ "motivacao idonea | fundamentacao idonea | concret*" ] ]
    artigos: [ "Súmula 718 STF", "Súmula 719 STF", "Súmula 440 STJ" ]
    gabarito: "Aplicação do regime inicial semiaberto ou aberto do cumprimento de pena, pois a gravidade em abstrato não justifica regime de pena mais severo OU a fixação de regime de cumprimento mais severo exige motivação concreta, nos termos da Súmula 718/STF OU 719/STF OU 440/STJ."
    revisao: { status: revisado }
  - id: 22-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "A interceptação foi deferida pelo prazo inicial de 30 dias. Que tese processual afasta a prova?"
    tese: "Ilicitude da interceptação deferida por 30 dias: o prazo legal é de 15 dias"
    aceitos: [ [ "nulidade | nula | ilicit* | ilegal*" ], [ "15 dias | quinze dias" ] ]
    artigos: [ "art. 5, Lei 9.296" ]
    gabarito: "A tese de direito processual a ser suscitada para defesa de Cássio para afastar a prova obtida é a invalidade da decisão que determinou a interceptação telefônica de Cássio, tendo em vista que, de início, foi determinada pelo prazo de 30 dias. Inicialmente deve ser destacado que a autoridade policial possui legitimidade para representar pela decretação da interceptação de comunicações telefônicas, nos termos do Art. 3º, inciso I, da Lei nº 9.296/96.\n\nAdemais, o crime investigado é punido com pena de reclusão e consta do enunciado que a prova não poderia ser obtida por outros meios disponíveis. Todavia, prevê o Art. 5º do mesmo diploma legal que a decisão que concede a medida deverá ser fundamentada e que não poderá exceder o prazo de 15 dias, renovável por igual período se comprovada a indispensabilidade do meio de prova. Diante disso, ainda que possa o período de 15 dias ser renovado, não pode, de início, a autoridade judicial determinar a interceptação por mais de 15 dias, sob pena de nulidade."
    revisao: { status: revisado }
  - id: 22-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que tese de direito material torna menos grave a tipificação da conduta de Cássio?"
    tese: "Desclassificação para o uso compartilhado: oferecer droga eventualmente, sem lucro, para consumir junto com os amigos"
    aceitos: [ [ "compartilhad*" ], [ "juntos consumir | juntos consumirem | consumirem juntos | consumo conjunto" ], [ "cessao gratuita" ] ]
    artigos: [ "art. 33, § 3º, Lei 11.343" ]
    gabarito: "A tese de direito material a ser alegada para tornar a conduta de Cássio menos gravosa é que foi praticado o delito previsto no Art. 33, § 3º da Lei nº 11.343/06, já que o agente oferecia drogas, de maneira eventual, sem objetivo de lucro, para seus amigos para juntos consumirem. Não há, assim, que se falar em prática de tráfico do Art. 33 da Lei nº 11.343/06 e nem mesmo na aplicação do §4º do mesmo dispositivo, já que o agente era portador de maus antecedentes.\n\nTabela de Pontos"
    revisao: { status: revisado }
  - id: 22-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Que medida a defesa pode usar para impedir a promotora Carla de atuar no processo?"
    tese: "Arguição (exceção) de suspeição da promotora"
    aceitos: [ "suspeicao" ]
    artigos: [ "art. 104, CPP", "art. 95, I, CPP" ]
    gabarito: "Sim, o advogado de Antônio, já no momento de apresentar resposta à acusação, deveria apresentar exceção de suspeição em face da Promotora de Justiça, tendo em vista a presença da causa de suspeição prevista no Art. 254, incisos I e IV, do Código de Processo Penal (CPP). Prevê o dispositivo em questão que o juiz dar-se-á por suspeito quando for amigo íntimo de alguma das partes ou quando tiver aconselhado uma das partes. Carla é muito amiga da genitora da vítima e ainda aconselhou a ofendida e sua família sobre como agir diante do ocorrido. Ademais, o Art. 258 do CPP estabelece que as previsões referentes às causas de impedimento e suspeição do magistrado são aplicáveis, no que couber, ao Ministério Público. Claro está o envolvimento de Carla com a causa, de modo que sua suspeição deve ser reconhecida. Considerando que a mesma não se declarou suspeita, oferecendo denúncia, caberia ao advogado apresentar exceção de suspeição, nos termos do Art. 95, inciso I, do CPP, e do Art. 104 do CPP."
    revisao: { status: revisado }
  - id: 22-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "Qual a principal tese de direito material para a absolvição de Antônio?"
    tese: "Erro de tipo: ele não sabia que Joana tinha menos de 14 anos"
    aceitos: [ "erro de tipo" ]
    artigos: [ "art. 20, CP" ]
    gabarito: "A principal alegação defensiva, de mérito, de direito material, é a de que houve erro de tipo por parte do denunciado, nos termos do Art. 20 do Código Penal, de modo que fica afastado o seu dolo. Diante da situação apresentada, claro está que Antônio não tinha conhecimento que Joana tinha apenas 13 anos de idade, merecendo destaque as partes se conheceram em uma festa de música eletrônica, ocasião em que a ofendida afirmara estar na faculdade, o que, por si só, já afastaria as suspeitas de que fosse menor de 14 anos. Ainda que se entendesse que o erro foi vencível, não poderia Antônio ser responsabilizado, tendo em vista que esse afasta o dolo e não há previsão de responsabilização culposa pelo crime de estupro de vulnerável. No caso, é irrelevante a posição dos Tribunais Superiores no sentido de que o passado sexual da vítima não deve ser analisado, bastando que a mesma tenha, objetivamente, menos de 14 anos de idade. Ocorre que o problema apresentado em nada com esse tema se confunde, já que sequer sabia o réu a idade da vítima, que é uma das elementares do tipo.\n\nTabela de Pontos"
    revisao: { status: revisado }
  - id: 22-q3-a
    categoria: discursiva
    parte: q3
    item: "A"
    pergunta: "A Justiça Federal pode julgar a contravenção imputada a Maurício?"
    tese: "Competência da Justiça Estadual para as contravenções, mesmo contra bens da União"
    aceitos: [ [ "justica estadual" ], [ "ressalv*" ] ]
    artigos: [ "art. 109, IV, CRFB", "Súmula 38 STJ" ]
    gabarito: "Apesar de a contravenção penal causar prejuízo ao patrimônio de autarquia federal, a Justiça Federal não é competente para julgar a infração penal, tendo em vista que o Art. 109, inciso IV, da Constituição da República Federativa do Brasil prevê expressamente que a Justiça Federal terá competência para julgar infrações penais patricadas em detrimento de bens, serviços ou interesses da União e de suas entidades autárquicas e empresas públicas, excluídas as contravenções penais. Diferente da regra geral, as contravenções penais, ainda que nas circunstâncias do dispositivo acima mencionado, devem ser julgadas perante a Justiça Estadual, no caso, Juizado Especial Criminal Estadual."
    revisao: { status: revisado }
  - id: 22-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Que argumento de direito material evita a punição de Maurício?"
    tese: "Atipicidade: a tentativa de contravenção não é punível"
    aceitos: [ "nao se pune | nao e punivel | impunivel | nao punivel | nao se punem" ]
    artigos: [ "art. 4º LCP" ]
    gabarito: "Apesar de Maurício ter iniciado a execução de uma contravenção penal e a mesma não ter se consumado por circunstâncias alheias à vontade do agente, o que, em tese, configura tentativa, que, pela regra do Código Penal, impõe a punição pelo crime pretendido com redução de pena, na hipótese apresentada, a infração penal que não restou consumada foi uma contravenção. Nos termos do previsto no Art. 4º do Decreto-Lei 3.688/41, não se pune a tentativa de contravenção penal. Assim, no momento em que Maurício não conseguiu consumar o delito por circunstâncias alheias à sua vontade, sua conduta não é punível.\n\nTabela de Pontos"
    revisao: { status: revisado }
  - id: 22-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Que pedido deve ser feito de imediato pela liberdade de Marcos?"
    tese: "Relaxamento da prisão ilegal: não havia nenhuma situação de flagrante"
    aceitos: [ "relaxamento" ]
    artigos: [ "art. 302, CPP" ]
    gabarito: "A defesa de Marcos deverá formular requerimento de relaxamento da prisão, tendo em vista que não havia situação de flagrante a justificar a formalização do Auto de Prisão em Flagrante. Narra o enunciado que, de fato, Marcos, mediante grave ameaça, inclusive com emprego de simulacro de arma de fogo, subtraiu coisas alheias móveis de Diego e Julio, logo praticou dois crimes de roubo. As vítimas reconheceram o acusado, de modo que há justa causa para o oferecimento de denúncia. Todavia, não havia situação de flagrante a justificar a prisão do acusado. Isso porque o reconhecimento e prisão de Marcos ocorreram mais de 07 horas após o fato, sendo certo que não houve perseguição e nem com o agente foram encontrados instrumentos ou produtos do crime.\n\nDessa forma, nenhuma das situações previstas no Art. 302 do Código de Processo Penal restou configurada. Em sendo a prisão ilegal, o requerimento a ser formulado é de relaxamento da prisão. Insuficiente, no caso, o examinando apresentar requerimento de liberdade provisória. Primeiro porque, em sendo a prisão ilegal, sequer deveriam ser analisados os pressupostos dos Artigos 312 e 313 do Código de Processo Penal nesse momento.\n\nAlém disso, a princípio, não seria caso de reconhecimento de ausência dos motivos da preventiva, já que foi praticado crime com circunstâncias graves e o agente é triplamente reincidente."
    revisao: { status: revisado }
  - id: 22-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que argumento de direito material contesta a capitulação de dois roubos em concurso material?"
    tese: "Concurso formal: com uma só ação, foram dois crimes"
    aceitos: [ "concurso formal" ]
    artigos: [ "art. 70, CP" ]
    gabarito: "O equívoco a ser alegado em relação à capitulação delitiva refere-se ao concurso de crimes. Sem dúvidas, confirmados os fatos, houve crime de roubo, já que foram subtraídas coisas alheias móveis e houve emprego de grave ameaça, ainda que apenas através de palavras de ordem e emprego de simulacro de arma de fogo. Da mesma forma, dois foram os crimes patrimoniais praticados. Isso porque dois patrimônios foram atingidos e presente o elemento subjetivo, tendo em vista que Marcos sabia que estava subtraindo pertences de duas pessoas diversas. Todavia, com uma só ação, mediante uma ameaça, foram subtraídos bens de dois patrimônios diferentes. Assim, deverá ser reconhecido o concurso formal de delitos, aplicando-se a regra da exasperação da pena, e não o concurso material, com aplicação do cúmulo material de sanções.\n\nTabela de Pontos"
    revisao: { status: revisado }
