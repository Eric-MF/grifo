    categoria: discursiva
    parte: q4
    item: A
    caso: |-
      Na manhã do dia 09 de outubro de 2018, Talles, na cidade de Bom Jesus de Itabapoana, praticou 03 crimes de furto simples em continuidade delitiva, subtraindo, do primeiro estabelecimento, dinheiro e uma arma de brinquedo; do segundo estabelecimento, uma touca ninja e um celular; e, do terceiro estabelecimento, uma motocicleta.

      De posse dos bens subtraídos, Talles foi até a cidade de Cardoso Moreira, abordou Joana, que passava pela rua segurando seu celular, e, utilizando-se do simulacro da arma para emprego de grave ameaça e da touca, segurou-a pelos braços e subtraiu o celular de suas mãos. De imediato, Talles empreendeu fuga, mas Joana compareceu em sede policial, narrou o ocorrido e Talles foi localizado e preso em flagrante na cidade de São Fidélis, ainda na posse dos bens da vítima e da motocicleta utilizada.

      Assegurado o direito ao silêncio e o acompanhamento da defesa técnica, Talles prestou declarações na delegacia e confessou integralmente os fatos, sendo ele indiciado pela prática dos crimes previstos no Art. 155, caput, por três vezes, n/f do Art. 71 do CP e do Art. 157, § 2º, inciso V, também do CP.

      Considerando as informações expostas, responda, na condição de advogado(a) de Talles, aos itens a seguir.
    comando: Considerando que os delitos são conexos, de qual cidade será o juízo criminal competente para o julgamento de Talles? Justifique.
    gabarito: Será competente para julgamento de Talles o juízo da Comarca de Cardoso Moreira, local onde teria sido praticado o crime de roubo. De acordo com as informações constantes do enunciado, três crimes de furto foram praticados em conexão com um crime de roubo, tendo em vista que o agente, em continuidade, subtraiu bens de estabelecimentos diversos para obter instrumentos para a prática do crime de roubo. A conexão probatória, então, é clara. Havendo conexão entre crimes que foram praticados em diferentes comarcas, sendo que todos os juízos seriam de mesma categoria, aplicam-se as previsões do Art. 78, inciso II, do Código de Processo Penal. Não há que se falar em competência da cidade de São Fidélis, pois nenhum dos crimes foi consumado do local, somente lá ocorrendo a prisão em flagrante. Restariam as cidades de Bom Jesus de Itabapoana e Cardoso Moreira. De acordo com o Art. 78, inciso II, alínea a, do CPP, o primeiro critério a ser observado é o local onde foi praticado o crime à qual for cominada a pena mais grave. O crime mais grave imputado é o de roubo majorado, logo competente a Comarca de Cardoso Moreira. O critério do número de crimes praticados somente seria relevante se a todos os delitos fosse prevista a mesma pena.
    opcoes:
      correta: Será competente o juízo da Comarca de Cardoso Moreira, local onde foi praticada a infração penal mais grave, nos termos do Art. 78, inciso II, alínea a, do CPP.
