  - id: 28-q1-a
    categoria: discursiva
    parte: q1
    item: A
    caso: |-
      Matheus conduzia seu automóvel em alta velocidade. Em razão de manobra indevida, acabou por atropelar uma vítima, causando-lhe lesões corporais. Com a chegada da Polícia Militar, foi solicitado que Matheus realizasse exame de etilômetro (bafômetro); diante de sua recusa, foi informado pela autoridade policial, que comparecera ao local, que ele seria obrigado a realizar o exame para verificar eventual prática também do crime previsto no Art. 306 da Lei nº 9.503/97.

      Diante da afirmativa da autoridade policial, Matheus, apesar de não desejar, viu-se obrigado a realizar o teste do bafômetro. Após conclusão do inquérito policial, com oitiva e representação da vítima, foi o feito encaminhado ao Ministério Público, que ofereceu denúncia imputando a Matheus apenas a prática do crime do Art. 303, da Lei nº 9.503/97, prosseguindo as investigações com relação ao crime do Art. 306 do mesmo diploma legal. Ainda na exordial acusatória, foi requerida a decretação da prisão preventiva de Matheus, pelo risco de reiteração delitiva, tendo em vista que ele seria reincidente específico, já que a única anotação constante de sua Folha de Antecedentes Criminais, para além do presente processo, seria a condenação definitiva pela prática de outro crime de lesão corporal culposa praticada na direção de veículo automotor. No recebimento da denúncia, o juiz competente decretou a prisão preventiva.

      Considerando as informações narradas, na condição de advogado(a) de Matheus, responda aos itens a seguir.
    comando: Poderia Matheus ter sido obrigado a realizar o teste de bafômetro, conforme informado pela autoridade policial, mesmo diante de sua recusa? Justifique.
    gabarito: |-
      Com base nas informações constantes do enunciado, não poderia Matheus ser obrigado a realizar o teste de bafômetro nos termos informados pela autoridade policial. Matheus foi o autor de um atropelamento de vítima que sofreu lesões corporais em razão de sua conduta com violação do dever objetivo de cuidado.

      Independentemente, a autoridade policial não poderia exigir a contribuição de Matheus para produção de provas contra ele próprio em relação ao crime do Art. 306 da Lei nº 9.503/97 (CTB). O princípio do nemo tenetur se detegere, trazido, dentre outros diplomas, pelo Pacto de San Jose da Costa Rica, estabelece que ninguém é obrigado a produzir provas contra si. Apesar de haver controvérsia sobre a extensão desse princípio, em relação à exigência de conduta positiva do investigado/acusado na produção de prova que pode lhe prejudicar, prevalece o entendimento no sentido de que não existe obrigatoriedade na contribuição. O exame de etilômetro exige que o investigado adote um comportamento positivo, já que é preciso que ele sopre ar em determinado aparelho, de modo que não pode Matheus ser obrigado a realizar tal teste se assim não o desejar, podendo o crime do Art. 306 do CTB ser identificado por outros meios de prova.
    opcoes:
      correta: Não poderia Matheus ter sido obrigado a realizar o teste do bafômetro, em respeito ao princípio de que ninguém é obrigado a produzir prova contra si OU diante do princípio nemo tenetur se detegere
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
  - id: 28-q1-b
    categoria: discursiva
    parte: q1
    item: B
    caso: |-
      Matheus conduzia seu automóvel em alta velocidade. Em razão de manobra indevida, acabou por atropelar uma vítima, causando-lhe lesões corporais. Com a chegada da Polícia Militar, foi solicitado que Matheus realizasse exame de etilômetro (bafômetro); diante de sua recusa, foi informado pela autoridade policial, que comparecera ao local, que ele seria obrigado a realizar o exame para verificar eventual prática também do crime previsto no Art. 306 da Lei nº 9.503/97.

      Diante da afirmativa da autoridade policial, Matheus, apesar de não desejar, viu-se obrigado a realizar o teste do bafômetro. Após conclusão do inquérito policial, com oitiva e representação da vítima, foi o feito encaminhado ao Ministério Público, que ofereceu denúncia imputando a Matheus apenas a prática do crime do Art. 303, da Lei nº 9.503/97, prosseguindo as investigações com relação ao crime do Art. 306 do mesmo diploma legal. Ainda na exordial acusatória, foi requerida a decretação da prisão preventiva de Matheus, pelo risco de reiteração delitiva, tendo em vista que ele seria reincidente específico, já que a única anotação constante de sua Folha de Antecedentes Criminais, para além do presente processo, seria a condenação definitiva pela prática de outro crime de lesão corporal culposa praticada na direção de veículo automotor. No recebimento da denúncia, o juiz competente decretou a prisão preventiva.

      Considerando as informações narradas, na condição de advogado(a) de Matheus, responda aos itens a seguir.
    comando: Qual requerimento deveria ser formulado, em busca da liberdade de Matheus, diante da decisão do magistrado, que decretou sua prisão preventiva em razão de sua reincidência? Justifique.
    gabarito: Em busca da liberdade de Matheus, o advogado deveria formular requerimento de relaxamento da prisão, tendo em vista que a decretação da prisão preventiva exige a presença dos requisitos e pressupostos trazidos pelos Arts. 312 e 313 do Código de Processo Penal. Independentemente do risco de reiteração delitiva, os pressupostos do Art. 313 do CPP não foram atendidos. O crime imputado não é doloso e não tem pena máxima superior a 04 anos, ainda que considerada eventual causa de aumento. Em relação à reincidência, o Art. 313, inciso II, do CPP apenas admite a prisão se aquela for em crimes dolosos. No caso, o enunciado deixa claro que Matheus era reincidente específico na prática de crimes culposos, logo não preenchidos os requisitos legais desde o início, a decretação da prisão torna-se ilegal, devendo ser relaxada, nos termos do Art. 5º, inciso LXV, CRFB/88.
    opcoes:
      correta: O requerimento a ser formulado é de relaxamento da prisão, conforme Art. 5º, inciso LXV, da CRFB/88, tendo em vista que Matheus é reincidente na prática de crimes culposos OU tendo em vista que não foram preenchidos os requisitos do Art. 313 do CPP.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
