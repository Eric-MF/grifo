# Teses de "Por dentro da peça" e "Questões discursivas" (ver PerguntaTese em src/quiz/types.ts e docs/COMO-ADICIONAR.md).
exame: "28"
introducoes:
  peca: "Túlio, nascido em 1/1/1996 e primário, comprou um remédio abortivo de venda controlada e o deu à namorada, Joaquina, de 15 anos, que acreditava estar grávida do ex-namorado e pediu ajuda para abortar. Ela tomou o remédio em 3/1/2014, mas os médicos constataram que nunca estivera grávida: tinha um cisto. Túlio foi denunciado por aborto com consentimento da gestante, tentado; a denúncia foi recebida em 22/1/2014, e o Ministério Público não ofereceu nenhum benefício despenalizador, apesar do pedido da defesa. Depois das alegações finais, foram juntados o boletim médico, a folha de antecedentes e o exame de corpo de delito, e o juiz, na mesma hora, pronunciou Túlio, em 18/6/2018. Você é o advogado dele."
  q1: "Matheus atropelou uma pessoa ao fazer uma manobra indevida em alta velocidade. Ele recusou o bafômetro, mas o delegado disse que ele era obrigado a fazê-lo, e Matheus acabou soprando. Foi denunciado por lesão corporal culposa na direção de veículo, e o juiz decretou a preventiva a pedido do Ministério Público, porque ele seria reincidente específico: tinha uma condenação definitiva por outra lesão corporal culposa no trânsito."
  q2: "Hugo foi condenado por apropriação indébita majorada a 1 ano e 6 meses. Era reincidente: no ano anterior ao crime, transitou em julgado sua condenação por lesão corporal dolosa contra a mulher, em violência doméstica. Por causa da reincidência, o juiz fixou o regime fechado e negou a substituição da pena, dizendo que a lei a veda para o reincidente em crime doloso, embora Hugo trabalhe e cuide de filhos pequenos."
  q3: "Leal cumpre pena de 6 anos no semiaberto por lesão corporal seguida de morte, sem nenhuma falta disciplinar. Quer progredir para o aberto, mas soube que não há vagas em estabelecimentos do regime aberto no estado."
  q4: "Em Bom Jesus de Itabapoana, Talles furtou, em continuidade delitiva, dinheiro, uma arma de brinquedo, uma touca ninja, um celular e uma moto. Depois, em Cardoso Moreira, com a arma de brinquedo e a touca, segurou Joana pelos braços, tomou o celular dela e fugiu. Foi preso em São Fidélis e indiciado pelos furtos e por roubo majorado pela restrição da liberdade da vítima."
# itens fora do jogo: sem artigo (endereçamento, prazo, pedidos genéricos, rol) ou com a resposta superada por lei nova
fora: ["28-peca-1", "28-peca-4", "28-peca-7", "28-peca-10", "28-peca-11", "28-q3-a"]
perguntas:
  - id: 28-peca-3
    categoria: peca-detalhe
    parte: peca
    item: "3"
    secao: pedido
    pergunta: "Ao interpor o recurso contra a pronúncia, o que a defesa deve pedir ao próprio juiz?"
    tese: "Juízo de retratação: o juiz pode reformar a pronúncia ao receber o recurso em sentido estrito"
    aceitos: [ "retrata* | efeito regressivo | reconsidera*" ]
    artigos: [ "art. 589, CPP" ]
    gabarito: "Requerimento do exercício do juízo de retratação, nos termos do Art. 589 do CPP."
    revisao: { status: revisado }
  - id: 28-peca-5
    categoria: peca-detalhe
    parte: peca
    item: "5"
    secao: pedido
    pergunta: "Entre o recebimento da denúncia e a pronúncia passaram mais de 4 anos. Que causa extingue a punibilidade de Túlio?"
    tese: "Prescrição da pretensão punitiva, que extingue a punibilidade"
    aceitos: [ "prescri*" ]
    artigos: [ "art. 107, IV, CP", "art. 109, IV, CP" ]
    gabarito: "Requerimento de reconhecimento da prescrição da pretensão punitiva do Estado, com consequente extinção da punibilidade do agente, nos termos do Art. 107, inciso IV, do CP."
    revisao: { status: revisado }
  - id: 28-peca-6
    categoria: peca-detalhe
    parte: peca
    item: "6"
    secao: merito
    pergunta: "Por que o prazo prescricional de Túlio é de só 4 anos?"
    tese: "Prazo prescricional pela metade, porque o réu era menor de 21 anos na data do fato"
    aceitos: [ "metade | menor de 21 | 21 anos" ]
    artigos: [ "art. 115, CP" ]
    gabarito: "A prescrição ocorreu porque, entre a data do recebimento da denúncia e da pronúncia foi ultrapassado o prazo de 4 anos OU o prazo de 4 anos foi ultrapassado porque o prazo prescricional deveria ser computado pela metade, já que o réu era menor de 21 anos."
    revisao: { status: revisado }
  - id: 28-peca-7-1
    categoria: peca-detalhe
    parte: peca
    item: "7.1"
    secao: preliminar
    pergunta: "Que preliminar a defesa deve levantar quanto ao benefício que o Ministério Público não ofereceu?"
    tese: "Nulidade pela falta de proposta de suspensão condicional do processo, cabível porque a pena mínima é de 1 ano"
    aceitos: [ "suspensao condicional do processo | sursis processual" ]
    artigos: [ "art. 89, Lei 9.099" ]
    gabarito: "Nulidade em razão do não oferecimento de proposta de suspensão condicional do processo, nos termos do Art. 89 da Lei 9.099, já que a pena mínima do delito imputado é de 1 ano."
    revisao: { status: revisado }
  - id: 28-peca-7-2
    categoria: peca-detalhe
    parte: peca
    item: "7.2"
    secao: preliminar
    pergunta: "Que outra preliminar a defesa deve levantar contra a pronúncia, dada logo após a juntada dos documentos?"
    tese: "Nulidade da pronúncia por cerceamento de defesa: o juiz decidiu logo após a juntada de documentos, sem dar vista às partes"
    aceitos: [ "cerceamento | ampla defesa | contraditorio | sem vista | sem dar vista | nao deu vista | vista as partes" ]
    artigos: [ "art. 5, LV, CRFB", "art. 564, IV, CPP" ]
    gabarito: "Nulidade em razão do cerceamento de defesa OU violação ao princípio da ampla defesa OU violação ao princípio do contraditório, já que o juiz proferiu decisão após juntada de documentação, sem dar vista às partes."
    revisao: { status: revisado }
  - id: 28-peca-8
    categoria: peca-detalhe
    parte: peca
    item: "8"
    secao: merito
    pergunta: "No mérito, que decisão a defesa deve pedir no lugar da pronúncia?"
    tese: "Absolvição sumária, porque o fato não constitui crime"
    aceitos: [ "absolvicao sumaria | absolvido sumariamente | absolver sumariamente | absolvicao* sumaria*" ]
    artigos: [ "art. 415, III, CPP" ]
    gabarito: "No mérito, absolvição sumária em razão de o fato evidentemente não constituir crime OU diante da atipicidade da conduta, nos termos do Art. 415, III, CPP"
    revisao: { status: revisado }
  - id: 28-peca-9
    categoria: peca-detalhe
    parte: peca
    item: "9"
    secao: merito
    pergunta: "Joaquina nunca esteve grávida. Que tese de mérito isso permite?"
    tese: "Crime impossível, pela absoluta impropriedade do objeto: não havia gravidez"
    aceitos: [ "crime impossivel | impropriedade" ]
    artigos: [ "art. 17, CP" ]
    gabarito: "A conduta de Túlio configura crime impossível, nos termos do Art. 17 do CP."
    revisao: { status: revisado }
  - id: 28-q1-a
    categoria: discursiva
    parte: q1
    item: "A"
    pergunta: "Matheus podia ser obrigado a fazer o teste do bafômetro?"
    tese: "Violação do direito de não produzir prova contra si mesmo: ninguém pode ser obrigado a fazer o teste do bafômetro"
    aceitos: [ "produzir prova contra si | nemo tenetur | autoincrimina* | nao autoincriminacao" ]
    artigos: [ "art. 5, LXIII, CRFB" ]
    gabarito: "Com base nas informações constantes do enunciado, não poderia Matheus ser obrigado a realizar o teste de bafômetro nos termos informados pela autoridade policial. Matheus foi o autor de um atropelamento de vítima que sofreu lesões corporais em razão de sua conduta com violação do dever objetivo de cuidado.\n\nIndependentemente, a autoridade policial não poderia exigir a contribuição de Matheus para produção de provas contra ele próprio em relação ao crime do Art. 306 da Lei nº 9.503/97 (CTB). O princípio do nemo tenetur se detegere, trazido, dentre outros diplomas, pelo Pacto de San Jose da Costa Rica, estabelece que ninguém é obrigado a produzir provas contra si. Apesar de haver controvérsia sobre a extensão desse princípio, em relação à exigência de conduta positiva do investigado/acusado na produção de prova que pode lhe prejudicar, prevalece o entendimento no sentido de que não existe obrigatoriedade na contribuição. O exame de etilômetro exige que o investigado adote um comportamento positivo, já que é preciso que ele sopre ar em determinado aparelho, de modo que não pode Matheus ser obrigado a realizar tal teste se assim não o desejar, podendo o crime do Art. 306 do CTB ser identificado por outros meios de prova."
    revisao: { status: revisado }
  - id: 28-q1-b
    categoria: discursiva
    parte: q1
    item: "B"
    pergunta: "Que pedido a defesa deve fazer contra a preventiva decretada pela reincidência?"
    tese: "Relaxamento da prisão ilegal: a reincidência em crime culposo não autoriza a preventiva"
    aceitos: [ "relaxamento | relaxar" ]
    artigos: [ "art. 5, LXV, CRFB", "art. 313, II, CPP" ]
    gabarito: "Em busca da liberdade de Matheus, o advogado deveria formular requerimento de relaxamento da prisão, tendo em vista que a decretação da prisão preventiva exige a presença dos requisitos e pressupostos trazidos pelos Arts. 312 e 313 do Código de Processo Penal. Independentemente do risco de reiteração delitiva, os pressupostos do Art. 313 do CPP não foram atendidos. O crime imputado não é doloso e não tem pena máxima superior a 04 anos, ainda que considerada eventual causa de aumento. Em relação à reincidência, o Art. 313, inciso II, do CPP apenas admite a prisão se aquela for em crimes dolosos. No caso, o enunciado deixa claro que Matheus era reincidente específico na prática de crimes culposos, logo não preenchidos os requisitos legais desde o início, a decretação da prisão torna-se ilegal, devendo ser relaxada, nos termos do Art. 5º, inciso LXV, CRFB/88."
    revisao: { status: revisado }
  - id: 28-q2-a
    categoria: discursiva
    parte: q2
    item: "A"
    pergunta: "Apesar da reincidência, que regime inicial a defesa pode pedir, segundo o STJ?"
    tese: "Regime inicial semiaberto para o reincidente com pena de até 4 anos e circunstâncias judiciais favoráveis"
    aceitos: [ "semiaberto | semi-aberto | semi aberto | circunstancias judiciais favoraveis" ]
    artigos: [ "Súmula 269 STJ" ]
    gabarito: "Sim, existe argumento em busca da aplicação do regime inicial semiaberto para cumprimento da pena. De acordo com a literalidade do Art. 33, § 2º, do Código Penal, em sendo o réu reincidente, cabível a aplicação do regime inicial fechado. Ocorre que tal previsão poderá ser extremamente severa diante de situações concretas onde outro regime de cumprimento de pena se mostre mais adequado. Diante disso, procurando mitigar as consequências dessa previsão do Código Penal, a jurisprudência dos Tribunais Superiores, inclusive através da Súmula 269 do Superior Tribunal de Justiça, admite a aplicação do regime inicial semiaberto aos reincidentes condenados ao cumprimento de pena fixada em até 04 anos, desde que favoráveis as demais circunstâncias judiciais. No caso, apesar da reincidência, a pena foi aplicada em 1 ano e 06 meses de reclusão, não sendo reconhecidas circunstâncias judiciais desfavoráveis. Ademais, a reincidência anterior sequer era específica. Diante disso, possível ao advogado de Hugo pleitear a fixação do regime inicial semiaberto de cumprimento de pena. A mera indicação do candidato de que com base na pena imposta o regime inicial adequado seria aberto não é suficiente para atribuição de pontos."
    revisao: { status: revisado }
  - id: 28-q2-b
    categoria: discursiva
    parte: q2
    item: "B"
    pergunta: "A reincidência impede a substituição da pena de Hugo por restritivas de direitos?"
    tese: "Substituição por restritivas de direitos para o reincidente não específico, quando a medida é socialmente recomendável"
    aceitos: [ "nao especific* | reincidencia generica | reincidente generico | socialmente recomendavel" ]
    artigos: [ "art. 44, § 3º, CP" ]
    gabarito: "Sim, é possível ao advogado buscar a substituição da pena privativa de liberdade por restritiva de direitos. De fato, como destacado pelo magistrado, a princípio, o Art. 44, inciso II, do Código Penal, veda a substituição da pena privativa de liberdade por restritiva de direitos na hipótese de o réu ser reincidente na prática de crimes dolosos. Não há dúvida que Hugo era reincidente, já que possuía condenação pela prática de crime doloso anterior, com trânsito em julgado, sendo o crime de apropriação indébita praticado posteriormente.\n\nTodavia, o próprio Art. 44, § 3º, do Código Penal, admite a substituição, mesmo diante de reincidência, desde que essa não seja específica e a medida seja socialmente recomendável. Na situação apresentada, Hugo não é reincidente específico sequer na prática de crimes contra o patrimônio, já que a condenação anterior refere-se ao crime de lesão corporal dolosa. Ademais, com base nas informações expostas, a medida seria socialmente recomendável, tendo em vista que Hugo estava trabalhando e cuidava de filhos menores de idade. O crime não envolveria violência ou grave ameaça à pessoa. Assim, excepcionalmente, possível a substituição da pena privativa de liberdade por restritiva de direitos."
    revisao: { status: revisado }
  - id: 28-q3-b
    categoria: discursiva
    parte: q3
    item: "B"
    pergunta: "Não há vagas no regime aberto. Isso justifica negar a progressão de Leal?"
    tese: "A falta de vaga não mantém o preso em regime mais grave: ele vai para o regime adequado, para a liberdade ou para medida alternativa"
    aceitos: [ "falta de vaga* | ausencia de vaga* | inexistencia de vaga* | deficit de vaga* | nao pode permanecer | nao pode ficar | mais gravoso | mais grave" ]
    artigos: [ "Súmula Vinculante 56" ]
    gabarito: "A inexistência de vagas em regime compatível não é fundamento idôneo para manutenção do apenado em regime mais severo, nos termos da Súmula Vinculante 56 do STF. Preenchidos os requisitos legais, o apenado possui direito à progressão para regime compatível ao cumprimento de sua pena, não podendo a deficiência do estado lhe prejudicar. De acordo com a jurisprudência do STF, havendo déficit de vagas, deverão ser determinados: (i) a saída antecipada de sentenciado no regime com falta de vagas; (ii) a liberdade eletronicamente monitorada ao sentenciado que sai antecipadamente ou é posto em prisão domiciliar por falta de vagas; (iii) o cumprimento de penas restritivas de direito e/ou estudo ao sentenciado que progride ao regime aberto. Até que sejam estruturadas as medidas alternativas propostas, poderá ser deferida a prisão domiciliar ao sentenciado."
    revisao: { status: revisado }
  - id: 28-q4-a
    categoria: discursiva
    parte: q4
    item: "A"
    pergunta: "Sendo os crimes conexos, que juízo é competente para julgar Talles?"
    tese: "Competência do juízo de Cardoso Moreira, local da infração mais grave (o roubo)"
    aceitos: [ [ "cardoso moreira", "mais grave" ], [ "infracao mais grave | crime mais grave | delito mais grave" ] ]
    artigos: [ "art. 78, II, a, CPP" ]
    gabarito: "Será competente para julgamento de Talles o juízo da Comarca de Cardoso Moreira, local onde teria sido praticado o crime de roubo. De acordo com as informações constantes do enunciado, três crimes de furto foram praticados em conexão com um crime de roubo, tendo em vista que o agente, em continuidade, subtraiu bens de estabelecimentos diversos para obter instrumentos para a prática do crime de roubo. A conexão probatória, então, é clara. Havendo conexão entre crimes que foram praticados em diferentes comarcas, sendo que todos os juízos seriam de mesma categoria, aplicam-se as previsões do Art. 78, inciso II, do Código de Processo Penal. Não há que se falar em competência da cidade de São Fidélis, pois nenhum dos crimes foi consumado do local, somente lá ocorrendo a prisão em flagrante. Restariam as cidades de Bom Jesus de Itabapoana e Cardoso Moreira. De acordo com o Art. 78, inciso II, alínea a, do CPP, o primeiro critério a ser observado é o local onde foi praticado o crime à qual for cominada a pena mais grave. O crime mais grave imputado é o de roubo majorado, logo competente a Comarca de Cardoso Moreira. O critério do número de crimes praticados somente seria relevante se a todos os delitos fosse prevista a mesma pena."
    revisao: { status: revisado }
  - id: 28-q4-b
    categoria: discursiva
    parte: q4
    item: "B"
    pergunta: "Que argumento de direito material contesta a capitulação do roubo?"
    tese: "Afastamento da majorante da restrição da liberdade: a vítima ficou presa só pelo tempo necessário à subtração"
    aceitos: [ [ "afast* | nao incid* | exclu* | decote", "majorante | causa de aumento | restricao" ], [ "tempo necessario | tempo relevante | tempo juridicamente relevante | tempo significativo | normal do tipo" ] ]
    artigos: [ "art. 157, § 2º, V, CP" ]
    gabarito: "O argumento de direito material é o de que não haveria que se falar em crime de roubo majorado pela restrição da liberdade da vítima, tendo em vista que a restrição em questão foi a normal do tipo para subtração dos bens, não se estendendo por tempo significativo relevante, para além daquele necessário para a subtração, conforme exige a doutrina e a jurisprudência."
    revisao: { status: revisado }
