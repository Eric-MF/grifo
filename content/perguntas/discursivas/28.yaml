  - id: 28-q2-b
    categoria: discursiva
    parte: q2
    item: B
    caso: |-
      Após regular processamento em que figurava na condição de réu solto, Hugo foi condenado pela prática de crime de apropriação indébita majorada ao cumprimento da pena de 01 ano e 06 meses de reclusão e 14 dias-multa, sendo reconhecida a agravante da reincidência, tendo em vista que foi juntada aos autos Folha de Antecedentes Criminais a demonstrar trânsito em julgado, no ano anterior ao da prática da apropriação indébita, de condenação pelo crime de lesão corporal dolosa, praticada no contexto de violência doméstica e familiar contra a mulher.

      No momento da sentença, considerando a reincidência, o magistrado aplicou o regime inicial fechado de cumprimento da pena. Destacou, ainda, que, apesar de Hugo estar trabalhando e cuidando de filhos menores, não poderia substituir a pena privativa de liberdade por restritiva de direitos por expressa vedação legal no caso de reincidência dolosa.

      Intimado da sentença, Hugo procura seu advogado para a adoção das medidas cabíveis.

      Considerando apenas o narrado, na condição de advogado(a) de Hugo, responda aos questionamentos a seguir.
    comando: É possível, em sede de recurso, buscar a substituição da pena privativa de liberdade por restritiva de direitos? Justifique.
    gabarito: |-
      Sim, é possível ao advogado buscar a substituição da pena privativa de liberdade por restritiva de direitos. De fato, como destacado pelo magistrado, a princípio, o Art. 44, inciso II, do Código Penal, veda a substituição da pena privativa de liberdade por restritiva de direitos na hipótese de o réu ser reincidente na prática de crimes dolosos. Não há dúvida que Hugo era reincidente, já que possuía condenação pela prática de crime doloso anterior, com trânsito em julgado, sendo o crime de apropriação indébita praticado posteriormente.

      Todavia, o próprio Art. 44, § 3º, do Código Penal, admite a substituição, mesmo diante de reincidência, desde que essa não seja específica e a medida seja socialmente recomendável. Na situação apresentada, Hugo não é reincidente específico sequer na prática de crimes contra o patrimônio, já que a condenação anterior refere-se ao crime de lesão corporal dolosa. Ademais, com base nas informações expostas, a medida seria socialmente recomendável, tendo em vista que Hugo estava trabalhando e cuidava de filhos menores de idade. O crime não envolveria violência ou grave ameaça à pessoa. Assim, excepcionalmente, possível a substituição da pena privativa de liberdade por restritiva de direitos.
    opcoes:
      correta: É possível a substituição da pena privativa de liberdade por restritiva de direitos, tendo em vista que a reincidência não é específica e a medida é socialmente recomendável, nos termos do Art. 44, § 3º, do CP.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
  - id: 28-q3-a
    categoria: discursiva
    parte: q3
    item: A
    caso: |-
      Leal cumpre pena em regime semiaberto após condenação definitiva pela prática de crime de lesão corporal seguida de morte, ocasião em que foi aplicada pena de 06 anos de reclusão. Após permanecer 11 meses da pena penitenciário, em “serviço extramuros”, por 120 dias, pretende a obtenção de progressão para o regime aberto.

      Diante disso, em visita realizada pela defesa técnica, demonstra sua intenção para o advogado, informando que não sofreu qualquer punição administrativa no período, mas demonstrou preocupação com o fato de que soube, por meio de outros detentos, que não haveria vagas disponíveis em estabelecimentos de regime aberto no Estado.

      Sob o ponto de vista técnico, de acordo com a jurisprudência pacificada dos Tribunais Superiores, na condição de advogado(a) de Leal, esclareça os itens a seguir.
    comando: Leal preencheu os requisitos objetivos para a progressão para o regime aberto? Justifique.
    gabarito: |-
      Sim, os requisitos legais estão preenchidos. De acordo com o Art. 112 da Lei nº 7.210/84, o requisito objetivo para progressão de regime é o cumprimento de 1/6 da pena aplicada, que, no caso, significaria 01 ano de pena privativa de liberdade. Segundo consta do enunciado, Leal ficou 11 meses preso em cumprimento da pena, o que, a princípio, não atenderia ao requisito objetivo. Todavia, há período de pena remida que justifica a progressão de regime. Leal trabalhou por 120 dias, o que gera uma remição de 40 dias de acordo com o Art. 126 da LEP, devendo ser esclarecido que o “trabalho extramuros” justifica a remição de pena, nos termos da Súmula 562 do STJ. Ademais, o tempo remido será computado como pena cumprida para todos os efeitos (Art. 128 da LEP).

      Dessa forma, cumprido mais de 01 ano da pena aplicada, possível a progressão de regime.
    opcoes:
      correta: Sim, tendo em vista que foi cumprido mais de 1/6 da pena aplicada OU mais de 01 ano da pena imposta, nos termos do Art. 112 OU do Art. 126, ambos da LEP OU da Súmula 562 do STJ, considerando como pena cumprida o tempo remido em razão do trabalho extramuros.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
        - O fundamento a ser apresentado é o de que o valor do dia-multa deverá considerar a capacidade econômica do acusado e, no caso, Lucas se mostrou pessoa humilde, de modo que incompatível com sua situação econômica o valor do dia-multa aplicado, na forma do art. 60 do CP.
        - A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo, por aplicação analógica do Art. 77, § 1º, do CP, devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF.
    revisao: *a1
  - id: 28-q3-b
    categoria: discursiva
    parte: q3
    item: B
    caso: |-
      Leal cumpre pena em regime semiaberto após condenação definitiva pela prática de crime de lesão corporal seguida de morte, ocasião em que foi aplicada pena de 06 anos de reclusão. Após permanecer 11 meses da pena penitenciário, em “serviço extramuros”, por 120 dias, pretende a obtenção de progressão para o regime aberto.

      Diante disso, em visita realizada pela defesa técnica, demonstra sua intenção para o advogado, informando que não sofreu qualquer punição administrativa no período, mas demonstrou preocupação com o fato de que soube, por meio de outros detentos, que não haveria vagas disponíveis em estabelecimentos de regime aberto no Estado.

      Sob o ponto de vista técnico, de acordo com a jurisprudência pacificada dos Tribunais Superiores, na condição de advogado(a) de Leal, esclareça os itens a seguir.
    comando: A inexistência de vagas no regime pretendido pelo apenado pode ser considerada fundamento idôneo para a não concessão do benefício por ocasião do preenchimento dos requisitos objetivos e subjetivos para progressão? Justifique.
    gabarito: "A inexistência de vagas em regime compatível não é fundamento idôneo para manutenção do apenado em regime mais severo, nos termos da Súmula Vinculante 56 do STF. Preenchidos os requisitos legais, o apenado possui direito à progressão para regime compatível ao cumprimento de sua pena, não podendo a deficiência do estado lhe prejudicar. De acordo com a jurisprudência do STF, havendo déficit de vagas, deverão ser determinados: (i) a saída antecipada de sentenciado no regime com falta de vagas; (ii) a liberdade eletronicamente monitorada ao sentenciado que sai antecipadamente ou é posto em prisão domiciliar por falta de vagas; (iii) o cumprimento de penas restritivas de direito e/ou estudo ao sentenciado que progride ao regime aberto. Até que sejam estruturadas as medidas alternativas propostas, poderá ser deferida a prisão domiciliar ao sentenciado."
    opcoes:
      correta: Não pode o apenado permanecer em regime mais gravoso em razão da falta de estabelecimento penal adequado, devendo ser colocado em liberdade ou regime mais favorável, nos termos da Súmula Vinculante 56/STF.
      erradas:
        - "Habeas corpus: não há recurso contra a decisão que não absolveu sumariamente."
        - "Sim, pois Augusto César agiu com dolo, sendo autor do crime previsto no art. 6º da Lei 7.492/86 (0,2). Obs.: A mera indicação de artigo não é pontuada."
        - "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado, na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP. Obs.: a mera citação do dispositivo legal não será pontuada."
