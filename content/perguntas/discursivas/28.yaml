      Considerando apenas as informações narradas, na condição de advogado(a) de Túlio, redija a peça jurídica cabível, diferente de habeas corpus, apresentando todas as teses jurídicas pertinentes. A peça deverá ser datada no último dia do prazo para interposição, considerando-se que todos os dias de segunda a sexta-feira são úteis em todo o país. (Valor: 5,00)

      Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples menção ou transcrição do dispositivo legal não confere pontuação.
    comando: Que pedido deve ser formulado na peça?
    gabarito: Conhecimento e provimento do recurso.
    opcoes:
      correta: Conhecimento e provimento do recurso.
      erradas:
        - "Pedido de reconsideração ao juiz de 1º grau e indicação da norma: art. 589, parágrafo único, CPP."
        - Pronúncia da ré nos exatos termos da denúncia OU pronúncia por homicídio triplamente qualificado OU pronúncia da ré por infanticídio
        - a) designação de audiência preliminar ou de conciliação b) a citação da querelada; c) recebimento da queixa d) a oitiva das testemunhas arroladas; e) a condenação da querelada pelo crime de injúria (Art. 140 do CP) e pelo crime de difamação (Art. 139 do CP) com a causa de aumento de pena (Art. 141, III do CP) em concurso formal de delitos (Art. 70 do CP) f) a fixação de valor mínimo de indenização, nos termos do Art. 387, IV, do CPP. OBS:. A mera indicação de dispositivo legal não pontua.
        - Afastamento da agravante do Art. 61, II, ´f´, do CP.
        - Subsidiariamente, o acolhimento das teses defensivas de aplicação da pena.
