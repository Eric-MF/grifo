# Catálogo das peças processuais penais.
# Usado para: (1) detectar peça inadequada no simulador; (2) aceitar sinônimos no quiz; (3) o fundamento padrão de cada peça, mostrado na correção do quiz quando o aluno escolhe ou digita outra peça.
# Aliases são comparados com o texto normalizado (minúsculo, sem acento).
# siglas: siglas e nomes curtos (minúsculo, sem pontos) aceitos só no campo "Peça" do quiz. Não entram no texto inteiro do simulador, onde dariam falso positivo ("MS" em "Campo Grande/MS"; "ré" vira "re").
# As siglas incluem abreviações pelas iniciais do nome (ex.: crese = contrarrazões de recurso em sentido estrito).

resposta-acusacao:
  nome: Resposta à Acusação
  aliases: [resposta a acusacao, resposta escrita a acusacao, defesa previa, resposta escrita, defesa escrita]
  siglas: [ra]
  fundamento: [art. 396-A CPP]
