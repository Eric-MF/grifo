# Diplomas legais reconhecidos pelo corretor e pelo quiz.
# A chave é o identificador canônico. Os aliases são comparados com o texto já
# normalizado (minúsculo, sem acentos, números sem ponto de milhar e ano abreviado
# removido — "Lei nº 11.343/06" vira "lei 11343").
# Para uma lei não listada, "lei 1234" já funciona sozinho; inclua aqui apenas
# para aceitar apelidos ("lei de drogas") ou dar nome bonito.

diplomas:
  cp:
    nome: Código Penal
    aliases: [cp, codigo penal, decreto-lei 2848, decreto lei 2848, dl 2848, cpb]
  cpp:
    nome: Código de Processo Penal
    aliases: [cpp, codigo de processo penal, decreto-lei 3689, decreto lei 3689, dl 3689]
