# Grifos prontos: marcações que já vêm feitas no leitor de leis, uma camada por sistema de cores.
# `rotulo` é o significado da cor no sistema (src/lib/leis/legendas.ts).
# Dois níveis, como quem grifa um vade-mécum:
#   artigos / dispositivos            a área do tema: só uma barra de cor na margem
#   destaques / destaquesDispositivos  o que mais cai: grifado com marca-texto
# Destaque = citado em pelo menos 5 questões de Penal (objetivas, discursivas e peças da amostra).
# Faixas: "69-91, 109". Dispositivos: "art387.p1" = art. 387, § 1º; "art5.i57" = art. 5º, LVII.
# O usuário pode desligar os grifos prontos nas configurações de leitura.

