# Nomes das mitologias grega e romana que substituem os nomes das pessoas nas questões do treino e dos jogos.
# Cada questão sorteia nomes diferentes a cada vez que aparece, sempre do mesmo gênero da pessoa da prova (o texto
# concorda em gênero com ela: "a ré", "o acusado"). Os casos gerados (Peça e fundamento) também usam esta lista.
#
# Lista provisória: troque pelos nomes que quiser. Regras (o build confere):
#   - nenhum nome repetido, nem o mesmo nome nas duas listas;
#   - pelo menos 12 nomes em cada lista (uma questão tem, no máximo, umas 10 pessoas de cada gênero);
#   - evite nomes que são palavras comuns ("Aurora", "Fortuna", "Eco"), para o texto não ficar ambíguo, e nomes de
#     pessoas das provas (content/nomes-pessoas.yaml), para a troca nunca devolver o nome original.
