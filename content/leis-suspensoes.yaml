      relator: Luiz Fux
      acoes: "ADI 6305"
      efeito: "suspensão sine die da alteração do procedimento de arquivamento"
  revisao: rascunho
  nota: "Estado atual não verificado: conferir se o mérito de 2023 alcançou este dispositivo."

