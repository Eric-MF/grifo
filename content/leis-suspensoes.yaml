# Suspensões e declarações de inconstitucionalidade do STF que afetam o texto das leis do leitor.
# Não entram na linha do tempo (que usa datas de publicação e vigência). Cada entrada é conferida
# à mão: `revisao: rascunho` até ser checada no acórdão, no site do STF.
# Fontes consultadas em outubro de 2026: notícias do STF e do MP-MS, resumos jurídicos; o PDF oficial da
# decisão (stf.jus.br) não pôde ser aberto (HTTP 403).

pacote-anticrime-juiz-das-garantias:
  diploma: cpp
  dispositivos: "arts. 3º-A a 3º-F (juiz das garantias), no que foi impugnado"
  decisoes:
    - data: 2020-01-22
      tipo: liminar
      relator: Luiz Fux
      acoes: "ADI 6298, 6299, 6300 e 6305"
      efeito: "suspensão sine die de trechos dos arts. 3º-A, 3º-B (em parte) e 3º-D, parágrafo único, segundo fonte secundária"
    - data: 2023-08-24
      tipo: mérito
      acoes: "ADI 6298, 6299, 6300 e 6305"
      efeito: "instituto declarado constitucional; inconstitucionais o art. 3º-C, §§ 3º e 4º, e o art. 3º-D, parágrafo único; prazo de 12 meses, prorrogável por 12, para a implantação, contado da publicação do acórdão"
  revisao: rascunho
  nota: "A liminar de 2020 foi reportada por fontes secundárias com alguns dispositivos diferentes (ADI 6305 e Toffoli em 15/01/2020). Conferir o acórdão e se a suspensão de 2020 ainda vigora."

cpp-art-157-par5:
  diploma: cpp
  dispositivos: "art. 157, § 5º (juiz que conheceu da prova inadmissível não sentencia)"
  decisoes:
    - data: 2020-01-22
      tipo: liminar
      relator: Luiz Fux
      acoes: "ADI 6299"
      efeito: "suspensão sine die do § 5º"
    - data: 2023-08-24
      tipo: mérito
      acoes: "ADI 6298, 6299, 6300 e 6305"
      efeito: "inconstitucionalidade do § 5º, por maioria (resumo do julgamento; conferir o voto)"
  revisao: rascunho

cpp-art-28-caput:
  diploma: cpp
  dispositivos: "art. 28, caput (arquivamento do inquérito policial pelo juiz, na nova redação)"
  decisoes:
    - data: 2020-01-22
