# Histórico das peças da 2ª fase de Penal para as estatísticas (/estatisticas/).
# exames_antigos: os exames da OAB/SP anteriores ao I Exame Unificado (sem prova no site), do levantamento do Grifo.
#   numero = a numeração da OAB/SP; banca = vunesp (até o 128º), vunesp-cespe (129º a 137º, provas só de SP) ou
#   cespe (138º a 140º: os Exames Unificados 2009.1 a 2009.3, a mesma prova das outras seccionais).
#   pecas = chaves de content/pecas.yaml ou de pecas_extras, na ordem do levantamento (repetida quando caiu duas vezes).
#   ano = o ano da 2ª fase. Do 110º ao 124º, "estimado: true": o ano sai da sequência de três exames por ano (o
#   terceiro do ano com a 2ª fase em fevereiro do ano seguinte), que todas as datas confirmadas do 125º ao 140º seguem.
#   data = a 2ª fase, como as notícias da época a deram (ConJur, Migalhas, OAB/RS; algumas foram dadas antes da prova,
#   como a data marcada). O 140º (2009.3) teve a 2ª fase de 28/2/2010 anulada e refeita em 18/4/2010.
#   O 141º de SP (2010.1) é o I Exame Unificado: ele está no site (content/exames/01) e não entra aqui.
# linha_do_tempo: os marcos da unificação, na aba "Linha do tempo".

pecas_extras:
  progressao-regime:
    nome: Pedido de Progressão de Regime
    grupo: execucao
    fundamento: [art. 112 LEP]
    prazo: não tem prazo
    cabimento: "Para o condenado passar a um regime mais brando, cumpridos o tempo e o bom comportamento exigidos (art. 112 da LEP)."
  sequestro-bens:
    nome: Requerimento de Sequestro de Bens
    grupo: acusacao
    fundamento: [art. 125 CPP]
    cabimento: "Medida assecuratória sobre os bens comprados com o proveito do crime (arts. 125 a 127 do CPP)."

