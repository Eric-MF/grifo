# Os marcos da unificação. "era" dá a cor; "de" e "ate" (AAAA ou AAAA-MM) põem o marco no eixo do tempo;
# "exame" (id do site) vira o link do marco.
linha_do_tempo:
  - quando: Até 2006
    de: "2000"
    ate: "2006"
    rotulo: Bancas estaduais
    era: vunesp
    titulo: Cada seccional, a sua prova
    texto: "Cada seccional da OAB aplicava o próprio Exame de Ordem. Em São Paulo, a VUNESP organizava as provas, numeradas em sequência (110º, 111º…), com alto grau de dificuldade e particularidades regionais."
  - quando: 2007 a 2009
    de: "2007"
    ate: "2009-04"
    rotulo: Começo da unificação
    era: vunesp-cespe
    titulo: As adesões ao CESPE
    texto: "O CESPE/UnB passa a aplicar uma prova comum às seccionais que aderem ao projeto de unificação. São Paulo ainda faz a sua própria prova, que o CESPE também passa a organizar. Em 2009, o Provimento 136 do Conselho Federal da OAB fixa as regras do Exame de Ordem Unificado, para todo o país."
  - quando: Mai. e jun. de 2009
    de: "2009-05"
    ate: "2009-06"
    rotulo: SP na prova única
    era: cespe
    titulo: São Paulo entra no Exame Unificado
    texto: "O 138º Exame de São Paulo é o Exame Unificado 2009.1, do CESPE: pela primeira vez, a OAB/SP aplica a mesma prova das outras seccionais (1ª fase em 17/5/2009 e 2ª fase em 28/6/2009). O 137º, com a 2ª fase em 15/2/2009, foi a última prova só de São Paulo."
    destaque: "Peça: Recurso em Sentido Estrito"
  - quando: Fev. a abr. de 2010
    de: "2010-02"
    ate: "2010-04"
    rotulo: Prova anulada
    era: cespe
    titulo: A prova de Penal que fez o país refazer a 2ª fase
    texto: "A 2ª fase do Exame 2009.3 (o 140º de São Paulo) foi aplicada em 28/2/2010. Uma fraude na prova de Direito Penal, descoberta em Osasco (SP) e investigada pela Polícia Federal, levou a OAB a anular a 2ª fase em todo o país. Os cerca de 18,5 mil candidatos refizeram as provas em 18/4/2010, sem custo."
  - quando: Jul. de 2010
    de: "2010-07"
    rotulo: I Exame Unificado
    era: cespe
    titulo: O CESPE em todo o país
    texto: "Em 25/7/2010, o CESPE aplica a 2ª fase do Exame 2010.1 em todo o Brasil, a mesma prova para todas as seccionais: é o I Exame de Ordem Unificado (o 141º de São Paulo). A banca não publicou a distribuição dos pontos."
    exame: "01"
    destaque: "Peça: Memoriais"
  - quando: "2010.2"
    de: "2010-11"
    rotulo: Era FGV
    era: fgv
    titulo: A FGV assume
    texto: "A Fundação Getulio Vargas aplica o II Exame Unificado (2010.2), com a 2ª fase em novembro de 2010, e segue como banca até hoje. Ela passa a publicar o padrão de resposta com a pontuação de cada item, a tabela que o simulado do Grifo usa para corrigir."
    exame: "02"
    destaque: "Peça: Resposta à Acusação"
  - quando: "2011"
    de: "2011-08"
    rotulo: Formato atual
    era: fgv
    titulo: Quatro questões de 1,25
    texto: "Do I ao III Exame, a prova trazia a peça (5,00) e cinco questões de 1,00. Do IV Exame em diante, são a peça e quatro questões de 1,25."
    exame: "04"
  - quando: 2016 e 2018
    de: "2016-10"
    ate: "2018-06"
    rotulo: Reaplicações
    era: fgv
    titulo: Provas refeitas em Porto Velho e Porto Alegre
    texto: "A 2ª fase do XX Exame teve uma reaplicação em Porto Velho (9/10/2016), e a do XXV, em Porto Alegre (24/6/2018), com provas diferentes da nacional. No XXV, a peça mudou: Resposta à Acusação na prova nacional e Apelação em Porto Alegre."
    exame: 25-porto-alegre
  - quando: "2020"
    de: "2020-03"
    ate: "2020-12"
    rotulo: Pandemia
    era: fgv
    titulo: O XXXI Exame adiado
    texto: "A 2ª fase do XXXI Exame, adiada pela pandemia de covid-19, só foi aplicada em 6/12/2020, um ano depois da 2ª fase do XXX (1/12/2019)."
    exame: "31"
