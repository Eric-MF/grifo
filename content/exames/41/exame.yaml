        descricao: Não, diante do princípio da intranscendência da pena ou o da responsabilidade pessoal ou personalidade ou intransmissibilidade da pena (0,20), a morte do condenado extingue a punibilidade (0,35), na forma do Art. 107, inciso I, do CP, ou do Art. 5º, inciso XLV, da CRFB/88 ou Artigo 5, item 3, da Convenção Americana sobre Direitos Humanos o Pacto de San José da Costa Rica (aprovada pelo Decreto 678/92) (0,10).
