        descricao: O descabimento de recurso ordinário constitucional em face de decisão concessiva de habeas corpus (0,50), na forma do Art. 105, inciso II, alínea a, da CRFB/88 ou Art. 30, da Lei nº 8.038/90 (0,10).
        valores: [ 0, 0.5, 0.6 ]
