  - n: 2
    enunciado: |-
      Em cumprimento de mandado de busca e apreensão, o oficial de justiça Jorge compareceu ao local de trabalho de Lucas, sendo encontradas, no interior do imóvel, duas armas de fogo de calibre .38, calibre esse considerado de uso permitido, devidamente municiadas, ambas com numeração suprimida. Em razão disso, Lucas foi preso em flagrante e denunciado pela prática de dois crimes previstos no Art. 16, caput, da Lei 10.826/2003, em concurso material, sendo narrado que “Lucas, de forma livre e consciente, guardava, em seu local de trabalho, duas armas de fogo de calibre restrito, devidamente municiadas”.

      Após a instrução, em que os fatos foram confirmados, foi juntado o laudo confirmando o calibre .38 das armas de fogo, a capacidade de efetuar disparos, bem como que ambas tinham a numeração suprimida. As partes apresentaram alegações finais, e o magistrado, em sentença, considerando o teor do laudo, condenou Lucas pela prática de dois crimes previstos no Art. 16, parágrafo único, inciso IV, da Lei nº 10.826/2003, em concurso formal.

      Intimada a defesa técnica da sentença condenatória, responda, na condição de advogado(a) de Lucas, aos itens a seguir.

      **A) Qual o argumento de direito processual a ser apresentado em busca da desconstituição da sentença condenatória? Justifique. (Valor: 0,65)**

      **B) Reconhecida a validade da sentença em segundo grau, qual o argumento de direito material a ser apresentado para questionar o mérito da sentença condenatória e, consequentemente, a pena aplicada? Justifique. (Valor: 0,60)**

      *Obs.: o(a) examinando(a) deve fundamentar as respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A)O argumento de direito processual a ser apresentado é o de que houve violação ao princípio da correlação, o que gera a nulidade da sentença por violação ao princípio da ampla defesa e ao princípio do contraditório. Isso porque a denúncia narrou que Lucas guardava, em seu local de trabalho, duas armas de fogo de calibre restrito.

      Sem que houvesse aditamento da denúncia, o magistrado condenou o réu pela prática de dois crimes de posse de arma de fogo de numeração suprimida, previsto no Art. 16, parágrafo único, inciso IV, da Lei 10.826/03. Apesar do crime imputado na denúncia e o reconhecido na sentença estarem previsto no mesmo dispositivo legal, eles não se confundem e a narrativa dos fatos é diferente. O réu somente se defendeu sobre as armas apreendidas como sendo de uso restrito, não podendo, então, o magistrado modificar os fatos para dar nova capitulação jurídica, nos termos do Art. 384 do CPP. Se não houvesse alteração dos fatos, poderia o juiz aplicar o Art. 383 do CPP, mas não foi isso que ocorreu na hipótese narrada. Dessa forma, deve ser reconhecida a nulidade da sentença.

      B)Em busca de questionar o mérito da decisão, o advogado deveria argumentar que a conduta de Lucas de guardar, em seu local de trabalho, duas armas de fogo com numeração suprimida configura crime único previsto no Art. 16, parágrafo único, inciso IV, da Lei 10.826/03 e não dois crimes autônomos, seja em concurso material ou formal. As armas estavam sendo guardadas em um mesmo contexto, logo a violação ao bem jurídico protegido foi única, podendo, porém, a quantidade de armas ser considerada no momento da aplicação da pena.
    itens:
      - n: A
        descricao: Houve violação ao princípio da correlação OU não houve aditamento dos fatos narrados na denúncia, não podendo o magistrado alterá-los (0,40), nos termos do Art. 384 do CPP (0,10), o que representa violação ao princípio da ampla defesa OU contraditório (0,15)
        valores: [ 0, 0.15, 0.25, 0.4, 0.5, 0.55, 0.65 ]
        componentes:
          - { id: c1, valor: 0.4, alternativas: [ [ correlacao | congruencia ], [ aditamento ] ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 384, CPP" ], requer: c1 }
          - { id: c3, valor: 0.15, alternativas: [ [ ampla defesa ], [ contraditorio ] ] }
      - n: B
        descricao: Houve crime único OU Não houve qualquer espécie de concurso de delitos (0,50), tendo em vista que as armas de fogo foram apreendidas em um mesmo contexto (0,10)
        valores: [ 0, 0.1, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.5, alternativas: [ [ crime unico | delito unico ], [ nao houve, concurso ] ] }
          - { id: c2, valor: 0.1, termos: [ mesmo contexto ] }
  - n: 3
    enunciado: |-
      No interior de um coletivo, Alberto, João, Francisco e Ronaldo, até então desconhecidos, começaram a conversar sobre a crise financeira que assombra o país e sobre as dificuldades financeiras que estavam passando.

      Em determinado momento da conversa, Alberto informa que tinha um conhecido seu, Lucas, com intenção de importar uma arma de fogo de significativo potencial ofensivo, que seria um fuzil de venda proibida no Brasil, mas que ele precisava da ajuda de outras pessoas para conseguir a importação. Diante da oferta em dinheiro pelo serviço específico, todos concordaram em participar do plano criminoso, sendo que Alberto iria ao exterior adquirir a arma, João alugaria um barco para trazer o material, Francisco auxiliaria junto à imigração brasileira para que a conduta não fosse descoberta e Ronaldo entregaria o material para Lucas, que era o mentor do plano.

      Após toda a organização do grupo e divisão de tarefas, assustado com as informações veiculadas na mídia sobre as punições de crime de organização criminosa, Francisco comparece ao Ministério Público com seu advogado e indica a intenção de realizar delação premiada.

      Participaram das negociações do acordo Francisco, sua defesa técnica, o membro do Ministério Público com atribuição e o juiz que seria competente para julgamento, sendo acordada a redução de 1/3 da pena em relação ao crime de organização criminosa.

      Após ser denunciado junto com Alberto, João, Ronaldo e Lucas pela prática do crime de organização criminosa (Art. 2º, da Lei nº 12.850/2013), Francisco contrata você, como novo(a) advogado(a), para patrocinar seus interesses.

      Na condição de advogado(a) de Francisco, com base apenas nas informações narradas, esclareça os itens a seguir.

      **A) Considerando que aquela delação premiada não seria benéfica ao seu cliente, existe argumento a ser apresentado em busca de desconstituir o acordo celebrado quanto ao seu aspecto formal? Justifique. (Valor:**

      0,65)

      **B) Qual argumento de direito material deve ser apresentado para questionar a capitulação jurídica realizada pelo Ministério Público na denúncia? Justifique. (Valor: 0,60)**

      *Obs.: o(a) examinando(a) deve fundamentar as respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A. A delação foi realizada de maneira inadequada sob o aspecto formal, podendo o novo advogado de Francisco buscar desconstituí-la. De acordo com o Art. 4º, § 6º, da Lei nº 12.850/2013, o juiz não participará do acordo de delação premiada. Em que pese o magistrado sempre deva assegurar o respeito ao direito dos envolvidos e a paridade de armas, fato é que nas negociações do acordo de colaboração o juiz deve se manter inerte, cabendo apenas a ele homologar o acordo caso tenham sido observadas as formalidades legais. No momento em que o magistrado participou das negociações, a ilegalidade do acordo restou configurada, podendo ser o mesmo desconstituído.

      B. O argumento de direito material em busca de questionar a capitulação jurídica e, consequentemente, da absolvição, é o de que apesar de o crime envolver 05 agentes e haver plena divisão de tarefas, a reunião e comunhão de esforços era voltada para a prática de um crime específico e não de vários delitos, não havendo estabilidade e permanência a justificar a imputação do crime do Art. 2º da Lei nº 12.850/2013. Para a configuração do crime imputado, não basta a reunião com a intenção de praticar um crime específico, como consta do enunciado. Ainda que apenas um delito tenha sido praticado, a intenção do grupo deve ser a prática de CRIMES (no plural) e não uma infração penal em comunhão de ações e desígnios. A mera alegação em abstrato de que os requisitos do Art. 2º da Lei nº 12.850/2013 não foram preenchidos, sem enfrentar especificamente a pluralidade de crimes ou a exigência de estabilidade/permanência, não será considerada suficiente para a atribuição de pontos.
    itens:
      - n: A
        descricao: Sim, poderia ser buscada a desconstituição do acordo de colaboração premiada, pois não poderia o magistrado ter participado das negociações do acordo (0,55), conforme o Art. 4º, § 6º, da Lei nº 12.850/13 (0,10).
        valores: [ 0, 0.55, 0.65 ]
        componentes:
          - { id: c1, valor: 0.55, termos: [ colaboracao premiada | delacao, magistrado | juiz, negocia* | particip* ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 4, § 6º, Lei 12850" ], requer: c1 }
      - n: B
        descricao: Não restou configurado o crime imputado, tendo em vista que o grupo tinha intenção de praticar apenas um crime específico e não várias infrações penais OU tendo em vista que não havia relação de estabilidade e permanência (0,60).
        valores: [ 0, 0.6 ]
        componentes:
          - { id: c1, valor: 0.6, alternativas: [ [ crime especifico | um crime | unico crime | um so crime ], [ estabilidade | permanencia ] ] }
  - n: 4
    enunciado: |-
      Revoltada com o fato de que sua melhor amiga Clara estaria se relacionando com seu ex-companheiro João, Maria a procurou e iniciou uma discussão.

      Durante a discussão, Clara, policial militar, afirmou que, se Maria a xingasse novamente, ela a mataria gastando apenas uma munição da sua arma. Persistindo na discussão, Maria voltou a ofender Clara. Esta, então, abriu sua bolsa e pegou um bem de cor preta. Acreditando que Clara cumpriria sua ameaça, Maria desferiu um golpe na cabeça da rival, utilizando um pedaço de pau que estava no chão. A perícia constatou que o golpe foi a causa eficiente da morte de Clara. Posteriormente, também foi constatado que Clara, de fato, estava com sua arma de fogo na bolsa, mas que ela apenas pegara seu telefone celular para ligar para João.

      Após denúncia pela prática do crime de homicídio qualificado e encerrada a instrução da primeira fase do procedimento do Tribunal do Júri, entendeu o magistrado por pronunciar Maria nos termos da inicial acusatória.

      **Com base nas informações expostas, responda, na condição de advogado(a) de Maria, aos itens a seguir.**

      **A) Qual o recurso cabível da decisão proferida pelo magistrado? Caso tivesse ocorrido a impronúncia, o recurso pela parte interessada seria o mesmo? Justifique. (Valor: 0,65)**

      **B) Qual a tese de direito material a ser apresentada em sede de recurso para combater a decisão de submeter a ré ao julgamento pelo Tribunal do Júri? Justifique. (Valor: 0,60)**

      *Obs.: o(a) examinando(a) deve fundamentar as respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) A questão narra que Maria foi pronunciada pela suposta prática de crime de homicídio qualificado, sendo que, ao final da primeira fase do procedimento do Tribunal do Júri, entendeu o magistrado por pronunciar Maria nos termos da denúncia. Da decisão de pronúncia caberá recurso em sentido estrito, nos termos do Art. 581, inciso IV, do CPP. Caso a decisão proferida pelo magistrado fosse de impronúncia, não haveria que se falar em recurso em sentido estrito. Antes da edição da 11.689/08, a decisão de impronúncia também era combatida através de recurso em sentido estrito. Todavia, houve alteração legislativa e, desde então, da decisão de impronúncia, por ser terminativa, caberá recurso de apelação, assim como ocorreria na absolvição sumária, conforme previsão do Art. 416 do CPP.

      B) A tese de direito material seria que Maria agiu em legítima defesa putativa, nos termos do Art. 20, §1º do Código Penal (erro de tipo permissivo), tendo em vista que acreditava estar atuando em legítima defesa. Isso porque Clara havia ameaçado Maria de morte caso essa realizasse um xingamento, o que foi feito por Maria.

      Ainda que diante de eventual injúria, se verídica, a conduta de Clara de efetuar disparo de arma de fogo configuraria uma injusta agressão, pois, no mínimo, haveria excesso em sua conduta. Caso, de fato, Clara tivesse pego, em sua bolsa, sua arma de fogo, configurada estaria a legítima defesa e, consequentemente, a conduta de Maria seria legítima. Todavia, na verdade Maria supôs situação que não existia, já que Clara apenas pegou seu celular para realizar uma ligação. Diante disso, a atuação em legítima defesa foi apenas putativa.
    itens:
      - n: A1
        descricao: O recurso cabível da decisão de pronúncia é o recurso em sentido estrito (0,30), conforme Art. 581, inciso IV, do CPP (0,10).
        valores: [ 0, 0.3, 0.4 ]
