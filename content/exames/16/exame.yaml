  - n: 4
    enunciado: |-
      Wesley, estudante, foi preso em flagrante no dia 03 de março de 2015 porque conduzia um veículo automotor que sabia ser produto de crime pretérito registrado em Delegacia da área em que residia. Na data dos fatos, Wesley tinha 20 anos, era primário, mas existia um processo criminal em curso em seu desfavor, pela suposta prática de um crime de furto qualificado. Diante dessa anotação em sua Folha de Antecedentes Criminais, a autoridade policial representou pela conversão da prisão em flagrante em preventiva, afirmando que existiria risco concreto para a ordem pública, pois o indiciado possuía outros envolvimentos com o aparato judicial. Você, como advogado(a) indicado por Wesley, é comunicado da ocorrência da prisão em flagrante, além de tomar conhecimento da representação formulada pelo Delegado. Da mesma forma, o comunicado de prisão já foi encaminhado para o Ministério Público e para o magistrado, sendo todas as legalidades da prisão em flagrante observadas.

      **Considerando as informações narradas, responda aos itens a seguir.**

      **A) Qual a medida processual, diferente de habeas corpus, a ser adotada pela defesa técnica de Wesley? (Valor:**

      0,50)

      **B) A representação da autoridade policial foi elaborada de modo adequado? (Valor: 0,75)**

      Responda justificadamente, empregando os argumentos jurídicos apropriados e a fundamentação legal pertinente ao caso.
    gabarito_comentado: |-
      A) Considerando que o enunciado narra que foi realizada validamente a prisão em flagrante de Wesley pela prática do crime de receptação simples, a medida processual a ser formulada é o pedido de liberdade provisória, evitando que seja decretada a prisão preventiva do indiciado.

      B) A representação da autoridade policial não foi elaborada de maneira adequada em relação à sua fundamentação, pois não estão preenchidos os requisitos do Art. 313 do Código de Processo Penal, sendo estes indispensáveis para a conversão da prisão em flagrante em preventiva. O crime praticado pelo indiciado não tem pena privativa de liberdade máxima superior a 04 anos. Ademais, não é o acusado reincidente na prática de crime doloso, devendo ser destacado que a existência de ação em curso não afasta a ausência de configuração do inciso II do Art. 313. Os requisitos do inciso III também não estão atendidos, sendo incabível a prisão preventiva, independentemente da fundamentação com os pressupostos do Art. 312 do CPP.
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: "Formulação de pedido de liberdade provisória (0,40), com fundamento no Art. 321 do CPP ou no Art. 310, III, do CPP (0,10). Obs.: a mera citação do dispositivo legal não será pontuada."
        valores: [ 0, 0.4, 0.5 ]
        componentes:
          - { id: c1, valor: 0.4, termos: [ liberdade provisoria ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 321, CPP", "art. 310, III, CPP" ], requer: c1 }
      - n: B
        secao: PONTUAÇÃO
        descricao: "A representação da autoridade policial não foi elaborada de maneira adequada em relação à sua fundamentação, pois não estão preenchidos os requisitos para a decretação da prisão preventiva (0,65), do Art. 313 do CPP (0,10). Obs.: a mera citação do dispositivo legal não será pontuada."
        valores: [ 0, 0.65, 0.75 ]
        componentes:
          - { id: c1, valor: 0.65, termos: [ requisitos, preventiva ] }
