questoes:
  - n: 1
    enunciado: |-
      Carlos foi condenado pelos crimes de tráfico de entorpecentes e posse de arma de fogo de uso permitido, em concurso material, sendo sua conduta tipificada da seguinte forma: Art. 33 da Lei nº 11.343/06 e Art. 12 da Lei nº 10.826/03, na forma do Art. 69 do Código Penal. A pena ficou estabelecida em 05 anos de reclusão em regime fechado para o crime de tráfico e 01 ano de detenção em regime semiaberto pelo crime de posse de arma de fogo. Apenas a defesa técnica apelou, requerendo a mudança do regime de pena aplicado para o crime do Art. 33 da Lei nº 11.343/06, tendo o feito transitado em julgado para a acusação. O recurso foi desprovido. Todavia, de ofício, sem reflexo no quantum, que permaneceu em 06 anos de pena privativa de liberdade, o Tribunal reclassificou o fato para o Art. 33 c/c o Art. 40, IV, da Lei nº 11343/06, afastando o crime autônomo da lei de armas e aplicando a causa de aumento respectiva.

      **Considerando as informações narradas na hipótese, responda aos itens a seguir.**

      **A) Poderia ser aplicado regime inicial de cumprimento da pena diverso do fechado para o crime de tráfico ilícito de entorpecentes, previsto no Art. 33, caput, da Lei nº 11.343/06? (Valor: 0,60)**

      **B) Poderia o Tribunal de Justiça em sede de recurso da defesa realizar a reclassificação adotada? (Valor: 0,65)**

      Responda justificadamente, empregando os argumentos jurídicos apropriados e a fundamentação legal pertinente ao caso.
    gabarito_comentado: |-
      A) A questão narra que Carlos foi condenado pela prática de um crime de tráfico de drogas e posse de arma de fogo de uso permitido. Em que pese o crime de tráfico ser equiparado a hediondo, hoje o entendimento que prevalece no âmbito do Supremo Tribunal Federal é no sentido de que é possível a aplicação de regime inicial de cumprimento de pena diverso do fechado, sendo a previsão do Art. 2º, §1º, da Lei nº 8.072/90 inconstitucional, pois violadora do princípio da individualização da pena. Assim, analisando as circunstâncias do caso concreto, nada impede que o magistrado fixe o regime semiaberto ao caso, até porque a pena base não se afastou do mínimo legal, o que indica que as circunstâncias do artigo 59 do CP são favoráveis.

      B) Ainda consta do enunciado que o Tribunal de Justiça, em julgamento exclusivo da defesa, optou por realizar uma reclassificação da conduta, aplicando a causa de aumento de pena do Art. 40, inciso IV, da Lei nº 11.343, em vez de manter a condenação pelo crime de posse de arma de fogo. Não poderia, porém, o Tribunal ter adotado essa conduta, pois ela é prejudicial ao réu. Como o recurso foi exclusivo da defesa, a reclassificação viola o princípio da vedação da reformatio in pejus. O prejuízo da nova classificação decorre de alguns fatores:

      para o cálculo de eventual prescrição, tendo em vista que a causa de aumento é considerada para fixação do prazo prescricional, enquanto que, havendo dois crimes, o prazo seria fixado de maneira separada para cada um; um dos crimes é punido com detenção, o que impede fixação do regime inicial fechado, deixando isso de ocorrer com a causa de aumento; na execução, a progressão de regime, no caso da causa de aumento, será calculada em 2/5 (ou 3/5, se reincidente) do total de 06 anos, enquanto que, se mantidas as condenações separadas, esse percentual somente seria aplicado sobre a pena de 05 anos, pois sobre 01 ano seria aplicado o percentual de 1/6, já que a posse de arma de fogo não é crime hediondo.
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: "Sim, pois o STF considerou inconstitucional a obrigatoriedade do início de cumprimento de pena em regime fechado para os crimes hediondos e assemelhados (0,35), prevista no Art. 2º, § 1º, da Lei nº 8.072/90 (0,10), por violar o Princípio da Individualização da Pena (0,15) Obs.: a mera citação do dispositivo legal não será pontuada."
        valores: [ 0, 0.15, 0.35, 0.45, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.35, termos: [ inconstitucional*, regime, fechado ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 2, § 1º, Lei 8.072" ], requer: c1 }
          - { id: c3, valor: 0.15, termos: [ individualizacao ] }
      - n: B
        secao: PONTUAÇÃO
        descricao: Não, pois viola o princípio da vedação da reformatio in pejus (0,35), tendo em vista que geraria prejuízo na aplicação do regime OU na prescrição OU na execução da pena (0,30)
        valores: [ 0, 0.3, 0.35, 0.65 ]
        componentes:
          - { id: c1, valor: 0.35, termos: [ reformatio in pejus ] }
          - { id: c2, valor: 0.3, alternativas: [ [ regime ], [ prescri* ], [ execu* ] ] }
  - n: 2
    enunciado: |-
      No dia 03/05/2008, Luan foi condenado à pena privativa de liberdade de 12 anos de reclusão pela prática dos crimes previstos nos artigos 213 e 214 do Código Penal, na forma do Art. 69 do mesmo diploma legal, pois, no dia 11/07/2007, por volta das 19h, constrangeu Carla, mediante grave ameaça, a com ele praticar conjunção carnal e ato libidinoso diverso. Ainda cumprindo pena em razão dessa sentença condenatória, Luan, conversando com outro preso, veio a saber que ele havia sido condenado por fatos extremamente semelhantes a uma pena de 07 anos de reclusão. Luan, então, pergunta o nome do advogado do colega de cela, que lhe fornece a informação.

      Luan entra em contato pelo telefone indicado e pergunta se algo pode ser feito para reduzir sua pena, apesar de sua decisão ter transitado em julgado.

      Diante dessa situação, responda aos itens a seguir.

      **A) Qual a tese de direito material que poderia ser suscitada pelo novo advogado em favor de Luan? (Valor: 0,65)**

      **B) A pretensão deverá ser manejada perante qual órgão? (Valor: 0,60)**

      Sua resposta deve ser fundamentada. A simples citação do dispositivo legal não será pontuada.
    gabarito_comentado: |-
      A) Luan foi condenado pela prática de crimes de estupro e atentado violento ao pudor em concurso material. O entendimento que prevalecia antes da edição da Lei nº 12.015 era a da impossibilidade de aplicação da continuidade delitiva entre essas duas infrações, pois não seriam crimes da mesma espécie. Ocorre que, com a inovação legislativa ocorrida no ano de 2009, a conduta antes prevista no Art. 214 do Código Penal passou a ser englobada pela figura típica do Art. 213 do CP. Apesar de não ter havido abolitio criminis, certo é que a lei é mais benéfica. Sendo assim, poderá retroagir para atingir situações anteriores e caberá a redução de pena de Luan.

      A jurisprudência amplamente majoritária entende que, de acordo com a nova redação, o Art. 213 do CP passou a prever um tipo misto alternativo. Assim, quando praticada conjunção carnal e outro ato libidinoso diverso em um mesmo contexto e contra a mesma vítima, haveria crime único. Outros, minoritariamente, entendem que o artigo traz um tipo misto cumulativo, de modo que ainda seria possível punir o agente que pratica conjunção carnal e outro ato libidinoso diverso por dois crimes. De qualquer forma, mesmo para essa segunda corrente, caberia a redução de pena de Luan, pois agora seria possível a aplicação da continuidade delitiva, já que os crimes são de mesma espécie.

      O examinando poderá adotar qualquer uma das duas correntes, desde que assegure a aplicação da nova lei mais benéfica para Luan.

      B) O órgão competente perante o qual deverá ser formulado o pedido de aplicação da lei mais benigna e, consequentemente, da redução da pena é o juízo da Vara de Execuções Penais, considerando que já ocorreu o trânsito em julgado da sentença condenatória, na forma da Súmula 611 do STF ou do Art. 66, inciso I, da LEP.
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: A tese adequada é a da aplicação da lei mais benéfica ao condenado, que importará na redução da sua pena, (0,30) tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto alternativo, portanto crime único OU tendo em vista que a alteração legislativa transformou o tipo penal do estupro em misto cumulativo, sujeito à aplicação da continuidade delitiva (0,25) o que permite sua aplicação para fatos praticados antes de sua entrada em vigor, ainda que a decisão seja definitiva (0,10).
        valores: [ 0, 0.25, 0.3, 0.35, 0.4, 0.55, 0.65 ]
        componentes:
          - { id: c1, valor: 0.3, termos: [ lei mais benefica | retroativ* | lex mitior | novatio legis in mellius | mais favoravel ] }
          - { id: c2, valor: 0.25, alternativas: [ [ misto alternativo, crime unico ], [ misto cumulativo, continuidade ], [ crime unico ], [ continuidade delitiva ] ] }
          - { id: c3, valor: 0.1, termos: [ transito em julgado | definitiva | decisao definitiva | antes da vigencia | antes de sua entrada em vigor | ainda que ] }
      - n: B
        secao: PONTUAÇÃO
        descricao: "O pedido deverá ser formulado perante a Vara de Execuções Penais, pois existe decisão com trânsito em julgado (0,50), na forma da Súmula 611 do STF OU do Art. 66, inciso I, da LEP (0,10). Obs.: a mera citação do dispositivo legal não será pontuada."
        valores: [ 0, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.5, termos: [ execu* ] }
          - { id: c2, valor: 0.1, dispositivo: [ Súmula 611 STF, "art. 66, I, LEP" ], requer: c1 }
  - n: 3
    enunciado: |-
      Em uma discussão de futebol, Rubens e Enrico, em comunhão de ações e desígnios, chamaram Eduardo de “ladrão” e “estelionatário”, razão pela qual Eduardo formulou uma queixa-crime em face de ambos.

      No curso da ação penal, porém, Rubens procurou Eduardo para pedir desculpas pelos seus atos, razão pela qual Eduardo expressamente concedeu perdão do ofendido em seu favor, sendo esse prontamente aceito e, consequentemente, extinta a punibilidade de Rubens. Eduardo, contudo, se recusou a conceder o perdão para Enrico, pois disse que não era a primeira vez que o querelado tinha esse tipo de atitude.

      **Considerando apenas as informações narradas, responda aos itens a seguir.**

      **A) Qual o crime praticado, em tese, por Rubens e Enrico? (Valor: 0,60)**

      **B) Que argumento poderá ser formulado pelo advogado de Enrico para evitar sua punição? (Valor: 0,65)**

      Responda justificadamente, empregando os argumentos jurídicos apropriados e a fundamentação legal pertinente ao caso.
    gabarito_comentado: |-
      A) O crime praticado por Rubens e Enrico foi o de injúria, na forma do Art. 140 do Código Penal. Apesar das ofensas serem relacionadas à pessoa que pratica crimes, já que Eduardo foi chamado de “ladrão” e “estelionatário”, não há que se falar em crime de calúnia. A calúnia exige, para sua configuração, que seja atribuída ao ofendido a prática de determinado fato que configure crime. No caso, porém, não foram atribuídos fatos, mas sim qualidades pejorativas. Em razão disso, o crime praticado foi o de injúria.

      B) O argumento a ser formulado pela defesa é o de que o perdão do ofendido oferecido a um dos querelados a todos aproveita (Art. 51 do CPP), gerando a extinção da punibilidade dos coautores, caso seja aceito (Art. 107, V, do CP). Ao conceder perdão para Rubens, necessariamente esse perdão deve ser estendido para Enrico, de modo que, com sua aceitação, haverá extinção da sua punibilidade.
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: "O crime é de injúria (0,30), pois apenas foi atribuída qualidade negativa e não houve narração de um fato delitivo (0,20), conforme o Art. 140 do CP (0,10). Obs.: a mera citação do dispositivo legal não será pontuada."
        valores: [ 0, 0.3, 0.4, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.3, termos: [ injuria ] }
          - { id: c2, valor: 0.2, termos: [ qualidade negativa | nao houve imputacao de fato | nao atribuiu fato | fato determinado | fato delituoso | fato delitivo ] }
