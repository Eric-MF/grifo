questoes:
  - n: 1
    enunciado: |-
      Beto e Juca eram vizinhos em um prédio que veio a ser atingido por incêndio. Em razão das longas obras que seriam necessárias para recuperar os apartamentos, decidem se hospedar em quarto de hotel por 06 meses, novamente sendo vizinhos de quarto.

      Em determinada data, policiais militares surpreenderam Juca entrando com uma sacola preta no seu quarto do hotel, ficando claro que ele estava fugindo ao avistar os agentes da lei. Diante disso, ingressaram no quarto e apreenderam 100g de maconha, que estavam na sacola que Juca trazia consigo, e mais 50g de cocaína que estavam sendo guardadas no cômodo, sendo confirmado por Juca que o material seria destinado à venda. Em seguida, os policiais optaram por fazer diligência também no quarto vizinho, que era de Beto, apreendendo uma série de documentos que, após investigação, foi verificado que estavam relacionados a um crime de estelionato.

      O Ministério Público ofereceu denúncia em face de Juca pela prática de dois crimes de tráfico em concurso, tendo em vista que guardava cocaína e trazia consigo maconha. Já Beto, exclusivamente em razão da documentação apreendida, foi denunciado pelo crime de estelionato.

      **Considerando apenas as informações narradas, na condição de advogado(a) dos denunciados, responda aos itens a seguir.**

      **A) Qual argumento deve ser apresentado pela defesa técnica, em busca da absolvição de Beto? Justifique. (Valor: 0,60)**

      **B) Qual argumento a ser apresentado pela defesa técnica para questionar a capitulação jurídica constante na denúncia em face de Juca? Justifique. (Valor: 0,65)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) Em busca da absolvição de Beto, a defesa técnica deve alegar que as provas obtidas foram ilícitas, tendo em vista que os policiais apreenderam documentos em local amparado pela inviolabilidade de domicílio. O Art. 5º, inciso XI, da CRFB/88, garante a todos a inviolabilidade de domicílio, prevendo exceção no caso de cumprimento de ordem judicial ou flagrante delito, o que não restou configurado no caso. Ademais, o próprio Art. 150, § 4º do CP e o Art. 246 do CPP dizem que a expressão “casa” compreende aposento ocupado de habitação coletiva, sendo pacífico o entendimento dos Tribunais Superiores no sentido de que quarto de hotel, em especial quando habitado com certa permanência, está abrangido pela inviolabilidade de domicílio. Em sendo os documentos apreendidos com violação deste direito fundamental as únicas provas, impossível a condenação.

      B) Para questionar a capitulação jurídica formulada pelo Ministério Público na denúncia, a defesa técnica deveria esclarecer que não houve concurso de crimes, mas sim crime único de tráfico, tendo em vista que os verbos núcleos do tipo “guardar” e “trazer” estavam sendo praticados em um único contexto. De fato, a apreensão de drogas destinadas à venda configura crime de tráfico, sendo certo que a diligência foi válida porque havia situação de flagrante delito a justificar o ingresso dos policiais no quarto do hotel. O crime de tráfico de drogas é tipo misto alternativo, de modo que a prática de mais de um verbo em um mesmo contexto configura crime único, em respeito ao princípio da alternatividade. Apenas quando os verbos são praticados em contextos diversos é possível a imputação de delitos autônomos ao mesmo agente, o que não ocorreu na situação narrada.
    itens:
      - n: A
        descricao: O argumento é a ilicitude do meio de obtenção das provas na apreensão dos documentos (0,15), tendo em vista que o quarto de hotel está amparado pela inviolabilidade de domicílio e não havia situação de flagrante delito ou mandado de busca e apreensão (0,35), na forma do Art. 5º, inciso XI, da CRFB/88 OU do Art. 150, § 4º, do CP OU do Art. 246 do CPP OU Art. 157 do CPP (0,10).
        valores: [ 0, 0.15, 0.25, 0.35, 0.45, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.15, termos: [ ilicit* | ilegal*, prova* | apreensao | documentos ] }
          - { id: c2, valor: 0.35, alternativas: [ [ inviolabilidade, domicilio ], [ quarto de hotel, domicilio | casa ], [ mandado de busca | mandado judicial | ordem judicial ] ] }
          - { id: c3, valor: 0.1, dispositivo: [ "art. 5, XI, CRFB", "art. 150, § 4º, CP", "art. 246, CPP", "art. 157, CPP" ], requer: c2 }
      - n: B
        descricao: O argumento a ser apresentado é que houve crime único (0,40), pois os dois verbos núcleos do tipo foram praticados em um mesmo contexto OU diante do princípio da alternatividade OU pelo fato de o crime de tráfico ser misto alternativo OU houve uma única violação ao bem jurídico protegido (0,25).
        valores: [ 0, 0.25, 0.4, 0.65 ]
        componentes:
          - { id: c1, valor: 0.4, termos: [ crime unico | delito unico | um unico crime | um so crime ] }
          - { id: c2, valor: 0.25, alternativas: [ [ mesmo contexto ], [ alternatividade ], [ misto alternativo | tipo misto | conteudo variado | acao multipla ], [ unica violacao | um so bem juridico ] ] }
  - n: 2
    enunciado: |-
      Carleto foi denunciado pela prática do injusto de homicídio simples porque teria desferido disparos, com sua arma regular, contra seu vizinho Mário durante uma discussão, causando-lhe as lesões que foram a causa da morte da vítima. Logo que recebida a denúncia, Carleto foi submetido à exame de insanidade mental, tendo o laudo concluído que ele se encontrava nas condições do Art. 26, caput, do Código Penal.

      Finda a primeira etapa probatória do procedimento dos crimes dolosos contra a vida, no momento das alegações finais, a defesa técnica de Carleto, escorada em uma das vertentes da prova produzida, alegou que o réu atuou em legítima defesa.

      O juiz, ao final da primeira fase do procedimento, absolveu sumariamente o acusado em razão da inimputabilidade reconhecida, aplicando a medida de segurança de internação pelo prazo mínimo de 01 ano.

      A família de Carleto, insatisfeita com a medida de segurança aplicada, procura você, como advogado(a), para a adoção das medidas cabíveis.

      **Considerando o caso narrado, responda, na condição de advogado(a) de Carleto, aos itens a seguir.**

      **A) Qual o recurso cabível para a defesa combater aquela decisão? Justifique. (Valor: 0,60)**

      **B) Qual a tese jurídica de direito processual que a defesa de Carleto poderá alegar para combater a decisão respectiva? Justifique. (Valor: 0,65)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) Considerando que a decisão do magistrado foi de absolvição sumária, nos termos do Art. 416 do CPP, caberá à defesa apresentar recurso de apelação.

      B) Não poderia o magistrado ter absolvido Carleto, com aplicação de medida de segurança, em razão da inimputabilidade, tendo em vista que esta não era a única tese apresentada pela defesa. Pelo contrário, a defesa de Carleto defendeu que o fato sequer seria ilícito, em razão de legítima defesa, tese que, se acolhida pelos jurados, nem mesmo levaria à análise da culpabilidade do agente. Sendo a absolvição própria pela legítima defesa, não seria cabível a aplicação de medida de segurança. Para que esta seja aplicada, em razão da reconhecida inimputabilidade do agente devido à doença mental, exige-se que o mesmo tenha praticado um fato típico e ilícito. Em se tratando de crime doloso contra a vida, a competência para o julgamento respectivo é do Tribunal do Júri, cabendo aos jurados a decisão se o acusado atuou sob a escora de excludente de ilicitude, no caso a da legítima defesa, que encontrava amparo em uma das vertentes dos autos. O Art. 415, parágrafo único, do CPP, autoriza a absolvição sumária em razão da inimputabilidade do agente, quando esta for a única tese defensiva. Na hipótese, a tese principal é a de excludente de ilicitude.
    itens:
      - n: A
        descricao: Recurso de apelação (0,50), nos termos do Art. 416 do CPP (0,10).
        valores: [ 0, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.5, termos: [ apelacao ] }
