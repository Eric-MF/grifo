          - { id: c2, valor: 0.1, dispositivo: [ "art. 392, I, CPP" ], requer: c1 }
      - n: B
        descricao: Atipicidade material da conduta (0,25), em razão do reconhecimento do princípio da insignificância/bagatela (0,40).
        valores: [ 0, 0.25, 0.4, 0.65 ]
        componentes:
