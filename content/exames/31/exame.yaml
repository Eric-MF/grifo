peca:
  nome: Recurso em Sentido Estrito
  tipo: rese
  aliases: []
  enunciado: |-
    Rômulo, nascido em 04 de abril de 1991, em Maricá, ficou inconformado por encontrar, em 02 de janeiro de 2010, mensagens de sua esposa Paola, nascida em 06 de junho de 1992, para Bruno, desejando a este, um próspero ano. Em razão disso, desferiu golpes de faca nas mãos de Paola, pretendendo, em seguida, utilizar a arma branca para golpear a vítima e causar sua morte. Ocorre que Rômulo ficou sensível ao sofrimento de sua esposa após as facadas na mão, decidindo deixar o local dos fatos para se acalmar, apesar de ter consciência de que os atos praticados seriam insuficientes para causar a inicialmente pretendida morte de Paola.

    Paola informou os fatos à sua mãe, que a levou ao hospital e, em seguida à Delegacia, onde ela narrou o ocorrido à autoridade policial. O Delegado instaurou inquérito policial, realizando, por vários anos, diligências para a confirmação da versão da vítima, ouvindo testemunhas, realizando laudo de exame de local, acostando o exame de corpo de delito de Paola, que constatou a existência de lesão corporal de natureza grave, dentre outras. Por fim, ouviu o indiciado, que confirmou sua pretensão inicial e todos os fatos descritos pela vítima.

    Concluído o procedimento, após relatório final, os autos foram encaminhados ao Ministério Público, que ofereceu denúncia em face de Rômulo, no dia 22 de janeiro de 2020, perante o Tribunal do Júri da comarca de Maricá/Rio de Janeiro, imputando-lhe a prática do crime previsto no Art. 121, § 2º, inciso VI (feminicídio), com redação dada pela Lei 13.104/15, c/c. Art. 14, inciso II, todos do Código Penal. A inicial acusatória foi recebida em 24 de janeiro de 2020, sendo o denunciado citado pessoalmente, e juntada Folha de Antecedentes Criminais, em que constava apenas uma outra anotação por ação penal em curso pela suposta prática de crime de furto qualificado.

    Após regular prosseguimento do feito até aquele momento, foi designada audiência na primeira fase do procedimento do Tribunal do Júri, ocasião em que foram ouvidas a vítima e as testemunhas de acusação e defesa.

    Todos prestaram declarações que confirmaram efetivamente o ocorrido. Rômulo não compareceu porque não foi intimado, mas seu advogado estava presente e consignou inconformismo com a realização do ato sem a presença do réu. O magistrado, contudo, destacou que designaria nova data para interrogatório e que a defesa técnica estaria presente, não havendo, então, prejuízo.

    De fato, foi marcada nova data para a realização do interrogatório, ocasião em que Rômulo compareceu e permaneceu em silêncio. Após, as partes apresentaram manifestação, reiterando, a defesa, o inconformismo com a realização da primeira audiência. Os autos foram para conclusão, e foi proferida decisão pronunciando o réu nos termos da denúncia. Pessoalmente intimado, o Ministério Público se manteve inerte. A defesa técnica e Rômulo foram intimados em 10 de março de 2020, uma terça-feira.

    **Considerando apenas as informações expostas, na condição de advogado(a) de Rômulo, apresente a peça jurídica cabível, diferente de habeas corpus e embargos de declaração, apresentando todas as teses jurídicas de direito material e direito processual cabíveis. A peça deverá ser datada no último dia do prazo para interposição, considerando que de segunda a sexta-feira são dias úteis em todo o país. (Valor: 5,00).**

    *Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples menção ou transcrição do dispositivo legal não confere pontuação.*
  gabarito_comentado: |-
    O examinando deve apresentar, na qualidade de advogado(a) de Rômulo, recurso em sentido estrito, com fundamento no Art. 581, inciso IV, do Código de Processo Penal.

    Inicialmente, o examinando deve apresentar petição de interposição do recurso, que deve ser direcionada ao Juízo do Tribunal do Júri da Comarca de Maricá/RJ, local em que foram praticados os atos, sendo certo que o crime imputado era de natureza dolosa contra a vida, logo, órgão competente para o julgamento, de acordo com a infração penal imputada na denúncia. Já na petição de interposição, deve ser formulado pedido de retratação por parte do juízo a quo, nos termos do Art. 589 do CPP. Em seguida, caso mantida a decisão de pronúncia, os autos devem ser encaminhados para o Tribunal de Justiça, com as respectivas razões recursais.

    Após a petição de interposição, deve o examinando apresentar as Razões do Recurso em Sentido Estrito, dessa vez direcionando-as ao Tribunal de Justiça do Estado do Rio de Janeiro.

    Já no ínicio de sua manifestação, a defesa de Rômulo deve requerer o reconhecimento da extinção da punibilidade em razão da prescrição da pretensão punitiva pela pena em abstrato. Isso, porque os fatos ocorreram em 02 de janeiro de 2010, quando o réu tinha 18 anos de idade, ou seja, era menor de 21 anos. A denúncia foi recebida em 24 de janeiro de 2020, funcionando como primeira causa de interrupção do prazo prescricional, nos termos do Art. 117, inciso I, do CP.

    O Ministério Público imputou na denúncia a prática do crime de homicídio qualificado, que, a princípio, possui pena máxima em abstrato de 30 anos de reclusão. Foi, contudo, incluída a causa de diminuição de pena da tentativa. Considerando o mínimo de diminuição (1/3), a pena máxima do delito passa a ser 20 anos de reclusão, que, nos termos do Art. 109, inciso I, do CP, prescreve em 20 anos.

    Ocorre que o Art. 115 do Código Penal estabelece que o prazo prescricional será computado pela metade quando o agente for, na data dos fatos, menor de 21 anos. Considerando a idade de Rômulo quando os fatos teriam ocorrido, o prazo prescricional a incidir, na hipótese, é de 10 anos, período esse ultrapassado entre a data dos fatos e a data do recebimento da denúncia.

    Importante recordar que o Art. 110 do CP não mais admite o reconhecimento da prescrição retroativa entre a data dos fatos e do recebimento da denúncia, ou seja, considerando a pena em concreto aplicada, não havendo vedação ao reconhecimento da prescrição entre esses marcos quando for considerada a pena em abstrato, sem desconsiderar que o fato é anterior ao advento da Lei 12234/10.

    Preliminarmente, deve o examinando destacar que existia nulidade a ser reconhecida, anulando-se a instrução a partir da primeira audiência realizada. Isso porque o réu não foi intimado para comparecer em juízo, não sendo adequada a realização da audiência, com oitiva da vítima, testemunhas de acusação e defesa, sem a presença do acusado. Ainda que o interrogatório tenha sido realizado em outra data, a produção de praticamente toda a prova sem a presença de Rômulo, tendo a defesa manifestado inconformismo, justifica o reconhecimento de nulidade em razão da violação ao princípio da ampla defesa, previsto no Art. 5º, inciso LV, CRFB.

    No mérito, o principal argumento a ser apresentado em favor de Rômulo é a ocorrência de desistência voluntária, o que levaria a uma desclassificação em relação à infração penal imputada, segundo o Art. 419 do CPP.

    De acordo com o que consta do procedimento, efetivamente a intenção inicial de Rômulo era causar a morte de sua esposa, Paola. Todavia, após desferir golpes na mão da esposa, sensibilizado com o sofrimento dela, desisitiu de prosseguir na empreitada delitiva e deixou o local dos fatos, estando ciente de que os atos praticados seriam insuficientes para a consumação do delito inicialmente pretendido.

    Na tentativa, o crime não se consuma por circunstâncias alheias à vontade do agente, o que não ocorreu na hipótese. Aplica-se o Art. 15 do CP, no sentido de que o agente, que voluntariamente desiste de prosseguir na empreitada delitiva, responde apenas pelos atos já praticados. No caso, foi praticado crime de lesão corporal grave, de acordo com o exame de corpo de delito acostado, de modo que apenas essa infração penal pode ser imputada ao agente.

    Observe-se que não haveria que se falar em proposta de suspensão condicional do processo diante da Folha de Antecedentes Criminais do réu.

    Por fim, de maneira subsidiária, não reconhecida a necessidade de desclassificação, cabe ao examinando pugnar pelo afastamento da qualificadora prevista no Art. 121, § 2º, inciso VI, do CP, tendo em vista que, conforme expresso no enunciado, a mesma foi inserida por meio da Lei n o 13.104/15, enquanto os fatos teriam ocorrido em 2010. Aplica-se a previsão do Art. 5º, inciso XL, da CRFB, não podendo a lei mais grave retroagir para atingir situações pretéritas. Dessa forma, mesmo em caso de pronúncia, necessário o afastamento da qualificadora imputada.

    Em sua conclusão, deve o examinando formular o pedido de conhecimento e provimento do recurso para:

    a) ser reconhecida a prescrição da pretensão punitiva;

    b) anulação da decisão de pronúncia;

    c) desclassificação, nos termos do Art. 419 do CPP;

    d) afastamento da qualificadora do Art. 121, § 2º, inciso VI, do CP.

    O prazo para apresentação do Recurso em Sentido Estrito é de 05 dias, nos termos do Art. 586 do CPP, logo se encerraria em 15 de março de 2020, domingo, uma vez que a intimação ocorreu em 10 de março de 2020, devendo ser prorrogado para o primeiro dia útil seguinte, qual seja, 16 de março de 2020.

    No fechamento, deveria o candidato indicar local, data, advogado e nº OAB.
