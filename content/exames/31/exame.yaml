          - { id: c2, valor: 0.2, alternativas: [ [ consun* ], [ elementar ] ] }
      - n: B
        descricao: Sim, teria, tendo em vista que o agente estava sob a influência de álcool OU tendo em vista que a representação da vítima é desnecessária diante da embriaguez OU tendo em vista que não se aplica o Art. 88 da Lei 9.099/95 diante da embriaguez (0,55), nos termos do Art. 291, § 1º, inciso I, do CTB (0,10).
        valores: [ 0, 0.55, 0.65 ]
