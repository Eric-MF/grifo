  - n: 3
    enunciado: |-
      Carlos, 43 anos, foi flagrado, no dia 10 de março de 2014, transportando arma de fogo de uso permitido. Foi denunciado, processado e condenado à pena de 02 anos de reclusão, a ser cumprida em regime aberto, e multa de 10 dias, à razão unitária mínima, sendo a pena privativa de liberdade substituída por duas penas restritivas de direitos, consistentes em prestação de serviços à comunidade e limitação de final de semana. A decisão transitou em julgado, para ambas as partes, em 25 de novembro de 2015.

      Após a condenação definitiva, Carlos conseguiu emprego fixo em cidade diferente daquela em que morava e fora condenado, para onde se mudou, deixando de comunicar tal fato ao juizo respectivo, não sendo encontrado no endereço constante nos autos para dar início à execução da pena. Por tal motivo, o juiz, provocado pelo Ministério Público converteu, de imediato, as penas restritivas de direitos em pena privativa de liberdade, determinando a expedição de mandado de prisão.

      A ordem de prisão foi cumprida em 20 de dezembro de 2019, quando Carlos foi ao DETRAN/RJ objetivando a renovação de sua habilitação, certo que, após aquele fato, nunca se envolveu em qualquer outro ilícito penal.

      Desesperada, a família procura você, na condição de advogado(a), para a adoção das medidas cabíveis.

      **Considerando a situação apresentada, responda, na condição de advogado(a) de Carlos, aos itens a seguir.**

      **A) Para questionar a decisão do magistrado de converter a pena restritiva de direitos em privativa de liberdade e expedir mandado de prisão, qual o argumento de direito processual a ser apresentado? Justifique. (Valor: 0,60)**

      **B) Existe argumento de direito material a ser apresentado para evitar que Carlos cumpra a sanção penal imposta na sentença? Justifique. (Valor: 0,65)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      Narra o enunciado que Carlos foi condenado definitivamente ao cumprimento da pena privativa de liberdade de 02 anos, em regime inicial aberto, substituída por duas restritivas de direito. Todavia, Carlos se mudou sem informar ao juízo e acabou por não dar início ao cumprimento da pena restritiva de direito imposta, de modo que o magistrado converteu a PRD em pena privativa de liberdade, após requerimento do Ministério Público.

      A) A Pena Restritiva de Direito (PRD), em caso de descumprimento, poderá ser convertida em privativa de liberdade, desde que o descumprimento seja injustificado, nos termos do Art. 44, § 4º, do CP. Exatamente pela exigência de que o descumprimento seja injustificado que deve o apenado ser intimado para manifestação, em especial para esclarecer os motivos pelos quais não vem cumprindo a PRD imposta. Não se controverte que para garantir a efetividade das penas restritivas de direitos, faz-se necessária a existência de regras rígidas no sentido de que o seu descumprimento acarrete uma consequência rigorosa para o condenado faltoso. Assim, é prevista a conversão da PRD em PPL quando do seu descumprimento injustificado. Desta forma, antes da conversão, a defesa deve ser intimada para justificar aquele descumprimento, não podendo ser abandonados os princípios do contraditórido e da ampla defesa. Na hipótese, a conversão ocorreu sem a oitiva da defesa previamente, o que acarreta a nulidade da decisão respectiva.

      B) Sim, o argumento é o de que ocorreu prescrição da pretensão executória, de modo que deve ser reconhecida a extinção da punibilidade do agente. Transitada em julgado a decisão condenatória, se inicia o prazo da prescrição da pretensão executória, que tem por base a pena aplicada, nos termos do Art. 110 do CP. Na hipótese, foi aplicada a pena de 02 anos de reclusão, de modo que o prazo prescricional é de 04 anos, com base no Art. 109, inciso V, do CP. Entre a data do trânsito em julgado (25/11/15) e a data da prisão de Carlos (20/12/19) foi ultrapassado o prazo prescricional de 04 anos. Assim, deverá ser declarada extinta a punibilidade pela prescrição da pretensão executória, nos termos do Art. 107, inciso IV, do CP.
    itens:
      - n: A
        descricao: A conversão da pena restritiva de direitos em privativa de liberdade exige que haja descumprimento injustificado das medidas impostas (0,15), de modo que deveria o condenado ter sido intimado para justificar o descumprimento das penas substitutivas OU logo houve violação da ampla defesa/contraditório ao não ser possibilitado a Carlos o direito de manifestação sobre o descumprimento (0,35), nos termos do Art. 44, § 4º, do CP (0,10).
        valores: [ 0, 0.15, 0.25, 0.35, 0.45, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.15, termos: [ injustificad* | sem justificativa | justifica* ] }
          - { id: c2, valor: 0.35, alternativas: [ [ intima* | intimado | ouvido | oitiva ], [ ampla defesa ], [ contraditorio ] ] }
          - { id: c3, valor: 0.1, dispositivo: [ "art. 44, § 4º, CP" ], requer: c2 }
      - n: B
        descricao: Sim, o argumento seria de que ocorreu a prescrição da pretensão executória (0,40), com consequente extinção da punibilidade do agente (0,15), conforme o Art. 107, inciso IV, do CP, OU o Art. 109, inciso V, do CP, OU o Art. 110 do CP (0,10).
        valores: [ 0, 0.15, 0.25, 0.4, 0.5, 0.55, 0.65 ]
        componentes:
          - { id: c1, valor: 0.4, termos: [ prescricao da pretensao executoria | prescricao executoria ] }
          - { id: c2, valor: 0.15, termos: [ extin* da punibilidade ] }
          - { id: c3, valor: 0.1, dispositivo: [ "art. 107, IV, CP", "art. 109, V, CP", "art. 110, CP" ], requer: c2 }
  - n: 4
    enunciado: |-
      Paulo, estudante, condenado anteriormente por crime culposo no trânsito, em 20/08/2019 adentrou loja de conveniência de um posto de gasolina e, aproveitando-se de um descuido dos funcionários do estabelecimento, furtou todo o dinheiro que se encontrava no caixa.

      Após sair da loja sem ter sua conduta percebida, consumado o delito, Paulo avistou sua antiga namorada Jaqueline, que abastecia seu carro no posto de gasolina, e contou-lhe sobre o crime que praticara momentos antes, pedindo que Jaqueline, igualmente estudante, primária e sem qualquer envolvimento anterior com fatos ilícitos, ajudasse-o a deixar o local, pois notou que os empregados do posto já tinham percebido que ocorrera a subtração. Jaqueline, então, dá carona a Paulo, que se evade com os valores subtraídos.

      Após instauração de inquérito policial para apurar o fato, os policiais, a partir das câmeras de segurança da loja, identificaram Paulo como o autor do delito, bem como o veículo de Jaqueline utilizado pelo autor para deixar o local, tendo o Ministério Público denunciado ambos pela prática do crime de furto qualificado pelo concurso de agentes, na forma do Art. 155, § 4º, inciso IV, do Código Penal.

      Por ocasião do recebimento da denúncia, o juiz indeferiu a representação pela decretação da prisão preventiva formulada pela autoridade policial, mas aplicou aos denunciados medidas cautelares alternativas, dentre as quais a suspensão do exercício de atividade de natureza econômica em relação a Jaqueline, já que ela seria proprietária de um estabelecimento de comércio de roupas no bairro em que residia, nos termos requeridos pelo Ministério Público.

      **Considerando os fatos acima narrados, responda, na condição de advogado(a) de Jaqueline, aos questionamentos a seguir.**

      **A) Qual argumento de direito material poderá ser apresentado pela defesa técnica de Jaqueline para questionar a capitulação delitiva imputada pelo Ministério Público? Justifique. (Valor: 0,65)**

      **B) Existe argumento para questionar a medida cautelar alternativa de suspensão da atividade econômica aplicada a Jaqueline? Justifique. (Valor: 0,60)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      Narra o enunciado que Paulo praticou um crime de furto, já que subtraiu, sem violência ou grave ameaça à pessoa, dinheiro da loja de conveniência de determinado posto de gasolina. Após a consumação do delito, encontrou Jaqueline, sua ex-namorada, narrando sobre o crime praticado. Jaqueline, então, auxilia Paulo a deixar o local dos fatos. Após descoberta do ocorrido, o Ministério Público denunciou Jaqueline e Paulo pelo crime de furto qualificado pelo concurso de agentes, aplicando, dentre outras, a cautelar de suspensão do exercício de atividade de natureza econômica à Jaqueline.

      A. O argumento é o de que Jaqueline não praticou crime de furto, já que sua contribuição ocorreu após a consumação do delito patrimonial. Não há que se falar em participação após a consumação do delito, salvo se a contribuição, apesar de ocorrer após a consumação, já houver sido previamente ajustada. No caso em tela, Jaqueline não havia ajustado previamente com Paulo que o auxiliaria na empreitada criminosa, tendo concorrido para o crime somente após a consumação deste por Paulo. Sendo assim, não há que se falar em concurso de pessoas, não devendo Jaqueline responder pela prática do furto qualificado. Nesse sentido, Paulo deveria responder apenas pelo crime de furto simples (Art. 155, caput, do CP).

      B. Nos termos do Art. 319 do CPP é possível ao magistrado aplicar medidas cautelares alternativas. Para evitar a prisão, incentiva-se a aplicação de medidas cautelares alternativas. Ademais, o Art. 319, inciso VI, do CPP, prevê que poderá ser aplicada cautelar de suspensão do exercício da função pública ou de atividade de natureza econômica, desde que haja justo receio de sua utilização para prática de novas infrações penais.

      O simples fato de Jaqueline ser denunciada por crime contra o patrimônio (de maneira inadequada, ainda!) não torna a medida de suspensão da atividade de natureza econômica adequada, qual seja atuar em comércio de roupas em estabelecimento do qual seria proprietária. Jaqueline era primária, de bons antecedentes e sem qualquer envolvimento pretérito com o aparato policial ou judicial, nada no enunciado permitindo concluir que haveria justo receio na utilização da atividade econômica para prática de novas infrações.
    itens:
      - n: A
        descricao: Jaqueline não concorreu para o crime de furto (0,15), tendo em vista que sua contribuição ocorreu após a consumação do delito OU tendo em vista que não existe participação após a consumação OU tendo em vista que não havia liame subjetivo no momento da subtração (0,50),
        valores: [ 0, 0.15, 0.5, 0.65 ]
        componentes:
          - { id: c1, valor: 0.15, termos: [ nao concorreu | nao participou | nao responde | nao ha participacao | atipic* ] }
          - { id: c2, valor: 0.5, alternativas: [ [ apos a consumacao | depois da consumacao | apos consumado ], [ liame subjetivo | vinculo subjetivo ] ] }
      - n: B
        descricao: O argumento é o de que a cautelar de suspensão da atividade de natureza econômica exige que haja justo receio em sua utilização para a prática de novas infrações penais, o que não restou configurado na hipótese (0,50), conforme Art. 319, inciso VI, OU Art. 282, inciso II, ambos do CPP (0,10).
        valores: [ 0, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.5, termos: [ justo receio | receio, novas infracoes | novos crimes | reitera* ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 319, VI, CPP", "art. 282, II, CPP" ], requer: c1 }
