      - n: B
        descricao: Falta de justa causa para a ação penal (0,30), pois a denúncia se lastreia exclusivamente em prova ilícita (0,30), decorrente de violação a norma de direito material (art. 151 do CP OU art. 395, III, do CPP OU art. 5º, XII e LVI, da CRFB) (0,30).
