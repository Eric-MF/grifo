  - n: 2
    enunciado: |-
      Caio é denunciado pelo Ministério Público pela prática do crime de homicídio qualificado por motivo fútil.

      De acordo com a inicial, em razão de rivalidade futebolística, Caio teria esfaqueado Mévio quarenta e três vezes, causando-lhe o óbito. Pronunciado na forma da denúncia, Caio recorreu com o objetivo de ser impronunciado, vindo o Tribunal de Justiça da localidade a manter a pronúncia, mas excluindo a qualificadora, ao argumento de que Mévio seria arruaceiro e, portanto, a motivação não poderia ser considerada fútil. No julgamento em plenário, ocasião em que Caio confessou a prática do crime, a defesa lê para os jurados a decisão proferida pelo Tribunal de Justiça no que se refere à caracterização de Mévio como arruaceiro. Respondendo aos quesitos, o Conselho de Sentença absolve Caio.

      Sabendo-se que o Ministério Público não recorreu da sentença, responda aos itens a seguir, empregando os argumentos jurídicos apropriados e a fundamentação legal pertinente ao caso.

      **a) A esposa de Mévio poderia buscar a impugnação da decisão proferida pelo Conselho de Sentença? Em caso positivo, de que forma e com base em que fundamento? (Valor: 0,65)**

      **b) Caso o Ministério Público tivesse interposto recurso de apelação com fundamento exclusivo no artigo 593, III, “d”, do Código de Processo Penal, poderia o Tribunal de Justiça declarar a nulidade do julgamento por reconhecer a existência de nulidade processual? (Valor: 0,6)**
    gabarito_comentado: |-
      a) Sim. A esposa da vítima deveria constituir advogado para que ele se habilitasse como assistente de acusação e interpusesse recurso de apelação, com fundamento nos artigos 598 e 593, III, “a” e “d”. Afinal, a defesa violou a proibição expressa contida no artigo 478, I, do CPP, ao ler trecho de decisão que julgou admissível a acusação e manteve a pronúncia do réu. Além disso, tendo o réu confessado o homicídio, a absolvição se mostrou manifestamente contrária à prova dos autos.

      b) Não, pois a Súmula 160 do STF proíbe que o Tribunal conheça de nulidade não arguida no recurso de acusação. Assim, a violação ao artigo 478, I, do CPP, por parte da defesa não poderia ser analisada se a acusação não lhe tivesse feito menção no recurso interposto.
    itens:
      - n: A
        descricao: "Sim: a esposa da vítima poderia constituir advogado para habilitar-se como assistente de acusação e interpor apelação (0,35), com fundamento no art. 598 do CPP (0,30)."
        componentes:
          - { id: c1, valor: 0.35, termos: [ assistente, apelacao | recurso ] }
          - { id: c2, valor: 0.3, dispositivo: [ art. 598 CPP ], requer: c1 }
      - n: B
        descricao: "Não: a Súmula 160 do STF proíbe que o Tribunal conheça de nulidade não arguida no recurso da acusação (0,30); a violação ao art. 478, I, do CPP não poderia ser analisada sem menção no recurso (0,30)."
        componentes:
          - { id: c1, valor: 0.3, alternativas: [ [ sumula 160 ], [ nao arguida | nao alegada | nao suscitada ] ] }
          - { id: c2, valor: 0.3, termos: [ 478 | leitura | pronuncia, recurso | mencao | arguida ] }
  - n: 3
    enunciado: |-
      Na cidade de Arsenal, no Estado Z, residiam os deputados federais Armênio e Justino. Ambos objetivavam matar Frederico, rico empresário que possuía valiosas informações contra eles. Frederico morava na cidade de Tirol, no Estado K, mas seus familiares viviam em Arsenal. Sabendo que Frederico estava visitando a família, Armênio e Justino decidiram colocar em prática o plano de matá-lo. Para tanto, seguiram Frederico quando este saía da casa de seus parentes e, utilizando-se do veículo em que estavam, bloquearam a passagem de Frederico, de modo que a caminhonete deste não mais conseguia transitar. Ato contínuo, Armênio e Justino desceram do automóvel. Armênio imobilizou Frederico e Justino desferiu tiros contra ele, Frederico. Os algozes deixaram rapidamente o local, razão pela qual não puderam perceber que Frederico ainda estava vivo, tendo conseguido salvar-se após socorro prestado por um passante. Tudo foi noticiado à polícia, que instaurou o respectivo inquérito policial. No curso do inquérito, os mandatos de Armênio e Justino chegaram ao fim, e eles não conseguiram se reeleger. O Ministério Público, por sua vez, munido dos elementos de informação colhidos na fase inquisitiva, ofereceu denúncia contra Armênio e Justino, por tentativa de homicídio, ao Tribunal do Júri da Justiça Federal com jurisdição na comarca onde se deram os fatos, já que, à época, os agentes eram deputados federais. Recebida a denúncia, as defesas de Armênio e Justino mostraram-se conflitantes. Já na fase instrutória, Frederico teve seu depoimento requerido. A vítima foi ouvida por meio de carta precatória em Tirol. Na respectiva audiência, os advogados de Armênio e Justino não compareceram, de modo que juízo deprecado nomeou um único advogado para ambos os réus. O juízo deprecante, ao final, emitiu decreto condenatório em face de Armênio e Justino. Armênio, descontente com o patrono que o representava, destituiu-o e nomeou você como novo advogado.

      Com base no cenário acima, indique duas nulidades que podem ser arguidas em favor de Armênio.

      Justifique com base no CPP e na CRFB. (Valor: 1,25)
    gabarito_comentado: |-
      Primeiramente há que ser arguida nulidade por incompetência absoluta (art. 564, I, do CPP), pois no caso não há incidência de nenhuma das hipóteses mencionadas no art. 109 da CRFB que justifiquem a atração do processo à competência da Justiça Federal.

      Ademais, o fato de os agentes serem ex‐deputados federais não enseja deslocamento de competência. Nesse sentido, competente é o Tribunal do Júri da Comarca onde se deram os fatos, pois, cessado o foro por prerrogativa de função, voltam a incidir as regras normais de competência para o julgamento da causa, de modo que, dada à natureza da infração (crime doloso contra a vida), a competência é afeta ao Tribunal do Júri de Arsenal.

      Além disso, também deverá ser arguida nulidade com base no art. 564, IV, do CPP. A nomeação de somente um advogado para ambos réus, feita pelo juízo deprecado, não respeita o princípio da ampla defesa (art. 5º, LV, da CRFB), pois, como as defesas eram conflitantes, a nomeação de um só advogado prejudica os réus.

      Por fim, com base nos artigos 413 e 414 do CPP, bem como art. 5º, LIII da CRFB/88, poderá ser arguida nulidade pela falta de apreciação da causa pelo juiz natural do feito.
    itens:
      - n: A
        teto: 1.25
        descricao: "Indicar duas entre as teses (0,60 cada; acertando duas, +0,05): (a) incompetência absoluta da Justiça Federal (art. 564, I, CPP; art. 109 CRFB), pois cessado o foro por prerrogativa, competente é o Tribunal do Júri; (b) nulidade do art. 564, IV, do CPP: um só advogado para réus com defesas conflitantes viola a ampla defesa; (c) nulidade pela ausência de apreciação pelo juiz natural (art. 5º, LIII, CRFB ou arts. 413/414 CPP)."
        componentes:
          - { id: c1, valor: 0.3, termos: [ incompetencia | incompetente, justica federal | 109 ] }
          - { id: c2, valor: 0.3, termos: [ juri | foro por prerrogativa | prerrogativa de funcao | deputad* ] }
          - { id: c3, valor: 0.3, termos: [ nulidade, um advogado | mesmo advogado | unico advogado | defesas conflitantes | colidentes ] }
          - { id: c4, valor: 0.3, termos: [ ampla defesa ] }
          - { id: c5, valor: 0.3, termos: [ juiz natural ] }
          - { id: c6, valor: 0.3, dispositivo: [ "art. 5º, LIII, CF", art. 413 CPP, art. 414 CPP ], requer: c5 }
  - n: 4
    enunciado: |-
      João e Maria, casados desde 2007, estavam passando por uma intensa crise conjugal. João, visando tornar insuportável a vida em comum, começou a praticar atos para causar dano emocional a Maria, no intuito de ter uma partilha mais favorável. Para tanto, passou a realizar procedimentos de manipulação, de humilhação e de ridicularização de sua esposa.

      Diante disso, Maria procurou as autoridades policiais e registrou ocorrência em face dos transtornos causados por seu marido. Passados alguns meses, Maria e João chegam a um entendimento e percebem que foram feitos um para o outro, como um casal perfeito. Maria decidiu, então, renunciar à representação.

      Nesse sentido e com base na legislação pátria, responda fundamentadamente:

      **a) Pode haver renúncia (retratação) à representação durante a fase policial, antes de o procedimento ser levado a juízo? (0,65)**

      **b) Pode haver aplicação de pena consistente em prestação pecuniária? (0,6)**
    gabarito_comentado: |-
      Trata‐se de crime capitulado na Lei Maria da Penha (Lei 11.340/2006), conforme transcrito abaixo:

      “Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

      II ‐ a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;”

      Além disso, o Código Penal assim dispõe:

      “Art. 129. Ofender a integridade corporal ou a saúde de outrem:

      Pena ‐ detenção, de três meses a um ano.

      § 9º Se a lesão for praticada contra ascendente, descendente, irmão, cônjuge ou companheiro, ou com quem conviva ou tenha convivido, ou, ainda, prevalecendo‐se o agente das relações domésticas, de coabitação ou de hospitalidade: (Redação dada pela Lei nº 11.340, de 2006)

      Pena ‐ detenção, de 3 (três) meses a 3 (três) anos. (Redação dada pela Lei nº 11.340, de 2006)

      § 10. Nos casos previstos nos §§1º a 3º deste artigo, se as circunstâncias são as indicadas no §9º deste artigo, aumenta‐se a pena em 1/3 (um terço). (Incluído pela Lei nº 10.886, de 2004)”

      Sendo assim, de acordo com a Lei supracitada, a renúncia à representação só é admitida na presença do Juiz, em audiência especialmente designada para esta finalidade, nos termos do art. 16 da lei 11.340/2006 e, de acordo com o artigo 17 da referida lei, a prestação pecuniária é vedada.
    itens:
      - n: A
        descricao: "Não: pelo art. 16 da Lei 11.340, a renúncia à representação só é admitida perante o juiz, em audiência especialmente designada (0,65)."
        componentes:
          - { id: c1, valor: 0.65, termos: [ audiencia | juiz, renuncia | retrata* ] }
      - n: B
        descricao: "Não: o art. 17 da Lei 11.340 veda a prestação pecuniária (0,60)."
        componentes:
          - { id: c1, valor: 0.6, termos: [ vedad* | proib* | nao pode | nao e possivel | nao cabe, prestacao pecuniaria | pecuniaria ] }
