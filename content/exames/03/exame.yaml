questoes:
  - n: 1
    enunciado: |-
      a) Habeas Corpus, uma vez que não há previsão de recurso contra a decisão que não absolvera sumariamente o acusado, sendo cabível a ação mandamental, conforme estabelecem os artigos 647 e seguintes do CPP. No caso, não seria admissível o recurso em sentido estrito, uma vez que o enunciado não traz qualquer informação acerca da fundamentação utilizada pelo magistrado para deixar de absolver sumariamente o réu, não podendo o candidato deduzir que teria sido realizado e indeferido pedido expresso de reconhecimento de extinção da punibilidade.

      b) Ao Tribunal Regional Federal.

      c) Extinção da punibilidade pelo pagamento do débito quanto ao delito previsto no artigo 168-A, do CP, e, após, restando apenas acusação pertinente à sonegação de tributo de natureza estadual, incompetência absoluta – em razão da matéria – do juízo federal para processar e julgar a matéria. Quanto à Súmula Vinculante nº 24, o enunciado não traz qualquer informação no sentido de que a via administrativa ainda não teria se esgotado, não podendo o candidato deduzir tal fato.

      Em relação à correção, levou-se em conta o seguinte critério de pontuação:
