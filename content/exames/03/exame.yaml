          - { id: c2, valor: 0.1, termos: [ pagamento | pagou | quitacao ] }
          - { id: c3, valor: 0.25, termos: [ incompetencia | incompetente ] }
    valor: 1
  - n: 2
    enunciado: |-
      a) Não, uma vez que incide sobre o caso a escusa absolutória prevista no artigo 181, II, do CP.

      b) Sim, uma vez que a circunstância relativa a Caio é de caráter pessoal, não se comunicando a ela (artigo 30 do CP). Assim, poderá ser punida pela prática do crime de furto qualificado pelo repouso noturno.

      c) Belo Horizonte, local em que delito se consumou, conforme artigos 69, I, do CPP e 6º do CP.

      Em relação à correção, levou-se em conta o seguinte critério de pontuação:
    gabarito_comentado: ""
    itens:
      - n: A
        descricao: "Não: incide a escusa absolutória (0,20) do art. 181, II, do CP (0,20)."
