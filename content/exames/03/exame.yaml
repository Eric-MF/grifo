peca:
  nome: Recurso em Sentido Estrito
  tipo: rese
  aliases: []
  enunciado: |-
    No dia 17 de junho de 2010, uma criança recém-nascida é vista boiando em um córrego e, ao ser resgatada, não possuía mais vida. Helena, a mãe da criança, foi localizada e negou que houvesse jogado a vítima no córrego. Sua filha teria sido, segundo ela, sequestrada por um desconhecido. Durante a fase de inquérito, testemunhas afirmaram que a mãe apresentava quadro de profunda depressão no momento e logo após o parto. Além disso, foi realizado exame médico legal, o qual constatou que Helena, quando do fato, estava sob influência de estado puerperal. À míngua de provas que confirmassem a autoria, mas desconfiado de que a mãe da criança pudesse estar envolvida no fato, a autoridade policial representou pela decretação de interceptação telefônica da linha de telefone móvel usado pela mãe, medida que foi decretada pelo juiz competente. A prova constatou que a mãe efetivamente praticara o fato, pois, em conversa telefônica com uma conhecida, de nome Lia, ela afirmara ter atirado a criança ao córrego, por desespero, mas que estava arrependida. O delegado intimou Lia para ser ouvida, tendo ela confirmado, em sede policial, que Helena de fato havia atirado a criança, logo após o parto, no córrego. Em razão das aludidas provas, a mãe da criança foi então denunciada pela prática do crime descrito no art. 123 do Código Penal perante a 1ª Vara Criminal (Tribunal do Júri). Durante a ação penal, é juntado aos autos o laudo de necropsia realizada no corpo da criança. A prova técnica concluiu que a criança já nascera morta.

    Na audiência de instrução, realizada no dia 12 de agosto de 2010, Lia é novamente inquirida, ocasião em que confirmou ter a denunciada, em conversa telefônica, admitido ter jogado o corpo da criança no córrego. A mesma testemunha, no entanto, trouxe nova informação, que não mencionara quando ouvida na fase inquisitorial. Disse que, em outras conversas que tivera com a mãe da criança, Helena contara que tomara substância abortiva, pois não poderia, de jeito nenhum, criar o filho. Interrogada, a denunciada negou todos os fatos. Finda a instrução, o Ministério Público manifestou-se pela pronúncia, nos termos da denúncia, e a defesa, pela impronúncia, com base no interrogatório da acusada, que negara todos os fatos. O magistrado, na mesma audiência, prolatou sentença de pronúncia, não nos termos da denúncia, e sim pela prática do crime descrito no art. 124 do Código Penal, punido menos severamente do que aquele previsto no art. 123 do mesmo código, intimando as partes no referido ato.

    **Com base somente nas informações de que dispõe e nas que podem ser inferidas pelo caso concreto acima, na condição de advogado(a) de Helena, redija a peça cabível à impugnação da mencionada decisão, acompanhada das razões pertinentes, as quais devem apontar os argumentos para o provimento do recurso, mesmo que em caráter sucessivo.**
  gabarito_comentado: |-
    O recurso cabível é o recurso em sentido estrito, na forma do art. 581, IV, do Código de Processo Penal, dirigido ao Juiz da 1ª Vara Criminal (Tribunal do Júri).

    Em primeiro lugar, deverá o examinando requerer, em preliminar, o desentranhamento das provas ilícitas.

    Isso porque o crime investigado, infanticídio (art. 123 do Código Penal), é punido com pena de detenção. Em razão disso, não era admissível a interceptação telefônica prevista na Lei 9.296/96, pois a lei em tela não admite a medida quando o crime só é punido com pena de detenção (art. 2º, III). É de ressaltar que o crime de aborto, previsto no art. 124, também só é punido com pena de detenção. Além disso, o enunciado indica não existir indícios suficientes de autoria, uma vez que o delegado representou pela decretação da quebra com base em meras suspeitas. Finalmente, não foram esgotados todos os meios de investigação, condição sine qua non para que a medida seja decretada.

    Por outro lado, o examinando deverá registrar também que o testemunho de Lia, embora seja prova realizada de modo lícito, será ilícito por derivação, na forma do art. 157, § 1º, do Código e Processo Penal e, portanto, imprestável.

    Ainda em preliminar, deverá o examinando suscitar a nulidade do processo por violação do art. 411, § 3º do Código de Processo Penal, c/c art. 384 do Código de Processo Penal. Com efeito, diante das regras acima referidas, o Juiz, vislumbrando a possibilidade de nova definição do fato em razão de prova nova, surgida durante a instrução, deverá abrir vista dos autos para que o Ministério Público, se for o caso, adite a denúncia, mesmo que a pena prevista para a nova definição jurídica seja menor, conforme a nova redação do art. 384 do Código de Processo Penal, dada pela Lei 11.719/2008.

    O candidato deverá, ainda, sustentar que não restou provada a materialidade do crime de aborto, uma vez que nenhuma perícia foi feita no sentido de comprovar que a criança faleceu em decorrência da ingestão de substância abortiva.

    Finalmente, deveria requerer, em caráter sucessivo, a impronúncia da acusada, uma vez que, retiradas as provas ilícitas dos autos, nenhuma prova de autoria existiria contra a denunciada.

    Em relação aos itens da correção, assim ficaram divididos:
