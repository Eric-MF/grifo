          - { id: c2, valor: 0.2, dispositivo: [ art. 30 CP, "art. 183, II, CP" ], requer: c1 }
      - n: C
        descricao: Belo Horizonte, local da consumação (0,10), conforme arts. 69, I, OU 70 do CPP (0,10).
        componentes:
