questoes:
  - n: 1
    enunciado: |-
      Gustavo, retornando para casa após ir a uma festa com sua esposa, é parado em uma blitz de rotina. Ele fica bastante nervoso, pois sabe que seu carro está com a documentação totalmente irregular (IPVA atrasado, multas vencidas e vistoria não realizada) e, muito provavelmente, o veículo será rebocado para o depósito. Após determinar a parada do veículo, o policial solicita que Gustavo saia do carro e exiba os documentos. Como havia diversos outros carros parados na fiscalização, forma-se uma fila de motoristas.

      Gustavo, então, em pé, na fila, aguardando sua vez para exibir a documentação, fala baixinho à sua esposa:

      “Vou ver se tem jogo. Vou oferecer cem reais pra ele liberar a gente. O que você acha? Será que dá?”. O que Gustavo não sabia, entretanto, é que exatamente atrás dele estava um policial que tudo escutara e, tão logo acaba de proferir as palavras à sua esposa, Gustavo é preso em flagrante. Atordoado, ele pergunta: “O que eu fiz?”, momento em que o policial que efetuava o flagrante responde: “Tentativa de corrupção ativa!”.

      Atento(a) ao caso narrado e tendo como base apenas as informações descritas no enunciado, responda justificadamente, aos itens a seguir.

      **A) É correto afirmar que Gustavo deve responder por tentativa de corrupção ativa? (Valor: 0,70)**

      **B) Caso o policial responsável por fiscalizar os documentos, observando a situação irregular de Gustavo, solicitasse quantia em dinheiro para liberá-lo e, Gustavo, por medo, pagasse tal quantia, ele (Gustavo)**

      responderia por corrupção ativa? (Valor: 0,55)

      O mero “sim” ou “não”, desprovido de justificativa ou mesmo com a indicação de justificativa inaplicável ao caso, não será pontuado.
    gabarito_comentado: |-
      A questão objetiva extrair do examinando conhecimento acerca do iter criminis e dos crimes praticados por particular contra a administração pública.

      Nesse sentido, relativamente à alternativa “A”, o examinando deve lastrear sua resposta no sentido de que o delito de corrupção ativa (artigo 333 do CP) é crime formal que não admite, via de regra, a modalidade tentada (exceto, como exemplo recorrente na doutrina, se o crime for praticado via escritos). Além disso, levando em conta a narrativa do enunciado, percebe-se que o delito em análise sequer teve o início da execução e, muito menos, atingiu a consumação. Isso porque a corrupção ativa somente se consuma com o efetivo oferecimento ou promessa de vantagem indevida, o que não ocorreu no caso narrado.

      Consequentemente, a conduta levada a efeito por Gustavo é atípica.

      No que se refere a alternativa “B”, por sua vez, o examinando deve indicar que caso Gustavo pagasse a quantia solicitada pelo policial ele não responderia por corrupção ativa pelo simples fato de que tal conduta sequer está descrita no tipo penal do artigo 333 do CP, configurando, portanto, fato atípico.
    itens:
      - n: A
        descricao: Não, pois o delito de corrupção ativa, da maneira como foi narrado, não admite a modalidade tentada. (0,30) / Ademais, como sequer houve a prática de qualquer das condutas descritas no tipo penal, o fato é atípico. (0,40) OU Não, pois o agente não iniciou a execução do delito objetivado. (0,30) / Inclusive, como sequer houve a prática de qualquer das condutas descritas no tipo penal, o fato é atípico. (0,40)
        valores: [ 0, 0.3, 0.4, 0.7 ]
        componentes:
          - { id: c1, valor: 0.3, alternativas: [ [ nao admite, tentativa | tentada ], [ nao iniciou, execucao ], [ cogitacao ], [ formal ] ], rotulo: "Corrupção ativa, como narrada, não admite tentativa OU não houve início da execução" }
          - { id: c2, valor: 0.4, termos: [ atipic* ] }
      - n: B
        descricao: Não, pois nessa hipótese a conduta não está prevista no tipo penal. (0,55) OU Não, pois nessa hipótese a conduta é atípica. (0,55)
        valores: [ 0, 0.55 ]
        componentes:
          - { id: c1, valor: 0.55, alternativas: [ [ nao esta prevista | nao prevista | nao descrita ], [ atipic* ], [ concussao ] ], rotulo: "Não, pois a conduta (pagar o que foi exigido) não está prevista no tipo / é atípica" }
  - n: 2
    enunciado: |-
      Antônio, auxiliar de serviços gerais de uma multinacional, nos dias de limpeza, passa a observar uma escultura colocada na mesa de seu chefe. Com o tempo, o desejo de ter aquele objeto fica incontrolável, razão pela qual ele decide subtraí-lo.

      Como Antônio não tem acesso livre à sala onde a escultura fica exposta, utiliza-se de uma chave adaptável a qualquer fechadura, adquirida por meio de um amigo chaveiro, que nada sabia sobre suas intenções.

      Com ela, Antônio ingressa na sala do chefe, após o expediente de trabalho, e subtrai a escultura pretendida, colocando-a em sua bolsa.

      Após subtrair o objeto e sair do edifício onde fica localizada a empresa, Antônio caminha tranquilamente cerca de 400 metros. Apenas nesse momento é que os seguranças da portaria suspeitam do ocorrido. Eles acham estranha a saída de Antônio do local após o expediente (já que não era comum a realização de horas extras), razão pela qual acionam policiais militares que estavam próximos do local, apontando Antônio como suspeito. Os policiais conseguem alcançá-lo e decidem revistá-lo, encontrando a escultura da sala do chefe na sua bolsa. Preso em flagrante, Antônio é conduzido até a Delegacia de Polícia.

      Antônio, então, é denunciado e regularmente processado. Ocorre que, durante a instrução processual, verifica-se que a escultura subtraída, apesar de bela, foi construída com material barato, avaliada em R$ 250,00 (duzentos e cinquenta reais), sendo, portanto, de pequeno valor. A FAC (folha de antecedentes criminais) aponta que Antônio é réu primário.

      Ao final da instrução, em que foram respeitadas todas as exigências legais, o juiz, em decisão fundamentada, condena Antônio a 2 (dois) anos de reclusão pela prática do crime de furto qualificado pela utilização de chave falsa, consumado, com base no artigo 155, § 4º, III, do CP.

      Nesse sentido, levando em conta apenas os dados contidos no enunciado, responda aos itens a seguir.

      **A) É correto afirmar que o crime de furto praticado por Antônio atingiu a consumação? Justifique. (Valor:**

      0,40)

      **B) Considerando que Antônio não preenche os requisitos elencados pelo STF e STJ para aplicação do princípio da insignificância, qual seria a principal tese defensiva a ser utilizada em sede de apelação? Justifique. (Valor: 0,85)**

      O examinando deve fundamentar corretamente sua resposta. A simples menção ou transcrição do dispositivo legal não pontua.
    gabarito_comentado: |-
      A questão trata do crime de furto e busca extrair do examinando conhecimento específico sobre dois pontos importantes acerca do tema: o momento consumativo do delito e a incidência do privilégio. A primeira indagação tem cunho eminentemente teórico, enquanto a segunda é de caráter prático, pois exige que o examinando saiba interpretar informações dadas no enunciado e, a partir delas, identificar a incidência do privilégio, o que será capaz de reduzir significativamente a resposta penal a ser dada ao personagem da questão. Nesse sentido, para fazer jus aos pontos relativos ao item “A” o examinando deve responder afirmativamente, indicando que o furto atingiu a consumação. Com efeito, diversas teorias existem sobre o momento consumativo do crime de furto, sendo certo que a predominante, tanto na doutrina quanto na jurisprudência dos Tribunais Superiores, é a Teoria da Amotio, segundo a qual a consumação ocorre quando a coisa subtraída passa para o poder do agente, mesmo que num curto espaço de tempo – tal como ocorreu no caso narrado -, independentemente de deslocamento ou posse mansa e pacífica da coisa. Também merece destaque, embora não seja o entendimento majoritário, reflexão sobre o momento consumativo do crime de furto narrado no enunciado com a adoção da Teoria da Ablatio.

      Perceba-se que ainda assim a resposta seria a mesma: o furto foi consumado. Isso porque, para aqueles que adotam a Teoria da Ablatio, o furto consuma-se quando o agente, depois de apoderar-se da coisa, consegue deslocá-la de um lugar para o outro – fato que, da mesma forma, foi narrado no enunciado. Cabe ressaltar que a Banca Examinadora, com o intuito de privilegiar a demonstração de conhecimento jurídico, aceitará como justificativa correta ambas as fundamentações acima expostas, sem perder de vista que os Tribunais Superiores adotam a Teoria da Amotio. Pelo mesmo motivo, entretanto, não será pontuada a resposta que traga apenas a afirmativa “sim”, desprovida de qualquer justificativa ou mesmo com justificativa equivocada.

      No tocante ao item “B”, para que receba a pontuação respectiva, o examinando deve indicar que de acordo com a questão, desconsiderando a argumentação no sentido de aplicação do princípio da insignificância (que pelo próprio enunciado afigura-se como inaplicável), a principal tese defensiva deve ser o reconhecimento do furto qualificado e privilegiado (artigo 155, § 2º, c/c artigo 155, § 4º, III, ambos do CP).

      Isso porque a qualificadora da utilização de chave falsa possui natureza objetiva, sendo compatível com o furto privilegiado, que é de ordem subjetiva. O reconhecimento do furto privilegiado ou mínimo deve ser o argumento defensivo em sede de apelação por trazer vários benefícios a Antônio como a substituição da pena de reclusão pela pena de detenção, a diminuição da pena de um a dois terços ou aplicação da pena de multa. Cabe destacar que há muito tempo a controvérsia sobre a possibilidade de furto privilegiado e qualificado foi superada, existindo diversos julgados tanto no STF quanto no STJ sobre o tema. Inclusive, o próprio STF, no Informativo 580, manifestou-se sobre a possibilidade de tal combinação, sendo, portanto, a melhor tese defensiva.
    itens:
      - n: A
        descricao: Sim, porque a subtração foi completa, já que a res furtiva foi encontrada na bolsa de Antônio, havendo perda da disponibilidade por parte do proprietário do bem subtraído (0,40).
        valores: [ 0, 0.4 ]
        componentes:
          - { id: c1, valor: 0.4, termos: [ consum*, disponibilidade | inversao da posse | subtracao foi completa ] }
      - n: B
        descricao: "Antônio tem direito ao reconhecimento do furto privilegiado (0,65), conforme o artigo 155, § 2º do CP (0,20). Obs.: A simples menção do dispositivo legal não pontua."
        valores: [ 0, 0.65, 0.85 ]
        componentes:
          - { id: c1, valor: 0.65, termos: [ furto privilegiado | privilegio | privilegiado ] }
          - { id: c2, valor: 0.2, dispositivo: [ "art. 155, § 2º, CP" ], requer: c1 }
  - n: 3
    enunciado: |-
      Jeremias foi preso em flagrante, no Aeroporto Internacional de Arroizinhos, quando tentava viajar para Madri, Espanha, transportando três tabletes de cocaína. Quando já havia embarcado na aeronave, foi "convidado" por Agentes da Polícia Federal a se retirar do avião e acompanhá-los até o local onde se encontravam as bagagens. Lá chegando, foi solicitado a Jeremias que reconhecesse e abrisse sua bagagem, na qual foram encontrados, dentro da capa que acondicionava suas pranchas de surf, três tabletes de cocaína. Por essa razão, Jeremias foi processado e, ao final, condenado pela Justiça Federal de Arroizinhos por tráfico internacional de entorpecentes.

      Após o trânsito em julgado da sentença condenatória, foi expedido o mandado de prisão e Jeremias foi recolhido ao estabelecimento prisional sujeito à administração estadual, já que em Arroizinhos não há estabelecimento prisional federal. Transcorrido o prazo legal e, tendo em vista que Jeremias preenchia os demais requisitos previstos na legislação, seu advogado deseja requerer a mudança para regime prisional menos severo.

      Responda de forma fundamentada, de acordo com a jurisprudência sumulada dos Tribunais Superiores:

      Qual Justiça é competente para processar e julgar o pedido de Jeremias? (Valor: 1,25)

      A mera indicação da Súmula não pontua.
    gabarito_comentado: |-
      Não obstante Jeremias ter sido condenado pela Justiça Federal, a competência para o processamento do pedido é da Justiça Estadual, haja vista que Jeremias cumpre pena em estabelecimento sujeito à jurisdição ordinária; daí a transferência de competência da execução penal para a Justiça Estadual, conforme preceitua a Súmula 192 do Superior Tribunal de Justiça.

      SÚMULA 192 - Compete ao Juízo das Execuções Penais do Estado a execução das penas impostas a sentenciados pela Justiça Federal, Militar ou Eleitoral, quando recolhidos a estabelecimentos sujeitos à administração estadual.
    itens:
      - n: A
        descricao: A competência é da Justiça Estadual (0,85), conforme preceitua a Súmula 192 do STJ (0,40).
        componentes:
          - { id: c1, valor: 0.85, termos: [ justica estadual | juizo estadual | vara de execucoes estadual | juizo da execucao estadual ] }
          - { id: c2, valor: 0.4, dispositivo: [ Súmula 192 STJ ], requer: c1 }
  - n: 4
    enunciado: |-
      Pedro foi preso em flagrante por tráfico de drogas. Após a instrução probatória, o juiz ficou convencido de que o réu, por preencher os requisitos do artigo 33, § 4º, da lei 11.343/2006, merecia a redução máxima da pena. Na sentença penal condenatória, fixou o regime inicialmente fechado ao argumento de que o artigo 2º, § 1º, da lei 8.072/90, assim determina, vedando a conversão da pena privativa de liberdade em pena restritiva de direitos, com base no próprio artigo 33, § 4º, da lei 11.343/2006. O advogado de Pedro é intimado da sentença.

      À luz da jurisprudência do STF, responda aos itens a seguir.

      **A) Cabe ao advogado de defesa a impugnação da fixação do regime inicial fechado, fixado exclusivamente com base no artigo 2º, § 1º, da Lei nº 8.072/90? (Valor: 0,60)**

      **B) Com relação ao tráfico-privilegiado, previsto na Lei nº 11.343/06, artigo 33, § 4º, é possível a conversão da pena privativa de liberdade em pena restritiva de direitos? (Valor: 0,65)**

      O examinando deve fundamentar corretamente sua resposta. A simples menção ou transcrição do dispositivo legal não pontua.
    gabarito_comentado: |-
      A questão objetiva extrair do examinando conhecimento atualizado acerca da jurisprudência do STF.

      Nesse sentido, relativamente ao item A, a resposta deve ser lastreada no sentido de que cabe, sim, impugnação ao regime inicial fechado, fixado exclusivamente com base no artigo 2º, § 1º, da Lei nº 8.072/90. Isso porque o STF, no HC 111.840/ES, declarou inconstitucional a previsão, na Lei dos Crimes Hediondos, da exigência da fixação do regime inicial fechado. Na oportunidade a Corte se manifestou no sentido de que a definição do regime deveria sempre ser analisada independentemente da natureza da infração. A CRFB/88 contemplaria as restrições aplicadas à Lei nº 8.072/90, dentre as quais não estaria a obrigatoriedade de imposição de regime extremo para início de cumprimento de pena. Tal posicionamento vem sendo reiterado pela Suprema Corte, sendo certo que a fixação do regime inicialmente fechado deve conter uma fundamentação em concreto, sob pena de ofensa à individualização da pena.

      No tocante ao item B, devemos observar que o STF, no HC 97.256/RS, decidiu que o artigo 33, § 4º, da Lei nº 11.343/2006 é inconstitucional ao vedar a conversão da pena privativa de liberdade em pena restritiva de direitos. Após a reiteração do entendimento pela Suprema Corte foi editada a resolução nº 5 do Senado com o seguinte teor: “artigo 1º - É suspensa a execução da expressão "vedada a conversão em penas restritivas de direitos" do § 4º do artigo 33, da Lei nº 11.343, de 23 de agosto de 2006, declarada inconstitucional por decisão definitiva do Supremo Tribunal Federal nos autos do Habeas Corpus nº 97.256/RS.” Desta forma, é possível a conversão da pena privativa de liberdade em pena restritiva de direitos, desde que o réu preencha os requisitos do artigo 44, do CP.
