  - n: 2
    enunciado: |-
      Ricardo é delinquente conhecido em sua localidade, famoso por praticar delitos contra o patrimônio sem deixar rastros que pudessem incriminá-lo. Já cansando da impunidade, Wilson, policial e irmão de uma das vítimas de Ricardo, decide que irá empenhar todos os seus esforços na busca de uma maneira para prender, em flagrante, o facínora.

      Assim, durante meses, se faz passar por amigo de Ricardo e, com isso, ganhar a confiança deste. Certo dia, decidido que havia chegada a hora, pergunta se Ricardo poderia ajudá-lo na próxima empreitada. Wilson diz que elaborou um plano perfeito para assaltar uma casa lotérica e que bastaria ao amigo seguir as instruções. O plano era o seguinte: Wilson se faria passar por um cliente da casa lotérica e, percebendo o melhor momento, daria um sinal para que Ricardo entrasse no referido estabelecimento e anunciasse o assalto, ocasião em que o ajudaria a render as pessoas presentes. Confiante nas suas próprias habilidades e empolgado com as ideias dadas por Wilson, Ricardo aceita. No dia marcado por ambos, Ricardo, seguindo o roteiro traçado por Wilson, espera o sinal e, tão logo o recebe, entra na casa lotérica e anuncia o assalto.

      Todavia, é surpreendido ao constatar que tanto Wilson quanto todos os “clientes” presentes na casa lotérica eram policiais disfarçados. Ricardo acaba sendo preso em flagrante, sob os aplausos da comunidade e dos demais policiais, contentes pelo sucesso do flagrante. Levado à delegacia, o delegado de plantão imputa a Ricardo a prática do delito de roubo na modalidade tentada.

      Nesse sentido, atento tão somente às informações contidas no enunciado, responda justificadamente:

      **A) Qual a espécie de flagrante sofrido por Ricardo? (Valor: 0,80 )**

      **B) Qual é a melhor tese defensiva aplicável à situação de Ricardo relativamente à sua responsabilidade jurídicopenal? (Valor: 0,45 )**
    gabarito_comentado: |-
      A situação narrada configura hipótese de flagrante preparado (ou provocado). Tal prisão em flagrante é nula e deve ser imediatamente relaxada, haja vista o fato de ter sido preparada por um agente provocador, que adotou medidas aptas a impedir por completo a consumação do crime.

      Inclusive, o Verbete 145 da Súmula do STF disciplina que nas situações como a descrita no enunciado inexiste crime.

      Aplica-se, também, o Art. 17 do Código Penal: o flagrante preparado constitui hipótese de crime impossível.

      Sendo assim, a melhor tese defensiva aplicável a Ricardo é aquela no sentido de excluir a prática de crime com base no Verbete 145, da Súmula do STF, e no Art. 17, do Código Penal.

      Note-se que o enunciado da questão deixa claro que busca a melhor tese defensiva no campo jurídico-penal. Assim, eventuais respostas indicativas de soluções no âmbito processual (tais como: prisão ilegal que deve ser relaxada), ainda que corretas, não serão consideradas para efeito de pontuação, haja vista o fato de não responderem ao questionado.

      DIREITO PENAL
    itens:
      - n: A
        descricao: "- Flagrante preparado (ou provocado) (0,50), pois houve a presença da figura do agente provocador que adotou medidas impeditivas à consumação do crime (0,30). Obs.: o correto desenvolvimento, dissociado da indicação da correta espécie de flagrante (ou mesmo de indicação errônea) não será pontuado."
        valores: [ 0, 0.5, 0.8 ]
        componentes:
