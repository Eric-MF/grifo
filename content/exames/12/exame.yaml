        valores: [ 0, 0.35, 0.45 ]
        componentes:
          - { id: c1, valor: 0.35, alternativas: [ [ crime impossivel ], [ atipic* ] ] }
          - { id: c2, valor: 0.1, dispositivo: [ Súmula 145 STF ], requer: c1 }
  - n: 3
    enunciado: |-
      Félix, objetivando matar Paola, tenta desferir-lhe diversas facadas, sem, no entanto, acertar nenhuma.

      Ainda na tentativa de atingir a vítima, que continua a esquivar-se dos golpes, Félix, aproveitando-se do fato de que conseguiu segurar Paola pela manga da camisa, empunha a arma. No momento, então, que Félix movimenta seu braço para dar o golpe derradeiro, já quase atingindo o corpo da vítima com a faca, ele opta por não continuar e, em seguida, solta Paola, que sai correndo sem ter sofrido sequer um arranhão, apesar do susto.

      Nesse sentido, com base apenas nos dados fornecidos, poderá Félix ser responsabilizado por tentativa de homicídio? Justifique. (Valor: 1,25)

      A resposta que contenha apenas as expressões “sim” ou “não” não será pontuada, bem como a mera indicação de artigo legal ou a resposta que apresente teses contraditórias.
    gabarito_comentado: O examinando deve responder que Félix não deve ser responsabilizado por tentativa de homicídio, pois a hipótese narrada enquadra-se naquela descrita no Art. 15, do CP, em sua primeira parte, ou seja, trata do instituto da desistência voluntária. Isso porque, conforme narrado no enunciado, percebe-se que o agente (Félix), desistiu de prosseguir na execução do delito quando ainda lhe sobrava, do ponto de vista objetivo, margem de ação. Assim, conforme o dispositivo legal supracitado, Félix responderia apenas por eventuais atos praticados. Note-se, entretanto, que os atos praticados pelo agente não traduzem a prática de crime, razão pela qual Félix não responde por nada.
    itens:
      - n: A
        descricao: Félix não responde por tentativa de homicídio, pois agiu em hipótese de desistência voluntária (1,00), instituto descrito na primeira parte do Art. 15 do CP (0,25).
        componentes:
          - { id: c1, valor: 1, termos: [ desistencia voluntaria ] }
          - { id: c2, valor: 0.25, dispositivo: [ art. 15 CP ], requer: c1 }
  - n: 4
    enunciado: |-
      Marcos, jovem inimputável conforme o Art. 26 do CP, foi denunciado pela prática de determinado crime.

      Após o regular andamento do feito, o magistrado entendeu por bem aplicar medida de segurança consistente em internação em hospital psiquiátrico por período mínimo de 03 (três) anos. Após o cumprimento do período supramencionado, o advogado de Marcos requer ao juízo de execução que seja realizado o exame de cessação de periculosidade, requerimento que foi deferido. É realizada uma rigorosa perícia, e os experts atestam a cura do internado, opinando, consequentemente, por sua desinternação. O magistrado então, baseando-se no exame pericial realizado por médicos psiquiatras, exara sentença determinando a desinternação de Marcos. O Parquet, devidamente intimado da sentença proferida pelo juízo da execução, interpõe o recurso cabível na espécie.

      A partir do caso apresentado, responda, fundamentadamente, aos itens a seguir.

      **A) Qual o recurso cabível da sentença proferida pelo magistrado determinando a desinternação de Marcos? (Valor: 0,75)**

      **B) Qual o prazo para interposição desse recurso? (Valor: 0,25)**

      **C) A interposição desse recurso suspende ou não a eficácia da sentença proferida pelo magistrado? (Valor: 0,25)**
    gabarito_comentado: |-
      A) Como se trata de decisão proferida pelo juiz da execução penal, o recurso cabível é o Agravo, previsto no Art. 197, da Lei de Execução Penal - 7.210/84.

      B) O prazo para a interposição do recurso é de 05 (cinco) dias, contados da data da publicação da decisão no D.O., conforme dispõem as Súmulas do STF 699 e 700.

      SÚMULA 699 - O PRAZO PARA INTERPOSIÇÃO DE AGRAVO, EM PROCESSO PENAL, É DE CINCO DIAS, DE ACORDO COM A LEI 8038/1990, NÃO SE APLICANDO O DISPOSTO A RESPEITO NAS ALTERAÇÕES DA LEI 8950/1994 AO CÓDIGO DE PROCESSO CIVIL.

      SÚMULA 700 - É DE CINCO DIAS O PRAZO PARA INTERPOSIÇÃO DE AGRAVO CONTRA DECISÃO DO JUIZ DA EXECUÇÃO PENAL.

      C) Via de regra, o recurso de Agravo em Execução não tem efeito suspensivo, conforme previsão do Art. 197, da LEP. Todavia, a hipótese tratada no enunciado é a única exceção à regra supramencionada, i.e., o agravo possui, na hipótese do enunciado, efeito suspensivo, conforme previsto no Art. 179, da LEP.

      Portanto, a interposição desse recurso suspende a eficácia da sentença.

      DIREITO PENAL
