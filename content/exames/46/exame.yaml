  - n: 3
    enunciado: |-
      Luana, primária, cumpria pena após ter sido, definitivamente, condenada a uma pena de quatro anos, em regime semiaberto, pelo delito de tortura. A apenada se evadiu do sistema penitenciário no dia 10/01/2021, depois de cumprir dois anos e um mês da pena.

      O Juízo, após constatar a fuga, expediu mandado de prisão em desfavor de Luana, o qual foi cumprido em 10/02/2025. Luana foi submetida a regular processo administrativo disciplinar, que concluiu pela prática de falta grave, nos termos do Art. 50, inciso II, da LEP, tendo sido determinada a perda da totalidade dos dias remidos.

      Na defesa de Luana, responda às questões a seguir.

      **A) Qual tese correta de Direito Penal deve ser usada a fim de defender a extinção do processo de execução penal? Fundamente. (Valor: 0,65)**

      **B) Qual o fundamento a ser utilizado para impugnar a parte da decisão que impõe a perda dos dias remidos? Justifique. (Valor: 0,60)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A questão exige do examinando conhecimentos sobre prescrição e execução penal.

      A) A extinção da punibilidade pela ocorrência de prescrição da pretensão executória, pois o prazo restante da pena é inferior a dois anos, remetendo-se ao prazo prescricional de quatro anos, lapso temporal já decorrido entre a data da fuga e da recaptura, nos termos do Art. 109, inciso V, (ou) o Art. 113, (ou) o Art. 117, inciso V, todos do Código Penal.

      B) A falta grave apenas permite a revogação de até um terço dos dias remidos, nos termos do Art. 127 da LEP.
    itens:
      - n: A
        descricao: A extinção da punibilidade pela ocorrência de prescrição da pretensão executória (0,35), pois o prazo restante da pena é inferior a dois anos, remetendo-se ao prazo prescricional de 4 anos, lapso temporal já decorrido entre a data da fuga e da recaptura (0,20), nos termos do Art. 109, inciso V, (ou) o Art. 113, (ou) o Art. 117, inciso V, todos do Código Penal (0,10).
        valores: [ 0, 0.2, 0.3, 0.35, 0.45, 0.55, 0.65 ]
