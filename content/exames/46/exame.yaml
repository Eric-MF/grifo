          - { id: c3, valor: 0.65, termos: [ atipic* | atos preparatorios | ato preparatorio ] }
      - n: B
        descricao: Inconstitucionalidade da lei municipal, pois apenas a União pode legislar sobre Direito Processual Penal ou por violação aos princípios do devido processo legal ou presunção de inocência, ou ampla defesa ou contraditório (0,50), nos termos do Art. 22, inciso I, ou do Art. 5º, incisos LIV, ou LV, ou LVII, ambos da CRFB/88 (0,10).
        valores: [ 0, 0.5, 0.6 ]
