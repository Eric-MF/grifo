peca:
  nome: Resposta à Acusação
  tipo: resposta-acusacao
  aliases: []
  enunciado: |-
    Jorge foi denunciado como incurso nas penas do crime de milícia privada, previsto no Art. 288-A do CP, sendo acusado de integrar a milícia constituída por Adilson, que domina a região da Zona Leste da cidade de Flores, Estado de Campo Belo.

    De acordo com a inicial acusatória, Adilson constituiu uma milícia privada, fortemente armada, com o intuito de explorar a prática de jogos de azar, contravenção penal prevista no Art. 50 do Decreto-Lei nº 3.688/1941. Assim, os membros da sua milícia teriam funções variadas de segurança, tais como arrecadação e “apontadores”, todas essenciais para a consecução do fim do grupo que é a exploração do jogo ilícito naquela região.

    A denúncia relatou que policiais militares, em patrulhamento de rotina na Zona Leste, legitimamente abordaram Jorge e, na abordagem, nada ilícito foi localizado. Contudo, os policiais haviam recebido uma denúncia anônima no sentido de que Jorge era integrante da milícia, razão pela qual passaram a vasculhar o celular dele, sem sua autorização, localizando diversas mensagens para Adilson, a quem Jorge se referia como “chefe”, no aplicativo de troca de mensagens.

    Por isso, com base nos dados extraídos do telefone celular de Jorge pelos policiais militares, a denúncia foi oferecida, sem que fosse esclarecida qual a função de Jorge dentro da milícia privada. O rol de testemunhas incluía os policiais militares que participaram da abordagem, soldado Garcia e sargento Andrade.

    O Juiz competente da Vara Criminal de Flores recebeu a denúncia e determinou a citação do denunciado.

    Jorge foi citado no dia 8 de junho de 2026, segunda-feira, sendo certo que todos os dias são úteis em todo o país, exceto sábados e domingos.

    Jorge apresentou a você, na condição de advogado(a), dez amigos (identificados como “Amigo” 1 a 10) que poderiam abonar o seu caráter.

    **Considerando apenas as informações narradas, na condição de advogado(a) de Jorge, redija a peça jurídica cabível, diferente de habeas corpus, considerando que a decisão não padece de vícios de contradição, omissão, obscuridade ou ambiguidade, apresentando todas as teses jurídicas pertinentes. A peça deverá ser datada no último dia do prazo para apresentação. (Valor: 5,00)**

    *Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples menção ou transcrição do dispositivo legal não confere pontuação.*
  gabarito_comentado: |-
    De acordo com o exposto na situação apresentada, considerando que o acusado foi citado, deve o examinando apresentar resposta à acusação, com fundamento no Art. 396 ou no Art. 396-A, ambos do CPP, elaborando petição direcionada para o Juízo da Vara Criminal da Comarca de Flores, Estado de Campo Belo.

    Deveria ser indicado pelo examinando que o prazo de apresentação da peça é de dez dias, na forma do Art. 396 do CPP.

    Inicialmente, deve haver a rejeição da denúncia por inépcia da petição inicial, na forma do Art. 395, inciso I, do CPP.

    De fato, nos termos do Art. 41 do CPP, a denúncia deve conter a exposição do fato criminoso. Observa-se que a denúncia não imputa qualquer fato criminoso, qualquer conduta típica atribuível a Jorge, e não esclarece qual a função dele dentro da milícia privada.

    Igualmente, não há justa causa para a deflagração da ação penal, pois inexiste qualquer prova lícita de que Jorge efetivamente pertença à milícia privada, pelo que se impõe a rejeição da denúncia, nos termos do Art. 395, inciso III, do CPP. Há de se ressaltar que os dados telemáticos armazenados em aparelho eletrônico somente podem ser acessados se autorizados por ordem judicial, nos termos do Art. 5º, inciso XII, da CRFB/88. Assim, há ilicitude no meio de obtenção da prova, a qual deve ser desentranhada do processo, nos termos do Art. 157 do CPP e/ou Art. 5º, inciso LVI, da CRFB/88.

    No mérito, há atipicidade formal da conduta, diante da inexistência de crime previsto no Código Penal que dê respaldo à formação da milícia privada na forma descrita na inicial. Com efeito, o tipo penal do Art. 288-A exige que a formação da milícia tenha por fim a prática de crimes previstos no Código Penal, mas, como a milícia tinha por escopo a prática de contravenção penal, prevista em lei especial, impõe-se a absolvição sumária do acusado, pois o fato evidentemente não constitui crime.

    Em razão de todo o exposto, deve o examinando formular, em conclusão, os pedidos de:

    1) Desentranhamento da prova ilícita, nos termos do Art. 157 do CPP e/ou Art. 5º, inciso LVI, da CRFB/88.

    2) Rejeição da denúncia por inépcia da petição inicial na forma do Art. 395, inciso I, do CPP.

    3) Rejeição da denúncia por ausência de justa causa, na forma do Art. 395, inciso III, do CPP.

    4) Absolvição sumária em razão de o fato não constituir infração penal, na forma do Art. 397, inciso III, do CPP.

    Deve o examinando apresentar, ainda, o rol de testemunhas, no máximo oito, conforme o Art. 401 do CPP.

    A data a ser indicada ao final era o dia 18 de junho de 2026, tendo em vista que a previsão do prazo da resposta à acusação é de dez dias. Como a citação foi em uma segunda-feira, o prazo se encerraria na quinta-feira da semana seguinte.

    No fechamento, deve o examinando indicar local, data, advogado e OAB.
