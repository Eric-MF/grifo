          - { id: c2, valor: 0.2, termos: [ prazo restante | inferior a dois anos | menor que dois anos | menos de dois anos | menor de dois anos, 4 anos | quatro anos ] }
          - { id: c3, valor: 0.1, dispositivo: [ "art. 109, V, CP", "art. 113, CP", "art. 117, V, CP" ], requer: c2 }
      - n: B
