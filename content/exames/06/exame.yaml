        descricao: Resposta à acusação (0,1), no prazo de 10 dias (art. 406 do CPP) (0,1), endereçada ao Juiz da Vara Criminal / do Júri (0,1). OU Habeas Corpus para extinção da ação penal (0,1); que não possui prazo determinado (0,1); endereçado ao Tribunal de Justiça (0,1).
        valores: [ 0, 0.1, 0.2, 0.3 ]
