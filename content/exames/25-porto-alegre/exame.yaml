          - { id: c3, valor: 0.1, dispositivo: [ "art. 4, CPP", "art. 27, CPP", "art. 228, CRFB" ], requer: c2 }
      - n: B
        descricao: O requerimento a ser formulado é de substituição da prisão preventiva por prisão domiciliar (0,50), nos termos do Art. 318, inciso IV, do CPP (0,10).
