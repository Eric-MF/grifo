questoes:
  - n: 1
    enunciado: |-
      Pedro foi denunciado por furto mediante fraude e lavagem de capitais porque, graças à fraude em dispositivo informático, conseguiu subtrair o montante de R$ 500.000,00 de determinada instituição financeira nacional.

      De acordo com a investigação, Pedro praticou o delito de lavagem de capitais porque depositou o valor subtraído em sua conta-corrente, conforme se comprovou pela quebra de sigilo bancário autorizada judicialmente.

      **Com base em tais fatos, o Juiz deferiu o sequestro do imóvel de Pedro, avaliado no valor de R$ 2.000.000,00 e adquirido dez anos antes dos fatos, e recebeu a denúncia pelos tipos penais apontados.**

      **Como advogado(a) de Pedro, responda às questões a seguir.**

      **A) Apresente o argumento jurídico cabível em favor de Pedro a fim de desconstituir o sequestro de seu imóvel. Justifique. (Valor: 0,60)**

      **B) Em face da acusação de lavagem de capitais, qual é a tese de Direito Penal a ser sustentada? Justifique. (Valor: 0,65)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A questão exige do examinando conhecimentos sobre os temas de lavagem de capitais e sequestro.

      A) O sequestro é a medida assecuratória cabível em face de bens que constituam proveito da infração penal, nos moldes do Art. 125 do CPP. No caso relatado no enunciado, o bem imóvel foi adquirido antes da infração penal e possui valor muito superior ao proveito econômico da infração. Assim, nos termos do Art. 130, inciso I, do CPP ou do Art. 4º, § 2º, da Lei nº 9.613/1998, não é cabível o sequestro de bens que não foram adquiridos com os proventos da infração.

      B) Atipicidade da conduta, uma vez que o recebimento da quantia obtida como vantagem econômica configura mero exaurimento do delito antecedente, não tendo havido nenhum ato de ocultação ou dissimulação dos valores, nos termos do Art. 1º da Lei nº 9.613/1998.
    itens:
      - n: "A"
        descricao: "O sequestro só alcança bens adquiridos com o proveito da infração; o imóvel foi adquirido dez anos antes e vale muito mais que o proveito (0,50), nos termos do art. 125 ou do art. 130, I, do CPP, ou do art. 4º, § 2º, da Lei nº 9.613/1998 (0,10)."
        componentes:
          - { id: c1, valor: 0.5, termos: [ sequestro, "proveito | proventos | adquirid* antes | anterior* | licit* | origem licita" ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 125, CPP", "art. 130, I, CPP", "art. 4º, § 2º, Lei 9613" ], requer: c1 }
      - n: "B"
        descricao: "Atipicidade da lavagem: o depósito do valor em conta própria é mero exaurimento do crime antecedente, sem ocultação ou dissimulação (0,55), nos termos do art. 1º da Lei nº 9.613/1998 (0,10)."
        componentes:
          - { id: c1, valor: 0.55, termos: [ "atipic* | nao ha crime | nao configura", "exaurimento | ocultac* | dissimulac*" ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 1º, Lei 9613" ], requer: c1 }
  - n: 2
    enunciado: |-
      André, funcionário público, primário e sem anotações criminais, recebeu um veículo do órgão público para uso em serviço.

      Ao usá-lo, André, deixando de adotar as cautelas que lhe seriam exigíveis, estacionou o veículo em uma rua próxima ao local de trabalho com as chaves no seu interior, acreditando que nada fosse acontecer. A sua conduta negligente permitiu que um terceiro subtraísse o referido veículo, causando prejuízo ao órgão público.

      André foi prontamente denunciado pelo delito de peculato culposo (Art. 312, §2º, do CP) perante o Juízo ordinariamente competente, sendo certo que a denúncia foi devidamente instruída pelo inquérito policial correspondente. Citado, André ofereceu resposta à acusação, ocasião em que efetuou o pagamento da restituição integral do valor do prejuízo sofrido pelo ente público.

      **Você, como advogado(a) na defesa de André, responda às questões a seguir.**

      **A) Qual é a tese de Direito Penal a ser sustentada pela defesa de André a fim de garantir a extinção de sua punibilidade? Fundamente. (Valor: 0,65)**

      **B) Antes da denúncia, qual benefício processual deveria ter sido ofertado a André? Fundamente. (Valor:**

      0,60)

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A questão exige do examinando conhecimentos sobre Juizados Especiais Criminais e sobre peculato.

      A) No caso narrado, o acusado efetuou a reparação do dano anteriormente à sentença penal irrecorrível, de forma que se impõe a extinção da punibilidade, nos moldes do Art. 312, §3º, do CP.

      B) É cabível a transação penal, diante do fato de a pena máxima cominada ao delito ser inferior a dois anos, nos termos do Art. 76 da Lei nº 9.099/1995.
    itens:
      - n: "A"
        descricao: "Extinção da punibilidade pela reparação do dano antes da sentença irrecorrível (0,55), nos termos do art. 312, § 3º, do CP (0,10)."
        componentes:
          - { id: c1, valor: 0.55, termos: [ "extin* da punibilidade | extingue a punibilidade | extinta a punibilidade", "repara* | restitui* | ressarc*" ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 312, § 3º, CP" ], requer: c1 }
      - n: "B"
        descricao: "Transação penal, porque a pena máxima do peculato culposo não passa de dois anos (0,50), nos termos do art. 76 da Lei nº 9.099/1995 (0,10)."
        componentes:
          - { id: c1, valor: 0.5, termos: [ transacao penal ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 76, Lei 9099" ], requer: c1 }
  - n: 3
    enunciado: |-
      Maria foi acusada de falsificar os históricos escolares e os diplomas de médico de uma universidade federal, emitidos em favor de Augusto, Bruna, Claudia, Diana, Elizângela, Felipe e Guilherme.

      Todos os sete adquiriram de Maria os referidos documentos falsificados no mês de janeiro de 2025, sendo certo que todos foram elaborados com as mesmas características e o mesmo modo de execução. Assim, Maria foi denunciada e condenada pela falsificação de documento público (Art. 297, caput do CP), por sete vezes, em concurso material (Art. 69 do CP).

      Interposta a apelação, por maioria, o Tribunal manteve a condenação de Maria, nos termos da sentença, sendo certo que o voto vencido acolhia a tese de defesa.

      **Como advogado(a) constituído por Maria, responda às questões a seguir.**

      **A) A fim de reformar a decisão do Tribunal, qual recurso deve ser manejado pela defesa? Fundamente. (Valor: 0,60)**

      **B) A fim de reduzir as penas aplicadas, qual tese de Direito Penal deve ser apresentada? Justifique. (Valor: 0,65)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A questão exige do examinando conhecimentos sobre recursos e concurso de crimes.

      A) A defesa deve apresentar Embargos Infringentes, na forma do Art. 609, parágrafo único, do CPP.

      B) Deve ser aplicada a regra da continuidade delitiva, pois Maria praticou sete crimes da mesma espécie, nas mesmas condições de tempo, de lugar e com o mesmo modo de execução, nos termos do Art. 71 do CP.
    itens:
      - n: "A"
        descricao: "Embargos infringentes (0,50), na forma do art. 609, parágrafo único, do CPP (0,10)."
        componentes:
