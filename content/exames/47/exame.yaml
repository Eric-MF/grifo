          - { id: c2, valor: 0.1, dispositivo: [ "art. 609, parágrafo único, CPP" ], requer: c1 }
      - n: "B"
        descricao: "Continuidade delitiva: sete crimes da mesma espécie, nas mesmas condições de tempo, lugar e modo de execução (0,55), nos termos do art. 71 do CP (0,10)."
        componentes:
          - { id: c1, valor: 0.55, termos: [ "continuidade delitiva | crime continuado | continuado*" ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 71, CP" ], requer: c1 }
  - n: 4
    enunciado: |-
      Guilherme foi acusado de ter subtraído, para si, o celular de Inês. De acordo com a denúncia, Inês estava com a janela do carro abaixada, quando ele passou e subtraiu o celular da vítima, empreendendo fuga em seguida. Por isso, Guilherme foi dado como incurso nas penas do Art. 155, caput, do CP, ressaltando que, por se tratar de acusado reincidente específico, não caberiam medidas consensuais.

      Durante a audiência de instrução e julgamento, Inês prestou depoimento afirmando que ele exigiu, mediante emprego de grave ameaça, a entrega do celular, fato confirmado pelo acusado em seu depoimento, que confessou integralmente a versão apresentada pela vítima.

      Dessa forma, a sentença o condenou pelo delito de roubo, previsto no Art. 157, caput, do CP, tendo em vista as provas surgidas no curso da instrução processual. Assim, foi aplicada a Guilherme a pena-base de quatro anos, agravada em mais seis meses diante da reincidência, fixando a pena definitiva em quatro anos e seis meses de reclusão.

      Você, na condição de advogado(a) de defesa de Guilherme, responda às questões a seguir.

      **A) Qual a tese processual a ser corretamente defendida em favor de Guilherme? Justifique. (Valor: 0,65)**

      **B) A fim de reduzir a pena aplicada a Guilherme, qual tese de Direito Penal deve ser utilizada? Justifique. (Valor: 0,60)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A questão exige do examinando conhecimentos sobre sentença penal e aplicação da pena.

      A) Houve a nulidade da sentença, pois não é possível a utilização de elementar não descrita na denúncia para proferir a sentença condenatória, o que viola o princípio da correlação entre acusação e sentença, nos termos do Art. 384 do CPP.

      B) Deve ser usada a tese de compensação entre a reincidência e a confissão, por se tratarem de circunstâncias igualmente preponderantes, nos termos do Art. 65, inciso III, alínea d, e/ou do Art. 67, ambos do CP.
    itens:
      - n: "A"
        descricao: "Nulidade da sentença: a condenação usou elementar não descrita na denúncia (grave ameaça), violando a correlação entre acusação e sentença (0,55), nos termos do art. 384 do CPP (0,10)."
        componentes:
          - { id: c1, valor: 0.55, termos: [ "nulidade | nula", "correlacao | congruencia | mutatio libelli | aditamento | elementar" ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 384, CPP" ], requer: c1 }
      - n: "B"
        descricao: "Compensação entre a reincidência e a confissão espontânea, circunstâncias igualmente preponderantes (0,50), nos termos do art. 65, III, d, e/ou do art. 67 do CP (0,10)."
        componentes:
          - { id: c1, valor: 0.5, termos: [ compensa*, reincidencia, confissao ] }
