questoes:
  - n: 1
    enunciado: |-
      Caio e Bruno são irmãos e estão em dificuldades financeiras. Caio, que estava sozinho em seu quarto, verifica que a janela da casa dos vizinhos está aberta; então, ingressa no local e subtrai um telefone celular avaliado em R$ 500,00. Ao mesmo tempo, apesar de não saber da conduta de seu irmão, Bruno percebe que a porta da residência dos vizinhos também ficou aberta. Tendo conhecimento que os proprietários eram um casal de empresários muito rico, ingressa no local e subtrai uma bolsa, avaliada em R$ 450,00.

      Os fatos são descobertos dois dias depois, e Bruno e Caio são denunciados pelo crime de furto qualificado (Art. 155, § 4º, inciso IV, do Código Penal), sendo acostadas as Folhas de Antecedentes Criminais (FAC), contendo, cada uma delas, outra anotação pela suposta prática de crime de estelionato, sem, contudo, haver condenação com trânsito em julgado em ambas.

      Após instrução, a pretensão punitiva do Estado é julgada procedente, sendo aplicada pena mínima de 02 anos de reclusão e 10 dias-multa, em regime inicial aberto, devidamente substituída por restritiva de direitos.

      **Com base nas informações expostas, intimado(a) para apresentação de recurso, responda, na condição de advogado(a) de Caio e Bruno, aos itens a seguir.**

      **A) Existe argumento de direito material a ser apresentado para questionar a capitulação jurídica apresentada pelo Ministério Público e acolhida na sentença? (Valor: 0,60)**

      **B) Mantida a capitulação acolhida na sentença (Art. 155, § 4º, inciso IV, do Código Penal), existe argumento em busca da redução da pena aplicada? (Valor: 0,65)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) Sim, a capitulação jurídica realizada pelo Ministério Público e acolhida na sentença poderá ser questionada, tendo em vista que não deveria ter sido imputada a qualificadora do concurso de agentes. O Art. 155, § 4º, inciso IV, do CP prevê qualificadora do furto quando este for praticado mediante concurso de duas ou mais pessoas.

      Ocorre que, apesar de Caio e Bruno serem irmãos e terem praticado crimes de furto no mesmo local, data e horário, não houve concurso de agentes. Dentre os requisitos para configuração do concurso de agentes está o liame subjetivo, que não restou configurado na hipótese apresentada. A todo momento o enunciado deixa claro que Caio e Bruno sequer sabiam da conduta um do outro, não havendo que se falar, então, em comunhão de ações e desígnios e, consequentemente, concurso de agentes, apesar de configurado o crime de furto simples em relação a ambos.

      B) Mesmo em caso de manutenção da capitulação apresentada, ou seja, de furto qualificado, seria possível a redução da pena aplicada em razão do privilégio previsto no Art. 155, § 2º, do CP. Apesar de os agentes responderem a outras ações penais, nos termos da Súmula 444 do STJ, não havendo sentença condenatória anterior com trânsito em julgado, são considerados tecnicamente primários e de bons antecedentes. Ademais, as coisas furtadas podem ser consideradas de pequeno valor, não havendo que se falar em insignificância, na hipótese, seja pelo valor dos bens seja porque o enunciado indaga sobre a redução da pena aplicada e não afastamento da tipicidade da conduta.

      É preciso, ainda, ressaltar que os Tribunais Superiores pacificaram o entendimento de que a figura do furto privilegiado poderá ser reconhecida ainda que o crime em questão seja de furto qualificado, topograficamente localizado após a disciplina do privilégio, nos termos da Súmula 511 do Superior Tribunal de Justiça.
    itens:
      - n: A
        descricao: Sim, o argumento seria pela inexistência de liame subjetivo entre os agentes (0,45), afastando-se a qualificadora do concurso de pessoas (0,15).
        valores: [ 0, 0.15, 0.45, 0.6 ]
        componentes:
          - { id: c1, valor: 0.45, termos: [ liame subjetivo | vinculo subjetivo | acordo de vontades | unidade de designios ] }
          - { id: c2, valor: 0.15, termos: [ concurso de pessoas | concurso de agente*, afast* | exclu* | decote | nao incid* | nao deveria | nao houve ] }
      - n: B
        descricao: Sim, aplicação do furto privilegiado (0,35), já que a coisa é de pequeno valor e os réus são primários (0,20), conforme a Súmula 511 do STJ (0,10).
        valores: [ 0, 0.2, 0.3, 0.35, 0.45, 0.55, 0.65 ]
        componentes:
          - { id: c1, valor: 0.35, termos: [ furto privilegiado | privilegio | privilegiado ] }
          - { id: c2, valor: 0.2, termos: [ pequeno valor, primari* ] }
          - { id: c3, valor: 0.1, dispositivo: [ Súmula 511 STJ ], requer: c2 }
  - n: 2
    enunciado: |-
      No dia 01 de janeiro de 2008, após ingerir bebida alcoólica, Caio, 50 anos, policial militar reformado, efetuou dois disparos de arma de fogo em direção à parede de sua casa vazia, localizada no interior de grande quintal, com arma de sua propriedade, devidamente registrada e com posse autorizada.

      Apesar de os tiros terem sido efetuados em direção ao interior do imóvel, vizinhos que passavam pela rua naquele momento, ao ouvirem os disparos, entraram em contato com a Polícia Militar, que compareceu ao local e constatou que as duas munições deflagradas ficaram alojadas na parede do imóvel, sendo a perícia acostada ao procedimento. Caio obteve liberdade provisória e foi denunciado como incurso nas sanções do Art. 15 da Lei nº 10.826/03, não sendo localizado, porém, por ocasião da citação, por ter mudado de endereço, apesar das diversas diligências adotadas pelo juízo.

      Após não ser localizado, Caio foi corretamente citado por edital e, não comparecendo, nem constituindo advogado, foi aplicado o Art. 366 do Código de Processo Penal, suspendendo-se o processo e o curso do prazo prescricional, em 04 de abril de 2008. Em 06 de julho de 2018, o novo juiz titular da vara criminal competente determinou que fossem realizadas novas diligências na tentativa de localizar o denunciado, confirmando que o processo, assim como o curso do prazo prescricional, deveria permanecer suspenso.

      **Com base nas informações narradas, na condição de advogado(a) de Caio, que veio a tomar conhecimento dos fatos em julho de 2018, responda aos questionamentos a seguir.**

      **A) Existe argumento para questionar a decisão do magistrado que, em julho de 2018, determinou que o processo e o curso do prazo prescricional permanecessem suspensos? (Valor: 0,65)**

      **B) Existe argumento de direito material a ser apresentado em busca da absolvição de Caio? (Valor: 0,60)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      Narra o enunciado que Caio teria efetuado disparos de arma de fogo, no interior de seu quintal, na direção da parede do imóvel em que residia, estando a casa vazia. Ademais, consta a informação que os disparos foram realizados do quintal para o interior da residência, sendo que as munições ficaram alojadas na parede. Os fatos, porém, foram descobertos por policiais militares, vindo Caio a ser denunciado pela suposta prática do crime previsto no Art. 15 da Lei nº 10.826/03.

      A) A decisão do magistrado não foi correta. De fato, uma vez que o denunciado não foi localizado para citação pessoal, seria cabível sua citação por edital. Em consequência, não comparecendo o denunciado e nem constituindo advogado, em razão da natureza de citação ficta, o processo, assim como o curso do prazo prescricional, deve ficar suspenso. Ocorre que uma suspensão indefinida do prazo prescricional acabaria por criar um crime, na prática, imprescritível, o que, de acordo com grande parte da doutrina, não poderia ocorrer através de legislação ordinária. Diante disso, através da Súmula 415 do STJ, foi pacificado o entendimento de que a suspensão do prazo prescricional somente poderia durar o período do prazo prescricional, regulado pela pena máxima do crime imputado. O delito do Art. 15 da Lei nº 10.826/03 tem pena máxima prevista de 04 anos, de modo que o prazo prescricional seria de 08 anos. Desde a suspensão do processo, na forma do Art. 366 do CPP, passaram-se mais de 08 anos, logo o prazo prescricional deveria voltar a correr em abril de 2016, sendo equivocada a decisão do magistrado de, em 2018, determinar que fosse mantida a suspensão do prazo prescricional.

      B) Sim, existe argumento de direito material a ser apresentado pela defesa técnica de Caio em busca de sua absolvição. Deveria o advogado alegar a atipicidade da conduta, tendo em vista que nem todas as elementares do crime do Art. 15 da Lei nº 10.826/03 foram preenchidas. Em que pese tenha Caio realizado disparos de arma de fogo, não haveria que se falar no crime imputado, pois os disparos não foram realizados em via pública e nem em direção à via pública. Apesar de a rua da residência do denunciado ser habitada, os disparos foram realizados dentro de um quintal, em direção à parede da casa onde não havia ninguém. Independentemente de a conduta ser moralmente reprovável, não foi praticado o delito imputado.
    itens:
      - n: A
        secao: ITEM PONTUAÇÂO
        descricao: Sim, a suspensão da prescrição somente poderia durar o período do prazo prescricional, computado de acordo com o máximo da pena em abstrato prevista, voltando a correr em abril de 2016 (0,55), nos termos da Súmula 415 do STJ (0,10).
        valores: [ 0, 0.55, 0.65 ]
        componentes:
          - { id: c1, valor: 0.55, termos: [ suspensao, prescri*, maximo | pena maxima | prazo prescricional ] }
          - { id: c2, valor: 0.1, dispositivo: [ Súmula 415 STJ ], requer: c1 }
      - n: B
        secao: ITEM PONTUAÇÂO
        descricao: Sim, a atipicidade da conduta (0,20), tendo em vista que o disparo não foi realizado em via pública e nem em direção à via pública OU tendo em vista que o disparo não foi realizado em local habitado (0,40).
        valores: [ 0, 0.2, 0.4, 0.6 ]
        componentes:
          - { id: c1, valor: 0.2, termos: [ atipic* ] }
          - { id: c2, valor: 0.4, alternativas: [ [ via publica ], [ local habitado | lugar habitado ] ] }
  - n: 3
    enunciado: |-
      Em patrulhamento de rotina, policiais militares receberam uma informação não identificada de que Wesley, que estava parado em frente à padaria naquele momento, estaria envolvido com o tráfico de drogas da localidade.

      Diante disso, os policiais identificaram e realizaram a abordagem de Wesley, não sendo, em um primeiro momento, encontrado qualquer material ilícito com ele. Diante da notícia recebida momentos antes da abordagem, porém, e considerando que o crime de associação para o tráfico seria de natureza permanente, os policiais apreenderam o celular de Wesley e, sem autorização, passaram a ter acesso às fotografias e conversas no WhatsApp, sendo verificado que existiam fotos armazenadas de Wesley portando suposta arma de fogo, bem como conversas sobre compra e venda de material entorpecente.

      Entendendo pela existência de flagrante em relação ao crime permanente de associação para o tráfico, Wesley foi encaminhado para a Delegacia, sendo lavrado auto de prisão em flagrante. Após liberdade concedida em audiência de custódia, Wesley é denunciado como incurso nas sanções do Art. 35 da Lei nº 11.343/06. No curso da instrução, foram acostadas imagens das conversas de Wesley via aplicativo a que os agentes da lei tiveram acesso, assim como das fotografias. Os policiais foram ouvidos em audiência, ocasião em que confirmaram as circunstâncias do flagrante. O réu exerceu seu direito ao silêncio.

      **Com base nas fotografias acostadas, o juiz competente julgou a pretensão punitiva do estado procedente, aplicando a pena mínima de 03 anos de reclusão, além de multa, e fixando o regime inicial fechado, já que o crime imputado seria equiparado a hediondo. Ainda assim, substituiu a pena privativa de liberdade por restritiva de direitos.**

      **Considerando as informações narradas, responda, na condição de advogado(a) de Wesley, intimado(a) para apresentação de recurso de apelação.**

      **A) Existe argumento a ser apresentado para questionar as provas utilizadas pelo magistrado como fundamento para condenação? Justifique. (Valor: 0,65)**

      **B) Mantida a condenação, qual o argumento a ser apresentado para questionar a sanção penal aplicada? Justifique. (Valor: 0,60)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A questão exige do candidato conhecimento sobre uma pluralidade de temas, destacando-se os temas prova ilícita, Lei nº 11.343/06 e crimes hediondos.

      Narra o enunciado que Wesley foi abordado por policiais militares e, apesar de nada ilícito ter sido encontrado com ele, os policiais, sem autorização, apreenderam seu celular e obtiveram acesso às conversas de Wesley via aplicativo whatsapp e ao álbum de fotografias, onde encontraram imagens de Wesley supostamente com armas de fogo. Com base nesse conteúdo do celular, Wesley foi preso em flagrante, denunciado e condenado como incurso nas sanções penais do Art. 35 da Lei nº 11.343/06.

      A) Sim, existe argumento para questionar as provas que serviram de fundamento para a condenação, tendo em vista que se tratam de provas ilícitas. As provas utilizadas pelo magistrado foram obtidas com violação ao direito à intimidade, já que os policiais obtiveram acesso ao teor das conversas de Wesley por mensagens e suas fotografias sem sua autorização ou sem prévia autorização judicial. Ocorreu violação à garantia de inviolabilidade da intimidade e vida privada, assegurada no Art. 5º, inciso X, da CRFB, já que não houve o indispensável requerimento (e autorização judicial) de quebra de sigilo de dados. Dessa forma, estamos diante de provas ilícitas, que devem ser desentranhadas do processo, nos termos do Art. 157 do CPP.

      B) O argumento a ser apresentado para questionar a sanção penal aplicada é o de que o crime de associação para o tráfico não é delito equiparado ao hediondo, diferente do tráfico do Art. 33, caput, da Lei nº 11.343/06, tendo em vista que não está previsto no rol taxativo do Art. 1º da Lei nº 8.072/90. Em respeito ao princípio da legalidade, não há que se falar em analogia in malam partem. Considerando que o crime de associação para o tráfico não está previsto na Constituição como equiparado a hediondo e nem é mencionado no Art. 1º da Lei de Crimes Hediondos, não pode o magistrado conferir tal natureza em sua decisão, ainda que exista previsão no sentido de que o prazo do livramento condicional será de mais de 2/3, prazo esse típico dos crimes hediondos e equiparados. Ademais, ainda que fosse considerada a natureza hedionda do delito, a previsão de regime inicial fechado obrigatória vem sendo considerada inconstitucional pelos Tribunais Superiores (Art. 2º, § 1º, da Lei nº 8.072/90) por violar o princípio da individualização da pena.
    itens:
