peca:
  nome: Agravo em Execução
  tipo: agravo-execucao
  aliases: []
  enunciado: |-
    Guilherme foi condenado definitivamente pela prática do crime de lesão corporal seguida de morte, sendo-lhe aplicada a pena de 06 anos de reclusão, a ser cumprida em regime inicial fechado, em razão das circunstâncias do fato.

    Após cumprir 01 ano da pena aplicada, Guilherme foi beneficiado com progressão para o regime semiaberto. Na unidade penitenciária, o apenado trabalhava internamente em busca da remição. Durante o cumprimento da pena nesse regime, veio a ser encontrado escondido em seu colchão um aparelho de telefonia celular.

    O diretor do estabelecimento penitenciário, ao tomar conhecimento do fato por meio dos agentes penitenciários, de imediato reconheceu na ficha do preso a prática de falta grave, apenas afirmando que a conduta narrada pelos agentes, e que teria sido praticada por Guilherme, se adequava ao Art. 50, inciso VII, da Lei nº 7.210/84.

    O reconhecimento da falta pelo diretor foi comunicado ao Ministério Público, que apresentou promoção ao juízo da Vara de Execuções Penais de São Paulo, juízo este competente, requerendo a perda de benefícios da execução por parte do apenado. O juiz competente, analisando o requerimento do Ministério Público, decidiu que, “considerando a falta grave reconhecida pelo diretor da unidade, impõe-se: a) a regressão do regime de cumprimento de pena para o fechado; b) perda da totalidade dos dias remidos; c) reinício da contagem do prazo de livramento condicional; d) reinício da contagem do prazo do indulto.”

    Ao ser intimado do teor da decisão, em 09 de julho de 2019, terça-feira, Guilherme entra em contato, de imediato, com você, na condição de advogado(a), esclarecendo que nunca fora ouvido sobre a aplicação da falta grave, apenas tendo conhecimento de que a Defensoria se manifestou no processo de execução após o requerimento do Ministério Público.

    **Considerando apenas as informações narradas, na condição de advogado(a) de Guilherme, redija a peça jurídica cabível, diferente de habeas corpus e embargos de declaração, apresentando todas as teses jurídicas pertinentes.**

    A peça deverá ser datada no último dia do prazo para interposição, considerando que, em todos os locais do país, de segunda a sexta-feira são dias úteis. (Valor: 5,00).

    *Obs.: a peça deve abranger todos os fundamentos de Direito que possam ser utilizados para dar respaldo à pretensão. A simples menção ou transcrição do dispositivo legal não confere pontuação.*
  gabarito_comentado: |-
    O examinando deve redigir, na condição de advogado, recurso de Agravo em Execução, com fundamento no Art. 197 da Lei nº 7.210/84 – Lei de Execução Penal (LEP). Isso porque, nos termos do dispositivo mencionado, das decisões proferidas pelo magistrado em sede de Execução Penal, sempre caberá recurso de agravo, sem efeito suspensivo. No caso, claro está que a decisão a ser combatida foi proferida pelo juiz em atuação na Vara de Execuções Penais de São Paulo, de fato em sede de execução, já que o requerimento formulado pelo Ministério Pública referia-se à perda de benefícios durante execução de pena privativa de liberdade aplicada em sentença penal com trânsito em julgado.

    Apesar de o Art. 197 da LEP trazer a previsão de que o recurso cabível é o de Agravo, não estabelece a Lei nº 7.210/84 qual seria o procedimento a ser seguido, de modo que a doutrina e a jurisprudência pacificaram o entendimento de que seria o mesmo do Recurso em Sentido Estrito. Diante disso, primeiramente deveria o examinando apresentar petição de interposição, direcionada ao Juízo da Vara de Execução Penal da Comarca de São Paulo/SP, com formulação de pedido de retratação por parte do juízo a quo, na forma do Art. 589 do CPP, por analogia. Em caso de não acolhimento, deveria haver requerimento de encaminhamento do feito para instância superior, com as respectivas razões recursais.

    Após, o examinando deveria apresentar Razões do Recurso, direcionadas ao Tribunal de Justiça do Estado de São Paulo, com a fundamentação necessária para rebater a decisão do magistrado de primeira instância.

    Inicialmente, deveria o examinando destacar que o reconhecimento da falta grave não observou as formalidades legais. Nos termos do Art. 50 da Lei 7.210/84, realmente como mencionado pelo diretor do estabelecimento penitenciário, a conduta de esconder celular configura prática de falta grave. Todavia, para assegurar o direito ao exercício do princípio da ampla defesa e do princípio do contraditório, pacificou a jurisprudência o entendimento de que o reconhecimento de falta grave depende de regular procedimento administrativo disciplinar, devidamente assegurado o acompanhamento de defesa técnica. Nesse sentido é o teor da Súmula 533 do Superior Tribunal de Justiça. Na situação apresentada, o diretor do estabelecimento reconheceu a prática de falta grave sem observar as exigências antes mencionadas, ou seja, sem instaurar procedimento administrativo e sem garantir o direito de defesa. Dessa forma, não pode aquele reconhecimento ser considerado pelo juízo da execução.

    Não sendo válido o reconhecimento da prática de falta grave, sequer seria possível a regressão do cumprimento da pena para o regime fechado, apesar de, abstratamente, essa ser uma sanção possível na hipótese de reconhecimento válido de falta grave, nos termos do Art. 118, inciso I, da LEP e Súmula 534 do STJ.

    Superada a invalidade no reconhecimento da falta grave, deveria o examinando destacar que, ainda que o reconhecimento da falta grave fosse considerado válido, impossível seria a sanção de perda da integralidade dos dias remidos.

    O Art. 127 da LEP admite que a punição por falta grave gere perda dos dias remidos. Todavia, o mesmo dispositivo assegura um limite de perda de até 1/3, sendo incorreta a decisão do magistrado que determina a perda de TODOS os dias remidos.

    Da mesma forma, incorreta a decisão que determinou o reinício da contagem do prazo para fins de obtenção de livramento condicional e indulto. A explicação é simples: em que pese muitos defendam que o ideal seria o reinício da contagem desses prazos, fato é que a execução penal está sujeita ao princípio da legalidade, sendo certo que tais sanções não estão previstas na lei. Diante da ausência de previsão legal, não pode o magistrado impor o reinício da contagem do prazo do livramento condicional, nos termos da Súmula 441 do STJ. Pelas mesmas razões, foi editada a Súmula 535 do STJ, prevendo que a prática de falta grave não interrompe o prazo para fins de comutação de pena ou indulto, sem prejuízo de esta ser considerada no momento de analisar o preenchimento dos requisitos subjetivos deste benefício.

    Na conclusão, após o mérito, deveria o examinando apresentar pedido de conhecimento e provimento do recurso, afastando-se o reconhecimento da falta grave e suas consequências.

    Em relação ao prazo, absolutamente pacificado o entendimento de que seria de 05 dias, na forma do Enunciado 700 da Súmula de Jurisprudência do STF. Considerando que a intimação ocorreu em 09 de julho de 2019, terça-feira, o prazo se iniciou em 10 de julho de 2019, quarta-feira, encerrando-se em 15 de julho de 2019, porque 14 de julho de 2019 seria domingo.

    O examinando deve, ainda, concluir sua peça, indicando local, data, advogado e número de OAB.
