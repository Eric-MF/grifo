  - n: 4
    enunciado: |-
      Em processo no qual se imputava a Antônio a prática do crime de constituição de milícia privada, foi designada audiência de instrução e julgamento para oitiva das testemunhas arroladas pela acusação e pela defesa. No dia da audiência, as testemunhas de acusação não compareceram, determinando o magistrado, por economia processual, a oitiva das testemunhas de defesa presentes, apesar de o advogado de Antônio se insurgir contra esse fato. Na ocasião, foram ouvidas três testemunhas de defesa, dentre as quais Pablo, que prestou declarações falsas para auxiliar o colega nesse processo criminal. Identificada sua conduta, porém, houve extração de peças ao Ministério Público, que, em 09 de abril de 2019, ofereceu denúncia em face de Pablo, imputando-lhe a prática do crime de falso testemunho na forma majorada.

      No processo de Antônio, foi designada nova audiência de instrução e julgamento, ocasião em que foram ouvidas as testemunhas de acusação; novamente, Pablo, a seu pedido, prestou declarações, confirmando que havia mentido na audiência anterior, mas que agora contava a verdade, o que veio a prejudicar a própria defesa do réu.

      **Com base nas declarações das testemunhas de acusação e nas novas declarações de Pablo, Antônio veio a ser condenado. Pablo, por sua vez, em seu processo pelo crime de falso testemunho, também veio a ser condenado, reconhecendo o magistrado a atenuante do Art. 65, inciso III, alínea b, do Código Penal.**

      **Considerando as informações narradas, responda, na condição de advogado(a) de Antônio e Pablo.**

      **A) Qual argumento de direito processual poderá ser apresentado por você para desconstituir a sentença condenatória do réu? Justifique. (Valor: 0,65)**

      **B) Qual o argumento de direito material a ser apresentado pela defesa técnica de Pablo para questionar a sentença condenatória? Justifique. (Valor: 0,60)**

      *Obs.: o(a) examinando(a) deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) O advogado de Antônio poderá buscar o reconhecimento da nulidade da sentença condenatória em razão da violação ao devido processo legal. Isso porque, de acordo com o Art. 400 do CPP, na audiência, primeiro devem ser ouvidas as testemunhas da acusação. Somente após a produção de provas pela acusação poderiam ser ouvidas as testemunhas de defesa e interrogado o acusado. Violando a ordem da oitiva das testemunhas, tendo a defesa se insurgido contra tal inversão e ficando claro o prejuízo com a condenação e alteração dos fatos por parte de Pablo, deverá ser reconhecida a nulidade do processo desde a primeira audiência de instrução e julgamento.

      B) A conduta de Pablo de, em audiência de instrução e julgamento de processo criminal, fazer afirmação falsa como testemunha, a princípio, configura o crime realmente imputado: Art. 342, § 1º, do CP. Ocorre que, até como forma de incentivar a retratação e minorar os prejuízos causados em processos, previu o legislador, no Art. 342, § 2º, do CP, que se o agente se retrata ou declara a verdade antes da sentença ser proferida no processo em que ocorreu o ilícito, o fato deixa de ser punível. No caso, Pablo se retratou, narrou a verdade, antes mesmo de ser proferida a sentença condenatória de Antônio. Dessa forma, não poderia o magistrado reconhecer que tal retratação funcionaria apenas como atenuante do Art. 65, inciso III, alínea b, do CP, ou arrependimento posterior, devendo reconhecer a extinção da punibilidade do agente, já que o fato deixa de ser punível.
    itens:
      - n: A
        descricao: Houve inversão na ordem de oitiva das testemunhas OU que as testemunhas de defesa não poderiam ter sido ouvidas antes das testemunhas de acusação (0,40), havendo violação ao devido processo legal OU violação à ampla defesa OU violação ao contraditório (0,15), conforme o Art. 564, inciso IV, do CPP OU Art. 400 do CPP (0,10).
        valores: [ 0, 0.15, 0.25, 0.4, 0.5, 0.55, 0.65 ]
