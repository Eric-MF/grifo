        descricao: Sim, a prova foi obtida por meio ilícito (0,30), diante da ausência de autorização judicial para quebra de sigilo de dados OU diante da ausência de autorização de Wesley para acesso ao conteúdo de seu celular (0,25), com violação ao direito à intimidade/privacidade/vida privada (0,10).
