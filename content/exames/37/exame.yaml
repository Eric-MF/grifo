          - { id: c2, valor: 0.2, termos: [ autorizacao judicial | ordem judicial | reserva de jurisdicao ] }
          - { id: c3, valor: 0.1, dispositivo: [ art. 8-A Lei 9.296, art. 157 CPP, "art. 5º, LVI, CF" ], requer: c2 }
      - n: B
        descricao: Atipicidade da conduta (0,25), diante da inexistência de dolo de atingimento da honra subjetiva da vítima Jéssica OU ausência de intenção das quereladas de fazer chegar à Jéssica o teor da conversa privada havida entre elas (0,35).
        valores: [ 0, 0.25, 0.35, 0.6 ]
