        descricao: A questão preliminar é que a condenação anterior à pena de multa não inviabiliza a suspensão condicional do processo (0,35), por aplicação analógica do Art. 77, § 1º, do CP (0,10), devendo haver a remessa dos autos à autoridade superior do Ministério Público Federal, nos termos da Súmula 696 do STF (0,15).
