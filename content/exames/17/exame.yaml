questoes:
  - n: 1
    enunciado: |-
      Rodrigo, primário e de bons antecedentes, quando passava em frente a um estabelecimento comercial que estava fechado por ser domingo, resolveu nele ingressar. Após romper o cadeado da porta principal, subtraiu do seu interior algumas caixas de cigarro. A ação não foi notada por qualquer pessoa. Todavia, quando caminhava pela rua com o material subtraído, veio a ser abordado por policiais militares, ocasião em que admitiu a subtração e a forma como ingressou no comércio lesado. O material furtado foi avaliado em R$ 1.300,00 (um mil e trezentos reais), sendo integralmente recuperado. A perícia não compareceu ao local para confirmar o rompimento de obstáculo. O autor do fato foi denunciado como incurso nas sanções penais do Art. 155, § 4º, inciso I, do Código Penal. As únicas testemunhas de acusação foram os policiais militares, que confirmaram que apenas foram responsáveis pela abordagem do réu, que confessou a subtração. Disseram não ter comparecido, porém, ao estabelecimento lesado. Em seu interrogatório, Rodrigo confirmou apenas que subtraiu os cigarros do estabelecimento, recusando-se a responder qualquer outra pergunta. A defesa técnica de Rodrigo é intimada para apresentar alegações finais por memoriais.

      **Com base na hipótese apresentada, responda, fundamentadamente, aos itens a seguir.**

      **A) Diante da confissão da prática do crime de furto por Rodrigo, qual a principal tese defensiva em relação à tipificação da conduta a ser formulada pela defesa técnica? (Valor: 0,65)**

      **B) Em caso de acolhimento da tese defensiva, poderá Rodrigo ser, de imediato, condenado nos termos da manifestação da defesa técnica? (Valor: 0,60)**

      *Obs.: Sua resposta deve ser fundamentada. A simples menção do dispositivo legal não será pontuada.*
    gabarito_comentado: |-
      A) Foi imputado um crime de furto qualificado, pois houve rompimento de obstáculo. Ocorre que, para a punição por essa modalidade qualificada do crime, é necessária a realização de exame de local e a constatação do rompimento de obstáculo por prova pericial (Art. 158 do CPP). Assim têm decidido de maneira recorrente os Tribunais Superiores, não sendo suficiente a simples afirmação dos policiais, no sentido de que Rodrigo narrou que tinha subtraído os cigarros, pois essa confirmação foi apenas quanto à subtração, e os agentes da lei nem mesmo compareceram ao estabelecimento para verificar se, de fato, houve tal rompimento. Assim, diante da ausência de comprovação pericial da qualificadora, o crime praticado foi de furto simples.

      B) Em caso de acolhimento da tese defensiva, com a consequente desclassificação da conduta de Rodrigo de furto qualificado para furto simples, não poderá ser o acusado de imediato condenado, devendo o magistrado abrir vista para que o Ministério Público se manifeste sobre a possibilidade de oferecer proposta de suspensão condicional do processo, pois a pena mínima passou a ser de 01 ano de reclusão. Nesse sentido é o enunciado 337 da Súmula do STJ, que permite que, em caso de desclassificação ou procedência parcial, seja oferecida proposta de suspensão condicional do processo, ainda que encerrada a instrução.

      “Qualquer semelhança nominal e/ou situacional presente nos enunciados das questões é mera coincidência.”
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: A principal tese defensiva é a desclassificação do furto qualificado para o simples OU que deve ser afastada a qualificadora prevista no inciso I do parágrafo 4º do Art. 155 do Código Penal (0,25), pois não existe prova pericial do rompimento de obstáculo (0,30), prevista no Art. 158 do CPP (0,10).
        valores: [ 0, 0.25, 0.3, 0.35, 0.4, 0.55, 0.65 ]
        componentes:
          - { id: c1, valor: 0.25, alternativas: [ [ desclassifica*, furto simples ], [ qualificadora, afast* | exclu* | decote ] ] }
          - { id: c2, valor: 0.3, termos: [ pericia | pericial | laudo | exame ] }
          - { id: c3, valor: 0.1, dispositivo: [ "art. 158, CPP" ], requer: c2 }
      - n: B
        secao: PONTUAÇÃO
        descricao: Em caso de acolhimento da tese defensiva, não pode o réu ser de imediato condenado, pois deve ser possibilitado ao Ministério Público o oferecimento de proposta de suspensão condicional do processo (0,50), nos termos do enunciado 337 da Súmula do STJ (0,10).
        valores: [ 0, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.5, termos: [ suspensao condicional do processo | sursis processual ] }
          - { id: c2, valor: 0.1, dispositivo: [ Súmula 337 STJ ], requer: c1 }
  - n: 2
    enunciado: |-
      Glória, esposa ciumenta de Jorge, inicia uma discussão com o marido no momento em que ele chega do trabalho à residência do casal. Durante a discussão, Jorge faz ameaças de morte à Glória, que, de imediato comparece à Delegacia, narra os fatos, oferece representação e solicita medidas protetivas de urgência. Encaminhados os autos para o Ministério Público, este requer em favor de Glória a medida protetiva de proibição de aproximação, bem como a prisão preventiva de Jorge, com base no Art. 313, inciso III, do CPP. O juiz acolhe os pedidos do Ministério Público e Jorge é preso.

      Novamente os autos são encaminhados para o Ministério Público, que oferece denúncia pela prática do crime do Art. 147 do Código Penal. Antes do recebimento da inicial acusatória, arrependida, Glória retorna à Delegacia e manifesta seu interesse em não mais prosseguir com o feito.

      A família de Jorge o procura em busca de orientação, esclarecendo que o autor é primário e de bons antecedentes.

      **Considerando apenas a situação narrada, na condição de advogado(a) de Jorge, esclareça os seguintes questionamentos formulados pelos familiares:**

      **A) A prisão de Jorge, com fundamento no Art. 313, inciso III, do Código de Processo Penal, é válida? (Valor:**

      0,60)

      **B) É possível a retratação do direito de representação por parte de Glória? Em caso negativo, explicite as razões; em caso positivo, esclareça os requisitos. (Valor: 0,65)**

      *Obs.: o examinando deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) Deveria o examinando demonstrar que a prisão preventiva decretada em desfavor de Jorge, com base no Art. 313, inciso III, do Código de Processo Penal, não é válida no caso concreto. De início, é possível perceber que os requisitos previstos no Art. 313, incisos I e II, do CPP não estão presentes, pois a pena máxima para o crime praticado é inferior a 04 anos e Jorge é primário e de bons antecedentes. Em relação ao inciso III do Art. 313, não basta que o crime seja praticado em situação de violência doméstica e familiar contra mulher. Para regularidade da prisão, é preciso que seja aplicada para garantir execução de medida protetiva de urgência. Dessa forma, somente será cabível caso exista uma medida protetiva anteriormente aplicada e descumprida ou, ao menos, que, após aplicação da medida protetiva, exista risco concreto de descumprimento. No caso, de imediato o magistrado, após requerimento do Ministério Público, decretou a prisão preventiva, sem que houvesse medida protetiva de urgência previamente aplicada. Assim, não foi válida a prisão.

      B) Deveria o examinando esclarecer que o crime de ameaça é de ação penal pública condicionada à representação, nos termos do Art. 147, parágrafo único, do Código Penal, de modo que é possível a retratação do direito de representação. Como o crime foi praticado em situação de violência doméstica e familiar contra a mulher, contudo, alguns requisitos são trazidos pela lei de modo a garantir que essa manifestação foi livre de pressões. Tais requisitos são trazidos pelo Art. 16 da Lei 11.340/06, que admite a retratação antes do recebimento da denúncia, desde que realizada em audiência especial, na presença do magistrado, após manifestação do Ministério Público.

      “Qualquer semelhança nominal e/ou situacional presente nos enunciados das questões é mera coincidência.”
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: A prisão de Jorge não é válida, pois o Art. 313, III, do CPP, exige que a prisão seja decretada para garantir execução de medida protetiva de urgência OU porque não houve medida protetiva anteriormente aplicada e descumprida (0,60).
        valores: [ 0, 0.6 ]
        componentes:
          - { id: c1, valor: 0.6, termos: [ medida protetiva ] }
      - n: B
        secao: PONTUAÇÃO
        descricao: Sim. A retratação da ofendida deve ocorrer em audiência especial, na presença do magistrado e ouvido o Ministério Público (0,30), antes do recebimento da denúncia (0,25), na forma do Art. 16 da Lei nº 11.340/06 (0,10).
        componentes:
          - { id: c1, valor: 0.3, termos: [ audiencia ] }
          - { id: c2, valor: 0.25, termos: [ antes do recebimento ] }
          - { id: c3, valor: 0.1, dispositivo: [ "art. 16, Lei 11340" ], requer: c2 }
  - n: 3
    enunciado: |-
      Ruth voltava para sua casa falando ao celular, na cidade de Santos, quando foi abordada por Antônio, que afirmou: “Isso é um assalto! Passa o celular ou verá as consequências!”. Diante da grave ameaça, Ruth entregou o telefone e o agente fugiu em sua motocicleta em direção à cidade de Mogi das Cruzes, consumando o crime.

      Nervosa, Ruth narrou o ocorrido para o genro Thiago, que saiu em seu carro, junto com um policial militar, à procura de Antônio.

      **Com base na placa da motocicleta anotada por Ruth, Thiago localizou Antônio, já em Mogi das Cruzes, ainda na posse do celular da vítima e também com uma faca em sua cintura, tendo o policial efetuado a prisão em flagrante. Em razão dos fatos, Antônio foi denunciado pela prática do crime previsto no Art. 157, § 2º, inciso I, do Código Penal, perante uma Vara Criminal da comarca de Mogi das Cruzes, ficando os familiares do réu preocupados, porque todos da região sabem que o magistrado, em atuação naquela Vara, é extremamente severo. A defesa foi intimada a apresentar resposta à acusação.**

      **Considerando que o flagrante foi regular e que os fatos são verdadeiros, responda, na qualidade de advogado(a)**

      de Antônio, aos itens a seguir.

      **A) Que medida processual poderia ser adotada para evitar o julgamento perante a Vara Criminal de Mogi das Cruzes? Justifique. (Valor: 0,65)**

      **B) No mérito, caso Antônio confesse os fatos durante a instrução, qual argumento de direito material poderia ser formulado para garantir uma punição mais branda do que a pleiteada na denúncia? Justifique. (Valor:**

      0,60)

      *Obs.: o examinando deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) A medida processual é exceção de incompetência. Pela narrativa apresentada no enunciado é possível concluir que o crime foi praticado, inclusive consumado, na cidade de Santos, logo, na forma do Art. 70 do Código de Processo Penal, o juízo competente será o da comarca de Santos e não o de Mogi das Cruzes. Considerando a incompetência territorial existente, deveria o advogado de Antônio formular uma exceção de incompetência, no prazo de defesa, nos termos do Art. 108 do Código de Processo Penal. A Banca considerou também como resposta correta a apresentação de preliminar de incompetência na resposta à acusação, nos termos do Art. 396-A, CPP, diante do entendimento existente de que todas as regras de competência no Processo Penal têm natureza absoluta.

      B) Envolvendo o mérito, deve o examinando expor que, ainda que confessados os fatos, não houve emprego de arma na hipótese, de modo que deveria ser afastada a majorante do Art. 157, § 2º, inciso I, do Código Penal. A hipótese narrada deixa claro que Antônio abordou Ruth e empregou grave ameaça, mas que, em momento algum, utilizou, mencionou ou mostrou a arma que portava quando de sua prisão em flagrante. O argumento de que a faca, por ser arma branca, não é suficiente para o reconhecimento da causa de aumento não é adequado. O “Qualquer semelhança nominal e/ou situacional presente nos enunciados das questões é mera coincidência.”

      que se exigia era a demonstração de que, no caso concreto, não houve efetivo emprego da arma, como exige o dispositivo supramencionado.
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: A medida processual a ser adotada é a exceção de incompetência ou a arguição de preliminar de incompetência na resposta à acusação (0,35), nos termos do Art. 108 ou 396-A, do CPP, respectivamente (0,10), pois o crime se consumou em Santos, logo o juízo competente é o dessa comarca (0,20).
        componentes:
          - { id: c1, valor: 0.35, termos: [ excecao de incompetencia | incompetencia ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 108, CPP", "art. 396-A, CPP" ], requer: c1 }
          - { id: c3, valor: 0.2, termos: [ santos ] }
      - n: B
        secao: PONTUAÇÃO
        descricao: O argumento a ser apresentado é que foi praticado um crime de roubo simples OU que deve ser afastada a causa de aumento/majorante do Art. 157, § 2º, inciso I, do CP (0,35), pois não houve efetivo emprego de arma (0,25).
        valores: [ 0, 0.25, 0.35, 0.6 ]
        componentes:
          - { id: c1, valor: 0.35, alternativas: [ [ roubo simples ], [ majorante | causa de aumento, afast* | exclu* | decote ] ] }
