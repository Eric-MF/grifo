        descricao: "Não, pois, de acordo com o artigo 141, II, do CP (0,10), quando a ofensa for praticada contra funcionário público em razão de suas funções, a pena será aumentada de um terço, o que faz com que a sanção máxima abstratamente cominada seja superior a dois anos (0,20)."
