          - { id: c2, valor: 0.1, dispositivo: [ "art. 217-A, CP" ] }
      - n: "B"
        descricao: "Sim. Estupro de vulnerável (0,30) – artigo 217-A do CP c/c artigo 13, §2º, “a”, do CP OU era garantidora (0,20). Não pontua só artigo ou fundamento isolados."
        valores: [ 0, 0.3, 0.5 ]
        componentes:
          - { id: c1, valor: 0.3, termos: [ estupro de vulneravel ] }
          - { id: c2, valor: 0.2, termos: [ "garant* | dever de agir | obrigacao legal | impedir o resultado" ], dispositivo: [ "art. 13, § 2º, CP" ], requer: c1 }
      - n: "C"
        descricao: "Não, por se tratar de ação penal pública incondicionada (0,35). Art. 225, parágrafo único, do CP (0,10)."
        valores: [ 0, 0.35, 0.45 ]
        componentes:
