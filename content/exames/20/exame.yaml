  - n: 3
    enunciado: |-
      Andy, jovem de 25 anos, possui uma condenação definitiva pela prática de contravenção penal. Em momento posterior, resolve praticar um crime de estelionato e, para tanto, decide que irá até o portão da residência de Josefa e, aí, solicitará a entrega de um computador, afirmando que tal requerimento era fruto de um pedido do próprio filho de Josefa, pois tinha conhecimento que este trabalhava no setor de informática de determinada sociedade.

      Ao chegar ao portão da casa, afirma para Josefa que fora à sua residência buscar o computador da casa a pedido do filho dela, com quem trabalhava. Josefa pede para o marido entregar o computador a Andy, que ficara aguardando no portão. Quando o marido de Josefa aparece com o aparelho, Andy se surpreende, pois ele lembrava seu falecido pai. Em razão disso, apesar de já ter empregado a fraude, vai embora sem levar o bem.

      O Ministério Público ofereceu denúncia pela prática de tentativa de estelionato, sendo Andy condenado nos termos da denúncia.

      **Como advogado de Andy, com base apenas nas informações narradas, responda aos itens a seguir.**

      **A) Qual tese jurídica de direito material deve ser alegada, em sede de recurso de apelação, para evitar a punição de Andy? Justifique. (Valor: 0,65)**

      **B) Há vedação legal expressa à concessão do benefício da suspensão condicional do processo a Andy? Justifique. (Valor: 0,60)**

      *Obs.: o examinando deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) A tese de direito material a ser alegada pelo advogado de Andy é que, no caso, não poderia ele ter sido punido pela tentativa, tendo em vista que houve desistência voluntária. Prevê o Art. 15 do CP que o agente que voluntariamente desiste de prosseguir na execução responde apenas pelos atos já praticados e não pela tentativa do crime inicialmente pretendido. Isso porque o agente opta por não prosseguir quando pode, ao contrário da tentativa, quando o agente não pode prosseguir por razões alheias à sua vontade. No caso, a execução já tinha sido iniciada, quando Andy empregou fraude. O benefício, porém, não foi obtido, sendo certo que o crime não se consumou pela vontade do próprio agente. Assim, sua conduta se torna atípica e deveria ele ser absolvido.

      B) Não há vedação legal, podendo Andy fazer jus ao benefício da suspensão condicional do processo. O crime de estelionato possui pena mínima de 01 ano, o que está de acordo com as exigências do Art. 89 da Lei nº 9.099/95.

      Ademais, prevê o dispositivo que não caberá suspensão se o agente já houver sido condenado ou se responder a outro processo pela prática de crime. Todavia, no caso, Andy havia sido condenado pela prática de contravenção penal, logo não há vedação à concessão do benefício.
    itens:
      - n: A
        descricao: Deveria ser alegada a ocorrência de desistência voluntária (0,40), o que torna a conduta do agente atípica OU o que faz com que responda apenas pelos atos já praticados (0,15), na forma do Art. 15, primeira parte, do CP (0,10).
        componentes:
          - { id: c1, valor: 0.4, termos: [ desistencia voluntaria ] }
          - { id: c2, valor: 0.15, alternativas: [ [ atipic* ], [ atos ja praticados | atos praticados ] ] }
          - { id: c3, valor: 0.1, dispositivo: [ "art. 15, CP" ], requer: c2 }
      - n: B
        descricao: Não há vedação legal, tendo em vista que Andy ostenta condenação pela prática de contravenção penal e não de crime (0,50), sem violação ao Art. 89 da Lei nº 9.099/95 (0,10).
