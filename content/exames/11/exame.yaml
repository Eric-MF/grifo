questoes:
  - n: 1
    enunciado: |-
      O Juiz da Vara de Execuções Penais da Comarca “Y” converteu a medida restritiva de direitos (que fora imposta em substituição à pena privativa de liberdade) em cumprimento de pena privativa de liberdade imposta no regime inicial aberto, sem fixar quaisquer outras condições.

      O Ministério Público, inconformado, interpôs recurso alegando, em síntese, que a decisão do referido Juiz da Vara de Execuções Penais acarretava o abrandamento da pena, estimulando o descumprimento das penas alternativas ao cárcere.

      O recurso, devidamente contra-arrazoado, foi submetido a julgamento pela Corte Estadual, a qual, de forma unânime, resolveu lhe dar provimento. A referida Corte fixou como condição especial ao cumprimento de pena no regime aberto, com base no Art. 115 da LEP, a prestação de serviços à comunidade, o que deveria perdurar por todo o tempo da pena a ser cumprida no regime menos gravoso.

      Atento ao caso narrado e considerando apenas os dados contidos no enunciado, responda fundamentadamente, aos itens a seguir.

      **A) Qual foi o recurso interposto pelo Ministério Público contra a decisão do Juiz da Vara de Execuções Penais? (Valor: 0,50)**

      **B) Está correta a decisão da Corte Estadual, levando-se em conta entendimento jurisprudencial sumulado? (Valor: 0,75)**

      A simples menção ou transcrição do dispositivo legal não pontua.
    gabarito_comentado: |-
      A. Agravo em Execução (Art. 197 da LEP).

      B. Não, pois de acordo com o verbete 493 da Súmula do STJ, é inadmissível a fixação de pena substitutiva (Art. 44 do CP) como condição especial ao regime aberto.

      Ademais, embora ao Juiz seja lícito estabelecer condições especiais para a concessão do regime aberto, em complementação daquelas previstas na LEP (Art. 115 da LEP), não poderá adotar a esse título nenhum efeito já classificado como pena substitutiva (Art. 44 do CPB), porque aí ocorreria o indesejável bis in idem, importando na aplicação de dúplice sanção.

      Ademais, o Art. 44 do Código Penal é claro ao afirmar a natureza autônoma das penas restritivas de direitos que, por sua vez, visam substituir a sanção corporal imposta àqueles condenados por infrações penais mais leves. Diante do caráter substitutivo das sanções restritivas, vedada está sua cumulatividade com a pena privativa de liberdade, salvo expressa previsão legal, o que não é o caso.

      Precedente: STJ - Habeas Corpus n. 218.352 - SP (2011/0218345-1)
    itens:
      - n: A
        descricao: Agravo em execução (0,40), com fundamento no Art. 197 da LEP (0,10).
        componentes:
          - { id: c1, valor: 0.4, termos: [ agravo ] }
          - { id: c2, valor: 0.1, dispositivo: [ art. 197 LEP ], requer: c1 }
      - n: B
        descricao: "Não: é inadmissível fixar pena substitutiva como condição especial do regime aberto (0,40), sob pena de bis in idem/dúplice sanção (0,20), conforme a Súmula 493 do STJ (0,15)."
        componentes:
          - { id: c1, valor: 0.4, termos: [ inadmissivel | nao pode | vedad* | incorreta | nao esta correta, pena substitutiva | prestacao de servicos | restritiva, condicao especial | regime aberto ] }
          - { id: c2, valor: 0.2, termos: [ bis in idem | dupla | duplice | cumulativ* ] }
          - { id: c3, valor: 0.15, dispositivo: [ Súmula 493 STJ ], requer: c1 }
  - n: 2
    enunciado: |-
      Daniel foi denunciado, processado e condenado pela prática do delito de roubo simples em sua modalidade tentada. A pena fixada pelo magistrado foi de dois anos de reclusão em regime aberto. Todavia, atento às particularidades do caso concreto, o referido magistrado concedeu-lhe o beneficio da suspensão condicional da execução da pena, sendo certo que, na sentença, não fixou nenhuma condição. Somente a defesa interpôs recurso de apelação, pleiteando a absolvição de Daniel com base na tese de negativa de autoria e, subsidiariamente, a substituição do beneficio concedido por uma pena restritiva de direitos. O Tribunal de Justiça, por sua vez, no julgamento da apelação, de forma unânime, negou provimento aos dois pedidos da defesa e, no acórdão, fixou as condições do sursis, haja vista o fato de que o magistrado a quo deixou de fazê-lo na sentença condenatória.

      Nesse sentido, atento apenas às informações contidas no texto, responda, fundamentadamente, aos itens a seguir.

      **A) Qual o recurso cabível contra a decisão do Tribunal de Justiça? (Valor: 0,55)**

      **B) Qual deve ser a principal linha de argumentação no recurso? (Valor: 0,70)**

      A simples menção ou transcrição do dispositivo legal não pontua.
    gabarito_comentado: |-
      A) Cabível a interposição de recurso especial, com fulcro no Art. 105, III, a, da CRFB/88.

      B) Deve ser salientado que não agiu corretamente o Tribunal de Justiça ao fixar as condições do sursis, pois tal tarefa cabia ao juiz a quo e, como ele não o fez, bem como não houve impugnação por parte do Ministério Público acerca de tal omissão, a atitude do Tribunal configura verdadeira reformatio in pejus, vedada pelo Art. 617, do CPP.
    itens:
      - n: A
        descricao: Recurso especial (0,45), com fulcro no Art. 105, III, a, da CRFB/88 (0,10).
        componentes:
          - { id: c1, valor: 0.45, termos: [ recurso especial ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 105, III, a, CF" ], requer: c1 }
      - n: B
        descricao: O Tribunal não poderia fixar as condições do sursis em recurso exclusivo da defesa (0,20), configurando reformatio in pejus (0,40), vedada pelo Art. 617 do CPP (0,10).
        componentes:
          - { id: c1, valor: 0.2, termos: [ condic*, sursis | suspensao condicional, recurso exclusivo da defesa | somente a defesa | apenas a defesa | sem recurso do ministerio publico | nao houve impugnacao | juiz a quo ] }
          - { id: c2, valor: 0.4, termos: [ reformatio in pejus ] }
          - { id: c3, valor: 0.1, dispositivo: [ art. 617 CPP ], requer: c2 }
  - n: 3
    enunciado: |-
      Ricardo cometeu um delito de roubo no dia 10/11/2007, pelo qual foi condenado no dia 29/08/2009, sendo certo que o trânsito em julgado definitivo de referida sentença apenas ocorreu em 15/05/2010. Ricardo também cometeu, no dia 10/09/2009, um delito de extorsão.

      A sentença condenatória relativa ao delito de extorsão foi prolatada em 18/10/2010, tendo transitado definitivamente em julgado no dia 07/04/2011. Ricardo também praticou, no dia 12/03/2010, um delito de estelionato, tendo sido condenado em 25/05/2011. Tal sentença apenas transitou em julgado no dia 27/07/2013.

      Nesse sentido, tendo por base apenas as informações contidas no enunciado, responda aos itens a seguir.

      **A) O juiz, na sentença relativa ao crime de roubo, deve considerar Ricardo portador de bons ou maus antecedentes? (Valor: 0,25)**

      **B) O juiz, na sentença relativa ao crime de extorsão, deve considerar Ricardo portador de bons ou maus antecedentes? Na hipótese, incide a circunstância agravante da reincidência ou Ricardo ainda pode ser considerado réu primário? (Valor: 0,50)**

      **C) O juiz, na sentença relativa ao crime de estelionato, deve considerar Ricardo portador de bons ou maus antecedentes? Na hipótese, incide a circunstância agravante da reincidência ou Ricardo ainda pode ser considerado réu primário? (Valor: 0,50)**

      Utilize os argumentos jurídicos apropriados e a fundamentação legal pertinente ao caso.

      A simples menção ou transcrição do dispositivo legal não pontua.
    gabarito_comentado: |-
      A questão objetiva busca extrair do examinando conhecimento de institutos relativos à dosimetria da pena, em especial no tocante à circunstância judicial dos maus antecedentes e à agravante da reincidência. Munido de tal conhecimento, o examinando deve ser capaz de identificar os institutos e também diferenciá-los quando diante de um caso concreto.

      Nesse sentido, relativamente ao item ‘A’, percebe-se que Ricardo possui bons antecedentes.

      Eventual sentença condenatória ainda não transitada em julgado não tem o condão de implicar- lhe maus antecedentes, pois isso significaria acréscimo de tempo em sua pena e contrariaria, assim, o princípio do estado de inocência, constitucionalmente previsto.

      No item ‘B’, atendendo-se ao comando da questão, o examinando deve indicar que Ricardo é primário. Isso porque a extorsão foi cometida em 10/09/09, antes, portanto, do trânsito em julgado da sentença que o condenou pelo roubo (ocorrido em 15/05/2010), tal como manda o Art. 63 do CP. Não obstante a primariedade de Ricardo, ele é portador de maus antecedentes, pois na data da sentença relativa ao delito de extorsão (18/10/2010) já havia ocorrido o trânsito em julgado da sentença do crime de roubo.

      Por fim, em relação ao item ‘C’, o examinando deve indicar que ainda permanece a primariedade de Ricardo, pois o delito de estelionato foi cometido antes do trânsito em julgado de qualquer outro delito. Perceba-se que um indivíduo somente pode ser considerado reincidente se o crime pelo qual está sendo julgado tiver sido cometido após o trânsito em julgado de sentença que lhe haja condenado por delito anterior, nos termos do Art. 63, do CP.

      Todavia, Ricardo é portador de maus antecedentes, pois na data da sentença relativa ao estelionato já havia ocorrido o trânsito em julgado de duas outras sentenças condenatórias.
    itens:
      - n: A
        descricao: Na sentença do roubo, Ricardo deve ser considerado portador de bons antecedentes (0,25).
        componentes:
          - { id: c1, valor: 0.25, termos: [ bons antecedentes ] }
      - n: B
        descricao: "Na sentença da extorsão: maus antecedentes (0,20), mas réu primário, sem reincidência, pois a extorsão foi cometida antes do trânsito em julgado do roubo (0,20), nos termos do Art. 63 do CP (0,10)."
        componentes:
          - { id: c1, valor: 0.2, termos: [ maus antecedentes ] }
          - { id: c2, valor: 0.2, termos: [ primari* | nao reincidente | nao incide a reincidencia | sem reincidencia | nao e reincidente ] }
          - { id: c3, valor: 0.1, dispositivo: [ art. 63 CP ], requer: c2 }
      - n: C
        descricao: "Na sentença do estelionato: maus antecedentes (0,20), mas réu primário, pois o estelionato foi cometido antes do trânsito em julgado de qualquer outra condenação (0,20), nos termos do Art. 63 do CP (0,10)."
        componentes:
          - { id: c1, valor: 0.2, termos: [ maus antecedentes ] }
          - { id: c2, valor: 0.2, termos: [ primari* | nao reincidente | nao incide a reincidencia | sem reincidencia | permanece a primariedade | nao e reincidente ] }
          - { id: c3, valor: 0.1, dispositivo: [ art. 63 CP ], requer: c2 }
  - n: 4
    enunciado: |-
      O Ministério Público ofereceu denúncia contra Lucile, imputando-lhe a prática da conduta descrita no Art. 155, caput, do CP. Narrou, a inicial acusatória, que no dia 18/10/2012 Lucile subtraiu, sem violência ou grave ameaça, de um grande estabelecimento comercial do ramo de venda de alimentos, dois litros de leite e uma sacola de verduras, o que totalizou a quantia de R$10,00 (dez reais). Todas as exigências legais foram satisfeitas: a denúncia foi recebida, foi oferecida suspensão condicional do processo e foi apresentada resposta à acusação.

      O magistrado, entretanto, após convencer-se pelas razões invocadas na referida resposta à acusação, entende que a fato é atípico.

      Nesse sentido, tendo como base apenas as informações contidas no enunciado, responda, justificadamente, aos itens a seguir.

      **A) O que o magistrado deve fazer? Após indicar a solução, dê o correto fundamento legal. (Valor: 0,65)**

      **B) Qual é o elemento ausente que justifica a alegada atipicidade? (Valor: 0,60)**

      Utilize os argumentos jurídicos apropriados e a fundamentação legal pertinente ao caso.

      A simples menção ou transcrição do dispositivo legal não pontua.
    gabarito_comentado: |-
      A questão objetiva extrair do examinando conhecimento acerca da absolvição sumária, bem como dos elementos essenciais à configuração da tipicidade penal de uma conduta.

      A) O juiz deve absolver sumariamente a ré, devendo fundamentar sua decisão no Art. 397, III do CPP.

      B) Está ausente a tipicidade material. Isso porque, pela moderna doutrina, somente haverá tipicidade se, além da tipicidade formal (subsunção do fato à norma), estiver presente, também, a tipicidade material, assim entendida como efetiva lesão relevante ou ameaça de lesão ao bem jurídico tutelado.
    itens:
      - n: A
        descricao: O juiz deve absolver sumariamente a ré (0,50), com fundamento no Art. 397, III, do CPP (0,15).
        componentes:
          - { id: c1, valor: 0.5, termos: [ absolv* sumariamente | absolvicao sumaria ] }
          - { id: c2, valor: 0.15, dispositivo: [ "art. 397, III, CPP" ], requer: c1 }
      - n: B
        descricao: "Está ausente a tipicidade material (0,40): não houve lesão ou ameaça de lesão relevante ao bem jurídico tutelado (0,20)."
        componentes:
          - { id: c1, valor: 0.4, termos: [ tipicidade material ] }
          - { id: c2, valor: 0.2, termos: [ lesao | ameaca de lesao | ofensividade | insignifican*, bem juridico ] }
