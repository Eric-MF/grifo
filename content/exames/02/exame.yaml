  - n: 5
    enunciado: |-
      Lucas, processado em liberdade, foi condenado na 1ª instância à pena de 05 (cinco) anos em regime integralmente fechado, pelo crime de tráfico de drogas, cometido em setembro de 2006. Interpôs Recurso de Apelação o qual foi parcialmente provido. O Tribunal alterou apenas o dispositivo da sentença que fixava o regime em integralmente fechado para inicialmente fechado. Após o trânsito em julgado, Lucas deu inicio ao cumprimento de pena em 10 de fevereiro de 2009. O juízo da execução, em 10 de outubro de 2010, negou a progressão de regime sob o fundamento de que Lucas ainda não havia cumprido 2/5 da pena, em que pese os demais requisitos tenham sido preenchidos.

      Diante dos fatos e da decisão acima exposta, sendo que sua intimação, na condição de Advogado de Lucas, ocorreu em 11.10.2010:

      I. indique o recurso cabível.

      II. apresente a argumentação adequada, indicando os respectivos dispositivos legais.
    gabarito_comentado: |-
      (a) - Recurso Cabível: Agravo em Execução, nos termos do previsto no artigo 197, da Lei n. 7.210/84.

      (b) - Fundamentação: Com o advento da Lei 11.464/07, restou legalmente instituída a possibilidade de progressão de regime nos crimes hediondos e equiparados, respeitando, assim, o princípio constitucional da individualização da pena. A mencionada lei fixou prazo diferenciado para tais delitos, afastando o critério de cumprimento de 1/6 da pena, determinando o cumprimento de 2/5, para primários e 3/5, para reincidentes. No entanto, no caso em comento, o delito fora cometido antes da entrada em vigor da lei 11.464/07, sendo esta prejudicial ao réu no que tange ao prazo para progressão, razão pela qual não poderá ser aplicada retroativamente. Logo, quando do pedido perante o juízo da execução, Lucas já havia cumprido o requisito objetivo exigido para a progressão de regime, ou seja, 1/6, devendo ser concedido, nos termos do artigo 112, da Lei n. 7.210/84. O requerimento deve ser de progressão de regime. Pontuação para argumentação: 0,5. Pontuação para indicação dos dispositivos legais: 0,2
    itens:
      - n: "1"
        descricao: Agravo em execução, art. 197 da LEP (0,30).
        componentes:
          - { id: c1, valor: 0.3, termos: [ agravo ] }
      - n: "2"
        descricao: "A Lei 11.464/07 é posterior e mais gravosa (progressão com 2/5) e não retroage (0,20 pelos dispositivos; 0,50 pela argumentação): aplica-se 1/6, art. 112 da LEP."
        componentes:
          - { id: c1, valor: 0.5, termos: [ 11464 | lei posterior | lei nova | 2/5, retroag* | irretroatividade | prejudicial | mais gravosa ] }
          - { id: c2, valor: 0.2, termos: [ 1/6 ], dispositivo: [ art. 112 LEP ], requer: c1, rotulo: Progressão com 1/6 (art. 112 da LEP) }
    valor: 1
