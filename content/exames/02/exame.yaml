  - n: 4
    enunciado: |-
      Aurélio, tentando defender-se da agressão a faca perpetrada por Berilo, saca de seu revólver e efetua um disparo contra o agressor. Entretanto, o disparo efetuado por Aurélio ao invés de acertar Berilo, atinge Cornélio, que se encontrava muito próximo de Berilo. Em consequência do tiro, Cornélio vem a falecer.

      Aurélio é acusado de homicídio.

      **Na qualidade de advogado de Aurélio indique a tese de defesa que melhor se adequa ao fato. Justifique sua resposta.**
    gabarito_comentado: Trata-se o presente caso de um erro na execução (art. 73 do CP, 1ª parte), atendendo-se, conforme o citado artigo, ao disposto no parágrafo 3º do artigo 20 do Código Penal. Por outro lado verifica-se que Aurélio ao efetuar o disparo agiu em legítima defesa (art. 25 do CP) própria e real. Entretanto, por um erro acertou pessoa diversa (Cornélio) do agressor (Berilo). Mesmo assim, não fica afastada a legítima defesa posto que de acordo com o art. 20 § 3º do CP “não se consideram, neste caso, as condições ou qualidades da vítima, senão as da pessoa contra quem o agente queria praticar o crime”. Levando-se, ainda, em consideração o fato de que Aurélio agiu em defesa de uma agressão injusta e atual, utilizando-se, ainda, dos meios necessários e que dispunha para se defender.
