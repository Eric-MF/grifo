  - n: 2
    enunciado: |-
      Caio, funcionário público, ao fiscalizar determinado estabelecimento comercial exige vantagem indevida.

      A qual delito corresponde o fato narrado:

      I. se a vantagem exigida servir para que Caio deixe de cobrar tributo devido;

      II. se a vantagem, advinda de cobrança de tributo que Caio sabia não ser devida, for desviada para proveito de Caio?
    gabarito_comentado: |-
      Art. 3º da Lei n. 8.137/90 (0,5) e excesso de exação qualificada – art. 316, § 2º, do CP (0,5).

      A exigência de vantagem indevida por funcionário público em razão de sua função caracteriza, em princípio, o delito de concussão. A Lei n. 8.137/90, a lei dos crimes contra a ordem tributária, criou , no que interessa à questão, dois tipos novos: inseriu no artigo 316 do Código Penal dois parágrafos, criando o excesso de exação – nas hipóteses em que a vantagem indevida for ela mesma um tributo ou contribuição social indevida -, e sua forma qualificada, que se dá quando a vantagem é apropriada pelo agente. O outro novel tipo penal está no artigo 3º da Lei n. 8.137/90, que tipifica uma forma específica de concussão: a exigência de vantagem indevida para deixar de cobrar tributo devido.
