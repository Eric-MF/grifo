questoes:
  - n: 1
    enunciado: |-
      João estava dirigindo seu automóvel a uma velocidade de 100 km/h em uma rodovia em que o limite máximo de velocidade é de 80 km/h. Nesse momento, foi surpreendido por uma bicicleta que atravessou a rodovia de maneira inesperada, vindo a atropelar Juan, condutor dessa bicicleta, que faleceu no local em virtude do acidente. Diante disso, João foi denunciado pela prática do crime previsto no Art. 302 da Lei nº 9.503/97. As perícias realizadas no cadáver da vítima, no automóvel de João, bem como no local do fato, indicaram que João estava acima da velocidade permitida, mas que, ainda que a velocidade do veículo do acusado fosse de 80 km/h, não seria possível evitar o acidente e Juan teria falecido. Diante da prova pericial constatando a violação do dever objetivo de cuidado pela velocidade acima da permitida, João foi condenado à pena de detenção no patamar mínimo previsto no dispositivo legal.

      **Considerando apenas os fatos narrados no enunciado, responda aos itens a seguir.**

      **A) Qual o recurso cabível da decisão do magistrado, indicando seu prazo e fundamento legal? (Valor: 0,60)**

      **B) Qual a principal tese jurídica de direito material a ser alegada nas razões recursais? (Valor: 0,65)**

      *Obs.: o examinando deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) O recurso cabível da sentença do magistrado que condenou João é o recurso de apelação, cujo prazo de interposição é de 05 dias e o fundamento é o Art. 593, inciso I, do Código de Processo Penal.

      B) A principal tese jurídica a ser apresentada é o requerimento de absolvição do acusado, pois, em que pese ter havido violação do dever objetivo de cuidado, essa violação não representou incremento do risco no caso concreto, pois, ainda que observada a velocidade máxima prevista para a pista, com respeito ao dever de cuidado, o resultado teria ocorrido da maneira como ocorreu. Dessa forma, o examinando pode fundamentar o pedido de absolvição com base na ausência de incremento do risco, sendo essa ausência, de acordo com a Teoria da Imputação Objetiva, fundamento para absolvição. De qualquer maneira, o cerne da resposta é a indicação de que não foi a violação do dever de cuidado a responsável pelo resultado lesivo, de modo que não deveria João ser por ele responsabilizado.

      A Banca também considerou como correta a resposta que indicava a inexistência de culpa, apesar da violação do dever objetivo de cuidado, em razão da ausência do elemento previsibilidade, sob a alegação de que João não poderia prever que uma bicicleta atravessaria seu caminho em uma rodovia de tráfego intenso, em local inadequado.
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: O recurso cabível da sentença do magistrado é a Apelação (0,35), cujo fundamento legal é previsto no Art. 593, inciso I, do CPP (0,10), com prazo de interposição de 05 dias (0,15).
        valores: [ 0, 0.15, 0.25, 0.35, 0.45, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.35, termos: [ apelacao ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 593, I, CPP" ], requer: c1 }
          - { id: c3, valor: 0.15, termos: [ 5 dias ] }
      - n: B
        secao: PONTUAÇÃO
        descricao: Não foi praticado crime OU deveria João ser absolvido (0,15), razão da aplicação da Teoria da Imputação Objetiva, pois ainda que não houvesse violação do dever objetivo de cuidado, o resultado teria ocorrido da mesma maneira que ocorreu, não havendo incremento do risco realizado no resultado OU porque não havia culpa em razão da ausência do elemento previsibilidade (0,50).
        valores: [ 0, 0.15, 0.5, 0.65 ]
        componentes:
          - { id: c1, valor: 0.15, alternativas: [ [ nao foi praticado crime | nao houve crime | atipic* ], [ absolvi* | absolver ] ] }
          - { id: c2, valor: 0.5, alternativas: [ [ imputacao objetiva ], [ incremento do risco ], [ previsibilidade ] ] }
  - n: 2
    enunciado: |-
      Ronaldo foi denunciado pela prática do crime de integrar organização criminosa por fatos praticados em 2014.

      Até o momento, porém, somente ele foi identificado como membro da organização pelas autoridades policiais, razão pela qual prosseguiu o inquérito em relação aos demais agentes não identificados. Arrependido, Ronaldo procura seu advogado e afirma que deseja contribuir com as investigações, indicando o nome dos demais integrantes da organização, assim como esclarecendo os crimes cometidos.

      **Considerando apenas as informações narradas, responda aos itens a seguir.**

      **A) Existe alguma medida a ser buscada pelo advogado de Ronaldo para evitar aplicação ou cumprimento de pena no processo pelo qual foi denunciado? Em caso positivo, qual? Em caso negativo, justifique. (Valor:**

      0,65)

      **B) É possível um dos agentes identificados por Ronaldo ser condenado exclusivamente com base em suas declarações? Fundamente. (Valor: 0,60)**

      *Obs.: o examinando deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) Sim, existe medida a ser buscada pelo advogado de Ronaldo para evitar sua punição. Ronaldo foi denunciado pela prática do delito previsto no Art. 2º da Lei nº 12.850/13. Ocorre que o Art. 4º, inciso I, deste mesmo diploma legal prevê o instituto da “colaboração premiada”, que poderá ocorrer quando o agente colaborar efetiva e voluntariamente com investigação, resultando na identificação dos demais coautores e partícipes da organização criminosa e das infrações por eles praticadas. Diante da vontade de Ronaldo de esclarecer sobre quem seriam os demais integrantes da organização criminosa, deveria o seu advogado buscar um acordo de colaboração premiada, sendo certo que algumas das consequências do acordo que podem ser aplicadas pelo juiz são o perdão judicial ou a substituição de pena privativa de liberdade por restritiva de direitos.

      B) Ainda que o acordo de “colaboração premiada” seja válido, de maneira adequada estabeleceu o legislador a impossibilidade de condenação exclusivamente com base nas declarações do agente colaborador, nos termos do Art. 4º, § 16º, da Lei nº 12.850/13. Para um decreto condenatório, é necessário que as declarações de Ronaldo sejam confirmadas por outros elementos de prova. Os Tribunais Superiores vêm decidindo que as informações procedentes da “colaboração premiada” precisam ser confirmadas por outros elementos de prova – a chamada prova de corroboração.
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: Sim, deverá o advogado buscar um acordo de colaboração premiada ou delação premiada (0,55), nos termos do Art. 4º, inciso I, da Lei nº 12.850/13 (0,10).
        valores: [ 0, 0.55, 0.65 ]
        componentes:
          - { id: c1, valor: 0.55, termos: [ colaboracao premiada | delacao premiada ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 4, I, Lei 12850" ], requer: c1 }
      - n: B
        secao: PONTUAÇÃO
        descricao: Não é possível a condenação exclusivamente com base nas declarações do agente colaborador (0,35), segundo o Art. 4º, § 16º, da Lei nº 12.850/13 (0,10), devendo ser corroborada por outros elementos de prova (0,15).
        componentes:
          - { id: c1, valor: 0.35, termos: [ exclusivamente | apenas | somente, colaborador | delator | delacao | colaboracao ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 4, § 16º, Lei 12850" ], requer: c1 }
          - { id: c3, valor: 0.15, termos: [ outros elementos | outras provas | corrobora* ] }
  - n: 3
    enunciado: |-
      Sabendo que Vanessa, uma vizinha com quem nunca tinha conversado, praticava diversos furtos no bairro em que morava, João resolve convidá-la para juntos subtraírem R$ 1.000,00 de um cartório do Tribunal de Justiça, não contando para ela, contudo, que era funcionário público e nem que exercia suas funções nesse cartório.

      Praticam, então, o delito, e Vanessa fica surpresa com a facilidade que tiveram para chegar ao cofre do cartório.

      Descoberto o fato pelas câmeras de segurança, são os dois agentes denunciados, em 10 de março de 2015, pela prática do crime de peculato. João foi notificado e citado pessoalmente, enquanto Vanessa foi notificada e citada por edital, pois não foi localizada em sua residência.

      A família de Vanessa constituiu advogado e o processo prosseguiu, mas dele a ré não tomou conhecimento. Foi decretada a revelia de Vanessa, que não compareceu aos atos processuais. Ao final, os acusados foram condenados pela prática do crime previsto no Art. 312 do Código Penal à pena de 02 anos de reclusão. Ocorre que, na verdade, Vanessa estava presa naquela mesma Comarca, desde 05 de março de 2015, em razão de prisão preventiva decretada em outros dois processos.

      Ao ser intimada da sentença, ela procura você na condição de advogado(a).

      **Considerando a hipótese narrada, responda aos itens a seguir.**

      **A) Qual argumento de direito processual poderia ser apresentado em favor de Vanessa em sede de apelação? Justifique. (Valor: 0,65)**

      **B) No mérito, foi Vanessa corretamente condenada pela prática do crime de peculato? Justifique.(Valor: 0,60)**

      *Obs.: o mero “sim” ou “não”, desprovido de justificativa ou mesmo com a indicação de justificativa inaplicável ao caso, não será pontuado.*
    gabarito_comentado: |-
      A) O examinando deveria alegar que, em relação à Vanessa, o processo é nulo desde a citação. Quando Vanessa foi citada por edital, ela estava presa em estabelecimento na mesma unidade da Federação do juízo processante, logo sua citação foi nula, conforme Enunciado 351 da Súmula de Jurisprudência do STF. Como ela não tomou conhecimento da ação e nem mesmo foi interrogada, pois teve sua revelia decretada, o prejuízo é claro. Assim, em sede de apelação, antes de enfrentar o mérito da apelação, deveria o advogado buscar a anulação de todos os atos após sua citação, inclusive da sentença. Poderia, ainda, o candidato justificar a nulidade na exigência trazida pelo Art. 360 do CPP, que prevê que o réu preso deve ser citado pessoalmente.

      B) Vanessa não foi corretamente condenada pela prática do crime de peculato. Em que pese o Art. 30 do Código Penal prever que as “circunstâncias” de caráter pessoal se comunicam quando elementares do crime, não é possível, no caso concreto, a aplicação desse dispositivo, porque o enunciado deixa claro que Vanessa não tinha conhecimento da condição de funcionário público de João, não sendo possível responsabilizá-la por peculato. A simples afirmação de que as circunstâncias pessoais não se comunicam é insuficiente para atribuição da pontuação, pois, quando elementares, poderá haver comunicação, desde que o agente tenha conhecimento dessa situação. Da mesma forma, inadequada a afirmativa no sentido de que o particular não pode ser responsabilizado pelo crime próprio de peculato, pois insuficiente.
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: Nulidade dos atos processuais praticados após sua citação OU nulidade da sentença (0,25), pois a citação por edital foi inválida, já que Vanessa estava presa OU já que a citação de Vanessa deveria ter sido realizada pessoalmente (0,30), nos termos da Súmula 351 do STF OU do art. 360, CPP (0,10).
        componentes:
          - { id: c1, valor: 0.25, termos: [ nulidade | nulos | nula ] }
          - { id: c2, valor: 0.3, alternativas: [ [ edital, presa | preso ], [ pessoalmente | citacao pessoal ] ] }
          - { id: c3, valor: 0.1, dispositivo: [ Súmula 351 STF, "art. 360, CPP" ], requer: c2 }
      - n: B
        secao: PONTUAÇÃO
        descricao: Vanessa não foi corretamente condenada por peculato porque não tinha conhecimento da condição de funcionário público de João, dependendo a comunicação da elementar desse elemento subjetivo OU porque não pode ser aplicado o Art. 30 do CP pela ausência de elemento subjetivo (0,60).
        valores: [ 0, 0.6 ]
        componentes:
          - { id: c1, valor: 0.6, termos: [ funcionario publico, conhecimento | sabia | desconhec* | elemento subjetivo ] }
  - n: 4
    enunciado: |-
      Carlos foi condenado pela prática de um crime de receptação qualificada à pena de 04 anos e 06 meses de reclusão, sendo fixado o regime semiaberto para início do cumprimento de pena. Após o trânsito em julgado da decisão, houve início do cumprimento da sanção penal imposta. Cumprido mais de 1/6 da pena imposta e preenchidos os demais requisitos, o advogado de Carlos requer, junto ao Juízo de Execuções Penais, a progressão para o regime aberto. O magistrado competente profere decisão concedendo a progressão e fixa como condição especial o cumprimento de prestação de serviços à comunidade, na forma do Art. 115 da Lei nº 7.210/84. O advogado de Carlos é intimado dessa decisão.

      **Considerando apenas as informações apresentadas, responda aos itens a seguir.**

      **A) Qual medida processual deverá ser apresentada pelo advogado de Carlos, diferente do habeas corpus, para questionar a decisão do magistrado? (Valor: 0,60)**

      **B) Qual fundamento deverá ser apresentado pelo advogado de Carlos para combater a decisão do magistrado? (Valor: 0,65)**

      *Obs.: o examinando deve fundamentar suas respostas. A mera citação do dispositivo legal não confere pontuação.*
    gabarito_comentado: |-
      A) A medida processual a ser apresentada pelo advogado de Carlos é o agravo previsto no Art. 197 da Lei nº 7.210/84, também conhecido como agravo de execução ou agravo em execução. Prevê o mencionado dispositivo que, das decisões proferidas em sede de execução, será cabível o recurso de agravo. No caso, o enunciado deixa claro que houve decisão condenatória com trânsito em julgado e que a decisão a ser combatida foi proferida pelo Juízo da Execução, analisando progressão de regime.

      B) O argumento a ser apresentado pelo advogado de Carlos é o de que a decisão do magistrado foi equivocada, pois não é possível fixar, como condição especial ao regime aberto, o cumprimento de prestação de serviços à comunidade. O Art. 115 da LEP prevê expressamente que o magistrado, no momento de fixar o regime aberto, poderá fixar condições especiais, além das obrigatórias e genéricas estabelecidas nos incisos desse dispositivo.

      Ocorre que a legislação penal não disciplina quais seriam essas condições especiais, de forma que surgiu a controvérsia sobre a possibilidade de serem fixadas penas substitutivas em atenção a esta previsão. O tema, porém, foi pacificado pelo Superior Tribunal de Justiça, que, no Enunciado 493 de sua Súmula de Jurisprudência, estabeleceu a inadmissibilidade de serem fixadas penas substitutivas (Art. 44 do Código Penal) como condições especiais ao regime aberto. A ideia que prevaleceu foi a de que, apesar de ser possível o estabelecimento de condições especiais, estas não podem ser penas previstas no Código Penal, sob pena de bis in idem ou dupla punição.
    itens:
      - n: A
        secao: PONTUAÇÃO
        descricao: A medida processual a ser apresentada é o Agravo OU Agravo de Execução OU Agravo em Execução (0,50), na forma do Art. 197 da Lei nº 7.210/84 (0,10).
        valores: [ 0, 0.5, 0.6 ]
        componentes:
          - { id: c1, valor: 0.5, termos: [ agravo ] }
          - { id: c2, valor: 0.1, dispositivo: [ "art. 197, LEP" ], requer: c1 }
      - n: B
        secao: PONTUAÇÃO
        descricao: Inadmissibilidade de ser fixada prestação de serviços à comunidade (ou pena substitutiva) como condição especial ao regime aberto (0,40), na forma do Enunciado 493 da Súmula do STJ (0,10), sob pena de configurar dupla punição OU bis in idem (0,15).
        componentes:
          - { id: c1, valor: 0.4, termos: [ prestacao de servicos | pena substitutiva, condicao especial | regime aberto ] }
          - { id: c2, valor: 0.1, dispositivo: [ Súmula 493 STJ ], requer: c1 }
          - { id: c3, valor: 0.15, termos: [ bis in idem | dupla punicao ] }
