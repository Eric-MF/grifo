# Nomes de pessoas que aparecem nas questões tiradas das provas (Peça e fundamento, Por dentro da peça, discursivas
# e objetivas). No build, cada nome vira uma marca ({p1}, {p2}…) e, na tela, a marca vira um nome de
# content/nomes-mitologia.yaml, do mesmo gênero. Assim a questão não se responde decorando quem é quem na prova.
#
# Como o build reconhece uma pessoa:
#   - começa por um nome desta lista (masculinos ou femininos), com maiúscula;
#   - continua com outros nomes ou sobrenomes ("Maria Campos", "João dos Anjos", "Augusto César"): a pessoa inteira
#     vira uma marca só;
#   - a mesma pessoa é reconhecida pelo primeiro nome: "Maria Campos" e, depois, "Maria" são a mesma marca;
#   - o nome logo depois de uma palavra de `antes_de_lugar` é lugar ou coisa, não pessoa ("São Paulo", "Porto Vera
#     Cruz", "Lei Maria da Penha"), e as `expressoes` nunca são pessoas.
# Um nome novo numa prova nova: acrescente aqui. O build avisa as palavras com maiúscula que não reconhece (nem aqui,
# nem em `nao_pessoas`, no fim do arquivo). Quem virou quem em cada questão fica em .cache/nomes-relatorio.txt.
