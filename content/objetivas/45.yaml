  - n: 61
    disciplina: penal
    enunciado: Em 1Q de abril, dia da mentira, Maria resolveu "pregar uma peça" em Pedro, coveiro no cemitério Paz Eterna. Maria pediu a José que divulgasse nas redes sociais que ela falecera após ter sofrido um infarto. Como parte da encenação, Maria sedou-se e deitou-se em um caixão, que foi lacrado e encaminhado por José, com documentos sofisticadamente falsificados, para a sede do Paz Eterna. Sem ser avisado ou desconfiar da farsa, Pedro ficou muito triste e, após orar pela alma de Maria, cumpriu seu dever profissional, realizando a cremação e guardando as cinzas num pote de vidro, que se quebrou. Sobre o procedimento de Pedro, assinale a afirmativa correta.
    alternativas:
      A: Ele não praticou crime, pois agiu com base em erro de tipo invencível.
      B: Ele praticou apenas o delito de vilipêndio culposo das cinzas do cadáver de Maria.
      C: Ele praticou o delito de homicídio culposo por descumprir dever de cuidado objetivo.
      D: Ele praticou o delito de homicídio qualificado pela impossibilidade de reação da vítima.
    correta: A
