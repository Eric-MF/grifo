  - n: 57
    disciplina: penal
    enunciado: Um grupo realizava uma manifestação social pacífica contra o aumento da tarifa de ônibus. A atividade era acompanhada por grande contingente de policiais militares. Rodrigo, um dos manifestantes, de forma exaltada, arremessou uma pedra em uma viatura da Polícia Militar estacionada na localidade, quebrando dolosamente o vidro do para-brisa dianteiro. A partir das informações acima trazidas, assinale a opção que indica o crime cometido por Rodrigo.
    alternativas:
      A: Terrorismo.
      B: Dano simples.
      C: Dano qualificado.
      D: Ilícito civil, pois a conduta descrita não configura crime.
    correta: C
    dispositivos: []
    revisao:
      status: revisado
  - n: 58
    disciplina: penal
    enunciado: Oliver, que já fora condenado por crime culposo anteriormente e que terminara de cumprir sua pena há dois anos, cometeu o crime de lesão corporal de natureza grave, previsto no Art. 129, § 1º, do CP, cuja pena cominada é de um a cinco anos de reclusão. Ele foi condenado à pena de um ano e oito meses de reclusão, tendo sua condenação sido proferida três anos após o término do cumprimento da pena pelo crime culposo anterior. Tomando por base o delito praticado e a pena aplicada, sobre a possibilidade de Oliver ter sua pena privativa de liberdade substituída por duas penas restritivas de direitos, assinale a afirmativa correta.
    alternativas:
      A: A reincidência só impediria a substituição se o crime anterior também fosse doloso.
      B: A reincidência em crime culposo não impede a substituição e tampouco há óbice pelo fato de o crime ser cometido com violência à pessoa.
      C: Uma vez que Oliver é reincidente, a substituição é vedada, sendo indiferente o fato de o crime anterior ser culposo ou mesmo o fato de o novo crime ter sido cometido com violência à pessoa.
      D: Apesar de a reincidência em crime culposo não obstar a substituição, o fato de o crime ter sido cometido com violência à pessoa impede a substituição pela pena restritiva de direitos.
    correta: D
    dispositivos:
      - art. 129, § 1º, cp
    revisao:
      status: revisado
  - n: 59
    disciplina: penal
    enunciado: Rodrigo, brasileiro, obteve bolsa de estudos para intercâmbio de seis meses em uma universidade nos Estados Unidos. Nesse período, Rodrigo começou a namorar Mary, uma jovem estadunidense. Após uma crise de ciúmes, Rodrigo matou Mary, por estrangulamento, no apartamento em que morava na Flórida. O feminicídio constitui infração penal nos Estados Unidos. No dia seguinte aos fatos, Rodrigo retornou ao Brasil. Como advogado da família da vítima, esclareça a viabilidade de aplicação da Lei Penal brasileira a Rodrigo, identificando o princípio penal correspondente.
    alternativas:
      A: O princípio da bandeira ou do pavilhão admite a responsabilidade penal de Rodrigo pelo fato ocorrido no estrangeiro.
      B: O princípio da personalidade passiva impede a responsabilidade penal de Rodrigo, pois a vítima era estadunidense.
      C: O princípio da personalidade ativa enseja a hipótese de extraterritorialidade condicionada, autorizando a aplicação da Lei Penal brasileira a Rodrigo.
      D: O princípio da defesa ou da proteção impede a aplicação da Lei brasileira a fatos ocorridos no exterior, especialmente quando o autor do fato for brasileiro nato.
    correta: C
    dispositivos: []
    revisao:
      status: revisado
  - n: 60
    disciplina: penal
    enunciado: João mora em Ipanema e, há dois anos, faz aula de futevôlei na praia do Leblon, três vezes por semana. João sempre realiza tal trajeto em sua bicicleta elétrica, da marca Bike legal, cor preta com banco de couro marrom. No mês passado, ao final do treino, João pegou uma bicicleta elétrica idêntica à sua e voltou para casa. Dias depois, João foi intimado a comparecer à Delegacia de Polícia para prestar declarações sobre um possível crime de furto, uma vez que o circuito de câmeras permitiu identificar que João havia levado a bicicleta de uma moça de nome Fernanda. No caso narrado, é correto afirmar que João agiu diante de
    alternativas:
      A: erro de tipo essencial.
      B: erro de tipo acidental.
      C: estado de necessidade.
      D: erro de proibição direto.
    correta: A
    dispositivos: []
    revisao:
      status: revisado
  - n: 61
    disciplina: penal
    enunciado: Ateneu e Moisés combinaram a prática conjunta de um crime de furto. Moisés, exímio motorista, aguardou na rua com o carro já ligado e Ateneu, especialista em abertura de cofres, ingressou na residência de um famoso jogador de futebol que atuava no exterior. Ambos pensavam que a casa estava vazia, mas ao ingressar no imóvel, Ateneu se deparou com Izabel, empregada doméstica que trabalhava no local, tendo, então, sacado a arma de fogo que portava, sem a ciência de Moisés, e matado Izabel com um tiro na testa. Ateneu levou consigo joias e dinheiro. Ao tomar ciência da morte de Izabel, Moisés não quis ficar com nada. Diante de tal situação hipotética, assinale a afirmativa correta.
    alternativas:
      A: Moisés não praticou fato criminalmente punível.
      B: Ambos praticaram, em coautoria, os delitos de homicídio e roubo.
      C: Ateneu praticou o delito de furto qualificado pelo resultado morte.
      D: Moisés deve ser responsabilizado mediante aplicação da pena relativa ao crime de furto.
    correta: D
    dispositivos: []
    revisao:
      status: revisado
  - n: 62
    disciplina: penal
    enunciado: Após ter seu pedido de aumento salarial negado, Sara, empregada doméstica, adicionou, com intenção de matar, veneno na feijoada que preparou para Raquel, sua patroa. Raquel sentiu-se mal, sendo socorrida por terceiros e levada ao hospital, onde contraiu uma infecção. Ela veio a falecer dois meses após ser internada, pois a infecção fora agravada pela ingestão de veneno. Sobre tal situação hipotética, assinale a opção que indica, corretamente, o delito praticado por Sara.
    alternativas:
      A: Homicídio doloso tentado.
      B: Homicídio culposo tentado.
      C: Homicídio doloso consumado.
      D: Lesão corporal seguida de morte.
    correta: C
    dispositivos: []
    revisao:
      status: revisado
  - n: 63
    disciplina: processo-penal
    enunciado: Gabriela se dirigiu a uma agência da Caixa Econômica Federal, empresa pública federal, a fim de tentar sacar benefício assistencial pago pela União a pessoas em situação de vulnerabilidade financeira, munida de documentos falsos, em nome de terceira pessoa. Gabriela foi presa em flagrante, sendo constatado que ela estava cumprindo pena em regime aberto domiciliar por condenação relativa a outro fato. Em relação à execução penal, assinale a afirmativa que define as consequências do evento narrado.
    alternativas:
      A: A responsabilização de Gabriela depende de representação da vítima, por se tratar de delito de estelionato.
      B: Ao tomar conhecimento do novo crime, o Juiz da execução pode reconhecer a falta grave e determinar a regressão de regime sem necessidade de contraditório.
      C: Em razão da prática de crime, em tese, no curso da execução, Gabriela perdeu em definitivo o direito de obter livramento condicional pela condenação em execução.
      D: A prática de novo crime cometido por Gabriela configura, em tese, falta disciplinar de natureza grave, autorizando, de forma fundamentada, a regressão de regime per saltum.
    correta: D
    dispositivos: []
    revisao:
      status: revisado
  - n: 64
    disciplina: processo-penal
    enunciado: Marcos foi denunciado como incurso nas penas do delito de furto simples, que consiste em um a quatro anos de reclusão. Ao apresentar resposta à acusação, a defesa se resguardou o direito de se manifestar sobre o mérito em momento oportuno. Entretanto, antes da audiência de instrução e do julgamento, você foi nomeado(a), em substituição ao advogado anterior, e percebeu que, à época da citação, já havia sido concluída a prescrição da pretensão punitiva. Assinale a opção que apresenta, corretamente, sua conduta para o caso.
    alternativas:
      A: Somente pela via do habeas corpus perante o Tribunal será possível alegar, pela primeira vez, a tese de extinção da punibilidade.
      B: Não há que se falar em preclusão, porque o requerimento de extinção da punibilidade pode ser formulado a qualquer tempo.
      C: Há preclusão temporal para alegar a matéria, porque a alegação de extinção da punibilidade somente pode ser feita por ocasião da resposta à acusação.
      D: Aguardar o momento das alegações finais para postular a extinção da punibilidade, sendo certo que a viabilidade de debater o tema depende do reconhecimento de deficiência da defesa anteriormente constituída.
    correta: B
    dispositivos: []
    revisao:
      status: revisado
  - n: 65
    disciplina: processo-penal
    enunciado: Fábio foi submetido a julgamento pelo Tribunal do Júri e, ao final, condenado a uma pena de 15 anos de reclusão, em regime inicial fechado. Você, como advogado(a) de Fábio, interpôs tempestivo e cabível recurso. Assinale a opção que indica o recurso correto interposto e/ou suas características.
    alternativas:
      A: O recurso cabível é de apelação e o efeito devolutivo é restrito aos fundamentos de interposição.
      B: A alegação de decisão manifestamente contrária à prova dos autos só pode ser repetida por, no máximo, três vezes.
      C: O recurso cabível é o recurso em sentido estrito e tem efeito regressivo que pode ser exercido pelos próprios jurados.
      D: O recurso cabível tem ampla devolutividade, podendo o Tribunal rever todos os aspectos da sentença penal condenatória, inclusive as teses atinentes à materialidade e à autoria.
    correta: A
    dispositivos: []
    revisao:
      status: revisado
  - n: 66
    disciplina: processo-penal
    enunciado: Leda se candidatou a uma vaga de emprego na sociedade empresária X. Ao se apresentar, a sócia-administradora Vera afirmou que “pessoas de cor de pele escura não são compatíveis com o perfil da vaga”, impedindo, assim, que Leda prosseguisse no processo seletivo. Indignada, Leda procura você, como advogado(a), a fim de defender seus interesses. Atuando na seara criminal em defesa dos interesses de Leda, você pode
    alternativas:
      A: propor acordo de não persecução penal à sociedade empresária X.
      B: ajuizar queixa-crime em face de Vera pelo delito de ação penal privada em tese ocorrido.
      C: promover, diretamente, a ação penal privada subsidiária da pública, de competência da Justiça Federal.
      D: comunicar o fato à autoridade policial e/ou ao Ministério Público, por se tratar de fato sujeito à ação penal pública incondicionada.
    correta: D
    dispositivos: []
    revisao:
      status: revisado
  - n: 67
    disciplina: processo-penal
    enunciado: Bernardo agrediu Carolina, sua ex-companheira, causando-lhe lesões corporais leves, em razão de a vítima ser mulher. O delito em questão é apenado com reclusão de dois a cinco anos. Na qualidade de advogado(a) de Carolina, cabe notar que,
    alternativas:
      A: apesar do término do relacionamento, as disposições da Lei de Violência Doméstica e Familiar contra a Mulher são aplicáveis; ademais, não é cabível o Acordo de Não Persecução Penal, não havendo medida processual consensual em favor de Bernardo.
      B: devido ao término do relacionamento, as disposições da Lei de Violência Doméstica e Familiar contra a Mulher não são aplicáveis, mas Bernardo não pode se beneficiar de sursis processual ante a quantidade de pena abstratamente cominada ao delito.
      C: apesar do término do relacionamento, as disposições da Lei de Violência Doméstica e Familiar contra a Mulher são aplicáveis, de forma a se admitir a retratação da representação de Carolina, antes do recebimento da denúncia, em audiência especialmente designada para tal fim.
      D: devido ao término do relacionamento, as disposições da Lei de Violência Doméstica e Familiar contra a Mulher não são aplicáveis, de modo que Bernardo pode se beneficiar de sursis processual.
    correta: A
    dispositivos: []
    revisao:
      status: revisado
  - n: 68
    disciplina: processo-penal
    enunciado: Em uma audiência, o Ministério Público indicou como testemunha a psiquiatra do réu. Após a qualificação da testemunha, você, na condição de advogado(a) do réu, deve
    alternativas:
      A: solicitar exceção de suspeição da testemunha, em razão de sua profissão.
      B: oferecer contradita, alegando ser a testemunha proibida de depor por ter conhecimento dos fatos em razão de sua profissão.
      C: oferecer exceção de litispendência, já que a testemunha tem conhecimento dos fatos em razão de sua profissão.
      D: aguardar para alegar a nulidade apenas em eventual recurso extraordinário, momento previsto na legislação como o único adequado para esse tipo de arguição.
    correta: B
