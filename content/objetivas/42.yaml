  - n: 58
    disciplina: penal
    enunciado: Ana Paula é repórter esportiva de uma emissora de televisão. Ao participar de uma reportagem ao vivo na mídia televisiva, um torcedor presente ao estádio, com intenção de satisfazer sua própria lascívia, a abraça à força, beijando-a no rosto. Ana Paula sente-se afrontada em sua liberdade sexual. Em razão do fato, ela procura você, como advogado(a), para saber como proceder. Assinale a afirmativa que apresenta corretamente sua orientação.
    alternativas:
      A: O fato constitui importunação sexual e se processa mediante ação penal pública incondicionada.
      B: O ato deve ser identificado como delito de injúria real e se processa mediante ação penal privada.
      C: O episódio equivale a estupro e se processa mediante ação penal pública condicionada à representação da ofendida.
      D: O caso tipifica posse sexual mediante fraude ou outro meio que dificulte ou impossibilite a livre manifestação de vontade da vítima e se processa mediante queixa.
    correta: A
