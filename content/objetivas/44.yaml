questoes:
  - n: 57
    disciplina: penal
    enunciado: Matheus foi a uma festa de réveillon onde reencontrou sua exnamorada, Laís, sendo ambos maiores e capazes. Assim que a viu, ele se aproximou dela e, a partir daí, iniciaram uma animada conversa sobre os “velhos tempos”. Em determinado momento, Matheus, sem a anuência de Laís, acariciou suas nádegas e tentou beijá-la, para satisfazer sua própria lascívia. Acerca da tipificação da conduta de Matheus, assinale a afirmativa correta.
    alternativas:
      A: É fato atípico.
      B: É crime de estupro.
      C: É crime de assédio sexual.
      D: É crime de importunação sexual.
    correta: D
    dispositivos: []
    revisao:
      status: rascunho
  - n: 58
    disciplina: penal
    enunciado: Saulo, em razão de seu posicionamento político, foi chamado de “burro” e “idiota” por João, Paulo e Sérgio, seus adversários políticos, que tinham a intenção de ofender sua dignidade e decoro. Inconformado, Saulo decidiu processar seus três ofensores. Após a propositura da queixa, Saulo reconciliou-se com Sérgio, sendo o perdão dado pela vítima aceito pelo ofensor, e comunicou o fato ao Juizado Especial em que tramitava a ação penal. Em relação ao caso narrado, assinale a opção que indica, corretamente, o crime cometido pelos três amigos e as implicações da reconciliação entre Saulo e Sérgio.
    alternativas:
      A: Injúria; o perdão concedido a Sérgio é de natureza personalíssima.
      B: Calúnia; o perdão concedido a Sérgio torna perempta a ação em relação a João e a Paulo.
      C: Difamação; o perdão concedido a Sérgio se aplica, obrigatoriamente, a João e a Paulo.
      D: Injúria; o perdão concedido a Sérgio se aplica, obrigatoriamente, a João e a Paulo.
    correta: D
    dispositivos: []
    revisao:
      status: rascunho
  - n: 59
    disciplina: penal
    enunciado: Thiago, 21 anos de idade, e Vinicius, 17 anos, se conheceram no interior de uma boate. Alterados em razão da ingestão de cerveja, decidiram praticar um crime de furto em um posto de gasolina, mas foram abordados por policiais logo após a prática delitiva. Apenas naquele momento, Thiago veio a tomar conhecimento da idade de Vinicius, e que ele já tinha sido apreendido uma vez pela suposta prática de ato infracional análogo ao crime de dano. O Ministério Público ofereceu denúncia em face de Thiago como incurso nas penas do Art. 155, § 4º, inciso IV, do CP (furto qualificado pelo concurso de agentes) e do Art. 244-B do ECA (corrupção de menores). Assinale a opção que indica a alegação que você, como advogado(a) de defesa de Thiago, deve apresentar para questionar a capitulação delitiva.
    alternativas:
      A: A conduta não configura crime de corrupção de menores, em razão do erro de tipo permissivo, podendo Thiago apenas ser condenado pelo crime de furto simples.
      B: A conduta não configura crime de corrupção de menores, em razão do erro de tipo essencial, podendo Thiago apenas ser condenado pelo crime de furto qualificado.
      C: O furto supostamente praticado seria simples e não qualificado, diante da inimputabilidade de Vinicius, apesar de possível a condenação pelo crime de corrupção de menores.
      D: O furto supostamente praticado seria simples, diante da inimputabilidade de Vinicius, bem como não seria possível a condenação pelo crime de corrupção de menores, diante da natureza material do delito e da apreensão anterior de Vinicius.
    correta: B
    dispositivos:
      - art. 155, § 4º, IV, cp
      - art. 244-B, lei 8069
    revisao:
      status: rascunho
  - n: 60
    disciplina: penal
    enunciado: Marisa administrava os proventos de pensão recebidos por sua mãe, Sônia, que faleceu em dezembro de 2022. Com a intenção de continuar recebendo os proventos, Marisa deixou de comunicar à autarquia previdenciária o falecimento de Sônia e, assim, conseguiu efetuar os saques dos valores depositados nos meses de janeiro a março de 2023. Em abril, a autarquia recebeu notícia do falecimento e cessou os pagamentos. Ato contínuo, apurou o valor dos saques indevidos realizados por Marisa após o falecimento da segurada, acrescidos de multa e juros e a inscreveu em dívida ativa. Marisa, notificada, efetuou o pagamento integral do débito, de forma parcelada, entre os meses de outubro de 2023 e janeiro de 2024. A denúncia foi ajuizada em janeiro de 2024, e recebida em fevereiro de 2024. De acordo com a teoria do crime, assinale a opção que apresenta o que a defesa de Marisa deve, corretamente, alegar.
    alternativas:
      A: Desistência voluntária.
      B: Arrependimento eficaz.
      C: Arrependimento posterior.
      D: Exercício regular de um direito.
    correta: C
    dispositivos: []
    revisao:
      status: rascunho
  - n: 61
    disciplina: penal
    enunciado: Pierre, estrangeiro, nacional e residente no país Alfa, veio ao Brasil, onde praticou o crime de homicídio contra Bruna, cidadã brasileira. Em seguida, Pierre deixou o território nacional e retornou ao seu país de residência. Você, como advogado(a) de Pierre, deve analisar a aplicação da lei penal brasileira ao caso. Assinale a opção que apresenta seu parecer.
    alternativas:
      A: Somente a lei do país Alfa é aplicável, pois Pierre saiu do território nacional.
      B: A lei brasileira só é aplicável se o fato também for considerado crime no país Alfa.
      C: A lei brasileira é aplicável, de forma condicionada, diante do fato de a vítima ser brasileira.
      D: A lei brasileira é aplicável, independentemente de o fato ser crime no país de domicílio ou da nacionalidade de Pierre.
    correta: D
    dispositivos: []
    revisao:
      status: rascunho
  - n: 62
    disciplina: penal
    enunciado: Hermes, aposentado com 65 anos de idade, encontrou sua esposa, Diana, 40 anos mais jovem, em plena execução de ato sexual com seu primo, Aquiles, também sexagenário. Tomado pela fúria, Hermes sacou sua arma de fogo e disparou um tiro no pescoço de Aquiles. Hermes possuía 18 munições restantes no cartucho de sua arma, mas conseguiu controlar sua ira e, arrependido, levou Aquiles ao hospital. Apesar de ter sofrido ferimento que lhe gerou perigo à vida, devido ao rápido atendimento médico, Aquiles sobreviveu e, como ficou livre de sequelas, retomou suas ocupações habituais em uma semana. Atualmente, Hermes, Diana e Aquiles mantêm relação de amizade. Com base na situação hipotética narrada, assinale a opção que indica, corretamente, o delito praticado por Hermes.
    alternativas:
      A: Tentativa de homicídio.
      B: Crime de lesão corporal de natureza leve.
      C: Crime de lesão corporal de natureza grave.
      D: Crime de exercício arbitrário das próprias razões.
    correta: C
    dispositivos: []
    revisao:
      status: rascunho
  - n: 63
    disciplina: processo-penal
    enunciado: "No dia 10 de agosto de 2023, foi publicada a decisão de rejeição da queixa-crime relativa ao crime de injúria (pena: um a seis meses de detenção), que teria sido praticado por Maria Aparecida contra Augusto. Augusto, inconformado com a sentença, procurou você, como advogado(a), para se insurgir contra a decisão de rejeição de exordial acusatória. Assinale a opção que indica, corretamente, o recurso cabível para o caso."
    alternativas:
      A: Agravo.
      B: Apelação.
      C: Recurso Inominado.
      D: Recurso em Sentido Estrito.
    correta: B
    peca: apelacao
    dispositivos: []
    revisao:
      status: rascunho
  - n: 64
    disciplina: processo-penal
    enunciado: Cauã e Mayara são indígenas integrados e mantêm relação íntima de afeto, sendo residentes em comunidade tradicional. Certo dia, motivado por ciúmes, Cauã agrediu Mayara, atingindo-a no rosto, fato que ocasionou uma lesão corporal leve. Sobre a orientação assumida pelo(a) advogado(a) de defesa de Mayara, assinale a afirmativa correta.
    alternativas:
      A: A ação penal é pública e incondicionada, por se tratar de disputa sobre direito indígena, de competência da Vara Criminal da Justiça Estadual.
      B: A ação penal depende de representação da ofendida e seguirá o rito do Juizado Especial Criminal, perante a Justiça Federal, pelo fato de envolver indígenas como autor e vítima.
      C: A ação penal é pública e incondicionada, por se tratar de violência doméstica e familiar contra a mulher, e a competência para julgamento é da Justiça Federal, em razão de envolver indígenas.
      D: A ação penal é pública e incondicionada, e a competência para julgamento é do Juizado de Violência Doméstica e Familiar contra a Mulher, ante a relação íntima de afeto existente entre autor e vítima.
    correta: D
    dispositivos: []
    revisao:
      status: rascunho
  - n: 65
    disciplina: processo-penal
    enunciado: Peterson teve sua prisão temporária decretada pelo prazo de trinta dias, ao ser investigado pela prática do crime de homicídio culposo na direção de veículo automotor, disposto no Art. 302 da Lei nº 9.503/1997 (Código de Trânsito Brasileiro), cuja pena cominada é de dois a quatro anos de detenção. A decisão foi fundamentada na necessidade da coleta de provas imprescindíveis durante a investigação policial. Você foi procurado(a), como advogado(a), para atuar no melhor interesse de Peterson, no primeiro dia da sua prisão. Assinale a opção que apresenta, corretamente, o pedido cabível tendo em vista os interesses de seu cliente.
    alternativas:
      A: A liberdade provisória com arbitramento de fiança, pois a pena máxima do crime não ultrapassa quatro anos.
      B: A liberdade provisória com aplicação de medidas cautelares diversas da prisão, pois não demonstrada a imprescindibilidade da medida.
      C: O relaxamento imediato da prisão ilegal, pois o crime de homicídio culposo na direção de veículo automotor não está no rol dos crimes que autorizam a prisão temporária.
      D: O relaxamento da prisão ilegal a partir do quinto dia de prisão, pois a prática do homicídio culposo na direção de veículo automotor não configura crime hediondo e o prazo da prisão temporária deveria ser de 5 dias, e não, de 30 dias.
    correta: C
    dispositivos:
      - art. 302, lei 9503
    revisao:
      status: rascunho
  - n: 66
    disciplina: processo-penal
    enunciado: André foi denunciado por ter subtraído a bolsa de Márcia, mediante rompimento de obstáculo. A subtração foi legitimamente comprovada no processo, porém, não obstante tenha o rompimento de obstáculo deixado vestígios, não foi realizada qualquer perícia, sem justificativa plausível. Finda a instrução, manifestou-se o Ministério Público pela condenação, conforme a denúncia, sem requerer qualquer diligência. Dada a palavra ao(à) advogado(a) de André, em alegações finais defensivas, este(a) deve requerer
    alternativas:
      A: a absolvição sumária de André, por não constituir o fato infração penal.
      B: o afastamento da qualificadora do furto, desclassificando a conduta para furto simples.
      C: a nulidade do processo desde o recebimento da denúncia, a fim de que seja realizada a prova pericial.
      D: a conversão do julgamento em diligência, a fim de que se realize prova pericial para comprovar a existência do rompimento de obstáculo.
    correta: B
    dispositivos: []
    revisao:
      status: rascunho
  - n: 67
    disciplina: processo-penal
    enunciado: Foi oferecida denúncia em face de Samuel, pelo delito de furto, que foi distribuída ao Juízo competente, tendo havido regular instrução processual. Os autos foram conclusos para sentença, porém, o Juiz titular, que presidiu a instrução, afastou-se por dois dias para participar de um curso oficial. Por isso, a Corregedoria do Tribunal designou Juiz substituto para atuar naquele Juízo. O Magistrado substituto prolatou a sentença, condenando Samuel, com base na prova oral colhida, ainda que nenhuma urgência houvesse nesse processo. Com base nas informações do enunciado, assinale a opção que indica a alegação que você, como advogado(a) de Samuel, deve apresentar.
    alternativas:
      A: Violação ao princípio da identidade física do Juiz, causa de nulidade relativa da sentença.
      B: Suspeição do Magistrado que prolatou a sentença, como preliminar de mérito na apelação.
      C: Impedimento do Magistrado que prolatou a sentença, causa de nulidade absoluta da decisão.
      D: Violação ao princípio do Juiz Natural, pois deveria ter havido sorteio entre os Juízes substitutos, e não, a designação por livre escolha da Corregedoria do Tribunal.
    correta: A
    dispositivos: []
    revisao:
      status: rascunho
  - n: 68
    disciplina: processo-penal
    enunciado: Flávio foi preso em flagrante junto com outros três indivíduos, todos acusados pela prática do crime de roubo, disposto no Art. 157 do CP. Flávio permaneceu preso preventivamente durante o processo. Na audiência de instrução e julgamento, uma das testemunhas arroladas pela defesa afirmou que, no dia dos fatos, Flávio estava trabalhando na loja de material de construção que funcionava na frente do local onde os autores do fato estavam praticando o crime, e acabou sendo preso junto com os outros acusados. A testemunha também mencionou que a loja possui sistema de monitoramento de segurança, e que o dono da loja guardou imagens desse dia, para fornecê-las em sede policial se isso fosse demandado. O interrogatório dos réus foi regularmente realizado. Diante do fato narrado, assinale a opção que indica, corretamente, a medida jurídica que você, como advogado(a) de Flávio, deve adotar.
    alternativas:
      A: Apresentar alegações finais por memoriais, requerendo as imagens da loja.
      B: Requerer diligências para oficiar à loja de material de construções para que forneça as imagens do dia dos fatos.
      C: Apresentar alegações finais orais em audiência, com pedido de absolvição sumária, diante do depoimento da testemunha.
      D: Requerer a nulidade da audiência de instrução e julgamento, pois as imagens da loja não foram apresentadas em sede policial.
    correta: B
    dispositivos:
      - art. 157, cp
    revisao:
      status: rascunho
