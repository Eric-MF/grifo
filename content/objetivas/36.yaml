questoes:
  - n: 57
    disciplina: penal
    enunciado: A livraria Sabedoria sofreu ação de execução por título extrajudicial movida pelo Banco Carvalho em virtude da inadimplência de contrato de empréstimo. Citada, a executada não realizou o pagamento da dívida, tendo sofrido o bloqueio de dinheiro depositado em instituição financeira. Com o objetivo de liberar o valor bloqueado, ofereceu, em substituição à penhora, fiança bancária ou o percentual de 10% de seu faturamento. Intimada, a exequente não concordou com a substituição, sob o fundamento de que a penhora em dinheiro é preferencial e não pode ser substituída por qualquer outra, fundamento que foi acolhido pela juíza da causa. Diante desses fatos, assinale a afirmativa correta.
    alternativas:
      A: A decisão judicial está errada, pois a penhora do faturamento é equivalente a dinheiro, sendo cabível a substituição.
      B: A decisão judicial está correta, pois a penhora em dinheiro é prioritária e somente poderia ser substituída com a concordância da exequente.
      C: A decisão judicial está errada, pois a fiança bancária equipara-se a dinheiro, desde que em valor não inferior ao débito constante da inicial, acrescido de trinta por cento.
      D: a decisão judicial está correta, pois dinheiro, fiança bancária e penhora do faturamento são substituíveis entre si para fins de penhora.
    correta: C
    dispositivos: []
    revisao:
      status: rascunho
  - n: 58
    disciplina: penal
    enunciado: Robson, diretor-presidente da Sociedade Empresária RX Empreendimentos, telefona para sua secretária Camila e solicita que ela compareça à sua sala. Ao ingressar no recinto, Camila é convidada para sentar ao lado de Robson no sofá, pois ele estaria precisando conversar com ela. Apesar de achar estranho o procedimento, Camila se senta ao lado de seu chefe. Durante a conversa, Robson afirma que estaria interessado nela e a convida para ir a um motel. Camila recusa o convite e, ato contínuo, Robson afirma que se ela não aceitar, nem precisa retornar ao trabalho no dia seguinte, pois estaria demitida. Camila, desesperada, sai da sala de seu chefe, pega sua bolsa e vai até a Delegacia Policial do bairro para registrar o fato. Diante das informações apresentadas, é correto afirmar que a conduta praticada por Robson se amolda ao crime de
    alternativas:
      A: tentativa de assédio sexual (Art. 216-A), não chegando o crime a ser consumado na medida em que se trata de crime material, exigindo a produção do resultado, o que não ocorreu na hipótese;
      B: assédio sexual consumado, uma vez que o delito é formal, ocorrendo a sua consumação independentemente da obtenção da vantagem sexual pretendida;
      C: fato atípico, uma vez que a conduta praticada por Robson configura mero ato preparatório do crime de assédio sexual, sendo certo que os atos preparatórios não são puníveis;
      D: importunação sexual (Art. 215-A), uma vez que Robson praticou, contra a vontade de Camila, ato visando à satisfação de sua lascívia. PROVA APLICADA EM 23/10/2022 16
    correta: B
    dispositivos: []
    revisao:
      status: rascunho
  - n: 59
    disciplina: penal
    enunciado: André, primário, e Fábio, reincidente, foram condenados por crime de latrocínio em concurso de pessoas. Durante a execução penal, ambos requereram a progressão de regime, visto que já haviam cumprido parte da pena. André fundamentou seu pedido em "bom comportamento", comprovado pelo diretor do estabelecimento prisional. Fábio, por sua vez, fundamentou seu pedido em razão de ter sido condenado na mesma época de seu comparsa, André. Dessa forma, segundo os princípios que regem a Execução Penal e o Direito Penal, é correto afirmar que
    alternativas:
      A: de acordo com o princípio da isonomia, que garante igualdade de tratamento entre os presos, é vedada aplicação de frações de progressão de regime diferenciadas a cada um dos acusados.
      B: de acordo com o princípio da individualização da pena, o Juiz da execução penal deverá alterar as penas dos acusados, conforme o comportamento prisional de cada um.
      C: é assegurada a progressão de regime aos crimes hediondos, mas a fração de progressão varia para cada indivíduo, ainda que ambos condenados pelo mesmo fato.
      D: o princípio do livre convencimento motivado autoriza o Juiz a aplicar a progressão de regime no momento processual que entender adequado, pois não há prazo para o Juiz.
    correta: C
    dispositivos: []
    revisao:
      status: rascunho
  - n: 60
    disciplina: penal
    enunciado: Tainá, legalmente autorizada a pilotar barcos, foi realizar um passeio de veleiro com sua amiga Raquel. Devido a uma mudança climática repentina, o veleiro virou e começou a afundar. Tainá e Raquel nadaram, desesperadamente, em direção a um tronco de árvore que flutuava no mar. Apesar de grande, o tronco não era grande o suficiente para suportar as duas amigas ao mesmo tempo. Percebendo isso, Raquel subiu no tronco e deixou Tainá afundar, como único meio de salvar a própria vida. A perícia concluiu que a morte de Tainá se deu por afogamento. A partir do caso relatado, assinale a opção que indica a natureza da conduta praticada por Raquel.
    alternativas:
      A: Raquel deverá responder pelo crime de omissão de socorro.
      B: Raquel agiu em legítima defesa, causa excludente de ilicitude.
      C: Raquel deverá responder pelo crime de homicídio consumado.
      D: Raquel agiu em estado de necessidade, causa excludente de ilicitude.
    correta: D
    dispositivos: []
    revisao:
      status: rascunho
  - n: 61
    disciplina: penal
    enunciado: Túlio e Alfredo combinaram de praticar um roubo contra uma joalheria. Os dois ingressam na loja, e Alfredo, com o emprego de arma de fogo, exige que Fernanda, a vendedora, abra a vitrine e entregue os objetos expostos. Enquanto Alfredo vasculha as gavetas da frente da loja, Túlio ingressa nos fundos do estabelecimento com Fernanda, em busca de joias mais valiosas, momento em que decide levá-la ao banheiro e, então, mantém com Fernanda conjunção carnal. Após, Túlio e Alfredo fogem com as mercadorias. Em relação às condutas praticadas por Túlio e Alfredo, assinale a afirmativa correta.
    alternativas:
      A: Túlio e Alfredo responderão por roubo duplamente circunstanciado, pelo concurso de pessoas e emprego de arma de fogo, e pelo delito de estupro, em concurso material.
      B: Túlio responderá por roubo circunstanciado pelo concurso de pessoas e estupro; Alfredo responderá por roubo duplamente circunstanciado, pelo concurso de pessoas e emprego de arma de fogo.
      C: Alfredo e Túlio responderão por roubo circunstanciado pelo concurso de pessoas e emprego de arma de fogo; Túlio também responderá por estupro, em concurso material.
      D: Túlio e Alfredo responderão por roubo circunstanciado pelo concurso de pessoas e emprego de arma de fogo; Túlio responderá por estupro, ao passo que Alfredo responderá por participação de menor importância no delito de estupro.
    correta: C
    dispositivos: []
    revisao:
      status: rascunho
  - n: 62
    disciplina: penal
    enunciado: Policiais militares em patrulhamento de rotina, ao passarem próximos a um conhecido ponto de venda de drogas, flagraram Elias, reincidente específico no crime de tráfico ilícito de entorpecentes, vendendo um “pino” contendo cocaína a um usuário local. Ao perceber que os policiais dirigiam-se para a abordagem, o aludido usuário, de modo perspicaz, jogou ao chão o entorpecente adquirido e conseguiu se evadir mas Elias acabou sendo preso em flagrante. Ato contínuo, em revista pessoal, nos bolsos de Elias foram encontrados mais 119 (cento e dezenove) pinos de material branco pulverulento, que se comprovou, a posteriori, tratar-se de um total de 600g de substância entorpecente capaz de causar dependência, conhecida como cocaína. Diante de tal situação e após cumpridos todos os trâmites legais, o Ministério Público denunciou Elias pela prática do crime de tráfico ilícito de entorpecentes, duas vezes, nas modalidades “vender” e “trazer consigo”, em concurso material de crimes. A capitulação feita pelo parquet está
    alternativas:
      A: incorreta, tendo em vista que a norma do Art. 33 da Lei nº 11.343/06 é de ação múltipla, devendo Elias responder pela prática de um único crime de tráfico ilícito de entorpecentes.
      B: incorreta, porque, embora os verbos – vender e trazer consigo – integrem o tipo penal do Art. 33 da Lei nº 11.343/06, a hipótese é de concurso formal de crimes, pois Elias, mediante uma só ação, praticou dois crimes.
      C: correta, uma vez que ambos os verbos – vender e trazer consigo – constam no tipo penal do Art. 33 da Lei nº 11343/06, indicandose a pluralidade de condutas.
      D: incorreta, pois Elias faz jus à causa de redução prevista no Art. 33, § 4º, da Lei nº 11.343/06, por não se comprovar ser dedicado a atividades criminosas. PROVA APLICADA EM 23/10/2022 17
    correta: A
    dispositivos:
      - art. 33, lei 11343
      - art. 33, § 4º, lei 11343
    revisao:
      status: rascunho
  - n: 63
    disciplina: processo-penal
    enunciado: Américo é torcedor fanático de um grande clube brasileiro, que disputa todos os principais campeonatos nacionais e internacionais. Américo recebeu a notícia de que seu clube iria jogar uma partida no estádio de sua cidade, porém, ao tentar adquirir os ingressos, descobriu que estes já haviam se esgotado. André, seu vizinho, torcedor do time rival, sempre incomodado com os gritos de comemoração que Américo soltava em dias de jogo, resolveu se vingar, oferecendo ingressos falsos para Américo. Sem saber da falsidade, Américo aceitou a oferta, porém, no momento da concretização do pagamento, percebeu, por sua acurada expertise no tema ingressos de futebol, que os ingressos eram falsos. Com base na situação hipotética, é correto afirmar que a conduta de André corresponde ao crime de
    alternativas:
      A: “cambismo”, do Estatuto do Torcedor, na modalidade tentada.
      B: falsificação de documento público.
      C: estelionato, na modalidade tentada.
      D: uso de documento falso.
    correta: C
    dispositivos: []
    revisao:
      status: rascunho
  - n: 64
    disciplina: processo-penal
    enunciado: "Vitor respondia ação penal pela suposta prática do crime de ameaça (pena: 01 a 06 meses de detenção ou multa) contra sua excompanheira Luiza, existindo medida protetiva em favor da vítima proibindo o acusado de se aproximar dela, a uma distância inferior a 100m. Mesmo intimado da medida protetiva de urgência, Vitor se aproximou de Luiza e tentou manter com ela contato, razão pela qual a vítima, temendo por sua integridade física, procurou você, como advogado(a), e narrou o ocorrido. Nessa ocasião, Luiza esclareceu que, após a denúncia do crime de ameaça, Vitor veio a ser condenado, definitivamente, pela prática do delito de uso de documento falso por fatos que teriam ocorrido antes mesmo da infração penal cometida no contexto de violência doméstica e familiar contra a mulher. Com base nas informações expostas, você, como advogado(a) de Luiza, deverá esclarecer à sua cliente que"
    alternativas:
      A: não poderá ser decretada a prisão de Vitor, pois não há situação de flagrância.
      B: não poderá ser decretada a prisão preventiva de Vitor, pois o crime de ameaça tem pena inferior a 04 anos e ele é tecnicamente primário.
      C: poderá ser decretada a prisão preventiva de Vitor, pois, apesar de o crime de ameaça ter pena máxima inferior a 04 anos, o autor do fato é reincidente.
      D: poderá ser decretada a prisão preventiva de Vitor, mesmo sendo tecnicamente primário, tendo em vista a existência de medida protetiva de urgência anterior descumprida.
    correta: D
    dispositivos: []
    revisao:
      status: rascunho
  - n: 65
    disciplina: processo-penal
    enunciado: Hamilton, vendedor em uma concessionária de automóveis, mantém Priscila em erro, valendo-se de fraude para obter vantagem econômica ilícita, consistente em valor de comissão maior do que o devido na venda de um veículo automotor. A venda e a obtenção da vantagem ocorrem no dia 20 de novembro de 2019. O fato chega ao conhecimento da autoridade policial por notícia feita pela concessionária, ainda em novembro de 2019 e, em 2 de março de 2020, o Ministério Público oferece denúncia em face de Hamilton, imputando-lhe a prática do crime de estelionato. Embora tenha sido ouvida em sede policial, Priscila não manifestou sua vontade de ver Hamilton processado pela prática delitiva. A denúncia é recebida e a defesa impetra habeas corpus perante o Tribunal de Justiça. No caso, assinale a opção que apresenta a melhor tese defensiva a ser sustentada.
    alternativas:
      A: A ausência de condição específica de procedibilidade, em razão da exigência de representação da ofendida.
      B: A ausência de condição da ação, pois caberia à vítima o ajuizamento da ação penal privada no caso concreto.
      C: A necessidade de remessa dos autos ao Procurador-geral de Justiça para que haja oferta de acordo de não persecução penal.
      D: A atipicidade da conduta, em razão do consentimento da vítima, consistente na ausência de manifestação de ver o acusado processado.
    correta: A
    dispositivos: []
    revisao:
      status: rascunho
  - n: 66
    disciplina: processo-penal
    enunciado: No curso de inquérito que, no início da pandemia de Covid-19, apura a prática do crime contra as relações de consumo descrito no Art. 7º, inciso VI, da Lei nº 8.137/90, a autoridade policial representa pela interceptação do ramal telefônico de João, comerciante indiciado, sustentando a imprescindibilidade da medida para a investigação criminal. O crime em questão consiste na sonegação ou retenção de insumos e bens, para fim de especulação, e é punido com pena de detenção de 2 a 5 anos ou multa. A interceptação é autorizada pelo prazo de quinze dias, em decisão fundamentada, na qual o juízo considera demonstrada sua necessidade, bem como a existência de indícios suficientes de autoria. No caso narrado, o(a) advogado(a) do comerciante poderia sustentar a ilegalidade da interceptação das comunicações telefônicas, porque
    alternativas:
      A: o prazo fixado pelo juiz excede o legalmente permitido.
      B: a interceptação não é admitida quando o fato objeto da investigação constitui infração penal punida, no máximo, com pena de detenção.
      C: a interceptação não é admitida quando o fato objeto da investigação constitui infração penal cuja pena máxima não seja superior a cinco anos.
      D: caberia apenas ao Ministério Público requerê-la. PROVA APLICADA EM 23/10/2022 18
    correta: B
    dispositivos:
      - art. 7, VI, lei 8137
    revisao:
      status: rascunho
  - n: 67
    disciplina: processo-penal
    enunciado: O prefeito do Município de Canto Feliz, juntamente com o juiz estadual e o promotor de justiça, todos da mesma comarca (Art. 77, inciso I, do CPP), cometeu um crime contra a administração pública federal - interesse da União -, delito que não era de menor potencial ofensivo e nem cabia, objetivamente, qualquer medida penal consensual. Todos foram denunciados pelo Ministério Público federal perante a 1ª Vara Criminal da Justiça Federal da correspondente Seção Judiciária. Recebida a denúncia, a fase probatória da instrução criminal foi encerrada, sendo que o Dr. João dos Anjos, que era advogado em comum aos réus (inexistência de colidência de defesas), faleceu, tendo os acusados constituído um novo advogado para apresentar memoriais (Art. 403, § 3º, do CPP) e prosseguir em suas defesas. Nessa fase de alegações finais, somente há uma matéria de mérito a ser defendida em relação a todos os réus, que é a negativa de autoria. Todavia, antes de adentrar ao mérito, existe uma questão preliminar processual a ser suscitada, relativa à competência, e consequente arguição de nulidade. Como advogado(a) dos réus, assinale a opção que indica como você fundamentaria a existência dessa nulidade.
    alternativas:
      A: O processo é nulo, por ser o juízo relativamente incompetente, aproveitando-se os atos instrutórios. Anulado o processo, este deverá prosseguir para todos a partir da apresentação dos memoriais perante uma das Turmas do Tribunal Regional Federal da respectiva Seção Judiciária, por serem os réus detentores de foro especial por prerrogativa de função junto àquele órgão jurisdicional.
      B: O processo é nulo, por ser o juízo absolutamente incompetente desde o recebimento da denúncia, devendo ser reiniciado para todos a partir deste momento processual perante o Tribunal de Justiça do respectivo Estado da Federação, por serem os réus detentores de foro especial por prerrogativa de função perante aquela Corte estadual de justiça.
      C: O processo é nulo, por ser o juízo relativamente incompetente, aproveitando-se os atos instrutórios. Anulado o processo este deverá prosseguir a partir da apresentação dos memoriais perante o Tribunal de Justiça do respectivo Estado da Federação, por serem todos os réus detentores de foro especial por prerrogativa de função perante aquela Corte estadual de justiça.
      D: O processo é nulo, por ser o juízo absolutamente incompetente. Em relação ao Prefeito do Município de Canto Feliz, o processo deverá ser remetido a uma das Turmas do Tribunal Regional Federal da respectiva Seção Judiciária, sendo reiniciado a partir do recebimento da denúncia. Em relação ao Juiz estadual e ao Promotor de Justiça, há nulidade por vício de incompetência absoluta, com a necessidade de desmembramento do processo, devendo ser reiniciado para ambos a partir do recebimento da denúncia, sendo de competência do Tribunal de Justiça do respectivo Estado da Federação.
    correta: D
    dispositivos:
      - art. 77, I, cpp
      - art. 403, § 3º, cpp
    revisao:
      status: rascunho
  - n: 68
    disciplina: processo-penal
    enunciado: Renata, primária, foi condenada à pena de 5 (cinco) anos de reclusão, em regime fechado, por crime de estelionato, em continuidade delitiva, sendo atestado o seu bom comportamento carcerário. Rogério, marido de Renata, que cuidava da filha do casal de 10 (dez) anos de idade, veio a falecer, sendo que Renata já havia cumprido 1/8 (um oitavo) da pena no regime fechado. A filha de Renata está morando provisoriamente com uma amiga de Renata, por não existir qualquer parente para cuidar da criança. Em relação ao cumprimento de pena por Renata, você, como advogado(a), postularia ao juízo da execução a progressão para o regime
    alternativas:
      A: semiaberto, em razão de a penitente já ter cumprido a fração de pena estabelecida na Lei de Execução Penal e comprovado o bom comportamento carcerário.
      B: semiaberto e a saída temporária, em razão de a penitente já ter cumprido o percentual de pena estabelecido na Lei de Execução Penal e por ter comprovado o bom comportamento carcerário.
      C: domiciliar, para que ela cuide da filha de 10 (dez) anos de idade, em observância ao Estatuto da Primeira Infância e por ser medida de caráter humanitário.
      D: aberto, em razão de a penitente já ter cumprido 1/8 (um oitavo) da pena estabelecido na Lei de Execução Penal e comprovado o bom comportamento carcerário, somado ao fato de ser a única responsável pela filha menor de 10 (dez) anos de idade.
    correta: A
    dispositivos: []
    revisao:
      status: rascunho
