  - n: 60
    disciplina: penal
    enunciado: Patrício e Luiz estavam em um bar, quando o primeiro, mediante ameaça de arma de fogo, obriga o último a beber dois copos de tequila. Luiz ficou inteiramente embriagado. A dupla, então, deixou o local, sendo que Patrício conduzia Luiz, que caminhava com muitas dificuldades. Ao encontrarem Juliana, que caminhava sozinha pela calçada, Patrício e Luiz, se utilizando da arma que era portada pelo primeiro, constrangeram-na a com eles praticar sexo oral, sendo flagrados por populares que passavam ocasionalmente pelo local, ocorrendo a prisão em flagrante. Denunciados pelo crime de estupro, no curso da instrução, mediante perícia, restou constatado que Patrício era possuidor de doença mental grave e que, quando da prática do fato, era inteiramente incapaz de entender o caráter ilícito do seu comportamento, situação, aliás, que permanece até o momento do julgamento. Também ficou demonstrado que, no momento do crime, Luiz estava completamente embriagado. O Ministério Público requereu a condenação dos acusados. Não havendo dúvida com relação ao injusto, tecnicamente, a defesa técnica dos acusados deverá requerer, nas alegações finais,
    alternativas:
      A: a absolvição dos acusados por força da inimputabilidade, aplicando, porém, medida de segurança para ambos.
      B: a absolvição de Luiz por ausência de culpabilidade em razão da embriaguez culposa e a absolvição imprópria de Patrício, com aplicação, para este, de medida de segurança.
      C: a absolvição de Luiz por ausência de culpabilidade em razão da embriaguez completa decorrente de força maior e a absolvição imprópria de Patrício, com aplicação, para este, de medida de segurança.
      D: a absolvição imprópria de Patrício, com a aplicação de medida de segurança, e a condenação de Luiz na pena mínima, porque a embriaguez nunca exclui a culpabilidade.
    correta: C
    dispositivos: []
    revisao:
      status: revisado
      notas: "Corrigido conforme o caderno (PDF): palavras faltando no enunciado e na alternativa B."
  - n: 61
    disciplina: penal
    enunciado: Felipe, menor de 21 anos de idade e reincidente, no dia 10 de abril de 2009, foi preso em flagrante pela prática do crime de roubo. Foi solto no curso da instrução e acabou condenado em 08 de julho de 2010, nos termos do pedido inicial, ficando a pena acomodada em 04 anos de reclusão em regime fechado e multa de 10 dias, certo que houve a compensação da agravante da reincidência com a atenuante da menoridade. A decisão transitou em julgado para ambas as partes em 20 de julho de 2010. Foi expedido mandado de prisão e Felipe nunca veio a ser preso. Considerando a questão fática, assinale a afirmativa correta.
    alternativas:
      A: A extinção da punibilidade pela prescrição da pretensão executória ocorrerá em 20 de julho de 2016.
      B: A extinção da punibilidade pela prescrição da pretensão executória ocorreu em 20 de julho de 2014.
      C: A extinção da punibilidade pela prescrição da pretensão executória ocorrerá em 20 de julho de 2022.
      D: A extinção da punibilidade pela prescrição da pretensão executória ocorrerá em 20 de novembro de 2015.
    correta: D
    dispositivos: []
    revisao:
      status: revisado
      notas: "Corrigido conforme o caderno (PDF): texto das questões 60 e 61 removido da alternativa D."
  - n: 62
    disciplina: penal
    enunciado: Carlos e seu filho de dez anos caminhavam por uma rua com pouco movimento e bastante escura, já de madrugada, quando são surpreendidos com a vinda de um cão pitbull na direção deles. Quando o animal iniciou o ataque contra a criança, Carlos, que estava armado e tinha autorização para assim se encontrar, efetuou um disparo na direção do cão, que não foi atingido, ricocheteando a bala em uma pedra e acabando por atingir o dono do animal, Leandro, que chegava correndo em sua busca, pois notou que ele fugira clandestinamente da casa. A vítima atingida veio a falecer, ficando constatado que Carlos não teria outro modo de agir para evitar o ataque do cão contra o seu filho, não sendo sua conduta tachada de descuidada. Diante desse quadro, assinale a opção que apresenta a situação jurídica de Carlos.
    alternativas:
      A: Carlos atuou em legítima defesa de seu filho, devendo responder, porém, pela morte de Leandro.
      B: Carlos atuou em estado de necessidade defensivo, devendo responder, porém, pela morte de Leandro.
      C: Carlos atuou em estado de necessidade e não deve responder pela morte de Leandro.
      D: Carlos atuou em estado de necessidade putativo, razão pela qual não deve responder pela morte de Leandro.
    correta: C
    dispositivos: []
    revisao:
      status: revisado
      notas: "Corrigido conforme o caderno (PDF): palavras faltando no enunciado e na alternativa C."
  - n: 63
    disciplina: penal
    enunciado: Moura, maior de 70 anos, primário e de bons antecedentes, mediante grave ameaça, subtraiu o relógio da vítima Lúcia, avaliado em R$ 550,00 (quinhentos e cinquenta reais). Cerca de 45 minutos após a subtração, Moura foi procurado e localizado pelos policiais que foram avisados do ocorrido, sendo a coisa subtraída recuperada, não sofrendo a vítima qualquer prejuízo patrimonial. O fato foi confessado e Moura foi condenado pela prática do crime de roubo simples, ficando a pena acomodada em 04 anos de reclusão em regime aberto e multa de 10 dias. Procurado pela família do acusado, você, como advogado poderá apelar, buscando
    alternativas:
      A: o reconhecimento da forma tentada do roubo.
      B: a aplicação do sursis da pena.
      C: o reconhecimento da atipicidade comportamental por força da insignificância.
      D: a redução da pena abaixo do mínimo legal, em razão das atenuantes da confissão espontânea e da senilidade.
    correta: B
    dispositivos: []
