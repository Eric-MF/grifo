  - n: 60
    disciplina: penal
    enunciado: Patrício e Luiz estavam em um bar, quando o primeiro, mediante ameaça de arma de fogo, obriga o último a beber dois copos de tequila. Luiz ficou inteiramente embriagado. A dupla, então, deixou o local, sendo que Patrício conduzia Luiz, que caminhava com muitas dificuldades. Ao encontrarem Juliana, que caminhava sozinha pela calçada, Patrício e Luiz, se utilizando da arma que era portada pelo primeiro, constrangeram-na a com eles praticar sexo oral, sendo flagrados por populares que passavam ocasionalmente pelo local, ocorrendo a prisão em flagrante. Denunciados pelo crime de estupro, no curso da instrução, mediante perícia, restou constatado que Patrício era possuidor de doença mental grave e que, quando da prática do fato, era inteiramente incapaz de entender o caráter ilícito do seu comportamento, situação, aliás, que perma momento do julgamento. Também ficou demonstrado que, no momento do crime, Luiz estava completamente embriagado. O Ministério Público requereu a condenação dos acusados. Não havendo dúvida com relação ao injusto, tecnicamente, a defesa técnica dos acusados deverá requerer, nas alegações finais,
    alternativas:
      A: a absolvição dos acusados por força da inimputabilidade, aplicando, porém, medida de segurança para ambos.
      B: a absolvição de Luiz por ausência de culpabilidade em razão da embriaguez culposa e a absolvição Patrício, com aplicação, para este, de medida de segurança.
      C: a absolvição de Luiz por ausência de culpabilidade em razão da embriaguez completa decorrente de força maior e a absolvição imprópria de Patrício, com aplicação, para este, de medida de segurança.
      D: a absolvição imprópria de Patrício, com a aplicação de medida de segurança, e a condenação de Luiz na pena mínima, porque a embriaguez nunca exclui a culpabilidade.
    correta: C
