  - n: 64
    disciplina: penal
    enunciado: Paloma, sob o efeito do estado puerperal, logo após o parto, durante a madrugada, vai até o berçário onde acredita encontrar-se seu filho recém-nascido e o sufoca até a morte, retornando ao local de origem sem ser notada. No dia seguinte, foi descoberta a morte da criança e, pelo circuito interno do hospital, é verificado que Paloma foi a autora do crime. Todavia, constatou-se que a criança morta não era o seu filho, que se encontrava no berçário ao lado, tendo ela se equivocado quanto à vítima desejada. Diante desse quadro, Paloma deverá responder pelo crime de
    alternativas:
