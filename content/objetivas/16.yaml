  - n: 59
    disciplina: penal
    enunciado: Maria Joaquina, empregada doméstica de uma residência, profundamente apaixonada pelo vizinho Fernando, sem que este soubesse, escuta sua conversa com uma terceira pessoa acordando o furto da casa em que ela trabalha durante os dias de semana à tarde. Para facilitar o sucesso da operação de seu amado, ela deixa a porta aberta ao sair do trabalho. Durante a empreitada criminosa, sem saber que a porta da frente se encontrava destrancada, Fernando e seu comparsa arrombam a porta dos fundos, ingressam na residência e subtraem diversos objetos. Diante desse quadro fático, assinale a opção que apresenta a correta responsabilidade penal de Maria Joaquina.
    alternativas:
      A: Deverá responder pelo mesmo crime de Fernando, na qualidade de partícipe, eis que contribuiu de alguma forma para o sucesso da empreitada criminosa ao não denunciar o plano.
      B: Deverá responder pelo crime de furto qualificado pelo concurso de agentes, afastada a qualificadora do rompimento de obstáculo, por esta não se encontrar na linha de seu conhecimento.
      C: Não deverá responder por qualquer infração penal, sendo a sua participação irrelevante para o sucesso da empreitada criminosa.
      D: Deverá responder pelo crime de omissão de socorro.
    correta: C
