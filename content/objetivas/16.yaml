    enunciado: Melinda Cunha foi denunciada pela prática do crime de bigamia. Ocorre que existe ação em curso no juízo cível onde se discute a validade do primeiro casamento celebrado pela denunciada. Entendendo o magistrado penal que a existência da infração penal depende da solução da controvérsia no juízo cível e que esta é séria e fundada, estaremos diante de
    alternativas:
