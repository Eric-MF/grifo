    disciplina: penal
    enunciado: Antônio, de 49 anos, manteve numerosas relações sexuais consensuais com Miriam, à época com 13 anos, que tinha experiência sexual anterior, durante o namoro entre eles. Antônio tinha conhecimento da idade de Miriam. Sobre o caso, assinale a afirmativa correta.
