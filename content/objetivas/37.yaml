  - n: 64
    disciplina: processo-penal
    enunciado: No dia 10 de julho de 2020, Pedro, primário, é preso em flagrante delito comercializando ecstasy em uma rua do bairro onde mora. Com ele, são apreendidos 50 comprimidos e dinheiro em espécie. Assim, é imediatamente conduzido à delegacia, onde, no mesmo dia, é lavrado auto de prisão em flagrante pela prática do crime descrito no Art. 33, caput, da Lei nº 11.343/06, punido com pena de reclusão de 5 a 15 anos e multa. O laudo toxicológico provisório atesta que a substância consta da lista de substâncias proscritas. Feitas as comunicações devidas, o auto de prisão é remetido ao juízo competente e, desse modo, no dia 11 de julho, passadas 23 horas da prisão, Pedro é apresentado à autoridade judicial. A audiência é realizada sem a presença de órgão do Ministério Público e após entrevistar o preso e ouvir os requerimentos da defesa técnica, o Magistrado homologa a prisão em flagrante, que é convertida em preventiva, sob o fundamento de que existe risco à ordem pública na liberdade do agente, nos termos do Art. 312 do Código de Processo Penal. Assinale a opção que indica a tese de Direito Processual Penal adequada para se questionar a prisão preventiva de Pedro.
    alternativas:
      A: A prisão deve ser relaxada em razão da inobservância do prazo para a realização da audiência de custódia.
      B: A prisão deve ser substituída por medidas cautelares diversas da prisão, já que suficientes para garantia da ordem pública e conveniência da instrução criminal.
      C: A prisão deve ser relaxada, ante a ausência de pedido do Ministério Público, e concedida prisão domiciliar ao acusado para garantia da ordem pública.
      D: A prisão deve ser relaxada, pois o magistrado não poderia, diante da ausência de pedido do Parquet, ter convertido a prisão em flagrante em preventiva de ofício. PROVA APLICADA EM 26/2/2023 19
    correta: D
    dispositivos:
      - art. 33, lei 11343
      - art. 312, cpp
    revisao:
      status: revisado
  - n: 65
    disciplina: processo-penal
    enunciado: Leonardo praticou um crime que, objetivamente, admitia o acordo de não persecução penal (ANPP). Concluída a investigação criminal, e estando presente a justa causa, o Promotor de Justiça se recusou a fazer a proposta de ANPP, por entender que estava demonstrado que a conduta de Leonardo era habitual. Diante da recusa do Promotor de Justiça em propor o ANPP, o Juiz da Comarca de Cascais, acolhendo o requerimento do advogado de Leonardo, remeteu o investigatório ao Ministério Público para se manifestar sobre o tema. O MP apresentou ao Juiz da Vara Criminal da Comarca de Cascais uma proposta de ANPP para ser homologada. O juiz considerou insuficiente a condição de Leonardo pagar como prestação pecuniária a quantia correspondente a 02 (dois) saláriosmínimos a uma entidade pública, a ser indicada pelo juízo da execução, devolvendo os autos ao MP para reformular a proposta nesta parte. O MP manteve a proposta nos termos acordados com Leonardo, razão pela qual o Juiz da Vara Criminal de Cascais recusou-se a homologá-la. Sobre a decisão de não homologação da proposta de ANPP, assinale a opção que indica qual o recurso cabível e quem poderá interpô-lo.
    alternativas:
      A: Recurso de agravo previsto na Lei de Execução Penal, haja vista que a prestação pecuniária era destinada a uma entidade pública a ser indicada pelo juízo da execução. O legitimado para interpor esse recurso é Leonardo, haja vista que contra o mesmo seria cobrada a prestação pecuniária junto ao juízo da execução.
      B: Recurso em sentido estrito, considerando se tratar de um ato judicial de natureza declaratória. Estavam legitimados a recorrer o Ministério Público e Leonardo, por terem, ambos, interesse recursal.
      C: Recurso de apelação (residual), por se tratar de uma decisão definitiva. Somente estava legitimado a recorrer o Ministério Público, por ser o autor da proposta, ainda que a ela tenha aderido Leonardo.
      D: Recurso de apelação (residual), por se tratar de uma decisão com força de definitiva, e dela poderia recorrer o Promotor de Justiça com atribuição e Leonardo, por terem, ambos, interesse recursal.
    correta: B
    peca: rese
