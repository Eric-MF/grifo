  - n: 59
    disciplina: penal
    enunciado: Quinho foi preso em flagrante delito portando 1 quilo de cocaína, ao tentar embarcar em ônibus na rodoviária Novo Rio (no Rio de Janeiro/RJ) que seguiria em direção a São Paulo/SP, onde Quinho pretendia vender tal substância para um comprador local. Ao ser denunciado por tráfico de drogas interestadual (Art. 33 c/c. Art. 40, inciso V, ambos da Lei nº. 11.343/2006), a defesa técnica de Quinho alegou que a hipótese seria de tráfico de drogas simples, pois, em razão da prisão em flagrante delito, o acusado jamais conseguiu efetivamente transpor a fronteira entre os Estados do Rio de Janeiro/RJ e São Paulo/SP. Sobre a incidência da majorante prevista no Art. 40, inciso V, da Lei nº 11.343/2006, assinale a afirmativa correta.
    alternativas:
      A: São imprescindíveis a inequívoca intenção de realizar o tráfico interestadual e a efetiva transposição de fronteiras.
      B: São desnecessárias a inequívoca intenção de realizar o tráfico interestadual e a efetiva transposição de fronteiras.
      C: Basta a inequívoca intenção de realizar o tráfico interestadual, sendo desnecessária a efetiva transposição de fronteiras.
      D: Basta a efetiva transposição de fronteiras, sendo desnecessária a inequívoca intenção de realizar o tráfico interestadual.
    correta: C
    dispositivos:
      - art. 33, lei 11343
      - art. 40, V, lei 11343
    revisao:
      status: revisado
