  - n: 61
    disciplina: penal
    enunciado: Eduardo trabalha como porteiro do condomínio, e possui um primo, de nome Ygor, envolvido em vários crimes. A semelhança entre ambos sempre foi notória. Certa noite, após Eduardo se ausentar da portaria para colocar as lixeiras do prédio na rua, Ygor, aproveitando-se dos traços físicos muito parecidos com os do seu primo, também vestido com um uniforme idêntico, ingressa no edifício e subtrai vários pacotes endereçados aos moradores. Alguns moradores viram a movimentação, mas pensaram que se tratava de Eduardo arrumando e conferindo os pacotes. Baseando-se no caso hipotético, Ygor cometeu
    alternativas:
      A: furto qualificado mediante fraude.
      B: estelionato.
      C: falsa identidade.
      D: furto qualificado por abuso de confiança. PROVA APLICADA EM 26/2/2023 18
