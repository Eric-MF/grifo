    disciplina: processo-penal
    enunciado: Antônio Silva foi denunciado pelo Ministério Público do Estado do Rio de Janeiro pelo crime de tráfico de drogas. Essa denúncia foi rejeitada pelo juízo da 50ª Vara Criminal da Comarca do Rio de Janeiro, por falta de prova mínima da autoria e materialidade (justa causa). O órgão ministerial então interpôs recurso em sentido estrito dessa decisão, já arrazoado. Para evitar a caracterização de uma nulidade processual, é correto afirmar que o juízo deve, em seguida,
    alternativas:
