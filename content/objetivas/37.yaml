      status: revisado
  - n: 67
    disciplina: processo-penal
    enunciado: Gregório é defensor público no Estado do Rio de Janeiro, cuja Constituição lhe assegura foro por prerrogativa de função no Tribunal de Justiça local. Durante o carnaval, na cidade de Salvador/BA, Gregório por acaso se encontra com seu irmão e inimigo capital Sandro em uma rua erma, durante a dispersão de bloco carnavalesco. Gregório então se aproveita da oportunidade para matar Sandro com golpes de espada. Assinale a opção que indica o foro competente para conhecer e julgar esse crime.
    alternativas:
      A: O Tribunal do Júri da Comarca de Salvador/BA.
      B: O Tribunal de Justiça do Estado da Bahia.
      C: O Tribunal do Júri da Comarca do Rio de Janeiro/RJ.
      D: O Tribunal de Justiça do Estado do Rio de Janeiro. PROVA APLICADA EM 26/2/2023 20
    correta: A
