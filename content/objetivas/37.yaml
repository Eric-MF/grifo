  - n: 62
    disciplina: penal
    enunciado: Fernanda trabalha como cuidadora de idosos e foi contratada para assistir ao idoso Luís Fernando, de 89 anos, que, não obstante a idade, seguia ativo, caminhando com algum apoio e realizando suas atividades de forma habitual, com relativa independência. Certo dia, Luís Fernando descia as escadas rolantes de um shoppingcenter, quando a barra de sua calça se prendeu nos degraus, o que levou Luís Fernando a se desequilibrar, e o suporte dado por Fernanda não foi suficiente para impedir a sua queda. O idoso fraturou o fêmur. Preocupada com eventual responsabilização criminal, Fernanda procura aconselhamento. Como advogado(a) de Fernanda, assinale a opção que apresenta sua orientação sobre os fatos e as possíveis consequências.
    alternativas:
      A: Fernanda ocupa a posição de garantidora, devendo ser responsabilizada por delito comissivo por omissão por ter se operado o resultado danoso.
      B: A responsabilização de Fernanda dependeria de comprovação de efetiva negligência, imprudência ou imperícia, sem o que, não será responsabilizada pelo resultado danoso.
      C: Fernanda pode ser responsabilizada por crime omissivo próprio, diante do resultado danoso.
      D: Fernanda incidiu em conduta tipificada no Estatuto do Idoso.
    correta: B
    dispositivos: []
